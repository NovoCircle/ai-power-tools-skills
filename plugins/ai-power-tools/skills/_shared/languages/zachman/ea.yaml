version_note: 'EA''s technology follows the pre-3.0 form: row names Planner, Owner, Designer, Builder, Subcontractor and a sixth row Functioning
  Enterprise; columns Data, Function, Location, People, Time, Motivation. The Zachman Framework 3.0 (2011) renamed columns and rows;
  nothing here describes 3.0.'
cell_recording:
  cell: a package whose stereotype is ZFCell (stored in t_object.Stereotype of the package's own t_object row, Object_Type Package; FQName ZF::ZFCell)
  row: the parent package of the cell package (t_package.Parent_ID), an unstereotyped package named Planner, Owner, Designer, Builder, Subcontractor
    or Functioning Enterprise; the grid diagram shows it as '(from Owner)'
  column: not stored. It is implied by the cell package's name and by the type of the cell diagram (ZF Owner::OwnerData is the owner row, data
    column)
  elements_in_a_cell: an element sits in the cell by t_object.Package_ID; t_object.ParentID stays 0
  tagged_values_on_a_cell: 'none: a package with ZFCell has no t_objectproperties rows'
  tagged_values_on_an_element: 'none names a row, column or cell (146 tag rows read on the 44 element stereotypes: ID, Description, address and
    contact fields, goal and strategy measures, rule fields)'
  readable_by_the_ruleset_grammar: 'yes, since the engine of 2026-10-21: contained_in reads the chain of containers an element sits in (cell
    package, then row package) by stereotype or name, and contains_count bounds a package''s direct children. The column is read from the cell''s name. zachman_rules.yaml
    holds seven rules. Not read: the diagrams an element is shown on'
