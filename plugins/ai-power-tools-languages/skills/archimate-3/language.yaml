constraints:
- id: ARCHIMATE-REL-001
  statement: Every relationship has exactly one source and one target. Each may be an element, a relationship or a junction.
  strength: must
  section: '5'
- id: ARCHIMATE-REL-002
  statement: No relationship may join two relationships.
  strength: must
  section: 5; B.6
- id: ARCHIMATE-REL-003
  statement: A relationship between two elements is allowed only if the allowed-relationship table lists its type for that source and target pair. A pair outside the table is an error. A pair inside the table is permitted, never evidence that the relationship is correct, because the table includes derivations the standard says may be wrong in a given model.
  strength: must
  section: 5.7; 1.3; B.3; B.5
- id: ARCHIMATE-REL-004
  statement: Association is always allowed between any two elements, and between any element and a relationship.
  strength: must
  section: 5; 5.2.4
- id: ARCHIMATE-REL-005
  statement: Composition, aggregation and specialization are always allowed between two elements of the same type.
  strength: must
  section: 5; 5.1.1; 5.1.2; 5.4.1
- id: ARCHIMATE-REL-006
  statement: A relationship that joins an element to another relationship can only be aggregation, composition or association. Aggregation or composition into a relationship is allowed only from a composite element (grouping, location or plateau); every other element may only associate with it.
  strength: must
  section: 5; B.6
- id: ARCHIMATE-REL-007
  statement: Within a layer, composition and aggregation are permitted among processes, functions and interactions, so a process can be composed of other processes, functions and interactions.
  strength: must
  section: '4.2'
- id: ARCHIMATE-REL-008
  statement: The source of a structural relationship is always an element. For assignment and realization the source may also be a junction. The target may in some cases be a relationship or a junction.
  strength: must
  section: '5.1'
- id: ARCHIMATE-REL-009
  statement: Assignment is allowed only where the relationship table gives it. In the table it chiefly joins active structure to behavior and active structure to active structure (for example an actor to a role), and technology and physical active structure to artifacts and materials (deployment and storage); it has no assignment from behavior to passive structure. The prose of 5.1.3 describes the direction more loosely; where the two disagree the table governs.
  strength: must
  section: 5.1.3; B.5
- id: ARCHIMATE-REL-010
  statement: 'Access is read at the metamodel level from the active structure or behavior element to the passive structure element, whatever the arrowhead shows. The target of access is a passive structure element: in the table, Artifact, Business Object, Contract, Data Object, Deliverable, Material, Representation, or a Grouping.'
  strength: must
  section: 5.2.2; B.4; B.5
- id: ARCHIMATE-REL-011
  statement: Use realization for a critical contribution and influence for a non-critical one.
  strength: should
  section: 5.1.4; 5.2.3
- id: ARCHIMATE-REL-012
  statement: Give a name or label to any relationship that would otherwise be ambiguous.
  strength: should
  section: '5'
- id: ARCHIMATE-REL-013
  statement: The sign and strength of an influence relationship are left to the modeler; the default is a contribution of unspecified sign and strength.
  strength: note
  section: 5.2.3
- id: ARCHIMATE-REL-014
  statement: 'Structural relationships and triggering apply to the unmodeled parts of the source: a relationship from a part also applies to the whole. Dependency and flow relationships relate a part of the target to a part of the source, so a high-level dependency does not imply the same dependency for every part.'
  strength: note
  section: 5.1.5; 5.2.5; 5.3.3
- id: ARCHIMATE-JCT-001
  statement: All relationships joined to one junction are of the same type.
  strength: must
  section: 5; 5.5.1
- id: ARCHIMATE-JCT-002
  statement: A junction can be used with access, assignment, flow, influence, association, realization, triggering and serving. It cannot be used with composition, aggregation or specialization.
  strength: must
  section: 5.5.1; B.6
- id: ARCHIMATE-JCT-003
  statement: A chain of same-type relationships through junctions is valid only if a direct relationship of that type between the two end elements would be valid.
  strength: must
  section: 5; 5.5.1
- id: ARCHIMATE-JCT-004
  statement: A junction may have several incoming and one outgoing relationship, one incoming and several outgoing, or several of both. Arrowheads into a junction may be omitted. An or junction covers both inclusive and exclusive or. A junction has no formal execution semantics.
  strength: note
  section: 5.5.1
- id: ARCHIMATE-DER-001
  statement: Derivation goes from more detail to less detail. It cannot add detail. A derived relationship is valid but is not drawn in the metamodel figures.
  strength: note
  section: '5.7'
- id: ARCHIMATE-DER-002
  statement: A modeler may draw a relationship that is a valid derivation without modeling the relationships it was derived from.
  strength: note
  section: '5.7'
- id: ARCHIMATE-DER-003
  statement: The relationships a derivation starts from must themselves be allowed by the table. Derivation does not apply to relationships that involve a grouping. Between core elements and motivation, strategy or implementation and migration elements, only realization and influence can be derived.
  strength: must
  section: B.1
- id: ARCHIMATE-DER-004
  statement: Across domains, derivation is limited. From implementation and migration, core or strategy elements to a motivation element only realization or influence can be derived, and nothing the other way. From core or implementation and migration elements to a strategy element only realization, and nothing the other way. From an implementation and migration element to a core element only realization, and nothing the other way. Nothing is derivable between two domains through an intermediary in a third.
  strength: must
  section: B.4
- id: ARCHIMATE-DER-005
  statement: Access from a to b can be derived only if b is a passive structure element. For a passive structure target only access or assignment can be derived; from a passive structure source only realization or influence.
  strength: must
  section: B.4
- id: ARCHIMATE-DER-006
  statement: Relationships allowed from a concept to itself are also allowed among that concept, its specializations, and sibling specializations (for example a node and a facility).
  strength: must
  section: B.4
- id: ARCHIMATE-DER-007
  statement: The derivation restrictions apply only to derived relationships. A relationship drawn in a metamodel figure is allowed by definition. Product and plateau can aggregate or compose only the concepts shown in their metamodel fragments.
  strength: must
  section: B.4
- id: ARCHIMATE-DER-008
  statement: Potential derivations (PDR 1 to 11) may be wrong in a given model and must be checked by the modeler before they are used.
  strength: should
  section: B.3
- id: ARCHIMATE-ELM-001
  statement: A collaboration aggregates two or more internal active structure elements. Application and technology collaborations may also aggregate other collaborations of the same kind.
  strength: should
  section: 4.2; 8.2.3; 9.2.2; 10.2.4
- id: ARCHIMATE-ELM-002
  statement: An interaction is collective behavior performed by two or more internal active structure elements, assigned directly or aggregated in a collaboration.
  strength: should
  section: '4.2'
- id: ARCHIMATE-ELM-003
  statement: A business collaboration need not be a permanent organizational unit.
  strength: note
  section: 8.2.3
- id: ARCHIMATE-ELM-004
  statement: The abstract concepts (the generic structure, behavior and passive structure concepts, and the layer-level internal active structure, internal behavior and passive structure concepts) are not instantiated in models. Only their specializations are.
  strength: must
  section: 3.2; 8.1
- id: ARCHIMATE-ELM-005
  statement: A contract is a specialization of a business object.
  strength: must
  section: 8.4.2
- id: ARCHIMATE-ELM-006
  statement: A constraint is a kind of requirement.
  strength: must
  section: 4.4; 6.3.5
- id: ARCHIMATE-ELM-007
  statement: An event may carry a time attribute.
  strength: note
  section: 4.1.2; 13.2.3
- id: ARCHIMATE-ELM-008
  statement: A work package has a clearly defined start and end date. An implementation event is instantaneous.
  strength: note
  section: 13.2.1; 13.2.3
- id: ARCHIMATE-ELM-009
  statement: At the architecture level the language models types, not instances.
  strength: note
  section: '3.6'
- id: ARCHIMATE-CMP-001
  statement: A grouping is joined to each of its members by aggregation or composition. A grouping may also have other relationships with any element that can be the other end, and with another grouping.
  strength: must
  section: 4.5.1; B.6
- id: ARCHIMATE-CMP-002
  statement: A relationship from or to a grouping reads as a collective relationship with the grouping's contents. This is not always expressible as simple derivable relationships.
  strength: note
  section: 4.5.1
- id: ARCHIMATE-CMP-003
  statement: Do not use a grouping where a view is meant; a grouping is a model element, not a view.
  strength: should
  section: 4.5.1
- id: ARCHIMATE-CMP-004
  statement: Show a location with aggregation from the location to the structure elements located there, or to the behavior performed there.
  strength: should
  section: 4.5.2
- id: ARCHIMATE-CMP-005
  statement: A product aggregates or composes services and passive structure elements across layers, and only the concepts shown in its metamodel fragment.
  strength: must
  section: 8.5.1; B.4
- id: ARCHIMATE-CMP-006
  statement: A plateau may aggregate or compose any core concept and may realize part of the architecture.
  strength: note
  section: '13.4'
- id: ARCHIMATE-CMP-007
  statement: A gap is associated with two plateaus and with the core concepts that exist in only one of them.
  strength: should
  section: 13.2.5; 13.4
- id: ARCHIMATE-CRS-001
  statement: A requirement (and, by derivation, a principle, outcome or goal) can be related to structure or behavior elements by realization. Influence is allowed as the weaker relationship.
  strength: must
  section: '6.6'
- id: ARCHIMATE-CRS-002
  statement: 'Strategy elements: internal and external behavior elements realize capabilities and value streams; structure elements realize resources; capabilities, value streams, courses of action and resources may realize or influence requirements; a course of action may realize or influence an outcome.'
  strength: must
  section: '7.6'
- id: ARCHIMATE-CRS-003
  statement: Cross-layer relationships are typically serving (for example application service to business behavior, application interface to business role) and realization (for example data object or technology object to business object, artifact to application component). These are typical examples, not the only permitted ones; the table governs.
  strength: note
  section: 12.1; 12.2
- id: ARCHIMATE-CRS-004
  statement: Business internal active structure elements may be assigned to a stakeholder or to a work package. A deliverable may realize core concepts. Meaning and value can be associated with any concept.
  strength: note
  section: 6.4.1; 6.4.2; 6.6; 13.4
- id: ARCHIMATE-NAM-001
  statement: Name stakeholders, drivers, resources, equipment, facilities, materials and the objects of each layer (business objects, data objects, technology objects) with nouns.
  strength: should
  section: 6.2.1; 6.2.2; 7.2.1; 8.4.1; 9.4.1; 10.4; 11.2
- id: ARCHIMATE-NAM-002
  statement: Name an assessment with a noun or a very short sentence, a meaning with a noun or noun phrase, and express a functional value as an action or a state.
  strength: should
  section: 6.2.3; 6.4.1; 6.4.2
- id: ARCHIMATE-NAM-003
  statement: Name a capability with a compound noun or gerund ("what we do") and a value stream with a verb-noun phrase in the active.
  strength: should
  section: 7.3.1; 7.3.2
- id: ARCHIMATE-NAM-004
  statement: Name an outcome so that it identifies an end result at a definite future point, an implementation event with a verb in the perfect tense, and a facility with a noun that names its type.
  strength: should
  section: 6.3.2; 13.2.3; 11.2.2
- id: ARCHIMATE-LNG-001
  statement: A conforming tool supports the language structure, generic metamodel, relationships, layers and cross-layer dependencies (chapters 3 to 13), the standard iconography, the viewpoint mechanism, the customization mechanisms and Appendix B. It may support the Appendix C viewpoints. This rule is about tools, not about models.
  strength: note
  section: '1.3'
- id: ARCHIMATE-LNG-002
  statement: Prefer the standard iconography wherever possible, so that any ArchiMate reader can read any diagram.
  strength: should
  section: '3.7'
- id: ARCHIMATE-LNG-003
  statement: Colors carry no formal meaning. The layer colors, the layer letters (M, S, B, A, T, P, I) and the corner-shape conventions are notational cues.
  strength: note
  section: '3.9'
- id: ARCHIMATE-LNG-004
  statement: Nesting one element in another may express some structural relationships, but it is ambiguous when several relationships are allowed between the two elements.
  strength: note
  section: 3.8; 5.1
- id: ARCHIMATE-LNG-005
  statement: A specialized concept inherits the allowed relationships of its parent and keeps its parent's definition. Relationships may be specialized too.
  strength: must
  section: '15.2'
- id: ARCHIMATE-LNG-006
  statement: 'Deprecated or removed constructs: "used by" (renamed serving), the two-ended black-ball notation for assignment, and the required-interface notation (abolished in 3.0). Do not use them in new models.'
  strength: should
  section: 5.2.1; 5.1.3; E.1
- id: ARCHIMATE-LNG-007
  statement: 'The standard defines no mandatory attributes. Attributes and profiles are optional and are the customization mechanism of chapter 15. The exchange schema adds three optional properties: an access type on access, a modifier on influence and a directed flag on association.'
  strength: note
  section: 15; 15.1
- id: ARCHIMATE-VPT-001
  statement: 'A viewpoint is created by selecting the subset of metamodel concepts (elements and relationships) needed for its concerns, then defining a representation: a diagram, a catalog, a matrix or another visualization. A view need not be visual.'
  strength: note
  section: '14.4'
- id: ARCHIMATE-VPT-002
  statement: In every viewpoint, in addition to the elements it specifies, a grouping, a junction and an or junction may be used.
  strength: note
  section: C
- id: ARCHIMATE-VPT-003
  statement: The example viewpoints of Appendix C are not a normative or exhaustive list. A conforming tool may support them.
  strength: note
  section: C.1; 1.3
notes: Version 3.1. ArchiMate 3.2 (published 19 October 2022) adds no element or relationship type; it changes the node subtypes (device, system software, facility and equipment become subtypes of a technology internal active structure element and gain composition and aggregation with node), adds a few relationship cells and a derivation restriction section, and rewords some definitions. This guide does not describe 3.2. The standard defines no mandatory attributes. Multiplicity does not exist for ArchiMate relationships.
data_types:
  coverage: none
  note: "The specification names no data types and gives no concept a defined attribute; it only says that any concept may carry attributes added through a profile of typed attributes."
  attributes:
    coverage: none
    mechanism: {section: '15.1', note: 'A profile is a set of typed attributes, each with an optional default, that a user attaches to elements or relationships. The specification gives no list of types and no standard profile. The text mentions two optional pieces of information without typing them: a time attribute on events (4.1.2, 13.2.3) and the sign and strength of an influence relationship (5.2.3). The separate exchange file format adds an access type, an influence modifier and a directed flag; it is cited in standard.reference and is not part of this specification.'}
notation:
  coverage: informative
  section: A
  note: "The standard gives one default iconography (Appendix A, informative): a box with a small icon in the upper right corner, or the icon alone, for each concept, and a defined line for each relationship. A conforming tool has to support it (1.3), and a modeler may draw another way (3.7)."
  default_form: {shape: 'box with a small icon in the upper right corner; in several cases the icon alone may be used instead', section: '3.7'}
  nesting: {note: 'Some structural relationships, and access, may be shown by placing one element inside another instead of drawing a line.', section: '3.8; 5.1'}
  colors: {normative: false, section: '3.9', note: 'Color has no formal meaning and is left to the modeler. As a convention the standard uses yellow for the business layer, blue for the application layer and green for the technology layer in its examples, and treats layer letters and corner shapes as cues only.'}
  extension: {shape: 'a specialized concept keeps the look of its parent and may add an icon or other mark, or show its name in angle brackets', section: '15.2'}
  elements:
