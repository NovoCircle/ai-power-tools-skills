    NoLongerUsedMilestone: {shape: "rectangle with the keyword above the underlined name and one compartment per slot below it", marker: "none", label: "each slot name in bold with its value under it (endDate, resource, usedBy or noLongerUsedBy, themeValues)", section: "Annex D, Figures D.42, D.43"}
