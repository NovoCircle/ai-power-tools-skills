      attributes: [{name: ordering, type: AdHocOrdering}, {name: completionCondition, type: Expression}, {name: cancelRemainingInstances, type: boolean}]
    Task: {display: Task, category: Activities, specializes: Activity, drawn_as: Rounded rectangle, section: 10.3.3}
    BusinessRuleTask: {display: Business Rule Task, category: Activities, specializes: Task, section: 10.3.3.1}
    CallActivity: {display: Call Activity, category: Activities, specializes: Activity, section: 10.3.6}
    ComplexBehaviorDefinition: {display: Complex Behavior Definition, category: Activities, specializes: BaseElement, section: 10.3.8}
    GlobalTask: {display: Global Task, category: Activities, specializes: CallableElement, section: 10.3.7}
    GlobalBusinessRuleTask: {display: Global Business Rule Task, category: Activities, specializes: GlobalTask, section: 10.3.7}
    GlobalManualTask: {display: Global Manual Task, category: Activities, specializes: GlobalTask, section: 10.3.7}
    GlobalScriptTask: {display: Global Script Task, category: Activities, specializes: GlobalTask, section: 10.3.7}
    GlobalUserTask: {display: Global User Task, category: Activities, specializes: GlobalTask, section: 10.3.7}
