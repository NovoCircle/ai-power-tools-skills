    channels:
      fill: 'The phase circle''s own paint. Each ADM phase is drawn by its stereotype''s shape script
        as a gradient-filled circle, and 10 of 10 elements carry no fill override at all: `Backcolor`
        is -1 and no `BCol` appears in `ObjectStyle`: so EA paints every one of them. The corpus row records
        no color encoding either: the gradient is decoration, not a variable. Whether a written fill would
        be honored was not tested, which is a second reason not to offer it.'
      claimed:
        position: 'The bearing on the ring IS the phase, and the ADM is a cycle: moving Phase C to Phase
          F''s bearing says the architecture work happens in a different order. Measured as eight spokes
          at 45-degree intervals around the Requirements Management hub.'
        size: Hub against spoke. The one 146x147 element is the hub of the cycle and the eight 114x116
          ones are its phases, so resizing an element restates which of the two it is.
        icon: 'The circle is the shape script''s, and 0 of 10 elements carries an alternate image: no
          `ImageID` in `ObjectStyle`. Setting one would replace the phase circle with a picture, which
          is why this is claimed rather than free.'
        line_style: Normative in UML, and all 17 connectors on the measured diagram are Dependencies,
