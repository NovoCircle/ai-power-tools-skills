  - id: BPMN2-ACT-011
    name: A public process is not executable
    implements: BPMN-ACT-011
    description: A public process shows only what other participants see and is never executable. EA marks a process executable
      with the tagged value `isExecutable` on a `BusinessProcess` (values true or false, no default). [OMG BPMN 2.0.2 (formal/13-12-09)
      Table 10.1 p. 146; Table 8.51 p. 97]
    category: activity
    severity: error
    demo_trigger: true
    coverage: partial
    not_checked: The second sentence of the rule (isImmediate on a flow of an executable process) needs the flow's tag.
    selector:
      type: element
      stereotypes:
        any_of:
