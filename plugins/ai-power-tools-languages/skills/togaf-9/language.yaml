# TOGAF 9.1 language file (schema_version 1).
# Written from the standard only (Part IV, content framework and content metamodel). Concept names are the standard's own entity names without spaces.
# Tool-neutral: no tool facts live here. Links marked `inferred`, `specializes_inferred` or `abstract_inferred` are our reading, not a sentence of the standard.
schema_version: 1
id: togaf-9
name: TOGAF content framework and content metamodel
owner: {name: The Open Group, kind: standards-body}
standard: {name: 'TOGAF (The Open Group Architecture Framework), Part IV Architecture Content Framework', version: '9.1', status: published, reference: 'The Open Group, TOGAF Version 9.1 (document G116, December 2011), Part IV chapters 33 to 37 (content framework, content metamodel, architectural artifacts, architecture deliverables, building blocks), online edition https://pubs.opengroup.org/architecture/togaf91-doc/arch/, read from archived copies of its pages. A framework and body of guidance published as an Open Group Standard; the content metamodel is informal (prose, tables, figures) and no machine-readable form was found. Superseded by TOGAF 9.2 (16 April 2018) and the TOGAF Standard 10th Edition (25 April 2022), neither compared.'}
data_types:
  coverage: partial
  section: '34.6'
  note: "The standard names no primitive types (no string, number, date or Boolean); it gives value sets for six attributes and describes every other attribute only in words."
  types:
    - {name: StandardsClass, kind: enumeration, values: [Non-Standard, Proposed Standard, Provisional Standard, Standard, Phasing-Out Standard, Retired Standard], section: '34.6', used_by: "Standards class on Application Component, Business Service, Function, Information System Service, Logical and Physical Application Component, Logical and Physical Data Component, Logical and Physical Technology Component, Platform Service, Process, Service and Technology Component"}
    - {name: LifecycleStatus, kind: enumeration, values: [Proposed, In Development, Live, Phasing Out, Retired], section: '34.6 (Physical Application Component entry)'}
    - {name: PrincipleCategory, kind: enumeration, values: [Guiding Principle, Business Principle, Data Principle, Application Principle, Integration Principle, Technology Principle], section: '34.6 (Principle entry)'}
    - {name: DataEntityCategory, kind: enumeration, values: [Message, Internally Stored Entity], section: '34.6 (Data Entity entry)'}
    - {name: WorkPackageCategory, kind: enumeration, values: [Work Package, Work Stream, Project, Program, Portfolio], section: '34.6 (Work Package entry)'}
    - {name: LocationCategory, kind: enumeration, values: [Region, Country, Building, Specific Location], open: true, section: '34.6 (Location entry)', note: The standard says the nature of the business may add other kinds, so the set is open.}
  attributes:
    coverage: some_concepts
    where: concepts
    section: '34.6'
    note: "The 35 content metamodel entities carry typical attributes; the 20 content framework and architecture description concepts carry none. Six common attributes (ID, Name, Description, Category, Source, Owner) apply to every content metamodel entity and are listed once in concepts.common_attributes. Each entity's own list holds only what it adds. An empty list means the entity adds none: Constraint, Control, Driver, Event, Gap, Goal, Measure, Objective, Product and Service Quality have only the common six, and Assumption has no row at all in the standard's attribute table. The standard gives no type or multiplicity for any attribute. An attribute carries a `type` here only where the standard names its value set. Attributes named as dates (such as Retire date) or counts (such as Headcount) are described as such in words, but the standard names no date or number type. Common Category is a user-definable taxonomy; the Category of a Logical Technology Component, Physical Technology Component and Platform Service comes from the TOGAF Technical Reference Model, which may be extended, so neither has a fixed value set."
notation:
  coverage: none
  section: '35.6; 35.1.1'
  note: "The standard defines no symbols, shapes or line styles for any concept or relationship; it says what kind of artifact each one is (a list, a table or a graphic) and, for a few, names a drawing technique."
  not_specified: all
  not_specified_note: "'all' means all 55 concepts and all 143 relationships: the standard gives none of them a drawing. Every artifact not listed under artifact_drawing has a kind (catalog, matrix or diagram) and no drawing beyond that."
  artifact_forms:
    catalog: {form: a list of building blocks, section: '35.6'}
    matrix: {form: a table that shows the relationships between building blocks of specific types, section: '35.6'}
    diagram: {form: "a graphic that presents building blocks plus their relationships and interconnections; the standard gives no symbols for it", section: '35.6'}
  artifact_drawing:
    Application/Data Matrix: {form: two-dimensional table, axes: Logical Application Component on one axis and Data Entity on the other, section: '35.6.4'}
    Application/Organization Matrix: {form: two-dimensional table, axes: Logical or Physical Application Component on one axis and Organization Unit on the other, section: '35.6.5'}
    Role/Application Matrix: {form: two-dimensional table, axes: Logical Application Component on one axis and Role on the other, section: '35.6.5'}
    Application/Function Matrix: {form: two-dimensional table, axes: Logical Application Component on one axis and Function on the other, section: '35.6.5'}
    Application Interaction Matrix: {form: two-dimensional table, axes: Application Service, Logical Application Component and Physical Application Component on both the rows and the columns, section: '35.6.5'}
    Conceptual Data Diagram: {technique: entity relationship models or simplified UML class diagrams, section: '35.6.4'}
    Process Flow Diagram: {technique: "swim-lanes may show who owns each process step and what realizes it; for example the application that supports a step can be a lane", section: '35.6.3'}
    Functional Decomposition Diagram: {technique: "one page of capabilities; heat-maps may be layered over it to show scope and decisions", section: '35.6.3'}
    Data Security Diagram: {technique: "access of actors to data shown as a matrix between two object types or as a mapping", section: '35.6.4'}
    Platform Decomposition Diagram: {technique: "either product-level detail (such as versions and CPU counts) or an informal overview of the technical environment", section: '35.6.6'}
  example_viewpoint:
    name: Business domains (the standard's worked example, from The Open Group itself)
    technique: "nested boxes: outer boxes are locations, inner boxes are business functions, and nesting means the functions are performed in those locations"
    section: '35.1.1'
  figure_note: "The standard says its own Figure 35-1 (the architecture description concepts) uses UML notation (35.1). That is how the standard illustrates its model; it does not tell a modeler how to draw."
concepts:
  source: 'TOGAF 9.1 Part IV: the 35 content metamodel entities of 34.5, the content-framework terms of 33.1 and 37, and the architecture-description terms of 35.1 and Figure 35-1. 55 concepts in all (35 + 8 + 12). The standard declares none abstract; abstract flags and the parents marked inferred are our reading. Attributes are the "typical attributes" of 34.6 and none is mandatory.'
  groups:
    Content metamodel: {defined_by: 34.5; 34.6, notes: 'The 35 entities. Each carries a module: core or one of six extensions (Figure 34-7).'}
    Content framework: {defined_by: 33.1; 35.6; 37, notes: 'Deliverable, artifact (catalog, matrix, diagram) and building block (architecture, solution).'}
    Architecture description: {defined_by: 35.1; Figure 35-1, notes: 'Stakeholder, concern, view and viewpoint vocabulary adapted from ISO/IEC 42010:2007 and IEEE 1471.'}
  common_attributes:
    applies_to: all content metamodel entities
    status: typical, none mandatory
    section: '34.6'
    attributes:
    - {name: ID, description: Unique identifier of the entity.}
    - {name: Name, description: Brief name.}
    - {name: Description, description: Textual description.}
    - {name: Category, description: User-definable categorization taxonomy for the entity type.}
    - {name: Source, description: Where the information was collected.}
    - {name: Owner, description: Owner of the entity.}
