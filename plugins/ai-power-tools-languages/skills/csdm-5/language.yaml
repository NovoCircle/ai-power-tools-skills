relationship_reference: {authority: 'Figure 16 (p. 48) is the paper''s list of prescribed relationships and references; the paper does not say other relationships are forbidden. A pair absent from this list is a warning (rule CSDM-REL-001), not an error. Prose-stated relationships are marked fact_source: text.', reading: 'Source is the From (parent) end and target the To (child) end of Figure 16. A relationship whose target or source is named a (various) type applies to the types the source states: Service Instance means Application Service and the data, connection, network, operational process and facility service instances. Dynamic CI Group is separate. Infrastructure CI is one concept with a free-text kind. Only generalizations the source states may drive a check; those marked inferred explain and do not check. The relationship type is written Parent descriptor::Child descriptor.', multiplicity: 'Figure 16 draws multiplicity on four references and Figure 7 on two more; every other multiplicity is not-stated, and no count check applies where none is drawn. Keys: targets_per_source is how many target records one source record may link to; sources_per_target the reverse; ''*'' means zero or more.'}
reference_data:
  service_classification_values: [Business Service, Technical Service, Application Service]
  service_classification_note: Attribute on cmdb_ci_service, inherited by every extension. The paper says customers can extend it (p. 10). The text on p. 43 also writes Technical Management Service.
  value_stream_categories: [Customer Engagement, Order Fulfillment, Customer Service, Manufacturing, Procurement Service, Product and Design Engineering, Research, Marketing, Market Information Capture, Product Maintenance, Legal, Digital Product Development, Technology Enablement, Human Resources, Leased and Capital Asset Management, Financial Management]
  sdlc_component_types: [Application, Infrastructure]
  business_process_review_frequency: [Monthly, Quarterly, Semi Annual / Half Yearly, Annually, none]
  location_types: [Region, Country, State/Province, City, Site, Building/Structure, Floor, Room]
  team_group_types: [Change Group, Managed by Group, Support Group]
  relationship_types: ['Provided by::Provides', 'Uses::Used by', 'Consumes::Consumed by', 'Contains::Contained by', 'Depends on::Used by', 'Connected by::Connects', 'Receives data from::Sends data to', 'Runs on::Runs', 'Operationalizes::Operationalized by']
  relationship_kinds: {cmdb-relationship: 'A relationship record between two CIs, with a relationship type written Parent descriptor::Child descriptor (Figure 16 legend: CMDB relation).', reference: 'A reference attribute from one record to another (Figure 16 legend: entity relation).', map: 'A many-to-many mapping table (Figure 16 legend: m2m map).', hierarchy: A parent reference from an entity to its own kind., membership: A group or bill-of-materials containment stated in the text.}
life_cycle:
  source: 'CSDM 5 Figures 9 to 14 (figures win, decision of Ryan 2026-11-03). Stage, then each status with the kinds of record it applies to. A = Asset, BA = Business Application, CI = configuration item, Co = Contract, Doc = Document, IBI = Install Base Item, Lo = Location, PM = Product Model, SV = Service or Service Model.'
  product:
    applies_to: Product Model tables and the Service Model (Figure 10; p. 21).
    Ideation: {Under Evaluation: PM+SV, Pilot: PM+SV}
    Design: {Design: PM+SV, Chartered: PM+SV, Planning: PM+SV}
    Build & Integrate: {Build: PM+SV, In production: PM+SV}
    Operational: {In Use: PM+SV, Available: PM+SV, End of Support: PM+SV, Pending Retirement: PM+SV}
    End of Life: {Obsolete: PM+SV, Retired: PM+SV, Sold: PM+SV}
  tangible:
    applies_to: Tangible and physical assets and CIs (Figure 11; p. 22).
    Ideation: {Under Evaluation: PM+SV, Pilot: SV}
    Design: {Design: A+PM+SV, Chartered: SV, Build: A+CI+PM}
    Purchase: {On Order: A+CI, Pre-Allocated: A}
    Inventory: {Available: A+CI, Reserved: A, Pre-Allocated: A, Pending Repair: A+CI, Legal Hold: A+CI, Quarantine: A+CI}
    Deploy: {In Stock: A+CI, Reserved: A+CI, Pending Transfer: A+CI, In Transit: A+CI, Test: A+CI}
    Operational: {Pending Fulfillment: A+CI+IBI, In Use: A+CI+IBI, In Maintenance: A+CI+IBI, End of Support: A+CI+IBI, Pending Retirement: A+CI+IBI}
    End of Operation: {In Transit: A+CI+IBI, Pending Certificate: A+CI+IBI, Pending Disposal: A+CI+IBI, Pending Donation: A+CI+IBI, Pending Evaluation: A+CI+IBI, Pending Resale: A+CI+IBI, Pending Return: A+CI+IBI, On Hold: A+CI+IBI}
    Defective: {In Stock: A+CI+IBI, In Transit: A+CI+IBI}
    Missing: {Lost: A+CI+IBI, Stolen: A+CI+IBI}
    End of Life: {Obsolete: A+CI+IBI, Retired: A+CI+IBI, Disposed: A+CI+IBI, Donated: A+CI+IBI, Sold: A+CI+IBI, RMA: A+CI+IBI, Vendor Credit: A+CI+IBI, Buy-out: A+CI+IBI, Lease Return: A+CI+IBI}
  intangible:
    applies_to: Intangible and logical assets and CIs, including service instances (Figure 12; p. 24; docs).
    Ideation: {Under Evaluation: PM+SV, Pilot: SV}
    Design: {Design: A+PM+SV, Chartered: SV, Build: A+CI+BA+PM}
    Purchase: {On Order: A+CI, Pre-Allocated: A}
    Inventory: {Available: A+CI, Pre-Allocated: A, Legal Hold: A+CI}
    Deploy: {Test: A+CI}
    Operational: {Pending Fulfillment: A+CI+IBI, In Use: A+CI+IBI, In Maintenance: A+CI+IBI, End of Support: A+CI+IBI, Pending Retirement: A+CI+IBI}
    End of Operation: {On Hold: A+CI+IBI}
    End of Life: {Obsolete: A+CI+IBI, Retired: A+CI+IBI}
  document:
    applies_to: Contracts and architecture artifacts such as Business Process (Figure 13; p. 26).
    Ideation: {Draft: Co+Doc, Under Evaluation: Co+Doc}
    Operational: {In Use: Co+Doc, Published: Co+Doc, Renewal in Process: Co, Renewed: Co, Pending Retirement: Co}
    End of Life: {Expired: Co, Retired: Co}
  location:
    applies_to: The common data location table (Figure 14; p. 27).
    Design: {Chartered: Lo, Build: Lo}
    Operational: {Available: Lo, In Use: Lo, Pending Retirement: Lo}
    End of Life: {Sold: Lo, Lease Return: Lo, Obsolete: Lo}
  differences: 'Sources disagree, and the figures are what is recorded here. Product: the paper definitions omit the Build & Integrate stage, Planning, In production, In Use and Sold; the docs definitions have the stage, Planning and In Production. Location: the paper and docs definitions say Ideation where Figure 14 and the text say Design. Tangible and intangible: the definitions differ on Pending Fulfillment, the Design stage, and the End of Life lists. Pending Fulfillment is defined only in the docs (tangible). Business Application: the docs add a restricted set of stages (Ideation, Design, Operational, End of Life) and say inherited stages may also appear. Figure 11 was read at low resolution for the kinds of record on Design/Build; confirm when the file is built.'
constraints:
- {id: CSDM-SVC-001, statement: 'A Business Service and a Technology Management Service are each single level: neither forms a hierarchy of services of its own kind.', strength: must, section: 'p. 11, What is a Service?', applies_when: 'Business Service, Technology Management Service', checkable: static}
- {id: CSDM-SVC-002, statement: Every operational Business Service and Technology Management Service has at least one Service Offering., strength: should, section: 'pp. 43, 45, 54-55', applies_when: Business Service or Technology Management Service is operational, checkable: static}
- {id: CSDM-SVC-003, statement: 'A CI relates, through Dynamic CI Groups, to only one Technology Management Service and one Technology Management Service Offering. A CI may belong to several Dynamic CI Groups if only one of them is related to a Technology Management Service. Reason given: manager, support and change group data is copied down to the CIs and would be overwritten.', strength: should, section: 'pp. 43-44, Dynamic CI Group', applies_when: CI is a member of a Dynamic CI Group, checkable: partial}
- {id: CSDM-SVC-004, statement: A Dynamic CI Group contains CIs and cannot contain other groups., strength: must, section: 'p. 43, Dynamic CI Group', applies_when: Dynamic CI Group, checkable: static}
- {id: CSDM-SVC-005, statement: 'A Dynamic CI Group has a service classification of Application Service or Technical Service, and the classification decides whether it acts as a query-based application service or as a group managed by a Technology Management Service Offering.', strength: must, section: 'p. 44, Dynamic CI Group', applies_when: Dynamic CI Group, checkable: static}
- {id: CSDM-SVC-006, statement: Offerings of one service that have different commitments are represented by different service level agreement definitions., strength: should, section: 'p. 45, Business Service Offering', applies_when: A service has more than one offering, checkable: none}
- {id: CSDM-SVC-007, statement: The offering of an Application Service is exposed through the related Business Service Offering or Technology Management Service Offering., strength: should, section: 'p. 39, Application Services', applies_when: Application Service, checkable: partial}
- {id: CSDM-SVC-008, statement: Each distinct deployment of a business application (each environment and region) is represented by its own Application Service., strength: should, section: 'pp. 11, 54, Crawl Stage', applies_when: Business Application is deployed in more than one environment or region, checkable: partial}
- {id: CSDM-SVC-009, statement: The Service Classification attribute sits on the parent service table and is inherited by every service type; it is normally filled in from the CI's class., strength: note, section: 'p. 37, What is Service Classification attribute?', checkable: none}
- {id: CSDM-SVC-010, statement: 'The service instance types added in CSDM 5 (data, connection, network, operational process, facility) are model only: they have no user interface, need manual creation and are not part of event impact analysis. There is no expectation of using them unless local needs require it.', strength: note, section: 'pp. 37-38, Service Instance', checkable: none}
- {id: CSDM-SVC-011, statement: The Service Delivery Network is not an entity. It is the set of interconnected Connection Service Instances and Network Service Instances., strength: must, section: 'pp. 39-41, Service Delivery Network', checkable: static}
- {id: CSDM-SVC-012, statement: A single installed Application can support several Application Services; there is no one-to-one relationship between the two., strength: note, section: 'p. 41, Application', checkable: none}
- {id: CSDM-SVC-013, statement: 'The Application table is not an inventory or portfolio of applications (that is the Business Application table). It holds discoverable instances of code on one host, and manual population is not recommended.', strength: should, section: 'pp. 41, 53', applies_when: Application, checkable: partial}
- {id: CSDM-TBL-001, statement: 'A Product Model is not a CI, and product model classes are not CMDB classes. A CI points to its Product Model through the model reference, which every CMDB table has.', strength: must, section: 'p. 18, Product (Models)', applies_when: Product Model and its classes, checkable: static}
- {id: CSDM-TBL-002, statement: A Contract is not a CI., strength: must, section: 'p. 16, Contract', applies_when: Contract, checkable: static}
- {id: CSDM-TBL-003, statement: 'The common data entities (Company, Business Unit, Department, Location, Building, Group, User) are not CIs.', strength: must, section: 'p. 27, Common Data', applies_when: Common data entities, checkable: static}
- {id: CSDM-TBL-004, statement: A CMDB Group is not a CI., strength: must, section: 'pp. 18-19, CMDB Group', applies_when: CMDB Group, checkable: static}
- {id: CSDM-TBL-005, statement: Foundation tables are referential data and are not used in CMDB relationships. Business Process is the exception because it is a CMDB table. (The paper states the first sentence flatly and then draws a CMDB relationship for Business Process; the exception is our reading.), strength: must, section: 'p. 14, Foundation Domain', applies_when: A CMDB relationship has a Foundation entity at an end, checkable: static}
- {id: CSDM-TBL-006, statement: 'A Business Application and an SDLC Component are not operational CIs and should not be used in incident, problem or change.', strength: should, section: 'pp. 53-54, Crawl Stage', applies_when: 'Business Application, SDLC Component', checkable: runtime}
- {id: CSDM-TBL-007, statement: 'Records in the Design and Planning and Build and Integration domains are not direct targets of incident, problem and change. Service Delivery and Service Consumption tables are operational and can be selected in them.', strength: note, section: 'pp. 31, 34, 36, 45', checkable: none}
- {id: CSDM-TBL-008, statement: 'Each entity is stored in the table, with the service classification, that the paper''s table mapping gives. The paper says the mapping will continue to evolve.', strength: should, section: 'p. 47, CSDM 5 Table Names and Labels', applies_when: Any CSDM entity that has a table, checkable: static}
- {id: CSDM-TBL-009, statement: The service offering table holds both Business Service Offerings and Technology Management Service Offerings; the service classification says which., strength: note, section: 'pp. 43, 45', checkable: none}
- {id: CSDM-TBL-010, statement: A Business Application's singular reference to a Business Process is legacy from CSDM 5 and is not recommended; relationships that allow one to many exist., strength: should, section: 'p. 33, Business applications', applies_when: Business Application references a Business Process, checkable: static}
- {id: CSDM-TBL-011, statement: 'Business Process, Business Capability and Business Application are manually maintained CIs. Application and infrastructure CIs are normally created by discovery.', strength: note, section: 'pp. 16, 32, 41, 53', checkable: none}
- {id: CSDM-REL-001, statement: Use the prescribed relationships and references (the paper's relationship figure) as the main way to link CSDM entities., strength: should, section: 'p. 7, principle 3; p. 48', applies_when: A relationship joins two CSDM entities, checkable: static}
- {id: CSDM-REL-002, statement: 'Use the prescribed relationships between the CIs. If they are missing (for example Business Application uses Application Service), functions such as technology portfolio risk assessment will not work.', strength: should, section: 'p. 48, Relationships in CSDM', applies_when: 'Business Application, Application Service', checkable: static}
- {id: CSDM-REL-003, statement: 'When mapping infrastructure relationships by hand, create the relationships that discovery would create.', strength: should, section: 'p. 48, Relationships in CSDM', applies_when: Manual mapping of infrastructure CIs, checkable: none}
- {id: CSDM-REL-004, statement: 'Create a CI relationship between each Business Capability and its Business Applications, and between Business Applications and their Application Services.', strength: should, section: 'p. 31, Business capabilities', applies_when: 'Business Capability, Business Application', checkable: static}
- {id: CSDM-REL-005, statement: 'A Business Application is manually managed, so its relationships to deployed instances (Application Services) are created by hand.', strength: note, section: 'p. 32, Business applications', checkable: none}
- {id: CSDM-REL-006, statement: 'Impact analysis follows relationships in the reverse direction. The relationship type is for the most part not critical, but should be followed.', strength: note, section: 'p. 48, Relationships in CSDM', checkable: none}
- {id: CSDM-REL-007, statement: Not every CSDM object is a CMDB table and not every object has relationships., strength: note, section: 'p. 48, Relationships in CSDM', checkable: none}
- {id: CSDM-REL-008, statement: 'A Business Application relates to Application Services, and not to any other type of Service Instance.', strength: should, section: 'docs, CI relationships', applies_when: 'Business Application uses or consumes a service instance', checkable: static}
- {id: CSDM-HIER-001, statement: A Business Capability hierarchy has no more than six levels., strength: must, section: 'pp. 31-32, Business capabilities', applies_when: Business Capability, checkable: static}
- {id: CSDM-HIER-002, statement: 'A capability hierarchy that seems to need more than six levels is a candidate to be split into several capabilities, the lower levels being processes and tasks rather than capabilities.', strength: should, section: 'p. 31, Business capabilities', applies_when: Business Capability hierarchy is deep, checkable: none}
- {id: CSDM-HIER-003, statement: Only a leaf Business Capability (one with no children) can be deleted., strength: must, section: 'p. 32, Business capability update guidance', applies_when: Business Capability is deleted, checkable: partial}
- {id: CSDM-HIER-004, statement: 'A Business Capability cannot be its own ancestor: no circular parent relationships.', strength: must, section: 'p. 32, Business capability update guidance', applies_when: Business Capability, checkable: static}
- {id: CSDM-HIER-005, statement: A Business Capability's level is assigned from its parent and recalculated when the parent changes., strength: note, section: 'p. 32, Business capability update guidance', checkable: none}
- {id: CSDM-HIER-006, statement: A Location flagged as a duplicate names a primary Location., strength: must, section: 'p. 28, Location Management', applies_when: Location is flagged Duplicate, checkable: static}
- {id: CSDM-HIER-007, statement: 'Internal Company entries form a hierarchy of legal entities, not of business units.', strength: should, section: 'p. 51, Foundation Stage', applies_when: Company is internal, checkable: none}
- {id: CSDM-HIER-008, statement: 'Registering an Application Service lets administrators define uniqueness and required fields for the first record, before choosing how it is populated.', strength: note, section: 'p. 39, Application Services', checkable: none}
- {id: CSDM-LCY-001, statement: Life Cycle Stage and Life Cycle Stage Status are two attributes on every CI; together they uniquely specify an object's status., strength: must, section: 'pp. 19-20, CSDM Life Cycle', applies_when: CI, checkable: partial}
- {id: CSDM-LCY-002, statement: Life cycle stages and stage statuses are provided by ServiceNow and are not editable., strength: must, section: 'p. 20, CSDM Life Cycle', checkable: none}
- {id: CSDM-LCY-003, statement: 'An object takes only the stage and status values of its own life cycle process: product, tangible, intangible, document or location.', strength: must, section: 'pp. 20-27, Life Cycle Processes', applies_when: Object has a life cycle stage, checkable: static}
- {id: CSDM-LCY-004, statement: 'Adopting the new life cycle fields is optional. A mapping from the legacy status attributes is available, and after the Xanadu family release there is no ongoing synchronization with them.', strength: note, section: 'p. 20, CSDM Life Cycle', checkable: none}
- {id: CSDM-LCY-005, statement: 'Evaluate dependencies on the legacy status attributes before enabling the new life cycle fields, and test the new product-instance synchronization in non-production first, because turning it off again may lose data.', strength: should, section: 'p. 20, CSDM Life Cycle', applies_when: Life cycle fields are enabled, checkable: none}
- {id: CSDM-ADOPT-001, statement: 'Adopt CSDM in stages (Foundation, Crawl, Walk, Run, Fly) rather than implementing every part at once.', strength: should, section: 'p. 51, How to adopt the CSDM standard', checkable: none}
- {id: CSDM-ADOPT-002, statement: 'Foundation stage: populate Company, Business Unit, Department, Location, Group, User, CMDB Group, Product Models and Contracts first.', strength: should, section: 'pp. 51-53, Foundation Stage', checkable: partial}
- {id: CSDM-ADOPT-003, statement: 'Crawl stage: Business Application, Application Service, Application (discoverable) and server or host (discoverable). SDLC Component is optional here and can wait for the Fly stage.', strength: should, section: 'pp. 53-54, Crawl Stage', checkable: partial}
- {id: CSDM-ADOPT-004, statement: 'Walk stage: Technology Management Service, Technology Management Service Offering and Dynamic CI Group.', strength: should, section: 'pp. 54-55, Walk Stage', checkable: partial}
- {id: CSDM-ADOPT-005, statement: 'Run stage: Service Portfolio (not a CMDB table), Business Service and Business Service Offering.', strength: should, section: 'pp. 55-56, Run Stage', checkable: partial}
- {id: CSDM-ADOPT-006, statement: 'Fly stage: Request Catalog, Business Capability and Information Object. The Information Object may be needed sooner if requirements say so.', strength: should, section: 'pp. 56-57, Fly Stage', checkable: partial}
- {id: CSDM-ADOPT-007, statement: 'Migrating from a nonconforming table: back up the data; map attributes (best practice, keep, refactor, do not need); identify every dependency on the old table in reports, rules and scripts; refactor attributes; then migrate and fix the dependencies. Moving a CI to another class can lose data held in attributes outside the new table hierarchy.', strength: should, section: 'pp. 58-59, Migrating into CSDM', applies_when: A model is migrated into CSDM, checkable: none}
- {id: CSDM-PRIN-001, statement: 'Agreed CSDM definitions are used wherever a table, reference or attribute is used.', strength: should, section: 'p. 7, principle 5', checkable: none}
- {id: CSDM-PRIN-002, statement: 'Ten principles guide CSDM: simplified concepts; designed for reporting and analytics; prescriptive relationships; a data model shared across products; agreed definitions; shared tables supplied by default; consistent data integrations; limited upgrade impact; data governance and process; documented product guidance.', strength: note, section: 'p. 7, CSDM Key Principles', checkable: none}
- {id: CSDM-PRIN-003, statement: 'CSDM is not a product, an implementation guide, a set of reports, code to install or an automatic fix for past implementations. The core tables need no purchase, though plugins may be needed for some elements.', strength: note, section: 'p. 3, CSDM Introduction', checkable: none}
- {id: CSDM-PRIN-004, statement: The model is designed to be extended; for example a customer can add a service classification value., strength: note, section: 'p. 10, CSDM Conceptual Model', checkable: none}
diagram_types:
  Conceptual Model:
    defined_by: 'Figure 4, p. 10 (heading: historical view)'
    status: specified-figure
    read: image
    purpose: One-page view of the seven domains, with Foundation as a band under the five life cycle domains and Manage Portfolio at the center.
    admits: [BusinessCapability, BusinessApplication, InformationObject, SDLCComponent, PlanningItem, ProductIdea, ServiceInstance, TechnologyManagementService, TechnologyManagementServiceOffering, DynamicCIGroup, BusinessService, BusinessServiceOffering, RequestCatalog, ProductModel, ProductFeature, SoftwareBillOfMaterials, Location, Team, Group, User, Company, BusinessUnit, Department, ValueStream, BusinessProcess, Contract, CMDBGroup, Knowledge]
    admits_also: Service Delivery System (a cloud shape standing for the Service Delivery Network, not an entity); three catalogs inside the request catalog (service, product, sales); personas.
    conventions:
      line_kinds: A solid arrow is a relationship; a dashed arrow is a reference.
      domain_colors: {Foundation: grey, Ideation and Strategy: yellow, Design and Planning: blue-green, Build and Integration: red, Service Delivery: orange, Service Consumption: green, Manage Portfolio: white}
      personas: enterprise architect, Digital Product Owner, Product Owner, Business Relationship Manager, Customer Service Manager, Service Instance Owner, Service Delivery Owner, Service Provider, Process Owner, Contract Manager, Data Steward, Chief Strategist.
      provenance: {status: read-from-figure, note: Read from the rendered figure; not measured.}
  End-to-End Service Life Cycle:
    defined_by: Figures 2 and 6, pp. 8, 14
    status: specified-figure
    read: text-and-caption
    purpose: The domains as stages in life cycle order, with Foundation supporting all stages and Manage Portfolio spanning them.
    admits: domains, not concepts
    stages_in_order: [Ideation and Strategy, Design and Planning, Build and Integration, Service Delivery, Service Consumption]
    conventions: not-measured
  Domain Entities: {defined_by: 'Figure 3, p. 9', status: specified-figure, read: image, purpose: 'Entity categories under each life cycle stage, with overlay bands for Business Model, Enterprise Architecture, Solution Architecture, Service Model and Sales and Support Models.', admits: 'entity categories, not concepts: Business Planning entities; Design entities and models; Dev, Build and Integration entities; Deployed and Operational entities; Offering and Support entities; Foundation core data.', conventions: not-measured}
  Digital System Model:
    defined_by: Figure 5, pp. 12-13
    status: specified-figure
    read: image
    purpose: Four layers (process, service-logical, functional, infrastructure), each with design entities on the left and operational entities on the right.
    admits: [BusinessProcess, InformationObject, ServiceInstance, ServiceOffering, BusinessApplication, SystemComponentModel, ProductModel]
    admits_also: Service and CI relationships; application CIs; facility hardware; hardware CIs.
    layers:
      Process: [BusinessProcess]
      Service (logical): [InformationObject, ServiceInstance, ServiceOffering]
      Functional: [BusinessApplication, SystemComponentModel]
      Infrastructure: [ProductModel]
    conventions:
      orientation: Design entities left of the dividing line, operational entities right.
      provenance: {status: read-from-figure, note: Read from the rendered figure; not measured.}
  Configuration Item Relationships:
    defined_by: Figure 16, p. 48
    status: specified-figure
    read: image
    purpose: 'The prescribed relationships and references: three columns, From (parent), Relationship/Reference, To (child), in two panels.'
    admits: [ValueStream, BusinessCapability, BusinessProcess, ValueStreamStage, BusinessApplication, BusinessService, InformationObject, SDLCComponent, ApplicationService, Application, ServiceInstance, DataServiceInstance, NetworkServiceInstance, OperationalProcessServiceInstance, FacilityServiceInstance, ConnectionServiceInstance, ConnectedDevice, NetworkFunction, NetworkFunctionApplication, API, BusinessServiceOffering, InfrastructureCI, TechnologyManagementService, TechnologyManagementServiceOffering, DynamicCIGroup, ServicePortfolio]
    conventions:
      columns: From (parent), Relationship/Reference, To (child).
      line_kinds: 'Entity relation: crow''s-foot and bar glyphs. CMDB relation: arrow, labelled with the relationship type. m2m map: double-headed arrow.'
      provenance: {status: read-from-figure, note: Read from the rendered figure; not measured.}
  Table Names and Labels:
    defined_by: Figure 15, p. 47
    status: specified-table
    read: text
    purpose: A table mapping each domain entity to its platform table, with the service classification where one applies.
    admits: [Service, ValueStream, ValueStreamCategory, ValueStreamStage, BusinessProcess, Contract, ProductModel, CMDBGroup, Company, BusinessUnit, Department, Location, Building, Group, User, ProductIdea, PlanningItem, StrategicPlan, StrategicPriority, Goal, Target, BusinessCapability, BusinessApplication, InformationObject, SDLCComponent, ServiceInstance, ApplicationService, DataServiceInstance, ConnectionServiceInstance, NetworkServiceInstance, OperationalProcessServiceInstance, FacilityServiceInstance, NetworkFunction, API, Application, NetworkFunctionApplication, AIFunction, AIApplication, InfrastructureCI, TechnologyManagementService, TechnologyManagementServiceOffering, DynamicCIGroup, BusinessService, ServiceOffering, BusinessServiceOffering, RequestCatalog, ServicePortfolio]
    conventions: not-applicable
  Value Stream Mapping:
    defined_by: Figure 7, p. 15
    status: specified-figure
    read: caption
    purpose: Value stream and value stream stage mapped to business capability and business process.
    admits: [ValueStream, ValueStreamStage, BusinessCapability, BusinessProcess]
    conventions: not-measured
  Product Model Classes:
    defined_by: Figure 8, p. 17
    status: specified-figure
    read: caption
    purpose: The ten base product model classes and the four beneath System Component Model.
    admits: [ProductModel, ApplicationModel, SystemComponentModel, SoftwareComponentModel, ServiceOfferingModel, FirmwareModel, AISystemProductModel, ServiceModel, SoftwareModel, ContentProductModel, ContractModel, FacilityModel, HardwareModel, ConsumableModel, EnterpriseGoodModel]
    conventions: not-measured
  Life Cycle Model:
    defined_by: Figures 9 to 14, pp. 19-27
    status: specified-figure
    read: caption
    purpose: 'Stage and stage status values: one aggregate view and one each for product and service, tangible, intangible, document and architecture artifacts, and location.'
    admits: life cycle stages and statuses (see life_cycle), not concepts
    variants: [aggregate, product and service, tangible, intangible, document, location]
    conventions: not-measured
  Product Portfolio Across CSDM: {defined_by: 'Figure 17, p. 50', status: specified-figure, read: caption, purpose: Which ServiceNow products contribute to which domain. Not a data model view., admits: 'ServiceNow products, not concepts', conventions: not-measured}
  Digital Value Network: {defined_by: 'Figure 1, p. 5', status: specified-figure, read: caption, purpose: 'Service providers, a service delivery network and consumers, as the setting for CSDM 5. Not a model view.', admits: not-modeled, conventions: not-applicable}
data_types:
  coverage: partial
  section: 'pp. 16, 18-20, 28, 30, 32-33, 35, 37, 44, 51-52; Figure 16, p. 48'
  note: 'The paper defines no data types. It names some attributes and gives fixed values for a few of them, and the product documentation sends the reader to the platform dictionary for the full table definitions. Only what the paper states is recorded here.'
  types:
    - {name: ServiceClassification, kind: enumeration, values: [Business Service, Technical Service, Application Service], section: 'Figure 15, p. 47; p. 37', note: 'The model can be extended with more values (p. 10).'}
    - {name: LifeCycleStage, kind: enumeration, values_in: life_cycle, section: 'Figures 9 to 14, pp. 19-27', note: 'The values depend on the object''s life cycle process and are not editable (p. 20).'}
    - {name: LifeCycleStageStatus, kind: enumeration, values_in: life_cycle, section: 'Figures 9 to 14, pp. 19-27'}
    - {name: BusinessProcessReviewFrequency, kind: enumeration, values: [Monthly, Quarterly, Semi Annual / Half Yearly, Annually, none], section: 'p. 16'}
    - {name: LocationType, kind: enumeration, values: [Region, Country, State/Province, City, Site, Building/Structure, Floor, Room], section: 'p. 28'}
    - {name: LocationValidation, kind: enumeration, values: [Duplicate, Primary], section: 'p. 28'}
    - {name: ArchitectureType, kind: enumeration, values: [platform app, platform host], section: 'p. 32', note: 'The two choices the paper names. It doesn''t say they are the only ones.'}
    - {name: SDLCComponentType, kind: enumeration, values: [Application, Infrastructure], section: 'p. 35'}
    - {name: TeamGroupType, kind: enumeration, values: [Change Group, Managed by Group, Support Group], section: 'p. 29'}
    - {name: ValueStreamCategory, kind: enumeration, values_in: reference_data.value_stream_categories, section: 'p. 15'}
    - {name: RelationshipType, kind: enumeration, values_in: reference_data.relationship_types, section: 'Figure 16, p. 48; docs, CI relationships'}
  attributes:
    coverage: some_concepts
    where: concepts
    note: 'Most concepts have no attribute named in the paper. It gives no type for an attribute unless it lists values, or describes a reference or a flag, and it gives no multiplicity. It describes offerings and commitments by the options they vary on (location, environment, pricing, availability, and so on) without calling them attributes, so they are not listed.'
notation:
  coverage: informative
  section: 'Figure 4, p. 10; Figure 7, p. 15; Figure 8, p. 17; Figure 16, p. 48'
  note: 'CSDM defines no notation and requires none. Its figures draw entities and lines in a consistent way, with keys, and this records what they show. Figures differ: Figure 4 draws a reference as a dashed arrow, and Figures 7 and 16 draw it as a line with crow''s-foot and bar marks.'
  default:
    shape: 'A box with the entity''s name centered. Figures 7, 8, and 16 draw a rounded rectangle filled with its domain''s color, and Figures 7 and 8 add the table name under the entity name. Figure 4 draws a white rectangle with a thin dark outline, inside a rounded panel in the domain''s color.'
    line: 'A CMDB relation is a solid line with a filled arrowhead at the To (child) end, labeled with its type in square brackets, such as [Provided by::Provides]. Lines that share an end may merge. A generalization (Figure 8, class extension) is a solid line with a hollow triangle at the parent end.'
    section: 'Figure 4, p. 10; Figure 8, p. 17; Figure 16, p. 48'
  colors:
    normative: false
    section: 'Figure 4, p. 10'
    key: {Foundation: grey, Ideation and Strategy: yellow, Design and Planning: blue-green, Build and Integration: red, Service Delivery: orange, Service Consumption: green, Manage Portfolio: white}
    note: 'Color names read from the key of Figure 4. The paper states no color values and doesn''t say color carries formal meaning.'
  not_entities:
    Manage Portfolio: {shape: a white circle at the center of Figure 4, note: 'A domain and a view, not an entity.', section: 'Figure 4, p. 10'}
    Service Delivery System: {shape: a cloud in Figure 4, note: 'Stands for the Service Delivery Network, which is not an entity (CSDM-SVC-011).', section: 'Figure 4, p. 10'}
    Roles: {shape: a person icon beside a domain, note: 'Figure 4 labels roles this way, in the domain''s color.', section: 'Figure 4, p. 10'}
  elements:
    ValueStream: {shape: 'a row of right-pointing chevrons in Figure 4; the usual rounded rectangle in Figures 7 and 16', section: 'Figures 4, 7, 16'}
    ServiceInstance: {shape: 'in Figure 4, a stack of overlapping rectangles, because there are several types; the usual rounded rectangle in Figure 16', section: 'Figures 4, 16'}
    SDLCComponent: {shape: 'in Figure 4, a stack of overlapping rectangles inside a lighter panel labeled Subsystems; the usual rounded rectangle in Figure 16', section: 'Figures 4, 16'}
    Location: {shape: 'in Figure 4, a stack of overlapping rectangles', section: 'Figure 4'}
    RequestCatalog: {shape: 'in Figure 4, a lighter panel labeled Catalog that holds three rectangles: Service Catalog, Product Catalog, and Sales Catalog', section: 'Figure 4'}
  relationships:
    ValueStreamMapsToBusinessCapability: {line: solid, source_end: arrowhead, target_end: arrowhead, label: 'Many-to-Many map', section: 'Figure 16, p. 48'}
    ValueStreamMapsToBusinessProcess: {line: solid, source_end: arrowhead, target_end: arrowhead, label: 'Many-to-Many map', section: 'Figure 16, p. 48'}
    ValueStreamStageMapsToBusinessCapability: {line: solid, source_end: arrowhead, target_end: arrowhead, label: 'Many-to-Many map', section: 'Figure 16, p. 48'}
    ValueStreamStageMapsToBusinessProcess: {line: solid, source_end: arrowhead, target_end: arrowhead, label: 'Many-to-Many map', section: 'Figure 16, p. 48'}
    BusinessApplicationReferencesBusinessProcess: {line: solid, source_end: crow's foot, target_end: circle and bar (zero or one), label: 'Ref: Business Process', section: 'Figure 16, p. 48'}
    APIReceivesDataFromBusinessServiceOffering: {line: solid, source_end: arrowhead, target_end: filled arrowhead, label: '[Receives data from::Sends data to]', section: 'Figure 16, p. 48'}
    TechnologyManagementServicePublishedAsOffering: {line: solid, source_end: single bar, target_end: single bar, label: 'Ref: "Published as"', section: 'Figure 16, p. 48'}
    BusinessServicePublishedAsOffering: {line: solid, source_end: single bar, target_end: single bar, label: 'Ref: "Published as"', section: 'Figure 16, p. 48'}
    BusinessServiceIsPartOfServicePortfolio: {line: solid, source_end: crow's foot, target_end: single bar, label: 'Ref: "Is part of"', section: 'Figure 16, p. 48'}
    TechnologyManagementServiceIsPartOfServicePortfolio: {line: solid, source_end: crow's foot, target_end: single bar, label: 'Ref: "Is part of"', section: 'Figure 16, p. 48'}
    ValueStreamStagePartOfValueStream: {line: solid, source_end: crow's foot, target_end: single bar, label: 'Part of', section: 'Figure 7, p. 15'}
    ValueStreamHasValueStreamCategory: {line: solid, source_end: crow's foot, target_end: single bar, label: Has, section: 'Figure 7, p. 15'}
  not_specified: [AIApplication, AIDatasetDigitalAsset, AIFunction, AIModelDigitalAsset, AIPromptDigitalAsset, AISystemDigitalAsset, Asset, Building, CatalogItem, ConfigurationItem, Goal, InstallBaseItem, OperationalTechnology, Portfolio, Service, ServiceCommitment, ServiceOfferingSubscription, StrategicPlan, StrategicPriority, Target, ApplicationServiceUnderpinsBusinessService, BusinessApplicationConnectedToBusinessApplication, BusinessApplicationConsumesApplicationService, BusinessCapabilityParentOfBusinessCapability, BusinessProcessParentOfBusinessProcess, BusinessUnitParentOfBusinessUnit, BusinessUnitPartOfCompany, CatalogItemRepresentsServiceOffering, CompanyParentOfCompany, ConfigurationItemReferencesProductModel, ContractUsesContractModel, DepartmentPartOfBusinessUnit, DynamicCIGroupContainsConfigurationItem, DynamicCIGroupReferencesCMDBGroup, GoalServesStrategicPriority, LocationParentOfLocation, PlanningItemAlignedToGoal, PlanningItemAlignedToTarget, PlanningItemRelatesToProductModel, ProductIdeaRelatesToProductModel, ProductModelContainsProductModel, RequestCatalogUsesCatalogItem, SDLCComponentDescribedByInfrastructureCI, ServiceOfferingDerivedFromService, ServiceOfferingSubscriptionCoversServiceOffering, ServiceOfferingSubscriptionIdentifiesCompany, ServiceOfferingSubscriptionIdentifiesDepartment, ServiceOfferingSubscriptionIdentifiesGroup, ServiceOfferingSubscriptionIdentifiesLocation, ServiceOfferingSubscriptionIdentifiesUser, ServicePortfolioParentOfServicePortfolio, TargetMeasuresGoal, TeamIdentifiesGroup, TeamTiesGroupToConfigurationItem, TechnologyManagementServiceUnderpinsApplicationService]
