ea_only:
  element_types:
    Boundary: EA analysis class (UML Class with the analysis meaning)
    Entity: EA analysis class
    Feature: EA feature element (software-requirements family)
    GUIElement: EA user-interface element
    Issue: EA project-management element
    Report: EA element
    Requirement: EA requirement element
    Risk: EA project-management element
    Screen: EA user-interface element
    Test: EA test element
    Task: EA project-management element
    Change: EA project-management element
    Text: EA text label element
    UMLDiagram: EA element that stands for a diagram
    DiagramFrame: EA diagram frame element
    Association: an element EA accepts under this name; its use is not documented here
  connector_types:
    Nesting: EA's nesting connector (a child shown inside its parent)
    NoteLink: joins a Note to any element
    InterruptFlow: the edge of an interruptible region
    Collaboration: joins a collaboration use to its collaboration
    Assembly: joins a provided and a required interface
    Delegate: joins a port to an inner part or port
    Connector: a connector in a composite structure
  note: the connector types other than these are UML metaclasses (see concepts)
