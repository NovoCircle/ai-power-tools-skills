grid:
  domains:
    Metadata: {acronym: Md, meaning: 'Supporting information that applies to the whole architecture, rather than architectural models.'}
    Strategic: {acronym: St, meaning: 'The capability management process: the taxonomy, composition, dependencies and evolution of capabilities.'}
    Operational: {acronym: Op, meaning: 'The logical architecture of the enterprise: requirements, behavior, structure and exchanges that exhibit capabilities, independent of any solution.'}
    Services: {acronym: Sv, meaning: The services that directly support the operational domain; a service is a unit of work through which a provider gives a consumer a useful result.}
    Personnel: {acronym: Pr, meaning: 'Organizational resource types, their connections and interactions, and how they grow over time.'}
    Resources: {acronym: Rs, meaning: 'The solution architecture of resources (organizational, software, artifacts, capability configurations, natural resources) that implement the operational requirements.'}
    Security: {acronym: Sc, meaning: 'Security assets and enclaves, the owners of assets, the security constraints (policy, law, guidance) and where they apply.'}
    Projects: {acronym: Pj, meaning: 'Projects and milestones, how they deliver capabilities, the organizations that contribute, and dependencies between projects.'}
    Standards: {acronym: Sd, meaning: The technical and non-technical standards that apply to the architecture.}
    Actual Resources: {acronym: Ar, meaning: 'Analysis of the actual resource configurations: alternatives, what-if, trade-offs, verification and validation.'}
  model_kinds:
    Taxonomy: {acronym: Tx, meaning: 'All elements as a stand-alone specialization hierarchy, each with a definition and a source.'}
    Structure: {acronym: Sr, meaning: 'The dependencies, connections and relationships between elements.'}
    Connectivity: {acronym: Cn, meaning: 'The connections, relationships and interactions between elements.'}
    Processes: {acronym: Pr, meaning: 'Activity-based behavior: activities, their inputs and outputs, actions and the flows between them.'}
    States: {acronym: St, meaning: State-based behavior of a structural element and how it reacts to events and actions.}
    Interaction Scenarios: {acronym: Is, meaning: A time-ordered examination of the exchanges between participating elements for one scenario.}
    Information: {acronym: If, meaning: 'The information and data definition aspect, free of implementation detail.'}
    Constraints: {acronym: Ct, meaning: 'Measurements that set performance requirements, and rules governing behavior and structure.'}
    Roadmap: {acronym: Rm, meaning: 'How elements change over time, or differ at different points in time.'}
    Traceability: {acronym: Tr, meaning: 'The mapping between elements, across viewpoints and domains, and between structure and behavior.'}
  cells:
    Strategic:
      Taxonomy: [Strategic Taxonomy]
      Structure: [Strategic Structure]
      Connectivity: [Strategic Connectivity]
      States: [Strategic States]
      Constraints: [Strategic Constraints]
      Roadmap: ['Strategic Roadmap: Deployment', 'Strategic Roadmap: Phasing']
      Traceability: [Strategic Traceability]
    Operational:
      Taxonomy: [Operational Taxonomy]
      Structure: [Operational Structure]
      Connectivity: [Operational Connectivity]
      Processes: [Operational Processes]
      States: [Operational States]
      Interaction Scenarios: [Operational Interaction Scenario]
      Constraints: [Operational Constraints]
      Traceability: [Operational Traceability]
    Services:
      Taxonomy: [Services Taxonomy]
      Structure: [Services Structure]
      Connectivity: [Services Connectivity]
      Processes: [Services Processes]
      States: [Services States]
      Interaction Scenarios: [Services Interaction Scenarios]
      Constraints: [Services Constraints]
      Roadmap: [Services Roadmap]
      Traceability: [Services Traceability]
    Personnel:
      Taxonomy: [Personnel Taxonomy]
      Structure: [Personnel Structure]
      Connectivity: [Personnel Connectivity]
      Processes: [Personnel Processes]
      States: [Personnel States]
      Interaction Scenarios: [Personnel Interaction Scenarios]
      Constraints: ['Personnel Constraints: Competence', 'Personnel Constraints: Drivers', 'Personnel Constraints: Performance']
      Roadmap: ['Personnel Roadmap: Availability', 'Personnel Roadmap: Evolution', 'Personnel Roadmap: Forecast']
      Traceability: [Personnel Traceability]
    Resources:
      Taxonomy: [Resources Taxonomy]
      Structure: [Resources Structure]
      Connectivity: [Resources Connectivity]
      Processes: [Resources Processes]
      States: [Resources States]
      Interaction Scenarios: [Resources Interaction Scenarios]
      Constraints: [Resources Constraints]
      Roadmap: ['Resources Roadmap: Evolution', 'Resources Roadmap: Forecast']
      Traceability: [Resources Traceability]
    Security:
      Taxonomy: [Security Taxonomy]
      Structure: [Security Structure]
      Connectivity: [Security Connectivity]
      Processes: [Security Processes]
      Constraints: [Security Constraints]
      Traceability: [Security Traceability]
    Projects:
      Taxonomy: [Project Taxonomy]
      Structure: [Project Structure]
      Connectivity: [Project Connectivity]
      Processes: [Project Processes]
      Roadmap: [Project Roadmap]
      Traceability: [Project Traceability]
    Standards:
      Taxonomy: [Standards Taxonomy]
      Structure: [Standards Structure]
      Roadmap: [Standards Roadmap]
      Traceability: [Standards Traceability]
    Actual Resources:
      Taxonomy: [Actual Resources Taxonomy]
      Structure: [Actual Resources Structure]
      Connectivity: [Actual Resources Connectivity]
  note: The grid is not meant to be complete; empty cells are gaps the standard says are intended. Metadata Taxonomy is a placeholder for extending the profile to other domains and has no diagram type. The grid figure is an image; this table is rebuilt from the 76 view specifications.
diagram_types:
  Strategic Taxonomy:
    defined_by: DMM 2.1.1
    domain: Strategic
    model_kind: Taxonomy
    recommended_form: [SysML Block Definition Diagram]
    concern: capability needs; the taxonomy of capabilities
    admits: [Capability]
  Strategic Structure:
    defined_by: DMM 2.1.2
    domain: Strategic
    model_kind: Structure
    recommended_form: [SysML Block Definition Diagram]
    concern: capability needs; how enterprise phases, capabilities and organizations relate
    admits: [ActualEnduringTask, ActualEnterprisePhase, ActualOrganization, ActualResponsibleResource, Capability, CapableElement, EnduringTask, EnterpriseGoal, EnterprisePhase, EnterpriseVision, Exhibits, OrganizationInEnterprise, WholeLifeEnterprise]
  Strategic Connectivity:
    defined_by: DMM 2.1.3
    domain: Strategic
    model_kind: Connectivity
    recommended_form: [SysML Block Definition Diagram, SysML Internal Block Diagram]
    concern: dependencies between planned capabilities
    admits: [Capability]
  Strategic States:
    defined_by: DMM 2.1.4
    domain: Strategic
    model_kind: States
