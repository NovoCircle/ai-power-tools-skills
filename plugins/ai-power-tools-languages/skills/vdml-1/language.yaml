diagram_types:
  Role Collaboration:
    defined_by: 8.2, pp. 83-85
    purpose: Shows which Roles of one Collaboration exchange deliverables, with the activity detail left out.
    admits:
      concepts:
      - Role
      - Party
      - Member
      - Position
      - Performer
      relationships:
      - DeliverableFlow
    notation:
    - 'Role: oval. An expand button on the oval means the Role is assigned to a Collaboration, which may contain its own Roles; no expand button means it is unassigned or assigned to an Actor or another Role.'
    - 'DeliverableFlow between two Roles: a labeled connector. Solid means tangible (isTangible true); dashed means intangible. The label is the name of the deliverable (the BusinessItem). A sequence number may follow a double colon, as a convenience of the diagram, not of the model.'
    - A DeliverableFlow is drawn only when it carries a deliverable between different Roles.
    conventions: not-measured
  ValueProposition Exchange:
    defined_by: 8.3, pp. 85-87
    purpose: 'A more abstract view than Role Collaboration: which Role provides and which Role receives which ValueProposition.'
    admits:
      concepts:
      - ValueProposition
      - Role
      relationships:
      - ProviderProvidedProposition
      - RecipientReceivedProposition
    notation:
    - 'ValueProposition: a square, with its name outside the square.'
    - A connector joins a Role to a ValueProposition it provides (provider and providedProposition ends) or receives (recipient and receivedProposition ends).
    - One Role may provide and receive several ValuePropositions.
    conventions: not-measured
  Activity Network:
    defined_by: 8.4, pp. 87-94
    purpose: Shows the Activities of each Role, the Stores and Pools they draw from and fill, and the DeliverableFlows between them, with ports, value contributions and delegation.
    admits:
      concepts:
      - Role
      - Activity
      - Store
      - Pool
      - InputPort
      - OutputPort
      - ValueAdd
      - BusinessItem
      - Collaboration
      - Expression
      relationships:
      - DeliverableFlow
      - CollaborationInternalPortDelegation
      - InputDelegation
      - OutputDelegation
    notation:
    - 'Role: a swim-lane.'
    - 'Activity: a rectangle with rounded corners; an expand button means the Activity delegates its work to a Collaboration.'
    - 'Store: a pyramid pointing down, name outside. Pool: the same with a re-use marker.'
    - 'DeliverableFlow: a solid connector labeled with the deliverable''s name. This diagram shows no tangible/intangible distinction and no sequence number.'
    - 'Internal port delegation: a dotted connector labeled with the deliverable''s name.'
    - 'Port on an Activity or Store boundary: a small square. Open is the base. A splitter marks a condition or planningPercentage. Filled marks an output that carries a ValueAdd. A thick boundary marks an InputPort that receives the roleResource for the performing Role.'
    - 'Collaboration port: a free-floating pyramid in the Collaboration''s own diagram, open for input or output, filled for an output carrying a ValueAdd.'
    - Text beside a Collaboration port names the BusinessItemLibraryElement defined for it, or in a DelegationContext the BusinessItem of the connected flow.
    conventions: not-measured
  Collaboration Structure:
    defined_by: 8.5, pp. 94-97
    purpose: Shows Collaborations, the Roles they contain, and what fills those Roles. Can show an organization structure but is not limited to one.
    admits:
      concepts:
      - Collaboration
      - BusinessNetwork
      - OrgUnit
      - CapabilityMethod
      - Community
      - Role
      - Position
      - Party
      - Member
      - Performer
      - Actor
      - Person
      relationships:
      - CollaborationRole
      - RoleAssignment
      - ParticipantAssignment
    notation:
    - 'Collaboration: a square-cornered rectangle. BusinessNetwork, OrgUnit, CapabilityMethod and Community each use that rectangle with their own marker.'
    - 'Role not assigned to a Collaboration: an oval.'
    - 'Role containment: a solid connector from the Collaboration to the Role. When the contained Role is assigned to another Collaboration, the connector ends at a small oval on the boundary of that Participant, with the Role name outside.'
    - 'Role assignment (to a Role or an Actor): a dashed, directed connector. An Actor is shown by its name only.'
    conventions: not-measured
  CapabilityLibrary:
    defined_by: 8.6, pp. 97-99
    purpose: 'A capability map: the capability hierarchy from a CapabilityLibrary.'
    admits:
      concepts:
      - Capability
      - CapabilityDefinition
      - CapabilityCategory
      relationships:
      - ParentChildCapability
    notation:
    - 'Capability: a square-cornered rectangle.'
    - 'Parent and child: the child is drawn inside the parent''s boundary. An expand button with a plus shows a collapsed parent; a minus shows an expanded one. Children may instead be shown on a separate CapabilityLibrary diagram.'
    conventions: not-measured
  Capability Heatmap:
    defined_by: 8.7, p. 99
    purpose: The CapabilityLibrary notation refined to show which capabilities need improvement attention.
    admits:
      concepts:
      - Capability
      - CapabilityOffer
      relationships:
      - ParentChildCapability
      - CapabilityOfferCapability
    notation:
    - Same shapes as CapabilityLibrary.
    - A thick boundary on a Capability means at least one corresponding CapabilityOffer has a heatIndex at or above the Scenario's heatThreshold. A normal boundary means the heat index is below it.
    conventions: not-measured
  Capability Management:
    defined_by: 8.8, pp. 100-103
    purpose: Shows what each OrgUnit offers and what supports each offer (methods, stores, pools, positions).
    admits:
      concepts:
      - CapabilityOffer
      - OrgUnit
      - CapabilityMethod
      - Store
      - Pool
      - Position
      relationships:
      - CapabilityProviderCapabilityOffer
      - SupportedCapabilityMethod
      - CapabilityResource
      - MethodOwnerMethod
      - StoreOwnerStore
      - ActivityAppliedCapabilityOffer
    notation:
    - 'CapabilityOffer: a stretched hexagon with the name inside.'
    - 'OrgUnit: a square-cornered rectangle with its name on the boundary; its CapabilityOffers sit on the boundary too. An expand button (plus when collapsed) opens it.'
    - 'Expanded OrgUnit: the CapabilityMethods and Stores or Pools that support its offers are inside the boundary, with Position Roles assigned to sub-OrgUnits.'
    - 'Offer to supporting CapabilityMethod, Store or Pool: a dashed connector.'
    - 'A CapabilityMethod that depends on other CapabilityOffers (through Activities that apply them): an optional dotted connector.'
    - Methods and resources that belong to a different OrgUnit may be shown with that OrgUnit, or without it.
    conventions: not-measured
  Measurement Dependency:
    defined_by: 8.9, pp. 104-105
    purpose: Shows how measurements influence each other within one AnalysisContext or Scenario, to find the root causes of weak value contribution or satisfaction.
    admits:
      concepts:
      - MeasuredCharacteristic
      - MeasurementRelationship
      relationships:
      - MeasurementRelationship
    notation:
    - 'MeasuredCharacteristic: a thin-bordered rectangle.'
    - 'MeasurementRelationship (an SMM class): a thin solid connector. A marker with a plus means positive influence (the other measurement rises when the base rises); a minus means negative influence (it falls).'
    conventions: not-measured
constraints:
- id: VDML-CONT-001
  statement: The Role that performs an Activity must be contained in the same Collaboration that contains the Activity.
  strength: must
