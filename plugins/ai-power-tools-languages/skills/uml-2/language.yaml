standard_profile:
- {stereotype: Auxiliary, applies_to: Class, meaning: 'A class that supports a more central class, typically with secondary logic or control flow; used with Focus.'}
- {stereotype: BuildComponent, applies_to: Component, meaning: A collection of elements defined for system-level development activities such as compilation and versioning.}
- {stereotype: Call, applies_to: Usage, meaning: 'A usage whose source is an operation (or its class) and whose target is an operation (or its class): the source invokes the target.'}
- {stereotype: Create, applies_to: Usage, meaning: A usage saying the client classifier creates instances of the supplier classifier.}
- {stereotype: Create, applies_to: BehavioralFeature, meaning: Marks a feature that creates an instance of the classifier to which it is attached (a constructor).}
- {stereotype: Derive, applies_to: Abstraction, meaning: 'A derivation: the client can be computed from the supplier, perhaps kept for efficiency.'}
- {stereotype: Destroy, applies_to: BehavioralFeature, meaning: Marks a feature that destroys an instance of its classifier.}
- {stereotype: Document, applies_to: Artifact, meaning: A human-readable file; subclass of File.}
- {stereotype: Entity, applies_to: Component, meaning: A persistent information component representing a business concept.}
- {stereotype: Executable, applies_to: Artifact, meaning: A program file that can run on a computer system; subclass of File.}
- {stereotype: File, applies_to: Artifact, meaning: A physical file in the context of the system developed.}
- {stereotype: Focus, applies_to: Class, meaning: A class that defines the core logic or control flow for one or more Auxiliary classes.}
- {stereotype: Framework, applies_to: Package, meaning: A package of elements that specify a reusable architecture for all or part of a system.}
- {stereotype: Implement, applies_to: Component, meaning: A component definition not meant to have its own specification; it implements a separate Specification it depends on.}
- {stereotype: ImplementationClass, applies_to: Class, meaning: 'The implementation of a class in a programming language, where an instance has at most one class.'}
- {stereotype: Instantiate, applies_to: Usage, meaning: 'A usage among classifiers: operations of the client create instances of the supplier.'}
- {stereotype: Library, applies_to: Artifact, meaning: A static or dynamic library file; subclass of File.}
- {stereotype: Metaclass, applies_to: Class, meaning: A class whose instances are also classes.}
- {stereotype: Metamodel, applies_to: Model, meaning: A model that specifies the modeling concepts of a modeling language.}
- {stereotype: ModelLibrary, applies_to: Package, meaning: A package of elements meant to be reused by other packages; it contains no profiles or stereotypes.}
- {stereotype: Process, applies_to: Component, meaning: A transaction-based component.}
- {stereotype: Realization, applies_to: Classifier, meaning: A classifier that specifies a domain of objects and also defines the physical implementation of them.}
- {stereotype: Refine, applies_to: Abstraction, meaning: A refinement between model elements at different semantic levels; the mapping may or may not be computable.}
- {stereotype: Responsibility, applies_to: Usage, meaning: A contract or obligation of an element in its relationship to other elements.}
- {stereotype: Script, applies_to: Artifact, meaning: A script file that a computer system can interpret; subclass of File.}
- {stereotype: Send, applies_to: Usage, meaning: 'A usage whose client is an operation and whose supplier is a signal: the operation sends the signal.'}
- {stereotype: Service, applies_to: Component, meaning: 'A stateless, functional component.'}
- {stereotype: Source, applies_to: Artifact, meaning: A source file that can be compiled into an executable file; subclass of File.}
- {stereotype: Specification, applies_to: Classifier, meaning: A classifier that specifies a domain of objects without defining their physical implementation.}
- {stereotype: Subsystem, applies_to: Component, meaning: A unit of hierarchical decomposition for large systems.}
- {stereotype: SystemModel, applies_to: Model, meaning: A model that contains a collection of models of the same system and all relationships and constraints between elements of different models.}
- {stereotype: Trace, applies_to: Abstraction, meaning: A trace between elements or sets of elements that represent the same concept in different models; used for tracking requirements and changes.}
- {stereotype: Type, applies_to: Class, meaning: 'A class that specifies a domain of objects together with applicable operations, without defining physical implementation.'}
- {stereotype: Utility, applies_to: Class, meaning: A class with no instances; a named collection of static attributes and operations.}
constraints:
- id: UML-COM-001
  statement: The value specification of a constraint must evaluate to a Boolean.
  strength: must
  section: 7.8.3.6 Constraints
  applies_to: Constraint
  checkable: partial
  source: 'formal: Constraint::boolean_value'
- id: UML-COM-002
  statement: Evaluating a constraint's value specification must not change anything.
  strength: must
  section: 7.8.3.6 Constraints
  applies_to: Constraint
  checkable: none
  source: 'formal: Constraint::no_side_effects'
- id: UML-COM-003
  statement: A constraint cannot constrain itself.
  strength: must
  section: 7.8.3.6 Constraints
  applies_to: Constraint
  checkable: static
  source: 'formal: Constraint::not_apply_to_self'
- id: UML-COM-004
  statement: An element that must be owned has to have an owner.
  strength: must
  section: 7.8.6.6 Constraints
  applies_to: Element
  checkable: static
  source: 'formal: Element::has_owner'
- id: UML-COM-005
  statement: An element cannot own itself, directly or through a chain of owned elements.
  strength: must
  section: 7.8.6.6 Constraints
  applies_to: Element
  checkable: static
  source: 'formal: Element::not_own_self'
- id: UML-COM-006
  statement: The element being imported must be public or have no visibility.
  strength: must
  section: 7.8.7.7 Constraints
  applies_to: ElementImport
  checkable: static
  source: 'formal: ElementImport::imported_element_is_public'
- id: UML-COM-007
  statement: An element import is either public or private.
  strength: must
  section: 7.8.7.7 Constraints
  applies_to: ElementImport
  checkable: static
  source: 'formal: ElementImport::visibility_public_or_private'
- id: UML-COM-008
  statement: The upper bound must not be less than the lower bound.
  strength: must
  section: 7.8.8.8 Constraints
  applies_to: MultiplicityElement
  checkable: static
  source: 'formal: MultiplicityElement::upper_ge_lower'
- id: UML-COM-009
  statement: The lower bound must be a non-negative integer.
  strength: must
  section: 7.8.8.8 Constraints
  applies_to: MultiplicityElement
  checkable: static
  source: 'formal: MultiplicityElement::lower_ge_0'
- id: UML-COM-010
  statement: A non-literal bound expression (lower or upper) must have no side effects when evaluated.
  strength: must
  section: 7.8.8.8 Constraints
  applies_to: MultiplicityElement
  checkable: none
  source: 'formal: MultiplicityElement::value_specification_no_side_effects'
- id: UML-COM-011
  statement: A non-literal bound expression (lower or upper) must be a constant expression.
  strength: must
  section: 7.8.8.8 Constraints
  applies_to: MultiplicityElement
  checkable: partial
  source: 'formal: MultiplicityElement::value_specification_constant'
- id: UML-COM-012
  statement: If a lower value is given it must be an Integer.
  strength: must
  section: 7.8.8.8 Constraints
  applies_to: MultiplicityElement
  checkable: static
  source: 'formal: MultiplicityElement::lower_is_integer'
- id: UML-COM-013
  statement: If an upper value is given it must be an UnlimitedNatural.
  strength: must
  section: 7.8.8.8 Constraints
  applies_to: MultiplicityElement
  checkable: static
  source: 'formal: MultiplicityElement::upper_is_unlimitedNatural'
- id: UML-COM-014
  statement: A named element owned by anything other than a namespace has no visibility; an unowned one (which can only be a package) may have one.
  strength: must
  section: 7.8.9.8 Constraints
  applies_to: NamedElement
  checkable: static
  source: 'formal: NamedElement::visibility_needs_ownership'
- id: UML-COM-015
  statement: 'Defines the qualified name: when the element and all enclosing namespaces are named, it is the enclosing names plus the element''s name.'
  strength: note
  section: 7.8.9.8 Constraints
  applies_to: NamedElement
  checkable: none
  source: 'formal: NamedElement::has_qualified_name'
- id: UML-COM-016
  statement: 'Defines the qualified name: if the element or any enclosing namespace is unnamed, there is no qualified name.'
  strength: note
  section: 7.8.9.8 Constraints
  applies_to: NamedElement
  checkable: none
  source: 'formal: NamedElement::has_no_qualified_name'
- id: UML-COM-017
  statement: All members of a namespace must be told apart by name within it.
  strength: must
  section: 7.8.10.7 Constraints
  applies_to: Namespace
  checkable: static
  source: 'formal: Namespace::members_distinguishable'
- id: UML-COM-018
  statement: A namespace cannot package-import itself.
  strength: must
  section: 7.8.10.7 Constraints
  applies_to: Namespace
  checkable: static
  source: 'formal: Namespace::cannot_import_self'
- id: UML-COM-019
  statement: A namespace cannot element-import one of its own owned members.
  strength: must
  section: 7.8.10.7 Constraints
  applies_to: Namespace
  checkable: static
  source: 'formal: Namespace::cannot_import_ownedMembers'
- id: UML-COM-020
  statement: A package import is either public or private.
  strength: must
  section: 7.8.11.6 Constraints
  applies_to: PackageImport
  checkable: static
  source: 'formal: PackageImport::public_or_private'
- id: UML-COM-021
  statement: A packageable element owned by a namespace must have a visibility.
  strength: must
  section: 7.8.12.6 Constraints
  applies_to: PackageableElement
  checkable: static
  source: 'formal: PackageableElement::namespace_needs_visibility'
- id: UML-COM-022
  statement: Every substitution in a binding must refer to a formal parameter of the bound template's signature.
  strength: must
  section: 7.8.16.5 Constraints
  applies_to: TemplateBinding
  checkable: static
  source: 'formal: TemplateBinding::parameter_substitution_formal'
- id: UML-COM-023
  statement: A binding has at most one substitution for each formal parameter of the template signature.
  strength: must
  section: 7.8.16.5 Constraints
  applies_to: TemplateBinding
  checkable: static
  source: 'formal: TemplateBinding::one_parameter_substitution'
- id: UML-COM-024
  statement: A template parameter's default must be compatible with the formal parameter.
  strength: must
  section: 7.8.17.6 Constraints
  applies_to: TemplateParameter
  checkable: partial
  source: 'formal: TemplateParameter::must_be_compatible'
- id: UML-COM-025
  statement: An actual parameter must be compatible with its formal parameter (a class parameter takes a class, for example).
  strength: must
  section: 7.8.18.5 Constraints
  applies_to: TemplateParameterSubstitution
  checkable: partial
  source: 'formal: TemplateParameterSubstitution::must_be_compatible'
- id: UML-COM-026
  statement: Parametered elements are either owned by their template parameters or owned by the templated element.
  strength: must
  section: 7.8.19.6 Constraints
  applies_to: TemplateSignature
  checkable: static
  source: 'formal: TemplateSignature::own_elements'
- id: UML-COM-027
  statement: The names of a template signature's parameters must be unique.
  strength: must
  section: 7.8.19.6 Constraints
  applies_to: TemplateSignature
  checkable: static
  source: 'formal: TemplateSignature::unique_parameters'
- id: UML-VAL-001
  statement: A duration with no expression must have exactly one observation, and it must be a duration observation.
  strength: must
  section: 8.6.1.5 Constraints
  applies_to: Duration
  checkable: static
  source: 'formal: Duration::no_expr_requires_observation'
- id: UML-VAL-002
  statement: The first-event flag is given twice when the constraint has two constrained elements, and not at all otherwise.
  strength: must
  section: 8.6.2.6 Constraints
  applies_to: DurationConstraint
  checkable: static
  source: 'formal: DurationConstraint::first_event_multiplicity'
- id: UML-VAL-003
  statement: A duration constraint constrains one or two elements.
  strength: must
  section: 8.6.2.6 Constraints
  applies_to: DurationConstraint
  checkable: static
  source: 'formal: DurationConstraint::has_one_or_two_constrainedElements'
- id: UML-VAL-004
  statement: The first-event flag is given twice when the observation has two events, and not at all otherwise.
  strength: must
  section: 8.6.4.6 Constraints
  applies_to: DurationObservation
  checkable: static
  source: 'formal: DurationObservation::first_event_multiplicity'
- id: UML-VAL-005
