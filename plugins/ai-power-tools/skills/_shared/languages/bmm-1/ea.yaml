# EA facts for the Business Motivation Model 1.3 (language file bmm-1).
# Measured on EA 17.1 build 1716; see `harvest` for the source of each fact. Examples elsewhere use Westbrook Bank (fictitious).
language: bmm-1
technology: BMM
display_name: Business Motivation Model
profile: BMM
stereotype_prefix: ''
stereotype_storage: t_object.Stereotype and t_connector.Stereotype hold the bare name (Goal, Governs); the qualified form BMM::<name>
  is the FQName in the t_xref row named Stereotypes. Create with type BMM::<name>.
measured_on: EA 17.1 build 1716, 2026-10-20
diagram_types:
  none-in-standard:
    note: BMM defines no diagram types or notation (language.yaml diagram_types). EA's one diagram type is below.
  BMM Diagram:
    ea_name: BMM::BMM Diagram
    base: Custom
    stereotype_prefix: ''
    layout_style: not-harvested
    stored_as: t_diagram.Diagram_Type = Custom; StyleEx contains MDGDgm=BMM::BMM Diagram
    opens_with: the BMM toolbox pages (the toolbox switch was observed in a probe)
