# GENERATED by tools/gen_conventions.py. Do not edit: CI and the plugin build fail on any
# difference. Sizes, spacing, and vocabulary come from the layout standard on the language
# shelf. EA's names come from `layout_map` in this folder's ea.yaml. To change a value,
# change the source and run `python tools/gen_conventions.py`.

technology: UML
display_name: UML 2.5 (EA base notation)
stereotype_prefix: ''
notes: |
  Each EA diagram type here draws the guide diagram type named on its `guide` line. This map has no entry for EA's Sequence, Collaboration (the guide's communication diagram), InteractionOverview, or Profile.

  Analysis and Custom are EA's own diagram types. The guide has no such types, so they are kept from the earlier conventions, and this file didn't measure them.

  Two sizes differ from the guide on purpose. On a class diagram an Activity is a box, where the guide says container, because it's drawn there as a classifier and holds no nodes. On a package diagram the default is a large box, where the guide's Package is a container, because a package there is drawn as a tile.

  The route names are conventions, not measurements: nothing here maps EA's stored route numbers to them.
diagram_types:
  Logical:
    base: Logical
    grammar: graph
    title: frame-header
    sizing:
      default:
        w: 100
        h: 70
      Activity:
        w: 100
        h: 70
      Actor:
        w: 45
        h: 90
      Package:
        w: 150
        h: 90
    spacing:
