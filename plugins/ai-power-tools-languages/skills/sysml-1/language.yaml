  not_specified: [ElementPropertyPath, DirectedRelationshipPropertyPath, ChangeStructuralFeatureEvent, AcceptChangeStructuralFeatureEventAction, AbstractRequirement, VerdictKind, SysMLDiagramElement, SysMLDiagramWithAssociations, SysMLStructureDiagram, SysMLBehaviorDiagram]
constraints:
- {id: SYSML-MOD-001, statement: The general classifier of a conform relationship is a viewpoint., strength: must, section: '7.3.2.1 [1]', checkable: static, category: MOD}
- {id: SYSML-MOD-002, statement: The specific classifier of a conform relationship is a view., strength: must, section: '7.3.2.1 [2]', checkable: static, category: MOD}
- {id: SYSML-MOD-003, statement: The client of an expose relationship is a view., strength: must, section: '7.3.2.3 [1]', checkable: static, category: MOD}
- {id: SYSML-MOD-004, statement: A view conforms to a single viewpoint., strength: must, section: '7.3.2.7 [1]', checkable: static, category: MOD}
- {id: SYSML-MOD-005, statement: 'A view''s viewpoint, and its stakeholders, are derived from the general classifier of the conform generalization for which the view is the specific classifier.', strength: must, section: '7.3.2.7 [2], [3]', checkable: partial, category: MOD}
- {id: SYSML-MOD-006, statement: The methods of a viewpoint are the methods of the operations on the viewpoint that carry the create marking., strength: must, section: '7.3.2.8 [1]', checkable: partial, category: MOD}
- {id: SYSML-MOD-007, statement: A viewpoint owns at least one operation named "View" that carries the create marking., strength: must, section: '7.3.2.8 [2]', checkable: static, category: MOD}
- {id: SYSML-MOD-008, statement: 'An element group owns nothing: its members are the annotated elements of its comment, an element can be in any number of groups, and being a member of a group that is a member of another group does not make the element a member of the other group.', strength: note, section: 7.3.2.2, checkable: none, category: MOD}
- {id: SYSML-MOD-009, statement: 'A group asserts that its criterion applies to each member as a model element; it says nothing about instances or values of that element, or about related elements, unless the criterion text says so.', strength: note, section: 7.3.2.2, checkable: none, category: MOD}
- {id: SYSML-MOD-010, statement: 'A rationale or problem is attached to any other model element in the way a comment is, including to a relationship.', strength: note, section: 7.3.2.4; 7.3.2.5, checkable: none, category: MOD}
- {id: SYSML-MOD-011, statement: 'Views and viewpoints follow ISO 42010: a viewpoint frames stakeholder concerns and gives the method; a view is the model element standing for the artifact, which itself may live outside the model.', strength: note, section: 7.1.1, checkable: none, category: MOD}
- {id: SYSML-BLK-001, statement: An association whose two ends are both typed by blocks has exactly two ends., strength: must, section: '8.3.2.4 [1]', checkable: static, category: BLK}
- {id: SYSML-BLK-002, statement: 'A connector owned by a block has exactly two ends. This covers binding connectors, which are not typed by an association.', strength: must, section: '8.3.2.4 [2]', checkable: static, category: BLK}
- {id: SYSML-BLK-003, statement: A property typed by a block and owned by an association has no name and is not a navigable end owned by the association., strength: must, section: '8.3.2.4 [3]', checkable: static, category: BLK}
- {id: SYSML-BLK-004, statement: 'A property typed by a block is an end of an association. An inverse end, owned by another block or by the association, always exists so the inverse multiplicity can be recorded.', strength: must, section: '8.3.2.4 [4]', checkable: static, category: BLK}
- {id: SYSML-BLK-005, statement: A property owned by a block or value type and typed by a value type has composite aggregation., strength: must, section: '8.3.2.4 [6]', checkable: static, category: BLK}
- {id: SYSML-BLK-006, statement: 'Within an instance of a block, the values of properties with composite aggregation form an acyclic graph: an instance never contains itself through a chain of composite properties.', strength: must, section: '8.3.2.4 [7]', checkable: runtime, category: BLK}
- {id: SYSML-BLK-007, statement: Every classifier that specializes a block is itself a block (or a specialization of a block)., strength: must, section: '8.3.2.4 [8]', checkable: static, category: BLK}
- {id: SYSML-BLK-008, statement: 'SysML removes two UML rules about connectors: that the elements attached to connector ends are roles of the owning classifier or ports of such roles, and that the part with a port is not itself a port. Connector ends may therefore reach nested properties.', strength: note, section: '8.3.2.4 [5], [9]', checkable: none, category: BLK}
- {id: SYSML-BLK-009, statement: 'The principal of an adjunct property is a connector, call action, object node, variable, parameter, submachine state or interaction use.', strength: must, section: '8.3.2.2 [1]', checkable: static, category: BLK}
- {id: SYSML-BLK-010, statement: An adjunct property has the same name as its principal., strength: must, section: '8.3.2.2 [2]', checkable: static, category: BLK}
- {id: SYSML-BLK-011, statement: An adjunct property whose principal is a connector or a call action is composite., strength: must, section: '8.3.2.2 [3]', checkable: static, category: BLK}
- {id: SYSML-BLK-012, statement: 'An adjunct property is owned, at least indirectly, by an element that owns its principal, or by a specialization of that element.', strength: must, section: '8.3.2.2 [4]', checkable: static, category: BLK}
- {id: SYSML-BLK-013, statement: 'An adjunct property whose principal is a connector, object node, variable or parameter has the same type as the principal or one of the principal''s generalizations.', strength: must, section: '8.3.2.2 [5]', checkable: static, category: BLK}
- {id: SYSML-BLK-014, statement: A connector that is the principal of an adjunct property is typed by an association block., strength: must, section: '8.3.2.2 [6]', checkable: static, category: BLK}
- {id: SYSML-BLK-015, statement: 'When both adjunct property and connector property apply to a property, they have the same principal and connector.', strength: must, section: '8.3.2.2 [7]', checkable: static, category: BLK}
- {id: SYSML-BLK-016, statement: 'An adjunct property whose principal is a call action is composite, is typed by the invoked behavior or a generalization of it (for an operation call, one that generalizes every behavior that might be dispatched), and has upper multiplicity one when the invoked behavior is not reentrant.', strength: must, section: '8.3.2.2 [8]', checkable: static, category: BLK}
- {id: SYSML-BLK-017, statement: An adjunct property whose principal is an object node has lower multiplicity zero and an upper multiplicity at least that of the node's upper bound., strength: must, section: '8.3.2.2 [9]', checkable: static, category: BLK}
- {id: SYSML-BLK-018, statement: 'An adjunct property whose principal is a variable or parameter has a lower multiplicity no greater than, and an upper multiplicity no less than, that of the principal.', strength: must, section: '8.3.2.2 [10]', checkable: static, category: BLK}
- {id: SYSML-BLK-019, statement: 'An adjunct property whose principal is an interaction use or submachine state is composite and typed by the invoked interaction or state machine, or a generalization of it.', strength: must, section: '8.3.2.2 [11]', checkable: static, category: BLK}
- {id: SYSML-BLK-020, statement: 'The two ends of a binding connector have the same type or compatible types, so that equality of their values can be defined.', strength: must, section: '8.3.2.3 [1]', checkable: partial, category: BLK}
- {id: SYSML-BLK-021, statement: 'A property with a bound reference is the role of an end of at least one binding connector, or is generalized by such a property through redefinition.', strength: must, section: '8.3.2.5 [1]', checkable: static, category: BLK}
- {id: SYSML-BLK-022, statement: The bound end of a bound reference is the end of that binding connector opposite the property., strength: must, section: '8.3.2.5 [2]', checkable: static, category: BLK}
- {id: SYSML-BLK-023, statement: 'The role of the bound end is reachable by navigation from instances of the owning block, and is neither the bound reference itself nor a property related to it by redefinition.', strength: must, section: '8.3.2.5 [3]', checkable: partial, category: BLK}
- {id: SYSML-BLK-024, statement: 'The last element of a bound reference''s binding path is the role of its bound end; the earlier elements are the property path of the nested connector end, if any.', strength: must, section: '8.3.2.5 [4]', checkable: static, category: BLK}
- {id: SYSML-BLK-025, statement: A bound reference is a reference property or a value property., strength: must, section: '8.3.2.5 [5]', checkable: static, category: BLK}
- {id: SYSML-BLK-026, statement: A bound reference with upper multiplicity greater than one is ordered and non-unique., strength: must, section: '8.3.2.5 [6]', checkable: static, category: BLK}
- {id: SYSML-BLK-027, statement: A bound reference is not applied to a property that is related by redefinition to another property with a bound reference., strength: must, section: '8.3.2.5 [7]', checkable: static, category: BLK}
- {id: SYSML-BLK-028, statement: 'The binding connector of a bound reference does not have the same property, or properties related by redefinition, at both ends.', strength: must, section: '8.3.2.5 [8]', checkable: static, category: BLK}
- {id: SYSML-BLK-029, statement: A classifier behavior property is applied only to properties owned (not inherited) by blocks that have a classifier behavior., strength: must, section: '8.3.2.6 [1]', checkable: static, category: BLK}
- {id: SYSML-BLK-030, statement: A classifier behavior property is composite., strength: must, section: '8.3.2.6 [2]', checkable: static, category: BLK}
- {id: SYSML-BLK-031, statement: A classifier behavior property is typed by the classifier behavior of its owning block or a generalization of it., strength: must, section: '8.3.2.6 [3]', checkable: static, category: BLK}
- {id: SYSML-BLK-032, statement: A connector property is applied only to properties of blocks., strength: must, section: '8.3.2.7 [1]', checkable: static, category: BLK}
- {id: SYSML-BLK-033, statement: The connector of a connector property is owned or inherited by a block that owns the property., strength: must, section: '8.3.2.7 [2]', checkable: static, category: BLK}
- {id: SYSML-BLK-034, statement: A connector property is composite., strength: must, section: '8.3.2.7 [3]', checkable: static, category: BLK}
- {id: SYSML-BLK-035, statement: The type of the connector of a connector property is an association block., strength: must, section: '8.3.2.7 [4]', checkable: static, category: BLK}
- {id: SYSML-BLK-036, statement: A connector property has the same name and type as its connector., strength: must, section: '8.3.2.7 [5]', checkable: static, category: BLK}
- {id: SYSML-BLK-037, statement: A directed relationship with a property path has a source context when its source is a property and has none otherwise; likewise for the target context., strength: must, section: '8.3.2.8 [1], [2]', checkable: static, category: BLK}
- {id: SYSML-BLK-038, statement: A directed relationship's source (target) is a property when its source (target) property path has a value., strength: must, section: '8.3.2.8 [3], [4]', checkable: static, category: BLK}
- {id: SYSML-BLK-039, statement: The first property of a source or target property path is owned by the corresponding context or one of its generalizations., strength: must, section: '8.3.2.8 [5], [6]', checkable: static, category: BLK}
- {id: SYSML-BLK-040, statement: 'Each later property of a property path is owned by the block or value type that types the preceding property, or a generalization of it.', strength: must, section: '8.3.2.8 [7]; 8.3.2.10 [1]', checkable: static, category: BLK}
- {id: SYSML-BLK-041, statement: The type of the last property of a source (target) property path owns or inherits the source (target) of the relationship., strength: must, section: '8.3.2.8 [8], [9]', checkable: static, category: BLK}
- {id: SYSML-BLK-042, statement: A distributed property is applied only to properties of blocks or value types., strength: must, section: '8.3.2.9 [1]', checkable: static, category: BLK}
- {id: SYSML-BLK-043, statement: An end path multiplicity is applied only to properties related by redefinition to a property that has a bound reference., strength: must, section: '8.3.2.11 [1]', checkable: static, category: BLK}
- {id: SYSML-BLK-044, statement: The lower value of an end path multiplicity is not negative., strength: must, section: '8.3.2.11 [2]', checkable: static, category: BLK}
- {id: SYSML-BLK-045, statement: 'The first property of a nested connector end''s path is owned by the block that owns the connector, or one of its generalizations.', strength: must, section: '8.3.2.12 [1]', checkable: static, category: BLK}
- {id: SYSML-BLK-046, statement: The type of the last property of a nested connector end's path owns or inherits the property that is the role of the connector end., strength: must, section: '8.3.2.12 [2]', checkable: static, category: BLK}
- {id: SYSML-BLK-047, statement: A nested connector end is applied only to connector ends., strength: must, section: '8.3.2.12 [3]', checkable: static, category: BLK}
- {id: SYSML-BLK-048, statement: A participant property is applied only to properties of association blocks., strength: must, section: '8.3.2.13 [1]', checkable: static, category: BLK}
- {id: SYSML-BLK-049, statement: A participant property is not a member end of an association., strength: must, section: '8.3.2.13 [2]', checkable: static, category: BLK}
- {id: SYSML-BLK-050, statement: A participant property has aggregation none., strength: must, section: '8.3.2.13 [3]', checkable: static, category: BLK}
- {id: SYSML-BLK-051, statement: The end of a participant property is a member end of the association block that owns the property., strength: must, section: '8.3.2.13 [4]', checkable: static, category: BLK}
- {id: SYSML-BLK-052, statement: A participant property has the same type as the end it refers to., strength: must, section: '8.3.2.13 [5]', checkable: static, category: BLK}
- {id: SYSML-BLK-053, statement: A participant property has multiplicity 1., strength: must, section: '8.3.2.13 [6]', checkable: static, category: BLK}
- {id: SYSML-BLK-054, statement: A property-specific type is the type of one and only one property., strength: must, section: '8.3.2.14 [1]', checkable: static, category: BLK}
- {id: SYSML-BLK-055, statement: A property-specific type has no name., strength: must, section: '8.3.2.14 [2]', checkable: static, category: BLK}
- {id: SYSML-BLK-056, statement: A property-specific type specializes at most the single classifier that was named as its starting type; with no starting type it specializes nothing., strength: must, section: 8.3.2.14, checkable: static, category: BLK}
- {id: SYSML-BLK-057, statement: 'Four kinds of property are recognized: part (typed by a block, composite), reference (typed by a block, not composite), value (typed by a value type, always composite) and constraint (typed by a constraint block). Ports are a further category of property.', strength: note, section: 8.3.2.4; 8.3.1.2.1, checkable: none, category: BLK}
- {id: SYSML-BLK-058, statement: 'A block''s internal connectors are always available. An encapsulated block (isEncapsulated true) is a black box: a part typed by it connects only through its ports or to its outer boundary; otherwise connections may reach its internal structure through nested connector ends.', strength: note, section: 8.3.2.4, checkable: partial, category: BLK}
- {id: SYSML-BLK-059, statement: Nested connector ends do not follow strict encapsulation; they are for cases where adding intermediate properties at each level is not feasible. The connector is owned by the nearest block that owns both ends., strength: note, section: 8.3.1.2.6, checkable: none, category: BLK}
- {id: SYSML-BLK-060, statement: 'If a property of a block has initial values for properties of its type, its default value is an instance value that refers to an unnamed instance specification owned by the package that owns the outermost containing block.', strength: must, section: 8.3.2.4 (initial values), checkable: partial, category: BLK}
- {id: SYSML-VAL-001, statement: Every classifier that specializes a value type is itself a value type., strength: must, section: '8.3.2.15 [1]', checkable: static, category: VAL}
- {id: SYSML-VAL-002, statement: The unit of a value type is an instance specification classified by Unit (from the unit and quantity kind library) or a specialization of it., strength: must, section: '8.3.2.15 [2]', checkable: static, category: VAL}
- {id: SYSML-VAL-003, statement: The quantity kind of a value type is an instance specification classified by QuantityKind or a specialization of it., strength: must, section: '8.3.2.15 [3]', checkable: static, category: VAL}
- {id: SYSML-VAL-004, statement: The only valid use of a quantity kind instance is to be referenced by the quantity kind of a value type or of a unit; the only valid use of a unit instance is to be referenced by the unit of a value type., strength: must, section: 8.3.3.2.1; 8.3.3.2.2, checkable: static, category: VAL}
- {id: SYSML-VAL-005, statement: Two instance specifications represent the same unit (or quantity kind) if and only if both have a definition URI and the two are equal., strength: note, section: 8.3.3.2.1; 8.3.3.2.2, checkable: partial, category: VAL}
- {id: SYSML-VAL-006, statement: 'A value type may state a quantity kind without a unit, to type a value in a form independent of any unit.', strength: note, section: 8.3.2.15, checkable: none, category: VAL}
- {id: SYSML-VAL-007, statement: 'Unqualified Boolean, Integer, Real and String mean the UML primitive types when defining a SysML extension, and the value types of the primitive value type library everywhere else.', strength: note, section: '4.3', checkable: none, category: VAL}
- {id: SYSML-VAL-008, statement: 'A value type may carry its own properties and operations, as a UML data type can, and may be structured.', strength: note, section: 8.3.2.15, checkable: none, category: VAL}
- {id: SYSML-PORT-001, statement: 'A port is not both a proxy port and a full port, even when one of the two markings is on a subsetted or redefined port.', strength: must, section: '9.3.2.8 [1]; 9.3.2.12 [1]', checkable: static, category: PORT}
- {id: SYSML-PORT-002, statement: A proxy port is typed only by an interface block., strength: must, section: '9.3.2.12 [2]', checkable: static, category: PORT}
- {id: SYSML-PORT-003, statement: Ports owned by the type of a proxy port are proxy ports., strength: must, section: '9.3.2.12 [3]', checkable: static, category: PORT}
- {id: SYSML-PORT-004, statement: 'A completely specified proxy port is connected to internal parts or is behavioral. A block may declare a non-behavioral proxy port without internal connectors, to be completed in a specialization.', strength: should, section: 9.3.2.12, checkable: partial, category: PORT}
- {id: SYSML-PORT-005, statement: 'When a proxy port is connected to a single internal part, the connector is a binding connector or has the same semantics as one.', strength: must, section: 9.3.2.12, checkable: partial, category: PORT}
- {id: SYSML-PORT-006, statement: A full port is not behavioral., strength: must, section: '9.3.2.8 [3]', checkable: static, category: PORT}
- {id: SYSML-PORT-007, statement: A full port is not conjugated., strength: must, section: '9.3.2.8 [4]', checkable: static, category: PORT}
- {id: SYSML-PORT-008, statement: 'A binding connector does not link a full port, directly or through other binding connectors, to another composite property of the block that owns the full port (or of that block''s generalizations or specializations), unless that property is a non-full port.', strength: must, section: '9.3.2.8 [2]', checkable: static, category: PORT}
- {id: SYSML-PORT-009, statement: 'An interface block does not own or inherit behaviors, does not have classifier behaviors, and has no methods for its behavioral features.', strength: must, section: '9.3.2.9 [1]', checkable: static, category: PORT}
- {id: SYSML-PORT-010, statement: An interface block has no composite properties other than ports., strength: must, section: '9.3.2.9 [2]', checkable: static, category: PORT}
- {id: SYSML-PORT-011, statement: Ports owned by an interface block are typed only by interface blocks., strength: must, section: '9.3.2.9 [3]', checkable: static, category: PORT}
- {id: SYSML-PORT-012, statement: 'A trigger on a nested port has exactly one port, and that port is not a full port; the ports in its nested port path are not full ports.', strength: must, section: '9.3.2.13 [1], [2]', checkable: static, category: PORT}
- {id: SYSML-PORT-013, statement: 'The first port in a trigger''s nested port path is owned by a block in which the trigger is used, or a generalization of it; each later port is owned by the type of the preceding one; the type of the last port owns or inherits the trigger''s port.', strength: must, section: '9.3.2.13 [3], [4], [5]', checkable: static, category: PORT}
- {id: SYSML-PORT-014, statement: The nested-port trigger extension is applied only to triggers., strength: must, section: '9.3.2.13 [6]', checkable: static, category: PORT}
- {id: SYSML-PORT-015, statement: An invocation on a nested port has a value for its port property., strength: must, section: '9.3.2.10 [1]', checkable: static, category: PORT}
- {id: SYSML-PORT-016, statement: 'The first port in an invocation''s nested port path is owned by a block that types the target pin, or a generalization of it; each later port is owned by the type of the preceding one; the type of the last port owns or inherits the invocation''s port.', strength: must, section: '9.3.2.10 [2], [3], [4]', checkable: static, category: PORT}
- {id: SYSML-PORT-017, statement: The nested-port invocation extension is applied only to invocation actions., strength: must, section: '9.3.2.10 [5]', checkable: static, category: PORT}
- {id: SYSML-PORT-018, statement: Invocations intended to leave the executing object are sent to it on a proxy port; invocations intended for a target object are sent to a port of that object., strength: note, section: 9.3.2.10, checkable: none, category: PORT}
- {id: SYSML-PORT-019, statement: 'A port with a type that has ports nests those ports; a conjugated port reverses the direction of flow properties and the meaning of provided and required, but its nested ports behave as if not conjugated.', strength: note, section: 9.1.2; 9.3.2.2, checkable: none, category: PORT}
- {id: SYSML-PORT-020, statement: Items going to or from a behavioral port go to or from the owning block; items going to a non-behavioral port go to the port itself (full port) or to the internal parts it is connected to (proxy port)., strength: note, section: 9.3.2.7, checkable: none, category: PORT}
- {id: SYSML-FLOW-001, statement: 'A flow property is typed by a value type, block or signal.', strength: must, section: '9.3.2.7 [1]', checkable: static, category: FLOW}
- {id: SYSML-FLOW-002, statement: 'Flow between ends of a connector occurs only between matching flow properties: the directions match and the target type is the same as, or a generalization of, the source type. If several flow properties match by direction and type, their names must also match; if several still match, no flow occurs.', strength: must, section: 9.3.2.7, checkable: partial, category: FLOW}
- {id: SYSML-FLOW-003, statement: An "in" flow property is not modified by the owning or realizing block or blocks it contains; an "out" flow property is modified only by them; "inout" can be used either way., strength: must, section: 9.3.2.7, checkable: runtime, category: FLOW}
- {id: SYSML-FLOW-004, statement: 'For items to flow through a proxy port, flow property directions are the same on the proxy port and on the owning block or internal part it stands in for.', strength: must, section: 9.3.2.7, checkable: partial, category: FLOW}
- {id: SYSML-FLOW-005, statement: 'A directed feature is applied only to behavioral features, or to properties that are not flow properties.', strength: must, section: '9.3.2.4 [1]', checkable: static, category: FLOW}
- {id: SYSML-FLOW-006, statement: An operation that is not provided is not associated with a behavior as its method., strength: must, section: '9.3.2.4 [2]', checkable: static, category: FLOW}
- {id: SYSML-FLOW-007, statement: 'A single provided behavioral feature matches each required one: same kind (operation or reception), same names including parameter names in order, same parameter directions in order, provided in-parameter types the same or more general, provided out and return types the same or more specialized, inout types the same, and corresponding multiplicity, order and uniqueness conditions, with provided preconditions the same or more general and provided body conditions and postconditions the same or more specialized.', strength: must, section: 9.3.2.4, checkable: partial, applies_when: required features are used across a connector, category: FLOW}
- {id: SYSML-FLOW-008, statement: 'A provided non-flow property matches a required one when they have the same name; for reading, types, multiplicities, uniqueness and ordering match as out parameters do; for writing, as in parameters do; for both, they are the same.', strength: must, section: 9.3.2.4, checkable: partial, applies_when: required features are used across a connector, category: FLOW}
- {id: SYSML-FLOW-009, statement: 'Meanings of "provided" and "required", and of "in" and "out", are swapped for conjugated ports.', strength: note, section: 9.3.2.4; 9.3.2.5; 9.3.2.6, checkable: none, category: FLOW}
- {id: SYSML-FLOW-010, statement: A connector or association (possibly inherited) exists between the source and the target of an item flow., strength: must, section: '9.3.2.11 [1]', checkable: static, category: FLOW}
- {id: SYSML-FLOW-011, statement: 'An item property is typed by a value type, block or signal.', strength: must, section: '9.3.2.11 [2]', checkable: static, category: FLOW}
- {id: SYSML-FLOW-012, statement: An item property is a property of the common (possibly indirect) owner of the item flow's source and target., strength: must, section: '9.3.2.11 [3]', checkable: static, category: FLOW}
- {id: SYSML-FLOW-013, statement: An item property has no value when the item flow is realized by an association., strength: must, section: '9.3.2.11 [4]', checkable: static, category: FLOW}
- {id: SYSML-FLOW-014, statement: 'When an item flow has an item property, one of its conveyed classifiers is the type of that property.', strength: must, section: '9.3.2.11 [5]', checkable: static, category: FLOW}
- {id: SYSML-FLOW-015, statement: 'When an item flow has an item property, the item flow has the same name as that property.', strength: must, section: '9.3.2.11 [6]', checkable: static, category: FLOW}
- {id: SYSML-FLOW-016, statement: 'An item flow on a connector is compatible with the flow properties of the usages at each end: its direction fits their directions, each conveyed classifier is the same as, a specialization of, or a generalization of at least one flow property type at each end, and the target flow property type is the same as or a generalization of the more specialized of the item flow classifier and the source flow property type.', strength: must, section: 9.3.2.11, checkable: partial, applies_when: the connector ends have flow properties, category: FLOW}
- {id: SYSML-FLOW-017, statement: Flow properties say what can flow in or out of a block; item flows say what does flow between particular usages. This lets one block be connected in different ways in different contexts., strength: note, section: 9.1.4, checkable: none, category: FLOW}
- {id: SYSML-FLOW-018, statement: The structural feature of a change structural feature event is not static., strength: must, section: '9.3.2.3 [1]', checkable: static, category: FLOW}
- {id: SYSML-FLOW-019, statement: The structural feature of a change structural feature event has exactly one featuring classifier., strength: must, section: '9.3.2.3 [2]', checkable: static, category: FLOW}
- {id: SYSML-FLOW-020, statement: 'An accept change structural feature event action has exactly one trigger, and its event is a change structural feature event.', strength: must, section: '9.3.2.1 [1]', checkable: static, category: FLOW}
- {id: SYSML-FLOW-021, statement: Such an action has two result pins with the type and ordering of the structural feature and a compatible multiplicity., strength: must, section: '9.3.2.1 [2]', checkable: static, category: FLOW}
- {id: SYSML-FLOW-022, statement: 'The structural feature of the trigger event is owned or inherited by the context of the behavior that contains the action, and its visibility allows the object performing the action to access it.', strength: must, section: '9.3.2.1 [3], [4]', checkable: static, category: FLOW}
- {id: SYSML-FLOW-023, statement: 'SysML removes the UML rule that an accept event action has no output pins when its triggers are only change events, for actions that carry the change structural feature extension.', strength: note, section: '9.3.2.1 [5]', checkable: none, category: FLOW}
- {id: SYSML-CNS-001, statement: 'A constraint block owns only: properties that define its constraint parameters, constraint properties holding nested usages of constraint blocks, binding connectors between internally nested parameters, constraint expressions that interpret it, and general-purpose model management and crosscutting elements.', strength: must, section: '10.3.2.1 [1]', checkable: static, category: CNS}
- {id: SYSML-CNS-002, statement: Every classifier that specializes a constraint block is itself a constraint block., strength: must, section: '10.3.2.1 [2]', checkable: static, category: CNS}
- {id: SYSML-CNS-003, statement: Every property of a block that is typed by a constraint block has composite aggregation., strength: must, section: '10.3.2.1 [3]', checkable: static, category: CNS}
- {id: SYSML-CNS-004, statement: 'All properties of a constraint block are constraint parameters, except constraint properties that hold nested usages of constraint blocks.', strength: must, section: 10.1; 10.3.2.1, checkable: static, category: CNS}
- {id: SYSML-CNS-005, statement: 'On a parametric diagram, every property other than the constraint properties is either bound directly to a constraint parameter or contains a property that is, through any number of levels of containment.', strength: must, section: 10.3.1.2, checkable: partial, category: CNS}
- {id: SYSML-CNS-006, statement: 'SysML names and structures constraints but specifies no machine-interpretable language for them; the interpretation of a constraint block must be supplied, and constraint blocks are non-causal (they do not choose dependent and independent variables).', strength: note, section: '10.1', checkable: none, category: CNS}
- {id: SYSML-CNS-007, statement: The context block for the usages of constraint blocks is specified on a parametric diagram so nested property names resolve in the right namespace., strength: must, section: '10.1', checkable: partial, category: CNS}
- {id: SYSML-ACT-001, statement: A behavior or operation with the control operator marking has at least one parameter typed by ControlValue; one without the marking has none., strength: must, section: '11.3.2.2 [1]', checkable: static, category: ACT}
- {id: SYSML-ACT-002, statement: A behavior is a control operator if it is the method of an operation that is a control operator., strength: must, section: '11.3.2.2 [2]', checkable: static, category: ACT}
- {id: SYSML-ACT-003, statement: The discrete and continuous markings are not applied to the same element., strength: must, section: '11.3.2.3 [1]', checkable: static, category: ACT}
- {id: SYSML-ACT-004, statement: The no-buffer and overwrite markings are not applied to the same element., strength: must, section: '11.3.2.4 [1]; 11.3.2.5 [1]', checkable: static, category: ACT}
- {id: SYSML-ACT-005, statement: A parameter with the optional marking has lower multiplicity zero; any other parameter in an activity has lower multiplicity greater than zero ("required")., strength: must, section: '11.3.2.6 [1]', checkable: static, category: ACT}
- {id: SYSML-ACT-006, statement: 'A probability applies only to activity edges whose source is a decision node or object node, or to output parameter sets.', strength: must, section: '11.3.2.7 [1]', checkable: static, category: ACT}
- {id: SYSML-ACT-007, statement: 'If a probability is applied to an edge, it is applied to all edges leaving the same source.', strength: must, section: '11.3.2.7 [2]', checkable: static, category: ACT}
- {id: SYSML-ACT-008, statement: 'If a probability is applied to an output parameter set, it is applied to all parameter sets of the owning behavior or operation.', strength: must, section: '11.3.2.7 [3]', checkable: static, category: ACT}
- {id: SYSML-ACT-009, statement: 'When a probability is applied to output parameter sets, every output parameter is in some parameter set.', strength: must, section: '11.3.2.7 [4]', checkable: static, category: ACT}
- {id: SYSML-ACT-010, statement: Probabilities are between zero and one inclusive and sum to one over the edges that leave the same source (or the output parameter sets of one behavior) when they are used., strength: must, section: 11.3.2.7, checkable: runtime, category: ACT}
- {id: SYSML-ACT-011, statement: A parameter with a rate is streaming., strength: must, section: '11.3.2.8 [1]', checkable: static, category: ACT}
- {id: SYSML-ACT-012, statement: The rate of a parameter is no greater than the rates of edges that enter or leave the pins and parameter nodes corresponding to it., strength: must, section: '11.3.2.8 [2]', checkable: partial, category: ACT}
- {id: SYSML-ACT-013, statement: 'The value of a rate is an instance of a classifier that is a value type or a distribution definition, and the denominator of its unit is a time unit.', strength: must, section: 11.3.2.8, checkable: partial, category: ACT}
- {id: SYSML-ACT-014, statement: An object node of type ControlValue has the control-type setting true., strength: must, section: '11.3.3.1.1 [1]', checkable: static, category: ACT}
- {id: SYSML-ACT-015, statement: 'A control value is an input or output of a control operator, which is how control acts as data; its enable literal starts a new execution and its disable literal ends an executing behavior, which can only be restarted from the beginning.', strength: note, section: 11.1.1; 11.3.3.1.1, checkable: none, category: ACT}
- {id: SYSML-ACT-016, statement: 'Activities appear on block definition diagrams as blocks. A composition association between activities means that ending the whole ends the executions of the parts, and the upper multiplicity on the part end limits concurrent synchronous executions of the invoked behavior.', strength: note, section: 11.3.1.1.1, checkable: none, category: ACT}
- {id: SYSML-ACT-017, statement: 'For object nodes that are the target of continuous flows, the no-buffer and overwrite markings have the same effect.', strength: note, section: 11.3.2.4; 11.3.2.5, checkable: none, category: ACT}
- {id: SYSML-ACT-018, statement: Rate says how many items cross an edge or parameter per time interval; it does not describe how a value changes over time. Continuous and discrete rates are independent of UML streaming., strength: note, section: 11.3.2.1; 11.3.2.8, checkable: none, category: ACT}
- {id: SYSML-BEH-001, statement: 'Of the UML interaction diagrams SysML includes only the sequence diagram; communication, interaction overview and timing diagrams are excluded.', strength: must, section: 12.1; 12.3.1.1, checkable: static, category: BEH}
- {id: SYSML-BEH-002, statement: 'Protocol state machines are excluded; the standard (behavior) state machines are used, and are sufficient to express protocols.', strength: must, section: '13.1', checkable: static, category: BEH}
- {id: SYSML-BEH-003, statement: 'Interactions, state machines and activities are classes whose instances are executions; they appear on block definition diagrams as blocks, with the activity, interaction or state machine keyword, and are associated with the behaviors they invoke and with the types of their parameters.', strength: note, section: 11.3.1.1.1; 12.3.1.2.1; 13.3.1.1.1, checkable: none, category: BEH}
- {id: SYSML-BEH-004, statement: 'The use case relationships are communication (an association between actor and use case), include, extend and generalization. A use case diagram describes how a subject is used by actors to reach a goal; the subject may be drawn as a system boundary.', strength: note, section: '14.1', checkable: none, category: BEH}
- {id: SYSML-BEH-005, statement: 'An included use case is part of the normal execution of the including use case and required for the base use case''s goals; an extending use case is optional, acts at a named extension point under a condition, and typically is not meaningful alone, while the extended use case is.', strength: note, section: 14.1; 14.4, checkable: none, category: BEH}
- {id: SYSML-BEH-006, statement: Include and extend are often subjective and may be reversed according to the modeler's approach., strength: note, section: '14.4', checkable: none, category: BEH}
- {id: SYSML-BEH-007, statement: 'A use case is realized by behaviors (activity, sequence and state machine diagrams); a package named for its top-level use case can hold the lower-level use cases as an implicit trace that complements explicit trace relationships.', strength: note, section: 14.1; 14.4, checkable: none, category: BEH}
- {id: SYSML-ALLOC-001, statement: The allocate extension is applied only to abstractions., strength: must, section: '15.3.2.1 [1]', checkable: static, category: ALLOC}
- {id: SYSML-ALLOC-002, statement: A single allocate dependency has exactly one client (from) and one supplier (to)., strength: must, section: '15.3.2.1 [2]', checkable: static, category: ALLOC}
- {id: SYSML-ALLOC-003, statement: Any more specialized form of allocation has constraints on its supplier and client as appropriate., strength: must, section: '15.3.2.1 [3]', checkable: none, category: ALLOC}
- {id: SYSML-ALLOC-004, statement: An action in an allocate activity partition is the client (from end) of an allocate dependency whose supplier (to end) is the element that the partition represents., strength: must, section: '15.3.2.2 [1]', checkable: static, category: ALLOC}
- {id: SYSML-ALLOC-005, statement: 'An allocate activity partition keeps the constraints, but not the semantics, of a UML activity partition: the represented classifier or property has no direct responsibility for invoking the behavior in the partition.', strength: must, section: '15.3.2.2 [2]', checkable: none, category: ALLOC}
- {id: SYSML-ALLOC-006, statement: 'Allocation is permitted between any two named elements and is a precursor to a more concrete relationship between them, their properties, operations or specializations.', strength: note, section: 15.3.2.1, checkable: none, category: ALLOC}
- {id: SYSML-ALLOC-007, statement: Allocation of an object flow to a connector is an allocation of usage; it implies nothing about the defining blocks of the flow or the defining associations of the connector. Allocation of control flow and of pins to ports is not specifically addressed., strength: note, section: 15.3.2.1, checkable: none, category: ALLOC}
- {id: SYSML-ALLOC-008, statement: 'In a partition name, a property is designated by a fully qualified name (with a colon) and a classifier by a simple name (no colon).', strength: should, section: '15.3.2.2 [1]', checkable: none, category: ALLOC}
- {id: SYSML-REQ-001, statement: A requirement owns no operations., strength: must, section: '16.3.2.5 [1]', checkable: static, category: REQ}
- {id: SYSML-REQ-002, statement: A requirement owns no attributes., strength: must, section: '16.3.2.5 [2]', checkable: static, category: REQ}
- {id: SYSML-REQ-003, statement: A requirement does not take part in associations., strength: must, section: '16.3.2.5 [3]', checkable: static, category: REQ}
- {id: SYSML-REQ-004, statement: A requirement does not take part in generalizations., strength: must, section: '16.3.2.5 [4]', checkable: static, category: REQ}
- {id: SYSML-REQ-005, statement: A classifier nested in a requirement is also a requirement., strength: must, section: '16.3.2.5 [5]', checkable: static, category: REQ}
- {id: SYSML-REQ-006, statement: A requirement is not used to type any other model element., strength: must, section: '16.3.2.5 [6]', checkable: static, category: REQ}
- {id: SYSML-REQ-007, statement: Every requirement has a text and a unique id., strength: must, section: 16.3.2.1 (attributes), checkable: static, category: REQ}
- {id: SYSML-REQ-008, statement: By default a compound requirement is satisfied only if all its sub-requirements are; the compound requirement may say otherwise., strength: note, section: 16.3.2.5, checkable: none, category: REQ}
- {id: SYSML-REQ-009, statement: A copy dependency is created only between two named elements that carry a requirement kind., strength: must, section: '16.3.2.2 [1]', checkable: static, category: REQ}
- {id: SYSML-REQ-010, statement: The text of the client of a copy dependency is a read-only copy of the text of its supplier., strength: must, section: '16.3.2.2 [2]', checkable: static, category: REQ}
- {id: SYSML-REQ-011, statement: The copy rule applies recursively to all sub-requirements., strength: must, section: '16.3.2.2 [3]', checkable: static, category: REQ}
- {id: SYSML-REQ-012, statement: The supplier of a derive-requirement dependency is a requirement kind., strength: must, section: '16.3.2.3 [1]', checkable: static, category: REQ}
- {id: SYSML-REQ-013, statement: The client of a derive-requirement dependency is a requirement kind., strength: must, section: '16.3.2.3 [2]', checkable: static, category: REQ}
- {id: SYSML-REQ-014, statement: A refine dependency has exactly one client and one supplier., strength: must, section: '16.3.2.4 [2]', checkable: static, category: REQ}
- {id: SYSML-REQ-015, statement: A refine marking is applied only to dependencies., strength: must, section: '16.3.2.4 [1]', checkable: static, category: REQ}
- {id: SYSML-REQ-016, statement: The supplier of a satisfy dependency is a requirement or a specialization of one., strength: must, section: '16.3.2.7 [1]', checkable: static, category: REQ}
- {id: SYSML-REQ-017, statement: A trace marking is applied only to dependencies., strength: must, section: '16.3.2.8 [1]', checkable: static, category: REQ}
- {id: SYSML-REQ-018, statement: A trace dependency has exactly one client and one supplier., strength: must, section: '16.3.2.8 [2]', checkable: static, category: REQ}
- {id: SYSML-REQ-019, statement: The supplier of a verify dependency is a requirement or a specialization of one., strength: must, section: '16.3.2.9 [1]', checkable: static, category: REQ}
- {id: SYSML-REQ-020, statement: The type of the return parameter of a test case is VerdictKind., strength: must, section: '16.3.2.6 [1]', checkable: static, category: REQ}
- {id: SYSML-REQ-021, statement: The trace relationship has weak semantics and is not recommended in combination with the other requirement relationships., strength: should, section: '16.1', checkable: none, category: REQ}
- {id: SYSML-REQ-022, statement: 'A rationale can be attached to a requirement or to any requirement relationship, for example to a satisfy relationship to point to a trade study, or as an alternative way to record a verify relationship.', strength: note, section: '16.1', checkable: none, category: REQ}
- {id: SYSML-REQ-023, statement: 'Taxonomies of requirement kinds are created by defining specializations of the requirement; the standard gives functional, interface, performance, physical and design constraint kinds only as a non-normative example.', strength: note, section: 16.1; E.3, checkable: none, category: REQ}
- {id: SYSML-DIAG-001, statement: 'Every SysML diagram has a frame, a heading and a contents area (the frame is optional in UML, required in SysML).', strength: must, section: 'Annex A.1; B.2.4 [1], [2]', checkable: partial, category: DIAG}
- {id: SYSML-DIAG-002, statement: The frame of a diagram designates a model element that is the default namespace of the elements inside it; an element from another namespace is shown with a qualified name., strength: must, section: 'Annex A.1; B.2.4 [3]', checkable: partial, category: DIAG}
- {id: SYSML-DIAG-003, statement: An activity diagram is framed by an activity., strength: must, section: 'Annex A.1; B.2.1 [1]', checkable: static, category: DIAG}
- {id: SYSML-DIAG-004, statement: A block definition diagram is framed by a block (including a constraint block) or a package., strength: must, section: 'Annex A.1; B.2.3 [1]', checkable: static, category: DIAG}
- {id: SYSML-DIAG-005, statement: An internal block diagram is framed by a block (including a constraint block); the heading names that block and every property and connector shown belongs to it., strength: must, section: 'Annex A.1; B.2.8 [1]; 8.3.1.2.2', checkable: static, category: DIAG}
- {id: SYSML-DIAG-006, statement: A package diagram is framed by a package or model., strength: must, section: 'Annex A.1; B.2.9 [1]', checkable: static, category: DIAG}
- {id: SYSML-DIAG-007, statement: A parametric diagram is framed by a block (including a constraint block)., strength: must, section: 'Annex A.1; B.2.10 [1]', checkable: static, category: DIAG}
- {id: SYSML-DIAG-008, statement: A requirement diagram is framed by a package or a requirement., strength: must, section: 'Annex A.1; B.2.11 [1]', checkable: static, category: DIAG}
- {id: SYSML-DIAG-009, statement: A sequence diagram is framed by an interaction., strength: must, section: 'Annex A.1; B.2.7 [1]', checkable: static, category: DIAG}
- {id: SYSML-DIAG-010, statement: A state machine diagram is framed by a state machine., strength: must, section: 'Annex A.1; B.2.12 [1]', checkable: static, category: DIAG}
- {id: SYSML-DIAG-011, statement: A use case diagram is framed by a package., strength: must, section: 'Annex A.1; B.2.13 [1]', checkable: static, category: DIAG}
- {id: SYSML-DIAG-012, statement: 'The diagram kinds are activity, block definition, internal block, package, parametric, requirement, sequence, state machine and use case (nine).', strength: note, section: Annex A.1, checkable: none, category: DIAG}
- {id: SYSML-DIAG-013, statement: 'A requirement diagram shows only requirements, packages, other classifiers, test cases and rationale, with the containment, derive, satisfy, verify, refine, copy and trace relationships; callouts may show the relationships of other elements to a requirement.', strength: must, section: 16.3.1.1, checkable: partial, category: DIAG}
- {id: SYSML-DIAG-014, statement: 'Constraint blocks are defined only on block definition diagrams or package diagrams, where they are marked with the constraint keyword.', strength: must, section: 10.4.1, checkable: partial, category: DIAG}
- {id: SYSML-DIAG-015, statement: On a parametric diagram the only connectors that may be shown are binding connectors., strength: must, section: 10.4.2, checkable: partial, category: DIAG}
- {id: SYSML-DIAG-016, statement: A definition box with no keyword on a block definition diagram is a block., strength: must, section: 8.3.1.1.2, checkable: none, category: DIAG}
- {id: SYSML-DIAG-017, statement: 'An element type that is not shown in a SysML diagram elements table, or in a normative usage example, is not part of the UML subset SysML includes, even if the UML packages SysML imports support it.', strength: must, section: 6.2.2, checkable: none, category: DIAG}
- {id: SYSML-DIAG-018, statement: 'Any combination of SysML diagram elements is allowed only if it keeps the kinds of element on a diagram kind constrained and well specified; the diagram elements tables list the symbols that can appear, not the combinations.', strength: note, section: Annex A.1, checkable: none, category: DIAG}
- {id: SYSML-DIAG-019, statement: 'Package diagrams and the callout notation are the two flexible mechanisms: a package diagram can hold a wide array of packageable elements, and callouts show relationships between elements that appear on different diagram kinds.', strength: note, section: Annex A.1, checkable: none, category: DIAG}
- {id: SYSML-DIAG-020, statement: 'Tables and matrices, graphs and trees are optional alternative notations that are consistent with the metamodel; they are not part of the diagram taxonomy and are not standardized.', strength: note, section: Annex A.2, checkable: none, category: DIAG}
- {id: SYSML-DIAG-021, statement: A diagram usage (such as a context diagram or a block hierarchy) is a constrained use of one diagram kind and may be captured by an extension of the diagram kind., strength: note, section: Annex A.1, checkable: none, category: DIAG}
- {id: SYSML-CONF-001, statement: 'A SysML model uses only the UML metaclasses in the UML4SysML subset; the metaclasses of the excluded list (for example component, node, deployment, collaboration, template, protocol state machine) are not used.', strength: must, section: '4.1 (Tables 4.1, 4.2); 6.2.2', checkable: static, category: CONF}
- {id: SYSML-CONF-002, statement: Package merge between packages is not supported in user models., strength: must, section: 7.3.1.1, checkable: static, category: CONF}
- {id: SYSML-CONF-003, statement: 'N-ary associations and qualified associations are excluded; an association is never shown with navigation arrowheads on both ends, with a cross on a non-navigable end, or with an ownership dot.', strength: must, section: 8.3.1.3, checkable: partial, category: CONF}
- {id: SYSML-CONF-004, statement: A value type is never given the primitive keyword., strength: must, section: 8.3.1.3, checkable: none, category: CONF}
- {id: SYSML-CONF-005, statement: 'The deployment diagram, object diagram, communication, interaction overview, timing and profile diagrams are not SysML diagram kinds; deployment can be shown on an internal block diagram and a profile definition on a package diagram.', strength: must, section: Annex A.1, checkable: none, category: CONF}
- {id: SYSML-CONF-006, statement: 'Where a constraint of a profile extension element is given both in text and in OCL and the two disagree, the OCL controls.', strength: note, section: 6.2.3, checkable: none, category: CONF}
- {id: SYSML-CONF-007, statement: 'A tool conforms to SysML only by supporting abstract syntax, concrete syntax and model interchange conformance together; conformance does not include the deprecated elements.', strength: note, section: 5.1; 5.2, checkable: none, category: CONF}
- {id: SYSML-CONF-008, statement: A model that applies the SysML profile strictly may use only the UML metaclasses the profile references., strength: note, section: 17.4.5, checkable: partial, category: CONF}
- {id: SYSML-CONF-009, statement: 'The three SysML model libraries are PrimitiveValueTypes, UnitAndQuantityKind and ControlValues; the QUDV and ISO 80000 libraries are non-normative.', strength: note, section: 4.2; Annex E, checkable: none, category: CONF}
- {id: SYSML-CONF-010, statement: 'A profile extension element is appropriate (rather than a subclass) when the extended concept is not class-based, when the extension''s properties reference other model elements, or when they describe modeling data rather than system data; a subclass is appropriate when each instance has its own values that subclasses inherit.', strength: note, section: 17.4.4, checkable: none, category: CONF}
- {id: SYSML-CONF-011, statement: 'A user-defined extension of a SysML element extends the same metaclasses as its parent, inherits its properties, and does not display the parent''s marking on typed elements unless a diagram extension says so.', strength: note, section: 17.4.2, checkable: none, category: CONF}
- {id: SYSML-DEP-001, statement: 'A flow port is typed by a flow specification, block, signal or value type.', strength: must, section: 'C.3.2.3 [1]', checkable: static, applies_when: deprecated flow ports are used, category: DEP}
- {id: SYSML-DEP-002, statement: An atomic flow port has a direction and no conjugation setting., strength: must, section: 'C.3.2.3 [2]', checkable: static, applies_when: deprecated flow ports are used, category: DEP}
- {id: SYSML-DEP-003, statement: The direction of a non-atomic flow port follows the directions of the flow properties of its flow specification (reversed if conjugated); mixed directions give inout., strength: must, section: 'C.3.2.3 [3]', checkable: static, applies_when: deprecated flow ports are used, category: DEP}
- {id: SYSML-DEP-004, statement: 'Flow ports connect to flow ports with matching flow properties by type (sent type the same or a subtype of received type), direction (opposite across an external connector unless one end is inout; the same across an internal connector) and, if still ambiguous, name; if the match is still ambiguous the connection is ill formed.', strength: must, section: 'C.3.2.3 [4]', checkable: partial, applies_when: deprecated flow ports are used, category: DEP}
- {id: SYSML-DEP-005, statement: A flow port that is not connected to an internal part is behavioral., strength: must, section: 'C.3.2.3 [5]', checkable: static, applies_when: deprecated flow ports are used, category: DEP}
- {id: SYSML-DEP-006, statement: A flow specification owns no operations or receptions., strength: must, section: 'C.3.2.4 [1]', checkable: static, applies_when: deprecated flow specifications are used, category: DEP}
- {id: SYSML-DEP-007, statement: Every owned attribute of a flow specification is a flow property., strength: must, section: 'C.3.2.4 [2]', checkable: static, applies_when: deprecated flow specifications are used, category: DEP}
- {id: SYSML-DEP-008, statement: 'Item flows are not deprecated, but with atomic flow ports they follow a deprecated compatibility rule that treats the types of the source and target ports as if they were the types of flow properties on those ports.', strength: note, section: C.3.2.5, checkable: none, applies_when: deprecated flow ports are used, category: DEP}
conventions:
  provenance: {status: standard, note: 'Drawing rules the standard states (clauses 8 to 17, Annexes A and B). They are conventions for a renderer or an author, not validation. Layout numbers are not part of the standard. Where the standard words a drawing rule as a requirement on a model element (for example the frame), it is also a constraint.'}
  global: ['A diagram has a frame (a rectangle), a heading in a name tag at the upper left, and a contents area. A diagram description comment may carry version, description, completion status, reference and user fields. (Annex A.1)', 'Heading syntax: diagram kind (bold), then the model element type (optional, in brackets), the model element name, and an optional diagram name in brackets. The kind and element name are always present; the type and name are added where needed to remove ambiguity. The model element type starts with a lower-case letter and, for a keyword, is shown without the angle quotes. (Annex A.1)', 'Diagram kind abbreviations: act, bdd, ibd, pkg, par, req, sd, stm, uc. (Annex A.1)', A diagram usage may be shown as a keyword above the heading (for example a context diagram). (Annex A.1), 'The rake symbol marks a model element that is decomposed on another diagram: a call behavior action, a part, a package, a constraint property, a requirement, an interaction fragment, a state, or a use case realized by behavior diagrams. (Annex A.2)', 'A text label is linked to its symbol by proximity (ports, item flows, pins). Page connectors should be used sparingly. A small jog may show that crossing lines do not meet. Overlays such as a map are allowed. (Annex A.2)', 'Tables and matrices, graphs and trees are optional alternative notations, headed by table, matrix, graph or tree in bold, consistent with the metamodel. A document is represented by a document artifact traced to the elements it covers. (Annex A.2)', 'Default multiplicities may be left out: 0..1 on the whole end of a part or shared association; 1 on the target end of a unidirectional association; 1 on each end of a connector. Any other multiplicity should always be shown. (8.3.1.1.9, 8.3.1.2.9)', Associations are drawn without navigation arrowheads on both ends and have no ownership dot or non-navigability cross. (8.3.1.3; B.2.6)]
  diagrams:
    block definition: ['A box with no keyword is a block. A block shows compartments in any order, each optionally labeled: parts, references, values, constraints, operations, receptions, properties, ports, proxy ports, full ports, flow properties, structure, namespace, bound references, and a behavior compartment (classifier behavior or owned behaviors). (8.3.1.1.2 to 8.3.1.1.8; 9.3.1)', 'A part association has a black diamond, a shared association a white diamond, a reference association no diamond. A multibranch association joins several targets from one diamond. (Table 8.2)', 'A constraints compartment holds constraints in braces and declarations of constraint properties. A constraint block is shown with its keyword, a constraints compartment and a parameters compartment. (8.3.1.1.5; 10.3.1.1)', 'A property-specific type is written in square brackets; units are written in parentheses after a value type name on a value property, and after a value. (8.3.1.1.10, 8.3.1.1.11)', 'Provided and required features are prefixed prov, reqd or provreqd; flow properties are prefixed in, out or inout. (9.3.1.1, 9.3.1.2)', A bound reference is shown without its keyword in a bound references compartment with its binding path. (8.3.1.1.8)]
    internal block: ['A part or value property is a solid-outline box; a reference property is a dashed-outline box. A multi-level property name is joined by dots. (8.3.1.2.1, 8.3.1.2.5)', 'Compartments on a property box are labeled with a leading colon when they show contents belonging to the property''s type; an unlabeled compartment is a structure compartment. An initial values compartment shows values as name equals value. (8.3.1.2.3, 8.3.1.2.8)', A binding connector carries a keyword and is drawn between the two bound properties; a connector property is shown as a rectangle joined by a dotted line to the connector. (Table 8.4; 8.3.2.7), A port is a small rectangle overlapping the boundary of its owner; proxy and full ports carry a keyword. An arrow inside the port shows direction when all its flow properties agree; two facing open arrowheads when they differ. A conjugated port's type is prefixed with a tilde. (9.3.1.6), 'An item flow is a black arrowhead on the connector or association, toward the target, labeled with the conveyed classifier (or item property name and type). (9.3.1.5)']
    parametric: ['A constraint property is a rounded rectangle, or an ordinary property box with the constraint keyword. A value property may be a small square with a text label beside it, flush or not with the boundary of a containing property. (10.3.1.2.1 to 10.3.1.2.3)']
    activity: [A control flow may be a dashed line with a stick arrowhead. (11.3.1.3.1), An activity on a block definition diagram uses the activity keyword and is joined to its call actions by composition associations whose part ends are adjunct properties. (11.3.1.1.1), 'Rate, probability and the buffering and optional markings are shown as keywords or in braces on edges, object nodes, pins and parameters. A streaming parameter is marked stream and a control pin control. (Table 11.1)', An allocate activity partition carries the allocate keyword instead of its full name. (15.3.1.5)]
    requirement: ['A requirement shows its keyword, name and an optional compartment with id and text; the compartment label may be left out. (16.3.1.2)', 'Callout notation shows the relationship of another element to a requirement (derive, satisfy, verify, refine, copy, trace) in a compartment or callout; the element type keyword may be left out. (16.3.1.3, 16.3.1.4)', 'A requirements table has a column for each property, one for the supplier of each dependency, one for the satisfying elements, and one for rationale; a sparse matrix style is also allowed. (16.3.1.5)']
    allocation: ['The allocate relationship is a dashed line with an open arrowhead pointing from the allocated element to the target. Allocation can be shown in an allocated from / allocated to compartment, as a callout, in a table or in a matrix. The element type keyword is one of activity, action, objectFlow, controlFlow, objectNode, operation, block, property, itemFlow, connector, port or value. (15.2, 15.3.1)']
    package: ['An import is a dashed arrow with the import keyword (public) or access keyword (private). A package may show its name in a tab or inside. Package containment is shown by nesting or the containment line. (Tables 7.1, 7.2)']
notes: 'SysML 1.5 is a profile of UML 2.5. Concepts defined here are the profile''s own; UML concepts are named in the Reused from UML group and defined by UML. Nine diagram kinds: activity, block definition, internal block, package, parametric, requirement, sequence, state machine, use case. Three are new (parametric, requirement) or modified (block definition, internal block, activity); package, sequence, state machine and use case are UML diagrams reused unchanged. The constraint ids are SYSML-<CAT>-nnn; the categories are listed in references/rules.md. Strength policy: must is an error, should a warning, note advice only. Tool-specific encodings belong in the tool''s own file, not here.'

layout:
  basis: Our conventions, not this standard's. Sizes and spacing come from the shared layout standard;
    this block only says which element type each concept takes.
  element_types:
    AcceptEventAction: box
    SendSignalAction: box
    UseCase: large-box
    InitialNode: small-node
    ActivityFinalNode: small-node
    FlowFinalNode: small-node
    ForkNode: small-node
    JoinNode: small-node
    Pseudostate: small-node
    FinalState: small-node
    DecisionNode: decision-diamond
    MergeNode: decision-diamond
    Actor: actor
    Port: attached-item
    ProxyPort: attached-item
    FullPort: attached-item
    FlowPort: attached-item
    ConstraintParameter: attached-item
    Pin: attached-item
    ConnectionPointReference: attached-item
    Rationale: note
    Problem: note
    ElementGroup: note
    Comment: note
    Constraint: note
    Package: container
    Model: container
    Profile: container
    Activity: container
    ActivityPartition: container
    AllocateActivityPartition: container
    InterruptibleActivityRegion: container
    StructuredActivityNode: container
    Interaction: container
    InteractionUse: container
    CombinedFragment: container
    StateMachine: container
    Region: container
    Subject: container
    SysMLBlockDefinitionDiagram: container
    SysMLInternalBlockDiagram: container
    SysMLParametricDiagram: container
    SysMLRequirementDiagram: container
    SysMLPackageDiagram: container
    SysMLActivityDiagram: container
    SysMLInteractionDiagram: container
    SysMLStateMachineDiagram: container
    SysMLUseCaseDiagram: container
    InvocationOnNestedPortAction: box
  exceptions: {}
  no_element_type:
    line:
      reason: 'A relationship or a connector kind, or a mark drawn on or along a line: it is a line between
        elements or sits on one, and takes no element size.'
      concepts:
      - Conform
      - Expose
      - BindingConnector
      - Allocate
      - Satisfy
      - Verify
      - DeriveReqt
      - Refine
      - Trace
      - Copy
      - Dependency
      - Abstraction
      - Realization
      - PackageImport
      - ElementImport
      - Generalization
      - GeneralizationSet
      - Association
      - Connector
      - ConnectorEnd
      - InterfaceRealization
      - ItemFlow
      - InformationFlow
      - ControlFlow
      - ObjectFlow
      - Message
      - GeneralOrdering
      - Transition
      - Include
      - Extend
      - Usage
      - Extension
      - ProfileApplication
      - AdjunctProperty
      - DurationConstraint
      - DurationObservation
      - TimeConstraint
      - TimeObservation
      - RequirementContainment
      - PartAssociation
      - ReferenceAssociation
      - SharedAssociation
      - BlockNamespaceContainment
      - ProvidedInterface
      - RequiredInterface
      - PackageContainment
      - CommunicationPath
      - UseCaseGeneralization
      - MetamodelReference
    text-inside:
      reason: Written as a line of text inside the box that owns it, or as a keyword or value beside a
        symbol; it has no box of its own.
      concepts:
      - ClassifierBehaviorProperty
      - ConnectorProperty
      - ParticipantProperty
      - EndPathMultiplicity
      - DistributedProperty
      - FlowProperty
      - DirectedFeature
      - Operation
      - Reception
      - Property
      - Parameter
      - ParameterSet
      - ExtensionPoint
      - Rate
      - Continuous
      - Discrete
      - Probability
      - NoBuffer
      - Overwrite
      - Optional
      - TriggerOnNestedPort
      - Trigger
      - ChangeEvent
      - FlowDirection
      - FeatureDirection
      - TestCase
      - NestedConnectorEnd
    not-drawn:
      reason: Abstract, or a metaclass with no symbol of its own, so nothing is drawn for it.
      concepts:
      - ElementPropertyPath
      - DirectedRelationshipPropertyPath
      - ChangeStructuralFeatureEvent
      - AcceptChangeStructuralFeatureEventAction
      - AbstractRequirement
      - VerdictKind
      - SysMLDiagramElement
      - SysMLDiagram
      - SysMLDiagramWithAssociations
      - SysMLStructureDiagram
      - SysMLBehaviorDiagram
      - NamedElement
      - Element
      - DirectedRelationship
      - Behavior
      - Feature
      - Event
      - ConnectableElement
      - ActivityNode
      - Vertex
      - CreationEvent
      - DestructionEvent
      - ModelLibrary
  diagram_types:
    block definition:
      arrangement: layered-bands
      title: frame-header
      route: orthogonal
      channels:
        fill: null
        claimed:
          position: Hierarchy level. Which band a block sits in says how deep in the generalization or
            composition tree it is.
          line_style: Relationship kind. Dashed lines are dependencies (import, verify), so a second variable
            cannot use dash pattern.
        free:
        - fill
        - border
        - border_width
        - line_color
        - font_color
        - opacity
        - icon
    requirement:
      arrangement: layered-bands
      title: frame-header
      route: orthogonal
      channels:
        fill: 'Requirement kind. Treated as claimed: recoloring a diagram whose fill already encodes kind
          breaks it, while leaving a channel unused costs nothing.'
        claimed:
          position: Decomposition level. Which band a requirement sits in says how deep in the containment
            tree it is.
          line_style: Relationship kind. Dashed lines are deriveReqt dependencies.
        free:
        - border
        - border_width
        - line_color
        - font_color
        - opacity
        - icon
  viewpoints: {}
