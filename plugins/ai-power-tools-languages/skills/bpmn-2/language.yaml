# The four conformance types of Clause 2 (Complete Conformance is all four). A tool claiming one need not support the others.
conformance_types:
  ProcessModeling:
    section: '2.2'
    requires: The core packages (Infrastructure, Foundation, Common, Service); Process, Collaboration and Conversation diagrams; the shapes and markers as the standard draws them; structural conformance (the connection rules); process semantics; attribute mechanisms; import and export of Process and Collaboration diagrams. Choreography elements are not expected.
    diagram_types: [Process, Collaboration, Conversation]
    subclasses: [Descriptive, Analytic, CommonExecutable]
    subclass_note: Process Modeling Conformance has three optional sub-classes (2.2.1). A tool claiming a sub-class must support every element in it and every attribute listed for each element. The lists below are our summary of Tables 2.1 to 2.4 in the standard's words. Class[Type] means the class with exactly one event definition of that type. The per-element attribute lists of the tables were not captured, and the row boundaries of the tables are not reproduced exactly.
  ProcessExecution:
    section: '2.3'
    requires: Full operational semantics and the activity life cycle (Clause 13); import of Process diagrams including the definitional Collaboration. No graphical syntax is required.
    diagram_types: [Process]
    rules_apply_when: executable
  BPELProcessExecution: {section: '2.4', requires: Process Execution Conformance plus the BPMN to WS-BPEL mapping (Clause 14)., includes: ProcessExecution, rules_apply_when: bpel-mapping}
  ChoreographyModeling:
    section: '2.5'
    requires: The core packages; Choreography diagrams; pools and message flow; the choreography elements (Choreography Task, Global Choreography Task, Sub-Choreography, Message, a subset of events and gateways); import and export of Choreography and Collaboration diagrams.
    diagram_types: [Choreography, Collaboration]
  Complete: {section: '2.1', requires: All four conformance types.}

# The three optional sub-classes of Process Modeling Conformance (2.2.1).
conformance_subclasses:
  Descriptive:
    table: Table 2.1
    row_count: 24
    intent: Visible elements and attributes for high-level modeling, comfortable for analysts used to flowchart tools.
    elements: [Participant (drawn as Pool), LaneSet, SequenceFlow (unconditional), MessageFlow, ExclusiveGateway, ParallelGateway, Task (None), UserTask, ServiceTask, SubProcess (expanded), SubProcess (collapsed), CallActivity, DataObject, TextAnnotation, Association, DataAssociation, DataStoreReference, StartEvent (None), EndEvent (None), 'StartEvent[Message]', 'EndEvent[Message]', 'StartEvent[Timer]', 'EndEvent[Terminate]', Group]
    attributes_listed: ['documentation (an attribute, not a visible element)']
  Analytic:
    table: Table 2.2
    row_count: 33
    adds_to: Descriptive
    intent: Descriptive plus about half of all constructs, built from training experience and an analysis of defense-architecture-framework usage.
    elements: [SequenceFlow (conditional), SequenceFlow (default), SendTask, ReceiveTask, StandardLoopCharacteristics, MultiInstanceLoopCharacteristics, ExclusiveGateway (default flow), InclusiveGateway, EventBasedGateway, 'IntermediateCatchEvent[Link]', 'IntermediateThrowEvent[Link]', 'StartEvent[Signal]', 'EndEvent[Signal]', 'IntermediateCatchEvent[Message]', 'IntermediateThrowEvent[Message]', 'BoundaryEvent[Message]', 'BoundaryEvent[Message] (non-interrupting)', 'IntermediateCatchEvent[Timer]', 'BoundaryEvent[Timer]', 'BoundaryEvent[Timer] (non-interrupting)', 'BoundaryEvent[Error]', 'EndEvent[Error]', 'BoundaryEvent[Escalation] (non-interrupting)', 'IntermediateThrowEvent[Escalation]', 'EndEvent[Escalation]', 'IntermediateCatchEvent[Signal]', 'IntermediateThrowEvent[Signal]', 'BoundaryEvent[Signal]', 'BoundaryEvent[Signal] (non-interrupting)', 'StartEvent[Conditional]', 'IntermediateCatchEvent[Conditional]', 'BoundaryEvent[Conditional]', 'BoundaryEvent[Conditional] (non-interrupting)', Message]
    note: One boundary row (non-interrupting Conditional) omits the attachedToRef attribute while the others list it.
  CommonExecutable:
    table: Tables 2.3 and 2.4
    row_count: 22
    supporting_row_count: 16
    intent: Tools that emit executable models. XML Schema for data types, WSDL for service interfaces and XPath for data access are mandatory.
    elements: ['SequenceFlow (normal, conditional, default)', SubProcess (expanded), ExclusiveGateway, ParallelGateway, EventBasedGateway, StartEvent (None), EndEvent (None), UserTask, ServiceTask, CallActivity, DataObject, TextAnnotation, DataAssociation, 'StartEvent[Message]', 'EndEvent[Message]', 'EndEvent[Terminate]', 'IntermediateCatchEvent[Message]', 'IntermediateThrowEvent[Message]', 'IntermediateCatchEvent[Timer]', 'BoundaryEvent[Error]']
    supporting_elements: [LoopCharacteristics, ResourceRole, Resource, InputOutputSpecification, DataInput, DataOutput, ItemDefinition, Operation, Message, Error, Assignment, 'EventDefinition (three, matching the events listed above)']
    note: The supporting list is our summary of Table 2.4; it names the supporting classes but not every row.

concepts:
  source: 'OMG BPMN 2.0.2: the metamodel in Semantic.xsd (133 complex types, 14 abstract, 11 named enumerations) with the clauses of the PDF (8 to 11). Two schema elements that are not complex types (Definitions, Import) and three abstract classes named only in the PDF text (FlowElementsContainer, InteractionNode, ItemAwareElement) are added. Generalization comes from the schema, not from the PDF''s class diagrams, which are images.'
  groups:
    Foundation: {defined_by: 'Clauses 8.2, 8.3, 8.4', notes: 'Base classes and helper classes shared by everything: identity, documentation, extension hooks, expressions, auditing and monitoring.'}
    Containers and process kinds: {defined_by: 'Clauses 9.1, 9.5.5, 10.1, 11.1, 11.5.4', notes: 'The containers of flow: processes, collaborations, choreographies.'}
    Events: {defined_by: Clause 10.5, notes: 'Start, intermediate, boundary and end events, and their event definitions.', diagram_type: 'Process, Collaboration, Choreography'}
    Activities: {defined_by: Clause 10.3, notes: 'Tasks, sub-processes, call activities, global tasks and loop characteristics.'}
    Gateways: {defined_by: Clause 10.6, notes: Divergence and convergence of sequence flow.}
    Data: {defined_by: 'Clauses 8.4.11, 10.4', notes: 'Items, stores, inputs and outputs, associations and the message.'}
    Connecting objects: {defined_by: 'Clauses 7.3, 8.4.1, 8.4.13, 9.4, 9.5.6', notes: 'The drawn connections: sequence flow, message flow, association, conversation link (data association is in Data).'}
    Swimlanes: {defined_by: 'Clauses 9.3, 10.8', notes: 'Participants (pools), their kinds and multiplicity, and lanes.'}
    Artifacts: {defined_by: Clause 8.4.1, notes: 'Information that does not change flow, plus the category backing a group.'}
    Choreography: {defined_by: Clause 11.5, notes: Choreography activities., diagram_type: Choreography}
    Conversation: {defined_by: Clause 9.5, notes: Conversation nodes and the associations that map a referenced diagram onto an outer one., diagram_type: Conversation}
    Correlation: {defined_by: Clause 8.4.2, notes: Routing a message to the right process instance.}
    Resources: {defined_by: 'Clauses 8.4.12, 10.3.1 to 10.3.4', notes: Who performs an activity.}
    Services and signals: {defined_by: 'Clauses 8.4, 8.5', notes: 'Interfaces, operations, end points, and the named signal, error and escalation payloads.'}
  elements:
    BaseElement: {display: Base Element, category: Foundation, abstract: true}
    Auditing: {display: Auditing, category: Foundation, specializes: BaseElement, section: '10.10'}
    BaseElementWithMixedContent: {display: Base Element With Mixed Content, category: Foundation, abstract: true}
    Documentation: {display: Documentation, category: Foundation, section: '8.2'}
    Expression: {display: Expression, category: Foundation, specializes: BaseElementWithMixedContent, section: 8.4.6}
    Extension: {display: Extension, category: Foundation, section: '8.2'}
    ExtensionElements: {display: Extension Elements, category: Foundation, section: '8.2'}
    FlowElement: {display: Flow Element, category: Foundation, abstract: true, specializes: BaseElement}
    FlowNode: {display: Flow Node, category: Foundation, abstract: true, specializes: FlowElement}
    FormalExpression: {display: Formal Expression, category: Foundation, specializes: Expression, section: 8.4.6}
    Monitoring: {display: Monitoring, category: Foundation, specializes: BaseElement, section: '10.11'}
    Relationship: {display: Relationship, category: Foundation, specializes: BaseElement, section: '8.2'}
    Rendering: {display: Rendering, category: Foundation, specializes: BaseElement, section: 10.3.4}
    RootElement: {display: Root Element, category: Foundation, abstract: true, specializes: BaseElement}
    Script: {display: Script, category: Foundation}
