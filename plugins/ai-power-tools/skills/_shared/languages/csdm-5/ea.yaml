# CSDM 5 in Sparx EA: the EA references
language: csdm-5
technology: CSDM5
version: 1.0.0
display_name: CSDM 5 for EA
profile: CSDM5
stereotype_prefix: CSDM
stereotype_storage:
  stored: CSDM<ConceptId>, such as CSDMBusinessApplication
  stored_in: t_object.Stereotype and t_connector.Stereotype (what a ruleset selector matches)
  qualified: CSDM5::<stored>, in t_xref
  create_with: the qualified form as the element type; for a line, the EA type with StereotypeEx set to the qualified form
basis: Written from ServiceNow's CSDM 5 white paper and documentation. Not affiliated with or endorsed by ServiceNow.
measured_on:
  ea: 17.1 build 1716
  date: '2026-11-04'
sources:
  facts: The stored file and the Catalog package in the master model were read back on the build above.
  tag source values:
    source: named by CSDM's paper or documentation
    unconfirmed: from an earlier ServiceNow integration's 2023 technology file, not checked against a current platform
    proposal: this pack's own choice; no source names it as a field
    requirement: the pack's link to a ServiceNow record
diagram_types:
  CSDM Diagram:
    ea_name: CSDM5::CSDMDiagram
    base: Diagram_Logical
    toolbox: CSDM5::CSDM5 Toolbox
    stored:
      t_diagram.Diagram_Type: Logical
