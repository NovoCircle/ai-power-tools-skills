      - OutputSet
      - Participant
      - PartnerEntity
      - PartnerRole
      - Pool
      - Resource
      - ResourceParameter
      - ResourceRole
      - Signal
      - StartEvent
      - ''
      target_must_be_one_of:
      - Activity
      - Assignment
      - BPELProcess
      - BusinessProcess
      - Category
      - CategoryValue
      - Choreography
      - ChoreographyModel
      - CollaborationModel
      - ComplexBehaviorDefinition
      - Conversation
      - ConversationModel
      - CorrelationKey
      - CorrelationProperty
      - CorrelationPropertyBinding
      - CorrelationPropertyRetrievalExpression
      - CorrelationSubscription
      - DataStore
      - EndEvent
      - EndPoint
      - Error
      - Escalation
      - GlobalTask
      - IOSpecification
      - InputOutputBinding
      - InputSet
      - Interface
      - IntermediateEvent
      - ItemDefinition
      - Message
      - Operation
      - OutputSet
      - Participant
      - PartnerEntity
      - PartnerRole
      - Pool
      - Resource
      - ResourceParameter
      - ResourceRole
      - Signal
      - StartEvent
      - ''
    remediation:
      short: Attach the message flow to the pool, an activity or an event instead.
      auto_fixable: false

  - id: BPMN2-CONN-007
    name: Message flow joins the endpoints Table 7.4 allows
    implements: BPMN-CONN-007
    description: 'A message flow runs between pools or participants, activities and events only, and only the pairs Table
      7.4 allows: a start event is never a source, an end event is never a target. Checked on the stored stereotypes. Lanes,
      gateways, data objects, groups and text annotations are judged by BPMN2-CONN-006b. [OMG BPMN 2.0.2 (formal/13-12-09)
      9.4 p. 122; Table 9.8]'
    category: connection
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: Table 7.4 also fixes the event definition (a message start event, a throwing or catching message event);
      the stored stereotype does not carry it, so the check is on the stereotype pair only.
    selector:
      type: connector
      connector_stereotypes: any_of_table
    condition:
      type: relationship_table
      table: bpmn-2-message-flow
      skip_endpoints:
      - Lane
      - Gateway
      - DataObject
      - Group
      - TextAnnotation
      unknown_endpoint: error
    remediation:
      short: Connect the message flow between pools, activities and events Table 7.4 allows.
      auto_fixable: false

  - id: BPMN2-CONN-008a
    name: A black-box pool receives no sequence flow
    implements: BPMN-CONN-008
    description: A black-box pool shows no process, so no sequence flow may end at it; message flows attach to its boundary.
      [OMG BPMN 2.0.2 (formal/13-12-09) 9.3 p. 111]
    category: connection
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: Elements placed inside a black-box pool are not seen (containment is not reachable).
    selector:
      type: element
      stereotypes:
        any_of:
        - Pool
      tagged_value_filter:
      - tag: blackBoxPool
        value_in:
        - 'true'
    condition:
      type: connector_count
      connector_stereotype: SequenceFlow
      direction: incoming
      max: 0
    remediation:
      short: Remove the sequence flow, or open the pool (blackBoxPool = false) and attach the flow to an element inside.
      auto_fixable: false

  - id: BPMN2-CONN-008b
    name: A black-box pool sends no sequence flow
    implements: BPMN-CONN-008
    description: A black-box pool shows no process, so no sequence flow may start at it; message flows attach to its boundary.
      [OMG BPMN 2.0.2 (formal/13-12-09) 9.3 p. 111]
    category: connection
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: Elements placed inside a black-box pool are not seen (containment is not reachable).
    selector:
      type: element
      stereotypes:
        any_of:
        - Pool
      tagged_value_filter:
      - tag: blackBoxPool
        value_in:
        - 'true'
    condition:
      type: connector_count
      connector_stereotype: SequenceFlow
      direction: outgoing
      max: 0
    remediation:
      short: Remove the sequence flow, or open the pool (blackBoxPool = false) and attach the flow to an element inside.
      auto_fixable: false

  - id: BPMN2-CONN-010
    name: A choreography references no other choreography
    implements: BPMN-CONN-010
    description: 'A collaboration may reference a choreography, but a choreography model cannot: its `choreographyRef` stays
      empty. [OMG BPMN 2.0.2 (formal/13-12-09) Table 9.1 p. 109]'
    category: connection
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: element
      stereotypes:
        any_of:
        - ChoreographyModel
    condition:
      type: tagged_value_constraint
      tags:
      - name: choreographyRef
        value_must_be_one_of:
        - ''
    remediation:
      short: Clear choreographyRef on the choreography model.
      auto_fixable: false

  - id: BPMN2-CONN-011
    name: Process activities and choreography activities are not joined by a sequence flow
    implements: BPMN-CONN-011
    description: Choreography activities are not flow elements of a process, and activities are not flow elements of a choreography,
      so no sequence flow joins an Activity and a Choreography. [OMG BPMN 2.0.2 (formal/13-12-09) Table 8.45 p. 87]
    category: connection
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: Containment (which process or choreography an element sits in) is not reachable; only a flow that joins the
      two kinds is seen.
    selector:
      type: connector
      connector_stereotype: SequenceFlow
    condition:
      type: relationship_table
      table: bpmn-2-process-or-choreography
      unknown_endpoint: ignore
    remediation:
      short: 'Keep a sequence flow inside one diagram kind: process flow between activities, choreography flow between choreography
        activities.'
      auto_fixable: false

  - id: BPMN2-CONN-015
    name: A conversation link has exactly one conversation node
    implements: BPMN-CONN-015
    description: A conversation link joins one conversation node to a participant (a pool, an activity, an event); if one
      end is not a conversation node the other must be, and it never joins two conversation nodes. [OMG BPMN 2.0.2 (formal/13-12-09)
      Table 9.13 p. 133]
    category: connection
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: connector
      connector_stereotype: ConversationLink
    condition:
      type: relationship_table
      table: bpmn-2-conversation-link
      unknown_endpoint: ignore
    remediation:
      short: Join a Conversation to a participant with the link; do not join two conversations or two participants.
      auto_fixable: false

  - id: BPMN2-CONN-019
    name: A choreography activity has two or more participants
    implements: BPMN-CONN-019
    description: A choreography activity involves two or more participants; EA's `numberOfParticipants` offers 2, 3 or 4.
      [OMG BPMN 2.0.2 (formal/13-12-09) Table 9.10 p. 128; Table 11.1 p. 322]
    category: connection
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: 'Conversation nodes (two or more participants) are not checked: it needs the count of conversation links
      in both directions.'
    selector:
      type: element
      stereotypes:
        any_of:
        - Choreography
    condition:
      type: tagged_value_constraint
      tags:
      - name: numberOfParticipants
        value_must_be_one_of:
        - '2'
        - '3'
        - '4'
    remediation:
      short: Set numberOfParticipants to 2, 3 or 4.
      auto_fixable: false

  - id: BPMN2-EVT-002a
    name: A start event takes no incoming sequence flow
    implements: BPMN-EVT-002
    description: A start event is never the target of a sequence flow. A start event attached to the boundary of an expanded
      sub-process is an exception the standard allows; the stored element cannot be told apart, so it is reported too. [OMG
      BPMN 2.0.2 (formal/13-12-09) 10.5.2 p. 244]
    category: event
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: The condition-free outgoing flows half of the rule is not checked (needs the flow's tag).
    selector:
      type: element
      stereotypes:
        any_of:
        - StartEvent
    condition:
      type: connector_count
      connector_stereotype: SequenceFlow
      direction: incoming
      max: 0
    remediation:
      short: Remove the incoming sequence flow; use a message flow to trigger a start event from another participant.
      auto_fixable: false

  - id: BPMN2-EVT-002b
    name: A start event has an outgoing sequence flow
    implements: BPMN-EVT-002
    description: A start event is the source of at least one sequence flow. [OMG BPMN 2.0.2 (formal/13-12-09) 10.5.2 p. 244]
    category: event
    severity: error
    demo_trigger: true
    coverage: full
    selector:
      type: element
      stereotypes:
        any_of:
        - StartEvent
    condition:
      type: connector_count
      connector_stereotype: SequenceFlow
      direction: outgoing
      min: 1
    remediation:
      short: Add a sequence flow from the start event to the first activity.
      auto_fixable: false

  - id: BPMN2-EVT-003
    name: A start event sends no message flow
    implements: BPMN-EVT-003
    description: A start event may receive message flows (each is a trigger) but is never the source of one. [OMG BPMN 2.0.2
      (formal/13-12-09) 10.5.2 p. 245]
    category: event
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: element
      stereotypes:
        any_of:
        - StartEvent
    condition:
      type: connector_count
      connector_stereotype: MessageFlow
      direction: outgoing
      max: 0
    remediation:
      short: Remove the message flow from the start event; send from an activity or an intermediate or end event.
      auto_fixable: false

  - id: BPMN2-EVT-004a
    name: An end event has an incoming sequence flow
    implements: BPMN-EVT-004
    description: An end event is the target of at least one sequence flow. [OMG BPMN 2.0.2 (formal/13-12-09) 10.5.3 p. 248]
    category: event
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: element
      stereotypes:
        any_of:
        - EndEvent
    condition:
      type: connector_count
      connector_stereotype: SequenceFlow
      direction: incoming
      min: 1
    remediation:
      short: Add a sequence flow into the end event.
      auto_fixable: false

  - id: BPMN2-EVT-004b
    name: An end event has no outgoing sequence flow
    implements: BPMN-EVT-004
    description: An end event is never the source of a sequence flow. A end event attached to the boundary of an expanded
      sub-process is an exception the standard allows; the stored element cannot be told apart, so it is reported too. [OMG
      BPMN 2.0.2 (formal/13-12-09) 10.5.3 p. 248]
    category: event
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: element
      stereotypes:
        any_of:
        - EndEvent
    condition:
      type: connector_count
      connector_stereotype: SequenceFlow
      direction: outgoing
      max: 0
    remediation:
      short: Remove the outgoing sequence flow, or replace the end event with an intermediate event.
      auto_fixable: false

  - id: BPMN2-EVT-005
    name: An end event receives no message flow
    implements: BPMN-EVT-005
    description: An end event sends messages but is never the target of a message flow. [OMG BPMN 2.0.2 (formal/13-12-09)
      10.5.3 p. 248]
    category: event
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: An end event with outgoing message flows must have the result Message or Multiple; this needs the flow count
      and the tag together.
    selector:
      type: element
      stereotypes:
        any_of:
        - EndEvent
    condition:
      type: connector_count
      connector_stereotype: MessageFlow
      direction: incoming
      max: 0
    remediation:
      short: Point the message flow at an activity, a catching intermediate event or a start event.
      auto_fixable: false

  - id: BPMN2-EVT-007a
    name: An intermediate event has an outgoing sequence flow
    implements: BPMN-EVT-007
    description: 'An intermediate event passes the flow on: it is the source of a sequence flow (a link source and a compensation
      catch event are the exceptions, judged by the next rules). [OMG BPMN 2.0.2 (formal/13-12-09) 10.5.4 p. 258]'
    category: event
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: 'The incoming half (an intermediate event in normal flow is a target) is not checked: a boundary event shares
      the stereotype and must have no incoming flow.'
    selector:
      type: element
      stereotypes:
        any_of:
        - IntermediateEvent
      tagged_value_filter:
      - tag: eventDefinition
        value_in:
        - None
        - Cancel
        - Conditional
        - Escalation
        - Error
        - Message
        - Multiple
        - Timer
        - Signal
        - ParallelMultiple
    condition:
      type: connector_count
      connector_stereotype: SequenceFlow
      direction: outgoing
      min: 1
    remediation:
      short: Add a sequence flow from the intermediate event to the next element.
      auto_fixable: false

  - id: BPMN2-EVT-007b
    name: A throwing compensation event has an outgoing sequence flow
    implements: BPMN-EVT-007
    description: A throwing compensation intermediate event in normal flow is the source of a sequence flow. [OMG BPMN 2.0.2
      (formal/13-12-09) 10.5.4 p. 258]
    category: event
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: See BPMN2-EVT-007a.
    selector:
      type: element
      stereotypes:
        any_of:
        - IntermediateEvent
      tagged_value_filter:
      - tag: eventDefinition
        value_in:
        - Compensation
      - tag: catchOrThrow
        value_in:
        - Throw
    condition:
      type: connector_count
      connector_stereotype: SequenceFlow
      direction: outgoing
      min: 1
    remediation:
      short: Add a sequence flow from the compensation event to the next element.
      auto_fixable: false

  - id: BPMN2-EVT-007c
    name: A link target event has an outgoing sequence flow
    implements: BPMN-EVT-007
    description: A catching link event (the target of a link pair) continues the flow; only a throwing link event may end
      a path. [OMG BPMN 2.0.2 (formal/13-12-09) 10.5.4 p. 258]
    category: event
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: See BPMN2-EVT-007a.
    selector:
      type: element
      stereotypes:
        any_of:
        - IntermediateEvent
      tagged_value_filter:
      - tag: eventDefinition
        value_in:
        - Link
      - tag: catchOrThrow
        value_in:
        - Catch
    condition:
      type: connector_count
      connector_stereotype: SequenceFlow
      direction: outgoing
      min: 1
    remediation:
      short: Add a sequence flow from the link target event to the next element.
      auto_fixable: false

  - id: BPMN2-EVT-008
    name: A compensation boundary event has no outgoing sequence flow
    implements: BPMN-EVT-008
    description: A catching compensation event is attached to an activity and points to its compensation handler by an association;
      it takes no outgoing sequence flow. [OMG BPMN 2.0.2 (formal/13-12-09) 10.5.4 p. 258]
    category: event
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: A boundary event of any other trigger must have no incoming and one outgoing flow; the stored stereotype
      does not tell a boundary event from a normal one, so only the compensation case is checked.
    selector:
      type: element
      stereotypes:
        any_of:
        - IntermediateEvent
      tagged_value_filter:
      - tag: eventDefinition
        value_in:
        - Compensation
      - tag: catchOrThrow
        value_in:
        - Catch
    condition:
      type: connector_count
      connector_stereotype: SequenceFlow
      direction: outgoing
      max: 0
    remediation:
      short: Replace the sequence flow with an Association to the compensation activity.
      auto_fixable: false

  - id: BPMN2-EVT-011
    name: Error and cancel events always interrupt
    implements: BPMN-EVT-011
    description: For an Error or Cancel event, `cancelActivity` is always true. [OMG BPMN 2.0.2 (formal/13-12-09) Table 10.92
      p. 257]
    category: event
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: Other triggers may be true or false, and the attribute is not applicable to Compensation; neither is checked.
    selector:
      type: element
      stereotypes:
        any_of:
        - IntermediateEvent
      tagged_value_filter:
      - tag: eventDefinition
        value_in:
        - Error
        - Cancel
    condition:
      type: tagged_value_constraint
      tags:
      - name: cancelActivity
        value_must_be_one_of:
        - 'true'
    remediation:
      short: Set cancelActivity to true.
      auto_fixable: false

  - id: BPMN2-EVT-013a
    name: A message intermediate event has at most one incoming message flow
    implements: BPMN-EVT-013
    description: 'A message intermediate event stands for one message: at most one incoming message flow. [OMG BPMN 2.0.2
      (formal/13-12-09) 10.5.4 p. 259]'
    category: event
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: The rule says one incoming or one outgoing message flow, not both; the combination is not checked.
    selector:
      type: element
      stereotypes:
        any_of:
        - IntermediateEvent
      tagged_value_filter:
      - tag: eventDefinition
        value_in:
        - Message
    condition:
      type: connector_count
      connector_stereotype: MessageFlow
      direction: incoming
      max: 1
    remediation:
      short: Keep one message flow per message event; add an event for each further message.
      auto_fixable: false

  - id: BPMN2-EVT-013b
    name: A message intermediate event has at most one outgoing message flow
    implements: BPMN-EVT-013
    description: 'A message intermediate event stands for one message: at most one outgoing message flow. [OMG BPMN 2.0.2
      (formal/13-12-09) 10.5.4 p. 259]'
    category: event
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: See BPMN2-EVT-013a.
    selector:
      type: element
      stereotypes:
        any_of:
        - IntermediateEvent
      tagged_value_filter:
      - tag: eventDefinition
        value_in:
        - Message
    condition:
      type: connector_count
      connector_stereotype: MessageFlow
      direction: outgoing
      max: 1
    remediation:
      short: Keep one message flow per message event; add an event for each further message.
      auto_fixable: false

  - id: BPMN2-EVT-019
