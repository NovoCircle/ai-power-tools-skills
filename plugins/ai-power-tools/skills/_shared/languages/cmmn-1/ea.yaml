# EA facts for CMMN 1.1 (language file cmmn-1), as Sparx Enterprise Architect's built-in CMMN technology stores them.
# Generated from elements created in EA and read back; do not edit by hand.
# `concepts` maps every concept of the language skill to what EA offers: a stereotype, a tag, a UML construct or nothing.
# Westbrook Bank appears only in howto.md, as an illustration.

language: cmmn-1
technology: CMMN
display_name: CMMN 1.1
profile: CMMN
stereotype_prefix: ''
stereotype_storage: bare name in t_object.Stereotype and t_connector.Stereotype (HumanTask, EntryCriterion, Connector); the qualified
  form CMMN::<name> is the FQName in the t_xref row named Stereotypes and is what AddNew takes
