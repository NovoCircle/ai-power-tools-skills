      - {name: scenario, type: AccidentScenario, multiplicity: '1', note: redefines trigger}
      - {name: hazard, type: Hazard, multiplicity: 0..*, note: redefines harmPotential}
      - {name: systemLevelEffect, type: SystemLevelEffect, multiplicity: 0..*}
      - {name: vehicleLevelEffect, type: VehicleLevelEffect, multiplicity: 0..*, note: redefines harm}
