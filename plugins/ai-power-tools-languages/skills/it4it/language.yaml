constraints:
- id: IT4IT-MM-001
  statement: The IT4IT metamodel is defined as a solution pattern in the ArchiMate language, and the reference architecture is exchangeable as a model in the ArchiMate model exchange
    format.
  strength: note
  section: 11 (introduction); 11.6
  checkable: none
- id: IT4IT-MM-002
  statement: The reference architecture is communicated at five abstraction levels. Only Levels 1, 2 and 3 are standardized; Levels 4 and 5 are not part of the normative standard.
  strength: note
  section: 11.2; 11.10
  checkable: none
- id: IT4IT-MM-003
  statement: Anything added at Level 4 or Level 5 must be mappable back to what Levels 1 to 3 specify.
  strength: must
  section: 11.10.1
  applies_when: level-4-or-5-content
  checkable: none
- id: IT4IT-MM-004
  statement: Additions at Level 4 or Level 5 should build on and add to the Levels 1 to 3 model and should not change it.
  strength: should
  section: '11.10'
  applies_when: level-4-or-5-content
  checkable: none
- id: IT4IT-MM-005
  statement: Levels 4 and 5 are owned and controlled by the consumers of the standard, not by The Open Group.
  strength: note
  section: '11.10'
  checkable: none
- id: IT4IT-MM-006
  statement: Level 1 introduces the seven value streams, the four functional groups plus the Supporting Functions, the Digital Product, key data objects and the functional components
    that control them.
  strength: note
  section: 11.3; 3
  checkable: none
- id: IT4IT-MM-007
  statement: Level 2 normatively defines the value streams and introduces scenarios, value stream stages and stakeholders.
  strength: note
  section: 11.4; 11.8
  checkable: none
- id: IT4IT-MM-008
  statement: Level 3 normatively defines functional components, data objects, key attributes, relationships with cardinality, and data flows.
  strength: note
  section: 11.5; 11.9
  checkable: none
- id: IT4IT-MM-009
  statement: Levels 2 and 3 together constitute the formal reference architecture.
  strength: note
  section: '11.6'
  checkable: none
- id: IT4IT-MM-010
  statement: Capabilities are non-normative. They refine the Level 2 functional groups; each functional component belongs to one Level 2 group and can relate to one or several capabilities.
  strength: note
  section: 11.10.2
  checkable: none
- id: IT4IT-MM-011
  statement: Where capabilities are described, they should be shown with the ArchiMate notation for consistency.
  strength: should
  section: 11.10.2
  applies_when: capabilities-described
  checkable: none
- id: IT4IT-MM-012
  statement: The simplified notation translates directly into the ArchiMate representation and is as formal as it.
  strength: note
  section: 11 (introduction)
  checkable: none
- id: IT4IT-MM-013
  statement: The Snapshot text says it is not an approved standard and conformance to it must not be specified or claimed. This applies to the draft text read for this research, not
    to the published 3.0 or 3.0.1.
  strength: note
  section: 1.3 (Snapshot)
  applies_when: snapshot-text
  checkable: none
- id: IT4IT-MM-014
  statement: 'Normative wording: "shall" is a requirement, "shall not" a prohibition, "should" a recommendation, "may" an option, "can" a possible behavior, and "will" means "shall".'
  strength: note
  section: '1.5'
  checkable: none
- id: IT4IT-MM-015
  statement: 'The standard focuses on key data objects only: those mandatory for end-to-end operational and financial traceability of the product lifecycle. Other data objects are outside
    its prescriptive control.'
  strength: note
  section: 11.7.5
  checkable: none
- id: IT4IT-MM-016
  statement: Only functional components that affect key data objects are part of the reference architecture. Corporate finance, HR and contract systems are not, except where the standard
    refers to them.
  strength: note
  section: 11.7.4
  checkable: none
- id: IT4IT-MM-017
  statement: Functional groups are only groupings. The standard does not prescribe what capabilities an organization builds; the capabilities shown in Figure 78 are illustrative.
  strength: note
  section: 11.7.3
  checkable: none
- id: IT4IT-MM-018
  statement: The Supporting Functions are defined only by the minimum functionality they must deliver and the essential data objects that main components expect from them; they are not
    normatively defined in this version.
  strength: note
  section: 3.1; 10 (introduction); 11.7.3
  checkable: none
- id: IT4IT-DEF-001
  statement: A functional component must have defined inputs and outputs that are data objects, and must have an impact on a key data object that it controls.
  strength: must
  section: 11.7.4
  checkable: partial
- id: IT4IT-DEF-002
  statement: A functional component typically controls one key data object; the architecture does not insist on this and a component can control several, especially if they are intrinsically
    connected.
  strength: note
  section: 11.7.4
  checkable: none
- id: IT4IT-DEF-003
  statement: A single data object can be controlled by only one functional component, although a component may control several data objects.
  strength: must
  section: 11.7.5
  checkable: static
- id: IT4IT-DEF-004
  statement: A data object must be controlled by applications; the standard defines the application building blocks for managing digital as functional components.
  strength: must
  section: '3.4'
  checkable: none
- id: IT4IT-DEF-005
  statement: The eight functional groups below the four core groups must be established, and populated by their functional components, to manage Digital Products.
  strength: must
  section: '3.4'
  checkable: none
- id: IT4IT-DEF-006
  statement: The stages of a value stream are not a sequence of activities. Value streams are abstract, not process descriptions.
  strength: note
  section: 11.8.1
  checkable: none
- id: IT4IT-DEF-007
  statement: A value stream stage is defined by its entrance and exit criteria, its main activities, example stakeholders, and its participating data objects together with the functions
    that contain them.
  strength: must
  section: 11.8.3; 5.x
  checkable: partial
- id: IT4IT-DEF-008
  statement: A value stream is defined by its scenarios, its stages, its key stakeholder, its value and its cross-value-stream dependencies.
  strength: must
  section: 5; 11.8.1
  checkable: partial
- id: IT4IT-DEF-009
  statement: The stakeholders listed for a stage are proposals, not normative requirements.
  strength: note
  section: 11.8.4
  checkable: none
- id: IT4IT-DEF-010
  statement: Stakeholders must be refined when the reference architecture is used to derive a concrete implementation architecture at Level 5.
  strength: must
  section: 11.8.4
  applies_when: level-5-derivation
  checkable: none
- id: IT4IT-DEF-011
  statement: A scenario defines a situation in which a value stream should be triggered to add value to the value network.
  strength: note
  section: 11.8.2
  checkable: none
- id: IT4IT-DEF-012
  statement: A value network describes relationships across value-creating functions; each activity both consumes value and produces it for potentially many other activities. It replaces
    the waterfall-style value chain.
  strength: note
  section: 11.7.1; 3.2
  checkable: none
- id: IT4IT-DEF-013
  statement: A system of record is a system that holds or controls authoritative source data. The lifecycle data objects are the authoritative or master data for managing digital.
  strength: note
  section: 11.7.6
  checkable: none
- id: IT4IT-DEF-014
  statement: A Digital Product must include one or more Service Offers that define the Service Contract options for consumers.
  strength: must
  section: '4.4'
  checkable: partial
- id: IT4IT-DEF-015
  statement: A Digital Product must provide interactions through machine interfaces, human interfaces, or both.
  strength: must
  section: '4.4'
  checkable: none
- id: IT4IT-DEF-016
  statement: A Digital Product may be delivered as a Digital Product Instance, consumed inside or outside an organization, depend on other Digital Products, be made of other Digital
    Products, and be a resource for other Digital Products. An instance may contain IT and non-IT resources and software.
  strength: note
  section: '4.4'
  checkable: none
- id: IT4IT-DEF-017
  statement: A Service Offer must include every element that will become part of the contract if the offer is accepted.
  strength: must
  section: 4.4.2
  checkable: none
- id: IT4IT-DEF-018
  statement: When a consumer accepts an offer, an instance of the Digital Product is created and the provider-consumer relationship is recorded in a contract based on that offer.
  strength: note
  section: 4.4.3
  checkable: none
- id: IT4IT-DEF-019
  statement: A Product Manager should be able to describe return on investment across the product lifecycle; offering an instance at no direct price should be a deliberate pricing decision
    explained in the product's lifetime financial model.
  strength: should
  section: 4.4.4
  checkable: none
- id: IT4IT-DEF-020
  statement: The system behind a Digital Product should not be retired until all contractual obligations are met or the contract is terminated under the provider-consumer agreement.
  strength: should
  section: '4.12'
  applies_when: retirement
  checkable: none
- id: IT4IT-DEF-021
  statement: A Digital Product Manager must consider end-of-life scenarios and give consumers recourse when a product reaches end of life.
  strength: must
  section: '4.12'
  applies_when: retirement
  checkable: none
- id: IT4IT-DEF-022
  statement: Until a system is retired, its resources and dependencies must be managed until no active consumers depend on it and all instances are retired, and longer where regulation
    requires data retention.
  strength: must
  section: '4.13'
  applies_when: retirement
  checkable: none
- id: IT4IT-DEF-023
  statement: Data governance must be applied across the whole product lifecycle, including retention and privacy compliance.
  strength: must
  section: '4.14'
  checkable: none
- id: IT4IT-DEF-024
  statement: Policies and controls should keep the design, planning, source and related information available for much longer than a project-oriented model would.
  strength: should
  section: '4.14'
  checkable: none
- id: IT4IT-DEF-025
  statement: A Service Offer should define all anticipated consumer interaction methods and set expectations for human and machine consumers, such as response time and planned downtime
    notice.
  strength: should
  section: '4.18'
  checkable: none
- id: IT4IT-DEF-026
  statement: 'Digital Product portfolios are managed from three perspectives: market-facing, internal-facing and foundational. The Product Portfolio component describes the same three
    tiers.'
  strength: note
  section: 4.9; 6.2.3
  checkable: none
- id: IT4IT-DEF-027
  statement: The Service Contract exists apart from the digital and physical components of the product and may need management long after instances and users are gone, for example for
    records retention.
  strength: note
  section: '4.15'
  checkable: none
- id: IT4IT-DEF-028
  statement: The Digital Product replaces the IT Service of the earlier version as the main entity; "Service System" becomes "System", and "service" is used mainly for delivery of products
    as a service.
  strength: note
  section: 4.5; Preface
  checkable: none
- id: IT4IT-NAME-001
  statement: A value stream is named with a verb that captures its essence. The "x2y" form is not used and the word "continuous" is not prefixed.
  strength: should
  section: 11.7.2
  checkable: static
- id: IT4IT-NAME-002
  statement: A functional group is named with a verb describing what the group of functions does.
  strength: should
  section: 11.7.3
  checkable: static
- id: IT4IT-NAME-003
  statement: A functional component is named with a noun, or a noun with a qualifier, describing what it manages. The word "component" may be appended as shorthand.
  strength: should
  section: 11.7.4
  checkable: static
- id: IT4IT-NAME-004
  statement: A data object is named with a noun describing what it controls.
  strength: should
  section: 11.7.5
  checkable: static
- id: IT4IT-NAME-005
  statement: Attribute names do not repeat the data object name (for example "Id", not "IncidentId"); a specific attribute is written with dot notation (for example "Incident.Id"), and
    names are reused wherever they mean the same thing.
  strength: should
  section: 11.9.1
  checkable: partial
- id: IT4IT-ATTR-001
  statement: Each data object must support the key attributes the standard lists for it. Implementations may add more but at Level 3 only this vendor-independent minimum is defined.
  strength: must
  section: 11.9.1; 6 to 10 (each data object)
  checkable: partial
- id: IT4IT-ATTR-002
  statement: A key attribute need not have a value for every instance. An approval attribute, for example, is filled only after approval happens.
  strength: note
  section: 11.9.1
  checkable: none
- id: IT4IT-ATTR-003
  statement: The most basic key attributes of a data object are a unique identifier and its lifecycle status; often others identify relationships to other data objects.
  strength: should
  section: 11.9.1
  checkable: partial
- id: IT4IT-ATTR-004
  statement: The Scope Agreement attribute Anticipated Business Value is marked optional, the only key attribute so marked.
  strength: note
  section: 6.2.2.1
  checkable: static
- id: IT4IT-REL-001
  statement: Each data object must maintain the key relationships the standard lists for it.
  strength: must
  section: 11.9.2; 6 to 10 (each data object)
  checkable: partial
- id: IT4IT-REL-002
  statement: 'Cardinality takes only three forms: 1:1 (at most one on each side), 1:n (at most one on the first side, many on the other) and n:m. Each means "can relate"; a requirement
    that a relationship exist is never stated, and UML multiplicity is not specified.'
  strength: must
  section: 11.9.2; Table 1
  checkable: static
- id: IT4IT-REL-003
  statement: 'Each relationship is documented as "A to B (x:y): reason", the first object being the one being described. 1:n and n:1 are the same relationship read from either end.'
  strength: note
  section: 11.9.2
  checkable: none
- id: IT4IT-REL-004
  statement: Only key relationships, those that advance the service lifecycle, are defined. Others may be kept for local needs, and optimizations such as a shortcut from an instance
    to its product are not recommended or prescribed.
  strength: note
  section: 11.9.2
  checkable: none
- id: IT4IT-REL-005
  statement: This version defines no reflexive relationships (a data object related to others of its own type); a future version will. The data object sections nevertheless list several,
    which is an inconsistency in the text.
  strength: note
  section: 11.7.7; 6 to 9
  checkable: none
- id: IT4IT-REL-006
  statement: Compliance with the prescribed system of record relationship mapping is what ensures end-to-end operational and financial traceability and model integrity.
  strength: note
  section: 11.7.7
  checkable: partial
- id: IT4IT-REL-007
  statement: 'A data flow is refined into a system of record integration only if all three conditions hold: it creates a relationship between two data objects in the components it connects;
    those two data objects must have a direct relationship to maintain; and their lifecycles are interlocked.'
  strength: must
  section: 11.9.4
  checkable: none
- id: IT4IT-REL-008
  statement: Data flows show where integration and data sharing are needed. They are not a process, the arrow starts at the component that normally triggers the exchange, and information
    may move both ways.
  strength: note
  section: 11.9.3
  checkable: none
- id: IT4IT-REL-009
  statement: 'Two kinds of data flow exist: system of record flows, which keep the information model consistent and traceable, and engagement flows, which help carry out the value streams.
    Engagement integrations are guidance, not prescription.'
  strength: note
  section: 11.9.3; 11.9.5
  checkable: none
- id: IT4IT-REL-010
  statement: The link between a Service Offer and a Product Release is made through the Product Release Blueprint.
  strength: note
  section: 11.7.9
  checkable: partial
- id: IT4IT-CRIT-001
  statement: The Policy component shall align and map to Enterprise Architecture; support role-based review and approval of Policies; give visibility into Policy attributes (types, status,
    non-compliance, audit history, risks, issues); govern Policies tied to downstream value stream stages; manage internal and external Policies with revision history; and track exceptions
    and waivers.
  strength: must
  section: 6.1.1 (Functional Criteria)
  checkable: none
  component: Policy
- id: IT4IT-CRIT-002
  statement: The Strategy component must align to business objectives and goals and stay aligned with the Architecture Roadmaps; and shall support periodic review of Strategic Themes,
    manage creation and closure of Strategic Objectives, show themes and initiatives as widely as possible, and trace each strategic initiative to the value streams it affects.
  strength: must
  section: 6.1.2 (Functional Criteria)
  checkable: none
  component: Strategy
- id: IT4IT-CRIT-003
  statement: The Enterprise Architecture component shall be the system of record for Architecture Roadmaps and Roadmap Items; develop the Architecture Vision; develop baseline and target
    architecture artifacts (business, information, application, technology, security); identify gaps; create the Architecture Blueprint; identify the migration strategy; identify reusable
    building blocks and the Digital Products that realize the target architecture; ensure artifacts comply with standards and policies and that the realized architecture meets KPIs and
    SLAs; ensure each Blueprint addresses Portfolio Backlog Items and stakeholder concerns; feed the Product Portfolio; and ensure created Digital Products comply with the Roadmap and
    Blueprint.
  strength: must
  section: 6.1.3 (Functional Criteria)
  checkable: none
  component: Enterprise Architecture
- id: IT4IT-CRIT-004
  statement: The component may identify intermediate Roadmap Items for incremental delivery, and can receive Strategic Objective and Portfolio Backlog Item information where those components
    exist.
  strength: note
  section: 6.1.3 (Functional Criteria)
  checkable: none
  component: Enterprise Architecture
- id: IT4IT-CRIT-005
  statement: The Portfolio Backlog component shall make proposed, accepted, rejected and prioritized Portfolio Backlog Items transparent, and execute the processes to review, accept,
    create, prioritize, update and close them.
  strength: must
  section: 6.2.1 (Functional Criteria)
  checkable: none
  component: Portfolio Backlog
- id: IT4IT-CRIT-006
  statement: The Proposal component shall create a Scope Agreement from rationalized Portfolio Backlog Items; for urgent items support a quick evaluation, notify the Portfolio Backlog
    component of a rejection, and update the Scope Agreement and in-flight Product Backlog Items; for structured proposals build labor and asset consumption models, take resource and
    asset prices from Offers where those exist, ensure the proposal meets technology policies, send proposed investments to the Investment component, compare planned and actual benefits,
    review change requests from Integrate, treat the Product Portfolio as the authoritative list of deliverables, and identify the security controls needed for each data classification.
  strength: must
  section: 6.2.2 (Functional Criteria)
  checkable: none
  component: Proposal
- id: IT4IT-CRIT-007
  statement: The component should validate the asset consumption model against available assets, model the ongoing labor and non-labor budget, rank proposals by benefits, risks and ROI,
    and actuate Product Portfolio entries through a project management system.
  strength: should
  section: 6.2.2 (Functional Criteria)
  checkable: none
  component: Proposal
- id: IT4IT-CRIT-008
  statement: A Scope Agreement may follow an expedited or a structured approval. The component may produce proposals periodically, define tangible and intangible benefits, build proposal
    scenarios for what-if analysis, and create Product Portfolio views.
  strength: note
  section: 6.2.2 (Functional Criteria)
  checkable: none
  component: Proposal
- id: IT4IT-CRIT-009
  statement: The Product Portfolio component must include all Digital Products, provide Service Offers through specific Product Designs and Releases, and track consumer contracts; and
    shall support portfolio-level funding and de-funding, review strategy and market input to propose portfolio changes, track backlog items used for investment priorities, assess the
    effectiveness and satisfaction of consumed Service Offers, manage an inventory of shared resources, systems, offers and instances, track all consumers, compare similar products,
    create and update Digital Products, keep service blueprints and endpoints, and aggregate charges from Chargeback where it exists.
  strength: must
  section: 6.2.3 (Functional Criteria)
  checkable: none
  component: Product Portfolio
- id: IT4IT-CRIT-010
  statement: The component should aggregate metrics (cost, performance, consumption, capacity, risk, benefits, quality) and ensure compliance with applicable Policies where a Policy
    component exists.
  strength: should
  section: 6.2.3 (Functional Criteria)
  checkable: none
  component: Product Portfolio
- id: IT4IT-CRIT-011
  statement: The component may support a taxonomy of portfolios and sub-portfolios, share roadmaps (including major and minor versions) with market, consumers, peers and partners, and
    send operation charge acceptance to Chargeback.
  strength: note
  section: 6.2.3 (Functional Criteria)
  checkable: none
  component: Product Portfolio
- id: IT4IT-CRIT-012
  statement: The Product Backlog component shall be the system of record for a product's Product Backlog Items; define standard item types (epics, features, stories); include security,
    risk and compliance items; prioritize each item; define customer value, size, effort, acceptance criteria and the Definition of Done; compute business impact and cost of delay; assess
    risk; manage lifecycle and status; coordinate planning and give execution oversight; report status and resources consumed; track time spent; trace items to the products being developed;
    associate the backlog with one Product Manager and one or more teams; and keep Portfolio Backlog Items traceable to realization in Product Releases.
  strength: must
  section: 7.1.1 (Functional Criteria)
  checkable: none
  component: Product Backlog
- id: IT4IT-CRIT-013
  statement: The component can associate requirements (including non-functional) with items, relate an item to a Portfolio Backlog Item, decompose items into sub-items, and use Scrum,
    Kanban or traditional project methods; it may integrate with Collaboration.
  strength: note
  section: 7.1.1 (Functional Criteria)
  checkable: none
  component: Product Backlog
- id: IT4IT-CRIT-014
  statement: The Requirement component shall be the system of record for Requirements; manage their lifecycle, state and changes across the product lifecycle; capture service level,
    user experience, security, risk, privacy, compliance, data management, and monitoring and logging requirements (security and compliance ones traceable to Policies); collect, refine,
    scope and track Requirements linked to Product Backlog Items; keep each Requirement traceable to its original source and to the Source and Test Cases; allow tracing to Test Cases
    and Policies where those components exist; and rank Requirements.
  strength: must
  section: 7.1.2 (Functional Criteria)
  checkable: none
  component: Requirement
- id: IT4IT-CRIT-015
  statement: The component can send requirement data to Product Design, and may relate Requirements to stakeholders and personas and link them to Portfolio Backlog Items.
  strength: note
  section: 7.1.2 (Functional Criteria)
  checkable: none
  component: Requirement
- id: IT4IT-CRIT-016
  statement: The Product Design component shall be the system of record for Product Designs; identify the design changes the backlog and Requirements need; maintain the design of the
    product and its parts, data model, integrations, security model, user experience, infrastructure, operations and support features, customer journeys and business processes; record
    the delivery model and the instrumentation for measuring performance; document compliance with non-functional requirements and with SLOs and XLAs; receive the product vision from
    the Product Portfolio; and support collaboration and review of design artifacts.
  strength: must
  section: 7.1.3 (Functional Criteria)
  checkable: none
  component: Product Design
- id: IT4IT-CRIT-017
  statement: The component may identify service suppliers for the chosen delivery model.
  strength: note
  section: 7.1.3 (Functional Criteria)
  checkable: none
  component: Product Design
- id: IT4IT-CRIT-018
  statement: The Source Control component shall be the system of record for Sources; associate each repository with its Digital Product; control access securely; manage the Source lifecycle;
    trace every update to Product Backlog Items; promote reuse; cover all source including infrastructure as code, automated tests and monitoring as code; inform stakeholders of updates;
    allow peer review, analytics and comparison of changes; verify code quality and conformance and analyze for security issues; hold Test Case code; and integrate with code editors.
  strength: must
  section: 7.1.4 (Functional Criteria)
  checkable: none
  component: Source Control
- id: IT4IT-CRIT-019
  statement: The component can integrate with external sources such as open-source libraries and vendor repositories.
  strength: note
  section: 7.1.4 (Functional Criteria)
  checkable: none
  component: Source Control
- id: IT4IT-CRIT-020
  statement: The Pipeline component shall keep Pipelines under version control and secured; associate each Pipeline with a source repository; manage and record executions; embed policy
    checks; track task progress; associate and trigger Test Plans; register the Build Package and update its status; link the Product Release to the Pipeline and update its status; create
    a Change to log and to announce deployments, use the Change component for impact assessment, wait for its approval; and start deployments through Fulfillment Orchestration.
  strength: must
  section: 7.1.5 (Functional Criteria)
  checkable: none
  component: Pipeline
- id: IT4IT-CRIT-021
  statement: A Pipeline may be managed as code in Source Control; it can be associated with a Digital Product and can use the Change component to schedule deployment in a change window.
  strength: note
  section: 7.1.5 (Functional Criteria)
  checkable: none
  component: Pipeline
- id: IT4IT-CRIT-022
  statement: The Build Package component shall be the authoritative source for Build Packages; manage their lifecycle from registration to archiving; secure them; keep a full audit trail;
    receive each package from its Pipeline and associate it with that Pipeline; ensure packages are safe to deploy; keep a bill of materials for each Product Release; scan packages and
    their dependencies for security, compliance and vulnerability issues before deployment; and associate packages with Test Plans.
  strength: must
  section: 7.1.6 (Functional Criteria)
  checkable: none
  component: Build Package
- id: IT4IT-CRIT-023
  statement: The component may receive packages and artifacts from external sources.
  strength: note
  section: 7.1.6 (Functional Criteria)
  checkable: none
  component: Build Package
- id: IT4IT-CRIT-024
  statement: The Release Composition component shall be the system of record for Product Releases and Product Release Blueprints; create them for the Fulfillment component to deploy;
    manage them for delivery of new or changed products; and include in the Blueprint the templates for Service Offers and for configuring Service Monitors.
  strength: must
  section: 7.1.7 (Functional Criteria)
  checkable: none
  component: Release Composition
- id: IT4IT-CRIT-025
  statement: The Test component shall maintain the test strategy and Test Plans; link Test Cases to Plans; use the Product Backlog to plan Test Cases; keep automated Test Cases in Source
    Control; trace tests to Requirements; plan and run tests for service levels, non-functional requirements and operations activities; include abuse cases; run unit, code quality, functional,
    security, vulnerability, penetration, performance, business process, regression and integration tests; create Defects; log runs and results; manage representative test data; report
    per Requirement or backlog item; be the system of record for Test Cases; manage their lifecycle; calculate coverage for new builds and releases; measure code quality; scan builds
    for vulnerabilities; build automated security tests; and run security tests early.
  strength: must
  section: 7.2.1 (Functional Criteria)
  checkable: none
  component: Test
- id: IT4IT-CRIT-026
  statement: The Defect component shall be the system of record for Defects; manage their lifecycle; track origin, status, importance and relation to Requirements and known errors; register
    all types of Defect including security; analyze and resolve them; report their status; create known errors for unresolved Defects; receive Defects from Test and from Problem; and
    provide them to the Product Backlog.
  strength: must
  section: 7.2.2 (Functional Criteria)
  checkable: none
  component: Defect
- id: IT4IT-CRIT-027
  statement: The component may document issues to communicate to Release Composition, and may consume Defects from Problem and Test.
  strength: note
  section: 7.2.2 (Functional Criteria)
  checkable: none
  component: Defect
- id: IT4IT-CRIT-028
  statement: The Consumption Experience component shall be available to all users who want to consume digital services; expose functionality by user profile and entitlement; expose relevant
    IT4IT functions in one place; classify each interaction (request for information, Order, Change or Incident) and route it; route requests to queues or fulfillers; let consumers search
    and read Knowledge Items; promote self-help and self-healing; let users raise, view and update tickets; and show planned and executed changes.
  strength: must
  section: 8.1.1 (Functional Criteria)
  checkable: none
  component: Consumption Experience
- id: IT4IT-CRIT-029
  statement: The component can send users to knowledge before they open a ticket, can engage Collaboration and Communication components for the front end, and can let consumers resolve
    more of their own issues.
  strength: note
  section: 8.1.1 (Functional Criteria)
  checkable: none
  component: Consumption Experience
- id: IT4IT-CRIT-030
  statement: The Identity component shall protect confidentiality through access control; make all consumers and their activities uniquely identifiable; confirm access to catalog items
    matches documented business needs with Entitlements attached to Identities; support compliance verification of access; and be able to list all consumers with portal access and their
    Entitlement levels.
  strength: must
  section: 8.1.2 (Functional Criteria)
  checkable: none
  component: Identity
- id: IT4IT-CRIT-031
  statement: The Offer component shall contain all Offers available to consumers; aggregate and provide a unified catalog through Consumption Experience; drive consumption through Service
    Offer Catalogs and help identify prices and options; and enable grouping of Service Offers.
  strength: must
  section: 8.1.3 (Functional Criteria)
  checkable: none
  component: Offer
- id: IT4IT-CRIT-032
  statement: The component may create the Service Contract template and pass it to the Service Level component.
  strength: note
  section: 8.1.3 (Functional Criteria)
  checkable: none
  component: Offer
- id: IT4IT-CRIT-033
  statement: The Order component shall tell the consumer the fulfillment status; supply Subscription information for the Chargeback Contract; confirm access matches Entitlements and
    Identity; supply delivery times for SLA measurement; break composite Orders into individual requests; send the bound Offer template to Change; rationalize and route clean orders
    to fulfillment; keep Subscription data updated and create Subscriptions on successful fulfillment; identify consumption trends; and keep traceability through the fulfillment channels.
  strength: must
  section: 8.1.4 (Functional Criteria)
  checkable: none
  component: Order
- id: IT4IT-CRIT-034
  statement: The component should send Service Contract instances to the Service Level component where one exists.
  strength: should
  section: 8.1.4 (Functional Criteria)
  checkable: none
  component: Order
- id: IT4IT-CRIT-035
  statement: The Chargeback component shall show consumers cost information at service level; calculate chargeback or showback; consolidate charges for a billing period; and send charges
    for an Actual Product Instance to the Product Portfolio where one exists.
  strength: must
  section: 8.1.5 (Functional Criteria)
  checkable: none
  component: Chargeback
- id: IT4IT-CRIT-036
  statement: The component should send a Chargeback Record for approval and internal reconciliation to the finance function where one exists.
  strength: should
  section: 8.1.5 (Functional Criteria)
  checkable: none
  component: Chargeback
- id: IT4IT-CRIT-037
  statement: The component can take actual Usage into account.
  strength: note
  section: 8.1.5 (Functional Criteria)
  checkable: none
  component: Chargeback
- id: IT4IT-CRIT-038
  statement: The Change component shall be the system of record for change requests; manage Change state and lifecycle; communicate with stakeholders and notify those affected; assess
    risk and support impact assessment; keep each Change related to the actual service for Configuration use; keep a Change calendar and manage conflicting deployments; associate Fulfillment
    Orders with Changes and Changes with Desired Product Instances, Incidents and (where it exists) Problems; and classify each Change as standard, emergency or normal from its risk
    profile.
  strength: must
  section: 8.2.1 (Functional Criteria)
  checkable: none
  component: Change
- id: IT4IT-CRIT-039
  statement: The component may support automating Change execution; it can accept Changes directly from the Pipeline and can give Change data to Event and Monitoring for root cause analysis.
  strength: note
  section: 8.2.1 (Functional Criteria)
  checkable: none
  component: Change
- id: IT4IT-CRIT-040
  statement: The Fulfillment Orchestration component shall orchestrate the implementation of Change Orders across fulfillment systems or manual tasks; get resources from the Resource
    component; choose and coordinate fulfillment mechanisms and their dependencies; create a Desired Product Instance from the Product Release template for a new product system; report
    Subscription status to Order; and create the Actual Product Instance as a copy of the Desired Product Instance in Configuration.
  strength: must
  section: 8.2.2 (Functional Criteria)
  checkable: none
  component: Fulfillment Orchestration
- id: IT4IT-CRIT-041
  statement: The component should modify the Desired Product Instance for all consumer Subscriptions to track delivery.
  strength: should
  section: 8.2.2 (Functional Criteria)
  checkable: none
  component: Fulfillment Orchestration
- id: IT4IT-CRIT-042
  statement: The component may keep a registry of fulfillers, generate Fulfillment Orders and the Desired Product Instance from the bound Offer template, update the resource inventory,
    and order dependent services; it can create or change Service Monitors, route Orders externally and trigger fulfillment automation.
  strength: note
  section: 8.2.2 (Functional Criteria)
  checkable: none
  component: Fulfillment Orchestration
- id: IT4IT-CRIT-043
  statement: The Resource component shall manage the pool of Resources behind services; establish the resource requirements of services; ensure physical and virtual pool availability
    for Order fulfillment; and keep soft and hard limits and quotas and act when they are breached.
  strength: must
  section: 8.2.3 (Functional Criteria)
  checkable: none
  component: Resource
- id: IT4IT-CRIT-044
  statement: The component may provide capacity utilization to the Usage component.
  strength: note
  section: 8.2.3 (Functional Criteria)
  checkable: none
  component: Resource
- id: IT4IT-CRIT-045
  statement: The Fulfillment component shall ensure fulfillment activities are standardized and automated, or well documented if manual; keep automated Runbooks updated with routine
    deployment and configuration activity; and check that Fulfillment Books run as designed.
  strength: must
  section: 8.2.4 (Functional Criteria)
  checkable: none
  component: Fulfillment
- id: IT4IT-CRIT-046
  statement: The component can let Fulfillment Orchestration trigger automated Fulfillment Books.
  strength: note
  section: 8.2.4 (Functional Criteria)
  checkable: none
  component: Fulfillment
- id: IT4IT-CRIT-047
  statement: The Usage component shall encrypt sensitive usage information or restrict access to it; collect the cost of sub-services when a service is decomposed; collect usage from
    vendor invoices for Resources the service uses; and collect the cost of capacity used to deliver the service.
  strength: must
  section: 8.2.5 (Functional Criteria)
  checkable: none
  component: Usage
- id: IT4IT-CRIT-048
  statement: The component may track actual usage, break it down by Subscription, consumer and provider, collect metrics from Monitoring and feed Chargeback; it can generate usage reports.
    A Usage Record may use any unit.
  strength: note
  section: 8.2.5 (Functional Criteria)
  checkable: none
  component: Usage
- id: IT4IT-CRIT-049
  statement: The Service Level component shall be the system of record for the Service Contract; manage the lifecycle and state of Service Contracts and KPIs and the relations between
    them; report quality of service per SLO; and, where Order exists, create a Service Contract instance and start measuring it when a Subscription is instantiated.
  strength: must
  section: 9.1.1 (Functional Criteria)
  checkable: none
  component: Service Level
- id: IT4IT-CRIT-050
  statement: The component may take measurements from Monitoring and Incident, instantiate a Service Contract from an Offer template, and report service level status to Consumption Experience.
  strength: note
  section: 9.1.1 (Functional Criteria)
  checkable: none
  component: Service Level
- id: IT4IT-CRIT-051
  statement: The Incident component shall be the system of record for Incidents; manage state, escalation and lifecycle; allow an Incident to start from an Event; create an Incident
    when an Interaction cannot join an existing one; and create a Problem when an Incident is severe, needs deep investigation or repeats.
  strength: must
  section: 9.1.2 (Functional Criteria)
  checkable: none
  component: Incident
- id: IT4IT-CRIT-052
  statement: The component may trigger a Runbook, trigger an emergency Change, give business measurements to Service Level and receive knowledge from the Knowledge component.
  strength: note
  section: 9.1.2 (Functional Criteria)
  checkable: none
  component: Incident
- id: IT4IT-CRIT-053
  statement: The Problem component shall be the system of record for Problems; manage state and lifecycle; receive Incident information to create a Problem; send Change information for
    a fix; and push Problem data needing emergency development to the Defect component.
  strength: must
  section: 9.1.3 (Functional Criteria)
  checkable: none
  component: Problem
- id: IT4IT-CRIT-054
  statement: The component may send Problems to the Portfolio Backlog, send known errors to Knowledge, and push data to Diagnostics and Remediation to trigger a Runbook.
  strength: note
  section: 9.1.3 (Functional Criteria)
  checkable: none
  component: Problem
- id: IT4IT-CRIT-055
  statement: The Knowledge component shall be the system of record for Knowledge Items; manage state and lifecycle; create Knowledge Items from known errors in Problem; let consumers
    and staff rank items; provide knowledge for consumers and for digital operations including diagnostics and remediation; let all users contribute content; and reduce service desk
    requests through self-service.
  strength: must
  section: 9.1.4 (Functional Criteria)
  checkable: none
  component: Knowledge
- id: IT4IT-CRIT-056
  statement: The component may aggregate internal and external sources, share knowledge through Consumption Experience, and improve access through search, filtering, natural language
    queries, third-party knowledge and trend analytics.
  strength: note
  section: 9.1.4 (Functional Criteria)
  checkable: none
  component: Knowledge
- id: IT4IT-CRIT-057
  statement: The Configuration component shall be the system of record for Actual Product Instances and their relationships; manage their lifecycle; create them from the Desired Product
    Instance; hold the realization of the service in production; and calculate change impact and the business impact of Incidents and Events.
  strength: must
  section: 9.2.1 (Functional Criteria)
  checkable: none
  component: Configuration
- id: IT4IT-CRIT-058
  statement: The component may be populated by service discovery.
  strength: note
  section: 9.2.1 (Functional Criteria)
  checkable: none
  component: Configuration
- id: IT4IT-CRIT-059
  statement: The Monitoring component shall be the system of record for Service Monitors; monitor all aspects of an Actual Product Instance including infrastructure, applications, security
    and product instances; store all measurement results; compute compound monitors from simple measurements; and manage the Service Monitor lifecycle.
  strength: must
  section: 9.2.2 (Functional Criteria)
  checkable: none
  component: Monitoring
- id: IT4IT-CRIT-060
  statement: The component may monitor customer experience, service-level attainment, usage and service status for other components, and may receive monitor definitions from Fulfillment
    Orchestration.
  strength: note
  section: 9.2.2 (Functional Criteria)
  checkable: none
  component: Monitoring
- id: IT4IT-CRIT-061
  statement: The Event component shall be the system of record for Events; manage their state and lifecycle; manage correlation between Events; categorize Event data; receive Events
    from Service Monitors; and forward Events categorized as Incidents to the Incident component.
  strength: must
  section: 9.2.3 (Functional Criteria)
  checkable: none
  component: Event
- id: IT4IT-CRIT-062
  statement: The component may start a Change from Event data and send automated remediation to Diagnostics and Remediation.
  strength: note
  section: 9.2.3 (Functional Criteria)
  checkable: none
  component: Event
- id: IT4IT-CRIT-063
  statement: The Diagnostics and Remediation component shall be the system of record for Runbooks and manage their lifecycle.
  strength: must
  section: 9.2.4 (Functional Criteria)
  checkable: none
  component: Diagnostics & Remediation
- id: IT4IT-CRIT-064
  statement: The component may allow an Event, Incident or Problem to trigger a Runbook for diagnostics or remediation.
  strength: note
  section: 9.2.4 (Functional Criteria)
  checkable: none
  component: Diagnostics & Remediation
- id: IT4IT-CRIT-065
  statement: The Cost Modeling component shall be the reference for cost allocation to the corresponding resource.
  strength: must
  section: 10.1.1 (Functional Criteria)
  checkable: none
  component: Cost Modeling
- id: IT4IT-CRIT-066
  statement: The component may be structured by categories of resource and may include a simulation capability.
  strength: note
  section: 10.1.1 (Functional Criteria)
  checkable: none
  component: Cost Modeling
- id: IT4IT-CRIT-067
  statement: The Investment component shall be the authoritative source for investments requested over a period; manage the whole investment lifecycle; receive development investment
    requests from Proposal; assess feasibility and obtain Finance approval; and report the final scoping and investment decisions to stakeholders.
  strength: must
  section: 10.1.2 (Functional Criteria)
  checkable: none
  component: Investment
- id: IT4IT-CRIT-068
  statement: The component may receive proposed run, maintain and non-service investments from investment owners.
  strength: note
  section: 10.1.2 (Functional Criteria)
  checkable: none
  component: Investment
- id: IT4IT-VS-001
  statement: Evaluate stages shall co-create the vision and strategic roadmap and define Strategic Themes and Objectives (Gather Influencers); assess the current state, identify gaps
    and draft Scope Agreements (Identify Gaps); weigh value, risk, cost, time and resources and classify investment and divestment themes (Propose Investments); and further define Scope
    Agreements (Define Backlog Mandates).
  strength: must
  section: 5.1.2 to 5.1.6 (Activities)
  checkable: none
  value_stream: Evaluate
- id: IT4IT-VS-002
  statement: Evaluate stages should consider existing roadmaps, demand and constraints and review standards for compliance gaps; consider consumer surveys and research needs and run
    a capability assessment; analyze priority, urgency and impact; consider the existing portfolio and managed service provider agreements, develop the Architecture Roadmap and rationalize
    the portfolio as Retain, Replace, Re-Build or Retire; and develop guardrails, traceable repositories and confirm use of enablers (Ensure Governance).
  strength: should
  section: 5.1.2 to 5.1.6 (Activities)
  checkable: none
  value_stream: Evaluate
- id: IT4IT-VS-003
  statement: Evaluate stages may run an environmental scan, identify improvement and rationalization opportunities, run what-if analysis, consolidate demand, create Architecture Blueprints
    and identify architecture enablers.
  strength: note
  section: 5.1.2 to 5.1.6 (Activities)
  checkable: none
  value_stream: Evaluate
- id: IT4IT-VS-004
  statement: Explore stages shall prioritize and refine qualified Portfolio Backlog Items (Prioritize Backlog Items); create Architecture Blueprints and validate product viability with
    stakeholders (Define Digital Product Architecture); translate Scope Agreements into smaller work, organize it into work packages, size and prioritize it and update the Scope Agreement
    (Refine Product Backlog); and assign resources to work packages, obtain stakeholder agreement to the roadmap, track and report progress, and update Portfolio Backlog Items with build
    and deliver status (Finalize Roadmap and Scope Agreement).
  strength: must
  section: 5.2.2 to 5.2.5 (Activities)
  checkable: none
  value_stream: Explore
- id: IT4IT-VS-005
  statement: Explore stages should ensure scoped items deliver value, mitigate risk and meet governance criteria, plan program increments and align portfolio and product roadmaps; define
    the conceptual architecture, research best practice and establish business impacts; and determine dependencies.
  strength: should
  section: 5.2.2 to 5.2.5 (Activities)
  checkable: none
  value_stream: Explore
- id: IT4IT-VS-006
  statement: Explore stages may weigh new revenue, themes and directives, adjust funding, group and rationalize items, re-validate the Scope Agreement, re-confirm alignment, create Blueprints
    per work package, refine the business case, hold regular planning meetings and update work packages.
  strength: note
  section: 5.2.2 to 5.2.5 (Activities)
  checkable: none
  value_stream: Explore
- id: IT4IT-VS-007
  statement: Integrate stages shall analyze stakeholder needs, capture, refine and prioritize Product Backlog Items, and create the test strategy and sprint plan (Plan Product Release);
    define requirements, create and approve the Product Design, define Test Plans and Cases, develop or configure changes and commit them (Design and Develop); create build artifacts
    in continuous integration, review code, validate compliance and security, create the release package, deploy to test environments, run tests against policy and identify Defects (Build,
    Integrate and Test); and review release readiness, have the Product Manager accept the release, inform stakeholders and publish the release package (Accept and Publish Release).
  strength: must
  section: 5.3.2 to 5.3.5 (Activities)
  checkable: none
  value_stream: Integrate
- id: IT4IT-VS-008
  statement: Integrate stages may compile code where applicable.
  strength: note
  section: 5.3.2 to 5.3.5 (Activities)
  checkable: none
  value_stream: Integrate
- id: IT4IT-VS-009
  statement: Deploy stages shall estimate deployment time and downtime, ensure resources, plan the deployment time and obtain required approvals (Plan and Approve Deployment); create
    the Desired Product Instance topology, reserve Resources, create Orders for dependent services, verify the orchestration and Fulfillment Books, deploy Build Package artifacts, Runbooks,
    Service Monitors and Knowledge Items (Fulfill Deployment); discover the deployed items and compare them with the desired model, check components, Service Monitors, Logs and service
    level monitoring are running, and check known errors are registered (Validate Deployment); and observe Logs, Events and service levels and decide whether to patch forward or roll
    back (Observe Deployment).
  strength: must
  section: 5.4.2 to 5.4.5 (Activities)
  checkable: none
  value_stream: Deploy
- id: IT4IT-VS-010
  statement: Deploy stages may validate that Knowledge Items exist for accepted Defects, inform support specialists, suppress monitoring Events during the change window, start the Actual
    Product Instance, and observe test consumption.
  strength: note
  section: 5.4.2 to 5.4.5 (Activities)
  checkable: none
  value_stream: Deploy
- id: IT4IT-VS-011
  statement: Release stages shall take in demand for new, changed, bundled and terminated Service Offers, check offer information is complete and take in catalog structure changes (Define
    Service Offer); create or update the Service Offer and maintain its price list, access, catalog structure and views (Implement Service Offer); and activate the offer at its valid-from
    date and ensure it is in the catalog and reachable by the target consumers (Publish Service Offer).
  strength: must
  section: 5.5.2 to 5.5.4 (Activities)
  checkable: none
  value_stream: Release
- id: IT4IT-VS-012
  statement: Release stages may plan release activities and dates, end an offer's validity, inform and promote, and sell the offer; stages can inform stakeholders of upcoming changes.
  strength: note
  section: 5.5.2 to 5.5.4 (Activities)
  checkable: none
  value_stream: Release
- id: IT4IT-VS-013
  statement: Consume stages shall show Service Offers in searchable form and enable filtering and assessment (Select an Offer); have the customer accept the Service Contract terms (Agree
    to Service Offer); orchestrate Desired Product Instance fulfillment and deliver the Actual Product Instance with access (Subscribe to Service Offer); give self-help, help requests,
    issue reporting, resolutions, escalation and feedback to development (Provide Service Support); and collect usage statistics, calculate KPIs and notify consumers of ongoing issues
    (Publish Service Status).
  strength: must
  section: 5.6.2 to 5.6.6 (Activities)
  checkable: none
  value_stream: Consume
- id: IT4IT-VS-014
  statement: Consume stages may advertise across channels and predict future impact; stages can measure the Service Contract against agreed terms.
  strength: note
  section: 5.6.2 to 5.6.6 (Activities)
  checkable: none
  value_stream: Consume
- id: IT4IT-VS-015
  statement: Operate stages shall create Events or Incidents when policies or thresholds are breached and assign prioritized ones to a resolver group (Detect Issue); propose and approve
    a course of action (Diagnose Issue); and ensure everything is in place to resolve Incidents and Events and close related Incidents, Interactions and Events (Resolve Issue).
  strength: must
  section: 5.7.2 to 5.7.4 (Activities)
  checkable: none
  value_stream: Operate
- id: IT4IT-VS-016
  statement: Operate stages should proactively monitor instances (discover topology, track usage, detect issues, report patterns), detect incoming issues from the service desk, correlate
    Events and Incidents; understand severity and impact and find fixes and workarounds, identify root causes; collaborate on executing the course of action and validate success with
    consumer acceptance.
  strength: should
  section: 5.7.2 to 5.7.4 (Activities)
  checkable: none
  value_stream: Operate
diagram_types:
  Level 1 End-to-End Overview:
    defined_by: Chapter 3; 11.3; 11.7
    admits:
    - ValueNetwork
    - ValueStream
    - FunctionalGroup
    - FunctionalComponent
    - KeyDataObject
    - BackboneDataObject
    - DataRelationship
    conventions: Value streams, the four core groups and the Supporting Functions, the functional diagram of groups, components and data objects, and the Digital Product and Service
      Offer backbones (Figures 1 to 9, 76 to 86). The text of 11.7.5 says Level 1 is depicted without data objects and relationships, citing Figure 7, but Figure 7 draws both; Figure 86 shows Level
      1 in ArchiMate notation.
  Level 2 Value Stream Documentation:
    defined_by: Chapter 5; 11.4; 11.8
    admits:
    - ValueStream
    - Scenario
    - ValueStreamStage
    - Stakeholder
    - LifecycleDataObject
    - FunctionalComponent
    - FunctionalGroup
    conventions: One value stream model and one detailed model per value stream (Figures 20 to 34) with scenarios, stages, stakeholders and participating data objects with their containing
      functions (Figure 87 summarizes the ArchiMate structure).
  Level 3 Vendor-Independent Architecture:
    defined_by: Chapters 6 to 10; 11.5; 11.9
    admits:
    - FunctionalGroup
    - FunctionalComponent
    - KeyDataObject
    - BackboneDataObject
    - DataRelationship
    - SystemOfRecordIntegration
    - EngagementIntegration
    conventions: One model per functional group and one per functional component (Figures 35 to 74). System of record integrations are a black dotted line with a solid end arrow named
      by the data object transferred; engagement integrations are a blue dotted line with a solid end arrow named by the engagement or action that triggers it. Cardinality is not drawn;
      it is written in each data object's relationship list.
  Level 4 Vendor and Integrator Extensions:
    defined_by: 11.10.1 to 11.10.4 (non-normative)
    admits:
    - Capability
    - EssentialService
    - Scenario
    - FunctionalComponent
    - LifecycleDataObject
    conventions: Not standardized. Vendors and integrators may add attributes, non-key data objects, other notations (for example UML for data models), process, canonical data models
      and integration techniques, all mappable back to Levels 1 to 3. Essential services are drawn as an oval inside a functional component in the informal notation.
  Level 5 Implementation Architecture:
    defined_by: 11.10.5 (non-normative)
    admits:
    - Capability
    - EssentialService
    - FunctionalComponent
    - LifecycleDataObject
    - Stakeholder
    conventions: Not standardized. The full ArchiMate language can specify an actual current or future state implementation of the reference architecture.
data_types:
  coverage: none
  note: The standard defines no data types, lengths, or lists of values. Each key attribute has a name and a short description in its data object's section, and nothing more.
  attributes:
    coverage: some_concepts
    where: reference_model.data_objects
    key: key_attributes
    section: 11.9.1; chapters 6 to 10 (each data object's Key Attributes)
    note: All 46 data objects list key attributes, 292 in all, as names under key_attributes. They belong to the reference model's data objects, so no entry under concepts holds any.
notation:
  coverage: normative
  section: 11.7 to 11.10
  note: The definitions chapter gives each main concept a simplified form and an ArchiMate form, and says the first translates directly into the second and is as formal. It states no duty to use either. `shape` is the simplified form and `archimate` the other; `form` archimate marks an entry the figures show in that form only. All colors are the standard's, and figures also show the two forms mixed.
  elements:
    ValueNetwork:
      form: archimate
      shape: tan rounded rectangle
      marker: chevron at top right
      label: inside
      section: 11.1 (Figure 75)
    ValueStream:
      shape: blue block arrow pointing right
      archimate: pale yellow rounded rectangle with a chevron marker at top right; tan in the metamodel and value stream figures
      label: inside
      section: 11.7.2 (Figure 77)
    ValueStreamStage:
      form: archimate
      shape: tan chevron pointing right, in a row with the other stages inside its value stream; Figure 87 shows a tan rounded rectangle with a chevron marker instead
      label: inside
      section: 5.1 (Figure 22); 11.8.4 (Figure 87)
    Scenario:
      form: archimate
      shape: purple box inside its value stream
      marker: circular target at top right
      label: inside
      section: 11.8.4 (Figure 87)
    Stakeholder:
      form: archimate
      shape: purple box with clipped corners, inside its stage
      marker: small pill shape at top right
      label: inside
      section: 11.1 (Figure 75); 11.8.4 (Figure 87)
    FunctionalGroup:
      shape: blue rounded rectangle with black outline; Figure 7 draws groups as pale rounded rectangles with a teal outline, holding their contents
      archimate: white rounded rectangle; Figures 75 and 78 draw a dashed rectangle with the name at the top
      label: inside, at the top when it holds contents
      section: 11.7.3 (Figures 78 and 79); 3.3.7 (Figure 7)
    FunctionalComponent:
      shape: rectangle, blue for a primary component and gray for a secondary one
      archimate: pale cyan rectangle labeled "[Application Function]", rounded when it holds data objects; a component's own model shows it cyan and its neighbors gray
      marker: upward chevron at top right, doubled in Figure 82
      label: inside, at the top when it holds data objects
      section: 11.7.4 (Figure 80); 11.7.5 (Figure 82); 11.9.3 (Figure 88)
    LifecycleDataObject:
      shape: black circle
      archimate: pale cyan rectangle with a thin band across the top
      label: white, inside
      section: 11.7.5 (Figure 81)
    KeyDataObject:
      shape: black circle
      archimate: pale cyan rectangle with a thin band across the top
      label: white, inside
      section: 11.7.5 (Figure 81)
    BackboneDataObject:
      shape: orange circle
      archimate: orange rectangle with a thin band across the top
      label: inside
      section: 11.7.5; 11.7.8 (Figure 85); 3.3.7 (Figure 7)
    DigitalProductBackbone:
      shape: an orange line joining its orange circles
      archimate: gold rectangle with its name in a thin band across the top, holding its orange data objects joined by lines
      section: 3.3.7 (Figure 7); 11.7.8 (Figure 85)
    ServiceOfferBackbone:
      shape: an orange line joining its orange circles
      archimate: gold rectangle with its name in a thin band across the top, holding its orange data objects joined by lines
      section: 3.3.7 (Figure 7); 11.7.8 (Figure 85)
    KeyAttribute:
      form: archimate
      shape: pale cyan rectangle with a thin band across the top, in the metamodel figure only; models document attributes as lists of text
      label: inside
      section: 11.1 (Figure 75); 11.9.1
    Capability:
      form: archimate
      shape: tan rounded rectangle
      marker: stepped blocks at top right
      label: inside
      section: 11.7.3 (Figure 78); 11.1 (Figure 75)
    EssentialService:
      shape: oval inside a functional component
      archimate: pale cyan rounded rectangle with an oval marker at top right
      label: inside
      section: 11.10.3; 11.1 (Figure 75)
    Process:
      form: archimate
      shape: pale yellow rounded rectangle
      marker: block arrow at top right
      label: inside
      section: 11.1 (Figure 75)
  relationships:
    DataRelationship:
      line: solid black line, heavy in the simplified form; Figure 7 draws the links among backbone data objects in orange
      source_end: none
      target_end: none
      label: none; cardinality is not drawn
      section: 11.7.7 (Figure 83)
    DataObjectRelatesToDataObject:
      line: the same line as DataRelationship
      source_end: none
      target_end: none
      label: none; cardinality is not drawn
      section: 11.7.7 (Figure 83)
    SystemOfRecordIntegration:
      line: black dotted line, drawn with dashes in Figure 88, between two functional components
      source_end: none, at the component that would normally trigger the exchange
      target_end: solid arrowhead
      label: the data object transferred
      section: 11.9.3 (Figure 88); 11.9.5
    EngagementIntegration:
      line: blue dotted line, drawn with dashes in Figures 36 and 88, between two functional components
