quick_links:
  status: read on screen, measured on EA 17.1 build 1716, 2026-11-04; two sources
  from_a_participant: '''Create Multiple Elements...'', ''Requirement'' (submenu: Realization) and ''Common'': no SoaML-specific
    quick link'
  from_a_serviceInterface: EA's generic UML class links (Artifact, Capability, Class, Component, InformationItem, Interface, Object,
    Package, Profile, Note, Common); the menu was cut off at the screen edge and the submenus were not opened
tags_of_note:
  isID: created true for both id and property; the standard's default is false
  connectorRequired: on port, requestPoint and servicePoint only (not on request or service); default true
  isStrict: on collaboration and serviceContract stored empty; on collaborationUse default true
  progress: on milestone, free text, empty until set
conventions:
  ports_need_a_parent: a Port element cannot be created in a package; create it as a child of the participant (ParentID)
  attribute_stereotypes: attachment, id and property go on an attribute or a Part element, never on a package-level element
  flags_not_set_by_the_stereotype: agent does not set the class's active flag, request and requestPoint do not set the port's conjugated
    flag (measured on elements created through the API; the toolbox items were not tried)
  port_typing: a port is typed by its classifier (t_object.Classifier); the validator cannot read it
  channels: serviceChannel is a Connector between two Port elements; EA does not order the ends
harvest:
  shipped-xml: not available (encrypted internal technology)
  sample-content:
  - stored metaclass (Object_Type) per stereotype and per extra metaclass, binding (t_xref FQName), tagged values with Values and
    Default notes, attribute and Part forms, connector types, diagram types (t_diagram, StyleEx MDGDgm)
  binding-matrix: every name set with StereotypeEx on 18 element types, 17 connector types, attributes, methods, parameters, Port
    and Part children
  ui: 'the Resources tab gives 25 names and 38 rows; the metaclass per row was not recorded there.
    Measured on EA 17.1 build 1716, 2026-11-04: the profile lists 38 rows and the same 25 names with the same repeats; the four
    inferred second rows (agent, participant, capability, participantArchitecture) are listed with a component-style icon, but
    the tab prints no metaclass; Diagram Types, Toolboxes, the toolbox pages of one diagram and two quick-link sources were read.'
  ea_build: 17.1 build 1716

# EA's names for this language's layout. tools/gen_conventions.py reads layout_map.
layout_map:
  technology: SoaML
  display_name: SoaML
  extends: UML
  stereotype_prefix: ''
  notes: |
    EA has two diagram types for this language. `SoaML` draws the guide's Services Architecture and its other views except Choreography. This map has no entry for `SoaMLSequence`, because UML leaves its Sequence base to EA and an entry on that base would pull plain UML sequence diagrams into SoaML. The standard names no diagram types. Route names are conventions, not measurements.

    `SoaML` is the id EA reports, measured on EA 17.1 build 1716.
  diagram_types:
    SoaML:
      guide: Services Architecture
      base: Component
      size_keys:
        collaboration: Collaboration
        Collaboration: Collaboration
        collaborationUse: CollaborationUse
        CollaborationUse: CollaborationUse
        serviceContract: ServiceContract
        ServiceContract: ServiceContract
        servicesArchitecture: ServicesArchitecture
        ServicesArchitecture: ServicesArchitecture
        milestone: Milestone
        Milestone: Milestone
        port: Port
        Port: Port
        request: Request
        requestPoint: Request
        Request: Request
        service: Service
        servicePoint: Service
        Service: Service
