# Unified Profile for DoDAF and MODAF (UPDM) 2.1: language file (schema_version 1).
# Written from the standard only (OMG formal/13-08-04 and the normative profile file). Tool-neutral.
schema_version: 1
id: updm-2
name: Unified Profile for DoDAF and MODAF (UPDM)
owner:
  name: Object Management Group
  kind: standards-body
standard:
  name: Unified Profile for DoDAF and MODAF
  version: '2.1'
  status: published
  reference: OMG formal/13-08-04 (specification, July 2013; the document carries the date August 2013); normative machine-readable profile dtc/12-10-04 (UPDM-Profile.xmi) and DoDAF library dtc/12-11-05; https://www.omg.org/spec/UPDM/2.1/. Version
    2.1.1 (May 2017, also ISO/IEC 19513:2019) supersedes it and is not described. UPDM has been succeeded by the Unified Architecture Framework (UAF), see the uaf-1 language file.
notes: 'UPDM is a UML profile, defined at two compliance levels: level 0 extends UML and imports ten SoaML elements, level 1 adds the whole SysML profile and constraints that pair SysML elements with UPDM elements. It maps two architecture frameworks
  onto one set of elements: the DoDAF 2.02 meta-model (DM2) and the MODAF 1.2 meta-model (M3). The elements common to both are the Core; DoDAF-only and MODAF-only elements are mostly aliases (specializations that give a concept the other framework''s
  name). The standard is organized around the meta-models, not the views; the 52 DoDAF models and 47 MODAF views are produced from the one element set. Concepts here are the 226 profile elements named as the profile writes them; UML and SysML
  elements named as bases are described in the UML and SysML language files, not here. Multiplicity of relationships is not stated; each is many-to-many and optional at both ends. Every constraint rule reads "(or a specialization)" because the
  standard''s wording varies on this point. The end sets of a relationship are the formal constraints of the profile; where the standard states only the two end sets separately, they are not paired.'
concepts:
  source: UPDM 2.1 clause 8.3 (226 profile elements; generalizations, abstract flags, extended UML element, attributes and constraints as the normative profile file states them, matching the entries of clause 8.3.1) and the 39 level 1 constraints
    of clause 8.3. The kind key is this library's classification. Definitions are in our own words. Section numbers are those of the package that holds the entry.
  elements:
    CompetenceProvider:
      display: CompetenceProvider
      category: Core/Operational/Organizational/Actual
      kind: abstract
      abstract: true
      specializes:
      - UPDMElement
      section: 8.3.1.1.4.4.18.1
      definition: Abstract grouping of the actual people and actual organizational resources that can provide a competence.
    ActualOrganization:
      display: ActualOrganization
      category: Core/Operational/Organizational/Actual
      kind: actual
      specializes:
      - ActualOrganizationalResource
      uml_base: InstanceSpecification
      section: 8.3.1.1.4.4.18.1
      definition: A specific real organization, an instance of an Organization.
      attributes:
        - {name: "ratifiedStandards", type: "Standard", multiplicity: "*"}
        - {name: "code/symbol", type: "String", multiplicity: "0..1"}
        - {name: "serviceType", type: "String", multiplicity: "0..1"}
    ActualOrganizationalResource:
      display: ActualOrganizationalResource
      category: Core/Operational/Organizational/Actual
      kind: abstract
      abstract: true
      specializes:
      - LocationHolder
      - CompetenceProvider
      section: 8.3.1.1.4.4.18.1
      definition: Abstract grouping of actual organizations and actual posts.
    ActualPost:
      display: ActualPost
      category: Core/Operational/Organizational/Actual
      kind: actual
      specializes:
      - ActualOrganizationalResource
      uml_base: InstanceSpecification
      section: 8.3.1.1.4.4.18.1
      definition: A specific real post, an instance of a Post.
    ActualOrganizationRelationship:
      display: ActualOrganizationRelationship
      category: Core/Operational/Organizational/Actual
      kind: relationship
      specializes:
      - UPDMElement
      uml_base: InformationFlow
      section: 8.3.1.1.4.4.18.1
      definition: A relationship between two actual organizational resources, such as a command line, that can carry exchange elements.
    ActualPerson:
      display: ActualPerson
      category: Core/Operational/Organizational/Actual
      kind: actual
      specializes:
      - LocationHolder
      - CompetenceProvider
      uml_base: InstanceSpecification
      section: 8.3.1.1.4.4.18.1
      definition: A named individual who fills an actual post; an instance of a Person.
    ActualOrganizationRole:
      display: ActualOrganizationRole
      category: Core/Operational/Organizational/Actual
      kind: actual
      specializes:
      - UPDMElement
      uml_base: Slot
      section: 8.3.1.1.4.4.18.1
      definition: Records that an actual organizational resource fulfils a role within an actual organization.
    FillsPost:
      display: FillsPost
      category: Core/Operational/Organizational/Actual
      kind: relationship
      specializes:
      - UPDMElement
      uml_base: Dependency
      section: 8.3.1.1.4.4.18.1
      definition: States that an actual person fills an actual post, optionally for a date range.
      attributes:
        - {name: "endDate", type: "ISO8601DateTime", multiplicity: "0..1"}
        - {name: "startDate", type: "ISO8601DateTime", multiplicity: "0..1"}
    CompetenceRequirer:
      display: CompetenceRequirer
      category: Core/Operational/Organizational/Typical
      kind: abstract
      abstract: true
      specializes:
      - UPDMElement
      section: 8.3.1.1.4.4.18.2
      definition: Abstract grouping of the organizations, posts and responsibilities that can require a competence.
    Responsibility:
      display: Responsibility
      category: Core/Operational/Organizational/Typical
      kind: element
      specializes:
      - CompetenceRequirer
      - OrganizationalResource
      uml_base: Class
      section: 8.3.1.1.4.4.18.2
      definition: A duty that a post or organization holds.
    ProvidesCompetence:
      display: ProvidesCompetence
      category: Core/Operational/Organizational/Typical
      kind: relationship
      specializes:
      - UPDMElement
      uml_base: Dependency
      section: 8.3.1.1.4.4.18.2
      definition: States that a kind of resource provides a competence.
      attributes:
        - {name: "universalPropertySet", type: "ActualPropertySet", multiplicity: "0..*"}
    Organization:
      display: Organization
      category: Core/Operational/Organizational/Typical
      kind: element
      specializes:
      - OrganizationalResource
      uml_base: Class
      section: 8.3.1.1.4.4.18.2
      definition: A type of group of people associated for a purpose.
    Post:
      display: Post
      category: Core/Operational/Organizational/Typical
      kind: element
      specializes:
      - OrganizationalResource
      - CompetenceRequirer
      uml_base: Class
      section: 8.3.1.1.4.4.18.2
      definition: A type of point of contact or responsible role, such as a desk officer; a category of persons defined by the roles they share.
    OrganizationalResource:
      display: OrganizationalResource
      category: Core/Operational/Organizational/Typical
      kind: abstract
      abstract: true
      specializes:
      - PhysicalResource
      section: 8.3.1.1.4.4.18.2
      definition: Abstract grouping of organizations and posts as resources.
    Person:
      display: Person
      category: Core/Operational/Organizational/Typical
      kind: element
      specializes:
      - UPDMElement
      uml_base: Class
      section: 8.3.1.1.4.4.18.2
      definition: A type of human being; defines the characteristics captured for actual persons (rank, address and so on).
    RequiresCompetence:
      display: RequiresCompetence
      category: Core/Operational/Organizational/Typical
      kind: relationship
      specializes:
      - UPDMElement
      uml_base: Dependency
      section: 8.3.1.1.4.4.18.2
      definition: States that a role or organizational resource needs a competence.
      attributes:
        - {name: "measurementSet", type: "ActualPropertySet", multiplicity: "0..*"}
    ConceptItem:
      display: ConceptItem
      category: Core/Operational/Structure
      kind: abstract
      abstract: true
      specializes:
      - UPDMElement
      section: 8.3.1.1.4.4
      definition: Abstract grouping of items that can appear in a high-level operational concept.
    NodeParent:
      display: NodeParent
      category: Core/Operational/Structure
      kind: abstract
      abstract: true
      specializes:
      - Participant
      section: 8.3.1.1.4.4
      definition: 'Abstract owner of child nodes: a logical architecture, a problem domain or a node.'
    Mission:
      display: Mission
      category: Core/Operational/Structure
      kind: behavior
      specializes:
      - SubjectOfOperationalConstraint
      uml_base: Activity
      section: 8.3.1.1.4.4
      definition: A purpose, together with the task, that a person, organization or autonomous system is assigned.
      attributes:
        - {name: "MissionArea", type: "String", multiplicity: "*"}
    ArbitraryConnector:
      display: ArbitraryConnector
      category: Core/Operational/Structure
      kind: relationship
      specializes:
      - UPDMElement
      uml_base: Dependency
      section: 8.3.1.1.4.4
      definition: A purely visual connection between concept roles in a high-level operational concept; carries no architectural meaning.
    NodeRole:
      display: NodeRole
      category: Core/Operational/Structure
      kind: role
      specializes:
      - UPDMElement
      uml_base: Property
      section: 8.3.1.1.4.4
      definition: A use of a node inside a parent node, linking the parent to its sub-nodes.
      attributes:
        - {name: "performsInContext", type: "OperationalActivity", multiplicity: "*"}
    HighLevelOperationalConcept:
      display: HighLevelOperationalConcept
      category: Core/Operational/Structure
      kind: element
      specializes:
      - UPDMElement
      uml_base: Class
      section: 8.3.1.1.4.4
      definition: A generalized picture of operations, composed of concept roles, for one or more missions.
      attributes:
        - {name: "mission", type: "Mission", multiplicity: "*"}
    ConceptRole:
      display: ConceptRole
      category: Core/Operational/Structure
      kind: role
      specializes:
      - UPDMElement
      uml_base: Property
      section: 8.3.1.1.4.4
      definition: The use of a concept item within a high-level operational concept.
    Competence:
      display: Competence
      category: Core/Operational/Structure
      kind: element
      specializes:
      - SubjectOfForecast
      - PropertySet
      uml_base: Class
      section: 8.3.1.1.4.4
      definition: A set of abilities defined by knowledge, skills and attitude (a skill in DoDAF terms).
    LogicalArchitecture:
      display: LogicalArchitecture
      category: Core/Operational/Structure
      kind: element
      specializes:
      - NodeParent
      uml_base: Class
      section: 8.3.1.1.4.4
      definition: A composite whose parts are node roles, problem domains or known resources; the logical (materiel-independent) architecture.
    Needline:
      display: Needline
      category: Core/Operational/Structure
      kind: relationship
      specializes:
      - UPDMElement
      uml_base: Connector
      section: 8.3.1.1.4.4
      definition: A requirement to exchange information between nodes; bundles operational exchanges without saying how they are carried.
    SecurityDomain:
      display: SecurityDomain
      category: Core/Operational/Structure
      kind: element
      specializes:
      - Node
      uml_base: Class
      section: 8.3.1.1.4.4
      definition: A node whose members all share one security policy.
    OperationalConstraint:
      display: OperationalConstraint
      category: Core/Operational/Structure
      kind: rule
      specializes:
      - UPDMElement
      - Rule
      uml_base: Constraint
      section: 8.3.1.1.4.4
      definition: A rule governing an operational behavior or property.
    NodePort:
      display: NodePort
      category: Core/Operational/Structure
      kind: port
      specializes:
      - UPDMElement
      uml_base: Port
      section: 8.3.1.1.4.4
      definition: A distinct interaction point of a node through which operational exchange items flow.
    SubjectOfOperationalConstraint:
      display: SubjectOfOperationalConstraint
      category: Core/Operational/Structure
      kind: abstract
      abstract: true
      specializes:
      - UPDMElement
      section: 8.3.1.1.4.4
      definition: Abstract grouping of anything an operational constraint or operational state description can apply to.
    KnownResource:
      display: KnownResource
      category: Core/Operational/Structure
      kind: role
      specializes:
      - NodeRole
      uml_base: Property
      section: 8.3.1.1.4.4
      definition: States that a known system resource plays a part in the operational architecture.
    Node:
      display: Node
      category: Core/Operational/Structure
      kind: element
      specializes:
      - ActivitySubject
      - SubjectOfOperationalConstraint
      - NodeParent
      - SubjectOfOperationalStateMachine
      uml_base: Class
      section: 8.3.1.1.4.4
      definition: A logical entity that performs operational activities, specified independently of any physical realization (an operational node).
      attributes:
        - {name: "connectedNodes", type: "Node", multiplicity: "*"}
    NodeOperation:
      display: NodeOperation
      category: Core/Operational/Behavior
      kind: behavior
      specializes:
      - UPDMElement
      uml_base: Operation
      section: 8.3.1.1.4.1
      definition: A partial or full realization of an operational activity by a node.
      attributes:
        - {name: "realizes", type: "OperationalActivity", multiplicity: "0..1"}
    OperationalParameter:
      display: OperationalParameter
      category: Core/Operational/Behavior
      kind: behavior
      specializes:
      - UPDMElement
      uml_base: Parameter
      section: 8.3.1.1.4.1
      definition: An input or output of an operational activity, typed by an operational exchange item.
    OperationalState:
      display: OperationalState
      category: Core/Operational/Behavior
      kind: behavior
      specializes:
      - DesiredState
      uml_base: State
      section: 8.3.1.1.4.1
      definition: A state identified within an operational state description.
    OperationalActivityAction:
      display: OperationalActivityAction
      category: Core/Operational/Behavior
      kind: behavior
      specializes:
      - UPDMElement
      uml_base: CallBehaviorAction
      section: 8.3.1.1.4.1
      definition: A call of an operational activity from within another; relates an activity to its sub-activities.
    OperationalActivity:
      display: OperationalActivity
      category: Core/Operational/Behavior
      kind: behavior
      specializes:
      - Activity
      - SubjectOfOperationalConstraint
      - Process
      uml_base: Activity
      section: 8.3.1.1.4.1
      definition: A logical process specified independently of how it is carried out; work done in conducting the business of the enterprise.
      attributes:
        - {name: "realizedBy", type: "NodeOperation", multiplicity: "*"}
        - {name: "subject", type: "ActivitySubject", multiplicity: "*"}
    OperationalMessage:
      display: OperationalMessage
      category: Core/Operational/Behavior
      kind: behavior
      specializes:
      - UPDMElement
      uml_base: Message
      section: 8.3.1.1.4.1
      definition: A message in an operational event trace that carries operational exchanges.
      attributes:
        - {name: "carries", type: "OperationalExchange", multiplicity: "*"}
        - {name: "operation", type: "NodeOperation", multiplicity: "0..1"}
    OperationalStateDescription:
      display: OperationalStateDescription
      category: Core/Operational/Behavior
      kind: behavior
      specializes:
      - UPDMElement
      uml_base: StateMachine
      section: 8.3.1.1.4.1
      definition: A state machine describing an operational behavior or property of a node.
    OperationalActivityEdge:
      display: OperationalActivityEdge
      category: Core/Operational/Behavior
      kind: behavior
      specializes:
      - UPDMElement
      uml_base: ActivityEdge
      section: 8.3.1.1.4.1
      definition: A flow of control or objects between operational activities, carrying operational exchange items.
      attributes:
        - {name: "carriedItem", type: "OperationalExchangeItem", multiplicity: "*"}
    SubjectOfOperationalStateMachine:
      display: SubjectOfOperationalStateMachine
      category: Core/Operational/Behavior
      kind: abstract
      abstract: true
      specializes:
      - UPDMElement
      section: 8.3.1.1.4.1
      definition: Abstract grouping of the elements an operational state machine can describe.
    OperationalEventTrace:
      display: OperationalEventTrace
      category: Core/Operational/Behavior
      kind: behavior
      specializes:
      - UPDMElement
      uml_base: Interaction
      section: 8.3.1.1.4.1
      definition: A time-ordered specification of the interactions between nodes for one scenario.
    OperationalExchangeItem:
      display: OperationalExchangeItem
      category: Core/Operational/Flows
      kind: abstract
      abstract: true
      specializes:
      - ActivitySubject
      - Resource
      section: 8.3.1.1.4.3
      definition: 'Abstract grouping of whatever can be exchanged between nodes: information, artifacts, energy, organizational resources, configurations, geo-political extents.'
    Command:
      display: Command
      category: Core/Operational/Flows
      kind: relationship
      specializes:
      - ResourceInteraction
      uml_base: InformationFlow
      section: 8.3.1.1.4.3
      definition: States that one organizational resource commands another.
    OperationalExchange:
      display: OperationalExchange
      category: Core/Operational/Flows
      kind: relationship
      specializes:
      - Exchange
      - SubjectOfOperationalConstraint
      uml_base: InformationFlow
      section: 8.3.1.1.4.3
      definition: A flow of information, materiel, energy, people, configuration or geo-political extent between two nodes, formed when an activity of one node uses what an activity of another produces.
      attributes:
        - {name: "exchangeKind", type: "OperationalExchangeKind", multiplicity: "0..1"}
    LogicalDataModel:
      display: LogicalDataModel
      category: Core/Operational/Data
      kind: package
      specializes:
      - DataModel
      uml_base: Package
      section: 8.3.1.1.4.2
      definition: A package specifying business information requirements as a formal logical data structure, free of product-specific concerns.
    SubjectOfForecast:
      display: SubjectOfForecast
      category: Core/Systems/Structure
      kind: abstract
      abstract: true
      specializes:
      - UPDMElement
      section: 8.3.1.1.7.4
      definition: Abstract grouping of anything a forecast can be about (systems, standards, competences).
    ResourcePort:
      display: ResourcePort
      category: Core/Systems/Structure
      kind: port
      specializes:
      - ProtocolImplementation
      uml_base: Port
      section: 8.3.1.1.7.4
      definition: An interface, logical or physical, that a resource provides; may implement protocols.
    WholeLifeConfiguration:
      display: WholeLifeConfiguration
      category: Core/Systems/Structure
      kind: element
      specializes:
      - UPDMElement
      uml_base: Class
      section: 8.3.1.1.7.4
      definition: The set of all versions of a capability configuration over time.
    ResourceArtifact:
      display: ResourceArtifact
      category: Core/Systems/Structure
      kind: element
      specializes:
      - PhysicalResource
      uml_base: Class
      section: 8.3.1.1.7.4
      definition: A type of man-made object (a car, a radio, fuel); combines physical element, energy and data to accomplish a function.
    ResourceRole:
      display: ResourceRole
      category: Core/Systems/Structure
      kind: role
      specializes:
      - UPDMElement
      uml_base: Property
      section: 8.3.1.1.7.4
      definition: The use of a system resource as a part within another resource.
      attributes:
        - {name: "performsInContext", type: "Function", multiplicity: "*"}
        - {name: "RoleKind", type: "RoleKind", multiplicity: "1"}
    ResourceInterface:
      display: ResourceInterface
      category: Core/Systems/Structure
      kind: relationship
      specializes:
      - UPDMElement
      uml_base: Connector
      section: 8.3.1.1.7.4
      definition: A contractual agreement between two resource roles to exchange items through protocols.
      attributes:
        - {name: "realizingConnector", type: "ResourceConnector", multiplicity: "*"}
    FieldedCapability:
      display: FieldedCapability
      category: Core/Systems/Structure
      kind: actual
      specializes:
      - UPDMElement
      uml_base: InstanceSpecification
      section: 8.3.1.1.7.4
      definition: An actual, fully realized capability, identified by its capability configuration.
    Forecast:
      display: Forecast
      category: Core/Systems/Structure
      kind: relationship
      specializes:
      - UPDMElement
      uml_base: Dependency
      section: 8.3.1.1.7.4
      definition: A statement about the future state of a kind of system, standard or competence over a date range.
      attributes:
        - {name: "endDate", type: "ISO8601DateTime", multiplicity: "0..1"}
        - {name: "startDate", type: "ISO8601DateTime", multiplicity: "0..1"}
    ResourceConnector:
      display: ResourceConnector
      category: Core/Systems/Structure
      kind: relationship
      specializes:
      - ProtocolImplementation
      uml_base: Connector
      section: 8.3.1.1.7.4
      definition: A physical connection between two resource ports that implements protocols.
      attributes:
        - {name: "realizedExchange", type: "ResourceInteraction", multiplicity: "*"}
        - {name: "realizedInterface", type: "ResourceInterface", multiplicity: "*"}
    PhysicalResource:
      display: PhysicalResource
      category: Core/Systems/Structure
      kind: element
      abstract: true
      specializes:
      - SystemResource
      uml_base: Class
      section: 8.3.1.1.7.4
      definition: Abstract supertype of the physical, organizational and functional resources that can contribute to a capability.
    Software:
      display: Software
      category: Core/Systems/Structure
      kind: element
      specializes:
      - ResourceArtifact
      uml_base: Class
      section: 8.3.1.1.7.4
      definition: An executable computer program.
    ResourceConstraint:
      display: ResourceConstraint
      category: Core/Systems/Structure
      kind: rule
      specializes:
      - Rule
      uml_base: Constraint
      section: 8.3.1.1.7.4
      definition: A rule on the structure or function of an implementation, including on its organizational resources.
    SystemResource:
      display: SystemResource
      category: Core/Systems/Structure
      kind: element
      abstract: true
      specializes:
      - Participant
      - ResourceInteractionItem
      - SubjectOfForecast
      - OperationalExchangeItem
      uml_base: Class
      section: 8.3.1.1.7.4
      definition: Abstract placeholder for any resource in the solution architecture.
      attributes:
        - {name: "milestone", type: "ActualProjectMilestone", multiplicity: "*"}
    PhysicalArchitecture:
      display: PhysicalArchitecture
      category: Core/Systems/Structure
      kind: element
      specializes:
      - SystemResource
      uml_base: Class
      section: 8.3.1.1.7.4
      definition: A configuration of resources for a purpose.
    SubjectOfResourceConstraint:
      display: SubjectOfResourceConstraint
      category: Core/Systems/Structure
      kind: abstract
      abstract: true
      specializes:
      - UPDMElement
      section: 8.3.1.1.7.4
      definition: Abstract grouping of anything a resource constraint can apply to.
    Materiel:
      display: Materiel
      category: Core/Systems/Structure
      kind: element
      specializes:
      - ResourceInteractionItem
      uml_base: Class
      section: 8.3.1.1.7.4
      definition: Equipment, apparatus or supplies of interest, regardless of administrative or combat use.
    VersionOfConfiguration:
      display: VersionOfConfiguration
      category: Core/Systems/Structure
      kind: role
      specializes:
      - UPDMElement
      uml_base: Property
      section: 8.3.1.1.7.4
      definition: States that a capability configuration is a version of a whole-life configuration.
    CapabilityConfiguration:
      display: CapabilityConfiguration
      category: Core/Systems/Structure
      kind: element
      specializes:
      - PhysicalArchitecture
      uml_base: Class
      section: 8.3.1.1.7.4
      definition: A composite of the physical and human resources and their interactions configured to provide a capability; the DoDAF performer in the solution architecture.
      attributes:
        - {name: "doctrine", type: "Constraint", multiplicity: "*"}
    ResourceInteractionItem:
      display: ResourceInteractionItem
      category: Core/Systems/Flows
      kind: abstract
      abstract: true
      specializes:
      - Resource
      section: 8.3.1.1.7.3
      definition: 'Abstract grouping of the items exchanged between resources: formalized data or information.'
      attributes:
        - {name: "affectedFunctions", type: "Function", multiplicity: "*"}
    ResourceInteraction:
      display: ResourceInteraction
      category: Core/Systems/Flows
      kind: relationship
      specializes:
      - Exchange
      - SubjectOfResourceConstraint
      uml_base: InformationFlow
      section: 8.3.1.1.7.3
      definition: An exchange of items between two system resources, such as data between systems or conversations between people.
    ResourceStateMachine:
      display: ResourceStateMachine
      category: Core/Systems/Behavior
      kind: behavior
      specializes:
      - UPDMElement
      uml_base: StateMachine
      section: 8.3.1.1.7.1
      definition: A state machine describing the states of a resource.
    ResourceParameter:
      display: ResourceParameter
      category: Core/Systems/Behavior
      kind: behavior
      specializes:
      - UPDMElement
      uml_base: Parameter
      section: 8.3.1.1.7.1
      definition: An input or output of a function, typed by a resource interaction item.
    FunctionEdge:
      display: FunctionEdge
      category: Core/Systems/Behavior
      kind: behavior
      specializes:
      - UPDMElement
      uml_base: ActivityEdge
      section: 8.3.1.1.7.1
      definition: A flow of control or objects between functions, carrying resource interaction items.
      attributes:
        - {name: "carriedItem", type: "ResourceInteractionItem", multiplicity: "*"}
    Function:
      display: Function
      category: Core/Systems/Behavior
      kind: behavior
      specializes:
      - Activity
      - SubjectOfResourceConstraint
      uml_base: Activity
      section: 8.3.1.1.7.1
      definition: An activity specified in the context of the resource that performs it.
      attributes:
        - {name: "realizedBy", type: "ResourceOperation", multiplicity: "*"}
