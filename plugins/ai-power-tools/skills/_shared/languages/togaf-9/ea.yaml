# EA facts for TOGAF 9.1 as Sparx Enterprise Architect's built-in TOGAF technology stores them.
# Generated from a read-back of the technology in EA; do not edit by hand.
# Every stereotype and tag below was created in EA and read back. `concepts` maps the 55 concepts of the language guide to the stored stereotypes
# (status: same-name, near-name, ieee1471, not-in-ea).
# Westbrook Bank appears only in howto.md, as an illustration.

language: togaf-9
technology: TOGAF
api_technology_id: TOGAF
profiles:
  TOGAF: stereotypes qualified TOGAF::<name>; 204 stored names
  IEEE1471: stereotypes qualified IEEE1471::<name>; 16 names, not a technology id of its own
  FEAF: not cataloged (a separate framework)
display_name: TOGAF
stereotype_prefix: ''
stereotype_storage: bare name in t_object.Stereotype and t_connector.Stereotype, without spaces and in the case the technology gives it (BusinessService,
  OrganizationUnit, ADM_Preliminary, `influence`); the qualified form TOGAF::<name> or IEEE1471::<name> is the FQName in the t_xref row named Stereotypes
  and is what AddNew and StereotypeEx take. Only the FIRST stereotype of an element is in t_object.Stereotype. The Resources tab shows display text with
  spaces, not the stored name.
measured_on:
  ea: 17.1 build 1716
  date: '2026-10-21'
  technology_version: '3.0'
  technology_file: 'none: the technology is built into EA and its definition is encrypted; measured by creating objects'
version_note: The guide and this reference describe TOGAF 9.1. EA's technology reports version 3.0 (Repository.GetTechnologyVersion('TOGAF')), a number
  of its own that names no edition. The Open Group has published TOGAF 9.2 (2018) and the TOGAF Standard 10th Edition (2022); neither was studied, so nothing here says which edition EA's stereotypes follow.
counts:
  resources_tab_rows: 206
  stored_names_distinct: 204
  togaf_stereotypes_bound: 204
  togaf_elements: 125
  togaf_connectors: 75
  togaf_attribute_stereotypes: 4
  ieee1471_bound: 16
  ieee1471_rows_on_resources_tab: 16
  diagram_types_bound: 7
