# UML 2.5.1 Conformance Ruleset
# Language:     UML 2.5.1 (OMG formal/17-12-05), as Sparx Enterprise Architect stores it: EA's own element and connector types, no technology
# Enforced by:  AI Power Tools for Sparx EA - validate_model tool (the engine with rules by EA type and where-it-sits rules)
# Generated from the language skill's rules; do not edit by hand.
#
# UML IS NOT AN MDG TECHNOLOGY IN EA. A class, a use case or a port is told apart by EA's own element type (t_object.Object_Type) and a
# generalization or a control flow by its connector type (t_connector.Connector_Type); almost none of them carries a stereotype. So the
# rules here select by `types:` and `connector_types:`, and name an element at a connector's end, in a table or in a container as
# `type:<Object_Type>`. The type names are EA's, measured on EA 17.1 build 1716: `StateNode`, `ActionPin`,
# `Sequence` (a lifeline), `Realisation` (British spelling), `StateFlow` (a transition), `UseCase` (an actor-to-use-case association).
#
# KEYWORD STEREOTYPES ARE PLAIN TEXT. EA applies no profile to the UML keywords: include, extend, import, access, merge, substitute, call,
# send, create, instantiate are free strings on a connector (include and extend with SubType Includes and Extends). The Standard Profile
# stereotypes of EA's StandardProfileL2 are capitalized (Call, Send, Create, Instantiate); the rules name both spellings.
#
# WHAT THE VALIDATOR CANNOT SEE. It reads an element's type, stereotype, tags, connector counts and containers, and a connector's type,
# stereotype and two ends. It cannot read attributes, operations, parameters, multiplicities, the kind of a pseudostate or action (a stored
# number), the operator of a combined fragment, generalization chains, what a part or port is typed by, names, or numeric values. Most of
# UML's rules are about those, so only 23 of the language skill's rules are in this file; the
# others are review guidance.
#
# ENDPOINT LISTS. The engine's endpoint condition takes a list for each end. A rule that bans a few types lists every other EA element type
# the catalog found; an EA type added later passes.
#
# Sources:
#   [S1] OMG, Unified Modeling Language (UML) Version 2.5.1, formal/17-12-05  https://www.omg.org/spec/UML/2.5.1
#   [S2] Sparx Systems, Enterprise Architect 17.1 (the element and connector types are EA's own; the Standard Profile is StandardProfileL2)

meta:
  version: "0.1"
  language: uml-2
  organization: "(your organization)"
  mdg_family: UML
  description: >
    Conformance rules for UML 2.5.1 models built with Sparx Enterprise Architect's native UML types: what a generalization, a use case
    connector, an information flow, a communication path and the keyword usages may join, that a control flow and an object flow keep to
    control and object nodes, the edges of a decision and a merge node, where a port, a region and a node's children may sit, and
    which parts and ports a connector joins. Each rule names the rules.md id it implements.
  severity_levels:
    error: A requirement of the standard (rules.md strength must)
    warning: Guidance of the standard (rules.md strength should)
    info: Advisory note; not a conformance violation

