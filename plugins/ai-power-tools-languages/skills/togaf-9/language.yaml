      display: Capability
      category: Content metamodel
      module: core
      section: '34.5'
      attributes:
      - {name: Business value, description: How the capability provides value to the enterprise.}
      - {name: Increments, description: Possible maturity or quality levels of the capability.}
    Constraint: {display: Constraint, category: Content metamodel, module: core, section: '34.5', attributes: []}
    Contract:
      display: Contract
      category: Content metamodel
      module: governance
      section: 34.4.1; 34.5
      attributes:
      - {name: Behavior characteristics, description: Functional behavior supported within the contract.}
      - {name: Service name "caller", description: The consuming service.}
      - {name: Service name "called", description: The providing service.}
      - {name: Service quality characteristics, description: Non-functional behavior supported within the contract.}
      - {name: Availability characteristics, description: How far the item can be relied on to be in use when wanted.}
