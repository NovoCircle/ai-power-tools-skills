# IT4IT Reference Architecture language file (schema_version 1).
# Written from the standard only. Concept names are the standard's own terms without spaces.
# Tool-neutral: no tool facts live here.
schema_version: 1
id: it4it
name: IT4IT Reference Architecture
owner:
  name: The Open Group
  kind: standards-body
standard:
  name: 'IT4IT Standard: A Reference Architecture for Managing Digital'
  version: '3.0'
  status: read from the public draft, with no claim of conformance
  reference: The Open Group, IT4IT Standard, Version 3.0.1, document C24A, published 24 October 2024 (supersedes version 3.0, C221, 18 October 2022), https://publications.opengroup.org/c24a
  basis: The text read is the public Snapshot draft of version 3.0 (document S220, February 2022), read from an archived copy of https://pubs.opengroup.org/it4it/3.0/snapshot/. The published
    3.0 and 3.0.1 texts require a sign-in and were not read, so counts, wording and section numbers may differ. Every section reference in this file is to the Snapshot text.
  newer_draft: The Open Group IT4IT Standard, Version 3.1 (Snapshot), document S261, published 12 October 2026, valid through 31 March 2027. Not read.
concepts:
  source: IT4IT Snapshot 3.0, chapter 11 (definitions and metamodel) with chapters 3 and 4. 26 metamodel concepts. The standard says its metamodel has ten normative concepts and some
    non-normative ones, pictured in Figure 75 (11.1). The figure has 17 boxes, and 16 concepts here are those boxes (L1 and L2 Grouping are both FunctionalGroup, Value Stage is ValueStreamStage,
    Product Backbone Data Object is BackboneDataObject, Attribute is KeyAttribute, SoR Integration is SystemOfRecordIntegration, and Relationship is DataRelationship). The other ten come from
    the text and aren't in the figure, namely KeyDataObject, DigitalProductBackbone, ServiceOfferBackbone, SystemOfRecord, EngagementIntegration, DigitalProduct, ServiceOffer, ServiceContract,
    DigitalProductInstance, and System. The text doesn't name the ten normative concepts. Our reading of the figure's level tags, marked as a reading, is that the boxes tagged only with Levels
    1 to 3 make ten when the two groupings count as one. The figure tags Lifecycle Data Object 2 and 3, while the text of 11.7 introduces data objects at Level 1; this file follows the text.
    Section 11.7 says "six core concepts" and then lists eight, among them "Management capabilities". The reference model that the standard specifies as instances of these concepts (value
    streams, stages, functional groups, functional components, data objects) is under reference_model. Generalizations are inferred from the text; the standard never declares a concept abstract.
  groups:
    Level 1:
      defined_by: Chapter 3; 11.3; 11.7
      notes: Overview-level concepts.
    Level 2:
      defined_by: Chapter 5; 11.4; 11.8
      notes: Value stream documentation.
    Level 3:
      defined_by: Chapters 6 to 10; 11.5; 11.9
      notes: Vendor-independent architecture.
    Level 4 (non-normative):
      defined_by: '11.10'
      notes: Vendor and integrator extensions.
    Digital Product (chapter 4):
      defined_by: Chapter 4
      notes: The Digital Product and its offer, contract and instance.
  elements:
    ValueNetwork:
      display: Value Network
      category: Level 1
      section: 11.7.1; 3.2
      definition: 'The model of the digital business function: the relationships across value-creating functions, including primary activities (planning, production, consumption, fulfillment,
        support) and supporting ones (finance, HR, governance, supplier management).'
    ValueStream:
      display: Value Stream
      category: Level 1
      section: 11.7.2; 11.8.1; 5
      definition: The key value-creating activities for a discrete area of the value network, where net value is added to the Digital Product as it moves through its lifecycle. The standard
        defines seven.
    Scenario:
      display: Scenario
      category: Level 2
      section: 11.8.2; 5.x.1
      definition: A situation in which a value stream should be triggered to add value.
    ValueStreamStage:
      display: Value Stream Stage
      category: Level 2
      section: 11.8.3; 5.x
      definition: A refinement of a value stream, defined by entry and exit criteria, main activities, example stakeholders and participating data objects.
      specializes: ValueStream
    Stakeholder:
      display: Stakeholder
      category: Level 2
      section: 11.8.4
      definition: A persona or role an organization is expected to engage in a given stage; the listed ones are proposals.
    FunctionalGroup:
      display: Functional Group
      category: Level 1
      section: 11.7.3; 3.1
      definition: A grouping of functional components and data objects that gives context to the functionality an organization must deliver. Five at Level 1 and fourteen at Level 2.
    FunctionalComponent:
      display: Functional Component
      category: Level 1
      section: 11.7.4
      definition: The smallest unit of technology that stands alone and is useful to a digital practitioner; it has data object inputs and outputs and affects the key data object it
        controls.
    LifecycleDataObject:
      display: Lifecycle Data Object
      category: Level 1
      section: 11.7.5
      definition: Data that annotates or models an aspect of a Digital Product being planned, developed, offered or consumed; aligned with the UML idea of an artifact.
    KeyDataObject:
      display: Key Data Object
      category: Level 1
      section: 11.7.5; 11.7.8
      definition: A lifecycle data object essential to end-to-end traceability. Drawn black in the simplified notation.
      specializes: LifecycleDataObject
    BackboneDataObject:
      display: Backbone Data Object
      category: Level 1
      section: 11.7.8; 11.7.9
      definition: A key data object that forms part of the Digital Product Backbone or the Service Offer Backbone. Drawn orange in the simplified notation.
      specializes: KeyDataObject
    DigitalProductBackbone:
      display: Digital Product Backbone
      category: Level 1
      section: 11.7.8
      definition: 'The group of backbone data objects giving a holistic view of a product in its planning, development, consumable or running state: Digital Product, Product Design,
        Product Release, Desired Product Instance and Actual Product Instance.'
    ServiceOfferBackbone:
      display: Service Offer Backbone
      category: Level 1
      section: 11.7.9
      definition: 'The group of backbone data objects that control and define consumption: Service Offer, Subscription, Chargeback Contract and Service Contract.'
    SystemOfRecord:
      display: System of Record
      category: Level 1
      section: 11.7.6
      definition: An authoritative source system; the lifecycle data objects are the authoritative or master data.
    DataRelationship:
      display: Data Relationship
      category: Level 1
      section: 11.7.7; 11.9.2
      definition: An essential relationship between two data objects, with a cardinality of 1:1, 1:n or n:m.
    KeyAttribute:
      display: Key Attribute
      category: Level 3
      section: 11.9.1
      definition: An attribute an implementation must support for a data object; the vendor-independent minimum.
    DataFlow:
      display: Data Flow
      category: Level 3
      section: 11.9.3
      definition: A flow of information between functional components that exposes the need for integration.
    SystemOfRecordIntegration:
      display: System of Record Integration
      category: Level 3
      section: 11.9.4
      definition: A data flow refined to keep a relationship between two data objects consistent.
      specializes: DataFlow
    EngagementIntegration:
      display: System of Engagement Integration
      category: Level 3
      section: 11.9.5
      definition: A data flow that helps human or machine interaction with data objects; guidance rather than prescription.
      specializes: DataFlow
    Capability:
      display: Capability
      category: Level 4 (non-normative)
      section: 11.10.2
      definition: The ability of an organization to produce an outcome of value through people, processes and technology; a refinement of the Level 2 groups.
    EssentialService:
      display: Essential Service
      category: Level 4 (non-normative)
      section: 11.10.3
      definition: A means of integrating functional components or acting on a data object (for example create, read, update, delete); typically an API or web service.
    Process:
      display: Process
      category: Level 4 (non-normative)
      section: 11.1 (Figure 75); 11.10.4
      definition: A business process at Levels 4 and 5 that uses essential services and realizes a capability. Figure 75 names it as a concept, and the text describes it only through the process flow of a scenario.
    DigitalProduct:
      display: Digital Product
      category: Digital Product (chapter 4)
      section: '4.4'
      definition: A service, physical item or digital item that provides an agreed outcome for a consumer, incorporates and requires software, needs active management of that software
        over its lifecycle, and is described by a formal offer with an explicit price.
    ServiceOffer:
      display: Service Offer
      category: Digital Product (chapter 4)
      section: 4.4.2
      definition: The possible Service Contract terms as the potential consumer sees them.
    ServiceContract:
      display: Service Contract
      category: Digital Product (chapter 4)
      section: 4.4.3
      definition: The agreement formed when an offer is accepted, with commitments, usage and financial rules and lifecycle expectations.
    DigitalProductInstance:
      display: Digital Product Instance
      category: Digital Product (chapter 4)
      section: 4.4.3; 4.17
      definition: The realization of a Digital Product for a consumer, created when an offer is accepted.
    System:
      display: System
      category: Digital Product (chapter 4)
      section: 4.4.1
      definition: The technology components of an instance that the provider manages, including recursive supporting resources.
  relationships:
    ValueNetworkComprisesValueStream:
      display: Value Network contains Value Streams
      category: relationship
    ValueStreamHasScenario:
      display: Value Stream is executed for Scenarios
      category: relationship
    ValueStreamHasStage:
      display: Value Stream is refined into Stages
      category: relationship
    ValueStreamDependsOnValueStream:
      display: Value Stream depends on Value Stream
      category: relationship
    StageInvolvesStakeholder:
      display: Stage lists Stakeholders as examples
      category: relationship
    StageUsesDataObject:
      display: Stage lists participating Data Objects, each with its Functional Component
      category: relationship
    FunctionalGroupContainsFunctionalGroup:
      display: Level 1 Functional Group is decomposed into Level 2 Functional Groups
      category: relationship
    FunctionalGroupContainsFunctionalComponent:
      display: Functional Group contains Functional Components
      category: relationship
    FunctionalComponentControlsDataObject:
      display: Functional Component controls Data Objects
      category: relationship
    FunctionalComponentSupportsValueStream:
      display: Functional Component supports Value Streams
      category: relationship
    DataObjectRelatesToDataObject:
      display: Data Object relates to Data Object with cardinality 1:1, 1:n or n:m
      category: relationship
    DataObjectHasKeyAttribute:
      display: Data Object has Key Attributes
      category: relationship
    DataFlowConnectsFunctionalComponents:
      display: Functional Component sends a Data Flow to Functional Component
      category: relationship
    CapabilityRelatesToFunctionalComponent:
      display: Capability is supported by Functional Components
      category: relationship
    EssentialServiceBelongsToFunctionalComponent:
      display: Essential Service is offered by a Functional Component
      category: relationship
    BackboneGroupsBackboneDataObjects:
      display: Backbone groups its Data Objects
      category: relationship
    FunctionalGroupRelatesToValueNetwork:
      display: Level 1 Functional Group relates to the Value Network
      category: relationship
    FunctionalGroupAggregatesCapability:
      display: Level 2 Functional Group aggregates Capabilities
      category: relationship
    CapabilityRelatesToStakeholder:
      display: Capability relates to Stakeholder
      category: relationship
    FunctionalComponentRealizesCapability:
      display: Functional Component realizes Capability
      category: relationship
    FunctionalComponentRealizesEssentialService:
      display: Functional Component realizes Essential Service
      category: relationship
    ProcessRealizesCapability:
      display: Process realizes Capability
      category: relationship
    EssentialServiceServesProcess:
      display: Essential Service serves Process
      category: relationship
    EssentialServiceRelatesToSystemOfRecordIntegration:
      display: Essential Service relates to System of Record Integration
      category: relationship
    SystemOfRecordIntegrationRelatesToDataRelationship:
      display: System of Record Integration relates to Data Relationship
      category: relationship
relationships:
- name: ValueNetworkComprisesValueStream
  source: ValueNetwork
  target: ValueStream
  display: Value Network contains Value Streams
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.7.1; 11.7.2
  multiplicity_basis: inferred
- name: ValueStreamHasScenario
  source: ValueStream
  target: Scenario
  display: Value Stream is executed for Scenarios
  multiplicity:
    targets_per_source: 1..*
    sources_per_target: '1'
  section: 11.8.1; 5.x.1
  note: At least one is shown for every stream (4, 4, 4, 3, 4, 4, 5).
  multiplicity_basis: inferred
- name: ValueStreamHasStage
  source: ValueStream
  target: ValueStreamStage
  display: Value Stream is refined into Stages
  multiplicity:
    targets_per_source: 1..*
    sources_per_target: '1'
  section: 11.8.3; 5
  note: 'Seven streams, 28 stages: 5, 4, 4, 4, 3, 5, 3.'
  multiplicity_basis: inferred
- name: ValueStreamDependsOnValueStream
  source: ValueStream
  target: ValueStream
  display: Value Stream depends on Value Stream
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 5.x (Cross-Value Stream Dependencies)
  note: Reflexive; the two sides of the text disagree in three places.
  multiplicity_basis: inferred
- name: StageInvolvesStakeholder
  source: ValueStreamStage
  target: Stakeholder
  display: Stage lists Stakeholders as examples
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.8.3; 11.8.4
  note: Proposals only.
  multiplicity_basis: inferred
- name: StageUsesDataObject
  source: ValueStreamStage
  target: LifecycleDataObject
  display: Stage lists participating Data Objects, each with its Functional Component
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.8.3; 5.x
  multiplicity_basis: inferred
- name: FunctionalGroupContainsFunctionalGroup
  source: FunctionalGroup
  target: FunctionalGroup
  display: Level 1 Functional Group is decomposed into Level 2 Functional Groups
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '1'
  section: 11.7.3
  note: Five Level 1 groups and fourteen Level 2 groups.
  multiplicity_basis: inferred
- name: FunctionalGroupContainsFunctionalComponent
  source: FunctionalGroup
  target: FunctionalComponent
  display: Functional Group contains Functional Components
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '1'
  section: 11.7.3; 6 to 10
  multiplicity_basis: inferred
- name: FunctionalComponentControlsDataObject
  source: FunctionalComponent
  target: LifecycleDataObject
  display: Functional Component controls Data Objects
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '1'
  section: 11.7.4; 11.7.5
  note: A data object is controlled by exactly one component.
  multiplicity_basis: inferred
- name: FunctionalComponentSupportsValueStream
  source: FunctionalComponent
  target: ValueStream
  display: Functional Component supports Value Streams
  multiplicity:
    targets_per_source: 1..*
    sources_per_target: '*'
  section: 6 to 10; Appendix A
  note: Each component section lists the value streams it supports.
  multiplicity_basis: inferred
- name: DataObjectRelatesToDataObject
  source: LifecycleDataObject
  target: LifecycleDataObject
  display: Data Object relates to Data Object with cardinality 1:1, 1:n or n:m
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.7.7; 11.9.2; 6 to 10
  note: The reference model lists 114 such relationships, joining 113 pairs.
  multiplicity_basis: inferred
- name: DataObjectHasKeyAttribute
  source: LifecycleDataObject
  target: KeyAttribute
  display: Data Object has Key Attributes
  multiplicity:
    targets_per_source: 1..*
    sources_per_target: '1'
  section: 11.9.1
  note: Figure 75 joins Attribute to Lifecycle Data Object and also to Product Backbone Data Object.
  multiplicity_basis: inferred
- name: DataFlowConnectsFunctionalComponents
  source: FunctionalComponent
  target: FunctionalComponent
  display: Functional Component sends a Data Flow to Functional Component
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.9.3
  note: 'Kinds: system of record integration and engagement integration.'
  multiplicity_basis: inferred
- name: CapabilityRelatesToFunctionalComponent
  source: Capability
  target: FunctionalComponent
  display: Capability is supported by Functional Components
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.10.2
  note: Non-normative.
  multiplicity_basis: inferred
- name: EssentialServiceBelongsToFunctionalComponent
  source: EssentialService
  target: FunctionalComponent
  display: Essential Service is offered by a Functional Component
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '1'
  section: 11.10.3
  note: Non-normative.
  multiplicity_basis: inferred
- name: BackboneGroupsBackboneDataObjects
  source: DigitalProductBackbone
  target: BackboneDataObject
  display: Backbone groups its Data Objects
  multiplicity:
    targets_per_source: '5'
    sources_per_target: '*'
  section: 11.7.8; 11.7.9
  note: Digital Product Backbone has five; Service Offer Backbone has four.
  multiplicity_basis: inferred
- name: FunctionalGroupRelatesToValueNetwork
  source: FunctionalGroup
  target: ValueNetwork
  display: Level 1 Functional Group relates to the Value Network
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.1 (Figure 75)
  note: Solid line with an open arrowhead at the Value Network.
  multiplicity_basis: inferred
- name: FunctionalGroupAggregatesCapability
  source: FunctionalGroup
  target: Capability
  display: Level 2 Functional Group aggregates Capabilities
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.1 (Figure 75)
  note: Hollow diamond at the Level 2 group. Non-normative.
  multiplicity_basis: inferred
- name: CapabilityRelatesToStakeholder
  source: Capability
  target: Stakeholder
  display: Capability relates to Stakeholder
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.1 (Figure 75)
  note: Plain line. Non-normative.
  multiplicity_basis: inferred
- name: FunctionalComponentRealizesCapability
  source: FunctionalComponent
  target: Capability
  display: Functional Component realizes Capability
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.1 (Figure 75)
  note: Dotted line with a hollow triangle at the Capability, beside the plain line of CapabilityRelatesToFunctionalComponent. Non-normative.
  multiplicity_basis: inferred
- name: FunctionalComponentRealizesEssentialService
  source: FunctionalComponent
  target: EssentialService
  display: Functional Component realizes Essential Service
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.1 (Figure 75)
  note: Dotted line with a hollow triangle at the Essential Service. Non-normative.
  multiplicity_basis: inferred
- name: ProcessRealizesCapability
  source: Process
  target: Capability
  display: Process realizes Capability
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.1 (Figure 75)
  note: Dotted line with a hollow triangle at the Capability. Non-normative.
  multiplicity_basis: inferred
- name: EssentialServiceServesProcess
  source: EssentialService
  target: Process
  display: Essential Service serves Process
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.1 (Figure 75)
  note: Solid line with an open arrowhead at the Process. Non-normative.
  multiplicity_basis: inferred
- name: EssentialServiceRelatesToSystemOfRecordIntegration
  source: EssentialService
  target: SystemOfRecordIntegration
  display: Essential Service relates to System of Record Integration
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.1 (Figure 75)
  note: Plain line. Non-normative.
  multiplicity_basis: inferred
- name: SystemOfRecordIntegrationRelatesToDataRelationship
  source: SystemOfRecordIntegration
  target: DataRelationship
  display: System of Record Integration relates to Data Relationship
  multiplicity:
    targets_per_source: '*'
    sources_per_target: '*'
  section: 11.1 (Figure 75)
  note: Plain line.
  multiplicity_basis: inferred
reference_model:
  note: 'The normative content of Levels 1 to 3, as the Snapshot specifies it: 7 value streams, 14 functional groups, 35 functional components and 46 data objects with their key attributes
    and 114 data relationships. Directions and cardinalities are as the standard writes them, source side first. A conflict between two sections is recorded on the relationship. The
    relationship list is the allowed set for data objects: the standard defines "key relationships" only, and the cardinalities mean "can relate", never "must".'
  functional_groups:
  - name: Plan
    level: 1
    normative: true
    section: Chapter 6
  - name: Build
    level: 1
    normative: true
    section: Chapter 7
  - name: Deliver
    level: 1
    normative: true
    section: Chapter 8
  - name: Run
    level: 1
    normative: true
    section: Chapter 9
  - name: Supporting
    level: 1
    normative: false
    section: Chapter 10
  - name: Strategy
    level: 2
    parent: Plan
    section: '6.1'
    normative: true
  - name: Portfolio
    level: 2
    parent: Plan
    section: '6.2'
    normative: true
  - name: Develop
    level: 2
    parent: Build
    section: '7.1'
    normative: true
  - name: Test
    level: 2
    parent: Build
    section: '7.2'
    normative: true
  - name: Consume
    level: 2
    parent: Deliver
    section: '8.1'
    normative: true
  - name: Fulfill
    level: 2
    parent: Deliver
    section: '8.2'
    normative: true
  - name: Support
    level: 2
    parent: Run
    section: '9.1'
    normative: true
  - name: Assure
    level: 2
    parent: Run
    section: '9.2'
    normative: true
  - name: Financial Management
    level: 2
    parent: Supporting
    section: '10.1'
    normative: false
  - name: Governance Risk & Compliance
    level: 2
    parent: Supporting
    section: '10.2'
    normative: false
  - name: Workforce Management
    level: 2
    parent: Supporting
    section: '10.3'
    normative: false
  - name: Sourcing & Vendor Management
    level: 2
    parent: Supporting
    section: '10.4'
    normative: false
  - name: Intelligence & Reporting
    level: 2
    parent: Supporting
    section: '10.5'
    normative: false
  - name: Collaboration & Communication
    level: 2
    parent: Supporting
    section: '10.6'
    normative: false
  value_streams:
  - name: Evaluate
    section: '5.1'
    description: Continuous assessment of the whole Digital Product Portfolio to align it with business strategy and find new product opportunities.
    key_stakeholder: Product Portfolio Manager
    value: Optimized product portfolio and a portfolio investment plan with funding.
    depends_on:
    - Explore
    - Integrate
    - Deploy
    - Release
    - Consume
    - Operate
    scenarios:
    - Consider a New Digital Product
    - Perform Digital Product Governance
    - Rationalize the Product Portfolio
    - Plan Product Portfolio Investments
    stages:
    - name: Gather Influencers
      data_objects:
      - Policy
      - Strategic Objective
      - Strategic Theme
    - name: Identify Gaps
      data_objects:
      - Digital Product
      - Policy
      - Product Backlog Item
      - Scope Agreement
      - Strategic Objective
      - Strategic Theme
      - Value Stream
    - name: Propose Investments
      data_objects:
      - Budget Item
      - Digital Product
      - Policy
      - Portfolio Backlog Item
      - Scope Agreement
      - Strategic Objective
      - Strategic Theme
      - Value Stream
    - name: Define Backlog Mandates
      data_objects:
      - Architecture Blueprint
      - Architecture Roadmap Item
      - Digital Product
      - Policy
      - Portfolio Backlog Item
      - Product Backlog Item
      - Scope Agreement
      - Strategic Objective
      - Strategic Theme
      - Value Stream
    - name: Ensure Governance
      data_objects:
      - Digital Product
      - Policy
      - Portfolio Backlog Item
      - Scope Agreement
      - Strategic Objective
      - Strategic Theme
      - Value Stream
  - name: Explore
    section: '5.2'
    description: Continuous exploration of new features and directions for a Digital Product, working from the Scope Agreements Evaluate produces.
    key_stakeholder: Product Manager
    value: Accepted, planned product backlog with a detailed Scope Agreement, release roadmap and resources.
    depends_on:
    - Evaluate
    - Integrate
    scenarios:
    - Investigate a New Digital Product Idea
    - Optimize a Digital Product
    - Refine Digital Product Feasibility
    - Retire Digital Product
    stages:
    - name: Prioritize Backlog Items
      data_objects:
      - Digital Product
      - Policy
      - Portfolio Backlog Item
      - Scope Agreement
      - Strategic Objective
      - Strategic Theme
    - name: Define Digital Product Architecture
      data_objects:
      - Architecture Blueprint
      - Policy
      - Portfolio Backlog Item
      - Product Design
      - Strategic Objective
      - Strategic Theme
    - name: Refine Product Backlog
      data_objects:
      - Architecture Blueprint
      - Architecture Roadmap Item
      - Digital Product
      - Policy
      - Portfolio Backlog Item
      - Product Backlog Item
      - Product Design
      - Requirement
      - Scope Agreement
    - name: Finalize Roadmap & Scope Agreement
      data_objects:
      - Architecture Roadmap Item
      - Digital Product
      - Policy
      - Portfolio Backlog Item
      - Product Backlog Item
      - Product Design
      - Scope Agreement
  - name: Integrate
    section: '5.3'
    description: Designs, builds and tests a new Product Release in non-production environments and makes it ready to deploy.
    key_stakeholder: Product Manager with the Development Teams
    value: A new Product Release accepted and ready for deployment and release.
    depends_on:
    - Explore
    - Consume
    - Deploy
    - Operate
    scenarios:
    - Develop a New or Initial Product Release
    - Configure an Off-the-Shelf or SaaS Product for Use
    - Deliver an Emergency Change or Hotfix
    - Update of a Vendor Product
    stages:
    - name: Plan Product Release
      data_objects:
      - Defect
      - Policy
      - Portfolio Backlog Item
      - Problem
      - Product Backlog Item
      - Requirement
      - Scope Agreement
      - Test Plan
    - name: Design & Develop
      data_objects:
      - Defect
      - Policy
      - Product Backlog Item
      - Product Design
      - Requirement
      - Source
      - Test Case
      - Test Plan
    - name: Build, Integrate, & Test
      data_objects:
      - Build Package
      - Fulfillment Book
      - Pipeline
      - Product Release
      - Requirement
      - Source
      - Test Case
      - Test Plan
    - name: Accept & Publish Release
      data_objects:
      - Defect
      - Desired Product Instance
      - Fulfillment Book
      - Log
      - Order
      - Product Backlog Item
      - Product Release
      - Requirement
      - Scope Agreement
      - Subscription
      - Test Case
      - Test Plan
  - name: Deploy
    section: '5.4'
    description: Installs, updates or removes a Product Release in the production environment.
    key_stakeholder: Product Manager
    value: Product Releases are installed safely without unexpected outages of running instances.
    depends_on:
    - Integrate
    - Consume
    scenarios:
    - Deploy a First Product Release for a New Digital Product
    - Deploy a New Product Release Version for a Digital Product
    - Disable or Remove Existing Product Release Instances of a Digital Product
    stages:
    - name: Plan & Approve Deployment
      data_objects:
      - Actual Product Instance
      - Change
      - Desired Product Instance
      - Product Release
      - Service Contract
    - name: Fulfill Deployment
      data_objects:
      - Actual Product Instance
      - Change
      - Desired Product Instance
      - Fulfillment Book
      - Knowledge Item
      - Problem
      - Product Release
      - Resource
      - Runbook
      - Service Monitor
    - name: Validate Deployment
      data_objects:
      - Actual Product Instance
      - Change
      - Desired Product Instance
      - Problem
      - Product Release
      - Resource
      - Runbook
      - Service Contract
    - name: Observe Deployment
      data_objects:
      - Actual Product Instance
      - Event
      - KPI
      - Log
      - Service Contract
  - name: Release
    section: '5.5'
    description: Makes Service Offers available to consumers for ordering a new, changed or decommissioned product instance or its support.
    key_stakeholder: Catalog Manager
    value: Managed, consumable Service Offers for the Digital Product.
    depends_on:
    - Deploy
    scenarios:
    - Release a New Service Offer
    - Change an Existing Service Offer
    - Bundle Existing Service Offers
    - Terminate a Service Offer
    stages:
    - name: Define Service Offer
      data_objects:
      - Cost Model
      - Fulfillment Book
      - Knowledge Item
      - Product Release
      - Service Contract
      - Service Offer
    - name: Implement Service Offer
      data_objects:
      - Knowledge Item
      - Service Offer Catalog
      - Service Offer
    - name: Publish Service Offer
      data_objects:
      - Cost Model
      - Knowledge Item
      - Service Offer Catalog
      - Service Offer
  - name: Consume
    section: '5.6'
    description: 'The consumer''s lifecycle: select an offer, order, get fulfillment, get support and get status.'
    key_stakeholder: Customer or consumer (person or system)
    value: Consumers find offerings and obtain deployed, supported products under a Service Contract.
    depends_on:
    - Release
    - Operate
    scenarios:
    - Order a New Desired Product Instance
    - Order an Actual Product Instance Modification
    - Order an Actual Product Instance Termination
    - Order an Actual Product Instance Support
    stages:
    - name: Select an Offer
      data_objects:
      - Entitlement
      - Identity
      - Interaction
      - Service Offer Catalog
      - Service Offer
    - name: Agree to Service Offer
      data_objects:
      - Interaction
      - Order
      - Service Contract
    - name: Subscribe to Service Offer
      data_objects:
      - Actual Product Instance
      - Change
      - Chargeback Contract
      - Cost Model
      - Desired Product Instance
      - Fulfillment Book
      - Order
      - Resource
      - Service Contract
      - Subscription
    - name: Provide Service Support
      data_objects:
      - Incident
      - Interaction
      - Knowledge Item
      - Subscription
    - name: Publish Service Status
      data_objects:
      - Chargeback Contract
      - Chargeback Record
      - Incident
      - KPI
      - Service Contract
      - Subscription
      - Usage Record
  - name: Operate
    section: '5.7'
    description: Keeps deployed instances available and performing within their Service Contract, including compliance and security.
    key_stakeholder: Consumer
    value: The instance operates and can be consumed as the Service Contract agrees.
    depends_on:
    - Deploy
    - Consume
    scenarios:
    - Remediate an Identified Back-End Issue
    - Ensure Disaster Recovery Objectives
    - Remediate a major Event or Incident
    - Remediate Consumer Front-End Issue
    - Perform Scheduled Maintenance
    stages:
    - name: Detect Issue
      data_objects:
      - Actual Product Instance
      - Event
      - Incident
      - Interaction
      - Log
      - Service Contract
      - Service Monitor
    - name: Diagnose Issue
      data_objects:
      - Actual Product Instance
      - Event
      - Incident
      - Knowledge Item
      - Log
      - Problem
      - Runbook
      - Service Contract
    - name: Resolve Issue
      data_objects:
      - Actual Product Instance
      - Change
      - Event
      - Incident
      - Interaction
      - Knowledge Item
      - Log
      - Runbook
      - Service Contract
  value_stream_dependency_notes:
  - Depends-on lists follow each value stream's own "depends on" text. Release and Operate also depend on Integrate according to Integrate's dependents list, but their own lists omit
    it (inferred edges). Integrate depends on Deploy according to its own list, but Deploy's dependents list omits Integrate.
  supporting_function_examples:
    note: The data objects the draft names as examples under five supporting functions it describes without defining (chapter 10). They have no key attributes, relationships, or controlling components, and they are not part of the normative content. The names here are short singular forms we chose. Section 10.2 writes "IT audits and audit findings" and "Compliance evidence and compliance-related exceptions/issues", shortened here to Audit Finding and Compliance Evidence, and 10.5 writes "Metrics and KPI", where KPI is already a data object.
    groups:
    - group: Governance Risk & Compliance
      section: '10.2'
      examples: [Risk Assessment, Risk, Vendor Risk, Audit Finding, Compliance Evidence, Risk Issue]
    - group: Workforce Management
      section: '10.3'
      examples: [Employee, Job Profile and Roles, Team, Resource Allocation]
    - group: Sourcing & Vendor Management
      section: '10.4'
      examples: [Vendor, Contract, Purchase Order]
    - group: Intelligence & Reporting
      section: '10.5'
      examples: [Metric]
    - group: Collaboration & Communication
      section: '10.6'
      examples: []
