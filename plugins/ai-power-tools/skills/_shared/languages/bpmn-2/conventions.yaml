technology: BPMN2.0
display_name: BPMN 2.0
extends: UML
stereotype_prefix: ''
notes: |
  EA's BPMN2.0 MDG declares five diagram types, all based on Analysis. Two are deliberately NOT bound here: `Conversation`, whose participants-and-hexagons layout is a graph rather than one the engine composes, and `BPEL`, which is an execution-export type rather than a drawn notation. A caller resolving either gets no binding and should fall back to a plain graph layout: which is the honest answer, and better than composing a conversation into lanes.
diagram_types:
  Business Process:
    base: Analysis
    grammar: lanes
    title: frame-header
    sizing:
      default:
        w: 100
        h: 70
      DataObject:
        w: 40
        h: 50
      DataStore:
        w: 40
        h: 50
      EndEvent:
        w: 30
        h: 30
      Gateway:
