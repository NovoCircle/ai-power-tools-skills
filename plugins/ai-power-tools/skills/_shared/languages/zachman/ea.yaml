# EA's names for this language's layout. tools/gen_conventions.py reads layout_map.
layout_map:
  technology: ZF Interface
  technology_reason: EA's Zachman technology registers this diagram type under its ZF Interface profile.
  display_name: Zachman Framework (framework grid)
  extends: UML
  stereotype_prefix: ''
  notes: |
    `matrix` for ZF_Interface. The diagram is a table of 36 cells, six columns by six rows, and a cell's address is its row and column. It isn't `layered-bands`, because the horizontal axis is the framework's question words and each column has its own width. It isn't `nested-grid`, because no cell sits inside another.

    Where a composed matrix differs from the reference diagram. The composed one draws every cell at one size, where the reference holds one width per column and one height per row. It also writes row and column headers as elements, where EA paints them on the reference with its matrix overlay. Both differences are expected.

    No header size is stated, because the reference diagram has no header element to measure.

    Not bound: the 28 diagram types under ZF Planner, ZF Owner, ZF Designer, ZF Builder, ZF Subcontractor and ZF. None has enough elements to support a default size. ZF Owner's OwnerTime reaches a default of 15 by 15, but that is the size of its event markers and not of its business events, so it isn't used.

    No viewpoints. The 36 cells are 36 named views, but the diagram type behind each one belongs to one of those other technologies, and a map binds one technology.
  diagram_types:
    ZF_Interface:
      base: Logical
      default_type: large-box
      arrangement: matrix
      title: frame-header
      route: straight
      channels:
        fill: 'The cell''s tone, painted by the `ZFCell` shape script. 36 of 36 elements carry no fill
          override: `Backcolor` is -1 on every one, and the eight whose `ObjectStyle` mentions `BCol`
          say `BCol=-1`, which is the absence of an override rather than one: so EA paints all of them.
          The corpus row records the cell tone and the diagonal gradient corner triangle as the framework''s
          own decoration. Whether a written fill would be honored was not tested, which is a second reason
          not to offer it.'
        claimed:
          position: 'Both axes, and more completely than on any other diagram type in this library: a
            cell IS its row and its column. The row is the perspective the view is drawn for: planner,
            owner, designer, builder, subcontractor, the functioning enterprise: and the column is the
            interrogative it answers: what, how, where, who, when, why. Moving a cell one column left
            changes the question it answers. Measured as six columns of exactly six cells and six rows
            of exactly six.'
          size: 'Column and row membership. A cell''s width belongs to its column and its height to its
            row: measured widths 120, 126, 124, 118, 126, 118 and heights 103, 102, 104, 94, 100, 104:
            so resizing one cell breaks the alignment of the six it shares a column with or the six it
            shares a row with.'
          icon: The cell artwork. 36 of 36 elements carry an `ImageID` in `ObjectStyle`, so every cell
            holds an embedded image, which is what the corpus row records as an image in every cell. Setting
            one would replace the framework's own artwork.
        free:
        - border
        - border_width
        - font_color
        - opacity
