        - 'true'
    condition:
      type: connector_count
      connector_stereotype: SequenceFlow
      direction: incoming
      max: 0
    remediation:
      short: Remove the incoming sequence flow.
      auto_fixable: false

  - id: BPMN2-EVT-024b
    name: An event sub-process has no outgoing sequence flow
    implements: BPMN-EVT-024
    description: An event sub-process is not connected to the normal flow; no sequence flow leaves it. [OMG BPMN 2.0.2 (formal/13-12-09)
      10.3.5 p. 174; 10.5.2 p. 241]
