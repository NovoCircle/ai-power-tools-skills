  external:
    SmmModel:
      defined_by: SMM 1.1 (formal/15-10-03), referenced by VDML
      note: An SMM model contained in and specific to a ValueDeliveryModel (type of metricsModel).
    MeasureLibrary:
      defined_by: SMM 1.1 (formal/15-10-03), referenced by VDML
      note: 'SMM: library of measures and characteristics.'
    Measure:
      defined_by: SMM 1.1 (formal/15-10-03), referenced by VDML
      note: 'SMM: a method that quantifies or qualifies a characteristic.'
    Characteristic:
      defined_by: SMM 1.1 (formal/15-10-03), referenced by VDML
      note: 'SMM: a distinguishing feature that a measure can quantify or qualify.'
    Measurement:
      defined_by: SMM 1.1 (formal/15-10-03), referenced by VDML
      note: 'SMM: the result of applying a measure.'
    Observation:
      defined_by: SMM 1.1 (formal/15-10-03), referenced by VDML
      note: 'SMM: groups measurements; in VDML each analysis context has its own.'
    MeasureRelationship:
      defined_by: SMM 1.1 (formal/15-10-03), referenced by VDML
      note: 'SMM: the class that types MeasurementRelationships; VDML adds an influence property (positive or negative).'
    MeasurementRelationship:
      defined_by: SMM 1.1 (formal/15-10-03), referenced by VDML
      note: 'SMM: a relationship between two measurements; shown on the Measurement Dependency diagram.'
