relationships:
  note: SysML gives endpoint rules per relationship in the constraints of each profile element; it gives no table of allowed pairs. Dependencies run from client (source, tail) to supplier (target, arrowhead). ends_per_relationship is stated only where the standard states it; multiplicity keys are targets_per_source and sources_per_target.
  count: 35
  items:
  - name: Satisfy
    display: Element satisfies Requirement
    source: NamedElement
    target: Requirement
    section: 16.3.2.7; 16.1
    uml_base: Abstraction
    roles: {source: client (satisfying element), target: supplier (satisfied requirement)}
    note: 'The supplier is a requirement or a specialization of it. The client is any named element (typically a block, part or behavior). Derived views: satisfiedBy on the requirement.'
  - name: Verify
    display: Element verifies Requirement
    source: NamedElement
    target: Requirement
    section: 16.3.2.9; 16.1
    uml_base: Abstraction
    roles: {source: 'client (verifying element, typically a test case)', target: supplier (verified requirement)}
    note: 'The supplier is a requirement or a specialization of it. Derived view: verifiedBy on the requirement.'
  - name: DeriveReqt
    display: Requirement is derived from Requirement
    source: AbstractRequirement
    target: AbstractRequirement
    section: 16.3.2.3
    uml_base: Abstraction
    roles: {source: client (derived requirement), target: supplier (source requirement)}
    note: 'Both ends are requirement kinds. Derived views: derived and derivedFrom.'
  - name: Refine
    display: Element refines Element
    source: NamedElement
    target: NamedElement
    section: 16.3.2.4; 16.1
    uml_base: Refine (UML)
    roles: {source: client (refining element), target: supplier (refined element)}
    ends_per_relationship: {source: '1', target: '1'}
    note: 'Typically a model element refining a requirement, but the standard also allows a requirement to refine a model element. Derived view: refinedBy on the requirement.'
  - name: Trace
    display: Element traces to Element
    source: NamedElement
    target: NamedElement
    section: 16.3.2.8; 16.1
    uml_base: Trace (UML)
    roles: {source: client, target: supplier}
    ends_per_relationship: {source: '1', target: '1'}
    note: 'General-purpose and weak; the standard recommends not mixing it with the other requirement relationships. Derived view: tracedTo on the requirement.'
  - name: Copy
    display: Requirement is a copy of Requirement
    source: AbstractRequirement
    target: AbstractRequirement
    section: 16.3.2.2
    uml_base: Abstraction
    roles: {source: client (slave), target: supplier (master)}
    note: 'The slave text is a read-only copy of the master text, recursively for sub-requirements. Derived view: master.'
  - name: RequirementContainment
    display: Requirement contains Requirement
    source: Requirement
    target: Requirement
    section: 16.3.2.5; 16.2.1
    uml_base: Class::nestedClassifier
    roles: {source: container (compound requirement), target: nested requirement}
    note: Containment is the only way to build a requirement hierarchy; deleting the container deletes the nested requirements.
  - name: Allocate
    display: Element is allocated to Element
    source: NamedElement
    target: NamedElement
    section: 15.3.2.1
    uml_base: Abstraction
    roles: {source: client / from (allocated element), target: supplier / to (allocation target)}
    ends_per_relationship: {source: '1', target: '1'}
    note: Permissible between any two named elements; typical uses are behavior to structure, flow to flow, structure to structure.
  - name: Conform
    display: View conforms to Viewpoint
    source: View
    target: Viewpoint
    section: 7.3.2.1
    uml_base: Generalization
    roles: {source: specific (view), target: general (viewpoint)}
    multiplicity: {targets_per_source: '1', sources_per_target: '*'}
    note: A view conforms to only one viewpoint.
  - name: Expose
    display: View exposes Element
    source: View
    target: Element
    section: 7.3.2.3
    uml_base: Dependency
    roles: {source: client (view), target: supplier (access point)}
  - name: PartAssociation
    display: Block has part Block
    source: Block
    target: Block
    section: 8.2.1 (Table 8.2); 8.3.2.4
    uml_base: Association with composite aggregation
    roles: {source: whole, target: part property}
    multiplicity: {targets_per_source: '*', sources_per_target: 0..1}
    note: Default multiplicity on the whole end is 0..1 when not shown. An instance of a block is part of at most one whole at a time.
  - name: ReferenceAssociation
    display: Block refers to Block
    source: Block
    target: Block
    section: 8.2.1 (Table 8.2); 8.3.2.4
    uml_base: Association with no aggregation
    roles: {source: owner, target: reference property}
    note: A unidirectional association has a default multiplicity of 1 on its target end when not shown. The only association end an association may own is an unnamed end that carries an inverse multiplicity.
  - name: SharedAssociation
    display: Block shares Block
    source: Block
    target: Block
    section: 8.2.1 (Table 8.2); 8.3.2.4
    uml_base: Association with shared aggregation
    roles: {source: aggregate, target: shared property}
    multiplicity: {targets_per_source: '*', sources_per_target: 0..1}
    note: SysML defines no specific semantics for shared aggregation. Default multiplicity on the white diamond end is 0..1.
  - name: Generalization
    display: Classifier specializes Classifier
    source: Classifier
    target: Classifier
    section: 8.2.1 (Table 8.2); 8.3.2.4; 8.3.2.15; 10.3.2.1
    uml_base: Generalization
    roles: {source: specific, target: general}
    note: A specialization of a block, value type or constraint block carries the same extension as its general classifier. Requirements do not take part in generalization.
  - {name: GeneralizationSet, display: Generalizations form a Generalization Set, source: Generalization, target: GeneralizationSet, section: 8.2.1 (Table 8.2), uml_base: GeneralizationSet, note: Shown with disjoint or overlapping.}
  - name: BlockNamespaceContainment
    display: Block owns nested Classifier
    source: Block
    target: Classifier
    section: 8.2.1 (Table 8.2); 8.3.1.1.6
    uml_base: Class::nestedClassifier
    roles: {source: owning block, target: nested classifier}
  - name: Connector
    display: Property is connected to Property
    source: ConnectableElement
    target: ConnectableElement
    section: 8.2.2 (Table 8.4); 8.3.2.4; 8.3.1.2.9
    uml_base: Connector
    ends_per_relationship: {source: '1', target: '1'}
    multiplicity: {targets_per_source: '1', sources_per_target: '1'}
    note: A connector owned by a block has exactly two ends; default multiplicity 1 on each end. May be typed by an association or association block. ConnectableElement here covers a part, reference, value, constraint or other property and a port.
  - name: BindingConnector
    display: Property is bound to Property
    source: ConnectableElement
    target: ConnectableElement
    section: 8.3.2.3; 10.3.1.2
    uml_base: Connector
    ends_per_relationship: {source: '1', target: '1'}
    note: The only connector that may appear on a parametric diagram. Ends have the same or compatible types.
  - name: ItemFlow
    display: Item flows from element to element
    source: NamedElement
    target: NamedElement
    section: 9.3.2.11; 9.3.1.5
    uml_base: InformationFlow
    roles: {source: source (flows from), target: target (flows to)}
    note: Realized by a connector, an association or an inherited association that exists between source and target. Conveys classifiers of items, with an optional item property.
  - {name: ProvidedInterface, display: Port or block provides Interface, source: ConnectableElement, target: Interface, section: '9.2 (Tables 9.1, 9.2); 9.4.1', uml_base: InterfaceRealization}
  - {name: RequiredInterface, display: Port or block requires Interface, source: ConnectableElement, target: Interface, section: '9.2 (Tables 9.1, 9.2); 9.4.1', uml_base: Usage}
  - name: Dependency
    display: Element depends on Element
    source: NamedElement
    target: NamedElement
    section: 7.2 (Table 7.2)
    uml_base: Dependency
    roles: {source: client, target: supplier}
    note: May be shown on every diagram kind, as may Conform, Realization and Refine.
  - {name: Realization, display: Element realizes Element, source: NamedElement, target: NamedElement, section: 7.2 (Table 7.2), uml_base: Realization}
  - {name: PackageContainment, display: Package contains Element, source: Package, target: NamedElement, section: 7.2 (Table 7.2), uml_base: 'Package::ownedElement'}
  - {name: PackageImport, display: Package imports or accesses Element, source: Package, target: Package, section: 7.2 (Table 7.2), uml_base: PackageImport / ElementImport, note: 'Public import is the import keyword, private import is the access keyword. Package merge is not supported.'}
  - {name: CommunicationPath, display: Actor communicates with Use Case, source: Actor, target: UseCase, section: 14.1; 14.2.1, uml_base: Association}
  - name: Include
    display: Use Case includes Use Case
    source: UseCase
    target: UseCase
    section: 14.1; 14.2.1; 14.4
    uml_base: Include
    roles: {source: including (base) use case, target: included use case}
    note: The behavior of the included use case is inserted into the including use case; the including use case may depend only on its result.
  - name: Extend
    display: Use Case extends Use Case
    source: UseCase
    target: UseCase
    section: 14.1; 14.2.1; 14.4
    uml_base: Extend
    roles: {source: extending use case, target: extended (base) use case}
    note: Optional behavior inserted at a named extension point under a condition; the extended use case is meaningful by itself.
  - {name: UseCaseGeneralization, display: Use Case or Actor specializes, source: Classifier, target: Classifier, section: 14.1; 14.2.1, uml_base: Generalization, note: Specialization of a use case (a variant) or of an actor (a user-type taxonomy).}
  - {name: Transition, display: State is followed by State, source: Vertex, target: Vertex, section: 13.2.1, uml_base: Transition, note: 'Vertex is a state, pseudostate or final state; a trigger, guard and effect label the transition.'}
  - {name: Message, display: Lifeline sends Message to Lifeline, source: Lifeline, target: Lifeline, section: 12.2.1, uml_base: Message, note: 'Synchronous, asynchronous, create, reply, lost and found messages.'}
  - {name: ControlFlow, display: Activity node is followed by Activity node, source: ActivityNode, target: ActivityNode, section: 11.2.1; 11.3.1.3, uml_base: ControlFlow}
  - {name: ObjectFlow, display: Object flows between Activity nodes, source: ActivityNode, target: ActivityNode, section: 11.2.1, uml_base: ObjectFlow}
  - {name: ProfileApplication, display: Package applies Profile, source: Package, target: Profile, section: 17.2.1; 17.4.5, uml_base: ProfileApplication, note: 'Applied strict, so only the metaclasses the profile references can be used.'}
  - {name: MetamodelReference, display: Profile references metamodel, source: Profile, target: Package, section: 17.2.1, uml_base: PackageImport / ElementImport}
