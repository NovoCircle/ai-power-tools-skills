# Business Process Model and Notation (BPMN) 2.0.2: language file (schema_version 1).
# Written from the standard only. Concept names are the schema's own type names without the leading t.
# Keys beyond the base guide shape: conformance_types, concepts.variants,
# concepts.enumerations, concepts.groups[].defined_by, concepts.elements[].attributes and .members, relationships.connection_tables,
# relationships.endpoint_requirements, relationships.references, event_placement, and on each constraint: applies_when,
# checkable, basis and see_conventions.
#   constraints[].applies_when : omitted = always; executable = only for a process whose isExecutable is true;
#                                bpel-mapping = only when the mapping to WS-BPEL is requested for the process.
#   constraints[].checkable    : static = a validator that sees only the saved model can check it; partial = only the structure,
#                                simple cases or graph analysis; runtime = needs a running instance; none = not a property of a model.
#   constraints[].basis        : inferred = the rule is our inference from absence or from combining clauses; omitted = stated.
#   Strength policy: must = error, should = warning, note = advice only.
schema_version: 1
id: bpmn-2
name: Business Process Model and Notation (BPMN)
owner: {name: Object Management Group, kind: standards-body}

standard: {name: Business Process Model and Notation (BPMN), version: 2.0.2, status: published, reference: 'OMG formal/13-12-09 (PDF; changebar edition formal/13-12-10), published January 2014 per OMG''s About page (the PDF cover says December 2013). Normative machine-readable files: BPMN20.cmof, BPMNDI.cmof, DC.cmof, DI.cmof, Infrastructure.cmof, BPMN20.xsd, BPMNDI.xsd, DC.xsd, DI.xsd, Semantic.xsd and BPMN20-FromXMI.xslt. https://www.omg.org/spec/BPMN/2.0.2/', iso_edition: not compared, supersedes: 2.0.1}

# Required of every language guide. data_types: what the standard defines about types. notation: how each concept is drawn.
# Read from the standard's figures: Tables 7.1 (pp. 26 to 28), 12.8 to 12.35 (pp. 381 to 412) and Figures 8.4, 10.7. A few pictures of the depiction library were not read.
data_types:
  coverage: partial
  section: '10.4'
  note: 'BPMN defines no data model of its own: the structure of an item lives outside the model, by default in XML Schema (typeLanguage) with expressions in XPath (expressionLanguage), both set on the Definitions element (8.2.1, Table 8.1; 10.4); what the standard does define are the value types of its own attributes, 11 enumerations, ISO 8601 timer values and the diagram-interchange types.'
  types:
    - {name: String, kind: primitive, section: 8.2.1, note: 'The text type of the attribute tables and class diagrams (Table 8.1, Figure 8.4); the schema writes it as the XML Schema string.'}
    - {name: Boolean, kind: primitive, section: 8.2.1, note: 'The true/false type (Figure 8.4, for example mustUnderstand; Figure 10.7, for example isExecutable).'}
    - {name: Integer, kind: primitive, section: 10.3.1, note: 'The whole-number type (Figure 10.7: startQuantity, completionQuantity); the schema also uses the XML Schema int for participant multiplicity.'}
    - {name: int, kind: primitive, section: Semantic.xsd, note: XML Schema built-in type; the minimum and maximum of a ParticipantMultiplicity. The clause names it Integer; the schema name is cited because its own clause table was not read.}
    - {name: anyURI, kind: primitive, section: Semantic.xsd, note: XML Schema built-in type; the language of an expression and of a script. Table 8.1 shows the corresponding attributes as strings in URI form (8.2.1).}
    - {name: QName, kind: primitive, section: Semantic.xsd, note: XML Schema built-in type; the type of the references between elements in the interchange file.}
    - {name: ID, kind: primitive, section: Semantic.xsd, note: XML Schema built-in type; the id of every base element (Figure 8.4 shows it as a String).}
    - {name: IDREF, kind: primitive, section: Semantic.xsd, note: XML Schema built-in type; the type of many same-file references.}
    - {name: AdHocOrdering, kind: enumeration, values: [Parallel, Sequential], section: 10.3.5}
    - {name: AssociationDirection, kind: enumeration, values: [None, One, Both], section: 8.4.1}
    - {name: ChoreographyLoopType, kind: enumeration, values: [None, Standard, MultiInstanceSequential, MultiInstanceParallel], section: '11.5'}
    - {name: EventBasedGatewayType, kind: enumeration, values: [Exclusive, Parallel], section: 10.6.6}
    - {name: GatewayDirection, kind: enumeration, values: [Unspecified, Converging, Diverging, Mixed], section: '10.6'}
    - {name: Implementation, kind: enumeration, values: ['##unspecified', '##WebService'], section: 10.3.3.1}
    - {name: ItemKind, kind: enumeration, values: [Information, Physical], section: 10.4.1}
    - {name: MultiInstanceFlowCondition, kind: enumeration, values: [None, One, All, Complex], section: 10.3.8}
    - {name: ProcessType, kind: enumeration, values: [None, Public, Private], section: '10.1'}
    - {name: RelationshipDirection, kind: enumeration, values: [None, Forward, Backward, Both], section: '8.2'}
    - {name: TransactionMethod, kind: enumeration, values: ['##Compensate', '##Image', '##Store'], section: 10.3.5, note: The schema and the clause text spell the values differently; this file follows the schema.}
    - {name: ItemDefinition, kind: other, section: 10.4.1, note: The concept that points at an external structure (structureRef) and says whether the item is information or physical; this is how a model names the type of the data it moves.}
    - {name: ISO 8601 timer values, kind: other, section: 10.5.5, note: 'The timeDate, timeCycle and timeDuration of a Timer event definition; they are mutually exclusive and in ISO 8601 form.'}
    - {name: Point, kind: structured, section: Annex B, note: Diagram-interchange type for a position on a plane (informative annex).}
    - {name: Bounds, kind: structured, section: Annex B, note: Diagram-interchange type for the position and size of a shape (informative annex).}
    - {name: Font, kind: structured, section: Annex B, note: Diagram-interchange type for the font of a label (informative annex).}
  attributes:
    coverage: some_concepts
    where: concepts
    note: 'Attributes carried on a concept entry are those recorded for it (name, type and, where stated, multiplicity). The references between concepts are under relationships.references. Attribute lists for the remaining concepts are in the standard but not yet carried here.'

notation:
  coverage: normative
  section: 7.3; 7.5; 12.3
  note: 'The standard defines the shapes, line styles and markers of BPMN and requires an implementation that draws diagrams to use them; size, color, line style and label position are flexible except where stated (2.2.3; 7.5).'
  elements:
    Event: {shape: circle with an open center, marker: 'an icon inside the circle shows the trigger or result; a catching event draws it as an outline, a throwing event as a solid dark shape', note: 'Several triggers: a pentagon outline. Several triggers that are all needed (parallel multiple): an open plus sign with thick arms. No trigger (None): no icon.', section: 7.3.1 Table 7.1; 10.5; 12.3 Table 12.22}
    CatchEvent: {shape: circle, marker: outline icon (not filled), section: 10.5.1; 12.3 Table 12.22}
    ThrowEvent: {shape: circle, marker: solid dark icon (filled), section: 10.5.1; 12.3 Table 12.22}
    StartEvent: {shape: circle, line: 'thin single line. When it is interrupting, or the None start, the circle is solid; when it is non-interrupting (event sub-process starts) the circle is dashed.', marker: 'none for the None trigger, otherwise an outline icon', section: 10.5.2; 12.3 Table 12.22}
    IntermediateCatchEvent: {shape: circle, line: thin double line (two concentric rings), marker: outline icon, section: 10.5.4; 12.3 Table 12.22}
    IntermediateThrowEvent: {shape: circle, line: thin double line (two concentric rings), marker: solid dark icon; the None throw event has no icon, section: 10.5.4; 12.3 Table 12.22}
    BoundaryEvent: {shape: circle placed on the edge of the activity it is attached to, line: 'thin double line (two concentric rings); solid when it interrupts the activity, dashed when it does not (cancelActivity false)', marker: outline icon, section: 10.5.4; 12.3 Table 12.22}
    EndEvent: {shape: circle, line: one thick line, marker: 'none for the None result, otherwise a solid dark icon', section: 10.5.3; 12.3 Table 12.22}
    EventDefinition: {shape: icon inside an event circle, note: The common class of the ten trigger and result types; each has its own icon below., section: 10.5.5; 12.3 Table 12.22 (pp. 394 to 399)}
    CancelEventDefinition: {shape: icon inside an event circle, marker: an X (two crossing diagonals); drawn as an outline when catching and filled when throwing (the Terminate disc and the Cancel cross on an end event are solid), section: 12.3 Table 12.22 (pp. 394 to 399)}
    CompensateEventDefinition: {shape: icon inside an event circle, marker: 'two triangles side by side, both pointing left; drawn as an outline when catching and filled when throwing (the Terminate disc and the Cancel cross on an end event are solid)', section: 12.3 Table 12.22 (pp. 394 to 399)}
    ConditionalEventDefinition: {shape: icon inside an event circle, marker: a sheet with several horizontal text lines; drawn as an outline when catching and filled when throwing (the Terminate disc and the Cancel cross on an end event are solid), section: 12.3 Table 12.22 (pp. 394 to 399)}
    ErrorEventDefinition: {shape: icon inside an event circle, marker: a zigzag lightning bolt; drawn as an outline when catching and filled when throwing (the Terminate disc and the Cancel cross on an end event are solid), section: 12.3 Table 12.22 (pp. 394 to 399)}
    EscalationEventDefinition: {shape: icon inside an event circle, marker: an open arrowhead pointing up (a narrow caret shape); drawn as an outline when catching and filled when throwing (the Terminate disc and the Cancel cross on an end event are solid), section: 12.3 Table 12.22 (pp. 394 to 399)}
    LinkEventDefinition: {shape: icon inside an event circle, marker: a block arrow pointing right; drawn as an outline when catching and filled when throwing (the Terminate disc and the Cancel cross on an end event are solid), section: 12.3 Table 12.22 (pp. 394 to 399)}
    MessageEventDefinition: {shape: icon inside an event circle, marker: an envelope with a V-shaped flap; drawn as an outline when catching and filled when throwing (the Terminate disc and the Cancel cross on an end event are solid), section: 12.3 Table 12.22 (pp. 394 to 399)}
    SignalEventDefinition: {shape: icon inside an event circle, marker: an upright triangle; drawn as an outline when catching and filled when throwing (the Terminate disc and the Cancel cross on an end event are solid), section: 12.3 Table 12.22 (pp. 394 to 399)}
    TerminateEventDefinition: {shape: icon inside an event circle, marker: a solid dark disc inside the end-event ring; drawn as an outline when catching and filled when throwing (the Terminate disc and the Cancel cross on an end event are solid), section: 12.3 Table 12.22 (pp. 394 to 399)}
    TimerEventDefinition: {shape: icon inside an event circle, marker: 'a clock face: a circle with tick marks and two hands; drawn as an outline when catching and filled when throwing (the Terminate disc and the Cancel cross on an end event are solid)', section: 12.3 Table 12.22 (pp. 394 to 399)}
    Activity: {shape: rounded rectangle, marker: 'loop, multi-instance, compensation and sub-process markers sit together at the bottom center; a task-type icon sits at the upper left', section: 7.3.1 Table 7.1; 10.3; 12.3 Tables 12.8 to 12.9}
    Task: {shape: rounded rectangle, marker: none (the abstract task), section: 10.3.3; 12.3 Table 12.9 (p. 385)}
    ServiceTask: {shape: rounded rectangle, marker: 'small icon at the upper left: two interlocking gears', section: 10.3.3.1; 12.3 Table 12.9 (p. 385)}
    SendTask: {shape: rounded rectangle, marker: 'small icon at the upper left: a solid dark envelope', section: 10.3.3.1; 12.3 Table 12.9 (p. 385)}
    ReceiveTask: {shape: rounded rectangle, marker: 'small icon at the upper left: an outline envelope (not filled)', section: 10.3.3.1; 12.3 Table 12.9 (p. 385)}
    UserTask: {shape: rounded rectangle, marker: 'small icon at the upper left: the head and shoulders of a person', section: 10.3.3.1; 12.3 Table 12.9 (p. 385)}
    ManualTask: {shape: rounded rectangle, marker: 'small icon at the upper left: a hand', section: 10.3.3.1; 12.3 Table 12.9 (p. 385)}
    BusinessRuleTask: {shape: rounded rectangle, marker: 'small icon at the upper left: a small table with a shaded header row', section: 10.3.3.1; 12.3 Table 12.9 (p. 385)}
    ScriptTask: {shape: rounded rectangle, marker: 'small icon at the upper left: a curled sheet of paper with text lines', section: 10.3.3.1; 12.3 Table 12.9 (p. 385)}
    SubProcess: {shape: rounded rectangle, line: thin and solid; dotted when it is an Event Sub-Process, marker: 'collapsed: a small square holding a plus sign at the bottom center; expanded: no plus, the contents are drawn inside and the name sits at the top left', section: 10.3.5; 12.3 Tables 12.10 and 12.11 (p. 386)}
    AdHocSubProcess: {shape: rounded rectangle, marker: 'a tilde (wavy line); collapsed, it sits right of the plus square at the bottom center; expanded, at the bottom center', section: 10.3.5; 12.3 Tables 12.12 and 12.13 (p. 387)}
    Transaction: {shape: rounded rectangle, line: double border (an inner and an outer outline), marker: plus square at the bottom center when collapsed, section: 10.3.5; 12.3 Table 12.14 (p. 387)}
    CallActivity: {shape: rounded rectangle, line: thick border, marker: a task-type icon when it calls a global task of that type; a plus square when it calls a process and is collapsed, section: 10.3.6; 12.3 Tables 12.18 to 12.20 (pp. 391 to 392)}
    StandardLoopCharacteristics: {shape: marker on an activity, marker: a small circular arrow at the bottom center; not shown together with a multi-instance marker, section: 10.3.8; 12.3 Table 12.8 (p. 382)}
    MultiInstanceLoopCharacteristics: {shape: marker on an activity, marker: 'three short vertical bars when the instances run in parallel, three short horizontal bars when they run in sequence; at the bottom center', section: 10.3.8; 12.3 Table 12.8 (p. 383)}
    Gateway: {shape: diamond, marker: an internal marker shows the kind, section: 7.3.1 Table 7.1; 10.6; 12.3 Table 12.23 (p. 400)}
    ExclusiveGateway: {shape: diamond, marker: either empty or a bold X in the middle (a diagram should choose one and keep to it), section: 10.6.2; 12.3 Table 12.23}
    InclusiveGateway: {shape: diamond, marker: a bold open circle (ring) in the middle, section: 10.6.3; 12.3 Table 12.23}
    ParallelGateway: {shape: diamond, marker: a bold plus sign in the middle, section: 10.6.4; 12.3 Table 12.23}
    ComplexGateway: {shape: diamond, marker: a bold asterisk (eight spokes) in the middle, section: 10.6.5; 12.3 Table 12.23}
    EventBasedGateway: {shape: diamond, marker: two concentric rings holding a small pentagon (the look of a catching Multiple intermediate event), note: 'When it starts a process (instantiate true): exclusive type, a single ring with a pentagon; parallel type, a single ring with a plus sign.', section: 10.6.6; 12.3 Table 12.23 (pp. 400 to 401)}
    DataObject: {shape: page with a folded top-right corner, label: name below the shape, marker: a collection shows three short vertical bars at the bottom center, section: 7.3.1 Table 7.1; 12.3 Table 12.21 (p. 393)}
    DataObjectReference: {shape: page with a folded top-right corner, label: 'name below, plus the data state name when there is one', marker: a collection shows three short vertical bars at the bottom center, section: 12.3 Table 12.21 (p. 393)}
    DataState: {shape: no shape of its own, label: its name is part of the label of a Data Object Reference, section: '12.3'}
    DataInput: {shape: page with a folded top-right corner and an outline (unfilled) right-pointing block arrow at the upper left, label: name below, marker: a collection adds three short vertical bars at the bottom center, section: 10.4.1; 12.3 Table 12.21}
    DataOutput: {shape: page with a folded top-right corner and a solid dark right-pointing block arrow at the upper left, label: name below, marker: a collection adds three short vertical bars at the bottom center, section: 10.4.1; 12.3 Table 12.21}
    DataStore: {shape: cylinder (a drum with ringed top), label: name below, section: 12.3 Table 12.21 (p. 393)}
    DataStoreReference: {shape: cylinder (a drum with ringed top), label: name below, section: 12.3 Table 12.21 (p. 393)}
    Message: {shape: envelope with a V-shaped flap, note: 'Also a decorator on message flows and choreography bands: unfilled for the initiating message, lightly shaded for the non-initiating (return) message.', section: 7.3.1 Table 7.1; 8.4.11; 12.3 Tables 12.33 and 12.35}
    Participant: {shape: rectangle (a pool) with a narrow name band along its left side (horizontal pool) or along its top (vertical pool); an empty pool is a black box, marker: three short vertical bars at the bottom center when the maximum multiplicity is greater than 1, note: In a choreography a participant is a band on the activity instead (see ChoreographyTask)., section: 7.3.1 Table 7.1; 9.3; 12.3 Table 12.26 (p. 402)}
    ParticipantMultiplicity: {shape: no shape of its own, marker: shows as three short vertical bars at the bottom center of the pool or band, section: 9.3.1; 12.3 Tables 12.26 and 12.33}
    Lane: {shape: 'a rectangle subdividing a pool, with its own name band: along the left side in a horizontal pool, along the top in a vertical pool', section: 7.3.1 Table 7.1; 10.8; 12.3 Table 12.25 (p. 401)}
    Group: {shape: rounded rectangle with a dash-dot outline, label: 'the category name, small, at the top right', note: May span pools. Does not affect flow., section: 7.3.1 Table 7.1; 8.4.1; 12.3 Table 12.24 (p. 401)}
    TextAnnotation: {shape: 'an open square bracket on the left holding free text, joined to the element it explains by a dotted line', section: 7.3.1 Table 7.1; 8.4.1; 12.3 Table 12.24}
    Category: {shape: no shape of its own, label: its name is the label of the Group, section: 8.4.1}
    CategoryValue: {shape: no shape of its own, label: its value is the label of the Group, section: 8.4.1}
    ChoreographyTask: {shape: 'rounded rectangle in three parts: a band for the top participant, the task name in the middle, a band for the bottom participant; bands for further participants are plain rectangles', marker: 'the initiating band is white and the other bands are shaded gray; loop: a circular arrow, sequential multi-instance: three horizontal bars, parallel multi-instance: three vertical bars, each at the bottom center of the middle part', section: '11.5.1; 12.3 Tables 12.27 and 12.33 (pp. 403, 408 to 410)'}
    SubChoreography: {shape: rounded rectangle with participant bands as on a choreography task, marker: 'collapsed: a plus square at the bottom center, with the loop marker (circular arrow, horizontal bars or vertical bars) to its left; expanded: the contents are drawn inside with the name at the top left', section: 11.5.2; 12.3 Tables 12.28 and 12.29 (pp. 404 to 405)}
    CallChoreography: {shape: rounded rectangle with participant bands as on a choreography task, line: thick border, marker: 'calling a global choreography task: as a choreography task; calling a choreography: a plus square at the bottom center when collapsed, loop marker to its left', section: 11.5.3; 12.3 Tables 12.30 to 12.32 (pp. 405 to 407)}
    Conversation: {shape: hexagon, label: name below, section: 9.5.2; 12.3 Table 12.34 (p. 410)}
    SubConversation: {shape: hexagon, marker: a plus square at the bottom center, label: name below, section: 9.5.3; 12.3 Table 12.34}
    CallConversation: {shape: hexagon with a thick border when it calls a global conversation, note: When it calls a collaboration it is a sub-conversation hexagon (with the plus square) and a thick border., section: 9.5.4; 12.3 Table 12.34}
  relationships:
    SequenceFlow: {line: solid, source_end: none; a small open diamond when a conditional flow leaves an activity (none when it leaves a gateway); a short slash across the line when it is the default flow, target_end: solid filled arrowhead, label: 'optional, on the line', section: 8.4.13; 7.3.2; 12.3 Table 12.35 (p. 411)}
    MessageFlow: {line: dashed, source_end: small open circle, target_end: 'open triangular arrowhead (outline, not filled)', label: 'optional; the envelope decorator, when shown, sits at the midpoint: unfilled for the initiating message, lightly shaded for the non-initiating one', section: 9.4; 7.3.1 Table 7.1; 12.3 Table 12.35 (p. 411)}
    Association: {line: dotted, source_end: none, target_end: 'none, an open arrowhead (one direction), or open arrowheads at both ends (both directions)', label: 'optional, on the line', section: 8.4.1; 12.3 Table 12.35 (pp. 411 to 412)}
    DataAssociation: {line: dotted, source_end: none, target_end: open arrowhead, label: 'optional, on the line', note: Drawn like a directed association. A data association on a sequence flow is drawn as a plain dotted line to the flow., section: 10.4.1; 12.3 Table 12.35 (p. 412)}
    DataInputAssociation: {line: dotted, source_end: none, target_end: open arrowhead, label: 'optional, on the line', note: Drawn like a directed association. A data association on a sequence flow is drawn as a plain dotted line to the flow., section: 10.4.1; 12.3 Table 12.35 (p. 412)}
    DataOutputAssociation: {line: dotted, source_end: none, target_end: open arrowhead, label: 'optional, on the line', note: Drawn like a directed association. A data association on a sequence flow is drawn as a plain dotted line to the flow., section: 10.4.1; 12.3 Table 12.35 (p. 412)}
    ConversationLink: {line: double thin line (two close parallel solid lines), section: 9.5.6; 12.3 Table 12.35}
