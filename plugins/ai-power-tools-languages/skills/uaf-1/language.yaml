      category: Summary and Overview
      kind: type
      specializes: [MeasurableElement]
      uml_base: Package
      defined_in: [uafp, dmm]
      section: 7.1.13
      definition: A work product giving executive-level summary information about an architecture.
      attributes: [{name: approvalAuthority, type: String, multiplicity: '*'}, {name: architect, type: String, multiplicity: '*'}, {name: assumptionAndConstraint, type: String, multiplicity: '*'}, {name: creatingOrganization, type: String, multiplicity: '*'}, {name: dateCompleted, type: String, multiplicity: '0..1'}, {name: purpose, type: String, multiplicity: '*'}, {name: recommendations, type: String, multiplicity: '*'}, {name: summaryOfFindings, type: String, multiplicity: '*'}, {name: toBe, type: Boolean, multiplicity: '1'}, {name: toolsUsed, type: String, multiplicity: '*'}]
      association_ends: {architectureFramework: 'String[1]', view: 'View[*]', viewPoint: 'Viewpoint[1]'}
    Architecture:
      display: Architecture
      category: Summary and Overview
      kind: abstract
      abstract: true
      specializes: [UAFElement]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.13
      definition: Grouping of generic architectures (operational and resource).
      association_ends: {describedBy: 'ArchitecturalDescription[*]'}
    Concern:
      display: Concern
      category: Summary and Overview
      kind: type
      specializes: [PropertySet]
      base: [Block]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.13
      definition: An interest in an enterprise phase held by one or more stakeholders.
      association_ends: {systemConcern: 'ActualEnterprisePhase[*]'}
    Stakeholder:
      display: Stakeholder
      category: Summary and Overview
      kind: abstract
      abstract: true
      specializes: [UAFElement]
      uml_base: Element
      defined_in: [uafp, dmm]
      section: 7.1.13
      definition: An individual, team or organization with an interest in an enterprise phase.
      association_ends: {stakeholderConcern: 'Concern[*]'}
    UAFElement:
      display: UAF Element
      category: Summary and Overview
      kind: abstract
      abstract: true
      uml_base: Element
      defined_in: [uafp, dmm]
      section: 7.1.13
      definition: Root grouping of every UAF element; carries a URI and a conformance link.
      attributes: [{name: URI, type: String, multiplicity: '0..1'}]
      association_ends: {conformsTo: 'Standard[*]'}
    View:
      display: View
      category: Summary and Overview
      kind: type
      specializes: [PropertySet]
      base: [View]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.13
      definition: An architecture view expressing the architecture under one viewpoint.
      association_ends: {viewpoint: 'Viewpoint[1]'}
    Viewpoint:
      display: Viewpoint
      category: Summary and Overview
      kind: type
      specializes: [PropertySet]
      base: [Viewpoint]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.13
      definition: A viewpoint framing one or more concerns for given stakeholders.
      attributes: [{name: languages, type: String, multiplicity: '*'}, {name: methods, type: String, multiplicity: '*'}, {name: purpose, type: String, multiplicity: '0..1'}]
      association_ends: {concern: 'Concern[*]', stakeholder: 'Stakeholder[*]'}
    ActivityPerformableUnderCondition:
      display: Activity Performable Under Condition
      category: Metadata::Processes
      kind: type
      specializes: [MeasurableElement]
      defined_in: [dmm]
      section: 3.1.1.4 (DMM)
      definition: The environment under which an Activity is performed.
    SecurityControlAction:
      display: Security Control Action
      category: Security::Processes
      kind: type
      specializes: [OperationalActivityAction, FunctionAction]
      defined_in: [dmm]
      section: 3.1.7.3 (DMM)
      definition: A call of a SecurityControl inside another, showing how a set of controls protects an asset at an operational role.
    Caveat:
      display: Caveat
      category: Security::Constraints
      kind: type
      specializes: [SecurityConstraint]
      defined_in: [dmm]
      section: 3.1.7.4 (DMM)
      definition: A statement of alternate conditions under which a rule does not hold.
    SecurityAvailability:
      display: Security Availability
      category: Security::Constraints
      kind: type
      specializes: [SecurityMeasurement]
      defined_in: [dmm]
      section: 3.1.7.4 (DMM)
      definition: A security measurement of availability; the text gives no definition.
    SecurityCategory:
      display: Security Category
      category: Security::Constraints
      kind: type
      specializes: [MeasurementSet]
      defined_in: [dmm]
      section: 3.1.7.4 (DMM)
      definition: A set of security measurements; the text gives no definition.
    SecurityClassification:
      display: Security Classification
      category: Security::Constraints
      kind: type
      specializes: [SecurityMeasurement]
      defined_in: [dmm]
      section: 3.1.7.4 (DMM)
      definition: The security categories determined for each kind of information an information system handles, as confidentiality, integrity and availability impacts.
    SecurityClassificationKind:
      display: Security Classification Kind
      category: Security::Constraints
      kind: enumeration
      defined_in: [dmm]
      section: 3.1.7.4 (DMM)
      definition: 'The acceptable values of a security category: potential impact of low, moderate or high.'
      literals: [low, moderate, high]
    SecurityIntegrity:
      display: Security Integrity
      category: Security::Constraints
      kind: type
      specializes: [SecurityMeasurement]
      defined_in: [dmm]
      section: 3.1.7.4 (DMM)
      definition: A security measurement of integrity; the text gives no definition.
    SecurityMeasurement:
      display: Security Measurement
      category: Security::Constraints
      kind: abstract
      abstract: true
      specializes: [Measurement]
      defined_in: [dmm]
      section: 3.1.7.4 (DMM)
      definition: Grouping of security measurements; the text gives no definition.
relationships:
  multiplicity: The standard gives no multiplicity for any relationship; each is many-to-many and optional at both ends.
  allowed: 'The allowed ends are the metaconstraints of the profile; a source or target absent from the lists is an error (rules UAF-END-nnn). Where `pairs` is present, only those source and target pairs are allowed together. A listed concept stands for itself and all its specializations. Relationship concepts themselves are in concepts.elements with kind: relationship.'
  types:
  - name: SameAs
    uml_base: Dependency
    roles: {source: client, target: supplier}
    source: [UAFElement]
    target: [UAFElement]
    specializes: [MeasurableElement]
    section: 7.1.1
  - name: Exchange
    uml_base: InformationFlow
    abstract: true
    roles: {source: informationSource, target: informationTarget}
    ends: not constrained by the standard
    specializes: [MeasurableElement]
    section: 7.1.3.2
  - name: IsCapableToPerform
    uml_base: Abstraction
    roles: {source: client, target: supplier}
    pairs:
    - {source: OperationalAgent, target: OperationalActivity}
    - {source: ServiceSpecification, target: ServiceFunction}
    - {source: ResourcePerformer, target: Function}
    - {source: Project, target: ProjectActivity}
    note: A Function other than a ProjectActivity is paired with a ResourcePerformer; a ProjectActivity only with a Project.
    specializes: [MeasurableElement]
    section: 7.1.3.3
  - name: PerformsInContext
    uml_base: Abstraction
    roles: {source: client, target: supplier}
    pairs:
    - {source: OperationalRole, target: OperationalActivityAction}
    - {source: ServiceSpecificationRole, target: ServiceFunctionAction}
    - {source: ResourceRole, target: FunctionAction}
    - {source: ProjectRole, target: ProjectActivityAction}
    note: A FunctionAction other than a ProjectActivityAction is paired with a ResourceRole; the standard states the ProjectRole pairing for the client end only.
    specializes: [MeasurableElement]
    section: 7.1.3.3
  - name: ArchitecturalReference
    uml_base: Dependency
    roles: {source: client, target: supplier}
    source: [ArchitecturalDescription]
    target: [ArchitecturalDescription]
    specializes: [MeasurableElement]
    section: 7.1.3.6
  - name: Implements
    uml_base: Abstraction
    roles: {source: client, target: supplier}
    pairs:
    - {source: ResourcePerformer, target: OperationalAgent}
    - {source: Function, target: OperationalActivity}
    - {source: Function, target: ServiceFunction}
    - {source: ResourceInterface, target: ServiceInterface}
    - {source: ResourceInterface, target: OperationalInterface}
    - {source: ResourceConnector, target: OperationalConnector}
    - {source: ResourceConnector, target: ResourceConnector}
    - {source: ResourceExchange, target: OperationalExchange}
    - {source: ResourceRole, target: OperationalRole}
    - {source: OperationalActivity, target: ActualEnduringTask}
    - {source: DataElement, target: InformationElement}
    specializes: [MeasurableElement]
    section: 7.1.3.6
  - name: CapabilityForTask
    uml_base: Abstraction
    roles: {source: client, target: supplier}
    source: [Capability]
    target: [ActualEnduringTask]
    specializes: [MeasurableElement]
    section: 7.1.4.3
  - name: AchievedEffect
    uml_base: Dependency
    roles: {source: client, target: supplier}
    source: [Achiever]
    target: [ActualState]
    specializes: [MeasurableElement]
    section: 7.1.4.4
  - name: DesiredEffect
