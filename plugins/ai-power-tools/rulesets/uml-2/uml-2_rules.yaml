  - id: UML2-REL-001
    name: Include, extend, import, access, merge and substitute join the elements the standard allows
    implements: UML-SEM-088
    description: An include and an extend join a use case to a use case; a package import (import, access) joins a namespace
      to a package; a package merge joins a package to a package; a substitution joins a classifier to a classifier. EA stores
      the first two as a UseCase connector and the others as a Dependency, Package or Substitution connector, each with a
      plain stereotype string (include, extend, import, access, merge, substitute). The table is generated from the language
      skill's relationships.allowed. [OMG UML 2.5.1 (formal/17-12-05) 18.2.4; 18.2.2; 7.8.11; 12.4.6; 9.9.22]
    category: relationship
    severity: error
    demo_trigger: true
    coverage: partial
    not_checked: Only the connectors that carry a stereotype can be listed in a table (the validator keys a table by stereotype);
      the unstereotyped relationships are judged by their own rules.
    selector:
      type: connector
      connector_stereotypes: any_of_table
    condition:
      type: relationship_table
      table: uml-2-keyword-relationships
      skip_endpoints: []
      unknown_endpoint: ignore
    remediation:
      short: Join the element kinds the standard allows for this relationship.
      auto_fixable: false
