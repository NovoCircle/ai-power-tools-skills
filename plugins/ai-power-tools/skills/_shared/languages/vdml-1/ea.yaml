# EA facts for VDML 1.0 (language file vdml-1), as Sparx Enterprise Architect's built-in VDML technology stores them.
# Measured by reading back what EA stores.
# `concepts` maps every concept of the language skill to what EA offers: a stereotype, a connector stereotype, a tag value or nothing.
# Westbrook Bank appears only in howto.md, as an illustration.

language: vdml-1
technology: VDML
display_name: VDML 1.0 (EA names it Value Delivery Metamodel (VDML))
profile: VDML
stereotype_prefix: ''
stereotype_storage: bare name in t_object.Stereotype and t_connector.Stereotype (Role, BoundaryPort, DeliverableFlow); the qualified
  form VDML::<name> is the FQName in the t_xref row named Stereotypes and is what AddNew takes
measured_on:
  ea: 17.1 build 1716
  date: '2026-10-21'
counts:
  stereotype_names_on_resources_tab: 24
  resources_tab_rows: 25
  element_stereotypes_bound: 17
  connector_stereotypes_bound: 7
  concept_names_refused: 53
  diagram_types: 8
  tag_rows_read: 23
  concepts_in_language_file: 71
  concepts_by_representation:
    stereotype: 15
    stereotype (shared): 7
    none: 41
    stereotype and tag: 2
    connector stereotype: 6
version_note: The skill describes VDML 1.0. OMG published 1.1 in 2018. EA's technology states no version; its
  model patterns carry none and its display name is the 1.0 title. What the catalog shows is consistent with 1.0 (the stereotypes are
  the 1.0 class names, with no 1.1 additions identified), but nothing measured here settles it; 1.1 was not researched.
