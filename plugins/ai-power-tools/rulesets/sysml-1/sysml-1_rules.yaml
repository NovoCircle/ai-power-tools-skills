  - id: SYSML1-DEP-002
    name: A flow port has a direction
    implements: SYSML-DEP-002
    description: An atomic flow port has a direction and no conjugation setting. Flow ports are deprecated since SysML 1.3;
      EA keeps them as the stereotype FlowPort, which carries the tagged value direction (in, out, inout, none; EA creates
      it as inout). The rule reports a flow port whose direction is empty. [OMG SysML 1.5 (formal/17-05-01) C.3.2.3 [2]]
    category: dep
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: 'Whether the port is atomic (typed by a value type, block or signal, not a flow specification) and that it
      is not conjugated: both follow a reference or a flag, not a tag.'
    selector:
      type: element
      stereotypes:
        any_of:
        - FlowPort
    condition:
      type: tagged_value_required
      tags:
      - name: direction
        must_be_non_empty: true
    remediation:
      short: Set the tagged value direction of the flow port.
      auto_fixable: false

  - id: SYSML1-REQ-003
