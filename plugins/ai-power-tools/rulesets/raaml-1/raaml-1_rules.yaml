# RAAML 1.0 Conformance Ruleset
# Language:     RAAML 1.0 (OMG formal/22-12-06), as modeled with Sparx's built-in RAAML technology
# Enforced by:  AI Power Tools for Sparx EA - validate_model tool
# Generated from the language skill's rules and relationships; do not edit by hand.
#
# STEREOTYPE NAMES ARE UNQUALIFIED AND CASE-SENSITIVE, AND THAT IS MEASURED.
#
# validate_model selects with `Stereotype IN (...)` on t_object and t_connector. For Sparx's RAAML technology that column holds the bare
# name (`FMEAItem`, `FailureMode`, `ID carrier`, `MAJORITY VOTE`); the qualified form `RAAML::FMEAItem` is only in the t_xref row named
# `Stereotypes`. Measured on EA 17.1 build 1716 by creating one object per (stereotype, metaclass) pair in a test model and reading it
# back: 120 names bound, FQName `RAAML::<name>`. EA matches a name without regard to case when it creates an object, and a spelling that
# differs only by case can be another stereotype on another metaclass (`cause` is a Port stereotype, `Cause` an Association stereotype;
# `failureMode` a Port, `FailureMode` a Class and an Association), but a selector compares the stored string exactly.
#
# WHAT THE VALIDATOR CAN SEE. A rule selects an element by the FIRST stereotype in t_object.Stereotype (a second stereotype, such as
# Undeveloped on a Goal or SysML's block, is only in t_xref), by its EA type (t_object.Object_Type, written type:<Type>), by its tagged
# values, by counts of connectors (by stereotype or EA connector type, so a Generalization, which has no stereotype, can be counted),
# and by what it owns (the children whose ParentID is the element: a Port stereotyped finalEffect under an FMEA item).
# WHAT IT CANNOT SEE. What a port or part is typed by, where a generalization leads beyond its other end, attributes and value
# properties (they are not elements), numeric values (probabilities, ASIL values, the RPN) and a second stereotype. Most of RAAML's
# remaining rules are about those, so 27 of the language skill's rules are in this file.
#
# RELATIONSHIP TABLES. The situation family (every stereotype of the technology that stands for a situation) and the GSN node kinds are
# generated from the language skill's generalizations. A table names an end by its stereotype when it has a row for it, otherwise by
# type:<Object_Type>. So a plain class is type:Class, and the tables name the EA element types
# they are willing to see (the situation tables treat a plain class as possibly a situation, and an unstereotyped requirement, actor, use
# case, component, node, artifact or note as never one); a connector with an end the table does not name is not judged.
#
# CONNECTOR DIRECTION. The counts of FailureMode and Cause connectors assume the part is drawn to the whole, the direction of Sparx's own
# FMEA model pattern (cause, failure mode and effect classes are the connector's source; the FMEA item is the target). The gate counts follow
# Sparx's FTA Pattern (read on screen, EA 17.1 build 1716, 2026-11-04): an input runs from the event to the gate and the output from the gate
# to the top event, both as plain Associations with no stereotype, so the gate rules count Associations by connector type, not by the
# stereotypes input and output.
#
# Sources:
#   [S1] OMG, Risk Analysis and Assessment Modeling Language (RAAML) Version 1.0, formal/22-12-06
#   [S2] Sparx Systems, the RAAML technology built into Enterprise Architect 17.1 (the API reports it as RAAML1.0, version 1.0)

meta:
  version: "0.1"
  language: raaml-1
  organization: "(your organization)"
  mdg_family: RAAML
  description: >
    Conformance rules for RAAML 1.0 models built with Sparx Enterprise Architect's RAAML technology: which situations the relationship stereotypes
    may join, the GSN argument links, the parts of an FMEA item and a fault tree gate, what a marked class must specialize, and the tagged values that a marker must carry. Each rule
    names the rules.md id it implements.
  severity_levels:
    error: A requirement of the standard (rules.md strength must)
    warning: Guidance of the standard (rules.md strength should)
    info: Advisory note; not a conformance violation

