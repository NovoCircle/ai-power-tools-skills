    remediation:
      short: Attach the sequence flow to a flow node inside the pool or lane; use a data association for data.
      auto_fixable: false

  - id: BPMN2-CONN-006b
    name: No message flow on lanes, gateways, data objects or artifacts
    implements: BPMN-CONN-006
    description: A lane, a gateway, a data object, a group and a text annotation cannot be the source or target of a message
      flow. [OMG BPMN 2.0.2 (formal/13-12-09) 7.6.1 to 7.6.2 pp. 41 to 42]
    category: connection
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: connector
      connector_stereotype: MessageFlow
    condition:
      type: connector_endpoint_stereotype
      source_must_be_one_of:
      - Activity
      - Assignment
      - BPELProcess
      - BusinessProcess
      - Category
      - CategoryValue
      - Choreography
      - ChoreographyModel
      - CollaborationModel
      - ComplexBehaviorDefinition
      - Conversation
