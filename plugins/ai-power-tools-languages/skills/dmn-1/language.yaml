# Decision Model and Notation (DMN) 1.2: language file (schema_version 1).
# Written from the standard only. Concept names are the standard's own metamodel class names (no spaces).
# Keys beyond the base guide shape: conformance_types, concepts.groups,
# concepts.enumerations, relationships.connection_tables, relationships.references, and on each constraint applies_when, checkable, see_conventions.
#   constraints[].checkable    : static = a validator that sees only the saved model can check it; partial = only the structure, simple cases or
#                                graph analysis (or it needs another model); runtime = needs a running instance; none = not a property of a model.
#   constraints[].applies_when : omitted = always; level = depends on the conformance level the model targets; automation = only for decision logic
#                                meant for full automation.
#   Strength policy: must = error, should = warning, note = advice only.
schema_version: 1
id: dmn-1
name: Decision Model and Notation (DMN)
owner: {name: Object Management Group, kind: standards-body}
standard:
  name: Decision Model and Notation
  version: '1.2'
  status: published
  reference: 'OMG formal/19-01-05 (specification PDF, January 2019). Normative machine-readable files: DMN12.xsd, DMNDI12.xsd, DI.xsd, DC.xsd, DMN12.xmi, DMNDI12.xmi (dtc/18-05-04 to dtc/18-06-07). https://www.omg.org/spec/DMN/1.2/'
  later_versions: 'Newer versions exist (1.3 to 1.6 and a 1.7 beta) and are not described here.'
conformance_types:
  Level1:
    section: '2.1, p. 15'
    requires: 'Clauses 6 (decision requirements), 7 (decision logic) and 8 (decision table), plus the general requirements of 2.2.'
    expressions: 'Expression text is not interpreted. If a tool interprets it, the interpretation agrees with clause 7.'
  Level2:
    section: '2.1, p. 15'
    adds_to: Level1
    requires: 'Everything in Level 1, and interpretation of S-FEEL (clause 9).'
    expressions: 'Literal expressions are restricted to S-FEEL.'
  Level3:
    section: '2.1, p. 15'
    adds_to: Level2
    requires: 'Clauses 6, 7, 8 and 10 (full FEEL and the boxed expressions of clause 10). A Level 3 tool can also claim Levels 2 and 1.'
    expressions: 'Full FEEL.'
  general: 'All levels also meet 2.2: use the specified shapes, icons and markers (2.2.1); give interpretations consistent with the specified semantics (2.2.2); let users create and view every mandatory attribute (2.2.3).'
concepts:
  source: 'OMG DMN 1.2: the metamodel in DMN12.xmi (43 classes, 5 enumerations; the abstract wrapper class Element for foreign extension content is not listed, leaving 42) and DMNDI12.xmi (8 DMN classes), with the clauses of the PDF (6 to 8, 10.5, 13). Generalization and abstract flags come from the XMI; where the PDF text and the XMI differ, the XMI is followed and the difference is noted on the concept. The 66 FEEL grammar rules and the semantic mappings are not concepts and are not listed.'
  groups:
    Foundation: {defined_by: 'Clauses 6.3.1 to 6.3.5', notes: 'Root classes and the container: identity, naming, the model container, imports, element collections.'}
    DRG elements: {defined_by: 'Clauses 6.3.7 to 6.3.12', notes: 'The things in a Decision Requirements Graph: decisions, knowledge models, services, input data, knowledge sources.', diagram_type: DecisionRequirementsDiagram}
    Requirements: {defined_by: 'Clauses 6.3.13 to 6.3.15', notes: 'The three kinds of dependency between DRG elements.', diagram_type: DecisionRequirementsDiagram}
    Artifacts: {defined_by: 'Clause 6.3.6', notes: 'Annotations that add information without changing the meaning of a model.', diagram_type: DecisionRequirementsDiagram}
    Business context: {defined_by: 'Clause 6.3.8', notes: 'Placeholders for organizational and performance information defined by other OMG models.'}
    Types and variables: {defined_by: 'Clauses 7.3.2, 7.3.3', notes: 'Item definitions (data structure and range) and information items (variables).'}
    Decision logic: {defined_by: 'Clauses 7.3, 10.5', notes: 'Expressions that say how a result is computed: literal expressions, invocations, bindings, contexts, lists, relations, function definitions.', diagram_type: BoxedExpression}
    Decision tables: {defined_by: 'Clause 8.3', notes: 'The decision table and its clauses and rules.', diagram_type: BoxedExpression}
    Extensibility: {defined_by: 'Clause 6.3.16', notes: 'Hooks for attaching elements and attributes from other metamodels.'}
    Diagram interchange: {defined_by: 'Clause 13', notes: 'The classes that interchange the layout of a Decision Requirements Diagram.', diagram_type: DecisionRequirementsDiagram}
  elements:
    DMNElement: {display: DMN Element, category: Foundation, abstract: true, attributes: [{name: id, type: ID, multiplicity: '0..1', section: '6.3.1 Table 3'}, {name: description, type: String, multiplicity: '0..1', section: '6.3.1 Table 3'}, {name: label, type: String, multiplicity: '0..1', note: 'A short alternative description; it has no notation and is not the Diagram Interchange label', section: '6.3.1 Table 3'}]}
    NamedElement: {display: Named Element, category: Foundation, abstract: true, specializes: DMNElement, attributes: [{name: name, type: string, section: '6.3.1 Table 4'}]}
    Expression: {display: Expression, category: Decision logic, abstract: true, specializes: DMNElement, attributes: [{name: typeRef, type: String, multiplicity: '0..1', note: Optional per the text, section: '7.3.1'}]}
    UnaryTests: {display: Unary Tests, category: Decision logic, specializes: DMNElement}
    Definitions: {display: Definitions, category: Foundation, specializes: NamedElement, attributes: [{name: namespace, type: anyURI, multiplicity: '1', section: '6.3.2 Table 5'}, {name: expressionLanguage, type: anyURI, multiplicity: '0..1', section: '6.3.2 Table 5'}, {name: typeLanguage, type: anyURI, multiplicity: '0..1', section: '6.3.2 Table 5'}, {name: exporter, type: string, multiplicity: '0..1', section: '6.3.2 Table 5'}, {name: exporterVersion, type: string, multiplicity: '0..1', section: '6.3.2 Table 5'}]}
    Import: {display: Import, category: Foundation, specializes: NamedElement, attributes: [{name: importType, type: anyURI, section: '6.3.3 Table 6'}, {name: locationURI, type: anyURI, multiplicity: '0..1', section: '6.3.3 Table 6'}, {name: namespace, type: anyURI, section: '6.3.3 Table 6'}]}
    ImportedValues: {display: Imported Values, category: Foundation, specializes: Import}
    ElementCollection: {display: Element Collection, category: Foundation, specializes: NamedElement}
    DRGElement: {display: DRG Element, category: DRG elements, abstract: true, specializes: NamedElement}
    Decision: {display: Decision, category: DRG elements, specializes: DRGElement, attributes: [{name: question, type: string, multiplicity: '0..1', section: '6.3.7 Table 10'}, {name: allowedAnswers, type: string, multiplicity: '0..1', section: '6.3.7 Table 10'}]}
    Invocable: {display: Invocable, category: DRG elements, abstract: true, specializes: DRGElement}
    BusinessKnowledgeModel: {display: Business Knowledge Model, category: DRG elements, specializes: Invocable}
    DecisionService: {display: Decision Service, category: DRG elements, specializes: Invocable}
    InputData: {display: Input Data, category: DRG elements, specializes: DRGElement}
    KnowledgeSource: {display: Knowledge Source, category: DRG elements, specializes: DRGElement, attributes: [{name: locationURI, type: anyURI, multiplicity: '0..1', section: '6.3.12 Table 18'}, {name: type, type: string, multiplicity: '0..1', section: '6.3.12 Table 18'}]}
    InformationRequirement: {display: Information Requirement, category: Requirements, specializes: DMNElement}
    KnowledgeRequirement: {display: Knowledge Requirement, category: Requirements, specializes: DMNElement}
    AuthorityRequirement: {display: Authority Requirement, category: Requirements, specializes: DMNElement}
    Artifact: {display: Artifact, category: Artifacts, abstract: true, specializes: DMNElement}
    Association: {display: Association, category: Artifacts, specializes: Artifact, attributes: [{name: associationDirection, type: AssociationDirection, default: 'None', section: '6.3.6.1 Table 8'}]}
    TextAnnotation: {display: Text Annotation, category: Artifacts, specializes: Artifact, attributes: [{name: text, type: string, section: '6.3.6.2 Table 9'}, {name: textFormat, type: string, default: text/plain, section: '6.3.6.2 Table 9'}]}
    BusinessContextElement: {display: Business Context Element, category: Business context, abstract: true, specializes: NamedElement, attributes: [{name: URI, type: anyURI, multiplicity: '0..1', section: '6.3.8 Table 11'}]}
    OrganisationalUnit: {display: Organizational Unit, category: Business context, specializes: BusinessContextElement}
    PerformanceIndicator: {display: Performance Indicator, category: Business context, specializes: BusinessContextElement}
    ItemDefinition: {display: Item Definition, category: Types and variables, specializes: NamedElement, attributes: [{name: typeRef, type: String, multiplicity: '1', note: 'The table gives bound 1; the text says an item definition may have a type reference or be composed of item components', section: '7.3.2 Table 24'}, {name: typeLanguage, type: String, multiplicity: '0..1', section: '7.3.2 Table 24'}, {name: IsCollection, type: Boolean, default: 'false', section: '7.3.2 Table 24'}]}
    InformationItem: {display: Information Item, category: Types and variables, specializes: NamedElement, attributes: [{name: typeRef, type: String, multiplicity: '1', section: '7.3.3 Table 25'}]}
    LiteralExpression: {display: Literal Expression, category: Decision logic, specializes: Expression, attributes: [{name: text, type: string, multiplicity: '0..1', section: '7.3.4 Table 26'}, {name: expressionLanguage, type: anyURI, multiplicity: '0..1', section: '7.3.4 Table 26'}]}
    Invocation: {display: Invocation, category: Decision logic, specializes: Expression}
    Binding: {display: Binding, category: Decision logic}
    Context: {display: Context, category: Decision logic, specializes: Expression}
    ContextEntry: {display: Context Entry, category: Decision logic, specializes: DMNElement}
    FunctionDefinition: {display: Function Definition, category: Decision logic, specializes: Expression, attributes: [{name: kind, type: FunctionKind, default: FEEL, section: '10.5.3 Table 74'}]}
    List: {display: List, category: Decision logic, specializes: Expression}
    Relation: {display: Relation, category: Decision logic, specializes: Expression}
    DecisionTable: {display: Decision Table, category: Decision tables, specializes: Expression, attributes: [{name: hitPolicy, type: HitPolicy, default: UNIQUE, section: '8.3.1 Table 29'}, {name: aggregation, type: BuiltinAggregator, note: Present only with the COLLECT hit policy, section: '8.3.1 Table 29'}, {name: preferredOrientation, type: DecisionTableOrientation, multiplicity: '0..1', section: '8.3.1 Table 29'}, {name: outputLabel, type: string, multiplicity: '0..1', section: '8.3.1 Table 29'}]}
    InputClause: {display: Input Clause, category: Decision tables, specializes: DMNElement}
    OutputClause: {display: Output Clause, category: Decision tables, specializes: DMNElement, attributes: [{name: typeRef, type: String, multiplicity: '1', note: The text says a single-output table does not give one, section: '8.3.2 Table 31'}, {name: name, type: string, multiplicity: '0..1', section: '8.3.2 Table 31'}]}
    RuleAnnotationClause: {display: Rule Annotation Clause, category: Decision tables, attributes: [{name: name, type: string, multiplicity: '1', section: '8.3.2 Table 32'}]}
    DecisionRule: {display: Decision Rule, category: Decision tables, specializes: DMNElement}
    RuleAnnotation: {display: Rule Annotation, category: Decision tables, attributes: [{name: text, type: string, multiplicity: '0..1', section: '8.3.3 Table 34'}]}
    ExtensionElements: {display: Extension Elements, category: Extensibility}
    ExtensionAttribute: {display: Extension Attribute, category: Extensibility, attributes: [{name: name, type: string, section: '6.3.16.2 Table 23'}]}
    DMNDI: {display: DMN Diagram Interchange, category: Diagram interchange}
    DMNDiagram: {display: DMN Diagram, category: Diagram interchange, attributes: [{name: name, type: String, default: empty string, section: '13.4.4 Table 78'}, {name: documentation, type: String, default: empty string, section: '13.4.4 Table 78'}, {name: resolution, type: Real, default: '300 user units per inch', section: '13.4.4 Table 78'}, {name: size, type: DC::Dimension, multiplicity: '0..1', section: '13.4.4 Table 78'}]}
    DMNDiagramElement: {display: DMN Diagram Element, category: Diagram interchange, abstract: true}
    DMNShape: {display: DMN Shape, category: Diagram interchange, specializes: DMNDiagramElement, attributes: [{name: bounds, type: DC::Bounds, multiplicity: '1', section: '13.4.6 Table 80'}, {name: isListedInputData, type: Boolean, multiplicity: '0..1', section: '13.4.6 Table 80'}, {name: isCollapsed, type: Boolean, multiplicity: '0..1', default: 'false', section: '13.4.6 Table 80'}]}
    DMNEdge: {display: DMN Edge, category: Diagram interchange, specializes: DMNDiagramElement, attributes: [{name: wayPoints, type: DC::Point, multiplicity: '2..*', section: '13.4.7 Table 81'}]}
    DMNDecisionServiceDividerLine: {display: DMN Decision Service Divider Line, category: Diagram interchange}
    DMNLabel: {display: DMN Label, category: Diagram interchange, attributes: [{name: bounds, type: DC::Bounds, multiplicity: '0..1', section: '13.4.8 Table 82'}, {name: text, type: String, multiplicity: '0..1', section: '13.4.8 Table 82'}]}
    DMNStyle: {display: DMN Style, category: Diagram interchange, attributes: [{name: id, type: String, multiplicity: '0..1', section: '13.4.9 Table 83'}, {name: fillColor, type: DC::Color, multiplicity: '0..1', default: white, section: '13.4.9 Table 83'}, {name: strokeColor, type: DC::Color, multiplicity: '0..1', default: black, section: '13.4.9 Table 83'}, {name: fontColor, type: DC::Color, multiplicity: '0..1', default: black, section: '13.4.9 Table 83'}, {name: fontFamily, type: String, multiplicity: '0..1', default: Arial, section: '13.4.9 Table 83'}, {name: fontSize, type: Real, multiplicity: '0..1', default: '8', section: '13.4.9 Table 83'}, {name: fontItalic, type: Boolean, multiplicity: '0..1', default: 'false', section: '13.4.9 Table 83'}, {name: fontBold, type: Boolean, multiplicity: '0..1', default: 'false', section: '13.4.9 Table 83'}, {name: fontUnderline, type: Boolean, multiplicity: '0..1', default: 'false', section: '13.4.9 Table 83'}, {name: fontStrikeThrough, type: Boolean, multiplicity: '0..1', default: 'false', section: '13.4.9 Table 83'}, {name: labelHorizontalAlignement, type: AlignmentKind, multiplicity: '0..1', note: Spelled so in the table, section: '13.4.9 Table 83'}, {name: labelVerticalAlignment, type: AlignmentKind, multiplicity: '0..1', section: '13.4.9 Table 83'}]}
  enumerations:
    HitPolicy: {values: [UNIQUE, FIRST, PRIORITY, ANY, COLLECT, RULE ORDER, OUTPUT ORDER], default: UNIQUE, indicators: {UNIQUE: U, FIRST: F, PRIORITY: P, ANY: A, COLLECT: C, RULE ORDER: R, OUTPUT ORDER: O}, section: '8.3.1; 8.2.10'}
    BuiltinAggregator: {values: [SUM, COUNT, MIN, MAX], indicators: {SUM: '+', COUNT: '#', MIN: '<', MAX: '>'}, applies_to: 'COLLECT only', section: '8.3.1; 8.2.10'}
    DecisionTableOrientation: {values: [Rule-as-Row, Rule-as-Column, CrossTable], section: '8.3.1'}
    FunctionKind: {values: [FEEL, Java, PMML], default: FEEL, section: '10.5.3'}
    AssociationDirection: {values: [None, One, Both], default: None, section: '6.3.6.1'}
  decision_table_cells:
    note: 'The parts of a decision table are the Decision Table classes above; the unary-test cell kinds are listed here for reference.'
    input_entry: 'Unary tests (a value, a list, a range, a comparison, a boolean expression using the special variable ?, or "-" for irrelevant)'
    input_values: 'Unary tests listing the expected values of an input'
    output_values: 'Unary tests listing the allowed outputs; for Priority and Output order, in decreasing priority'
    output_entry: 'A literal expression'
    section: '8.2; 8.3.3'
  feel:
    note: 'FEEL and S-FEEL are summarized for validation. The grammar (66 numbered rules; S-FEEL 38) is defined in 10.3.1.2 and 9.2 and is not reproduced.'
    s_feel: {section: 9, grammar_rules: 38, use: 'Level 2 literal expressions; default language of decision tables'}
    feel: {section: 10, grammar_rules: 66, use: 'Level 3 literal expressions; boxed expressions'}
    types: [number, string, boolean, days and time duration, years and months duration, time, date, date and time, list, context, function, Any, Null]
    literals_without_syntax: [date, time, date and time, duration]
    built_in_function_groups:
      conversion: [date, time, date and time, duration, years and months duration, number, string]
      boolean: [not]
      string: [substring, string length, upper case, lower case, substring before, substring after, replace, contains, starts with, ends with, matches, split]
      list: [list contains, count, min, max, sum, mean, all, any, sublist, append, concatenate, insert before, remove, reverse, index of, union, distinct values, flatten, product, median, stddev, mode]
      numeric: [decimal, floor, ceiling, abs, modulo, sqrt, log, exp, odd, even]
      other: [sort, get value, get entries]
    three_valued_logic: [true, false, null]
relationships:
  note: 'DMN has three requirement connectors (Information, Knowledge, Authority) and the Association, which are concepts in their own right; the metamodel links between classes are in references. The connection table (Table 2) is the permissive upper bound for requirements. Direction in references: source is the holder, target is the element referenced. In connection_tables the outer key is the required element (the spec''s From column) and the inner keys are the elements that may require it (the To column).'
  connection_tables:
    Requirements:
      source: '6.2.3, Table 2 (pp. 40-41)'
      applies_in: [DecisionRequirementsDiagram]
      orientation: 'Outer key = the required element (From). Inner map: the element that requires it (To) to the requirement kind. A pair absent from the table is not allowed. The arrow is drawn from required to requiring.'
      authority: 'The table, with its 11 pairs, is the standard''s complete statement; the type of requirement is determined by the two types.'
      cells:
        Decision: {Decision: InformationRequirement, KnowledgeSource: AuthorityRequirement}
        BusinessKnowledgeModel: {Decision: KnowledgeRequirement, BusinessKnowledgeModel: KnowledgeRequirement}
        DecisionService: {Decision: KnowledgeRequirement, BusinessKnowledgeModel: KnowledgeRequirement}
        InputData: {Decision: InformationRequirement, KnowledgeSource: AuthorityRequirement}
        KnowledgeSource: {Decision: AuthorityRequirement, BusinessKnowledgeModel: AuthorityRequirement, KnowledgeSource: AuthorityRequirement}
      pair_count: 11
      note: 'No requirement ends in Input Data. No requirement is held by a Decision Service, and no requirement is required by a Decision Service.'
  requirement_semantics:
    InformationRequirement: {holder: Decision, required: [Decision, InputData], line: 'solid, solid arrowhead', meaning: 'Output of a decision or an input data value is an input of the holder.'}
    KnowledgeRequirement: {holder: [Decision, BusinessKnowledgeModel], required: [BusinessKnowledgeModel, DecisionService], line: 'dashed, open arrowhead', meaning: 'The holder invokes the required function.'}
    AuthorityRequirement: {holder: [Decision, BusinessKnowledgeModel, KnowledgeSource], required: 'KnowledgeSource (held by any); Decision or InputData (held by a KnowledgeSource only)', line: 'dashed, filled circle head', meaning: 'The holder depends on the required element as a source of guidance or knowledge. No execution semantics.'}
