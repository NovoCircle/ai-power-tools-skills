      definition: A complete data set meaningful to a community, meeting the information requirements of a needline.
      attributes:
        - {name: "containedTransactionals", type: "Transactional", multiplicity: "0..*"}
        - {name: "identifier", type: "Transactional", multiplicity: "1"}
    SemanticAttribute:
      display: SemanticAttribute
      category: SOPES
      kind: role
      uml_base: Property
      section: 8.3.1.4
      definition: An attribute relating logical and business naming conventions.
    TransactionalAttribute:
      display: TransactionalAttribute
      category: SOPES
      kind: role
      uml_base: Property
      section: 8.3.1.4
      definition: An attribute relating logical and interim-processing naming conventions.
    Contract:
      display: Contract
      category: SOPES
      kind: relationship
      uml_base: InformationFlow
      section: 8.3.1.4
      definition: 'A specialization of operational exchange: an agreement to exchange information that realizes the information requirements of a needline or community.'
    WrapperAttribute:
      display: WrapperAttribute
      category: SOPES
      kind: role
      uml_base: Property
      section: 8.3.1.4
      definition: An attribute relating physical and logical naming conventions.
    DesignRule:
      display: DesignRule
      category: SwAF
      kind: rule
      specializes:
      - Rule
      uml_base: Constraint
      section: 8.3.1.5
      definition: A reusable solution to a design problem in a specific context, with a development status.
      attributes:
        - {name: "analysis", type: "String"}
        - {name: "consequence", type: "String"}
        - {name: "context", type: "String"}
        - {name: "date", type: "ISO8601DateTime"}
        - {name: "identifier", type: "String"}
        - {name: "metaData", type: "String"}
        - {name: "principles", type: "String", multiplicity: "*"}
        - {name: "problem", type: "String", multiplicity: "*"}
        - {name: "solution", type: "UPDMElement", multiplicity: "1..*"}
        - {name: "status", type: "DevelopmentStatus"}
        - {name: "version", type: "String"}
relationships:
  multiplicity: The standard gives no multiplicity for any relationship; each is many-to-many and optional at both ends.
  allowed: 'The allowed ends are the formal constraints of the profile. A listed concept stands for itself and all its specializations; a source or target outside the list is an error (rules UPDM-END-nnn). Relationship concepts themselves are
    in concepts.elements with kind: relationship.'
  types:
  - name: ProvidesCompetence
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - CompetenceProvider
    target:
    - Competence
    section: 8.3.1.1.4.4.18.2
  - name: RequiresCompetence
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - CompetenceRequirer
    target:
    - Competence
    section: 8.3.1.1.4.4.18.2
  - name: FillsPost
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - ActualPerson
    target:
    - ActualPost
    section: 8.3.1.1.4.4.18.1
  - name: ArbitraryConnector
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - ConceptRole
    target:
    - ConceptRole
    note: Purely visual; carries no architectural meaning.
    section: 8.3.1.1.4.4
  - name: Forecast
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - SubjectOfForecast
    target:
    - SubjectOfForecast
    note: Both ends must be the same specialization of SubjectOfForecast (Software to Software, Standard to Standard).
    section: 8.3.1.1.7.4
  - name: ArchitecturalReference
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - ArchitecturalDescription
    target:
    - ArchitecturalDescription
    section: 8.3.1.1.2.7
  - name: IsCapableOfPerforming
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - Node
    - SystemResource
    - ServiceInterface
    target:
    - OperationalActivity
    - Function
    - ServiceFunction
    note: The standard states the two end sets separately and does not pair them by kind.
    section: 8.3.1.1.2.3
  - name: Implements
    uml_base: Abstraction
    roles:
      source: client
      target: supplier
    source:
    - SystemResource
    - ResourceInteraction
    - Function
    - ServiceFunction
    target:
    - Node
    - OperationalActivity
    - OperationalExchange
    - Function
    note: Maps the solution side to the logical side; the standard states the two end sets separately and does not pair them by kind.
    section: 8.3.1.1.2.3
  - name: Details
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - EntityItem
    target:
    - ExchangeElement
    section: 8.3.1.1.8.5
  - name: MapsToCapability
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - Activity
    target:
    - Capability
    section: 8.3.1.1.6.1
  - name: Exhibits
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - CapableElement
    target:
    - Capability
    section: 8.3.1.1.6.1
  - name: OrganizationalProjectRelationship
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - ActualProject
    target:
    - ActualOrganizationalResource
    section: 8.3.1.1.1.1
  - name: ActivityPartOfProject
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - ProjectActivity
    target:
    - ActualProject
    section: 8.3.1.2.1
  - name: DesiredEffect
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - Desirer
    target:
    - DesiredState
    section: 8.3.1.2.5
  - name: Trustline
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - Node
    target:
    - Node
    note: The trusting party is the client; the level is a free value with no unit.
    section: 8.3.1.3.3.3
  - name: OwnsProcess
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - ActualOrganizationalResource
    target:
    - Process
    section: 8.3.1.3.3.1
  - name: ProjectSequence
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - ActualProject
    target:
    - ActualProject
    note: The target project cannot start until the source project has ended.
    section: 8.3.1.3.1.1
  - name: MilestoneSequence
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - ProjectMilestone
    target:
    - ProjectMilestone
    section: 8.3.1.3.1.1
  - name: SameAs
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - UPDMElement
    target:
    - any model element
    section: 8.3.1.3.2.2
  - name: Overlap
    uml_base: Dependency
    roles:
      source: client
      target: supplier
    source:
    - UPDMElement
    target:
    - any model element
    section: 8.3.1.3.2.2
  - name: ActualOrganizationRelationship
    uml_base: InformationFlow
    roles:
      source: informationSource
      target: informationTarget
    source:
    - ActualOrganizationalResource
    target:
    - ResourceInteraction
    note: The target-end rule names ResourceInteraction, which looks like a slip. Conveys an ExchangeElement.
    section: 8.3.1.1.4.4.18.1
  - name: Command
    uml_base: InformationFlow
    roles:
      source: informationSource
      target: informationTarget
    source:
    - OrganizationalResource
    target:
    - OrganizationalResource
    note: Conveys an ExchangeElement.
    section: 8.3.1.1.4.3
  - name: OperationalExchange
    uml_base: InformationFlow
    roles:
      source: informationSource
      target: informationTarget
    source:
    - Node
    target:
    - Node
    note: What it conveys depends on its exchange kind; see rules UPDM-XCH-001 to 006.
    section: 8.3.1.1.4.3
  - name: ResourceInteraction
    uml_base: InformationFlow
    roles:
      source: informationSource
      target: informationTarget
    source:
    - SystemResource
    target:
    - SystemResource
    note: Conveys ResourceInteractionItems.
    section: 8.3.1.1.7.3
  - name: Control
    uml_base: InformationFlow
    roles:
      source: informationSource
      target: informationTarget
    source:
    - OrganizationalResource
    target:
    - ResourceArtifact
    note: Conveys an ExchangeElement.
    section: 8.3.1.3.3.2
  - name: Contract
    uml_base: InformationFlow
    roles:
      source: informationSource
      target: informationTarget
    source: not constrained
    target: not constrained
    note: Ends not constrained; conveys a Semantic or a Transactional.
    section: 8.3.1.4
  - name: Needline
    uml_base: Connector
    roles:
      source: end
      target: end
    source:
    - NodeRole
    - NodePort
    target:
    - NodeRole
    - NodePort
    note: Both ends are connector ends whose role is a NodeRole or NodePort.
    section: 8.3.1.1.4.4
  - name: ResourceInterface
    uml_base: Connector
    roles:
      source: end
      target: end
    source:
    - ResourceRole
    target:
    - ResourceRole
    note: Both ends are connector ends whose role is a ResourceRole.
    section: 8.3.1.1.7.4
  - name: ResourceConnector
    uml_base: Connector
    roles:
      source: end
      target: end
    source:
    - ResourcePort
    target:
    - ResourcePort
    note: Both ends are connector ends whose role is a ResourcePort.
    section: 8.3.1.1.7.4
  - name: EntityRelationship
    uml_base: Association
    roles:
      source: end
      target: end
    source:
    - EntityItem
    target:
    - EntityItem
    section: 8.3.1.1.8.5
  - name: ActivityPerformedByPerformer
    alias_of: IsCapableOfPerforming
    ends: inherited from IsCapableOfPerforming
    section: 8.3.1.2.2.3
  - name: SkillOfPersonType
    alias_of: ProvidesCompetence
    ends: inherited from ProvidesCompetence
    section: 8.3.1.2.3.1.2
  - name: ActivityPartOfCapability
    alias_of: MapsToCapability
    ends: inherited from MapsToCapability
    section: 8.3.1.2.5
  - name: CapabilityOfPerformer
    alias_of: Exhibits
    ends: inherited from Exhibits
    section: 8.3.1.2.5
  - name: ProjectOwnership
    alias_of: OrganizationalProjectRelationship
    ends: inherited from OrganizationalProjectRelationship
    section: 8.3.1.3.1.1
  - name: AssociationOfInformation
    alias_of: EntityRelationship
    ends: inherited from EntityRelationship
    section: 8.3.1.2.7.3
  roles:
  - name: NodeRole
    uml_base: Property
    owner:
    - NodeParent
    type:
    - Node
    note: Links a parent node, problem domain or logical architecture to a sub-node.
    section: 8.3.1.1.4.4
  - name: KnownResource
    uml_base: Property
    owner:
    - NodeParent
    type:
    - SystemResource
    note: A NodeRole whose type is a system resource.
    section: 8.3.1.1.4.4
  - name: ProblemDomain
    uml_base: Property
    owner:
    - LogicalArchitecture
    type:
    - Node
    note: At most one problem domain per logical architecture (prose, not a formal constraint).
    section: 8.3.1.3.3.3
  - name: ConceptRole
    uml_base: Property
    owner:
    - HighLevelOperationalConcept
    type:
    - ConceptItem
    section: 8.3.1.1.4.4
  - name: ResourceRole
    uml_base: Property
    owner:
    - SystemResource
    type:
    - SystemResource
    note: The standard words the type rule as ResourceRole or SystemResource.
    section: 8.3.1.1.7.4
  - name: VersionOfConfiguration
    uml_base: Property
    owner:
    - WholeLifeConfiguration
    type:
    - SystemResource
    section: 8.3.1.1.7.4
  - name: TemporalPart
    uml_base: Property
    owner:
    - EnterprisePhase
    type:
    - EnterprisePhase
    note: Both phases share one spatial extent.
    section: 8.3.1.1.6.1
  - name: StructuralPart
    uml_base: Property
    owner:
    - EnterprisePhase
    type:
    - EnterprisePhase
    note: A topological part; the phases may be physically disjoint.
    section: 8.3.1.1.6.1
  - name: ProjectMilestoneRole
    uml_base: Property
    owner:
    - Project
    type:
    - ProjectMilestone
    note: The standard names Project as the owner, which is the alias of ActualProject; ProjectType is meant.
    section: 8.3.1.1.1.1
  - name: ProtocolLayer
    uml_base: Property
    owner:
    - Protocol
    type:
    - Protocol
    note: Upper layer uses lower layer.
    section: 8.3.1.3.5
  - name: EnvironmentProperty
    uml_base: Property
    owner:
    - Environment
    type:
    - ConditionType
    section: 8.3.1.1.2.4
  - name: ConditionProperty
    uml_base: Property
    owner:
    - Condition
    type:
    - ConditionType
    note: Alias of EnvironmentProperty; type inherited.
    section: 8.3.1.2.2.4
  - name: CapabilityProperty
    uml_base: Property
    owner:
    - Capability
    type:
    - Capability
    section: 8.3.1.1.6.1
  - name: EntityAttribute
    uml_base: Property
    owner:
    - EntityItem
    type: not constrained
    note: Applies only to properties owned by an EntityItem.
    section: 8.3.1.1.8.5
  - name: ProjectTheme
    uml_base: Property
    owner:
    - ProjectMilestone
    type:
    - StatusIndicators
    section: 8.3.1.3.1.2
  - name: ActualOrganizationRole
    uml_base: Slot
    owner:
    - ActualOrganization
    type:
    - ResourceRole
    note: 'Instance slot: owningInstance is the ActualOrganization, definingFeature a ResourceRole.'
    section: 8.3.1.1.4.4.18.1
  - name: ActualProjectMilestoneRole
    uml_base: Slot
    owner:
    - ActualProject
    type:
    - ProjectMilestoneRole
    note: Instance slot.
    section: 8.3.1.1.1.1
  - name: ActualProperty
    uml_base: Slot
    owner:
    - PropertySet
    type:
    - Property
    note: Instance slot; the standard names PropertySet as the owner, ActualPropertySet is meant.
    section: 8.3.1.1.2.5
  - name: ActualMeasurement
    uml_base: Slot
    owner:
    - PropertySet
    type:
    - Measurement
    note: Instance slot; owner inherited from ActualProperty.
    section: 8.3.1.1.2.5
  - name: ProjectStatus
    uml_base: Slot
    owner:
    - ActualProjectMilestone
    type:
    - ProjectTheme
    note: Instance slot of an ActualProjectMilestone.
    section: 8.3.1.3.1.2
  - name: ServiceLevelValue
    uml_base: Slot
    owner:
    - ServiceLevelValueSet
    type:
    - ServiceAttribute
    note: Instance slot of a ServiceLevelValueSet.
    section: 8.3.1.1.5.2
