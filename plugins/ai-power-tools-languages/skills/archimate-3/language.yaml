  junction:
    rule: A junction joins relationships of one type. It accepts access, assignment, flow, influence, association, realization, triggering and serving. It does not accept composition, aggregation or specialization. A chain through junctions is valid only if the direct relationship between the end elements would be valid.
    allowed_letters: "afinortv"
    section: 5.5.1; B.6
  special_ends:
    # Appendix B.6: relationships involving grouping, location, plateau, other relationships and junctions. Keys: target kind, then source kind.
    Grouping: {Grouping: any, PlateauOrLocation: 'c, g, plus any relationship the source element can have', OtherElement: 'any, provided the element can be a source', Relationship: o, Junction: 'a, f, i, n, o, r, t, v, provided the target is possible'}
    OtherElement: {Grouping: 'any, provided the element can be a target', PlateauOrLocation: see the allowed table, OtherElement: see the allowed table, Relationship: o, Junction: 'a, f, i, n, o, r, t, v, provided the target is possible'}
    Relationship: {Grouping: 'c, g, o', PlateauOrLocation: 'c, g, o', OtherElement: o, Relationship: none, Junction: o}
    Junction: {Grouping: 'a, f, i, n, o, r, t, v', PlateauOrLocation: 'a, f, i, n, o, r, t, v, provided the element can be a source', OtherElement: 'a, f, i, n, o, r, t, v, provided the element can be a source', Relationship: o, Junction: 'a, f, i, n, o, r, t, v'}
    section: B.6
derivation:
  section: B.1 to B.4
  strength_order:
    structural: [Realization, Assignment, Aggregation, Composition]   # weakest to strongest
    dependency: [Association, Influence, Access, Serving]             # weakest to strongest
  valid:
    - {id: DR1, statement: Specialization is transitive.}
    - {id: DR2, statement: Two structural relationships in a chain can be replaced by the weaker of the two.}
    - {id: DR3, statement: A structural relationship followed by a dependency relationship yields that dependency from the first source to the last target.}
    - {id: DR4, statement: A structural relationship and a dependency relationship that share a target yield the dependency from the dependency source to the structural source.}
    - {id: DR5, statement: A structural relationship followed by a dynamic relationship yields the dynamic relationship.}
    - {id: DR6, statement: A flow with a structural relationship at the shared target can be moved to the structural source.}
    - {id: DR7, statement: A triggering relationship followed by a structural relationship yields the triggering relationship to the final target.}
    - {id: DR8, statement: Triggering is transitive.}
  potential:   # likelihood varies and the result may be wrong in a given model
    - {id: PDR1-4, statement: 'Relationships to or from a generalized element may carry to the specialized element and the reverse, in the four positions of a specialization combined with another relationship.'}
    - {id: PDR5-6, statement: 'A structural and a dependency relationship that meet at the structural source, or share a source, may yield the dependency to the structural target.'}
    - {id: PDR7, statement: Two dependency relationships in a chain may yield the weaker of the two.}
    - {id: PDR8-9, statement: 'A flow followed by a structural relationship, or a structural and a dynamic relationship from the same source, may yield a flow or dynamic relationship.'}
    - {id: PDR10, statement: Flow is potentially transitive.}
    - {id: PDR11, statement: A triggering and a structural relationship that share a target may yield the triggering from the first source to the structural source.}
