quick_links:
  status: read on screen, measured on EA 17.1 build 1716, 2026-11-04; two sources
  from_an_FMEAItem: the menu lists 36 target element types; the submenus opened (FailureMode, Fault, Situation, FMEAItem) offer
    only 'Aggregation to Whole' and 'Aggregation to Part', and RPNCalculation only 'Aggregation to Part'. No Cause, FailureMode,
    input or output quick link is offered
  from_an_AND_gate: no entry except 'Create Multiple Elements...'
tags_of_note:
  TopEvent: a tagged value of FTATree that names the tree's top event (empty until set); the TopEvent stereotype itself has the
    tagged value Probability, the only fault tree element with one
  result: on Verified and Confirmed, empty until set
  ASIL, ASILOverride: on ASILAssignment, empty until set
  ID: on `ID carrier`, empty until set
  isEncapsulated: on every Class stereotype (true/false); inherited from the Class form, not a RAAML tag
  affects, sourcePropertyPath, targetPropertyPath, sourceContext, targetContext: on the controlling measures (affects) and RelevantTo
    (the path and context tags)
  quantityKind, unit: on the value types (Exposure, Severity, Controllability, Occurence, Detectability, RPN and the Premitigation
    and PreviousRPN types)
conventions:
  ports_need_a_parent: 'cause, failureMode, finalEffect and harmPotential are Port stereotypes: a Port cannot be created in a package;
    create it as a child of the FMEA item (ParentID)'
  fmea_connectors: 'Cause and FailureMode are Association stereotypes; there is no finalEffect or harmPotential connector, only
    the Port. Sparx''s FMEA pattern draws the cause, failure mode and effect class as the connector''s source and the FMEA item
    as its target (read again on screen, EA 17.1 build 1716, 2026-11-04: Association, no stereotype, direction unspecified)'
  gate_connectors: 'input, output and condition are Association stereotypes for a gate''s events. Sparx''s FTA Pattern (toolbox,
    dropped on a diagram on EA 17.1 build 1716, 2026-11-04) shows the wiring: an input runs from the event (source) to the gate
    (target) and the output runs from the gate (source) to the top event (target), both as plain Associations with direction Source
    -> Destination and no stereotype, so neither carries the input or output stereotype'
  second_stereotype: ID carrier, ASILAssignment, Undeveloped and the GSN and context stereotypes can sit on an element as a second
    stereotype; the validator sees only the first
  case: 'match case exactly in a selector: Situation (not situation), FailureMode, ID carrier, MAJORITY VOTE'
  no_generalization_stereotype: generalizations (the standard's main structure) carry no stereotype, so a stereotype selector never
    sees them; a rule selects them by EA connector type (Generalization) and can count the ones going out of a class, but it cannot
    follow one to the class it leads to
harvest:
  shipped-xml: not available (encrypted internal technology, InternalTechnologies\raaml.xml)
  sample-content:
  - stored metaclass (Object_Type) per stereotype and per extra metaclass, binding (t_xref FQName), tagged values with Values and
    Default notes, Port and Part forms, connector types, diagram types (t_diagram, StyleEx MDGDgm)
  binding-matrix: every name set with StereotypeEx on 26 element types, on attributes, operations and parameters, and on 20 connector
    types; GATE and HazardAndRiskAssessment on 68 element types, 29 connector types, packages and diagrams
  ui: 'the Resources tab (read 2026-10-20) gives 121 names and 154 rows; the metaclass per row was not recorded there.
    Measured on EA 17.1 build 1716, 2026-11-04: the profile rows matched the stored row list name for name; Diagram Types lists
    eight types; toolboxes, a fault tree diagram and two quick-link sources were read (see toolbox and quick_links). Not done:
    the FMEA, STPA, GSN and ISO 26262 diagram types were not created or opened.'
  ea_build: 17.1 build 1716

# EA's names for this language's layout. tools/gen_conventions.py reads layout_map.
layout_map:
  technology: RAAML1.0
  display_name: RAAML
  extends: UML
  stereotype_prefix: ''
  notes: |
    Five of the eight diagram types ea.yaml lists are bound, the five whose token was created and read back. Sparx's FMEA and fault tree patterns both use RAAML::RAAML, so it takes the fault tree's arrangement, and an FMEA drawn on it does too.

    NOT BOUND, TOKEN NOT MEASURED. Failure Mode and Effect Analysis, Fault Tree Analysis, and ISO 26262 Road Vehicles - Functional Safety are listed by EA, and their stored tokens were not read.

    `RAAML1.0` is the id EA reports, measured on EA 17.1 build 1716.
  diagram_types:
    RAAML:
      token: RAAML::RAAML
      guide: fault tree
      base: Logical
      size_keys:
        BasicEvent: BasicEvent
        UndevelopedEvent: UndevelopedEvent
