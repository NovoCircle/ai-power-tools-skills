    ActualPropertySet: {shape: "note symbol (rectangle with a folded upper-right corner) joined to the element it describes by a dashed line", marker: "none", label: "first line the set name in bold, second line a keyword in guillemets and the intent such as Required Values", section: "Annex D, Figure D.8"}
    OperationalActivityAction: {shape: "rounded rectangle", marker: "a small rake symbol at the lower right, inside", label: "the name inside, written with a colon before it", section: "Annex D, Figure D.21"}
    OperationalParameter: {shape: "small square on the border of the action it belongs to, or a small labeled rectangle on the border of the activity frame", marker: "none", label: "the parameter name beside or inside it", section: "Annex D, Figure D.21"}
    NodeOperation: {shape: "line of text in the operations compartment of the node's box", marker: "none", label: "name ( parameters ), for example Search ()", section: "Annex D, Figure D.15"}
