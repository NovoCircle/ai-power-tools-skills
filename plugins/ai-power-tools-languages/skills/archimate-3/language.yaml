# ArchiMate 3.1 language file (schema_version 1).
# Written from the standard only. Concept names are the standard's own type names without spaces.
# Tool-neutral: no tool facts live here. Link marks: `inferred: true` means the link or the concept is
# our reconstruction from headings and the exchange schema, not a sentence of the specification.
schema_version: 1
id: archimate-3
name: ArchiMate
owner: {name: The Open Group, kind: standards-body}
standard:
  name: ArchiMate Specification
  version: '3.1'
  status: published
  reference: The Open Group, ArchiMate 3.1 Specification (document C197, published 5 November 2019), online edition https://pubs.opengroup.org/architecture/archimate31-doc/, read from archived copies of its pages; the open 3.1 model exchange schema (archimate3_Model.xsd, revision 15 July 2019) for the element and relationship type lists. The Appendix B.5 relationship tables are images in the online edition; the allowed table in this file is a third-party capture, the Archi modeling tool's 3.1 relationship table (repository archimatetool/archi, commit 9ba0559, version="3.1"), checked against the specification images for about 30 cells across three of the ten pages with no mismatch. It is not the specification.
concepts:
  source: 'ArchiMate 3.1: the generic metamodel (chapters 3 and 4), motivation (6), strategy (7), business (8), application (9), technology (10), physical (11), implementation and migration (13), with the relationship chapter (5). 60 concrete element types (58 element types in the exchange schema, of which Product and Plateau are also composites, plus the two generic composites Grouping and Location), 11 relationship types and one connector. Abstract concepts are the standard''s generic and layer-level parents; those the text does not state are marked inferred.'
  groups:
    Generic metamodel: {defined_by: Chapters 3 and 4, notes: Abstract parents shared by every layer. Not instantiated in models.}
    Generic composites: {defined_by: Section 4.5, notes: 'Grouping and Location, which sit beside the layers.'}
    Motivation: {defined_by: Chapter 6, diagram_type: Motivation}
    Strategy: {defined_by: Chapter 7, diagram_type: Strategy}
    Business: {defined_by: Chapter 8, diagram_type: Business Layer}
    Application: {defined_by: Chapter 9, diagram_type: Application Layer}
    Technology: {defined_by: Chapter 10, diagram_type: Technology Layer}
    Physical: {defined_by: Chapter 11, diagram_type: Physical}
    Implementation and Migration: {defined_by: Chapter 13, diagram_type: Implementation and Migration}
