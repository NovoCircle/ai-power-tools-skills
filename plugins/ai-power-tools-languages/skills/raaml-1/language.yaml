data_types:
  coverage: partial
  section: "9.7.1 pp. 93-94; 9.4.1 p. 49; 9.1.2 p. 24"
  note: "RAAML defines four small value types for ISO 26262 (exposure, severity, controllability, ASIL) and one restricted real for house events; every other attribute is typed with Real, Integer or String from the SysML libraries, and the standard leaves some attributes untyped on purpose so each method can type them."
  inherits_from: sysml-1
  types:
    - {name: Exposure, kind: enumeration, values: [E0, E1, E2, E3, E4], section: "9.7.1 p. 93", note: "Likelihood of being in an operational situation. A rationale must be attached to the exposure of an operational situation (rule RAAML-ISO-001)."}
    - {name: Severity, kind: enumeration, values: [S0, S1, S2, S3], section: "9.7.1 p. 93", note: "Extent of harm of an automotive effect. A rationale must be attached (RAAML-ISO-002)."}
    - {name: Controllability, kind: enumeration, values: [C0, C1, C2, C3], section: "9.7.1 p. 94", note: "Ability to avoid harm through timely reactions, held by an accident scenario. A rationale must be attached (RAAML-ISO-003)."}
    - {name: ASIL, kind: enumeration, values: [no assignment, QM, A, B, C, D, A(B), A(C), A(D), B(C), B(D), C(D), A(A), B(B), C(C), D(D), QM(A), QM(B), QM(C), QM(D)], section: "9.7.1 p. 94 (Figure 9.129)", note: "Twenty literals: no assignment, the plain levels QM and A to D, and the decomposed forms written level(level). Used for the hazardous event score, the safety requirement template and the ASIL assignment."}
    - {name: HouseEventProbability, kind: other, section: "9.4.1 p. 49", note: "A restriction of Real for the probability of a house event, which is 0 or 1 (rule RAAML-VAL-002). The standard lists no literals for it."}
    - {name: time, kind: other, section: "9.7.1 pp. 99-100", note: "The type the standard names for the fault tolerant time interval (FTTI) of a safety requirement template. The standard does not define it in this clause."}
  attributes:
    coverage: some_concepts
    where: concepts
    note: "Concept entries whose attributes the standard lists carry them under `attributes` as name, type, multiplicity and a note. Probabilities of fault tree elements are Real values from 0 to 1 (9.4.1 p. 45). The abstract classes of clause 9.2.1 declare untyped placeholder attributes that method classes type."
notation:
  coverage: normative
  section: "9.4.2 pp. 56-69; 9.6.1 pp. 81-88; 7.3 pp. 11-16; 9.3.1 p. 39 (Figure 9.34)"
  note: "The standard gives its own symbols only to the fault tree events and gates (9.4.2) and to the goal structuring nodes (9.6.1); every other concept is a block drawn with its marker shown as a keyword, and relationships between situations are drawn as associations or dependencies. The symbols below were read from the standard's figures; the standard states no sizes or colors."
  inherits_from: sysml-1
  default:
    shape: "a SysML block box as the sysml-1 guide draws it: a rectangle whose top compartment holds the marker name in guillemets, for example «FailureMode» or «Situation», above the bold class name (the name is also shown in italics for the abstract classes in the standard's figures); further compartments, each headed in small italics (parts, values, constraints), list the attributes as name : Type [multiplicity] with a {subsets x} or {redefines x} note"
    line: "a solid line for an association or part relationship, with the role name and the multiplicity at each end and any {subsets x} or {redefines x} note beside the line; a part (composition) relationship, named Owner.role in this file, has a filled diamond at the owning end; a generalization is a line with a hollow triangle at the general class"
    section: "7.3 pp. 11-16; 9.3.1 p. 39 (Figure 9.34); 9.2.1 pp. 30-31 (Figures 9.18, 9.19)"
  display_forms: "A marker that carries an icon may be shown as the icon with the element name below it, or as a box with the icon at its upper left (the UML icon presentation); the preferred form uses the icon as the resizable outline of the box, with the usual compartments inside. The standard describes these forms under the goal structuring notation (9.6.1 p. 82, Figure 9.105) and says the fault tree event and gate markers carry icons (9.4.2); it does not repeat the forms for the fault tree."
  elements:
    Tree: {shape: "the block box with the keyword «Tree» above the bold name", marker: "no icon; the standard shows only a stereotype box", label: "keyword, then name", section: "9.4.2 p. 56 (Figure 9.62)"}
    Event: {shape: "the block box with the keyword «Event» above the italic name; the abstract marker has no icon of its own", marker: "none", label: "keyword, then name", section: "9.4.2 p. 57 (Figure 9.64)"}
    Gate: {shape: "the block box with the keyword «Gate» above the italic name; the abstract marker has no icon of its own", marker: "none", label: "keyword, then name", section: "9.4.2 p. 57 (Figure 9.63)"}
    BasicEvent: {shape: "a circle with a plain outline and nothing inside", marker: "none", label: "the keyword «BasicEvent» and the name below the circle", section: "9.4.2 p. 59 (Figure 9.66)"}
    ConditionalEvent: {shape: "an ellipse, wider than it is tall, with a plain outline and nothing inside", marker: "none", label: "the keyword «ConditionalEvent» and the name below the ellipse", section: "9.4.2 p. 60 (Figure 9.67)"}
    DormantEvent: {shape: "a diamond (a square turned on its corner) drawn twice, one outline inside the other, so the symbol has a double outline", marker: "none", label: "the keyword «DormantEvent» and the name below the diamond", section: "9.4.2 p. 58 (Figure 9.65)"}
    HouseEvent: {shape: "a house outline: a square lower part with a pointed roof, a plain outline and nothing inside", marker: "none", label: "the keyword «HouseEvent» and the name below the symbol", section: "9.4.2 p. 61 (Figure 9.69)"}
    ZeroEvent: {shape: "the house outline of the house event with one straight diagonal line across the square part, from the upper left corner (where the roof meets the wall) down to the lower right corner", marker: "none", label: "the keyword «ZeroEvent» and the name below the symbol", section: "9.4.2 p. 60 (Figure 9.68)"}
    IntermediateEvent: {shape: "the block box with the keyword «IntermediateEvent» above the bold name", marker: "no icon; the standard shows only a stereotype box", label: "keyword, then name", section: "9.4.2 p. 67 (Figure 9.77)"}
    TopEvent: {shape: "the block box with the keyword «TopEvent» above the bold name", marker: "no icon; the standard shows only a stereotype box", label: "keyword, then name", section: "9.4.2 p. 68 (Figure 9.78)"}
    UndevelopedEvent: {shape: "the circle of a basic event; the standard shows no separate figure for a basic event that also carries the Undeveloped marker", marker: "none stated for the combination", label: "keywords «BasicEvent» and «Undeveloped»", section: "9.4.2 p. 59 (BasicEvent constraint 2); 9.2.2 p. 38"}
    AND: {shape: "a gate outline with a flat bottom edge and a rounded arch on top; two short input lines leave the bottom edge and one short output line leaves the top of the arch", marker: "none", label: "the keyword «AND» and the name below the symbol", section: "9.4.2 p. 62 (Figure 9.70)"}
    OR: {shape: "a gate outline with a pointed top, curved sides that meet at the point and a curved (concave) bottom edge; input lines leave the bottom and one output line leaves the point", marker: "none", label: "the keyword «OR» and the name below the symbol", section: "9.4.2 p. 63 (Figure 9.71)"}
    SEQ: {shape: "the AND gate outline with a triangle drawn inside it, its point at the top and its base on the bottom edge of the gate", marker: "none", label: "the keyword «SEQ» and the name below the symbol", section: "9.4.2 p. 63 (Figure 9.72)"}
    XOR: {shape: "the OR gate outline with a second pointed arch drawn inside it, so the symbol shows two nested arches with their feet on the bottom edge", marker: "none", label: "the keyword «XOR» and the name below the symbol", section: "9.4.2 p. 64 (Figure 9.73)"}
    INHIBIT: {shape: "a hexagon with one short line leaving the top, one leaving the bottom and one leaving the right side", marker: "none", label: "the keyword «INHIBIT» and the name below the symbol", section: "9.4.2 p. 65 (Figure 9.74)"}
    MAJORITY_VOTE: {shape: "a gate outline with a rounded arch on top and a slightly curved bottom edge", marker: "the lowercase letter m inside the outline", label: "the keyword «MAJORITY_VOTE» and the name below the symbol", section: "9.4.2 p. 66 (Figure 9.75)"}
    NOT: {shape: "two triangles that meet point to point, one above the other, so the symbol looks like an hourglass", marker: "none", label: "the keyword «NOT» and the name below the symbol", section: "9.4.2 p. 66 (Figure 9.76)"}
    TransferIn: {shape: "a triangle with its point at the top and a plain outline, nothing inside", marker: "none", label: "the keyword «TransferIn» and the name below the triangle", section: "9.4.2 p. 68 (Figure 9.79)"}
    TransferOut: {shape: "the block box with the keyword «TransferOut» above the bold name, joined to the Tree box by a generalization line", marker: "no icon; the standard shows only a stereotype box", label: "keyword, then name", section: "9.4.2 p. 69 (Figure 9.80)"}
    RPNCalculation: {ref: "sysml-1 ConstraintBlock; the standard's figures give the FMEA formula block no symbol of its own", section: "9.3.1 p. 40"}
    ANDConstraintBlock: {ref: "sysml-1 ConstraintBlock; no symbol of its own", section: "9.4.1 (ConstraintBlocks) p. 53"}
    ORConstraintBlock: {ref: "sysml-1 ConstraintBlock; no symbol of its own", section: "9.4.1 (ConstraintBlocks) p. 54"}
    SEQConstraintBlock: {ref: "sysml-1 ConstraintBlock; no symbol of its own", section: "9.4.1 (ConstraintBlocks) p. 54"}
    XORConstraintBlock: {ref: "sysml-1 ConstraintBlock; no symbol of its own", section: "9.4.1 (ConstraintBlocks) p. 55"}
    INHIBITConstraintBlock: {ref: "sysml-1 ConstraintBlock; no symbol of its own", section: "9.4.1 (ConstraintBlocks) p. 55"}
    MAJORITY_VOTEConstraintBlock: {ref: "sysml-1 ConstraintBlock; no symbol of its own", section: "9.4.1 (ConstraintBlocks) p. 56"}
    NOTConstraintBlock: {ref: "sysml-1 ConstraintBlock; no symbol of its own", section: "9.4.1 (ConstraintBlocks) p. 56"}
    Controller: {shape: "the block box with the keyword «Controller» above the bold name; the marker applies to a class or a property", marker: "no icon; the standard shows only a stereotype box", label: "keyword, then name", section: "9.5.2 p. 80 (Figure 9.102)"}
    Actuator: {shape: "the block box with the keyword «Actuator» above the bold name; the marker applies to a class or a property", marker: "no icon; the standard shows only a stereotype box", label: "keyword, then name", section: "9.5.2 p. 80 (Figure 9.100)"}
    Sensor: {shape: "the block box with the keyword «Sensor» above the bold name; the marker applies to a class or a property", marker: "no icon; the standard shows only a stereotype box", label: "keyword, then name", section: "9.5.2 p. 80 (Figure 9.101)"}
    ControlledProcess: {shape: "the block box with the keyword «ControlledProcess» above the bold name; the marker applies to a class or a property", marker: "no icon; the standard shows only a stereotype box", label: "keyword, then name", section: "9.5.2 p. 79 (Figure 9.99)"}
    Feedback: {shape: "the box with the keyword «Feedback» above the bold name; the marker applies to a signal, a data type or a class", marker: "no icon; the standard shows only a stereotype box", label: "keyword, then name", section: "9.5.2 p. 79 (Figure 9.97)"}
    UnsafeControlAction: {shape: "the block box with the keyword «UnsafeControlAction» above the bold name", marker: "no icon; the standard shows only a stereotype box", label: "keyword, then name", section: "9.5.2 p. 79 (Figure 9.98)"}
    GSNNode: {shape: "the box with the keyword «GSNNode» above the italic name (abstract)", marker: "none", label: "keyword, then name", section: "9.6.1 p. 82"}
    GSNArgumentNode: {shape: "the box with the keyword «GSNArgumentNode» above the italic name (abstract)", marker: "none", label: "keyword, then name", section: "9.6.1 p. 84 (Figure 9.111)"}
    Goal: {shape: "a rectangle", marker: "in the box form, a small rectangle icon at the upper right of the box beside the keyword «Goal»", label: "the identifier (for example G1) and the name inside the rectangle", section: "9.6.1 p. 84 (Figure 9.111); p. 82 (Figures 9.105 to 9.107)"}
    Strategy: {shape: "a parallelogram that leans to the right", marker: "in the box form, a small parallelogram icon at the upper right of the box beside the keyword «Strategy»", label: "the identifier (for example S1) above the name inside the parallelogram", section: "9.6.1 p. 82 (Figure 9.106); p. 85 (Figure 9.112)"}
    Solution: {shape: "a circle", marker: "in the box form, a small circle icon at the upper right of the box beside the keyword «Solution»", label: "the identifier and the name inside the circle", section: "9.6.1 p. 84 (Figure 9.110)"}
    ContextualInformation: {shape: "the box with the keyword «ContextualInformation» above the italic name (abstract)", marker: "none", label: "keyword, then name", section: "9.6.1 p. 85 (Figure 9.113)"}
    Context: {shape: "a rectangle with rounded corners, wider than it is tall", marker: "in the box form, a small rounded-rectangle icon at the upper right of the box beside the keyword «Context»", label: "the identifier and the name inside the symbol", section: "9.6.1 p. 85 (Figure 9.114)"}
    Assumption: {shape: "an ellipse", marker: "in the box form, a small ellipse icon with a small mark at its lower edge at the upper right of the box beside the keyword «Assumption»", label: "the identifier and the name inside the ellipse", section: "9.6.1 p. 86 (Figure 9.115)"}
    Justification: {shape: "an ellipse", marker: "in the box form, a small ellipse icon with a small mark at its lower edge at the upper right of the box beside the keyword «Justification»", label: "the identifier and the name inside the ellipse", section: "9.6.1 p. 86 (Figure 9.116)"}
    Undeveloped: {shape: "a small hollow diamond centered under the bottom edge of the goal or strategy symbol it is combined with", marker: "none", label: "none; the figure shows the name Undeveloped Goal inside the rectangle", section: "9.6.1 p. 82 (Figure 9.107); 9.2.2 p. 38"}
    Exposure: {shape: "a value type box: a compartment with the keyword «valueType» above the bold name, then a compartment listing the literals one per line", marker: "none", label: "the literals E0 to E4", section: "9.7.1 p. 93"}
    Severity: {shape: "a value type box: a compartment with the keyword «valueType» above the bold name, then a compartment listing the literals one per line", marker: "none", label: "the literals S0 to S3", section: "9.7.1 p. 93"}
    Controllability: {shape: "a value type box: a compartment with the keyword «valueType» above the bold name, then a compartment listing the literals one per line", marker: "none", label: "the literals C0 to C3", section: "9.7.1 p. 94"}
    ASIL: {shape: "a value type box: a compartment with the keyword «valueType» above the bold name, then a compartment listing the twenty literals one per line, in the order no assignment, QM, A, B, C, D, A(B), A(C), A(D), B(C), B(D), C(D), A(A), B(B), C(C), D(D), QM(A), QM(B), QM(C), QM(D)", marker: "none", label: "the literals", section: "9.7.1 p. 94 (Figure 9.129)"}
  relationships:
    Causality: {line: "a solid association line between two situation boxes, with the role names from and to and the multiplicity at the ends", target_end: "not shown in the figures read", source_end: "none", label: "the association name beside the line", section: "9.1.1 p. 21"}
    ErrorPropagation: {line: "a solid association line whose two ends both sit on the dysfunctional event box (the figure routes the line as a rectangle out of the box and back, because both ends are that class), with the role names fromError and toError, the multiplicity 0..* and the notes {redefines from} and {redefines to}", target_end: "not shown in the figures read", source_end: "none", label: "the association name ErrorPropagation beside the line", section: "9.2.1 p. 31 (Figure 9.18)"}
    ErrorRealization: {line: "a solid association line between dysfunctional event boxes, with the role names error and failure, the multiplicity 0..* and the notes {redefines from} and {redefines to}", target_end: "not shown in the figures read", source_end: "none", label: "the association name ErrorRealization beside the line", section: "9.2.1 p. 31 (Figure 9.19)"}
    Activation: {line: "a solid association line between two boxes, the abstract cause box at one end and the dysfunctional event box at the other, with the association name Activation above the line; the cause end carries the role name fault, the multiplicity 0..* and the note {redefines from}, and the event end carries the role name error, the multiplicity 0..* and the note {redefines to}", target_end: "not shown in the figure", source_end: "none", label: "the association name Activation beside the line", section: "9.2.1 p. 30 (Figure 9.17)"}
    RelevantTo: {line: "the dependency line of sysml-1 (dashed, open arrowhead at the supplier); the standard shows only the extended Dependency in its figure and gives no separate line", target_end: "open arrowhead at the supplier, as for a dependency", source_end: "none", label: "the keyword «RelevantTo» on the line", section: "9.1.2 p. 22"}
    Violates: {line: "the dependency line of sysml-1 (dashed, open arrowhead at the supplier); the standard shows only the extended Dependency in its figure and gives no separate line", target_end: "open arrowhead at the supplier, as for a dependency", source_end: "none", label: "the keyword «Violates» on the line", section: "9.1.2 p. 24 (Figure 9.7)"}
    ControllingMeasure: {line: "the dependency line of sysml-1 (dashed, open arrowhead at the supplier), running from the measure to the situation it addresses; no separate line is given", target_end: "open arrowhead at the situation", source_end: "none", label: "the keyword «ControllingMeasure» on the line", section: "9.1.2 p. 23"}
    Detection: {same_as: ControllingMeasure, section: "9.1.2 p. 23"}
    Prevention: {same_as: ControllingMeasure, section: "9.1.2 p. 23"}
    Mitigation: {same_as: ControllingMeasure, section: "9.1.2 p. 23"}
    Recommendation: {same_as: ControllingMeasure, section: "9.1.2 p. 23"}
    InContextOf: {line: "the dependency line of sysml-1 (dashed, open arrowhead at the supplier), from a goal or strategy to a context, assumption or justification; the profile figure shows a small link icon in the keyword box and no separate line", target_end: "open arrowhead at the contextual element, as for a dependency", source_end: "none", label: "the keyword «InContextOf» on the line", section: "9.6.1 p. 87 (Figure 9.117)"}
    SupportedBy: {line: "the dependency line of sysml-1 (dashed, open arrowhead at the supplier), from a goal or strategy to a goal, strategy or solution; the profile figure shows a small link icon in the keyword box and no separate line", target_end: "open arrowhead at the supporting element, as for a dependency", source_end: "none", label: "the keyword «SupportedBy» on the line", section: "9.6.1 p. 88 (Figure 9.118)"}
    IndependenceRequirement: {ref: "sysml-1 DeriveReqt; the standard gives it no separate line", section: "9.7.2 p. 104"}
    ASILDecompose: {ref: "sysml-1 DeriveReqt; the standard gives it no separate line", section: "9.7.2 p. 105"}
    UserInfoRequirement: {ref: "sysml-1 Satisfy; the standard gives it no separate line", section: "9.7.2 p. 106"}
    RecoveryRequirement: {ref: "sysml-1 Satisfy; the standard gives it no separate line", section: "9.7.2 p. 106"}
  not_specified: [SafeState, OperatingMode, RiskRealization, ProcessModelFactor, ProcessModelConsequence, UnsafeControlActionHarmPotential, Verified, Confirmed, HazardAndRiskAssessment, LessonLearned, ASILAssignment, ASILOverrideRationale]
constraints:
- {id: RAAML-SIT-001, statement: 'Every situation specializes AnySituation, directly or through intermediate situations. AnySituation is the universal root of all situations.', strength: should, section: '9.1.1, p. 20; 7.3, p. 12', checkable: partial, category: SIT}
- {id: RAAML-SIT-002, statement: A situation is modeled as a block. The steps of a scenario are composite part properties typed by sub-situations. Attribute values of a situation are value properties whose type describes the possible values and whose default value holds the value., strength: should, section: '7.3, p. 12', checkable: partial, category: SIT}
- {id: RAAML-SIT-003, statement: A user situation that inherits from a library situation redefines or subsets the properties of the library situation., strength: should, section: '7.3, p. 12', checkable: partial, category: SIT}
- {id: RAAML-SIT-004, statement: A redefining property has a type that is narrower than (a specialization of) the type of the property it redefines. The normal rules of property redefinition apply., strength: must, section: '7.3.1 item c, p. 13', checkable: static, category: SIT}
- {id: RAAML-SIT-005, statement: Properties a user adds beyond those the library defines are user-specific extensions and are not part of this language., strength: note, section: '7.3, p. 12', checkable: none, category: SIT}
- {id: RAAML-SIT-006, statement: Generalization between two situations means the occurrences of the specific situation are a subset of the occurrences of the general one., strength: note, section: '9.1, p. 19', checkable: none, category: SIT}
- {id: RAAML-SIT-007, statement: 'The steps of a scenario have a causal ordering, shown by Causality relationships or specializations of them.', strength: should, section: '9.2.1 (Scenario), p. 32', checkable: partial, category: SIT}
- {id: RAAML-SIT-008, statement: 'A situation may omit any parameter it need not be specific about. Whether to model a composite situation with sub-situations or a single situation is the modeler''s choice, depending on the depth of analysis.', strength: note, section: '9.1, pp. 19-20', checkable: none, category: SIT}
- {id: RAAML-SIT-009, statement: The names of subsetting properties are not regulated. A scheme of parent property name plus a number is strongly recommended., strength: note, section: '7.3.1 item e, p. 13', checkable: none, category: SIT}
- {id: RAAML-SIT-010, statement: 'Quantitative attributes of a situation, such as probability of occurrence, are value properties; formulas that relate attributes to each other and to system attributes are constraint blocks and may be written in any language the tool can compute.', strength: note, section: '9.1, Table 9.1, pp. 19-20', checkable: none, category: SIT}
- {id: RAAML-REL-001, statement: The client of a RelevantTo relationship is a Situation., strength: must, section: '9.1.2 (RelevantTo) [1], p. 23', checkable: static, category: REL}
- {id: RAAML-REL-002, statement: 'The supplier of a ControllingMeasure relationship (and of its kinds Detection, Prevention, Mitigation and Recommendation) is a Situation.', strength: must, section: '9.1.2 (ControllingMeasure) [1], p. 23', checkable: static, category: REL}
- {id: RAAML-REL-003, statement: The client of a Violates relationship is a Situation., strength: must, section: '9.1.2 (Violates) [1], p. 24', checkable: static, category: REL}
- {id: RAAML-REL-004, statement: 'Violates connects a situation to a requirement, design constraint or any element that prescribes a characteristic of the system. RelevantTo connects a situation to the system-model element that gives it context.', strength: note, section: '9.1.2, pp. 22-23', checkable: none, category: REL}
- {id: RAAML-REL-005, statement: 'Every Causality relationship, and every specialization of it, joins two situations: the from end and the to end are AnySituation.', strength: must, section: '9.1.1 (Causality), p. 21', checkable: static, category: REL}
- {id: RAAML-REL-006, statement: Activation joins an abstract cause (the fault end) to a dysfunctional event (the error end)., strength: must, section: '9.2.1 (Activation), p. 30', checkable: static, category: REL}
- {id: RAAML-REL-007, statement: ErrorPropagation joins a dysfunctional event (the predecessor error) to a dysfunctional event (the successor error)., strength: must, section: '9.2.1 (ErrorPropagation), p. 31', checkable: static, category: REL}
- {id: RAAML-REL-008, statement: ErrorRealization joins a dysfunctional event (the predecessor error) to a dysfunctional event (the resulting failure)., strength: must, section: '9.2.1 (ErrorRealization), p. 31', checkable: static, category: REL}
- {id: RAAML-MARK-001, statement: The Tree marker applies only to a class that specializes FTATree., strength: must, section: '9.4.2 (Tree) [1], p. 57', checkable: static, category: MARK}
- {id: RAAML-MARK-002, statement: 'A fault tree event marker (DormantEvent, BasicEvent, ConditionalEvent, ZeroEvent, HouseEvent, IntermediateEvent, TopEvent) applies only to a class that specializes the library event of the same name, or to a property whose type does.', strength: must, section: '9.4.2 (each marker) [1], pp. 58-68', checkable: static, category: MARK}
- {id: RAAML-MARK-003, statement: 'A fault tree gate marker (AND, OR, SEQ, XOR, INHIBIT, MAJORITY_VOTE, NOT) applies only to a class that specializes the library gate of the same name, or to a property whose type does.', strength: must, section: '9.4.2 (each marker) [1], pp. 62-67', checkable: static, category: MARK}
- {id: RAAML-MARK-004, statement: A class that carries both the BasicEvent and the Undeveloped markers specializes UndevelopedEvent., strength: must, section: '9.4.2 (BasicEvent) [2], p. 59', checkable: static, category: MARK}
- {id: RAAML-MARK-005, statement: A class that carries the Event marker also carries the Situation marker or a marker that specializes it., strength: must, section: '9.4.2 (Event), p. 57', checkable: static, category: MARK}
- {id: RAAML-MARK-006, statement: The FMEAItem marker applies only to a class that specializes AbstractFMEAItem., strength: must, section: '9.3.2 (FMEAItem) [1], p. 44', checkable: static, category: MARK}
- {id: RAAML-MARK-007, statement: The type of a TransferIn property is a fault tree that carries the TransferOut marker., strength: must, section: '9.4.2 (TransferIn) [1], p. 69', checkable: static, category: MARK}
- {id: RAAML-MARK-008, statement: 'The Undeveloped marker flags an incomplete concept. It combines with Goal or Strategy in an argument, or with a basic event in a fault tree.', strength: note, section: '9.2.2 (Undeveloped), p. 38; 9.6.1, p. 82', checkable: none, category: MARK}
- {id: RAAML-CARD-001, statement: An FMEA item has exactly one failure mode., strength: must, section: '9.3.1 (AbstractFMEAItem), p. 39', checkable: static, category: CARD}
- {id: RAAML-CARD-002, statement: An FMEA item has at least one cause., strength: must, section: '9.3.1 (AbstractFMEAItem), p. 39', checkable: static, category: CARD}
- {id: RAAML-CARD-003, statement: An FMEA item has at least one final effect., strength: must, section: '9.3.1 (AbstractFMEAItem), p. 39', checkable: static, category: CARD}
- {id: RAAML-CARD-004, statement: An FMEA item has no harm potential. The property is redefined to multiplicity zero because the method does not use it., strength: must, section: '9.3.1 (AbstractFMEAItem), p. 39', checkable: static, category: CARD}
- {id: RAAML-CARD-005, statement: A fault tree has exactly one top event., strength: must, section: '9.4.1 (FTATree), p. 45', checkable: static, category: CARD}
- {id: RAAML-CARD-006, statement: A gate has exactly one output event., strength: must, section: '9.4.1 (Gate), p. 50', checkable: static, category: CARD}
- {id: RAAML-CARD-007, statement: An INHIBIT gate has a single input event. Its enabling conditions are zero or more events., strength: must, section: '9.4.1 (INHIBIT), pp. 52-53', checkable: static, category: CARD}
- {id: RAAML-CARD-008, statement: A NOT gate has exactly one input event., strength: should, section: '9.4.1 (NOT; NOTConstraintBlock), pp. 51, 56', checkable: static, category: CARD}
- {id: RAAML-CARD-009, statement: The priority of an event is used only to order the inputs of a priority-AND (SEQ) gate., strength: should, section: '9.4.1 (Event), p. 46', checkable: partial, category: CARD}
- {id: RAAML-CARD-010, statement: A MAJORITY_VOTE gate has exactly one threshold m., strength: must, section: '9.4.1 (MAJORITY_VOTE), p. 53', checkable: static, category: CARD}
- {id: RAAML-CARD-011, statement: 'An unsafe control action has exactly one context, which is an operational situation.', strength: must, section: '9.5.1 (UnsafeControlAction), p. 75', checkable: static, category: CARD}
- {id: RAAML-CARD-012, statement: A hazardous event has exactly one accident scenario., strength: must, section: '9.7.1 (HazardousEvent), p. 98', checkable: static, category: CARD}
- {id: RAAML-CARD-013, statement: 'An accident scenario has at least one operational situation, exactly one malfunctioning behavior and exactly one controllability value.', strength: must, section: '9.7.1 (AccidentScenario), pp. 100-101', checkable: static, category: CARD}
- {id: RAAML-CARD-014, statement: An abstract operational situation has exactly one exposure value., strength: must, section: '9.7.1 (AbstractOperationalSituation), p. 92', checkable: static, category: CARD}
- {id: RAAML-CARD-015, statement: An automotive effect has exactly one severity value., strength: must, section: '9.7.1 (AutomotiveEffect), p. 99', checkable: static, category: CARD}
- {id: RAAML-CARD-016, statement: A safety requirement template has exactly one ASIL and one fault tolerant time interval., strength: must, section: '9.7.1 (ISO26262SafetyRequirementTemplate), p. 100', checkable: static, category: CARD}
- {id: RAAML-CARD-017, statement: An ASIL assignment has exactly one ASIL value and at most one override value., strength: must, section: '9.7.2 (ASILAssignment), p. 112', checkable: static, category: CARD}
- {id: RAAML-CARD-018, statement: A Verified or Confirmed marker carries exactly one result., strength: must, section: '9.7.2 (Verified; Confirmed), p. 110', checkable: static, category: CARD}
- {id: RAAML-CARD-019, statement: An identifier carrier holds exactly one identifier string., strength: must, section: '9.1.2 (IDCarrier), p. 24', checkable: static, category: CARD}
- {id: RAAML-VAL-001, statement: The probability of a fault tree element is a real value from 0 to 1., strength: must, section: '9.4.1 (FTAElement), p. 45', checkable: static, category: VAL}
- {id: RAAML-VAL-002, statement: The probability of a house event is 0 or 1 and is set before the fault tree is evaluated., strength: must, section: '9.4.1 (HouseEvent), p. 49', checkable: static, category: VAL}
- {id: RAAML-VAL-003, statement: The probability of a zero event is always 0., strength: must, section: '9.4.1 (ZeroEvent), p. 49', checkable: static, category: VAL}
- {id: RAAML-VAL-004, statement: The probability of an intermediate event is derived by its gate from the probabilities of the events below it. The probability of the top event is the derived result of the tree calculation., strength: should, section: '9.4.1 (IntermediateEvent; TopEvent), p. 47', checkable: runtime, category: VAL, applies_when: a probability evaluation is run}
- {id: RAAML-VAL-005, statement: 'The probability of an AND gate output is the product of the input probabilities, assuming the inputs are independent.', strength: should, section: '9.4.1 (ANDConstraintBlock), p. 54', checkable: runtime, category: VAL, applies_when: a probability evaluation is run}
- {id: RAAML-VAL-006, statement: 'The probability of an OR gate output is one minus the probability that no input occurs, assuming independence.', strength: should, section: '9.4.1 (ORConstraintBlock), p. 54', checkable: runtime, category: VAL, applies_when: a probability evaluation is run}
- {id: RAAML-VAL-007, statement: 'The probability of a SEQ gate output is computed as for an AND gate, the product of the input probabilities. This cannot capture time dependence.', strength: should, section: '9.4.1 (SEQConstraintBlock), pp. 54-55', checkable: runtime, category: VAL, applies_when: a probability evaluation is run}
- {id: RAAML-VAL-008, statement: 'For two inputs the probability of an XOR gate output is a + b - 2ab, applied iteratively for more inputs, assuming independence.', strength: should, section: '9.4.1 (XORConstraintBlock), p. 55', checkable: runtime, category: VAL, applies_when: a probability evaluation is run}
- {id: RAAML-VAL-009, statement: 'The probability of an INHIBIT gate output is the product of the input probabilities and the condition probability, assuming independence.', strength: should, section: '9.4.1 (INHIBITConstraintBlock), pp. 55-56', checkable: runtime, category: VAL, applies_when: a probability evaluation is run}
- {id: RAAML-VAL-010, statement: 'The probability of a MAJORITY_VOTE gate output is the combined probability of all input combinations in which at least m inputs occur, assuming independence.', strength: should, section: '9.4.1 (MAJORITY_VOTEConstraintBlock), p. 56', checkable: runtime, category: VAL, applies_when: a probability evaluation is run}
- {id: RAAML-VAL-011, statement: The probability of a NOT gate output is one minus the probability of its input., strength: should, section: '9.4.1 (NOTConstraintBlock), p. 56', checkable: runtime, category: VAL, applies_when: a probability evaluation is run}
- {id: RAAML-VAL-012, statement: 'The risk priority number of an FMEA item is the product of occurrence, detectability and severity.', strength: should, section: '9.3.1 (RPNCalculation), p. 41', checkable: runtime, category: VAL, applies_when: the RPN calculation is used}
- {id: RAAML-VAL-013, statement: 'The abstract event, cause, effect, failure mode and risk classes declare placeholder attributes (likelihood, occurrence, severity, detectability, score) with no type. Method-specific classes give them a type; the Real-valued Cause, Effect and FailureMode are the general implementations.', strength: note, section: '9.2.1, pp. 25-34', checkable: none, category: VAL}
- {id: RAAML-VAL-014, statement: The majority threshold m of a MAJORITY_VOTE gate need not be half the number of inputs; for example 2 of 7 can be stipulated., strength: note, section: '9.4.1 (MAJORITY_VOTE), p. 53', checkable: none, category: VAL}
- {id: RAAML-GSN-001, statement: The client of an InContextOf relationship is a goal or a strategy., strength: must, section: '9.6.1 (InContextOf) [1], p. 87', checkable: static, category: GSN}
- {id: RAAML-GSN-002, statement: 'The supplier of an InContextOf relationship is contextual information (a context, assumption or justification) or a non-GSN element. It is never another kind of GSN node.', strength: must, section: '9.6.1 (InContextOf) [2], p. 87', checkable: static, category: GSN}
- {id: RAAML-GSN-003, statement: 'Permitted InContextOf connections are goal to context, goal to assumption, goal to justification, strategy to context, strategy to assumption and strategy to justification.', strength: note, section: '9.6.1 (InContextOf), p. 87', checkable: none, category: GSN}
- {id: RAAML-GSN-004, statement: The client of a SupportedBy relationship is a goal or a strategy., strength: must, section: '9.6.1 (SupportedBy) [1], p. 88', checkable: static, category: GSN}
- {id: RAAML-GSN-005, statement: 'When the client of a SupportedBy relationship is a strategy, the supplier is a goal.', strength: must, section: '9.6.1 (SupportedBy) [2], p. 88', checkable: static, category: GSN}
- {id: RAAML-GSN-006, statement: The supplier of a SupportedBy relationship is a GSN node or a non-GSN element. It is never contextual information., strength: must, section: '9.6.1 (SupportedBy) [3], p. 88', checkable: static, category: GSN}
- {id: RAAML-GSN-007, statement: 'The client of a SupportedBy relationship is not marked Undeveloped: a goal or strategy that supports others is developed.', strength: must, section: '9.6.1 (SupportedBy) [4], p. 88', checkable: static, category: GSN}
- {id: RAAML-GSN-008, statement: 'Permitted SupportedBy connections are goal to goal, goal to strategy, goal to solution and strategy to goal.', strength: note, section: '9.6.1 (SupportedBy), p. 87', checkable: none, category: GSN}
- {id: RAAML-GSN-009, statement: 'The short phrase of a GSN node is the name of the element. Its human-readable identifier is stored separately, in the identifier carrier.', strength: must, section: '9.6.1 (GSNNode), p. 83', checkable: partial, category: GSN}
- {id: RAAML-STPA-001, statement: ProcessModelFactor joins a Factor to a ProcessModel; ProcessModelConsequence joins a ProcessModel to an UnsafeControlAction; UnsafeControlActionHarmPotential joins an UnsafeControlAction to a HarmPotential., strength: must, section: '9.5.1, pp. 77-78', checkable: static, category: STPA}
- {id: RAAML-STPA-002, statement: 'An unsafe control action has four parts: the controller that issues the control action (inferred from the control action and the system model), the guideword (given by generalization), the control action (linked by RelevantTo) and the context (a sub-situation).', strength: should, section: '9.5.1 (UnsafeControlAction), p. 74', checkable: partial, category: STPA}
- {id: RAAML-STPA-003, statement: 'A loss scenario is a sequence of situations that starts from factors, passes through process model deficiencies and leads to an unsafe control action.', strength: should, section: '9.5.1 (LossScenario), p. 72', checkable: partial, category: STPA}
- {id: RAAML-STPA-004, statement: RiskRealization associates a loss with a hazard., strength: note, section: '9.5.1 (RiskRealization), p. 76', checkable: none, category: STPA}
- {id: RAAML-STPA-005, statement: 'Process model deficiencies come in four high-level kinds: inadequate controller decisions, inadequate control execution, inadequate process behavior, and inadequate feedback and inputs.', strength: note, section: '9.5.1 (ProcessModel), p. 72', checkable: none, category: STPA}
- {id: RAAML-STPA-006, statement: A controller sends control actions to a controlled process through an actuator and receives feedback from the controlled process through a sensor., strength: note, section: '9.5.2, pp. 78-80', checkable: none, category: STPA}
- {id: RAAML-STPA-007, statement: 'The seven unsafe control action guidewords (Provided, NotProvided, Early, Late, OutOfSequence, TooLong, TooShort) can be tailored in the library as the user wishes.', strength: note, section: '9.5.1, pp. 69-71; Examples 2.3', checkable: none, category: STPA}
- {id: RAAML-ISO-001, statement: The exposure of an operational situation has a rationale attached., strength: must, section: '9.7.1 (AbstractOperationalSituation), p. 92', checkable: static, category: ISO}
- {id: RAAML-ISO-002, statement: The severity of an automotive effect has a rationale attached., strength: must, section: '9.7.1 (AutomotiveEffect), p. 99', checkable: static, category: ISO}
- {id: RAAML-ISO-003, statement: The controllability of an accident scenario has a rationale attached., strength: must, section: '9.7.1 (AccidentScenario), p. 100', checkable: static, category: ISO}
- {id: RAAML-ISO-004, statement: An ASIL override value has an associated rationale (an ASIL override rationale)., strength: must, section: '9.7.2 (ASILAssignment), p. 112', checkable: static, category: ISO}
- {id: RAAML-ISO-005, statement: 'ASILDecompose relations are applied in pairs: a requirement is never the supplier of a single ASILDecompose relation.', strength: must, section: '9.7.2 (ASILDecompose), p. 105', checkable: static, category: ISO}
- {id: RAAML-ISO-006, statement: The supplier of an ASILDecompose relation is at a higher level of abstraction than its client., strength: should, section: '9.7.2 (ASILDecompose), p. 105', checkable: none, category: ISO}
- {id: RAAML-ISO-007, statement: 'A malfunction class (Less, More, No, Intermittent, Unintended, Early, Late, Inverted) is connected to a behavioral element, a use case or a function.', strength: must, section: '9.7.1, pp. 94-97', checkable: partial, category: ISO}
- {id: RAAML-ISO-008, statement: A UserInfoRequirement runs from a state (client) to a functional or technical safety requirement (supplier). A RecoveryRequirement links a safe state to a requirement that gives the recovery criteria., strength: should, section: '9.7.2, p. 106', checkable: partial, category: ISO}
- {id: RAAML-ISO-009, statement: 'An IndependenceRequirement states an independence criterion that must be satisfied for an ASIL decomposition, between a parent requirement and two other children, to be valid.', strength: note, section: '9.7.2 (IndependenceRequirement), p. 104', checkable: none, category: ISO}
- {id: RAAML-ISO-010, statement: 'Risk analysis identifies hazards that could result from a malfunctioning behavior; with an operational situation these give an accident scenario, held in a hazardous event that gives the risk level (ASIL). Safety goals derive from hazardous events; functional safety requirements from safety goals; technical safety requirements from functional ones; hardware and software safety requirements from technical ones.', strength: note, section: '9.7, p. 89; Examples 2.5 (informative)', checkable: none, category: ISO}
- {id: RAAML-ISO-011, statement: The ASIL of a hazardous event redefines the score of the abstract risk; its values are defined in an enumeration in the ISO 26262 package., strength: note, section: 'Examples 2.5 (informative), p. 24', checkable: none, category: ISO}
- {id: RAAML-CONF-001, statement: 'Interchange conformance (type 1): a tool can import and export conformant XMI for all valid models of the language.', strength: note, section: '2, p. 6', checkable: none, category: CONF}
- {id: RAAML-CONF-002, statement: 'View specification conformance (type 2): a tool implements the views the specification defines.', strength: note, section: '2, p. 6', checkable: none, category: CONF}
- {id: RAAML-CONF-003, statement: 'A tool vendor may implement one method (FMEA, FTA, STPA, GSN or ISO 26262) and claim conformance to it.', strength: note, section: '2, p. 6', checkable: none, category: CONF}
- {id: RAAML-CONF-004, statement: 'The language library and profile import the entire SysML profile, so a RAAML model is a SysML model.', strength: note, section: '9, p. 19', checkable: none, category: CONF}
- {id: RAAML-GUID-001, statement: 'The language relies heavily on model libraries with a light profile. Users extend the libraries by specializing library classes, because practices differ across domains and organizations.', strength: note, section: '7.2, p. 11', checkable: none, category: GUID}
- {id: RAAML-GUID-002, statement: 'The general package gives a common base for the methods, traceability across safety and reliability artifacts, and a foundation on which new methods or domains can be built.', strength: note, section: '9.2, pp. 24-25', checkable: none, category: GUID}
- {id: RAAML-GUID-003, statement: 'To combine FMEA and FTA, the cause of an FMEA item can be read as the event that leads to failure of a system item, so each analysis can verify the other.', strength: note, section: '9.4, p. 44', checkable: none, category: GUID}
- {id: RAAML-GUID-004, statement: 'The fault tree package can be extended, for example for dynamic fault trees or component fault trees, while staying compatible with other modeled information.', strength: note, section: '9.4, p. 44', checkable: none, category: GUID}
- {id: RAAML-GUID-005, statement: 'A recommendation connects a situation to an action item, normally a requirement that is managed further in requirements management (people responsible, due date, verification).', strength: note, section: '9.2.2 (Recommendation), p. 37', checkable: none, category: GUID}
- {id: RAAML-GUID-006, statement: 'Tools are expected to offer traditional representations, tabular and tree views, over the model structure, because users of FMEA, STPA and ISO 26262 are used to tables and users of fault trees to a graphical tree.', strength: note, section: '1.2, p. 4; 7.3, p. 12; Examples 1.2, 2.1', checkable: none, category: GUID}
conventions:
  provenance: {status: standard, note: 'Drawing rules the standard states (9.6.1 for the argument notation, 9.4.2 for event and gate icons, 7.3.2 for tables). They are conventions for a renderer or an author, not validation. Layout numbers are not part of the standard.'}
  diagrams:
    GSN argument: ['A GSN element may be shown as an image with the element name below it, or as a box with the iconic image at the upper left inside the box (the UML icon presentation). (9.6.1, p. 82)', 'The preferred notation uses the icon as a resizable outline of the box, with the usual compartments (name, marker, attribute values) inside it. (9.6.1, p. 82)', 'A goal or strategy that is also undeveloped is shown with the combined notation. (9.6.1, Figure 9.107, p. 82)', 'Shapes and text placement for each node kind follow the GSN standard, version 2. (9.6.1, p. 82)']
    fault tree: ['Each event and gate marker carries an icon for its kind (basic, dormant, conditional, house, zero, intermediate and top events; AND, OR, SEQ, XOR, INHIBIT, MAJORITY_VOTE and NOT gates). (9.4.2, pp. 56-68)']
    situation table: ['One column per attribute of the situation type, plus a name column; column names may be made friendlier than the attribute names. (7.3.2, p. 13)', 'Generalization between situations is shown as hierarchical indented rows. (7.3.2, p. 14)', 'A composite sub-situation can be shown as a group of columns, so one table covers several composition levels. (7.3.2, p. 15)', 'A vendor may add columns, for example a description. (7.3.2, p. 14)']
    control structure: ['Control actions and feedback may be shown explicitly or hidden, as the user prefers. (Examples 2.3, informative)']
notes: 'RAAML 1.0 is a UML profile and set of model libraries on SysML. A situation is a SysML block; the library supplies the classes users specialize (AnySituation and the method packages) and the profile supplies markers that identify them. It defines no diagram types of its own: it reuses the SysML block definition, internal block, parametric and requirement diagrams and expects tabular views. Concept counts: 153 concepts in 14 groups; 51 relationships; 96 constraints (49 must, 19 should, 28 note); 11 diagram and table kinds; 16 views. The constraint ids are RAAML-<CAT>-nnn; the categories are listed in references/rules.md. Strength policy: must is an error, should a warning, note advice only. Tool-specific encodings belong in the tool''s own file, not here.'

layout:
  basis: Our conventions, not this standard's. Sizes and spacing come from the shared layout standard; this block only says which element type each concept takes.
  element_types:        # concept -> element type; a concept left out is drawn as a rectangle (box)
    ConditionalEvent: box
    Assumption: box
    Justification: box
    Strategy: box
    BasicEvent: event-circle
    UndevelopedEvent: event-circle
    HouseEvent: event-circle
    ZeroEvent: event-circle
    Solution: event-circle
    DormantEvent: decision-diamond
    AND: decision-diamond
    OR: decision-diamond
    SEQ: decision-diamond
    XOR: decision-diamond
    INHIBIT: decision-diamond
    MAJORITY_VOTE: decision-diamond
    NOT: decision-diamond
    TransferIn: decision-diamond
    Undeveloped: attached-item
    LessonLearned: note
    ASILOverrideRationale: note
    HazardAndRiskAssessment: container
  exceptions: {}        # none: no standard states a size
  no_element_type:      # concepts with no element of their own, and why
    line:
      reason: 'A relationship: it is drawn as a line between elements and takes no element size.'
      concepts: [ControllingMeasure, Detection, Prevention, Mitigation, Recommendation, RelevantTo, Violates, InContextOf,
        SupportedBy, SafeState, OperatingMode, IndependenceRequirement, ASILDecompose, UserInfoRequirement,
        RecoveryRequirement, Causality, Activation, ErrorPropagation, ErrorRealization, ProcessModelFactor,
        ProcessModelConsequence, UnsafeControlActionHarmPotential, RiskRealization, Scenario.scenarioStep,
        AbstractRisk.trigger, AbstractRisk.harm, AbstractRisk.harmPotential, AbstractFMEAItem.failureMode,
        AbstractFMEAItem.cause, AbstractFMEAItem.finalEffect, AbstractFMEAItem.harmPotential, FTATree.topEvent,
        Gate.input, Gate.output, INHIBIT.condition, LossScenario.Factor, LossScenario.unsafeControlAction,
        LossScenario.processModel, UnsafeControlAction.Context, AbstractOperationalSituation.conditions,
        TypicalAutomotiveSituation.trafficAndPeople, TypicalAutomotiveSituation.vehicleUsage,
        TypicalAutomotiveSituation.roadCondition, TypicalAutomotiveSituation.location,
        TypicalAutomotiveSituation.environmentalCondition, AccidentScenario.situation,
        AccidentScenario.malfunctioningBehavior, HazardousEvent.scenario, HazardousEvent.hazard,
        HazardousEvent.systemLevelEffect, HazardousEvent.vehicleLevelEffect]
    text-inside:
      reason: A marker applied to another element and written as a keyword on it, so it has no box of its own.
      concepts: [IDCarrier, ASILAssignment]
