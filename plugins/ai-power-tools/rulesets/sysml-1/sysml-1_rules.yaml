      end may carry a requirement stereotype. The end the rule does not forbid lists every SysML element stereotype that is
      not a requirement kind and the empty stereotype (a plain UML element): an endpoint condition says ''one of'', so a rule
      that forbids a requirement has to list everything else. An end that carries another technology''s stereotype is reported
      too. [OMG SysML 1.5 (formal/17-05-01) 16.3.2.5 [3]]'
    category: req
