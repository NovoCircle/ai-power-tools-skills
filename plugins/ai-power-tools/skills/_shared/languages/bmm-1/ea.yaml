  so nothing is listed here. 'BMM Diagram' is the diagram type, recorded under diagram_types.
toolbox:
  source: Toolbox window > Business Motivation Model (view setting only), read on screen 2026-10-20
  complete: false
  pages:
  - name: BMM - Ends
    items:
    - End
    - Desired Result
    - Goal
    - Objective
    - Vision
  - name: BMM - Means
    items:
    - Means
    - Mission
    - Course of Action
    - Strategy
    - Tactic
    - Directive
    - Business Rule
    - Business Policy
  - name: BMM - Influencers
    items:
