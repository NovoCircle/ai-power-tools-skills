notes: |
  `radial` for TOGAF_Interface. The ADM wheel is a hub with eight phases at equal steps around it, and the preliminary phase sits outside the ring. The steps are equal, so `radial` fits and `radial-tree`, which weights its branches, has nothing to weigh.

  Radius, start angle and sweep aren't stated, because only one diagram shows them.

  Route. `straight` is our default. The connectors on this diagram route differently from those on a plain Logical diagram, and which route name that is hasn't been confirmed, so this value may change.

  Not bound, for want of enough elements to support a default size: TOGAF_EnterpriseContinuum, TOGAF_ADM, TOGAF_ACM, TOGAF_OrganizationStructure and IEEE1471_ConceptualFramework.

  No viewpoints. TOGAF publishes a catalog of them, but nothing here records which concepts each one accepts, so none is listed.

  `TOGAF` is the id EA reports, measured on EA 17.1 build 1716.
