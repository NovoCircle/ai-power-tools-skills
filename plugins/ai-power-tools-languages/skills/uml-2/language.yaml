diagram_types:
  Class diagram:
    group: structure
    frame_kind: class
    interchange_class: UMLClassDiagram
    defined_by: Annex A names clause 11 (Structured Classifiers); notation also in 9, 10, 12, 7.7
    admits_basis: inferred
    admits: [Class, AssociationClass, Interface, DataType, PrimitiveType, Enumeration, EnumerationLiteral, Signal, Reception, Component, Property, Operation, Parameter, Association, Generalization, GeneralizationSet, Dependency, Abstraction, Realization, Substitution, Usage, InterfaceRealization, TemplateBinding, TemplateSignature, TemplateParameter, Package, PackageImport, ElementImport, PackageMerge, InstanceSpecification, Constraint, Comment]
    admits_other: [Stereotype application]
    admits_note: 'Static structure of classifiers and their relationships. Ball and socket interface notation, inherited members (caret), compartments (attributes, operations, receptions, internal structure, optional extras), keywords per Annex C. Annex B: UMLDiagramWithAssociations options for the association dot and navigability display.'
    excludes: [Lifeline, Message, ActivityNode, Transition, Vertex]
    conventions: see conventions.diagrams
  Object diagram:
    group: structure
    frame_kind: (no frame kind of its own; a class diagram frame is used)
    interchange_class: UMLObjectDiagram
    defined_by: Annex A names clause 9 (Classification), 9.8
    admits_basis: inferred
    admits: [InstanceSpecification, Slot, InstanceValue, ValueSpecification, EnumerationLiteral, Constraint, Comment, Package]
    admits_other: [links (InstanceSpecification classified by an Association)]
    admits_note: 'Instances and links at a point in time: underlined `name : Classifier`, slot values, nested role instances for structured classifiers.'
    excludes_other: [Class definitions as the main symbols (these belong on class diagrams)]
    conventions: see conventions.diagrams
  Package diagram:
    group: structure
    frame_kind: package
    interchange_class: UMLPackageDiagram
    defined_by: Annex A names clause 12 (Packages); notation 12.2.4, 7.4.4
    admits_basis: inferred
    admits: [Package, Model, Profile, PackageableElement, PackageImport, ElementImport, PackageMerge, Dependency, Constraint, Comment]
    admits_other: [PackageableElement (members shown inside or by circle-plus)]
    admits_note: Package folder symbols with members inside or attached by lines with a circled plus; imports, merges and dependencies between packages.
    excludes_other: [Instance-level symbols]
    conventions: see conventions.diagrams
  Composite structure diagram:
    group: structure
    frame_kind: (none of the eight frame kinds; Annex B gives it exactly one model element, a structured classifier or its instance)
    interchange_class: UMLCompositeStructureDiagram
    defined_by: Annex A names clause 11 (Structured Classifiers), 11.2 to 11.3, 11.7
    admits_basis: inferred
    admits: [StructuredClassifier, Class, Component, Collaboration, Property, Port, Connector, ConnectorEnd, CollaborationUse, Collaboration, Interface, InterfaceRealization, Usage, Dependency, InstanceSpecification, Constraint, Comment]
    admits_other: ['StructuredClassifier (Class, Component, Collaboration)', Property (parts and roles), Interface (ball and socket), Dependency (role binding)]
    admits_note: 'Internal structure: part boxes (solid composite, dashed non-composite), ports on the boundary, connectors with ends, collaborations and their uses, provided and required interfaces.'
    excludes_other: [Deployment-only symbols]
    conventions: see conventions.diagrams
  Component diagram:
    group: structure
    frame_kind: component
    interchange_class: UMLComponentDiagram
    defined_by: Annex A names clause 11 (Structured Classifiers), 11.6
    admits_basis: inferred
    admits: [Component, Interface, Port, Connector, ComponentRealization, InterfaceRealization, Usage, Dependency, Class, Artifact, Package, Property, Constraint, Comment]
    admits_other: ['Connector (assembly, delegation)', Artifact (artifacts compartment)]
    admits_note: Components with provided and required interfaces (ball and socket or interface rectangles), ports, realizing classifiers, assembly and delegation.
    excludes_other: [Behavior symbols]
    conventions: see conventions.diagrams
  Deployment diagram:
    group: structure
    frame_kind: deployment
    interchange_class: UMLDeploymentDiagram
    defined_by: Annex A names clause 19 (Deployments)
    admits_basis: inferred
    admits: [Node, Device, ExecutionEnvironment, Artifact, DeploymentSpecification, Deployment, Manifestation, CommunicationPath, Component, InstanceSpecification, Property, Dependency, Package, Constraint, Comment]
    admits_other: [InstanceSpecification (of nodes and artifacts), Property (nested structure)]
    admits_note: Artifacts deployed to nodes; nodes (3D boxes) nested and joined by communication paths; manifestations link artifacts to the elements they implement.
    excludes_other: [Behavior symbols]
    conventions: see conventions.diagrams
  Profile diagram:
    group: structure
    frame_kind: package (a profile is a package; no separate frame kind)
    interchange_class: UMLProfileDiagram
    defined_by: Annex A names clause 12 (Packages), 12.3
    admits_basis: inferred
    admits: [Profile, Stereotype, Class, Extension, ExtensionEnd, ProfileApplication, Package, Class, DataType, PrimitiveType, Enumeration, Association, Generalization, Property, Image, Constraint, Comment]
    admits_other: [Class (as metaclass reference), ElementImport and PackageImport (as reference), Property (tag definition)]
    admits_note: Stereotypes drawn as classes, extension arrows with filled triangles ({required}), profile application arrows (<<apply>>, <<strict>>), metaclass and metamodel references.
    excludes_other: [Behavior symbols]
    conventions: see conventions.diagrams
  Use case diagram:
    group: behavior
    frame_kind: use case
    interchange_class: UMLUseCaseDiagram
    defined_by: Annex A names clause 18 (Use Cases)
    admits_basis: inferred
    admits: [UseCase, Actor, ExtensionPoint, Association, Include, Extend, Generalization, Dependency, Package, Constraint, Comment, Component, Class, Collaboration]
    admits_other: [subject classifier (boundary rectangle), Association (actor to use case), Generalization (between actors and between use cases)]
    admits_note: Use cases (ellipses) inside a subject rectangle, actors (stick figures or <<actor>>), include and extend arrows, extension point compartments.
    excludes: [Lifeline, Transition]
    conventions: see conventions.diagrams
  Activity diagram:
    group: behavior
    frame_kind: activity
    interchange_class: UMLActivityDiagram
    defined_by: Annex A names clause 15 (Activities); actions in 16
    admits_basis: inferred
    admits: [Activity, ActivityNode, Action, ControlNode, InitialNode, ActivityFinalNode, FlowFinalNode, DecisionNode, MergeNode, ForkNode, JoinNode, ObjectNode, ActivityParameterNode, CentralBufferNode, DataStoreNode, ExpansionNode, Pin, InputPin, OutputPin, ValuePin, ActionInputPin, ActivityEdge, ControlFlow, ObjectFlow, ActivityPartition, InterruptibleActivityRegion, StructuredActivityNode, ConditionalNode, LoopNode, SequenceNode, ExpansionRegion, ExceptionHandler, Variable, Constraint, Comment]
    admits_other: [Action (and its subclasses), 'ControlNode (InitialNode, ActivityFinalNode, FlowFinalNode, DecisionNode, MergeNode, ForkNode, JoinNode)', 'ObjectNode (ActivityParameterNode, CentralBufferNode, DataStoreNode, ExpansionNode, Pin, InputPin, OutputPin, ValuePin, ActionInputPin)', 'ActivityEdge (ControlFlow, ObjectFlow)', 'StructuredActivityNode (ConditionalNode, LoopNode, SequenceNode, ExpansionRegion)', 'Constraint (pre and post conditions, guards)']
    admits_note: 'Flow of control and objects: nodes, edges with guards and weights, partitions (swimlanes), regions, exception handlers, pins.'
    excludes: [Lifeline, Vertex, Transition]
    conventions: see conventions.diagrams
  State machine diagram:
    group: behavior
    frame_kind: state machine
    interchange_class: UMLStateMachineDiagram
    defined_by: Annex A names clause 14 (State Machines)
    admits_basis: inferred
    admits: [StateMachine, ProtocolStateMachine, Region, State, FinalState, Pseudostate, ConnectionPointReference, Transition, ProtocolTransition, Trigger, Event, Behavior, Constraint, Comment]
    admits_other: ['Behavior (entry, exit, do, effect)', 'Constraint (guard, state invariant)']
    admits_note: States (rounded rectangles) with compartments, regions separated by dashed lines, pseudostates by symbol, transitions labeled trigger [guard] / effect, submachine states and connection points, optional transition-oriented flow style.
    excludes: [Lifeline, ActivityNode]
    conventions: see conventions.diagrams
  Sequence diagram:
    group: behavior
    frame_kind: interaction (sd)
    interchange_class: UMLInteractionDiagram, kind = sequence
    defined_by: Annex A names clause 17 (Interactions), 17.8
    admits_basis: inferred
    admits: [Interaction, Lifeline, Message, Gate, ExecutionSpecification, ActionExecutionSpecification, BehaviorExecutionSpecification, OccurrenceSpecification, MessageOccurrenceSpecification, DestructionOccurrenceSpecification, CombinedFragment, ConsiderIgnoreFragment, InteractionOperand, InteractionConstraint, InteractionUse, PartDecomposition, StateInvariant, Continuation, GeneralOrdering, TimeConstraint, TimeObservation, DurationConstraint, DurationObservation, Constraint, Comment]
    admits_other: ['ExecutionSpecification (ActionExecutionSpecification, BehaviorExecutionSpecification)']
    admits_note: Lifelines with time running down, messages (synchronous, asynchronous, reply, create, delete, lost, found), execution specifications, combined fragments, interaction uses, state invariants, coregions.
    excludes_other: [Connector as the message path (communication diagram), activity control nodes]
    conventions: see conventions.diagrams
  Communication diagram:
    group: behavior
    frame_kind: interaction (sd)
    interchange_class: UMLInteractionDiagram, kind = communication
    defined_by: Annex A names clause 17 (Interactions), 17.9
    admits_basis: inferred
    admits: [Interaction, Lifeline, Message, Connector, Comment]
    admits_other: [Message (with sequence expression), Connector (the links the messages travel on)]
    admits_note: Lifelines connected by links, messages numbered with sequence expressions (nesting by dots, concurrency by letters, iteration and guards); equivalent to simple sequence diagrams without interaction uses or combined fragments.
    excludes: [CombinedFragment, InteractionUse]
    conventions: see conventions.diagrams
  Timing diagram:
    group: behavior
    frame_kind: interaction (sd)
    interchange_class: UMLInteractionDiagram, kind = timing
    defined_by: Annex A names clause 17 (Interactions), 17.11
    admits_basis: inferred
    admits: [Interaction, Lifeline, Message, StateInvariant, OccurrenceSpecification, DestructionOccurrenceSpecification, GeneralOrdering, TimeConstraint, TimeObservation, DurationConstraint, DurationObservation, Comment]
    admits_other: ['Lifeline (state or condition timeline, general value lifeline)', MessageLabel notation]
    admits_note: Conditions changing along a linear time axis for one or more lifelines, with the times of the events that change them.
    excludes: [CombinedFragment, InteractionUse]
    conventions: see conventions.diagrams
  Interaction overview diagram:
    group: behavior
    frame_kind: interaction (sd)
    interchange_class: UMLInteractionDiagram, kind = overview
    defined_by: Annex A names clause 17 (Interactions), 17.10
    admits_basis: inferred
    admits: [Interaction, InteractionUse, InitialNode, ActivityFinalNode, FlowFinalNode, DecisionNode, MergeNode, ForkNode, JoinNode, ControlFlow, InteractionConstraint, Constraint, Comment]
    admits_other: [Interaction (inline), InteractionConstraint (guards)]
    admits_note: An activity-diagram variant whose nodes are inline interactions or interaction uses; alt is a decision with a merge, par a fork with a join, loop a cycle; branching and joining are properly nested.
    excludes: [ObjectNode]
    excludes_other: [Lifeline and Message at the overview level]
    conventions: see conventions.diagrams
