# CSDM 5 check rules
# Language:     ServiceNow Common Service Data Model (CSDM) 5, language file id csdm-5
# Enforced by:  AI Power Tools for Sparx EA -- validate_model tool
#
# CSDM is a vendor's guidance, and a clean result doesn't mean a model matches ServiceNow. Nothing connects the two.
#
# STORED NAMES. The pack stores CSDM<ConceptId>, with no namespace in the column rules read (measured on a scratch build,
# EA 17.1 build 1716). The qualified form CSDM5::<stored> is in t_xref.
#
# These rules check 14 of the 56 rules in the language guide. The rest need a chain of lines followed, events in ServiceNow,
# or a person's judgment, or they describe rather than require.

meta:
  version: '1.0'
  language: csdm-5
  organization: (your organization)
  mdg_family: CSDM5
  description: Rules for CSDM 5 models built with the CSDM 5 for EA pack. They check which lines join which shapes, a few
    stated limits, and life cycle values. CSDM is guidance from one vendor, and a clean result doesn't mean a model matches
    ServiceNow.
  severity_levels:
    error: CSDM states it as a flat limit.
    warning: CSDM recommends it, or it falls outside CSDM's list.
    info: Advisory note.
