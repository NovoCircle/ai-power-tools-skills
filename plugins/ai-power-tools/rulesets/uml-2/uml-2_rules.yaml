  - id: UML2-ACT-020a
    name: A decision node has one or two incoming edges
    implements: UML-ACT-020
    description: A decision node has one or two incoming edges (control or object flows). The rule counts every connector
      that ends at a Decision element, so a note link attached to a decision counts too. [OMG UML 2.5.1 (formal/17-12-05)
      15.7.12.5 Constraints]
    category: activity
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: Counts all connectors at the node, not only edges.
    selector:
      type: element
      types:
        any_of:
        - Decision
    condition:
      type: connector_count
      direction: incoming
      min: 1
      max: 2
    remediation:
      short: Give the decision one incoming flow (two when one is the decision input flow).
      auto_fixable: false

  - id: UML2-ACT-020b
    name: A decision node has at least one outgoing edge
    implements: UML-ACT-020
    description: A decision node has at least one outgoing edge (control or object flow). [OMG UML 2.5.1 (formal/17-12-05)
      15.7.12.5 Constraints]
    category: activity
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: Counts all connectors at the node, not only edges.
    selector:
      type: element
      types:
        any_of:
        - Decision
    condition:
      type: connector_count
      direction: outgoing
      min: 1
    remediation:
      short: Add at least one outgoing flow to the decision.
      auto_fixable: false

  - id: UML2-ACT-038
    name: A merge node has exactly one outgoing edge
    implements: UML-ACT-038
    description: A merge node has exactly one outgoing edge (control or object flow). [OMG UML 2.5.1 (formal/17-12-05) 15.7.21.4
      Constraints]
    category: activity
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: Counts all connectors at the node, not only edges.
    selector:
      type: element
      types:
        any_of:
        - MergeNode
    condition:
      type: connector_count
      direction: outgoing
      min: 1
      max: 1
    remediation:
      short: Leave exactly one flow leaving the merge node.
      auto_fixable: false

  - id: UML2-SEM-035
    name: A merge node is shown with two or more incoming edges
    implements: UML-SEM-035
    description: A merge node is shown with two or more incoming edges (guidance, not a constraint). [OMG UML 2.5.1 (formal/17-12-05)
      15.3.4.3]
    category: activity
    severity: warning
    demo_trigger: false
    coverage: partial
    not_checked: Counts all connectors at the node, not only edges.
    selector:
      type: element
      types:
        any_of:
        - MergeNode
    condition:
      type: connector_count
      direction: incoming
      min: 2
    remediation:
      short: Join at least two flows at the merge node, or use no merge node.
      auto_fixable: false

  - id: UML2-STR-022
    name: A port is owned by an encapsulated classifier
    implements: UML-STR-022
    description: Every port is owned by an encapsulated classifier. In EA a Port is a child of the element that owns it; the
      owner must be a Class, Component, Node, Device, ExecutionEnvironment, Collaboration, Activity, StateMachine, Interaction
      or Part (a part stands for its typed class). [OMG UML 2.5.1 (formal/17-12-05) 11.8.14.7 Constraints]
    category: structure
    severity: error
    demo_trigger: true
    coverage: full
    selector:
      type: element
      types:
        any_of:
        - Port
    condition:
      type: contained_in
      path:
      - stereotype_one_of:
        - type:Class
        - type:Component
        - type:Node
        - type:Device
        - type:ExecutionEnvironment
        - type:Collaboration
        - type:Part
        - type:Activity
        - type:StateMachine
        - type:Interaction
        - type:Boundary
        - type:Entity
    remediation:
      short: Move the port to a class, component or other encapsulated classifier.
      auto_fixable: false

  - id: UML2-STR-015
    name: A connector joins parts and ports
    implements: UML-STR-015
    description: The elements attached to a connector's ends must be roles of the owning classifier, or ports of such roles.
      In EA a Connector, Assembly or Delegate joins Part, Port, ProvidedInterface or RequiredInterface elements; a Class or
      Component is not a role. [OMG UML 2.5.1 (formal/17-12-05) 11.8.10.7 Constraints]
    category: structure
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: That the parts and ports belong to the connector's owning classifier is not checked.
    selector:
      type: connector
      connector_types:
      - Connector
      - Assembly
      - Delegate
    condition:
      type: connector_endpoint_stereotype
      source_must_be_one_of:
      - type:Part
      - type:Port
      - type:ProvidedInterface
      - type:RequiredInterface
      target_must_be_one_of:
      - type:Part
      - type:Port
      - type:ProvidedInterface
      - type:RequiredInterface
    remediation:
      short: Attach the connector to parts and ports, not to classes or components.
      auto_fixable: false

  - id: UML2-SM-027
    name: A region is owned by a state machine or a state
    implements: UML-SM-027
    description: A region is owned by a state machine or by a state. In EA a Region is a child of the element that owns it;
      the owner must be a State or a StateMachine. [OMG UML 2.5.1 (formal/17-12-05) 14.5.8.6 Constraints]
    category: state-machine
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: That a region is not owned by both a state machine and a state cannot arise in EA, which stores one parent.
    selector:
      type: element
      types:
        any_of:
        - Region
    condition:
      type: contained_in
      path:
      - stereotype_one_of:
        - type:State
        - type:StateMachine
    remediation:
      short: Move the region into a state or a state machine.
      auto_fixable: false

  - id: UML2-DEP-004
    name: A node's internal structure is nodes only
    implements: UML-DEP-004
    also_implements:
    - UML-SEM-057
    description: The internal structure of a node consists only of parts typed by nodes. In EA the internal structure of a
      Node, Device or ExecutionEnvironment is the elements nested under it; the rule reports a nested Class, Component, Interface,
      Artifact, Actor, UseCase, data type, signal, behavior, collaboration, information item or package. Deploy components
      and artifacts with a Deployment connector instead. A Part, a Port and a nested Node, Device or ExecutionEnvironment
      pass. [OMG UML 2.5.1 (formal/17-12-05) 19.5.10.6 Constraints]
    category: deployment
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: That a nested part is typed by a node is not checked (typing is not stored where the validator reads).
    selector:
      type: element
      types:
        any_of:
        - Node
        - Device
        - ExecutionEnvironment
    condition:
      type: contains_count
      child:
        stereotype_one_of:
        - type:Class
        - type:Component
        - type:Interface
        - type:Artifact
        - type:Actor
        - type:UseCase
        - type:DataType
        - type:PrimitiveType
        - type:Enumeration
        - type:Signal
        - type:Activity
        - type:StateMachine
        - type:Interaction
        - type:Collaboration
        - type:InformationItem
        - type:Package
      max: 0
    remediation:
      short: Deploy the element with a Deployment connector instead of nesting it in the node.
      auto_fixable: false

  - id: UML2-DEP-001
    name: A communication path joins deployment targets
    implements: UML-DEP-001
    description: The ends of a communication path are typed by deployment targets. In EA a CommunicationPath connector joins
      Node, Device and ExecutionEnvironment elements, or a Part or Object that stands for one. [OMG UML 2.5.1 (formal/17-12-05)
      19.5.2.4 Constraints]
    category: deployment
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: That a Part or an Object is typed by a node is not checked.
    selector:
      type: connector
      connector_types:
      - CommunicationPath
    condition:
      type: connector_endpoint_stereotype
      source_must_be_one_of:
      - type:Node
      - type:Device
      - type:ExecutionEnvironment
      - type:Part
      - type:Object
      target_must_be_one_of:
      - type:Node
      - type:Device
      - type:ExecutionEnvironment
      - type:Part
      - type:Object
    remediation:
      short: Join two nodes, devices or execution environments.
      auto_fixable: false

