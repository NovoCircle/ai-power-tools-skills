# ArchiMate 3.1 in Sparx EA: the EA references (generated from the harvest and the model readback; do not edit by hand)
language: archimate-3
technology: ArchiMate3
display_name: ArchiMate 3.1
profile: ArchiMate3
stereotype_prefix: ArchiMate_
stereotype_storage:
  stored: ArchiMate_<Concept>
  stored_in: t_object.Stereotype and t_connector.Stereotype (the unqualified name; what a ruleset selector matches)
  qualified: ArchiMate3::ArchiMate_<Concept>
  qualified_in: t_xref, the row named Stereotypes, FQName (the technology the stereotype is bound to)
  create_with: the qualified form as the element or connector type, for example ArchiMate3::ArchiMate_BusinessActor
  avoid: 'create_element_in_language with language_id ArchiMate3: binds seven element types to the ArchiMate 2 technology'
  shared_short_names: ArchiMate 2 (technology id Archimate) uses the same short names, so a ruleset cannot tell the two apart;
    only the qualified name in t_xref can
measured_on:
  ea: 17.1 build 1716
  date: '2026-10-20'
diagram_types:
  Business Layer:
    ea_name: ArchiMate3::Business
    alias: Business Layer
    base: Diagram_Logical
    toolbox: ArchiMate3::Business
    stored:
      t_diagram.Diagram_Type: Logical
      t_diagram.StyleEx: MDGDgm=ArchiMate3::Business;
    measured: true
    conventions:
      provenance:
        status: measured
        note: Conventions were measured on existing diagrams; the numbers are carried in separately and are not restated here.
  Application Layer:
