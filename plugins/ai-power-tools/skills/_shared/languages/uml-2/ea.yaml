connector_type_notes:
  Realisation: British spelling in the stored type; Realization is accepted and stored as Realisation. Interface realization, component realization
    and realization are one type
  Aggregation: shared and composite are one connector type; the end flag t_connector.SourceIsAggregate or DestIsAggregate is 1 (shared) or 2 (composite);
    EA's own patterns also store SubType Weak or Strong
  UseCase: the actor-to-use-case association; include and extend are this type with a stereotype and a SubType
  StateFlow: a transition
  Sequence: a message (the lifeline elements are Sequence elements)
  Package: a connector between packages (an import or a merge carries a stereotype string)
  Dependency: AddNew of a name EA does not know stores a Dependency without an error (Transition, InterfaceRealization, ComponentRealization,
    RoleBinding, ProtocolTransition, PackageImport, PackageMerge, ProfileApplication, AssociationClass)
connector_kinds:
  include:
    connector_type: UseCase
    stereotype: include
    subtype: Includes
    basis: EA pattern um2.5-basic-use-case-model-with-include; reproduced
  extend:
    connector_type: UseCase
    stereotype: extend
    subtype: Extends
    basis: EA pattern; reproduced
  package import:
    connector_type: Package or Dependency
    stereotype: import
    basis: Package in EA's pattern; Dependency measured
  access:
    connector_type: Dependency
    stereotype: access
    basis: measured (plain string)
  package merge:
    connector_type: Package or Dependency
    stereotype: merge
    basis: measured (plain string)
  substitution:
    connector_type: Substitution
    stereotype: substitute
    basis: measured (plain string)
  role binding:
    connector_type: Dependency
    stereotype: role binding
    basis: EA pattern
  derive, refine, trace:
    connector_type: Abstraction
    stereotype: derive | refine | trace
    basis: measured; EAUML binds them on request
  use, call, create, instantiate, send, responsibility:
    connector_type: Usage
    stereotype: use | call | create | instantiate | send | responsibility
    basis: measured; create and responsibility resolve to StandardProfileL2, the others stay plain
