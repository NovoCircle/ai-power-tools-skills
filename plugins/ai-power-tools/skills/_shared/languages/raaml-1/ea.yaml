# EA facts for RAAML 1.0 as Sparx Enterprise Architect's built-in RAAML technology stores them.
# Every stereotype and tag below was created in EA and read back. `concepts` and `relationships` map the language skill's concepts to the stored
# stereotypes (with the metaclass rows each has and how each row was established); the tags of each stereotype are under `stereotypes`.
# Evidence words: default = the type AddNew gave for RAAML::<name> (the first row); outside = a form outside the Class family that accepts the
# stereotype; inferred = nothing tells the row from another; only form = the qualified type is refused and StereotypeEx is the only way.
# Westbrook Bank appears only in howto.md, as an illustration.

language: raaml-1
technology: RAAML
api_technology_id: RAAML1.0
display_name: RAAML
stereotype_prefix: ''
stereotype_storage: 'bare name in t_object.Stereotype and t_connector.Stereotype, case as in the technology (FMEAItem, FailureMode,
  `ID carrier`, `MAJORITY VOTE`); only the FIRST stereotype of an element is in t_object.Stereotype, a second one is only in the
  t_xref row named Stereotypes; the qualified form RAAML::<name> is the FQName in that row and is what AddNew and StereotypeEx
  take. EA matches the name after RAAML:: without regard to case, and a spelling that differs only by case can be a different stereotype
  on a different metaclass (cause: Port, Cause: Association; failureMode: Port, FailureMode: Class and Association)'
measured_on:
  ea: 17.1 build 1716
  date: '2026-10-21'
  technology_version: '1.0'
  technology_file: 'none: the technology is one of EA''s InternalTechnologies (raaml.xml, encrypted); measured by creating objects'
version_note: EA's RAAML technology reports version 1.0 (Repository.GetTechnologyVersion('RAAML1.0')); the language guide and this
  reference describe RAAML 1.0. OMG lists RAAML 1.1 (December 2025) and a 1.2 beta; neither was studied,
  so nothing here says whether EA's stereotypes follow 1.0 exactly or include later changes.
