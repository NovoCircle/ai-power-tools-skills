      tagged_value_filter:
      - tag: processType
        value_in:
        - Public
    condition:
      type: tagged_value_constraint
      tags:
      - name: isExecutable
        value_must_be_one_of:
        - 'false'
    remediation:
      short: Set processType to Private, or set isExecutable to false.
      auto_fixable: false

  - id: BPMN2-GATE-002a
    name: A converging gateway has at least two incoming sequence flows
    implements: BPMN-GATE-002
    description: A gateway whose `gatewayDirection` is Converging has at least two incoming sequence flows. [OMG BPMN 2.0.2
      (formal/13-12-09) 10.6.1 p. 289]
    category: gateway
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: Gateways whose gatewayDirection is Unspecified (EA's default) are not checked; BPMN-GATE-001 (merge or split)
      needs 'incoming at least two OR outgoing at least two', which the rule grammar cannot say.
    selector:
      type: element
      stereotypes:
        any_of:
        - Gateway
      tagged_value_filter:
      - tag: gatewayDirection
        value_in:
        - Converging
    condition:
      type: connector_count
      connector_stereotype: SequenceFlow
      direction: incoming
      min: 2
    remediation:
      short: Add or remove sequence flows so the gateway merges, or set gatewayDirection to match.
      auto_fixable: false

