    Violates: {display: Violates, group: Core, kind: relationship profile element, layer: profile, abstract: false, uml_base: Dependency, section: 9.1.2 p. 23, definition: 'Says that a situation is a case of the system violating a prescription (a requirement, design constraint or other element that prescribes a characteristic of the system).'}
    InContextOf: {display: In Context Of, group: GSN, kind: relationship profile element, layer: profile, abstract: false, uml_base: Dependency, section: 9.6.1 p. 86, definition: 'Declares a contextual relationship: a goal or strategy is stated in the context of a context, assumption or justification.'}
    SupportedBy: {display: Supported By, group: GSN, kind: relationship profile element, layer: profile, abstract: false, uml_base: Dependency, section: 9.6.1 p. 87, definition: Documents an inferential relationship (an inference between goals) or an evidential relationship (a goal and the evidence that substantiates it).}
    IndependenceRequirement:
