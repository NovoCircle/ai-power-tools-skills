executable_marker:
  stereotype: BusinessProcess
  tag: isExecutable
  values:
  - 'true'
  - 'false'
  default: none (empty until set)
conventions:
  containment: 'ParentID chain: a Pool is a child of its CollaborationModel or BusinessProcess, a Lane of its Pool (or Lane),
    an Activity or event of its Lane or Pool; an edge-mounted event is a child of its activity'
  composite_diagrams: creating a BPELProcess, BusinessProcess, ChoreographyModel, CollaborationModel or ConversationModel
    element also creates a diagram of the matching type as its child
  event_forms: StartEvent, IntermediateEvent and EndEvent exist stand-alone (Object_Type Event) and edge-mounted (Object_Type
    ObjectNode, ParentID = host)
  defaults_stored: every tag is created with the shipped default as its value; a tag with allowed values but no default is
    stored empty
  message_flow_orientation: a MessageFlow is stored from its sender to its receiver (Start_Object_ID = sender)
  choreography_participants: numberOfParticipants is 2, 3 or 4; the standard allows two or more
  name_collisions: EA's BPMN 1.0 and 1.1 technologies declare the same short names for Activity, BusinessProcess, DataObject,
    EndEvent, Gateway, Group, IntermediateEvent, Lane, Message, MessageFlow, Participant, Pool, Property, SequenceFlow, StartEvent
    and TextAnnotation
harvest:
  shipped-xml:
  - stereotypes, tagged values with allowed values and defaults, tagged value types, diagram types, toolbox profiles with
    pages and items, model templates, quick-link rules
  sample-content:
  - stored metaclass (Object_Type), binding (t_xref FQName), tagged values with Values and Default notes, event forms, composite
    diagrams, connector and attribute stereotypes, diagram types (t_diagram, StyleEx MDGDgm)
  ui: 'measured on EA 17.1 build 1716, 2026-11-04: the Resources tab (MDG Technologies > System Technologies > BPMN 2.0) lists
    59 rows in the BPMN2.0 profile; MessageFlowAssociation, declared with no metaclass, is not among them; StartEvent, IntermediateEvent
    and EndEvent are listed twice each (stand-alone and edge-mounted); the GlobalTask declaration shows as a second Activity
    row; every other harvested name is present. The tab holds only stereotypes that apply to a metaclass. Diagram Types (5)
    and Toolboxes (4) matched the harvest. The Collaboration toolbox matched the harvest (14 items, 4 connectors, 24 types)
    once the harvest''s stray ''true'' entry, a parse artifact and not a toolbox item, is set aside; the other three toolboxes
    were not opened. Five quick-link pairs from an Activity matched the rule table (Message Flow to a Pool, Sequence Flow
    to a Gateway, Data Output and Data Input Association to a Data Object, Conversation Link to a Conversation, Association
    to a Message).'
  ea_build: 17.1 build 1716
