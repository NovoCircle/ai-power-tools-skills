ea_only:
  IsExpanded: 'tag on Stage, PlanFragment and PlanningTable: draws the minus (expanded) or plus (collapsed) marker; not a CMMN concept'
  ShowLabel: 'tag on CaseFileItem, both event listeners, both criteria and PlanningTable: shows the name on the shape; not a CMMN concept'
  Is* flags: IsRequired, IsRepetition, IsManualActivation, IsAutoComplete, IsDiscretionary are booleans EA draws as decorators and a
    dashed border; the standard's rules carry expressions, EA stores only whether one exists
  ports: criteria and planning tables are Port elements that are children of their host (t_object.ParentID), not properties of it
