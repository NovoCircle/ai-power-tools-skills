notes: 'BPMN 2.0.2 describes a notation, a metamodel with an interchange format, a diagram-interchange model, execution semantics (Clause 13) and a mapping of a subset to WS-BPEL (Clause 14). Concept names follow the schema; the standard''s own variants that are a class plus a condition are under concepts.variants. Multiplicity keys on relationships.references: targets_per_source is how many target instances one source instance may link to; sources_per_target is how many source instances one target instance may link to; ''*'' means zero or more; a reference with no multiplicity states none. Tool-specific encodings of these concepts belong in the tool''s own file, not here.'

# Our conventions for drawing this language, kept apart from `notation`, which holds only what the standard states.
# Sizes and spacing come from the shared layout standard; this block says which size class each concept takes.
# A concept not listed here is a plain rectangle (box) or has no shape of its own (see `notation`).
layout:
  basis: Our conventions, not this standard's. Sizes and spacing come from the shared layout standard.
  element_types:
    Event: event-circle
    CatchEvent: event-circle
    ThrowEvent: event-circle
    StartEvent: event-circle
    IntermediateCatchEvent: event-circle
    IntermediateThrowEvent: event-circle
    BoundaryEvent: event-circle
    EndEvent: event-circle
    SubProcess: large-box
    AdHocSubProcess: large-box
    Transaction: large-box
    Gateway: decision-diamond
    ExclusiveGateway: decision-diamond
    InclusiveGateway: decision-diamond
    ParallelGateway: decision-diamond
    ComplexGateway: decision-diamond
    EventBasedGateway: decision-diamond
    DataObject: data-item
    DataObjectReference: data-item
    DataInput: data-item
    DataOutput: data-item
    DataStore: data-item
    DataStoreReference: data-item
    Message: data-item
    Participant: container
    Lane: container
    Group: container
    TextAnnotation: note
    ChoreographyTask: large-box
    SubChoreography: large-box
    CallChoreography: large-box
    Conversation: decision-diamond
    SubConversation: decision-diamond
    CallConversation: decision-diamond
  exceptions: {}
  diagram_types:
    Process:
      arrangement: lanes
      route: orthogonal
      title: frame-header
      channels:
        fill: Kind of node. Events, activities, gateways and data read differently. Conventional, since
          the standard fixes the shapes and not the colors.
        claimed:
          position: Two things at once. The lane an element sits in says who does it, and how far along
            the flow it sits says when.
          size: Kind of node. An event is a circle because it is an event, so size is not a free channel.
        free:
        - border
        - border_width
        - line_color
        - font_color
        - opacity
        - icon
    Collaboration:
      arrangement: lanes
      route: orthogonal
      title: frame-header
      channels:
        fill: Kind of node, as in a process diagram.
        claimed:
          position: The pool says which participant; position along the flow says when.
          size: Kind of node.
        free:
        - border
        - border_width
        - line_color
        - font_color
        - opacity
        - icon
    Choreography:
      arrangement: lanes
      route: orthogonal
      title: frame-header
      channels:
        fill: The initiator. The shaded participant band says who starts the exchange, which is the point
          of the notation.
        claimed:
          position: Order of the exchange.
          size: Kind of node.
        free:
        - border
        - border_width
        - line_color
        - font_color
        - opacity
        - icon
  viewpoints: {}
