# Risk Analysis and Assessment Modeling Language (RAAML) 1.0: language file (schema_version 1).
# Written from the standard only. Concept names are the standard's own names (no spaces), except four guideword classes that share a name across packages: STPAEarly, STPALate, ISO26262Early and ISO26262Late (each is Early or Late in the standard).
# Keys beyond the base language-file layout, in the same sense as the SysML language file: extends, newer_versions, concepts.groups, concepts.elements[].group / .kind / .layer / .marker / .uml_base / .specializes_external / .attributes / .basis,
#   relationships.items[].kind / .generalizes, diagram_types[].form / .reused_from / .admits_note, viewpoints, constraints[].category / .checkable / .applies_when.
#   constraints[].checkable : static = a validator that sees only the saved model can check it; partial = structure or simple cases only; runtime = needs instances or an executing model; none = not a property of a model.
#   constraints[].applies_when : omitted = always; otherwise the condition under which the rule applies.
#   Strength policy: must = error, should = warning, note = advice only.
schema_version: 1
id: raaml-1
name: Risk Analysis and Assessment Modeling Language (RAAML)
owner: {name: Object Management Group, kind: standards-body}
standard: {name: Risk Analysis and Assessment Modeling Language (RAAML), version: '1.0', status: published, reference: 'OMG formal/22-12-06 (specification PDF; the About page gives April 2023, the cover December 2022); normative machine-readable models ptc/21-12-05 to ptc/21-12-17 under RAAML/20211101; informative examples ptc/21-11-22. https://www.omg.org/spec/RAAML/1.0/', kind: 'profile of UML 2.5.1 and SysML 1.6 together with model libraries; the language reuses SysML and adds situations, causality and method packages for safety and reliability analysis'}
newer_versions:
- {version: '1.1', date: December 2025, url: 'https://www.omg.org/spec/RAAML/1.1'}
- {version: 1.2 beta, date: September 2026, url: 'https://www.omg.org/spec/RAAML/1.2/Beta1', note: 'Beta status. The About page names security, reliability block diagram and functional hazard assessment content. Not researched here.'}
extends: {language: sysml-1, version: '1.5', note: 'RAAML is built on SysML. RAAML 1.0 cites SysML 1.6; the SysML language skill describes 1.5. This file names the SysML concepts RAAML reuses (under specializes_external and in relationship endpoints written sysml-1:Name) and does not re-describe them: Block, ConstraintBlock, Requirement, AbstractRequirement, DeriveReqt, Satisfy, Rationale, DirectedRelationshipPropertyPath, plus ValueType, value properties, part properties and the block definition, internal block, parametric and requirement diagrams. UML metaclasses named under uml_base are defined by UML.'}
concepts:
  source: 'OMG RAAML 1.0: the catalog of clause 9 (9.1 Core, 9.2 General, 9.3 FMEA, 9.4 FTA, 9.5 STPA, 9.6 GSN, 9.7 ISO 26262), with generalizations, abstractness and multiplicities checked against the thirteen normative machine-readable models. Where the text and the models disagree this file follows the models.'
  count: 153
  layer_note: 'layer says where a concept is defined: library (a class users specialize), profile (a marker element that extends a UML metaclass) or both under one name. A library class that carries a marker names it under marker. A name that is both a library class and a profile element is one concept here.'
  groups:
    Core: {defined_by: 'Clauses 9.1.1, 9.1.2', notes: 'The situation marker, the root of all situations, the identifier carrier, and the profile relationships relevant to, violates and controlling measure. The causality link is a relationship (see relationships).'}
    General: {defined_by: 'Clauses 9.2.1, 9.2.2', notes: 'Events, causes, effects, failure modes, hazards, scenarios and risks shared by all methods; errors, faults and the kinds of controlling measure.'}
    FMEA: {defined_by: 'Clauses 9.3.1, 9.3.2', notes: 'The FMEA item, the RPN formula and seven classes of failure mode.'}
    FTA events: {defined_by: 'Clauses 9.4.1, 9.4.2', notes: 'The fault tree, its elements and its events.'}
    FTA gates: {defined_by: 'Clauses 9.4.1, 9.4.2', notes: The seven gates.}
    FTA constraint blocks: {defined_by: Clause 9.4.1 (ConstraintBlocks), notes: Reference probability formulas for the gates.}
    FTA markers: {defined_by: Clause 9.4.2, notes: 'Tree, transfer-in and transfer-out.'}
    STPA: {defined_by: 'Clauses 9.5.1, 9.5.2', notes: 'Unsafe control actions and their guidewords, process models, factors, losses, loss scenarios, and the control structure elements.'}
    GSN: {defined_by: Clause 9.6.1, notes: 'The core notation of the Goal Structuring Notation, version 2.'}
    ISO 26262 operational situations: {defined_by: Clause 9.7.1, notes: Operational conditions and situations.}
    ISO 26262 value types: {defined_by: 'Clauses 9.7.1, 9.7.2', notes: 'Exposure, severity, controllability and ASIL.'}
    ISO 26262 malfunctions and hazards: {defined_by: Clause 9.7.1, notes: 'Malfunction classes, effects, accident scenarios, hazardous events and the safety requirement template.'}
    ISO 26262 profile: {defined_by: Clause 9.7.2, notes: 'Markers for operational situations, malfunctions, verification, assignment and rationale.'}
    ISO 26262 requirements: {defined_by: Clause 9.7.2 (RequirementManagement), notes: Safety requirement kinds and the relations between requirements and states.}
  elements:
    AnySituation:
      display: Any Situation
      group: Core
      kind: situation
      layer: library
      abstract: true
      marker: Situation
      section: 9.1.1 p. 20
      definition: The universal root of all situations. A situation stands for a set of occurrences of some type, where the system, place, time and state are given by classifiers rather than by individual descriptions.
      attributes:
      - {name: from, type: AnySituation, multiplicity: 0..*, note: a situation that precedes the one at the other end of Causality}
      - {name: to, type: AnySituation, multiplicity: 0..*, note: a situation that follows}
    Situation:
      display: Situation
      group: Core
      kind: profile element
      layer: profile
      specializes_external:
      - {language: sysml-1, concept: Block}
      abstract: false
      uml_base: Class
      section: 9.1.2 p. 22
      definition: The profile element that marks a block as a situation. It adds nothing but the distinction between situations and other blocks; a situation keeps the block features of generalization, parts, value properties and parametrics.
    ControllingMeasure:
      display: Controlling Measure
      group: Core
      kind: relationship profile element
      layer: profile
      specializes_external:
      - {language: sysml-1, concept: DirectedRelationshipPropertyPath}
      abstract: true
      uml_base: Dependency
      section: 9.1.2 p. 23
      definition: 'A measure taken against an actual or possible adverse situation: it lowers severity, lowers the probability of occurrence, or raises the probability of detection. Modeled as a dependency whose supplier is the situation addressed.'
      attributes:
      - {name: affects, type: Property, multiplicity: 0..*, note: 'a quantitative attribute of the situation that this measure influences, typically improves'}
    IDCarrier:
      display: ID Carrier
      group: Core
      kind: profile element
      layer: profile
      abstract: false
      uml_base: Element
      section: 9.1.2 p. 24
      definition: A profile element that carries a human-readable identifier for any element.
      attributes:
      - {name: Id, type: String, multiplicity: '1', note: human-readable identifier}
      note: The text lists IDCarrier under the ISO 26262 profile package; the machine-readable model places it in the Core profile.
    AbstractEvent:
      display: Abstract Event
      group: General
      kind: situation
      layer: library
      specializes: AnySituation
      abstract: true
      marker: Situation
      section: 9.2.1 p. 25
      definition: Anything that causes a change in the system under analysis or its environment, with an identifiable starting point in time.
      attributes:
      - {name: likelihood, type: (untyped), multiplicity: '1', note: placeholder for likelihood of occurrence; deliberately left untyped for method developers to specialize}
    AbstractCause:
      display: Abstract Cause
      group: General
      kind: situation
      layer: library
      specializes: AbstractEvent
      abstract: true
      marker: Situation
      section: 9.2.1 p. 25
      definition: A precursor event that activates other events; the root of all causes. Methods derive typed kinds of cause.
      attributes:
      - {name: occurrence, type: (untyped), multiplicity: '1', note: how often the situation occurs; redefines likelihood}
      - {name: premitigationOccurrences, type: (untyped), multiplicity: 0..*, note: how often it occurred before mitigation}
    Cause:
      display: Cause
      group: General
      kind: situation
      layer: library
      specializes: AbstractCause
      abstract: true
      marker: Situation
      section: 9.2.1 p. 26
      definition: The concrete cause whose occurrence is a Real number.
      attributes:
      - {name: occurrence, type: Real, multiplicity: '1', note: redefines occurrence}
      - {name: premitigationOccurrences, type: Real, multiplicity: 0..*, note: redefines premitigationOccurrences}
    DysfunctionalEvent: {display: Dysfunctional Event, group: General, kind: situation, layer: library, specializes: AbstractEvent, abstract: true, marker: Situation, section: 9.2.1 p. 27, definition: 'An event whose occurrence can cause dysfunctional behavior of a system or part of it. Generalizes failure, feared event and similar terms of domain safety standards.'}
    UndesiredState: {display: Undesired State, group: General, kind: situation, layer: library, specializes: DysfunctionalEvent, abstract: true, marker: Situation, section: 9.2.1 p. 34, definition: An element's condition at a specific time that represents an unintended situation.}
    AbstractFailureMode:
      display: Abstract Failure Mode
      group: General
      kind: situation
      layer: library
      specializes: UndesiredState
      abstract: true
      marker: FailureMode
      section: 9.2.1 p. 27
      definition: The manner in which a system or a part of one can fail; the root of all failure modes. Methods derive typed kinds.
      attributes:
      - {name: detectability, type: (untyped), multiplicity: '1', note: how easy it is to detect this failure mode}
      - {name: premitigationDetectabilities, type: (untyped), multiplicity: 0..*, note: detectability under the previous design iteration}
    FailureMode:
      display: Failure Mode
      group: General
      kind: situation
      layer: library and profile
      specializes: AbstractFailureMode
      abstract: true
      uml_base: Class
      marker: FailureMode
      section: 9.2.1 p. 28; 9.2.2 p. 34
      definition: The concrete failure mode whose detectability is a Real number. A failure is an instance of a failure mode. Also available as a profile element that marks a situation as a failure mode.
      attributes:
      - {name: detectability, type: Real, multiplicity: '1', note: redefines detectability}
      - {name: premitigationDetectabilities, type: Real, multiplicity: 0..*, note: redefines premitigationDetectabilities}
      note: The library class is abstract; the profile element generalizes Situation and is not abstract.
    AbstractEffect:
      display: Abstract Effect
      group: General
      kind: situation
      layer: library
      specializes: DysfunctionalEvent
      abstract: true
      marker: Situation
      section: 9.2.1 p. 28
      definition: A dysfunctional event that is the result or consequence of another situation; the root of all effects. Methods derive typed kinds.
      attributes:
      - {name: severity, type: (untyped), multiplicity: '1', note: estimate of the extent of harm}
      - {name: premitigationSeverities, type: (untyped), multiplicity: 0..*, note: extent of harm under previous design iterations}
    Effect:
      display: Effect
      group: General
      kind: situation
      layer: library
      specializes: AbstractEffect
      abstract: true
      marker: Situation
      section: 9.2.1 p. 29
      definition: The concrete effect whose severity is a Real number.
      attributes:
      - {name: severity, type: Real, multiplicity: '1', note: redefines severity}
      - {name: premitigationSeverities, type: Real, multiplicity: 0..*, note: redefines premitigationSeverities}
    HarmPotential: {display: Harm Potential, group: General, kind: situation, layer: library, specializes: AnySituation, abstract: true, marker: Situation, section: 9.2.1 p. 32, definition: 'A state in which harm is possible, from malicious or non-malicious causes.'}
    Hazard: {display: Hazard, group: General, kind: situation, layer: library, specializes: HarmPotential, abstract: true, marker: Situation, section: 9.2.1 p. 32, definition: 'A potential source of harm (non-malicious). Covers danger to persons within a short time, such as fire, and long-term health effects, such as release of a toxic substance.'}
    Scenario:
      display: Scenario
      group: General
      kind: situation
      layer: library
      specializes: AnySituation
      abstract: true
      marker: Situation
      section: 9.2.1 p. 32
      definition: A composite situation made of several steps that are themselves situations. Steps should be ordered by Causality or a specialization of it.
      attributes:
      - {name: scenarioStep, type: AnySituation, multiplicity: 0..*, note: a situation that is part of the scenario (composite)}
    AbstractRisk:
      display: Abstract Risk
      group: General
      kind: situation
      layer: library
      specializes: Scenario
      abstract: true
      marker: Situation
      section: 9.2.1 p. 33
      definition: A scenario that combines a harm potential (a hazard or vulnerability), a triggering event and the resulting harm. A placeholder for method-specific kinds of risk.
      attributes:
      - {name: score, type: (untyped), multiplicity: '1', note: combination of probability and severity of harm; for example a risk priority number}
      - {name: trigger, type: AbstractEvent, multiplicity: 0..*, note: triggering event that makes harm materialize; subsets scenarioStep}
      - {name: harm, type: AbstractEffect, multiplicity: 0..*, note: resulting harm; subsets scenarioStep}
      - {name: harmPotential, type: HarmPotential, multiplicity: 0..*, note: pre-existing risk; subsets scenarioStep}
    Error: {display: Error, group: General, kind: profile element, layer: profile, specializes: Situation, abstract: false, uml_base: Class, section: 9.2.2 p. 34, definition: 'The discrepancy between a computed, observed or measured value or condition and the true, specified or correct one. Marks a situation as an error.'}
    Fault: {display: Fault, group: General, kind: profile element, layer: profile, specializes: Situation, abstract: false, uml_base: Class, section: 9.2.2 p. 35, definition: 'An abnormal condition that can reduce or remove the ability of a functional unit to do its job, or cause an element or system to fail. Marks a situation as a fault.'}
    Detection: {display: Detection, group: General, kind: relationship profile element, layer: profile, specializes: ControllingMeasure, abstract: false, uml_base: Dependency, section: 9.2.2 p. 35, definition: 'A controlling measure taken to raise the probability of detecting the situation under analysis; in hardware, for example built-in diagnostic tests or physical inspection.'}
    Prevention: {display: Prevention, group: General, kind: relationship profile element, layer: profile, specializes: ControllingMeasure, abstract: false, uml_base: Dependency, section: 9.2.2 p. 36, definition: A controlling measure taken to lower the probability that the situation under analysis occurs.}
    Mitigation: {display: Mitigation, group: General, kind: relationship profile element, layer: profile, specializes: ControllingMeasure, abstract: false, uml_base: Dependency, section: 9.2.2 p. 36, definition: A controlling measure taken to lower the severity of the situation under analysis.}
    Recommendation: {display: Recommendation, group: General, kind: relationship profile element, layer: profile, specializes: ControllingMeasure, abstract: false, uml_base: Dependency, section: 9.2.2 p. 37, definition: 'A controlling measure that connects a situation to an action item, normally a requirement but possibly weaker advice such as a comment or rationale.'}
    FailureState: {display: Failure State, group: General, kind: profile element, layer: profile, abstract: false, uml_base: State, section: 9.2.2 p. 37, definition: A state the system or a part of it enters after a failure mode occurs. Useful in methods based on state machines; can be tied to failure modes by RelevantTo.}
    Undeveloped: {display: Undeveloped, group: General, kind: profile element, layer: profile, abstract: false, uml_base: Element, section: 9.2.2 p. 38, definition: 'Marks an incomplete concept: a goal or strategy that is not fully developed, or a basic event in a fault tree.'}
    AbstractFMEAItem:
      display: Abstract FMEA Item
      group: FMEA
      kind: situation
      layer: library
      specializes: AbstractRisk
      abstract: true
      marker: FMEAItem
      section: 9.3.1 p. 38
      definition: A risk scenario made of one failure mode, one or more causes and one or more final effects. It stores the assessed risk priority number and earlier values.
      attributes:
      - {name: RPN, type: (untyped), multiplicity: '1', note: risk priority number; redefines score}
      - {name: failureMode, type: AbstractFailureMode, multiplicity: '1', note: the failure mode reached when an element fails; subsets scenarioStep}
      - {name: cause, type: AbstractCause, multiplicity: 1..*, note: cause of the failure; subsets scenarioStep}
      - {name: finalEffect, type: AbstractEffect, multiplicity: 1..*, note: effect at the system boundary; redefines harm}
      - {name: previousRPNValues, type: (untyped), multiplicity: 0..*, note: risk priority numbers assessed before mitigation}
      - {name: harmPotential, type: HarmPotential, multiplicity: '0', note: 'redefined to multiplicity zero: not used in FMEA'}
    FMEAItem:
      display: FMEA Item
      group: FMEA
      kind: situation
      layer: library and profile
      specializes: AbstractFMEAItem
      specializes_external:
      - {language: sysml-1, concept: Block}
      abstract: true
      uml_base: Class
      marker: FMEAItem
      section: 9.3.1 p. 39; 9.3.2 p. 43
      definition: The concrete FMEA item with Real-valued attributes, linked to an RPN formula. Also a profile element that marks a block as an FMEA item.
      attributes:
      - {name: finalEffect, type: Effect, multiplicity: 1..*, note: redefines finalEffect}
      - {name: cause, type: Cause, multiplicity: 1..*, note: redefines cause}
      - {name: RPN, type: Real, multiplicity: '1', note: redefines RPN}
      - {name: failureMode, type: FailureMode, multiplicity: '1', note: redefines failureMode}
      - {name: calculation, type: RPNCalculation, multiplicity: '1', note: link to the RPN formula}
      - {name: previousRPNValues, type: Real, multiplicity: 0..*, note: redefines previousRPNValues}
      note: The library class is abstract; the profile element generalizes Block and is not abstract.
    RPNCalculation:
      display: RPN Calculation
      group: FMEA
      kind: constraint block
      layer: library
      specializes_external:
      - {language: sysml-1, concept: ConstraintBlock}
      abstract: false
      marker: ConstraintBlock
      section: 9.3.1 p. 40
      definition: 'A constraint block holding the RPN formula: occurrence times detectability times severity.'
      attributes:
      - {name: RPN, type: Real, multiplicity: '1', note: risk priority number}
      - {name: SEV, type: Real, multiplicity: '1', note: severity}
      - {name: OCC, type: Real, multiplicity: '1', note: occurrence}
      - {name: DET, type: Real, multiplicity: '1', note: detectability}
    LossOfFunction: {display: Loss Of Function, group: FMEA, kind: situation, layer: library, specializes: FailureMode, abstract: true, marker: FailureMode, section: 9.3.1 p. 41, definition: 'A failure mode of lost function: the function is inoperable or suddenly fails.'}
    DegradationOfFunction: {display: Degradation Of Function, group: FMEA, kind: situation, layer: library, specializes: FailureMode, abstract: true, marker: FailureMode, section: 9.3.1 p. 41, definition: A failure mode of function that degrades or is lost over time.}
    IntermittentFunction: {display: Intermittent Function, group: FMEA, kind: situation, layer: library, specializes: FailureMode, abstract: true, marker: FailureMode, section: 9.3.1 p. 42, definition: 'A failure mode of function that works intermittently, with random stops and starts.'}
    PartialFunction: {display: Partial Function, group: FMEA, kind: situation, layer: library, specializes: FailureMode, abstract: true, marker: FailureMode, section: 9.3.1 p. 42, definition: A failure mode of partial function or loss of performance.}
    UnintendedFunction: {display: Unintended Function, group: FMEA, kind: situation, layer: library, specializes: FailureMode, abstract: true, marker: FailureMode, section: 9.3.1 p. 42, definition: 'A failure mode of unintended function: wrong time, unintended direction or unequal performance.'}
    ExceedingFunction: {display: Exceeding Function, group: FMEA, kind: situation, layer: library, specializes: FailureMode, abstract: true, marker: FailureMode, section: 9.3.1 p. 43, definition: A failure mode in which a function exceeds acceptable operational performance.}
    DelayedFunction: {display: Delayed Function, group: FMEA, kind: situation, layer: library, specializes: FailureMode, abstract: true, marker: FailureMode, section: 9.3.1 p. 43, definition: 'A failure mode of function that runs late, after an unintended time interval.'}
    FTAElement:
      display: FTA Element
      group: FTA events
      kind: situation
      layer: library
      specializes: DysfunctionalEvent
      abstract: true
      marker: Situation
      section: 9.4.1 p. 44
      definition: Any event or gate needed to evaluate the probability of the top event.
      attributes:
      - {name: probability, type: Real, multiplicity: '1', note: 'probability that the event represented by the element occurs, a value from 0 to 1; redefines likelihood'}
    FTATree:
      display: FTA Tree
      group: FTA events
      kind: situation
      layer: library
      specializes: [FTAElement, Scenario]
      abstract: false
      marker: Tree
      section: 9.4.1 p. 45
      definition: A collection of fault tree elements and their interrelationships for evaluating the probability of a top event.
      attributes:
      - {name: topEvent, type: Event, multiplicity: '1', note: the undesired event that leads to failure of the system (composite)}
    Event:
      display: Event
      group: FTA events
      kind: situation
      layer: library and profile
      specializes: FTAElement
      abstract: true
      uml_base: [Class, Property]
      marker: Situation
      section: 9.4.1 p. 45; 9.4.2 p. 57
      definition: Base kind of all fault tree events; a kind of dysfunctional event. Also available as an abstract profile element for classes and properties.
      attributes:
      - {name: priority, type: Integer, multiplicity: 0..1, note: order of this event among the inputs of a priority-AND (SEQ) gate}
      - {name: target Gate, type: Gate, multiplicity: '1', note: the gate the event feeds (output association)}
    BasicEvent:
      display: Basic Event
      group: FTA events
      kind: situation
      layer: library and profile
      specializes: Event
      abstract: false
      uml_base: [Class, Property]
      marker: BasicEvent
      section: 9.4.1 p. 46; 9.4.2 p. 58
      definition: A basic initiating failure that needs no further development.
    IntermediateEvent:
      display: Intermediate Event
      group: FTA events
      kind: situation
      layer: library and profile
      specializes: Event
      abstract: false
      uml_base: [Class, Property]
      marker: IntermediateEvent
      section: 9.4.1 p. 46; 9.4.2 p. 67
      definition: A failure that occurs because of one or more antecedent events acting through gates. Its probability is derived by the gate.
      attributes:
      - {name: probability, type: Real, multiplicity: '1', note: derived by the gate; redefines probability}
    TopEvent:
      display: Top Event
      group: FTA events
      kind: situation
      layer: library and profile
      specializes: Event
      abstract: false
      uml_base: [Class, Property]
      marker: TopEvent
      section: 9.4.1 p. 47; 9.4.2 p. 68
      definition: The undesired event (a failure or an effect) at the top of the fault tree. Its probability is the derived result of the tree calculation.
      attributes:
      - {name: probability, type: Real, multiplicity: '1', note: derived result; redefines probability}
    ConditionalEvent:
      display: Conditional Event
      group: FTA events
      kind: situation
      layer: library and profile
      specializes: Event
      abstract: false
      uml_base: [Class, Property]
      marker: ConditionalEvent
      section: 9.4.1 p. 47; 9.4.2 p. 59
      definition: A condition or restriction attached to a gate, used mainly with priority-AND and INHIBIT gates.
    DormantEvent:
      display: Dormant Event
      group: FTA events
      kind: situation
      layer: library and profile
      specializes: Event
      abstract: false
      uml_base: [Class, Property]
      marker: DormantEvent
      section: 9.4.1 p. 48; 9.4.2 p. 57
      definition: Like a basic event but a latent failure, found by periodic tests.
    UndevelopedEvent: {display: Undeveloped Event, group: FTA events, kind: situation, layer: library, specializes: Event, abstract: false, marker: BasicEvent together with Undeveloped, section: 9.4.1 p. 48, definition: An event not developed further because its consequence is small or information is missing.}
    HouseEvent:
      display: House Event
      group: FTA events
      kind: situation
      layer: library and profile
      specializes: Event
      abstract: false
      uml_base: [Class, Property]
      marker: HouseEvent
      section: 9.4.1 p. 48; 9.4.2 p. 61
      definition: An event that can be switched to occur or not occur; its probability is 0 or 1 and is set before evaluation.
      attributes:
      - {name: probability, type: HouseEventProbability, multiplicity: '1', note: 0 or 1; redefines probability}
    ZeroEvent:
      display: Zero Event
      group: FTA events
      kind: situation
      layer: library and profile
      specializes: Event
      abstract: false
      uml_base: [Class, Property]
      marker: ZeroEvent
      section: 9.4.1 p. 49; 9.4.2 p. 60
      definition: An event or condition that never occurs; its probability is always 0.
      attributes:
      - {name: probability, type: Real, multiplicity: '1', note: always 0; redefines probability}
    HouseEventProbability: {display: House Event Probability, group: FTA events, kind: value type, layer: library, abstract: false, section: 9.4.1 p. 49, definition: The value type that restricts a house event probability to 0 or 1., basis: xmi, note: Named in the machine-readable model; the text gives only the attribute type.}
    Gate:
      display: Gate
      group: FTA gates
      kind: situation
      layer: library and profile
      abstract: true
      uml_base: [Class, Property]
      marker: Situation
      section: 9.4.1 p. 49; 9.4.2 p. 57
      definition: A fault tree element that combines input event probabilities in a prescribed way to give the output event probability. Subtypes say which combination. Also an abstract profile element.
      attributes:
      - {name: source Event, type: Event, multiplicity: 0..*, note: input events (input association)}
      - {name: target Event, type: Event, multiplicity: '1', note: the output event (output association)}
      note: The text says a gate is a fault tree element, but the machine-readable model gives it no parent.
    AND:
      display: AND
      group: FTA gates
      kind: situation
      layer: library and profile
      specializes: Gate
      abstract: false
      uml_base: [Class, Property]
      marker: Block together with AND
      section: 9.4.1 p. 50; 9.4.2 p. 62
      definition: The output event occurs only if all input events occur.
    OR:
      display: OR
      group: FTA gates
      kind: situation
      layer: library and profile
      specializes: Gate
      abstract: false
      uml_base: [Class, Property]
      marker: Block together with OR
      section: 9.4.1 p. 50; 9.4.2 p. 62
      definition: The output event occurs if at least one input event occurs.
    NOT:
      display: NOT
      group: FTA gates
      kind: situation
      layer: library and profile
      specializes: Gate
      abstract: false
      uml_base: [Class, Property]
      marker: Block together with NOT
      section: 9.4.1 p. 51; 9.4.2 p. 66
      definition: The output event occurs if the input event does not occur.
    XOR:
      display: XOR
      group: FTA gates
      kind: situation
      layer: library and profile
      specializes: Gate
      abstract: false
      uml_base: [Class, Property]
      marker: Block together with XOR
      section: 9.4.1 p. 51; 9.4.2 p. 64
      definition: The output event occurs if exactly one input event occurs.
    SEQ:
      display: SEQ
      group: FTA gates
      kind: situation
      layer: library and profile
      specializes: Gate
      abstract: false
      uml_base: [Class, Property]
      marker: Block together with SEQ
      section: 9.4.1 p. 52; 9.4.2 p. 63
      definition: 'Priority AND: the output event occurs if all input events occur in a specific sequence.'
    INHIBIT:
      display: INHIBIT
      group: FTA gates
      kind: situation
      layer: library and profile
      specializes: Gate
      abstract: false
      uml_base: [Class, Property]
      marker: Block together with INHIBIT
      section: 9.4.1 p. 52; 9.4.2 p. 65
      definition: The output event occurs if the single input event occurs while an enabling condition is present.
      attributes:
      - {name: condition, type: Event, multiplicity: 0..*, note: enabling condition events}
    MAJORITY_VOTE:
      display: MAJORITY_VOTE
      group: FTA gates
      kind: situation
      layer: library and profile
      specializes: Gate
      abstract: false
      uml_base: [Class, Property]
      marker: Block together with MAJORITY_VOTE
      section: 9.4.1 p. 53; 9.4.2 p. 65
      definition: The output event occurs if a majority of the input events occurs. The majority threshold m is a parameter and need not be half the inputs.
      attributes:
      - {name: m, type: Integer, multiplicity: '1', note: number of input events that form a majority}
    ANDConstraintBlock:
      display: AND Constraint Block
      group: FTA constraint blocks
      kind: constraint block
      layer: library
      specializes_external:
      - {language: sysml-1, concept: ConstraintBlock}
      abstract: false
      marker: ConstraintBlock
      section: 9.4.1 (ConstraintBlocks) p. 53
      definition: 'Reference implementation of the AND gate: the product of the input probabilities, assuming independence.'
      attributes:
      - {name: output, type: Real, multiplicity: '1'}
      - {name: input, type: Real, multiplicity: 0..*, note: exactly 1 for NOT}
    ORConstraintBlock:
      display: OR Constraint Block
      group: FTA constraint blocks
      kind: constraint block
      layer: library
      specializes_external:
      - {language: sysml-1, concept: ConstraintBlock}
      abstract: false
      marker: ConstraintBlock
      section: 9.4.1 (ConstraintBlocks) p. 54
      definition: 'Reference implementation of the OR gate: one minus the probability that no input occurs, assuming independence (De Morgan).'
      attributes:
      - {name: output, type: Real, multiplicity: '1'}
      - {name: input, type: Real, multiplicity: 0..*, note: exactly 1 for NOT}
    SEQConstraintBlock:
      display: SEQ Constraint Block
      group: FTA constraint blocks
      kind: constraint block
      layer: library
      specializes_external:
      - {language: sysml-1, concept: ConstraintBlock}
      abstract: false
      marker: ConstraintBlock
      section: 9.4.1 (ConstraintBlocks) p. 54
      definition: 'Reference implementation of the SEQ gate: the product of the input probabilities; it cannot capture time dependence.'
      attributes:
      - {name: output, type: Real, multiplicity: '1'}
      - {name: input, type: Real, multiplicity: 0..*, note: exactly 1 for NOT}
    XORConstraintBlock:
      display: XOR Constraint Block
      group: FTA constraint blocks
      kind: constraint block
      layer: library
      specializes_external:
      - {language: sysml-1, concept: ConstraintBlock}
      abstract: false
      marker: ConstraintBlock
      section: 9.4.1 (ConstraintBlocks) p. 55
      definition: 'Reference implementation of the XOR gate: for two inputs a + b - 2ab, applied repeatedly for more.'
      attributes:
      - {name: output, type: Real, multiplicity: '1'}
      - {name: input, type: Real, multiplicity: 0..*, note: exactly 1 for NOT}
    INHIBITConstraintBlock:
      display: INHIBIT Constraint Block
      group: FTA constraint blocks
      kind: constraint block
      layer: library
      specializes_external:
      - {language: sysml-1, concept: ConstraintBlock}
      abstract: false
      marker: ConstraintBlock
      section: 9.4.1 (ConstraintBlocks) p. 55
      definition: 'Reference implementation of the INHIBIT gate: the product of the input and condition probabilities.'
      attributes:
      - {name: output, type: Real, multiplicity: '1'}
      - {name: input, type: Real, multiplicity: 0..*, note: exactly 1 for NOT}
    MAJORITY_VOTEConstraintBlock:
      display: MAJORITY_VOTE Constraint Block
      group: FTA constraint blocks
      kind: constraint block
      layer: library
      specializes_external:
      - {language: sysml-1, concept: ConstraintBlock}
      abstract: false
      marker: ConstraintBlock
      section: 9.4.1 (ConstraintBlocks) p. 56
      definition: 'Reference implementation of the MAJORITY_VOTE gate: the combined probability of all input combinations in which at least m inputs occur.'
      attributes:
      - {name: output, type: Real, multiplicity: '1'}
      - {name: input, type: Real, multiplicity: 0..*, note: exactly 1 for NOT}
    NOTConstraintBlock:
      display: NOT Constraint Block
      group: FTA constraint blocks
      kind: constraint block
      layer: library
      specializes_external:
      - {language: sysml-1, concept: ConstraintBlock}
      abstract: false
      marker: ConstraintBlock
      section: 9.4.1 (ConstraintBlocks) p. 56
      definition: 'Reference implementation of the NOT gate: one minus the input probability.'
      attributes:
      - {name: output, type: Real, multiplicity: '1'}
      - {name: input, type: Real, multiplicity: 0..*, note: exactly 1 for NOT}
    Tree: {display: Tree, group: FTA markers, kind: profile element, layer: profile, specializes: Situation, abstract: false, uml_base: Class, section: 9.4.2 p. 56, definition: A profile element that marks a class as a fault tree. It may be applied only to a class that specializes FTATree.}
    TransferIn: {display: Transfer In, group: FTA markers, kind: profile element, layer: profile, abstract: false, uml_base: Property, section: 9.4.2 p. 68, definition: 'A node in the current fault tree that says the tree continues in a separate fault tree, the TransferOut. Its type must be a TransferOut tree.'}
    TransferOut: {display: Transfer Out, group: FTA markers, kind: profile element, layer: profile, specializes: Tree, abstract: false, uml_base: Class, section: 9.4.2 p. 69, definition: A partial fault tree used as part of another fault tree through TransferIn. The computed top event probability of this tree is used as the probability of the TransferIn node.}
    UnsafeControlAction:
      display: Unsafe Control Action
      group: STPA
      kind: situation
      layer: library and profile
      specializes: UndesiredState
      abstract: true
      uml_base: Class
      marker: UnsafeControlAction
      section: 9.5.1 p. 74; 9.5.2 p. 79
      definition: A control action that, in a given context, may lead to an undesired result (a UCA). It has a controller (inferred from the model), a guideword (given by generalization), a control action (linked by RelevantTo) and a context (a sub-situation). Also a profile element that marks UCAs.
      attributes:
      - {name: Context, type: AbstractOperationalSituation, multiplicity: '1', note: context in which the control action leads to the undesired outcome}
      - {name: processModel, type: ProcessModel, multiplicity: 0..*, note: process models that lead to this UCA}
      - {name: harmPotential, type: HarmPotential, multiplicity: 0..*, note: harm potentials this UCA leads to}
      note: The library class generalizes UndesiredState and is abstract; the profile element generalizes Situation and is not abstract.
    OutOfSequence: {display: Out Of Sequence, group: STPA, kind: situation, layer: library, specializes: UnsafeControlAction, abstract: true, marker: UnsafeControlAction, section: 9.5.1 p. 69, definition: A guideword that classifies the kind of unsafe control action.}
    STPALate: {display: Late (STPA guideword), group: STPA, kind: situation, layer: library, specializes: UnsafeControlAction, abstract: true, marker: UnsafeControlAction, section: 9.5.1 p. 70, definition: A guideword that classifies the kind of unsafe control action., note: The standard names this class Late.}
    STPAEarly: {display: Early (STPA guideword), group: STPA, kind: situation, layer: library, specializes: UnsafeControlAction, abstract: true, marker: UnsafeControlAction, section: 9.5.1 p. 70, definition: A guideword that classifies the kind of unsafe control action., note: The standard names this class Early.}
    TooLong: {display: Too Long, group: STPA, kind: situation, layer: library, specializes: UnsafeControlAction, abstract: true, marker: UnsafeControlAction, section: 9.5.1 p. 70, definition: A guideword that classifies the kind of unsafe control action.}
    TooShort: {display: Too Short, group: STPA, kind: situation, layer: library, specializes: UnsafeControlAction, abstract: true, marker: UnsafeControlAction, section: 9.5.1 p. 71, definition: A guideword that classifies the kind of unsafe control action.}
    Provided: {display: Provided, group: STPA, kind: situation, layer: library, specializes: UnsafeControlAction, abstract: true, marker: UnsafeControlAction, section: 9.5.1 p. 71, definition: A guideword that classifies the kind of unsafe control action.}
    NotProvided: {display: Not Provided, group: STPA, kind: situation, layer: library, specializes: UnsafeControlAction, abstract: true, marker: UnsafeControlAction, section: 9.5.1 p. 71, definition: A guideword that classifies the kind of unsafe control action.}
    LossScenario:
      display: Loss Scenario
      group: STPA
      kind: situation
      layer: library and profile
      specializes: Scenario
      abstract: true
      uml_base: Class
      marker: LossScenario
      section: 9.5.1 p. 72; 9.5.2 p. 81
      definition: A sequence of situations that starts from factors, passes through process model deficiencies, and leads to an unsafe control action (and on to risks and possibly losses). Also a profile element that marks loss scenarios.
      attributes:
      - {name: Factor, type: Factor, multiplicity: 0..*, note: steps; subsets scenarioStep (composite)}
      - {name: unsafeControlAction, type: UnsafeControlAction, multiplicity: 0..*, note: steps; subsets scenarioStep}
      - {name: processModel, type: ProcessModel, multiplicity: 0..*, note: steps; subsets scenarioStep (composite)}
      note: The library class is abstract; the profile element generalizes Situation and is not abstract.
    ProcessModel:
      display: Process Model
      group: STPA
      kind: situation
      layer: library
      abstract: false
      marker: Situation
      section: 9.5.1 p. 72
      definition: A process or control loop model that may lead to an unsafe control action. Its four kinds name the section of the control loop at fault. Often called a (high-level) scenario in STPA theory.
      attributes:
      - {name: Factor, type: Factor, multiplicity: 0..*}
      - {name: unsafeControlAction, type: UnsafeControlAction, multiplicity: 0..*}
      note: The text gives ProcessModel no parent; the machine-readable model also gives none, although its kinds are said to be situations.
    InadequateControllerDecisions: {display: Inadequate Controller Decisions, group: STPA, kind: situation, layer: library, specializes: ProcessModel, abstract: true, marker: Situation, section: 9.5.1 p. 73, definition: A kind of process flaw (process model deficiency).}
    InadequateControlExecution: {display: Inadequate Control Execution, group: STPA, kind: situation, layer: library, specializes: ProcessModel, abstract: true, marker: Situation, section: 9.5.1 p. 73, definition: A kind of process flaw (process model deficiency).}
    InadequateProcessBehavior: {display: Inadequate Process Behavior, group: STPA, kind: situation, layer: library, specializes: ProcessModel, abstract: true, marker: Situation, section: 9.5.1 p. 73, definition: A kind of process flaw (process model deficiency).}
    InadequateFeedbackAndInputs: {display: Inadequate Feedback And Inputs, group: STPA, kind: situation, layer: library, specializes: ProcessModel, abstract: true, marker: Situation, section: 9.5.1 p. 74, definition: A kind of process flaw (process model deficiency).}
