  section: 13.2.3.5
  checkable: static
  source: 'prose: behavior-method-of-one-feature'
- id: UML-SEM-011
  statement: A method has parameters corresponding to the parameters of its operation, or to the attributes of the signal of its reception; how they are matched (exact, covariant, contravariant) is not fixed.
