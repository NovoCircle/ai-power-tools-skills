# Value Delivery Modeling Language (VDML) 1.0: language file (schema_version 1).
# Written from the standard only. Concept names are the standard's own UML class names (no spaces).
# Tool-neutral: no tool facts live here.
schema_version: 1
id: vdml-1
name: Value Delivery Modeling Language (VDML)
owner:
  name: Object Management Group
  kind: standards-body
standard:
  name: Value Delivery Modeling Language (the 1.0 document is titled Value Delivery Metamodel)
  version: '1.0'
  status: published
  reference: OMG formal/2015-10-05 (specification, October 2015); normative machine-readable model file id dtc/15-02-04 (vdml.xmi, dated 20150201); https://www.omg.org/spec/VDML/1.0/
  conformance:
  - Full VDML conformance (2.1)
  - VDML Metamodel conformance (2.2)
  - VDML Collaboration Modeling conformance (2.3)
  newer_versions:
  - version: '1.1'
    published: March 2018
    reference: OMG formal/18-09-03; https://www.omg.org/spec/VDML/1.1/
    note: Not researched. A separate language file would be needed.
data_types:
  coverage: partial
  section: "7.2 and 8.9"
  note: "VDML has no data-type clause; its property tables use the names Boolean and String without defining them, it defines one enumeration (Influence), and it takes measured values such as durations and quantities from SMM."
  types:
    - {name: String, kind: primitive, section: "7.2.4.1.1", note: "Used by name (name, description, tag, value, text, strategy, location, type, channel, body, alias, represents); VDML does not define it."}
    - {name: Boolean, kind: primitive, section: "7.2.1.1.5", note: "Used by name (isLead, isCommon, isTangible, isIntermediate and others), with defaults; VDML does not define it."}
    - {name: Influence, kind: enumeration, values: [positive, negative], section: "8.9", note: "Property influence added to the SMM relationship between two measurements: positive means the other measurement rises when the base rises, negative means it falls."}
    - {name: percent, kind: unit, section: "7.2.1.3.2", note: "The unit of the measure behind a percentageWeight (7.2.1.3.2) and behind a planningPercentage (7.2.1.2.2, 7.2.4.3.1)."}
    - {name: Measurement, kind: other, section: "7.2.4.1.5", note: "Values such as duration, quantity, offset, batch size, inventory level, pool size, heat index, heat threshold, horizon, satisfaction level and weight are Measurements of a MeasuredCharacteristic, defined by SMM (7.2.6.2), not VDML data types."}
  attributes:
    coverage: some_concepts
    where: concepts
notation:
  coverage: normative
  section: "8"
  note: "Clause 8 gives a limited normative set of shapes for eight diagram kinds; colors in its examples carry no meaning (8.1), and a diagram is a view, so one concept can look different in different diagrams."
  elements:
    Role:
      shape: "oval with the role name inside (Role Collaboration, ValueProposition Exchange, Collaboration Structure); in an Activity Network a wide rectangle (a swim-lane) with a narrow strip on its left edge that holds the role name written bottom to top"
      marker: "expand button: a small square holding a plus sign, drawn on the lower edge of the oval; present when the Role is assigned to a Collaboration, absent when it is unassigned or assigned to an Actor or another Role"
      label: inside the oval, or in the strip of the swim-lane
      section: "8.2 (Figures 8.1, 8.2), 8.4 (Figure 8.11)"
    Position:
      shape: "oval with the role name inside, like a Role; in a Capability Management diagram it sits inside the boundary of an expanded OrgUnit and may carry the expand button"
      label: inside
      section: "8.8 (Figure 8.57)"
    Actor:
      shape: none
      marker: none
      label: "the actor name alone, as plain text, at the tail of the assignment connector"
      section: "8.5 (Figure 8.46)"
    Collaboration:
      shape: "rectangle with square corners, name inside"
      marker: none
      label: inside
      section: "8.5 (Figure 8.38)"
    BusinessNetwork:
      shape: "the Collaboration rectangle"
      marker: "small glyph in the top-left corner: three arrowheads radiating from one point, one pointing up and two pointing down and outward"
      label: inside
      section: "8.5 (Figure 8.39)"
    OrgUnit:
      shape: "the Collaboration rectangle; in a Capability Management diagram the name sits in a small rounded label on the top boundary instead of inside, and CapabilityOffers sit on the boundary"
      marker: "small glyph in the top-left corner: a short horizontal bar with a short stem rising from its middle and a short drop at each end, like a miniature organization chart"
      label: "inside, or in the rounded label on the top boundary (Capability Management)"
      section: "8.5 (Figures 8.40, 8.44), 8.8 (Figure 8.56)"
    CapabilityMethod:
      shape: "the Collaboration rectangle"
      marker: "small glyph in the top-left corner: two small rectangles side by side joined by a short horizontal line"
      label: inside
      section: "8.5 (Figure 8.41), 8.8"
    Community:
      shape: "the Collaboration rectangle"
      marker: "small glyph in the top-left corner: three small open circles, one above and two below"
      label: inside
      section: "8.5 (Figure 8.42)"
    Activity:
      shape: "rectangle with rounded corners, name inside"
      marker: "expand button: a small square holding a plus sign on the bottom edge; present when the Activity delegates its work to a Collaboration"
      label: inside
      section: "8.4 (Figures 8.12, 8.13)"
    Store:
      shape: "triangle with a flat top and the point downward, outline only"
      marker: none
      label: "name outside the shape, above it"
      section: "8.4 (Figure 8.14)"
    Pool:
      shape: "the Store triangle"
      marker: "re-use marker inside the triangle: a small circle with an arrowhead on its rim (a circular arrow)"
      label: "name outside the shape, above it"
      section: "8.4 (Figure 8.15)"
    InputPort:
      shape: "small square on the boundary of an Activity or Store, where the incoming flow connector ends; on a Collaboration, a free-floating triangle pointing right, outline only, in the Collaboration's own Activity Network diagram"
      marker: "variants of the square: a bar across it (splitter) when the port has a condition or planningPercentage; a thick border when it receives the roleResource for the performing Role (Activity only); both together when both apply"
      label: "name of the deliverable beside the incoming connector; for a Collaboration port, the library element name beside the triangle"
      section: "8.4 (table, Figures 8.22 to 8.25, 8.30, 8.31, 8.32)"
    OutputPort:
      shape: "small square on the boundary of an Activity or Store, where the outgoing flow connector starts; on a Collaboration, a free-floating triangle pointing right"
      marker: "variants of the square: filled solid when the port carries a ValueAdd; a bar across it (splitter) when the port has a condition or planningPercentage; filled with a bar when both apply. A Collaboration port is an outline triangle, or a solid triangle when it carries a ValueAdd"
      label: "name of the deliverable beside the outgoing connector; for a Collaboration port, the library element name beside the triangle"
      section: "8.4 (table, Figures 8.18 to 8.21, 8.26 to 8.29, 8.33, 8.34)"
    ValueAdd:
      shape: none
      marker: "no shape of its own: it is shown by filling the square of the OutputPort it belongs to (or the triangle of a Collaboration port)"
      label: none
      section: "8.4 (table)"
    ValueProposition:
      shape: "small square, outline only"
      marker: none
      label: "name outside the square, above it"
      section: "8.3 (Figure 8.7)"
    BusinessItem:
      shape: none
      marker: none
      label: "no shape of its own: its name is the label of the DeliverableFlow connector that carries it"
      section: "8.2, 8.4"
    Capability:
      shape: "rectangle with square corners, name inside"
      marker: "expand button: a small square on the bottom edge holding a plus sign when collapsed or a minus sign when expanded; a child Capability is drawn inside its parent's boundary"
      label: "inside; a parent's name sits at the top of its larger rectangle"
      section: "8.6 (Figures 8.48 to 8.51)"
    CapabilityDefinition:
      shape: "the Capability rectangle"
      marker: "as Capability"
      label: inside
      section: "8.6"
    CapabilityCategory:
      shape: "the Capability rectangle"
      marker: "as Capability"
      label: inside
      section: "8.6"
    CapabilityOffer:
      shape: "stretched hexagon: a wide six-sided shape with a point at the left and right ends"
      marker: none
      label: inside
      section: "8.8 (Figure 8.54)"
    MeasuredCharacteristic:
      shape: "rectangle with a thin border, name inside"
      marker: none
      label: inside
      section: "8.9 (Figure 8.63)"
  relationships:
    DeliverableFlow:
      line: "role view: solid line when isTangible is true, dashed line when it is false; activity view: solid line, with no tangible or intangible difference"
      target_end: "filled arrowhead at the recipient end"
      source_end: none
      label: "name of the deliverable (the BusinessItem); in the role view it may be followed by a colon and a sequence number, which is a convenience of the diagram and not of the model; in the role view it joins two role ovals and may be straight or curved; in the activity view it joins two ports or a port and a Store"
      section: "8.2 (Figures 8.3 to 8.5), 8.4 (Figure 8.16)"
    CollaborationInternalPortDelegation:
      line: "dotted line, joining a Collaboration port (triangle) to a port of one of its Activities"
      target_end: "small filled arrowhead pointing in the direction of the flow"
      source_end: none
      label: "name of the deliverable"
      section: "8.4 (Figures 8.17, 8.32, 8.33)"
    InputDelegation:
      line: "the dotted delegation line described under CollaborationInternalPortDelegation (drawn for a Collaboration's own internal delegations)"
      target_end: "small filled arrowhead"
      source_end: none
      label: "name of the deliverable"
      section: "8.4 (Figure 8.32)"
    OutputDelegation:
      line: "the dotted delegation line described under CollaborationInternalPortDelegation (drawn for a Collaboration's own internal delegations)"
      target_end: "small filled arrowhead"
      source_end: none
      label: "name of the deliverable"
      section: "8.4 (Figure 8.33)"
    ProviderProvidedProposition:
      line: "solid line from the providing Role oval to the ValueProposition square"
      target_end: "filled arrowhead at the square"
      source_end: none
      label: none
      section: "8.3 (Figure 8.8)"
    RecipientReceivedProposition:
      line: "solid line from the ValueProposition square to the receiving Role oval"
      target_end: "filled arrowhead at the Role"
      source_end: none
      label: none
      section: "8.3 (Figure 8.9)"
    CollaborationRole:
      line: "solid line, straight or with right-angle bends, from the Collaboration rectangle to the Role; the Role is a full oval at the end of the line, or, when the Role is assigned to another Collaboration, a small oval on the boundary of that Participant"
      target_end: none
      source_end: none
      label: "role name outside the oval"
      section: "8.5 (Figures 8.43, 8.44, 8.47)"
    Assignment:
      line: "dashed line, straight or with right-angle bends, from the Actor or the assigned-to Role to the assigned Role; a Role assigned to a Collaboration is shown by the containment line ending in a small oval on that Collaboration instead"
      target_end: "open arrowhead at the assigned Role"
      source_end: none
      label: none
      section: "8.5 (Figures 8.45, 8.46, 8.47)"
    ParticipantAssignment:
      line: "see Assignment: the same dashed directed line, or the small oval on the boundary of a Collaboration"
      target_end: "open arrowhead at the assigned Role"
      source_end: none
      label: none
      section: "8.5"
    RoleAssignment:
      line: "see Assignment: the same dashed directed line"
      target_end: "open arrowhead at the assigned Role"
      source_end: none
      label: none
      section: "8.5"
    ParentChildCapability:
      line: "no line: the child Capability rectangle is drawn inside the boundary of its parent's rectangle, or on a separate diagram"
      target_end: none
      source_end: none
      label: none
      section: "8.6 (Figures 8.49, 8.51)"
    CapabilityOfferCapability:
      line: "no line: in a Capability Heatmap a thick boundary on the Capability rectangle (and on its parents) means at least one CapabilityOffer for it has a heatIndex at or above the Scenario's heatThreshold; a normal boundary means below"
      target_end: none
      source_end: none
      label: none
      section: "8.7 (Figure 8.53)"
    CapabilityHeatIndex:
      line: "no line: see CapabilityOfferCapability, the thick boundary"
      target_end: none
      source_end: none
      label: none
      section: "8.7"
    ScenarioHeatThreshold:
      line: "no line: the threshold the heat index is compared with; see CapabilityOfferCapability"
      target_end: none
      source_end: none
      label: none
      section: "8.7"
    CapabilityProviderCapabilityOffer:
      line: "no line: the CapabilityOffer hexagon sits on the boundary of the OrgUnit that provides it"
      target_end: none
      source_end: none
      label: none
      section: "8.8 (Figure 8.56)"
    SupportedCapabilityMethod:
      line: "dashed line, straight or with right-angle bends, from the CapabilityOffer hexagon to the CapabilityMethod rectangle"
      target_end: none
      source_end: none
      label: none
      section: "8.8 (Figure 8.55)"
    CapabilityResource:
      line: "dashed line, straight or with right-angle bends, from the CapabilityOffer hexagon to the Store or Pool triangle"
      target_end: none
      source_end: none
      label: none
      section: "8.8 (Figure 8.55)"
    MethodOwnerMethod:
      line: "no line: when an OrgUnit is expanded its owned CapabilityMethods are drawn inside its boundary; a method of another OrgUnit may be drawn outside, joined by the dashed support line"
      target_end: none
      source_end: none
      label: none
      section: "8.8 (Figures 8.57 to 8.59)"
    StoreOwnerStore:
      line: "no line: when an OrgUnit is expanded its owned Stores and Pools are drawn inside its boundary; one of another OrgUnit may be drawn outside, joined by the dashed support line"
      target_end: none
      source_end: none
      label: none
      section: "8.8 (Figures 8.57 to 8.59)"
    ActivityAppliedCapabilityOffer:
      line: "dotted line, optional, from a CapabilityMethod rectangle to each CapabilityOffer that its Activities apply, drawn straight or curved"
      target_end: none
      source_end: none
      label: none
      section: "8.8 (Figures 8.60, 8.61)"
    PortContainerPort:
      line: "no line: a port square is drawn on the boundary of its Activity or Store; a Collaboration port is a free-floating triangle in the Collaboration's own Activity Network diagram"
      target_end: none
      source_end: none
      label: none
      section: "8.4 (table)"
    PortCondition:
      line: "no line: a bar (splitter) across the port square marks a port that has a condition or a planningPercentage"
      target_end: none
      source_end: none
      label: none
      section: "8.4 (table)"
    PortPlanningPercentage:
      line: "no line: a bar (splitter) across the port square marks a port that has a condition or a planningPercentage"
      target_end: none
      source_end: none
      label: none
      section: "8.4 (table)"
    ValuePortValueAdd:
      line: "no line: a ValueAdd on an OutputPort is shown by filling the port square (or the Collaboration port triangle)"
      target_end: none
      source_end: none
      label: none
      section: "8.4 (table)"
    RoleResourceAssignment:
      line: "no line: an InputPort that supplies the resource a Role is assigned to has a thick border"
      target_end: none
      source_end: none
      label: none
      section: "8.4 (table, Figure 8.24)"
    performedWorkPerformingRole:
      line: "no line: an Activity is drawn inside the swim-lane of the Role that performs it"
      target_end: none
      source_end: none
      label: none
      section: "8.4 (Figures 8.35 to 8.37)"
    MeasurementRelationship:
      line: "thin solid line between two MeasuredCharacteristic rectangles, bearing a small circle on the line that holds a plus sign for positive influence or a minus sign for negative influence; an SMM class, so it is not among the associations above"
      target_end: "arrowhead at the influenced measurement"
      source_end: none
      label: none
      section: "8.9 (Figures 8.64, 8.65)"
