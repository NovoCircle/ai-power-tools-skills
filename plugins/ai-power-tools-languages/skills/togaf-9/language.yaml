      display: Application Component
      category: Content metamodel
      module: core
      abstract: true
      abstract_inferred: true
      section: 34.2.1; 34.4.5; 34.5
      attributes:
      - {name: Standards class, type: StandardsClass, description: 'One of: Non-Standard, Proposed Standard, Provisional Standard, Standard, Phasing-Out Standard, Retired Standard.'}
      - {name: Standard creation date, description: 'When the standard was created, if the item is a standard.'}
      - {name: Last standard review date, description: Last date the standard was reviewed.}
      - {name: Next standard review date, description: Next date the standard is to be reviewed.}
      - {name: Retire date, description: Date the standard was or will be retired.}
    Assumption: {display: Assumption, category: Content metamodel, module: core, section: '34.5', attributes: []}
    BusinessService:
      display: Business Service
      category: Content metamodel
      module: core
      specializes: Service
      specializes_inferred: true
      section: 34.2.1; 34.5
      attributes:
      - {name: Standards class, type: StandardsClass, description: 'One of: Non-Standard, Proposed Standard, Provisional Standard, Standard, Phasing-Out Standard, Retired Standard.'}
      - {name: Standard creation date, description: 'When the standard was created, if the item is a standard.'}
      - {name: Last standard review date, description: Last date the standard was reviewed.}
      - {name: Next standard review date, description: Next date the standard is to be reviewed.}
      - {name: Retire date, description: Date the standard was or will be retired.}
