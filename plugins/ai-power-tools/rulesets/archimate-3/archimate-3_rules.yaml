        - ArchiMate_BusinessObject
        - ArchiMate_BusinessProcess
        - ArchiMate_BusinessRole
        - ArchiMate_BusinessService
        - ArchiMate_Capability
        - ArchiMate_CommunicationNetwork
        - ArchiMate_Constraint
        - ArchiMate_Contract
