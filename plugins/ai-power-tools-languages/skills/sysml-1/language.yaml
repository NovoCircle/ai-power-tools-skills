diagram_types:
  activity:
    display: Activity diagram (act)
    abbreviation: act
    relation_to_uml: modified from the UML activity diagram
    defined_by: Clause 11 (11.2.1, Tables 11.1 to 11.3); Annex A
    frame: Activity
    admits: [Activity, Action, CallBehaviorAction, AcceptEventAction, SendSignalAction, ActivityFinalNode, FlowFinalNode, InitialNode, DecisionNode, MergeNode, ForkNode, JoinNode, ActivityParameterNode, ObjectNode, Pin, ParameterSet, Parameter, ControlOperator, ControlValue, StructuredActivityNode, ActivityPartition, AllocateActivityPartition, InterruptibleActivityRegion, Rate, Continuous, Discrete, Probability, NoBuffer, Overwrite, Optional, ControlFlow, ObjectFlow, Allocate, Comment, Constraint, Rationale, Problem]
    admits_note: Activity nodes and edges reused from UML, plus the SysML extensions for control as data, rates, probabilities, buffering and optional parameters. Local pre- and postconditions are shown as constraints on actions. Allocation is shown with allocate partitions or callouts.
    excludes: Expansion regions and expansion nodes (excluded UML metaclasses).
    conventions: conventions.diagrams.activity
  block definition:
    display: Block definition diagram (bdd)
    abbreviation: bdd
    relation_to_uml: modified from the UML class diagram
    defined_by: Clause 8 (8.2.1, Tables 8.1 and 8.2); clauses 9, 10, 11, 12, 13; Annex A
    frame: Block, ConstraintBlock or Package
    admits: [Block, InterfaceBlock, ConstraintBlock, ValueType, Enumeration, Actor, Signal, Unit, QuantityKind, InstanceSpecification, Package, Port, ProxyPort, FullPort, FlowProperty, DirectedFeature, Operation, Reception, Interface, BoundReference, EndPathMultiplicity, ParticipantProperty, ConnectorProperty, AdjunctProperty, PartAssociation, ReferenceAssociation, SharedAssociation, Generalization, GeneralizationSet, BlockNamespaceContainment, ItemFlow, ProvidedInterface, RequiredInterface, Dependency, Activity, Interaction, StateMachine, Comment, Constraint, Rationale, Problem, Allocate, Requirement]
    admits_note: Blocks with the compartments for parts, references, values, constraints, operations, receptions, ports, flow properties, structure, namespace, bound references and behaviors; value types, enumerations and actors; associations in their reference, part and shared forms; generalization; dependencies. Activities, interactions and state machines appear as blocks (with their own keyword). Requirements appear only as compartments or callouts of other elements.
    excludes: N-ary and qualified associations; the primitive keyword on a value type; arrowheads on both ends of an association; a cross on a non-navigable end; an ownership dot.
    conventions: conventions.diagrams.block definition
  internal block:
    display: Internal block diagram (ibd)
    abbreviation: ibd
    relation_to_uml: modified from the UML composite structure diagram
    defined_by: Clause 8 (8.2.2, Tables 8.3 and 8.4); clause 9 (Table 9.2); Annex A
    frame: Block or ConstraintBlock
    admits: [PartProperty, ReferenceProperty, ValueProperty, ConstraintProperty, Property, Actor, Port, ProxyPort, FullPort, FlowProperty, PropertySpecificType, BoundReference, EndPathMultiplicity, NestedConnectorEnd, Connector, BindingConnector, ItemFlow, ConnectorProperty, ParticipantProperty, ProvidedInterface, RequiredInterface, Dependency, Allocate, Comment, Constraint, Rationale, Problem, Requirement]
    admits_note: Properties of the framed block and its nested properties, shown as boxes (solid for part and value, dashed for reference); ports on their boundaries; connectors, binding connectors and item flows; an initial values compartment; the property path name; allocation and requirement callouts and compartments.
    excludes: Collaboration and collaboration use; component; port notations other than those of clause 9.
    conventions: conventions.diagrams.internal block
  package:
    display: Package diagram (pkg)
    abbreviation: pkg
    relation_to_uml: same as the UML package diagram
    defined_by: Clause 7 (7.2, Tables 7.1 and 7.2); clause 17 (profile definition); Annex A
    frame: Package or Model
    admits: [Package, Model, Profile, Extension, ProfileApplication, ModelLibrary, Comment, Constraint, ElementGroup, Problem, Rationale, Stakeholder, View, Viewpoint, Block, ConstraintBlock, Requirement, PackageContainment, PackageImport, MetamodelReference, Dependency, Realization, Refine, Conform, Expose]
    admits_note: Packages and models with containment, import and access; dependencies; the model management elements (views, viewpoints, stakeholders, element groups, rationale, problems). A package diagram can hold a wide array of packageable elements. Profile definitions use the profile notations of clause 17 here, because SysML has no profile diagram. Constraint blocks may be defined here.
    excludes: Package merge.
    conventions: conventions.diagrams.package
  parametric:
    display: Parametric diagram (par)
    abbreviation: par
    relation_to_uml: new SysML diagram kind; a restricted internal block diagram
    defined_by: Clause 10 (10.2.2, Table 10.2; 10.3.1.2); Annex A
    frame: Block or ConstraintBlock
    admits: [ConstraintProperty, ConstraintParameter, ValueProperty, PartProperty, ReferenceProperty, BindingConnector, Comment, Constraint, Rationale, Problem]
    admits_note: Constraint properties with their parameters, and the properties of the context block that are bound to them (directly, or through a containing property), joined by binding connectors only. A constraint property is drawn as a rounded rectangle or with the constraint keyword; a value property may be a small square with a text label. The context block is specified in the frame.
    excludes: Connectors other than binding connectors.
    conventions: conventions.diagrams.parametric
  requirement:
    display: Requirement diagram (req)
    abbreviation: req
    relation_to_uml: new SysML diagram kind; based on the UML class diagram
    defined_by: Clause 16 (16.2.1, Tables 16.1 and 16.2; 16.3.1.1); Annex A
    frame: Package or Requirement
    admits: [Requirement, Package, Classifier, TestCase, Rationale, RequirementContainment, DeriveReqt, Satisfy, Verify, Refine, Copy, Trace, Model, ModelLibrary]
    admits_note: Only requirements, packages, other classifiers, test cases and rationale, with the containment, derive, satisfy, verify, refine, copy and trace relationships. Callouts show the relationship of other elements to a requirement. Requirements may also appear on other diagram kinds as a compartment or callout, and in tables.
    excludes: Anything outside the list above.
    conventions: conventions.diagrams.requirement
  sequence:
    display: Sequence diagram (sd)
    abbreviation: sd
    relation_to_uml: same as the UML sequence diagram
    defined_by: Clause 12 (12.2.1, Tables 12.1 to 12.3); Annex A
    frame: Interaction
    admits: [Interaction, Lifeline, ExecutionSpecification, InteractionUse, CombinedFragment, StateInvariant, Continuation, CreationEvent, DestructionEvent, DurationConstraint, DurationObservation, TimeConstraint, TimeObservation, Message, GeneralOrdering, Comment, Constraint]
    admits_note: Lifelines and messages (synchronous, asynchronous, create, reply, lost, found), execution specifications, interaction uses with arguments and return values, combined fragments with the interaction operators seq, alt, opt, break, par, strict, loop, critical, neg, assert, ignore and consider, coregions, state invariants, continuations, and time and duration constraints and observations. Interactions appear as blocks on block definition diagrams.
    excludes: Communication diagram, interaction overview diagram, timing diagram.
    conventions: reused from UML; the standard states no drawing rules beyond Annex A and the global conventions
  state machine:
    display: State machine diagram (stm)
    abbreviation: stm
    relation_to_uml: same as the UML state machine diagram
    defined_by: Clause 13 (13.2.1, Tables 13.1 to 13.3); Annex A
    frame: StateMachine
    admits: [StateMachine, State, Region, Pseudostate, FinalState, Transition, ConnectionPointReference, Comment, Constraint]
    admits_note: Simple, composite (sequential or concurrent) and submachine states with entry, do and exit activities; initial, choice, junction, deep and shallow history, entry point, exit point and terminate pseudostates; final states; transitions with trigger, guard and effect, including send-signal and receive-signal actions; alternative entry and exit point references. State machines appear as blocks on block definition diagrams.
    excludes: Protocol state machines and protocol transitions.
    conventions: reused from UML; the standard states no drawing rules beyond Annex A and the global conventions
  use case:
    display: Use case diagram (uc)
    abbreviation: uc
    relation_to_uml: same as the UML use case diagram
    defined_by: Clause 14 (14.2.1, Tables 14.1 and 14.2); Annex A
    frame: Package
    admits: [UseCase, Actor, Subject, ExtensionPoint, Package, CommunicationPath, Include, Extend, UseCaseGeneralization, Comment, Constraint]
    admits_note: Use cases (with extension points), actors, the subject drawn as a system boundary, communication paths, include, extend (with condition) and generalization. A frame can represent the package holding the lower-level use cases.
    excludes: Nothing is added to UML; a use case is realized by activity, sequence and state machine diagrams.
    conventions: reused from UML; the standard states no drawing rules beyond Annex A and the global conventions
data_types:
  coverage: partial
  section: "8.3.2.15, 8.3.3, 9.3.2, 11.3.3, 16.3.2.6"
  note: SysML adds value types, which carry an optional unit and quantity kind, and three small libraries (primitive value types, units and quantity kinds, control values); it fixes no number representation, no literal forms and no concrete units, and everything else about types comes from UML.
  inherits_from: uml-2
  types:
    - {name: ValueType, kind: other, section: "8.3.2.15", note: "A type whose values cannot be the target of a reference; it may carry a unit and a quantity kind, may own properties and operations, and types value properties and parameters. Unqualified Boolean, Integer, Real and String mean the UML primitive types when a SysML extension is defined and these library value types everywhere else (4.3)."}
    - {name: Boolean, kind: primitive, section: "8.3.3.1.1", note: "The predefined values true and false. Library value type."}
    - {name: Integer, kind: primitive, section: "8.3.3.1.3", note: "The mathematical integers, with no fixed representation such as precision or scale. Specializes Number (Figure 8.10)."}
    - {name: Real, kind: primitive, section: "8.3.3.1.5", note: "The mathematical reals, for continuous quantities, with no fixed precision or scale. Specializes Number (Figure 8.10)."}
    - {name: String, kind: primitive, section: "8.3.3.1.6", note: "A sequence of characters in some suitable character set, which may include non-Roman alphabets."}
    - {name: Number, kind: primitive, section: "8.3.3.1.4", note: "Abstract. The value type from which the other numeric value types specialize (shown in italics in Figure 8.10)."}
    - {name: Complex, kind: structured, section: "8.3.3.1.2", note: "A complex number: a real part and an imaginary part, each a Real. Specializes Number (Figure 8.10).", attributes: [{name: realPart, type: Real}, {name: imaginaryPart, type: Real}]}
    - {name: Unit, kind: unit, section: "8.3.3.2.2", note: "A library block. An instance specification classified by Unit (or a specialization) defines one measurement unit. Its attributes are symbol, description and definitionURI (String, 0..1 each) and quantityKind (QuantityKind, 0..*).", attributes: [{name: symbol, type: String, multiplicity: "0..1"}, {name: description, type: String, multiplicity: "0..1"}, {name: definitionURI, type: String, multiplicity: "0..1"}, {name: quantityKind, type: QuantityKind, multiplicity: "0..*"}]}
    - {name: QuantityKind, kind: unit, section: "8.3.3.2.1", note: "A library block. An instance specification classified by QuantityKind (or a specialization) defines one kind of quantity, such as length. Its attributes are symbol, description and definitionURI (String, 0..1 each).", attributes: [{name: symbol, type: String, multiplicity: "0..1"}, {name: description, type: String, multiplicity: "0..1"}, {name: definitionURI, type: String, multiplicity: "0..1"}]}
    - {name: ControlValue, kind: enumeration, values: ["disable", "enable"], section: "11.3.3.1.1", note: "Treats control as data. Modelers may add literals such as suspend and resume with their own meaning."}
    - {name: FlowDirection, kind: enumeration, values: ["in", "out", "inout"], section: "9.3.2.6"}
    - {name: FeatureDirection, kind: enumeration, values: ["provided", "required", "providedRequired"], section: "9.3.2.5", note: "The text writes the last literal providedrequired; the machine-readable model writes providedRequired."}
    - {name: VerdictKind, kind: enumeration, values: ["pass", "fail", "inconclusive", "error"], section: "16.3.2.6", note: "Borrowed from the UML testing profile; types the return parameter of a test case. The literals are read from the machine-readable model; the text lists none."}
  attributes:
    coverage: some_concepts
    where: concepts
    note: Concept entries that the standard gives attributes list them under `attributes` (name, and type and multiplicity where the standard states them). Attributes of the diagram interchange elements in Annex B are not listed, and the attributes of reused UML concepts are in the uml-2 guide.
notation:
  coverage: normative
  section: "7.2, 8.2, 9.2, 10.2, 11.2, 15.2, 16.2 (Diagram Elements tables); 8.3.1, 9.3.1, 10.3.1, 11.3.1, 15.3.1, 16.3.1 (Diagram Extensions); Annex A.1, A.2; Annex C.3.1"
  note: The Diagram Elements tables give a symbol for each SysML element and the standard counts that notation in its concrete syntax conformance; block definition, internal block and activity diagrams are drawn as UML class, composite structure and activity diagrams with the changes below, requirement and parametric diagrams are new, and package, sequence, state machine and use case diagrams are UML's own. The standard states no sizes or colors, except that a deprecated flow port square is filled white.
  inherits_from: uml-2
  default: {shape: "the symbol the uml-2 guide gives for that UML concept, unchanged", line: "the line the uml-2 guide gives for that UML relationship, unchanged", section: "Annex A.1"}
  frame:
    shape: "a rectangle that encloses the diagram contents; a name tag (a small rectangle with one cut-off corner) sits at the upper left corner on the frame border"
    label: "inside the tag: the diagram kind in bold, then the model element type in square brackets (optional), then the model element name, then a diagram name in square brackets (optional); one space between entries. A diagram usage word such as a context diagram may be written in guillemets above the heading. The frame is required in SysML and names the element that is the default namespace of its contents; an element from another namespace carries a qualified name."
    marker: "an optional note symbol (diagram description, with fields such as version, description, completion status and reference) joined by a dashed line to the frame header. Border elements of the designated element, such as ports of a block, sit on the frame border."
    section: "Annex A.1 (Figure A.2)"
  keywords:
    - {keyword: "block", used_on: "a block; implied when a definition box on a block definition diagram has no keyword", section: "8.2.1 (Table 8.1), 8.3.1.1.2"}
    - {keyword: "valueType", used_on: "a value type, and the unit compartment of a value type box", section: "8.2.1 (Table 8.1)"}
    - {keyword: "enumeration", used_on: "an enumeration", section: "8.2.1 (Table 8.1)"}
    - {keyword: "actor", used_on: "an actor drawn as a box instead of a stick figure", section: "8.2.1 (Table 8.1)"}
    - {keyword: "signal", used_on: "a reception line in the receptions compartment", section: "8.2.1 (Table 8.1)"}
    - {keyword: "connector", used_on: "a connector property line", section: "8.2.1 (Table 8.2)"}
    - {keyword: "participant", used_on: "a participant property line or box, with {end=...}", section: "8.2.1 (Table 8.2)"}
    - {keyword: "equal", used_on: "the label of a binding connector", section: "8.2.2 (Tables 8.3, 8.4)"}
    - {keyword: "boundReference", used_on: "a bound reference box", section: "8.2.2 (Table 8.3)"}
    - {keyword: "endPathMultiplicity", used_on: "an end path multiplicity line", section: "8.2.1 (Table 8.1)"}
    - {keyword: "interfaceBlock", used_on: "an interface block", section: "9.2.1 (Table 9.1)"}
    - {keyword: "interface", used_on: "a UML interface box", section: "9.2.1 (Table 9.1)"}
    - {keyword: "proxy", used_on: "a proxy port, written beside the port name", section: "9.2.1 (Table 9.1); 9.3.1.7"}
    - {keyword: "full", used_on: "a full port, written beside the port name", section: "9.2.1 (Table 9.1); 9.3.1.3"}
    - {keyword: "constraint", used_on: "a constraint block, and a constraint property drawn as a plain box", section: "10.2.1, 10.2.2 (Tables 10.1, 10.2)"}
    - {keyword: "controlOperator", used_on: "an action that calls a control operator, and the activity heading", section: "11.2.1 (Table 11.1)"}
    - {keyword: "noBuffer", used_on: "a pin or object node", section: "11.2.1 (Table 11.1)"}
    - {keyword: "overwrite", used_on: "a pin or object node", section: "11.2.1 (Table 11.1)"}
    - {keyword: "optional", used_on: "a pin or activity parameter", section: "11.2.1 (Table 11.1)"}
    - {keyword: "continuous", used_on: "an object node, pin, activity parameter or edge", section: "11.2.1 (Tables 11.1, 11.2)"}
    - {keyword: "discrete", used_on: "an object node, pin, activity parameter or edge", section: "11.2.1 (Tables 11.1, 11.2)"}
    - {keyword: "rate", used_on: "a rate compartment on an object node", section: "11.2.1 (Table 11.1)"}
    - {keyword: "activity", used_on: "an activity drawn as a block", section: "11.2.1 (Table 11.3)"}
    - {keyword: "adjunct", used_on: "the label of an adjunct property on an association", section: "11.2.1 (Table 11.3)"}
    - {keyword: "structured", used_on: "a structured activity node", section: "11.2.1 (Table 11.3)"}
    - {keyword: "allocate", used_on: "an allocate dependency, and the heading of an allocate activity partition", section: "15.2.1 (Table 15.1); 15.3.1.5"}
    - {keyword: "requirement", used_on: "a requirement, and the type shown in a callout", section: "16.2.1 (Tables 16.1, 16.2)"}
    - {keyword: "namedElement", used_on: "a requirement-related compartment entry for an element that is not a requirement", section: "16.2.1 (Table 16.1)"}
    - {keyword: "copy, deriveReqt, satisfy, verify, refine, trace", used_on: "the label of the matching dependency", section: "16.2.1 (Table 16.2)"}
    - {keyword: "testCase", used_on: "the heading of a diagram whose frame is a test case", section: "16.4 (Figure 16.7)"}
    - {keyword: "problem, rationale, elementGroup, stakeholder, view, viewpoint, create", used_on: "the matching model management element; create marks the View operation of a viewpoint", section: "7.2 (Table 7.1)"}
    - {keyword: "conform, expose, import, access, refine", used_on: "the label of the matching dependency", section: "7.2 (Table 7.2)"}
    - {keyword: "prov, reqd, provreqd; in, out, inout", used_on: "text prefixes (not guillemets) for a directed feature and a flow property", section: "9.3.1.1, 9.3.1.2"}
  elements:
    Rationale: {shape: "note symbol: a rectangle with a folded upper right corner", marker: "attached to the element it justifies by a dashed line, as a comment is; it may be attached to a relationship", label: "the keyword «rationale» on the first line, then the rationale text", section: "7.2 (Table 7.1)"}
    Problem: {shape: "note symbol: a rectangle with a folded upper right corner", marker: "attached to the elements concerned by dashed lines, as a comment is", label: "the keyword «problem» on the first line, then the text of the problem", section: "7.2 (Table 7.1)"}
    ElementGroup: {shape: "note symbol: a rectangle with a folded upper right corner", marker: "a dashed line to each member, whatever kind of symbol the member has (a box, an ellipse, a stick figure)", label: "first line «elementGroup»; second line {name=MyGroup, size=3}; then the text of the membership criterion", section: "7.2 (Table 7.1)"}
    Stakeholder: {shape: "a rectangle with two compartments", marker: "none", label: "top compartment: «stakeholder» above the bold name; second compartment headed «stakeholder», holding concernList=,,, and /concern=\"...\",\"...\",\"...\"", section: "7.2 (Table 7.1)"}
    Viewpoint: {shape: "a rectangle with three compartments", marker: "none", label: "top: «viewpoint» above the bold name; second, headed «viewpoint»: stakeholder=Name, purpose=\"...\", concernList=,,, /concern=..., language=\"...\", /method=Name, presentation=\"...\"; third: the operation «create»View()", section: "7.2 (Table 7.1)"}
    View: {shape: "a rectangle with three compartments", marker: "none", label: "top: «view» above the bold name; second, headed «view»: /viewpoint=Name and /stakeholder=Name1,Name2; third: its properties such as property1:View1", section: "7.2 (Table 7.1)"}
    Block: {shape: "a rectangle; the top compartment holds the keyword «block», an optional {encapsulated} line and the bold name; further compartments may follow in any order, each optionally headed by its name in small italics", marker: "none", label: "compartments the standard lists: constraints (constraints in braces), operations, receptions (each line starts with «signal»), parts, references, values, properties, ports, proxy ports, full ports, flow properties, namespace, structure, bound references, classifier behavior, owned behaviors. A box with no keyword on a block definition diagram is a block. An inherited feature starts with ^.", section: "8.2.1 (Table 8.1); 8.3.1.1.2 to 8.3.1.1.4"}
    PartProperty: {shape: "on a block definition diagram, a line of text in the parts compartment: name: Type, with an optional multiplicity in square brackets and modifiers in braces such as {subsets x} or {redefines x}. On an internal block diagram, a rectangle with a solid outline holding name: Type, with its multiplicity at the upper right corner.", marker: "a part nested in another part is drawn inside that part's rectangle", label: "name: Type [multiplicity]", section: "8.2.1 (Table 8.1); 8.2.2 (Table 8.3)"}
    ReferenceProperty: {shape: "on a block definition diagram, a line of text in the references compartment: name: Type [multiplicity] {modifiers}, with a leading slash for a derived property. On an internal block diagram, a rectangle with a dashed outline holding name: Type.", marker: "none", label: "name: Type [multiplicity] {ordered, unique, union, subsets x}", section: "8.2.1 (Table 8.1); 8.2.2 (Table 8.3)"}
    ValueProperty: {shape: "on a block definition diagram, a line of text in the values compartment: name: Type = default {readOnly}. On an internal block diagram, a rectangle with a solid outline. On a parametric diagram it may be a small square with its text label beside it.", marker: "none", label: "name: Type = value; a unit may follow in parentheses", section: "8.2.1 (Table 8.1); 8.2.2 (Table 8.3); 10.3.1.2"}
    AssociationBlock: {shape: "a block box (keyword «block», bold name) that may show its participant property lines and a structure compartment", marker: "joined to its association by a dashed line from the box to the middle of the association line; a small filled triangle beside the association name shows the reading direction", label: "«participant»{end=property 1} p1:Block1 lines list the ends", section: "8.2.1 (Table 8.2)"}
    ConnectorProperty: {shape: "a line in a compartment of the owning block: «connector» c1: Association1; on an internal block diagram the connector is labeled c1: Association1, or a small rectangle c2: Association2 is joined to the connector by a dashed line", marker: "none", label: "«connector» name: association block", section: "8.2.2 (Table 8.2)"}
    ParticipantProperty: {shape: "a line of text in an association block: «participant»{end=property 1} p1:Block1; or a rectangle with a dashed outline inside the structure compartment holding «participant», {end=property 2} and p2:Block2 in bold", marker: "none", label: "{end=...} names the association end it stands for", section: "8.2.1 (Table 8.2)"}
    AdjunctProperty: {shape: "on a block definition diagram, a plain line between an activity box and a block box, labeled «adjunct» and the kind of principal and its name (call action, object node, variable or parameter)", marker: "for a call action principal the activity end carries a black (filled) diamond", label: "«adjunct» call action name; the kind and name stack under the keyword", section: "11.2.1 (Table 11.3)"}
    ClassifierBehaviorProperty: {shape: "a line of text in a compartment headed classifier behavior (on an internal block diagram the heading has a leading colon): «stateMachine» MySM1 ()", marker: "owned behaviors sit in a separate compartment headed owned behaviors", label: "«kind» name (parameters)", section: "8.2.1 (Table 8.1); 8.3.1.1.4"}
    EndPathMultiplicity: {shape: "a line of text in a properties compartment: «endPathMultiplicity» { lower = 6 ; upper = 8 } property11 [*] { redefines property11 }", marker: "none", label: "the keyword, then lower and upper in braces, then the property", section: "8.2.1 (Table 8.1)"}
    BoundReference: {shape: "on a block definition diagram, a line in a compartment headed bound references: { /bindingPath = p1, p2 } property9 : Block1 [*], with optional lower and upper after the path. On an internal block diagram, a rectangle with a dashed outline holding «boundReference» and name : Type, with its multiplicity at the upper right corner", marker: "on the internal block diagram a line labeled «equal» joins it to the nested property it is bound to", label: "bold keyword «boundReference» above the name and type", section: "8.2.1 (Table 8.1); 8.2.2 (Table 8.3)"}
    NestedConnectorEnd: {shape: "no symbol of its own", marker: "a connector line ends on the nested property's box, and the property's name is written as a path of names joined by dots", label: "name.name.name", section: "8.3.1.2.5"}
    PropertySpecificType: {shape: "a property box whose type name is in square brackets, as in p1: [Type1]; its added or redefined features sit in compartments headed values or properties", marker: "none", label: "name: [Type]", section: "8.2.2 (Table 8.3)"}
    DistributedProperty: {shape: "a line of text in a values compartment: a distribution keyword in guillemets, the distribution parameters in braces, then the property: «normal»{mean=2,stdDeviation=0.1} x: Real", marker: "none", label: "keyword, braces, name: type", section: "8.2.2 (Table 8.3)"}
    ValueType: {shape: "a rectangle: the keyword «valueType» above the bold name, then compartments for operations and properties, then a last compartment headed «valueType» holding unit = UnitName", marker: "none", label: "the last compartment line has the form unit = name", section: "8.2.1 (Table 8.1)"}
    Unit: {shape: "an instance box: an underlined title unit1: Unit above a compartment of text lines", marker: "none", label: "symbol=\"..\", description=\"...\", definitionURI=\"....\", quantityKind=qk1,qk2", section: "8.2.1 (Table 8.1)"}
    QuantityKind: {shape: "an instance box: an underlined title qk1: QuantityKind above a compartment of text lines", marker: "none", label: "symbol=\"..\", description=\"...\", definitionURI=\"....\"", section: "8.2.1 (Table 8.1)"}
    Boolean: {shape: "a rectangle with the keyword «valueType» above the bold name Boolean", marker: "none", section: "8.3.3.1 (Figure 8.10)"}
    String: {shape: "a rectangle with the keyword «valueType» above the bold name String", marker: "none", section: "8.3.3.1 (Figure 8.10)"}
    Number: {shape: "a rectangle with the keyword «valueType» above the name Number in bold italics (abstract)", marker: "Integer, Real and Complex join it by lines that share one hollow triangle arrowhead at the Number end", section: "8.3.3.1 (Figure 8.10)"}
    Integer: {shape: "a rectangle with the keyword «valueType» above the bold name Integer", marker: "joined to Number by the shared generalization arrowhead", section: "8.3.3.1 (Figure 8.10)"}
    Real: {shape: "a rectangle with the keyword «valueType» above the bold name Real", marker: "joined to Number by the shared generalization arrowhead", section: "8.3.3.1 (Figure 8.10)"}
    Complex: {shape: "a rectangle with the keyword «valueType» above the bold name Complex and a compartment with realPart: Real and imaginaryPart: Real", marker: "joined to Number by the shared generalization arrowhead", section: "8.3.3.1 (Figure 8.10)"}
    InterfaceBlock: {shape: "a rectangle: the keyword «interfaceBlock» above the bold name, then a compartment headed operations", marker: "none", section: "9.2.1 (Table 9.1)"}
    ProxyPort: {shape: "a small square straddling the boundary of the owning block or part; the keyword «proxy» and the port name sit beside it. In compartment form, a line p1: IType in a compartment headed proxy ports.", marker: "when the port has its own behavior, a small rounded rectangle inside the owner is joined to the square by a short line", label: "«proxy» name", section: "9.2.1 (Table 9.1); 9.2.2 (Table 9.2); 9.3.1.7"}
    FullPort: {shape: "a small square straddling the boundary of the owning block or part; the keyword «full» and the port name sit beside it. In compartment form, a line p1: IType in a compartment headed full ports.", marker: "none", label: "«full» name", section: "9.2.1 (Table 9.1); 9.2.2 (Table 9.2); 9.3.1.3"}
    FlowDirection: {shape: "no symbol of its own; on a port it is an arrow inside the port square, and on a flow property the text prefix in, out or inout", marker: "the arrow is perpendicular to the boundary line it overlaps and points the direction of the flow with respect to the owner; a conjugated port reverses it; two open arrowheads facing away from each other (<>) show properties that flow in different directions or in both", label: "in | out | inout", section: "9.3.1.2; 9.3.1.6"}
    FlowProperty: {shape: "a line of text in a compartment headed flow properties: in gearSelect: Gear", marker: "none", label: "direction prefix, name, colon, type", section: "9.2.1 (Table 9.1); 9.3.1.2"}
    FeatureDirection: {shape: "no symbol of its own; a text prefix before a feature", marker: "none", label: "prov | reqd | provreqd", section: "9.3.1.1"}
    DirectedFeature: {shape: "a line of text in an operations or properties compartment, in the usual form, with a prefix: prov Boolean selectGear(g : Gear), reqd Torque getTorque(), prov temperature : Integer", marker: "none", label: "prefix prov, reqd or provreqd", section: "9.2.1 (Table 9.1); 9.3.1.1"}
    InvocationOnNestedPortAction: {shape: "the ordinary action symbol, with the path written in the action's name", marker: "none", label: "via port-name, port-name (the nested ports in order, the final port last)", section: "9.3.1.4"}
    TriggerOnNestedPort: {shape: "the ordinary trigger symbol, with the path written after the trigger signature in the name", marker: "none", label: "«from» (port-name, port-name)", section: "9.3.1.8"}
    ConstraintBlock: {shape: "a rectangle: the keyword «constraint» above the bold name, then a compartment headed constraints and a compartment headed parameters", marker: "none", label: "constraints compartment: {{L1} x > y} and nested usages such as nested: ConstraintBlock2; parameters compartment: x: Real, y: Real", section: "10.2.1 (Table 10.1)"}
