ea_only:
  BoundaryPort: one stereotype for the standard's InputPort and OutputPort; the direction is the tag InputOutput (Input, Output, Either);
    tag withCondition
  RoleSwimlane: a Role drawn as a swim-lane in an Activity Network (an ActivityPartition); a drawing device, not a second kind of Role
  CapabilityAssociation: the dashed Capability Management link between a CapabilityOffer and what supports it (CapabilityMethod, Store,
    Pool); not a class of the standard
  RoleContainment: the standard's association between a Collaboration and its Role, drawn as a connector
  isExpand: 'tag on Activity, Capability, OrgUnit, Role: shows the expand button; not a VDML property'
  showExpand: 'tag on Capability: shows the plus or minus; not a VDML property'
  _Bezier: a hidden tag EA put on a CapabilityDependency connector (Default 1); EA's own, not VDML's
