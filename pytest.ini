[pytest]
# `python -m pytest` from the repository root is the one command (see TESTING.md).
testpaths = plugins/ai-power-tools/skills ruleset-archimate31 security tools
# norecursedirs matches directory BASENAMES, so a stray root-level folder cannot be
# excluded by name without also excluding the real skill of the same name under
# plugins/. testpaths already keeps the run out of such strays.
norecursedirs = dist .release-staging .plugin-release-staging .git .venv node_modules build
addopts = -ra
