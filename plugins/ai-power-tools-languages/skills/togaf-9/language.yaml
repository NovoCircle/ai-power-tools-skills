      display: Actor
      category: Content metamodel
      module: core
      section: 34.2.1; 34.5
      attributes:
      - {name: '# FTEs', description: Estimated number of FTEs that operate as this actor.}
      - {name: Actor goal, description: The actor's objectives in general terms.}
      - {name: Actor tasks, description: Tasks the actor performs in general terms.}
