    implements: UAF-END-007
    also_implements:
    - UAF-END-008
    description: When the supplier is an OperationalActivityAction, the client must be an OperationalRole; when the supplier
      is a ServiceFunctionAction, the client must be a ServiceSpecificationRole; when the supplier is a FunctionAction other
      than a ProjectActivityAction, the client must be a ResourceRole; when the supplier is a ProjectActivityAction, the client
      must be a ProjectRole. When the client is an OperationalRole, the supplier must be an OperationalActivityAction; when
      the client is a ServiceSpecificationRole, the supplier must be a ServiceFunctionAction; when the client is a ResourceRole,
      the supplier must be a FunctionAction other than a ProjectActivityAction. (The standard states no supplier rule for
      a ProjectRole client.). In EA the relationship is an Abstraction connector stereotyped PerformsInContext
      (source = client or information source, target = supplier or information target). Each end must carry a stereotype that
      the standard allows there (the table lists the concrete stereotypes); an end with no stereotype, or with one that is
      not in the table, is reported. [OMG UAF 1.0 (formal/17-12-01) 7.1.3.3]
