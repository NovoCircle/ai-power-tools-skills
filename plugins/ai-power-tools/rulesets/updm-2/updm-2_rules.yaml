  - id: UPDM2-TYP-008
    name: "A NodeRole is owned by a NodeParent"
    implements: UPDM-TYP-008
    description: "The owner of a NodeRole must be a NodeParent or a specialization of it: the element it is attached to in the Browser (its ParentID), not its package. In Sparx's UPDM2 technology that is one of: LogicalArchitecture, Node, Performer, SecurityDomain. A NodeRole that sits directly in a package, or under any other element, is reported with where it sits. [OMG UPDM 2.1 (formal/13-08-04) 8.3.1.1.4.4 (NodeRole)]"
    category: typ
    severity: error
    demo_trigger: false
    coverage: full
    not_checked: "An owner that carries no UPDM stereotype, or another technology's stereotype as its first one (SysML's block applied before the UPDM stereotype), is reported as a wrong owner: the rule reads the owner's first stereotype only."
    selector:
      type: element
      stereotypes:
        any_of: ["NodeRole"]
    condition:
      type: contained_in
      path:
        - stereotype_one_of: ["LogicalArchitecture", "Node", "Performer", "SecurityDomain"]
    remediation:
      short: "Move the NodeRole under a LogicalArchitecture (or Node, Performer, SecurityDomain)."
      auto_fixable: false

