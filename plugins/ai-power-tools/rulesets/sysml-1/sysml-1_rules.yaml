# SysML 1.5 Conformance Ruleset
# Language:     SysML 1.5 (OMG formal/17-05-01), as modeled with Sparx's built-in SysML technology (MDG technology id `SysML1.4`,
#               which EA's Resources tab shows as "SysML 1.5")
# Enforced by:  AI Power Tools for Sparx EA - validate_model tool
# Generated from the language skill's rules; do not edit by hand.
#
# STEREOTYPE NAMES ARE UNQUALIFIED AND AS EA STORES THEM, AND THAT IS MEASURED.
#
# validate_model selects with `Stereotype IN (...)` on t_object and t_connector. For Sparx's SysML technology that column holds the bare
# name (`block`, `requirement`, `view`, `viewpoint`, `conform`, `Expose`, `deriveReqt`, `satisfy`, `verify`, `copy`); the qualified
# form `SysML1.4::block` is only in the t_xref row named `Stereotypes`. Measured on EA 17.1 build 1716 by creating one object per
# stereotype in a test model and reading it back: 63 names bound, FQName `SysML1.4::<name>`. The case is EA's own and mixed: lower
# camel case for most (`block`, `satisfy`), upper camel for a few (`Expose`, `FlowProperty`, `ProxyPort`, `FullPort`, `Stakeholder`).
# The Resources tab shows `Flow Property`, `Full Port` and `Proxy Port` with a space; those are display names, the stored names have
# none. A selector compares the stored string exactly, so a name one character off selects nothing.
#
# THE QUALIFIED PREFIX IS `SysML1.4`, NOT `SysML1.5`. Older SysML 1.1, 1.2 and 1.3 technologies are installed beside it; this ruleset
# is for the technology the tab shows as 1.5 only.
#
# REQUIREMENT KINDS. A requirement is `requirement` or one of six kinds EA adds (functionalRequirement, interfaceRequirement,
# performanceRequirement, physicalRequirement, designConstraint, extendedRequirement). A rule about a requirement names all seven.
#
# WHAT A RULE CAN SEE. A rule selects an element by its stereotype (`selector.stereotypes`) or by EA's element type (`selector.types`), and a
# connector by its stereotype or by EA's connector type (`selector.connector_types`); an end or a table row can be named by stereotype or as
# `type:<Object_Type>`; a rule can count connectors by stereotype or type (`connector_count`) and check where an element sits
# (`contained_in`, the element it is attached to by ParentID, else its package) and what it holds (`contains_count`). The EA type names used
# below were measured on a model built in EA 17.1 (Part, Requirement, Activity, StateMachine, Interaction, DataType, Enumeration, PrimitiveType, Decision,
# ObjectNode, ActivityParameter, CentralBufferNode, ExpansionNode, ActionPin, Association, Aggregation, Generalization, ControlFlow, ObjectFlow).
# WHAT IT CANNOT SEE. A rule cannot read what a part, port or property is typed by, operations, attributes, multiplicity, aggregation,
# a second stereotype, built-in columns such as Status, numeric values, or follow a generalization or a conditional on the other end of a
# connector. Most of SysML's rules are about those, so only twenty-one of the language skill's rules are in this file.
#
# ENDPOINT LISTS. The engine's endpoint condition needs a list for both ends. The end a rule does not constrain lists every SysML
# element stereotype plus the empty stereotype (a plain UML element). An end that carries another technology's stereotype is
# therefore reported by these rules; use them on models that hold SysML and plain UML elements.
#
# The standard gives no table of allowed relationship pairs (each relationship states its own ends), so the only `tables:` entry is the
# full-port binding table behind SYSML1-PORT-008, written from that one constraint (SysML 1.5, 9.3.2.8 [2]).
#
# Sources:
#   [S1] OMG, OMG Systems Modeling Language (SysML) Version 1.5, formal/17-05-01
#        https://www.omg.org/spec/SysML/1.5/
#   [S2] Sparx Systems, the SysML technology built into Enterprise Architect 17.1 (MDG technology id SysML1.4, shown as SysML 1.5)

meta:
  version: "0.2"
  language: sysml-1
  organization: "(your organization)"
  mdg_family: SysML1.4
  description: >
    Conformance rules for SysML 1.5 models built with Sparx Enterprise Architect's SysML technology: what a conform and an expose may
    join, that a view conforms to one viewpoint, that a requirement has an id and a text, and which elements the requirement
    relationships (copy, deriveReqt, satisfy, verify) may join, that a deprecated flow port has a direction, and (from 0.2) what a
    requirement may not join, where a probability may start, how a full port is bound, where the property stereotypes sit, and what an
    interface block or a requirement may hold. Each rule names the rules.md id it implements.
  severity_levels:
    error: A requirement of the standard (rules.md strength must)
    warning: Guidance of the standard (rules.md strength should)
    info: Advisory note; not a conformance violation

tables:
  sysml-1.5-full-port-bindings:
    source: "OMG SysML 1.5 (formal/17-05-01) 9.3.2.8 [2]: a binding connector does not link a full port to another composite property of the block that owns it, unless that property is a non-full port"
    connectors:
      b: BindingConnector
    cells:
      "FullPort":
        "FullPort": "b"
      "type:Part":
        "type:Part": "b"

rules:
  - id: SYSML1-MOD-001
    name: The general end of a conform is a viewpoint
    implements: SYSML-MOD-001
    description: A conform runs from a view (the specific classifier) to a viewpoint (the general classifier). In EA's SysML
      technology it is a Generalization stereotyped conform, drawn from the view to the viewpoint; the target must carry the
      stereotype viewpoint. The end the rule does not constrain lists every SysML element stereotype and the empty stereotype
      (a plain UML element), because the engine needs both lists; an end that carries another technology's stereotype is reported
      too. [OMG SysML 1.5 (formal/17-05-01) 7.3.2.1 [1]]
    category: mod
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: connector
      connector_stereotype: conform
    condition:
      type: connector_endpoint_stereotype
      source_must_be_one_of:
      - AdjunctProperty
      - BoundReference
      - ClassifierBehaviorProperty
      - DirectedFeature
      - ElementGroup
      - EndPathMultiplicity
      - FlowPort
      - FlowProperty
      - FullPort
      - InterfaceBlock
      - NestedConnectorEnd
      - PropertySpecificType
      - ProxyPort
      - RequirementRelated
      - Stakeholder
      - ValueType
      - allocateActivityPartition
      - allocated
      - block
      - connectorProperty
      - constraintBlock
      - constraintProperty
      - continuous
      - controlOperator
      - designConstraint
      - discrete
      - distributedProperty
      - effbd
      - extendedRequirement
      - flowSpecification
      - functionalRequirement
      - interfaceRequirement
      - model
      - moe
      - noBuffer
      - nonStreaming
      - objectiveFunction
      - optional
      - overwrite
      - participantProperty
      - performanceRequirement
      - physicalRequirement
      - probability
      - problem
      - rate
      - rationale
      - requirement
      - streaming
      - testCase
      - view
      - viewpoint
      - ''
      target_must_be_one_of:
      - viewpoint
    remediation:
      short: Draw the conform from the view to the viewpoint it conforms to.
      auto_fixable: false

