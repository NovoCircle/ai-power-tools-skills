# ServiceNow Common Service Data Model (CSDM) 5 language file (schema_version 1).
# Written from the vendor's white paper and its product documentation (Brazil release, updated 2026-09-10), read 2026-11-03.
# CSDM is a vendor-defined data model, not a formal standard.
# Concept ids are the paper's entity names without spaces. Platform table names and relationship types are
# the paper's own and are exact. `inferred: true` marks a generalization or abstractness that the paper does
# not state. Relationship names are ours (the paper does not name its relationships).
schema_version: 1
id: csdm-5
name: ServiceNow Common Service Data Model (CSDM)
owner: {name: 'ServiceNow, Inc.', kind: tool-vendor}
standard: {name: Common Service Data Model (CSDM) white paper, version: '5', status: published, kind: 'vendor-defined data model, not a formal standard', reference: 'ServiceNow, CSDM 5 White Paper (published 6 May 2025; PDF with links refreshed 16 June 2025), 62 printed pages, hosted in the ServiceNow community knowledge base; announcement https://www.servicenow.com/community/common-service-data-model/csdm-5-finally-get-the-csdm-5-white-paper-here/ta-p/3254967. Latest ServiceNow publishes as of 2026-11-03. Second source: ServiceNow product documentation, CSDM topics, Brazil release, updated 10 September 2026 (cited as docs).'}
concepts:
  source: 'CSDM 5 white paper: the domain chapters (pp. 14-46) and Figure 15 (p. 47, table names and labels). The paper has no formal metamodel; a concept is an entity it names and describes. Generalizations are the paper''s statement that one table extends another, or are marked inferred. `ci` says whether the paper calls the entity a configuration item (true), says it is not one (false) or does not say (omitted). Abstractness is never stated by the paper.'
  groups:
    Cross-domain parents: {defined_by: 'pp. 19, 37, 42', notes: Parents the paper implies (every CMDB entity is a configuration item; service types share the Service parent). Not entities the paper defines on their own.}
    Foundation: {defined_by: 'pp. 14-29, Foundation Domain', notes: Referential data. Not used in CMDB relationships except Business Process.}
    Ideation and Strategy: {defined_by: 'pp. 29-30, Ideation and Strategy Domain', notes: New in CSDM 5.}
    Design and Planning: {defined_by: 'pp. 31-33, Design and Planning Domain'}
    Build and Integration: {defined_by: 'pp. 34-35, Build and Integration Domain'}
    Service Delivery: {defined_by: 'pp. 36-44, Service Delivery Domain', notes: Formerly Manage Technical Services.}
    Service Consumption: {defined_by: 'pp. 44-46, Service Consumption', notes: Formerly Sell/Consume.}
    Manage Portfolios: {defined_by: 'pp. 10, 46, Manage Portfolios', notes: A view across parts of the other domains; not a set of tables.}
  elements:
    ConfigurationItem: {display: Configuration Item, category: Cross-domain parents, ci: true, inferred: true, section: 'p. 42, Infrastructure configuration items; p. 19, CSDM Life Cycle', abstract: inferred, attributes: [{name: Life Cycle Stage, type: LifeCycleStage, section: 'pp. 19-20'}, {name: Life Cycle Stage Status, type: LifeCycleStageStatus, section: 'pp. 19-20'}, {name: Model ID, type: reference to Product Model, section: 'p. 18'}]}
    Service: {display: Service, category: Cross-domain parents, table: cmdb_ci_service, ci: true, specializes: ConfigurationItem, inferred: true, section: 'p. 37, What is Service Classification attribute?', abstract: inferred, attributes: [{name: Service Classification, type: ServiceClassification, section: 'p. 37'}]}
    ValueStream: {display: Value Stream, category: Foundation, table: cmn_value_stream, ci: false, section: 'p. 14, Value Stream'}
    ValueStreamCategory: {display: Value Stream Category, category: Foundation, table: cmn_value_stream_categories, table_variant: cmn_value_stream_category (Figure 7), ci: false, section: 'pp. 14-15, Value Stream'}
    ValueStreamStage: {display: Value Stream Stage, category: Foundation, table: cmn_value_stream_stage, ci: false, section: 'p. 15, Value Stream'}
    BusinessProcess: {display: Business Process, category: Foundation, table: cmdb_ci_business_process, ci: true, specializes: ConfigurationItem, inferred: true, section: 'p. 14, Foundation Domain; p. 16, Business Process', attributes: [{name: Declared criticality, section: 'p. 16'}, {name: Determined criticality, section: 'p. 16'}, {name: Confidentiality impact, section: 'p. 16'}, {name: Integrity impact, section: 'p. 16'}, {name: Availability impact, section: 'p. 16'}, {name: Review frequency, type: BusinessProcessReviewFrequency, section: 'p. 16'}, {name: Next review date, section: 'p. 16'}, {name: Parent, type: reference to Business Process, section: 'p. 16'}]}
