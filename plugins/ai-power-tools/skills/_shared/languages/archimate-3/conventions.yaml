viewpoints:
  ApplicationCooperation:
    diagram_type: Application
    intent:
    - how applications interact
    - application landscape
    - integration
    - which systems talk to which
    admits:
    - ApplicationComponent
    - ApplicationService
    - ApplicationInterface
    - ApplicationCollaboration
    - DataObject
    - Location
    - Grouping
  ApplicationUsage:
    diagram_type: Application
    intent:
    - which business processes use which applications
    - application support for the business
    admits:
    - ApplicationComponent
    - ApplicationService
    - BusinessProcess
    - BusinessFunction
    - BusinessRole
    - DataObject
    - BusinessObject
  ApplicationStructure:
    diagram_type: Application
    intent:
    - internal structure of an application
    - application composition
    admits:
    - ApplicationComponent
    - ApplicationCollaboration
    - ApplicationInterface
    - DataObject
  InformationStructure:
    diagram_type: Application
    intent:
    - what information the organization holds
    - data model
    - business objects and their representations
    admits:
    - BusinessObject
    - DataObject
    - Representation
    - Artifact
    - Meaning
  BusinessProcessCooperation:
    diagram_type: Business
    intent:
    - how processes depend on each other
    - end-to-end process
    - process handoffs
    admits:
    - BusinessProcess
    - BusinessFunction
    - BusinessInteraction
    - BusinessEvent
    - BusinessService
    - BusinessRole
    - BusinessActor
    - ApplicationService
    - Grouping
  Organization:
    diagram_type: Business
    intent:
    - org chart
    - who reports to whom
    - organizational structure
    - departments
    admits:
    - BusinessActor
    - BusinessRole
    - BusinessCollaboration
    - BusinessInterface
    - Location
    grammar: nested-grid
    notes: 'Drawn as a nested grid rather than bands: containment is the structure, and it needs no connectors.'
  ServiceRealization:
    diagram_type: Business
    intent:
    - how services are realized
    - what delivers this service
    - service to process to application
    admits:
    - BusinessService
    - BusinessProcess
    - BusinessFunction
    - BusinessInteraction
    - BusinessObject
    - ApplicationService
    - ApplicationComponent
    - BusinessActor
    - BusinessRole
  ProductViewpoint:
    diagram_type: Business
    intent:
    - what the organization sells
    - products and the services in them
    - contracts
    admits:
    - Product
    - Contract
    - BusinessService
    - BusinessInterface
    - BusinessActor
    - BusinessRole
    - Value
    - ApplicationService
  Capability:
    diagram_type: Business
    intent:
    - capability map
    - what the organization can do
    - business capabilities
    admits:
    - Capability
    - Resource
    - ValueStream
    - CourseOfAction
    - Grouping
    grammar: nested-grid
    notes: A capability map is a nested grid, and its fill encodes nesting depth rather than layer, so
      a heat-map overlay wants a different channel.
  StrategyViewpoint:
    diagram_type: Business
    intent:
    - strategy
    - how capabilities and resources support goals
    - courses of action
    admits:
    - Resource
    - Capability
    - CourseOfAction
    - ValueStream
    - Goal
    - Outcome
  TechnologyViewpoint:
    diagram_type: Technology
    intent:
    - infrastructure
    - what runs where
    - nodes and networks
    admits:
    - Node
    - Device
    - SystemSoftware
    - TechnologyService
    - TechnologyInterface
    - CommunicationNetwork
    - Path
    - Artifact
    - TechnologyCollaboration
  TechnologyUsage:
    diagram_type: Technology
    intent:
    - how applications use infrastructure
    - which technology supports which application
    admits:
    - Node
    - Device
    - SystemSoftware
    - TechnologyService
    - ApplicationComponent
    - ApplicationService
    - Artifact
  LayeredViewpoint:
    diagram_type: Business
    intent:
    - the whole architecture
    - business to application to technology
    - cross-layer view
    - end to end
    admits:
    - BusinessActor
    - BusinessRole
    - BusinessProcess
    - BusinessService
    - BusinessObject
    - ApplicationComponent
    - ApplicationService
    - DataObject
    - Node
    - Device
    - SystemSoftware
    - TechnologyService
    - Artifact
    - Grouping
    notes: 'The widest viewpoint, so it wins on coverage almost always. Rank it last when a narrower one
      admits everything the content holds: a layered view of three applications is a layered view with
      two empty layers.'
  MotivationViewpoint:
    diagram_type: Motivation
    intent:
    - why
    - drivers and goals
    - what the architecture is for
    - stakeholder concerns
    admits:
    - Stakeholder
    - Driver
    - Assessment
    - Goal
    - Outcome
    - Principle
    - Requirement
    - Constraint
    - Meaning
    - Value
  RequirementsRealization:
    diagram_type: Motivation
    intent:
    - how requirements are met
    - what satisfies this requirement
    - traceability from requirement to design
    admits:
    - Requirement
    - Constraint
    - Goal
    - Principle
    - BusinessProcess
    - BusinessService
    - ApplicationComponent
    - ApplicationService
    - Node
  Principles:
    diagram_type: Motivation
    intent:
    - architecture principles
    - what the principles are
    - principles and the goals behind them
    admits:
    - Principle
    - Goal
    - Driver
    - Requirement
    - Constraint
    - Meaning
  ImplementationAndMigration:
    diagram_type: Implementation
    intent:
    - roadmap
    - migration plan
    - what is delivered when
    - program of work
    admits:
    - WorkPackage
    - Deliverable
    - ImplementationEvent
    - Plateau
    - Gap
    - BusinessRole
    - BusinessActor
    - Requirement
    - Goal
  MigrationViewpoint:
    diagram_type: Implementation
    intent:
    - transition states
    - from current to target
    - where the architecture is going
    admits:
    - Plateau
    - Gap
  ImplementationAndDeployment:
    diagram_type: Implementation
    intent:
    - how the work lands on the estate
    - which deliverable produces which component
    admits:
    - WorkPackage
    - Deliverable
    - ApplicationComponent
    - Artifact
    - Node
    - SystemSoftware
    - Device
presentation_profiles:
  detail:
    description: Everything. The working view, for people building the model.
    connector_labels: true
    connector_stereotypes: true
    element_stereotypes: true
    compartments: all
    notes: true
    collapse_parallel: false
  review:
    description: For a design review. Keeps relationship names, drops the notation furniture that a reviewer
      already knows.
    connector_labels: true
    connector_stereotypes: false
    element_stereotypes: false
    compartments:
    - name
    notes: true
    collapse_parallel: false
  executive:
    description: 'For an audience reading the shape, not the detail. Collapsing hides relationships, so
      this profile REQUIRES an annotation saying what was summarized: an executive view that hides complexity
      without saying so is misleading.'
    connector_labels: false
    connector_stereotypes: false
    element_stereotypes: false
    compartments: none
    notes: false
    collapse_parallel: true
    direction_only: true
