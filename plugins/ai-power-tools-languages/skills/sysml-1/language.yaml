    ProvidedInterface: {line: "a short solid line from the port square or block to a ball (small circle)", target_end: "ball at the interface end", source_end: "none", label: "the interface name beside the ball", section: "9.2.1 (Table 9.1); 9.2.2 (Table 9.2)"}
