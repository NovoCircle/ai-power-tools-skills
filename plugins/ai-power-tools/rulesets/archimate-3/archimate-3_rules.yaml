rules:
  # ---------------------------------------------------------------------------------------------------------
  # Relationship table
  # ---------------------------------------------------------------------------------------------------------
  - id: ARCHIMATE-REL-003
    name: Relationship must be listed in the allowed-relationship table
    implements: ARCHIMATE-REL-003
    also_implements: [ARCHIMATE-REL-004, ARCHIMATE-REL-005, ARCHIMATE-REL-007, ARCHIMATE-REL-009, ARCHIMATE-REL-010, ARCHIMATE-CRS-001, ARCHIMATE-CRS-002]
    description: >
      A relationship between two elements is allowed only if the table lists its type for that source and target
      pair [S1 B.5, 5.7]. A pair inside the table is permitted, not proof that the relationship is right: the table
      includes derivations the standard says may be wrong in a given model. The table gives association between any
      two elements, composition, aggregation and specialization between elements of the same type, access only to
      passive structure (and grouping), and no assignment from behavior to passive structure, so those rules are
      enforced by this one. Connectors that touch a junction are judged by ARCHIMATE-JCT-002; an end that is not an
      ArchiMate 3.1 concept of the table is ignored.
    category: relationship
    severity: error
    demo_trigger: true
    selector:
      type: connector
      connector_stereotypes: any_of_table
    condition:
      type: relationship_table
      table: archimate-3.1-relationships
      skip_endpoints: [ArchiMate_Junction]
      unknown_endpoint: ignore
    remediation:
      short: "Use a relationship the ArchiMate 3.1 relationship table allows between these two element types."
      auto_fixable: false

  # ---------------------------------------------------------------------------------------------------------
  # Junctions
  # ---------------------------------------------------------------------------------------------------------
  - id: ARCHIMATE-JCT-002
    name: Junction cannot take composition, aggregation or specialization
    implements: ARCHIMATE-JCT-002
    description: >
      A junction can be used with access, assignment, flow, influence, association, realization, triggering and
      serving. It cannot be used with composition, aggregation or specialization [S1 5.5.1, B.6]. The rule flags a
      composition, aggregation or specialization connector with a junction at either end. Its endpoint lists name
      every ArchiMate element stereotype except the junction, so a connector of these three kinds is also flagged when
      an end is not an ArchiMate element at all.
    category: junction
    severity: error
    demo_trigger: false
    selector:
      type: connector
      connector_stereotypes:
        - ArchiMate_Composition
        - ArchiMate_Aggregation
        - ArchiMate_Specialization
    condition:
      type: connector_endpoint_stereotype
      source_must_be_one_of:
        - ArchiMate_ApplicationCollaboration
        - ArchiMate_ApplicationComponent
        - ArchiMate_ApplicationEvent
        - ArchiMate_ApplicationFunction
        - ArchiMate_ApplicationInteraction
        - ArchiMate_ApplicationInterface
        - ArchiMate_ApplicationProcess
        - ArchiMate_ApplicationService
        - ArchiMate_Artifact
        - ArchiMate_Assessment
        - ArchiMate_BusinessActor
        - ArchiMate_BusinessCollaboration
