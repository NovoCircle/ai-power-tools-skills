# IT4IT Reference Architecture Conformance Ruleset
# Language:     The Open Group IT4IT Standard 3.0, read from the public draft (February 2022), language file id it4it
# Enforced by:  AI Power Tools for Sparx EA -- validate_model tool
#
# READ FROM THE DRAFT. These rules rest on the public 3.0 draft, not the published text, and make no claim of conformance.
#
# GENERATED from the guide's list. Do not edit by hand.
#
# STORED NAMES. The pack stores IT4IT_FC_<Name> for a component and IT4IT_DO_<Name> for a data object, with no namespace in
# the column rules read (measured on a scratch build, EA 17.1 build 1716). The qualified form IT4ITArchitecture::<stored> is
# in t_xref.
#
# WHAT IS NOT HERE. A check reports what is wrong, never what is missing, because the standard says "can relate" and a
# customer may model part of it. The example data objects and supporting function groups carry no rules: the draft defines
# nothing to check them against. Most of the guide's rules say what a tool or a practice must do, which no model can show.
#
# IMPLEMENTS. A rule marked `implements: pack` checks the pack's own structure, which the guide holds as data and not as a numbered rule.

meta:
  version: '1.0'
  language: it4it
  organization: (your organization)
  mdg_family: IT4IT
  description: Conformance rules for IT4IT models built with the IT4IT pack. Read from The Open Group's public 3.0 draft (February
    2022), with no claim of conformance. They check links between data objects, where data objects and components sit, and
    which shapes each line joins. They never report something as missing.
  severity_levels:
    error: The standard states it as a requirement.
    warning: Outside the standard's list, though the standard allows local additions.
    info: Advisory note; not a conformance violation.
