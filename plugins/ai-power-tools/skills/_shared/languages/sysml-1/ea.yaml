# EA facts for SysML 1.5 as Sparx Enterprise Architect's built-in SysML technology (id SysML1.4) stores it.
# Every stereotype and tag below was created in EA and read back. `concepts` maps a concept of the language skill to the stored
# stereotypes (and the metaclass rows each has); the tags of each stereotype are under `stereotypes`.
# Westbrook Bank appears only in howto.md, as an illustration.

language: sysml-1
technology: SysML1.4
display_name: SysML 1.5
stereotype_prefix: ''
stereotype_storage: 'bare name in t_object.Stereotype, t_attribute.Stereotype, t_operation.Stereotype and t_connector.Stereotype,
  in EA''s own case (block, requirement, satisfy; Expose, FlowProperty, ProxyPort, FullPort, Stakeholder start with a capital);
  the qualified form SysML1.4::<name> is in the t_xref row named Stereotypes (FQName) and is what AddNew and StereotypeEx take.
  EA matches the name after SysML1.4:: without regard to case, and a name with a space (Flow Property) does not match. When an
  element carries two stereotypes, t_object.Stereotype holds only the first and t_xref holds both'
measured_on:
  ea: 17.1 build 1716
  date: '2026-10-21'
  technology_version: '1.5'
  technology_file: 'none: InternalTechnologies\SysML1_4 Tech.xml is encrypted; measured by creating objects'
  standard_version: SysML 1.5 (OMG formal/17-05-01); OMG has 1.6 (2019), 1.7 (2024) and SysML v2 (2025, a new language),
    not described
older_technologies: SysML1.1, SysML1.2 and SysML1.3 are installed beside it and were never bound; the names unit and quantityKind
  bind only under SysML1.3
