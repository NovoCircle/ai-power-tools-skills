    Assumption: {display: Assumption, group: GSN, kind: profile element, layer: profile, specializes: ContextualInformation, abstract: false, uml_base: Class, section: 9.6.1 p. 86, definition: An intentionally unsubstantiated statement., note: 'The text names the parent as SupportingInformation, which does not exist; the machine-readable model gives ContextualInformation.'}
