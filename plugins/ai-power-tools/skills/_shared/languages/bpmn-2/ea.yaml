# EA's names for this language's layout. `tools/gen_conventions.py` reads `layout_map`.
# The language's branch replaces this stub with its full ea.yaml, and keeps `layout_map`.
language: bpmn-2
stub: true
layout_map:
  technology: BPMN2.0
  display_name: BPMN 2.0
  extends: UML
  stereotype_prefix: ''
  notes: |
    EA's BPMN2.0 MDG declares five diagram types, all based on Analysis. Two are deliberately NOT bound here: `Conversation`, whose participants-and-hexagons layout is a graph rather than one the engine composes, and `BPEL`, which is an execution-export type rather than a drawn notation. A caller resolving either gets no binding and should fall back to a plain graph layout: which is the honest answer, and better than composing a conversation into lanes.
  diagram_types:
    Business Process:
      guide: Process
      base: Analysis
      size_keys:
        StartEvent: StartEvent
        EndEvent: EndEvent
        IntermediateEvent: event-circle
        Gateway: Gateway
        DataObject: DataObject
        DataStore: DataStore
    Collaboration:
      guide: Collaboration
      base: Analysis
      size_keys:
        StartEvent: StartEvent
        EndEvent: EndEvent
        IntermediateEvent: event-circle
        Gateway: Gateway
        DataObject: DataObject
    Choreography:
      guide: Choreography
      base: Analysis
      default_type: large-box
      size_keys:
        StartEvent: StartEvent
        EndEvent: EndEvent
        IntermediateEvent: event-circle
        Gateway: Gateway
  presentation_profiles:
    detail:
      description: Everything. The working view.
    review:
      description: For a process walkthrough. Keeps the flow labels, which in BPMN carry the gateway conditions
        and are not optional furniture.
    executive:
      description: 'For an audience following the shape of the process. Note that hiding connector labels
        in BPMN loses the gateway conditions, so an executive BPMN view is a summary of the happy path:
        say so rather than implying the process has no branches.'
