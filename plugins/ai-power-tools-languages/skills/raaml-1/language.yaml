    MalfunctioningBehavior: {display: Malfunctioning Behavior, group: ISO 26262 profile, kind: profile element, layer: profile, specializes: FailureMode, abstract: false, uml_base: Class, section: 9.7.2 p. 104, definition: Marks a failure or unintended behavior of an item with respect to its design intent. A subtype of failure mode.}
