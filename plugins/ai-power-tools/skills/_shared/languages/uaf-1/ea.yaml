# EA's names for this language's layout. tools/gen_conventions.py reads layout_map.
layout_map:
  technology: UAFP_Framework
  technology_reason: "This id comes from a token read from diagrams in EA's example model. The UAF technology on EA 17.1 build 1716 shows no diagram types and was not seen to create this one. Whether UAFP_Framework::UPDM Framework can be created there is not measured."
  display_name: UAF / UPDM Framework
  extends: UML
  stereotype_prefix: ''
  notes: |
    CLASSIFICATION OF THE FAMILY. Only the UPDM Framework diagram is bound: it is (a) composed, a stack of labeled bands each holding a uniform grid of view tiles, which is layered bands. It is a one-diagram sample, and the corpus row and the model agree on the arrangement.

    NOT BOUND, TIMELINE (c). The corpus holds a programme-timeline row, titled AcV-2 Programme Timelines by its own frame. It is a set of colored column bands, one per quarter, with each milestone placed by its date tag inside its column and dashed sequence links running between them. The diagram type dictates the arrangement: horizontal position is a date, and the columns look like EA swimlanes, so we should not be placing coordinates. It needs a separate design and no grammar is invented for it here. It is arguably the time-phased roadmap that `computed-geometry` names, which is not built. The example model holds NO such diagram (its acquisition-view diagram types are AcV-1 and PV-3), and the MDG data that would declare the type is encrypted, so its technology id and diagram type name cannot be resolved here and are deliberately not recorded as a key.

    NOT BOUND, GRAPH (b). Thirty diagram types under the other seven ids are ordinary graphs or trees where EA's own layout is acceptable and we tidy afterwards: UAFP_AV::AV-3, UAFP_AcV/PV::AcV-1, UAFP_AcV/PV::PV-3, UAFP_OV::OV-1, UAFP_OV::OV-2, UAFP_OV::OV-4 Actual, UAFP_OV::OV-4 Typical, UAFP_OV::OV-5, UAFP_OV::OV-6a, UAFP_OV::OV-7, UAFP_SOV::SOV-1, UAFP_SOV::SOV-2, UAFP_SOV::SOV-3, UAFP_SOV::SOV-4a, UAFP_SOV::SOV-5, UAFP_SV/SvcV::SV-1, UAFP_SV/SvcV::SV-10a, UAFP_SV/SvcV::SV-11, UAFP_SV/SvcV::SV-4, UAFP_SV/SvcV::SV-5, UAFP_SV/SvcV::SV-6, UAFP_SV/SvcV::SV-7, UAFP_SV/SvcV::SV-9, UAFP_StV/CV::StV-1, UAFP_StV/CV::StV-2, UAFP_StV/CV::StV-4, UAFP_StV/CV::StV-5, UAFP_StV/CV::StV-6, UAFP_TV/StdV::TV-1, UAFP_TV/StdV::TV-2. The basis is the base diagram type EA records (Logical, Object or Activity) plus what the one or two model diagrams of each type hold: classes, parts and activities joined by associations, dependencies and generalizations, with no activity partitions and almost no containment. Three of them may deserve a composed grammar once someone measures them, each rests on ONE diagram, and none is claimed: UAFP_OV::OV-4 Typical is a generalization tree (9 generalizations among 16 classes, a layered-bands candidate), and UAFP_SV/SvcV::SV-1 and one of the two UAFP_StV/CV::StV-4 diagrams nest their parts (5 of 11 and 7 of 8 contained, nested-grid candidates). UAFP_SV/SvcV::SV-4 covers two different shapes, an activity graph and an action flow with pins nested in actions (18 of 24 contained), and should be split before it is bound.

    NOT BOUND, EA-SEMANTIC (c). UAFP_OV::OV-6b, UAFP_SOV::SOV-4b and UAFP_SV/SvcV::SV-10b are state machines: transition topology with states nested in composite states (7 of 8, 9 of 10 and 21 of 22 elements contained), which EA owns as containment. UAFP_OV::OV-6c is a sequence diagram: lifeline order and message order, with 7 lifeline parts and no drawn connectors on the model diagram. Each needs a separate design and no grammar is invented for them here.
  diagram_types:
    UPDM Framework:
      token_reason: "A token read from diagrams in EA's example model, and not one ea.yaml lists: the UAF technology on EA 17.1 build 1716 shows no diagram types and was not seen to create this one. Whether it can be created there is not measured."
      base: Logical
      default_type: large-box
      arrangement: layered-bands
      title: frame-header
      route: straight
      channels:
        fill: 'View category. The corpus row shows one color per band (All, Strategic, Operational, Service
          Oriented, Systems, Acquisition and Technical views). It is not stored per diagram: none of the
          47 elements carries a fill override, so EA paints it. Recoloring a tile breaks the category
          reading, and whether a written fill is honored was not tested.'
        claimed:
          position: Which band a tile sits in says which view category it belongs to. Ordering within
            a band is not measured.
          icon: The view-tile glyph in each tile's corner, painted from the stereotype (corpus row, n=1
            diagram). Not measured in the model.
        free:
        - border
        - border_width
        - font_color
        - opacity
