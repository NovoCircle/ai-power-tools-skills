    SafeState: {display: Safe State, group: ISO 26262 requirements, kind: relationship profile element, layer: profile, abstract: false, uml_base: Dependency, section: 9.7.2 p. 105, definition: 'A state of a function realized by one or more architectural components, tied to safety behaviors and typically entered after a failure mode occurs.', note: The text describes SafeState as a state although it extends a dependency.}
