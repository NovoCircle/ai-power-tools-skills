ea_only:
  stereotypes:
    entity: a Class; a business entity (no tagged value)
    specification: a Component marking a participant that is only a specification (the standard shows the keyword 'specification'
      on such a participant)
    participantArchitecture: a Class or Component for the services architecture of one participant
  diagram_types:
  - SoaML
  - SoaMLSequence (the standard defines none)
  samples: EA's model patterns so1.0-* (starter SOA model, basic service architecture, basic service contract, basic service contract
    choreography) use participant, servicePoint, requestPoint, serviceContract and servicesArchitecture
