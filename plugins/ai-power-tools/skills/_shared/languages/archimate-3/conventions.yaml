# GENERATED by tools/gen_conventions.py. Do not edit: CI and the plugin build fail on any
# difference. Sizes, spacing, and vocabulary come from the layout standard on the language
# shelf. EA's names come from `layout_map` in this folder's ea.yaml. To change a value,
# change the source and run `python tools/gen_conventions.py`.

technology: ArchiMate3
display_name: ArchiMate 3
extends: UML
stereotype_prefix: ArchiMate_
notes: |
  EA's ArchiMate3 MDG declares five diagram types, all based on Logical. There is no Strategy diagram type: strategy concepts (Capability, Resource, CourseOfAction, ValueStream) are stereotypes drawn on a Business diagram.

  FILL IS NOT MERELY CLAIMED HERE, IT IS SOMETIMES UNAVAILABLE. Measured on EA 17.1 build 1716: Node and Grouping ignore a per-diagram fill outright. The write succeeds, the property reads back, and EA draws the element in its own colors -- Node's shape script paints the faces of a 3D box, and a Grouping is a dashed container ArchiMate gives no fill. Seven other concepts tested (ApplicationComponent, Device, SystemSoftware, Equipment, Facility, BusinessService, Artifact) honor it. Nine concepts is a sample, not a sweep, so the answer is a note here rather than data a consumer could trust; the full sweep and a per-concept schema field are filed separately. If you need a color-coded technology layer, reach for Device or SystemSoftware rather than Node, or use a free channel.
diagram_types:
  Business:
    base: Logical
    grammar: layered-bands
    title: drawn
    sizing:
      default:
        w: 100
        h: 70
      Junction:
        w: 20
        h: 20
    spacing:
      item_gap_x: 80
      item_gap_y: 50
      item_gap_flow: 60
      lane_gap: 0
      min_lane_thickness: 120
      band_gap: 30
      origin_left: 40
      origin_top: -40
      band_pad_x: 12
      band_pad_y: 12
      lane_pad: 12
      grid_pad: 12
      label_height: 28
    routing:
      default: OrthogonalSquare
      trunk_route: OrthogonalSquare
      trunk_for:
      - Realization
      - Aggregation
      - Composition
      - Specialization
    channels:
      fill: 'Layer and aspect, by our convention: yellow business, blue application, green technology,
        as in the standard''s examples (3.9). Not normative, but keep it, because recoloring by lifecycle
        or ownership stops a reader telling a business service from an application one.'
      claimed:
        position: Abstraction level. Y position says which layer an element belongs to, so moving an element
          between bands changes what the diagram asserts.
        size: Role. Uniform to the pixel within a band; varying it reads as varying importance.
      free:
      - border
      - border_width
      - line_color
      - font_color
      - opacity
      - icon
