rules:
- id: IT4IT30-REL-001
  implements: IT4IT-REL-001
  name: Two data objects link only where the standard lists a link
  description: The standard lists each data object's key relationships. A link outside that list is outside the standard,
    though the standard says other links may be kept for local needs, so this is a warning. Any shape the table does not name
    is left alone.
  category: rel
  severity: warning
  demo_trigger: false
  selector:
    type: connector
    connector_stereotypes: any_of_table
  condition:
    type: relationship_table
    table: it4it-3.0-draft-data-relationships
    unknown_endpoint: ignore
  remediation:
    short: Use a link the standard lists between these two data objects, or keep this one as a known local link.
    auto_fixable: false
- id: IT4IT30-CTRL-001
  implements: IT4IT-DEF-003
  name: Policy sits only in the Policy component
  description: A data object is controlled by one functional component (11.7.5), and the standard names Policy for Policy.
    A data object directly in a package passes, because a partial model is valid.
  category: ctrl
  severity: error
  demo_trigger: false
  selector:
    type: element
    stereotypes:
      any_of:
      - IT4IT_DO_Policy
  condition:
    type: contained_in
    path:
    - stereotype_one_of:
      - IT4IT_FC_Policy
      - type:Package
  remediation:
    short: Move this data object into the Policy component, or directly into a package.
    auto_fixable: false
