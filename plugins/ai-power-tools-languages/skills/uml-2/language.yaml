    "Transition": {line: "solid line (straight or bent) between two vertices", target_end: "open (stick) arrowhead at the target", source_end: "none", label: "trigger [, trigger] [guard] / effect, as text near the line; a protocol transition has no effect and may end with a postcondition in brackets", section: "14.2.4.8, 14.4.4.2, Figures 14.23, 14.34, 14.35"}
