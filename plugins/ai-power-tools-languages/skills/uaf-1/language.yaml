conventions:
- {id: UAF-CONV-001, statement: 'A view is framed by the SysML diagram type that underlies it, and each element is drawn in the standard notation of the UML or SysML metaclass it extends.', section: '6.4'}
- {id: UAF-CONV-002, statement: 'Each view specification recommends one or more forms (block definition, internal block, activity, state machine, sequence, parametric or requirement diagram, table, matrix, timeline, BPMN diagram, text). The recommendation is not a requirement.', section: DMM 2}
- {id: UAF-CONV-003, statement: 'In the metamodel figures, color marks the kind of element (individual, type, tuple, abstract, enumeration, external type). The colors are a legend for reading the specification, not a drawing rule for models.', section: DMM 1.4}
constraints:
- {id: UAF-CONF-001, statement: 'A tool conforms to the UAF profile at its single compliance level, which is a profile of SysML 1.4 that imports the SysML profile and defines constraints pairing the use of SysML elements with UAF elements.', strength: must, section: '2', checkable: none}
- {id: UAF-CONF-002, statement: 'Every element, attribute, constraint, association and package structure the profile defines exists in the implementation and complies with the specification.', strength: must, section: '2', checkable: none}
- {id: UAF-CONF-003, statement: The implementation supports XMI import and export of both the user model and the profile., strength: must, section: '2', checkable: runtime}
- {id: UAF-CONF-004, statement: The implementation imports and exports UAF profile models with no loss and no transformation (full fidelity)., strength: must, section: '2', checkable: runtime}
- {id: UAF-GEN-001, statement: An abstract element is never used directly; only its concrete specializations are used. Thirty-three elements are abstract., strength: must, section: 7.1 (isAbstract entries); DMM 1.4 (legend), checkable: static}
- {id: UAF-GEN-002, statement: 'The start and end dates of an actual element are written as ISO 8601 date-times with a time zone designator (YYYY-MM-DDThh:mm:ssTZD).', strength: must, section: '7.1.3.1 (ISO8601DateTime, ActualState)', subject: ActualState, checkable: partial}
- {id: UAF-GEN-003, statement: Every UAF element specializes UAFElement and so may carry a URI and a link to the standards it conforms to., strength: note, section: 7.1.13 (UAFElement), subject: UAFElement, checkable: none}
- {id: UAF-GEN-004, statement: 'Every measurable element can be measured by applying MeasurementSets, and actual values are recorded by ActualMeasurementSets.', strength: note, section: 7.1.2 (MeasurableElement), subject: MeasurableElement, checkable: none}
- {id: UAF-GEN-005, statement: The Metadata Taxonomy cell is a placeholder for extending the profile to other domains and has no diagram type of its own., strength: note, section: DMM 1.1 (note f), checkable: none}
- {id: UAF-GEN-006, statement: Every profile element can be traced to a domain metamodel element; the profile is derived from the metamodel by mapping its concepts and relationships., strength: note, section: '6.3', checkable: none}
- {id: UAF-END-001, statement: An Alias may annotate only a UAFElement (or a specialization of it)., strength: must, section: 7.1.1, subject: Alias, property: annotatedElement, checkable: static}
- {id: UAF-END-002, statement: A Definition may annotate only a UAFElement (or a specialization of it)., strength: must, section: 7.1.1, subject: Definition, property: annotatedElement, checkable: static}
- {id: UAF-END-003, statement: The client of a SameAs must be a UAFElement (or a specialization of it)., strength: must, section: 7.1.1, subject: SameAs, property: client, checkable: static}
- {id: UAF-END-004, statement: The supplier of a SameAs must be a UAFElement (or a specialization of it)., strength: must, section: 7.1.1, subject: SameAs, property: supplier, checkable: static}
- {id: UAF-END-005, statement: 'When the supplier is an OperationalActivity, the client must be an OperationalAgent; when the supplier is a ServiceFunction, the client must be a ServiceSpecification; when the supplier is a Function other than a ProjectActivity, the client must be a ResourcePerformer; when the supplier is a ProjectActivity, the client must be a Project.', strength: must, section: 7.1.3.3, subject: IsCapableToPerform, property: client, checkable: static}
- {id: UAF-END-006, statement: 'When the client is an OperationalAgent, the supplier must be an OperationalActivity; when the client is a ServiceSpecification, the supplier must be a ServiceFunction; when the client is a ResourcePerformer, the supplier must be a Function other than a ProjectActivity; when the client is a Project, the supplier must be a ProjectActivity.', strength: must, section: 7.1.3.3, subject: IsCapableToPerform, property: supplier, checkable: static}
- {id: UAF-END-007, statement: 'When the supplier is an OperationalActivityAction, the client must be an OperationalRole; when the supplier is a ServiceFunctionAction, the client must be a ServiceSpecificationRole; when the supplier is a FunctionAction other than a ProjectActivityAction, the client must be a ResourceRole; when the supplier is a ProjectActivityAction, the client must be a ProjectRole.', strength: must, section: 7.1.3.3, subject: PerformsInContext, property: client, checkable: static}
- {id: UAF-END-008, statement: 'When the client is an OperationalRole, the supplier must be an OperationalActivityAction; when the client is a ServiceSpecificationRole, the supplier must be a ServiceFunctionAction; when the client is a ResourceRole, the supplier must be a FunctionAction other than a ProjectActivityAction. (The standard states no supplier rule for a ProjectRole client.)', strength: must, section: 7.1.3.3, subject: PerformsInContext, property: supplier, checkable: static}
- {id: UAF-END-009, statement: An ArchitectureMetadata may annotate only an ArchitecturalDescription (or a specialization of it)., strength: must, section: 7.1.3.4, subject: ArchitectureMetadata, property: annotatedElement, checkable: static}
- {id: UAF-END-010, statement: An Information may annotate only a ConceptItem (or a specialization of it)., strength: must, section: 7.1.3.4, subject: Information, property: annotatedElement, checkable: static}
- {id: UAF-END-011, statement: A Metadata may annotate only a UAFElement (or a specialization of it)., strength: must, section: 7.1.3.4, subject: Metadata, property: annotatedElement, checkable: static}
- {id: UAF-END-012, statement: The client of an ArchitecturalReference must be an ArchitecturalDescription (or a specialization of it)., strength: must, section: 7.1.3.6, subject: ArchitecturalReference, property: client, checkable: static}
- {id: UAF-END-013, statement: The supplier of an ArchitecturalReference must be an ArchitecturalDescription (or a specialization of it)., strength: must, section: 7.1.3.6, subject: ArchitecturalReference, property: supplier, checkable: static}
- {id: UAF-END-014, statement: 'When the supplier is an OperationalAgent, the client must be a ResourcePerformer; an OperationalActivity or a ServiceFunction, a Function; a ServiceInterface or an OperationalInterface, a ResourceInterface; an OperationalConnector or a ResourceConnector, a ResourceConnector; an OperationalExchange, a ResourceExchange; an OperationalRole, a ResourceRole; an ActualEnduringTask, an OperationalActivity; an InformationElement, a DataElement.', strength: must, section: 7.1.3.6, subject: Implements, property: client, checkable: static}
- {id: UAF-END-015, statement: 'When the client is a ResourcePerformer, the supplier must be an OperationalAgent; a Function, an OperationalActivity or a ServiceFunction; a ResourceInterface, a ServiceInterface or an OperationalInterface; a ResourceConnector, an OperationalConnector or a ResourceConnector; a ResourceExchange, an OperationalExchange; a ResourceRole, an OperationalRole; an OperationalActivity, an ActualEnduringTask; a DataElement, an InformationElement.', strength: must, section: 7.1.3.6, subject: Implements, property: supplier, checkable: static}
- {id: UAF-END-016, statement: A VisionStatement may annotate only an EnterpriseVision (or a specialization of it)., strength: must, section: 7.1.4.1, subject: VisionStatement, property: annotatedElement, checkable: static}
- {id: UAF-END-017, statement: The client of a CapabilityForTask must be a Capability (or a specialization of it)., strength: must, section: 7.1.4.3, subject: CapabilityForTask, property: client, checkable: static}
