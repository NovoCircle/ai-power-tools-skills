rules:
- id: CSDM5-REL-001
  implements: CSDM-REL-001
  name: 'CSDM 5: a line joins only the pairs CSDM lists'
  description: CSDM's Figure 16 and text list the relationships to use, without saying others are forbidden, so a pair outside
    the list is a warning. Any shape the table doesn't name is left alone.
  category: rel
  severity: warning
  demo_trigger: false
  selector:
    type: connector
    connector_stereotypes: any_of_table
  condition:
    type: relationship_table
    table: csdm-5-relationships
    unknown_endpoint: ignore
  remediation:
    short: Use a line CSDM lists between these two shapes, or keep this one as a known local link.
    auto_fixable: false
- id: CSDM5-TBL-005
  implements: CSDM-TBL-005
  name: 'CSDM 5: a relationship line touches no Foundation entity other than Business Process'
  description: Foundation tables are referential data and aren't used in CMDB relationships (p. 14). Business Process is the
    exception, because it is a CMDB table. This covers Product Models, Contracts, common data, and CMDB Groups.
  category: tbl
  severity: error
  demo_trigger: false
  selector:
    type: connector
    connector_stereotypes:
    - CSDMOperationalizes
    - CSDMProvidedBy
    - CSDMUses
    - CSDMConsumes
    - CSDMContains
    - CSDMConnectedTo
    - CSDMDependsOn
    - CSDMConnectedBy
    - CSDMReceivesDataFrom
    - CSDMRunsOn
  condition:
    type: connector_endpoint_stereotype
    source_must_be_one_of: &id001
    - CSDMProductIdea
    - CSDMPlanningItem
    - CSDMStrategicPlan
    - CSDMStrategicPriority
    - CSDMGoal
    - CSDMTarget
    - CSDMBusinessCapability
    - CSDMBusinessApplication
    - CSDMInformationObject
    - CSDMSDLCComponent
    - CSDMAISystemDigitalAsset
    - CSDMAIModelDigitalAsset
    - CSDMAIDatasetDigitalAsset
    - CSDMAIPromptDigitalAsset
    - CSDMServiceInstance
    - CSDMApplicationService
    - CSDMDataServiceInstance
    - CSDMConnectionServiceInstance
    - CSDMNetworkServiceInstance
    - CSDMOperationalProcessServiceInstance
    - CSDMFacilityServiceInstance
    - CSDMNetworkFunction
    - CSDMAPI
    - CSDMApplication
    - CSDMNetworkFunctionApplication
    - CSDMAIFunction
    - CSDMAIApplication
    - CSDMOperationalTechnology
    - CSDMInfrastructureCI
    - CSDMAsset
    - CSDMInstallBaseItem
    - CSDMConnectedDevice
    - CSDMTechnologyManagementService
    - CSDMTechnologyManagementServiceOffering
    - CSDMDynamicCIGroup
    - CSDMBusinessService
    - CSDMBusinessServiceOffering
    - CSDMServiceCommitment
    - CSDMServiceOfferingSubscription
    - CSDMRequestCatalog
    - CSDMCatalogItem
    - CSDMPortfolio
    - CSDMServicePortfolio
    - CSDMBusinessProcess
    target_must_be_one_of: *id001
  remediation:
    short: Replace this relationship line with the reference line CSDM gives this Foundation entity.
    auto_fixable: false
- id: CSDM5-SVC-001
  implements: CSDM-SVC-001
  name: 'CSDM 5: a business or technology management service isn''t nested under its own kind'
  description: Business Services and Technology Management Services are each single level (p. 11).
  category: svc
  severity: error
  demo_trigger: false
  selector:
    type: connector
    connector_stereotypes:
    - CSDMParentOf
    - CSDMContains
  condition:
    type: relationship_table
    table: csdm-5-service-levels
    unknown_endpoint: ignore
  remediation:
    short: Remove the line, and show the stratification with offerings.
    auto_fixable: false
- id: CSDM5-SVC-004
  implements: CSDM-SVC-004
  name: 'CSDM 5: a Dynamic CI Group contains no other group'
  description: A Dynamic CI Group contains CIs and cannot contain other groups (p. 43).
  category: svc
  severity: error
  demo_trigger: false
  selector:
    type: connector
    connector_stereotypes:
    - CSDMMember
  condition:
    type: relationship_table
    table: csdm-5-group-members
    unknown_endpoint: ignore
  remediation:
    short: Point the group's Member line at CIs, not at another group.
    auto_fixable: false
- id: CSDM5-SVC-005
  implements: CSDM-SVC-005
  name: 'CSDM 5: a Dynamic CI Group''s classification, when set, is one of its two values'
  description: A Dynamic CI Group's classification is Application Service or Technical Service (p. 44). A blank value passes,
    because all fields are optional.
  category: svc
  severity: error
  demo_trigger: false
  selector:
    type: element
    stereotypes:
      any_of:
      - CSDMDynamicCIGroup
  condition:
    type: tagged_value_constraint
    tags:
    - name: Service classification
      value_must_be_one_of:
      - Application Service
      - Technical Service
  remediation:
    short: Pick Application Service or Technical Service.
    auto_fixable: false
- id: CSDM5-SVC-002
  implements: CSDM-SVC-002
  name: 'CSDM 5: an operational service has an offering'
  description: Every operational Business Service and Technology Management Service has at least one offering (pp. 43, 45,
    54-55). A service with no stage set isn't selected.
  category: svc
  severity: warning
  demo_trigger: false
  selector:
    type: element
    stereotypes:
      any_of:
      - CSDMBusinessService
      - CSDMTechnologyManagementService
    tagged_value_filter:
    - tag: Life Cycle Stage
      value_in:
      - Operational
  condition:
    type: connector_count
    connector_stereotype: CSDMPublishedAs
    direction: outgoing
    min: 1
  remediation:
    short: Add a Published as line to an offering, or correct the service's stage.
    auto_fixable: false
- id: CSDM5-TBL-010
  implements: CSDM-TBL-010
  name: 'CSDM 5: the legacy process reference isn''t used'
  description: A Business Application's single reference to a Business Process is legacy from CSDM 5 and isn't recommended
    (p. 33).
  category: tbl
  severity: warning
  demo_trigger: false
  selector:
    type: element
    stereotypes:
      any_of:
      - CSDMBusinessApplication
  condition:
    type: connector_count
    connector_stereotype: CSDMProcessReference
    direction: outgoing
    max: 0
  remediation:
    short: Relate the process another way, and remove this reference.
    auto_fixable: false
- id: CSDM5-REL-004
  implements: CSDM-REL-004
  name: 'CSDM 5: a capability has something providing it'
  description: Create a relationship between each Business Capability and its Business Applications (p. 31). A Business Service
    may also provide it (Figure 16).
  category: rel
  severity: warning
  demo_trigger: false
  selector:
    type: element
    stereotypes:
      any_of:
      - CSDMBusinessCapability
  condition:
    type: connector_count
    connector_stereotype: CSDMProvidedBy
    direction: outgoing
    min: 1
  remediation:
    short: Add a Provided by line to the Business Application or Business Service behind this capability.
    auto_fixable: false
- id: CSDM5-REL-008
  implements: CSDM-REL-008
  name: 'CSDM 5: a Business Application''s Uses or Consumes reaches only an Application Service or an Information Object'
  description: A Business Application relates to Application Services and to no other type of Service Instance (docs, CI relationships).
  category: rel
  severity: warning
  demo_trigger: false
  selector:
    type: connector
    connector_stereotypes:
    - CSDMUses
    - CSDMConsumes
  condition:
    type: relationship_table
    table: csdm-5-application-uses
    unknown_endpoint: ignore
  remediation:
    short: Point this line at an Application Service.
    auto_fixable: false
- id: CSDM5-LCY-001
  implements: CSDM-LCY-003
  name: 'CSDM 5: life cycle values belong to the product process'
  description: An object takes only the stage and status values of its own life cycle process (pp. 20-27). Stage and status
    are each checked, not as a pair, and a blank passes.
  category: lcy
  severity: error
  demo_trigger: false
  selector:
    type: element
    stereotypes:
      any_of:
      - CSDMProductModel
      - CSDMApplicationModel
      - CSDMSystemComponentModel
      - CSDMSoftwareComponentModel
      - CSDMServiceOfferingModel
      - CSDMFirmwareModel
      - CSDMAISystemProductModel
      - CSDMServiceModel
      - CSDMSoftwareModel
      - CSDMContentProductModel
      - CSDMAIContentProductModel
      - CSDMContractModel
      - CSDMFacilityModel
      - CSDMHardwareModel
      - CSDMConsumableModel
      - CSDMEnterpriseGoodModel
  condition:
    type: tagged_value_constraint
    tags:
    - name: Life Cycle Stage
      value_must_be_one_of:
      - Ideation
      - Design
      - Build & Integrate
      - Operational
      - End of Life
    - name: Life Cycle Stage Status
      value_must_be_one_of:
      - Under Evaluation
      - Pilot
      - Design
      - Chartered
      - Planning
      - Build
      - In production
      - In Use
      - Available
      - End of Support
      - Pending Retirement
      - Obsolete
      - Retired
      - Sold
  remediation:
    short: Pick a stage and status from the product list.
    auto_fixable: false
