      band_gap: 30
      origin_left: 40
      origin_top: -40
      band_pad_x: 12
      band_pad_y: 12
      lane_pad: 12
      grid_pad: 12
      label_height: 28
    routing:
      default: Direct
      trunk_route: TreeVertical
      trunk_for:
      - Generalization
    channels:
      fill: null
      claimed:
        position: Set by automatic layout rather than by the notation. UML gives position no meaning on
          this diagram, and a layout pass overwrites anything set beforehand, so it can't carry a second
          variable.
        size: Compartment content. A class box is sized by the attributes and operations it shows, so
          using size to encode something else fights the content.
        line_style: 'Normative in UML: dashed against solid separates a dependency or a realization from
          an association. Overwriting it changes what a connector means.'
      free:
      - fill
      - border
      - border_width
      - line_color
      - font_color
      - opacity
      - icon
