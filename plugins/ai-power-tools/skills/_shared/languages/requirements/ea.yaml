ea_only:
  ArchitecturalRequirement:
    for: 'An EAREQ requirement stereotype for a requirement on the architecture (tags hardware, software, performance, priority). No concept of the language:
      the language has no architecture requirement type.'
  SecurityRequirement:
    for: An EAREQ requirement stereotype (tags goal, policy, priority). The language treats security as a quality category of a QualityRequirement, not
      as a type.
  RequirementsChecklist:
    for: An EAREQ stereotype on an Artifact, not a requirement. Its Checklist tag holds ten quality items (Atomic, Attainable, Cohesive, Complete, Current,
      Independent, Modifiable, Traceable, Unambiguous, Verifiable), none of which is checked at creation. EA also has a built-in stereotype of the same
      name on the Requirement type.
  Functional:
    for: EA's built-in stereotype of the Requirement type that the rq2.0 model patterns use (t_stereotypes; GUID form, not EAREQ). Counted by the ruleset
      with the system level stereotypes.
