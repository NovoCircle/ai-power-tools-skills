constraints:
- id: BMM-CARD-001
  statement: Every Assessment judges at least one Influencer and affects the achievement of at least one End or the employment of at least one Means.
  strength: should
  section: 9.2 (Assessment entry), p. 59
- id: BMM-CARD-002
  statement: Every Assessment identifies at least one Potential Impact.
  strength: should
  section: 9.2 (Assessment entry), p. 59
- id: BMM-CARD-003
  statement: Every Assessment is made by at least one Organization Unit.
  strength: should
  section: 9.2 (Organization Unit entry), p. 68
- id: BMM-CARD-004
  statement: Every End is defined by at least one Organization Unit.
  strength: should
  section: 9.2 (Organization Unit entry), p. 68
- id: BMM-CARD-005
  statement: A Goal amplifies at most one Vision.
  strength: must
  section: 9.2 (Goal entry), p. 65
- id: BMM-CARD-006
  statement: A Mission makes operative at most one Vision.
  strength: must
  section: 9.2 (Mission entry), p. 66
- id: BMM-CARD-007
  statement: An Influencing Organization is played by at most one Organization Unit, and a Regulation is the role of at most one Directive.
  strength: must
  section: 8.5.3; 8.5.4; normative machine-readable model
- id: BMM-CARD-008
  statement: Unless a rule says otherwise, every relationship is many-to-many and optional at both ends.
  strength: must
  section: 6.1; Annex A
- id: BMM-HIER-001
  statement: 'A Desired Result includes only Desired Results of its own kind: Goals include Goals and Objectives include Objectives. The only link between a Goal and an Objective is that the Objective quantifies the Goal.'
  strength: must
  section: 9.2 (Desired Result entry), p. 63; 8.2.6.1
- id: BMM-HIER-002
  statement: 'Each of the nine relationships that connect a concept to itself (listed in 8.7) is transitive and may not form a loop: a category cannot, directly or through its descendants, include or categorize its own ancestor.'
  strength: must
  section: 8.7, p. 58
- id: BMM-HIER-003
  statement: A Course of Action includes Courses of Action of the same kind (Strategies with Strategies, Tactics with Tactics), and one Course of Action enables another of the same kind in the usual case.
  strength: should
  section: 8.3.12.1; 8.3.12.2
- id: BMM-DEF-001
  statement: 'A Business Policy is under the enterprise''s control: an authorized party chooses it from alternatives in response to one or more Assessments.'
  strength: note
  section: 8.3.10; 9.2 (Business Policy entry)
- id: BMM-DEF-002
  statement: 'A Business Rule is practicable and atomic: one aspect of governance in the enterprise''s standard vocabulary, which a person can check directly against a situation. A Business Policy is neither directly practicable nor directly automatable.'
  strength: must
  section: 8.3.9; 8.3.11; 9.2
- id: BMM-DEF-003
  statement: An enforcement level applies only to behavior-guiding rules, never to definitional rules, which are true by definition. A Tactic is what sets the enforcement level of a Business Rule.
  strength: must
  section: 8.3.7 and footnote 4; 9.2
- id: BMM-REL-001
  statement: An Objective that quantifies a Goal gives the basis for measuring progress toward that Goal.
  strength: must
  section: 8.2.5; 9.2 (Objective entry)
- id: BMM-REL-002
  statement: Every Course of Action is governed by some Directive. A Course of Action with none should be examined carefully, although too many Directives can over-constrain it.
  strength: should
  section: 8.3.6, p. 31
- id: BMM-REL-003
  statement: A Business Rule is often, but not necessarily, derived from a Business Policy; the link is optional.
  strength: note
  section: 8.3.11
- id: BMM-REL-004
  statement: An Influencer leads to a Business Policy only through an Assessment that identifies a Potential Impact.
  strength: must
  section: 8.5.7, p. 50
- id: BMM-REL-005
  statement: When an Assessment is related to both an End and a Means and no direct relationship joins them (Course of Action channels efforts towards Desired Result, or Directive supports achievement of Desired Result), the gap should be considered carefully.
  strength: should
  section: 8.5.5; 9.2 (Assessment entry)
- id: BMM-REL-006
  statement: Each Influencer is placed in at least one general Influencer Category and is classed as internal or external. The class may be given by a subclass (Internal Influencer or External Influencer) or by an instance of an internal or external Influencer Category; either mechanism satisfies the rule.
  strength: should
  section: 8.5.2; Annex G.3
- id: BMM-REL-007
  statement: A relationship between two BMM concepts is allowed only if the standard defines that relationship (one of its fact types) between those concepts or concepts they specialize. The standard's relationship catalog is held as data in this language file; a pair it does not list allows no relationship.
  strength: must
  section: 9.5; 9.6
- id: BMM-QUAL-001
  statement: An Objective is attainable, time-targeted and measurable. Time-targeted means it states an absolute or relative time frame for when it is met. Measurable means it carries explicit criteria for whether it is being met, at minimum a yes-or-no basis.
  strength: must
  section: 8.2.5, p. 24; 7.3.1
- id: BMM-QUAL-002
  statement: An Objective statement begins with its time target, followed by a quantified noun.
  strength: should
  section: 8.2.5, p. 25
- id: BMM-QUAL-003
  statement: A Goal is narrow enough that Objectives can quantify it. A Vision is too broad to be measured directly by Objectives, and Goals themselves are not specific in time or measure.
  strength: should
  section: 8.2.3; 8.2.4
- id: BMM-QUAL-004
  statement: 'A Mission statement has exactly three brief parts and nothing more: an action, a product or service, and a market or customer. It stays day to day and broad enough to cover all Strategies.'
  strength: should
  section: 8.3.2, p. 28
- id: BMM-QUAL-005
  statement: Qualitative or comparative words that describe a desired end state (best, fastest, leading-edge) belong in Ends and Directives, not in a Mission, Strategy or Tactic. Qualitative words that do not name the end state are acceptable.
  strength: should
  section: 8.4, p. 38
- id: BMM-QUAL-006
  statement: An Influencer is stated neutrally and factually, with no qualitative words. A statement that carries them is really an Assessment.
  strength: should
  section: 8.5, p. 38
- id: BMM-QUAL-007
  statement: If a Business Rule can be derived directly from a statement, the statement is almost certainly not an Influencer; it is probably a Business Policy.
  strength: should
  section: 8.5.1, p. 39
- id: BMM-QUAL-008
  statement: An Influencer is described, not only named.
  strength: should
  section: 8.5.1
- id: BMM-QUAL-009
  statement: Avoid a Business Policy that only restates a Strategy in a trivial way.
  strength: should
  section: 8.3.10, p. 35
- id: BMM-GUID-001
  statement: Directives that are not stated cannot be addressed by the model; to count, a Directive is explicit and recorded officially.
  strength: note
  section: 8.3.6, p. 31
- id: BMM-GUID-002
  statement: Strategies generally pair with Goals and Tactics with Objectives, but the standard does not enforce the pairing. An enterprise that wants it adds its own constraint.
  strength: note
  section: 8.2.3 footnote 1; 7.3.3
- id: BMM-GUID-003
  statement: The line between Strategy and Tactic is the enterprise's own; a Course of Action may move from one to the other over time.
  strength: note
  section: 7.3.3; 8.2.3; 8.3.3.1
- id: BMM-GUID-004
  statement: When several Assessments attach to one End or Means, evaluate their combined impact to expose trade-offs between Risks and Potential Rewards.
  strength: should
  section: 8.5.7.1
- id: BMM-GUID-005
  statement: Business Process, Organization Unit, Asset and Liability instances are references to things maintained elsewhere. Record only those relevant to governance decisions; a complete structure of assets is not required.
  strength: note
  section: 8.6; 8.6.3
- id: BMM-GUID-006
  statement: Keeping the three decompositions (of Desired Results, Courses of Action and Business Policies) in step with each other is left to methodology and tools.
  strength: note
  section: 7.2.5
- id: BMM-GUID-007
  statement: Recording who defined an End, who established a Means, who recognized an Influencer and who made an Assessment, and when, is recommended as an audit trail but cannot always be required.
  strength: note
  section: 8.2; 8.3; 8.5.1; 8.5.6
- id: BMM-GUID-008
  statement: Using a Vision or a Mission is optional; an enterprise can use the model without either.
  strength: note
  section: 7.3.1; 7.3.2
- id: BMM-GUID-009
  statement: 'The model should be traceable in both directions: forward from an Influencer''s impact to the processes, rules and responsibilities it leads to, and backward from a process or rule to the reason it exists.'
  strength: note
  section: 7.2.3; 7.4
data_types:
  coverage: none
  note: The standard defines no data types; its only attributes are name and description on every concept, with no type stated.
  attributes:
    coverage: every_concept
    where: concepts
    section: "9.3"
    note: Name and description sit on a common superclass (MotivationElement), so each of the 33 concepts carries both. The standard gives neither a type or a multiplicity, and defines no other attribute. Who defined an element, who assessed it, when, an Objective's time target and its measurement criteria have no attribute.
notation:
  coverage: informative
  section: Annex A
  note: No symbols or diagram types are defined; Annex A, which is informative, gives three non-normative conventions and nothing else.
  default:
    shape: a box
    line: a line between two boxes, labeled with a verb phrase in each direction
    section: Annex A
  conventions:
    - id: box
      drawing: A box is a core concept.
      section: Annex A
    - id: nested-box
      drawing: A box inside a box means "is a category of". Nesting does not imply exclusive or complete categories, and no category is mandatory.
      section: Annex A
    - id: labeled-line
      drawing: A line between two boxes, or from a box to itself, is a fact type (a relationship). It is labeled with a verb phrase in each direction so it reads as a sentence. It implies no mandatory end and no limit.
      section: Annex A
  additional_marks:
    - drawing: A fact type with three or more participants is drawn as a box whose name ends in an asterisk.
      section: Annex A
    - drawing: A shaded box (orange in the Annex) marks a concept related to the model but outside its scope.
      section: Annex A
  not_specified: []
  not_defined_by_standard: [diagram types, symbols or shapes for individual concepts, symbols for individual relationships, colors other than the shaded out-of-scope box, layout rules, a legend, a diagram frame or diagram names, rules for what a diagram may contain, any notation for instance models]
diagram_types: none-in-standard
notes: 'BMM is a vocabulary and a set of fact types (a metamodel). It defines no graphical notation and no diagram types; its informative Annex A describes three non-normative drawing conventions only. A tool''s own diagram types are described in that tool''s file, not here. Every concept inherits name and description from MotivationElement. Multiplicity keys: targets_per_source is how many target instances one source instance may link to; sources_per_target is how many source instances one target instance may link to; ''*'' means zero or more.'
layout:
  basis: "Our conventions, not this standard's.  Sizes and spacing come from the shared layout standard."
  element_types:                # Annex A draws every concept as a box; the standard names no other shape
    Vision: box
    End: box
    DesiredResult: box
    Goal: box
    Objective: box
    DesiredResultCategory: box
    Means: box
    Mission: box
    CourseOfAction: box
    Strategy: box
    Tactic: box
    Directive: box
    BusinessPolicy: box
    BusinessRule: box
    Influencer: box
    InternalInfluencer: box
    ExternalInfluencer: box
    Regulation: box
    InfluencerCategory: box
    InfluencingOrganization: box
    OrganizationCategory: box
    Assessment: box
    AssessmentCategory: box
    PotentialImpact: box
    Risk: box
    PotentialReward: box
    OrganizationUnit: box
    BusinessProcess: box
    Asset: box
    FixedAsset: box
    Resource: box
    Offering: box
    Liability: box
  exceptions: {}
  diagram_types: {}              # the standard defines none; the shared defaults apply
  no_element_type:               # concepts that take no size class, each group with its reason
    drawn_as_line:
      reason: "A relationship is a line between two boxes, labeled with a verb phrase in each direction (Annex A), so there is no symbol to size."
      concepts: [AssessmentAffectsAchievementOfEnd, AssessmentAffectsEmploymentOfMeans, AssessmentsJudgmentOfInfluencer, AssessmentIdentifiesPotentialImpact, AssessmentProvidesImpetusForDirective, PotentialImpactProvidesImpetusForDirective, UsingAssessmentUsesUsedAssessment, AssessmentCategoryCategorizesAssessment, BroaderAssessmentCategoryCategorizesNarrowerAssessmentCategory, InfluencerCategoryCategorizesInfluencer, BroaderInfluencerCategoryCategorizesNarrowerInfluencerCategory, InfluencingOrganizationIsSourceOfInfluencer, OrganizationCategoryCategorizesInfluencingOrganization, BroaderOrganizationCategoryCategorizesNarrowerOrganizationCategory, OrganizationUnitActsAsInfluencingOrganization, OrganizationUnitRecognizesInfluencer, OrganizationUnitMakesAssessment, OrganizationUnitDefinesEnd, OrganizationUnitEstablishesMeans, StrategyDeterminesOrganizationUnit, OrganizationUnitIsResponsibleForBusinessProcess, OrganizationUnitIsResponsibleForAsset, OrganizationUnitIsResponsibleForLiability, GoalAmplifiesVision, ObjectiveQuantifiesGoal, MissionMakesOperativeVision, StrategyIsAComponentOfThePlanForMission, TacticImplementsStrategy, BroaderCourseOfActionIncludesMoreSpecificCourseOfAction, EnablingCourseOfActionEnablesEnabledCourseOfAction, CourseOfActionChannelsEffortsTowardsDesiredResult, DirectiveGovernsCourseOfAction, CourseOfActionIsFormulatedBasedOnDirective, DirectiveSupportsAchievementOfDesiredResult, BroaderDesiredResultIncludesMoreSpecificDesiredResult, DesiredResultCategoryCategorizesDesiredResult, BroaderDesiredResultCategoryIncludesMoreSpecificDesiredResultCategory, BusinessPolicyIsBasisForBusinessRule, BroaderBusinessPolicyIncludesMoreSpecificBusinessPolicy, BusinessPolicyGovernsBusinessProcess, BusinessRuleGuidesBusinessProcess, TacticEffectsEnforcementLevelOfBusinessRule, DirectiveActsAsRegulation, BusinessProcessRealizesCourseOfAction, BusinessProcessDeliversOffering, BusinessProcessManagesAsset, CourseOfActionDeploysAsset, CourseOfActionDefinesOffering, CourseOfActionDischargesLiability, DirectiveGovernsUseOfAsset, FixedAssetProvidesResource, LiabilityClaimsResource, OfferingRequiresResource, OfferingUsesFixedAsset]
