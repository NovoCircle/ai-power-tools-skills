# ArchiMate 3.1 conformance ruleset (language id archimate-3)
# Enforced by:  AI Power Tools for Sparx EA, validate_model
# Generated from the language file's allowed-relationship table. Do not edit by hand.
#
# Stereotype names are EA's stored form, `ArchiMate_<Concept>` (measured on EA 17.1 build 1716: t_object.Stereotype
# and t_connector.Stereotype hold the unqualified name; the qualified `ArchiMate3::ArchiMate_<Concept>` lives in
# t_xref). validate_model matches the stored column exactly, so a selector spelled `BusinessActor` selects nothing.
# An element created through ArchiMate 2 (`Archimate::ArchiMate_Product`) stores the same short name and is judged
# too; create ArchiMate 3.1 elements with the qualified type `ArchiMate3::ArchiMate_<Concept>`.
#
# What this ruleset checks, by rules.md id of the language skill:
#   ARCHIMATE-REL-003  the relationship table (also enforces REL-004, 005, 007, 009, 010, CRS-001, CRS-002 as data)
#   ARCHIMATE-JCT-002  a junction cannot take composition, aggregation or specialization
#   ARCHIMATE-ELM-001  a collaboration aggregates two or more members (warning)
#   ARCHIMATE-ELM-002  an interaction has a performer assigned to it (warning)
# The language skill's rules that no rule here implements are listed, with the reason, in the skill's coverage report.
#
# Sources:
#   [S1] The Open Group, ArchiMate 3.1 Specification, Appendix B (relationship tables) and 4.2, 5.5.1, 8.2.3, 9.2.2, 10.2.4
#   [S2] the language file (language.yaml), relationships.allowed: a third-party capture of the 3.1 table, not the specification

meta:
  version: "1.0"
  language: archimate-3
  mdg_family: ArchiMate3
  description: >
    Conformance rules for ArchiMate 3.1 models built with Sparx EA's ArchiMate 3.1 technology. One rule checks every
    relationship against the standard's allowed-relationship table; the others check junction use and the
    collaboration and interaction definitions. Every rule names the language-skill rule it implements.
  severity_levels:
    error: The standard states the rule as a requirement (must); a model that breaks it is not well formed.
    warning: The standard states the rule as guidance or as a prose definition (should); review the finding.
    info: Advisory note; not a conformance violation.

