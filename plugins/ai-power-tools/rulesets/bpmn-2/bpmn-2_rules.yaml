# BPMN 2.0.2 Conformance Ruleset
# Language:     BPMN 2.0.2 (OMG formal/13-12-09), as modeled with Sparx's built-in `BPMN2.0` technology
# Enforced by:  AI Power Tools for Sparx EA - validate_model tool
# Generated from the language skill's rules and connection tables; do not edit by hand.
#
# STEREOTYPE NAMES ARE UNQUALIFIED, AND THAT IS MEASURED.
#
# validate_model selects with `Stereotype IN (...)` on t_object and t_connector. For Sparx's BPMN2.0 technology that
# column holds the bare name (`StartEvent`, `Activity`, `SequenceFlow`); the qualified form `BPMN2.0::StartEvent` is only in
# the t_xref row named `Stereotypes`. Measured on EA 17.1 build 1716 by creating one element or connector per stereotype in a
# test model and reading it back: 56 of the technology's 57 stereotypes bound, FQName `BPMN2.0::<name>`.
#
# THE STANDARD'S KINDS ARE TAG VALUES, NOT STEREOTYPES. EA stores a task, a sub-process, a call activity, an event
# sub-process, a transaction and an ad-hoc sub-process under one stereotype, `Activity`; the kind is the tagged values
# `taskType`, `activityType`, `isACalledActivity`, `triggeredByEvent`, `isATransaction`, `adHoc`. The same holds for events
# (`eventDefinition`, `catchOrThrow`, `cancelActivity`) and gateways (`gatewayType`, `gatewayDirection`). So the rules below
# select a stereotype and narrow it with `tagged_value_filter` on those tags. Defaults are stored when the element is
# created (a new Activity is taskType Abstract, a new IntermediateEvent is eventDefinition Message, a new Gateway is Exclusive
# with gatewayDirection Unspecified).
#
# WHAT THE VALIDATOR CAN SEE, AND WHAT IT CANNOT. A rule selects an element by its own stereotype, EA type and tags, selects a
# connector by stereotype or EA connector type, and counts its connectors. It can also check where an element sits
# (`contained_in`, `contains_count`: the element it is attached to by ParentID, else its package, named by stereotype, type or
# name), so the pool, lane or process an element is in, and a boundary event (stored as an ObjectNode child of its activity), can
# be named. No rule in this file uses the containment rules yet. A rule cannot read a container's tagged values or a connector's
# tagged values, and it cannot say "or". The language skill's rules that need those, or that are not written, are not in this file.
#
# EXECUTABLE PROCESSES. A process is marked executable by the tagged value `isExecutable` = true on a `BusinessProcess`
# (values true or false, no default; empty until set). Only BPMN2-ACT-011 has the process element itself as its subject and
# is therefore in this file. The other rules the standard limits to executable processes concern activities, events and
# gateways inside the process; those elements carry no marker, and the validator can name the process an element sits in but cannot read its isExecutable tag, so
# applying them to every model would report ordinary non-executable models. They are left out, not applied.
#
# WS-BPEL MAPPING. The standard defines no flag for it and EA's `BPELProcess` marks a process, not the elements inside it.
# The rules that apply only when a mapping is requested are not in this file.
#
# NAME COLLISIONS. The names are not unique to BPMN 2.0: EA's BPMN 1.0 and BPMN 1.1 technologies declare the same short
# names for Activity, BusinessProcess, DataObject, EndEvent, Gateway, Group, IntermediateEvent, Lane, Message, MessageFlow,
# Participant, Pool, Property, SequenceFlow, StartEvent and TextAnnotation (measured from the MDG files shipped with EA
# 17.1), and `Interface`, `Operation`, `Error` and `Signal` are common elsewhere. A model that mixes technologies has those
# elements judged too; confirm that a clean run also matched more than zero BPMN 2.0 elements.
#
# Sources:
#   [S1] OMG, Business Process Model and Notation (BPMN) Version 2.0.2, formal/13-12-09
#        https://www.omg.org/spec/BPMN/2.0.2/
#   [S2] Sparx Systems, BPMN 2.0 Technology.xml (MDG technology id BPMN2.0, file version 1.0.7)

meta:
  version: "0.1"
  language: bpmn-2
  organization: "(your organization)"
  mdg_family: BPMN2.0
  description: >
    Conformance rules for BPMN 2.0.2 models built with Sparx Enterprise Architect's BPMN2.0 technology: which flow nodes a
    sequence flow and a message flow may join (Tables 7.3 and 7.4), the incoming and outgoing flows each event and gateway
    needs, and the required tagged values of a few supporting elements. Each rule names the rules.md id it implements.
  severity_levels:
    error: A requirement of the standard (rules.md strength must)
    warning: Guidance of the standard (rules.md strength should)
    info: Advisory note; not a conformance violation

tables:
  bpmn-2-sequence-flow:
    source: "OMG BPMN 2.0.2 (formal/13-12-09) Table 7.3, 7.6.1 (pp. 40 to 41), written in the stored stereotypes of Sparx's BPMN2.0 technology: Task, Sub-Process and Call Activity are Activity; choreography tasks are Choreography"
    connectors:
      s: SequenceFlow
    cells:
      Activity:
        Activity: "s"
        EndEvent: "s"
        Gateway: "s"
        IntermediateEvent: "s"
      Choreography:
        Choreography: "s"
        EndEvent: "s"
        Gateway: "s"
        IntermediateEvent: "s"
      EndEvent: {}
      Gateway:
        Activity: "s"
        Choreography: "s"
        EndEvent: "s"
        Gateway: "s"
        IntermediateEvent: "s"
      IntermediateEvent:
        Activity: "s"
        Choreography: "s"
        EndEvent: "s"
        Gateway: "s"
        IntermediateEvent: "s"
      StartEvent:
        Activity: "s"
        Choreography: "s"
        EndEvent: "s"
        Gateway: "s"
        IntermediateEvent: "s"
  bpmn-2-message-flow:
    source: "OMG BPMN 2.0.2 (formal/13-12-09) Table 7.4, 7.6.2 (p. 42), written in the stored stereotypes of Sparx's BPMN2.0 technology: Pool and Participant for the standard's Participant"
    connectors:
      m: MessageFlow
    cells:
      Activity:
        Activity: "m"
        IntermediateEvent: "m"
        Participant: "m"
        Pool: "m"
        StartEvent: "m"
      EndEvent:
        Activity: "m"
        IntermediateEvent: "m"
        Participant: "m"
        Pool: "m"
        StartEvent: "m"
      IntermediateEvent:
        Activity: "m"
        IntermediateEvent: "m"
        Participant: "m"
        Pool: "m"
        StartEvent: "m"
      Participant:
        Activity: "m"
        IntermediateEvent: "m"
        Participant: "m"
        Pool: "m"
        StartEvent: "m"
      Pool:
        Activity: "m"
        IntermediateEvent: "m"
        Participant: "m"
        Pool: "m"
        StartEvent: "m"
  bpmn-2-process-or-choreography:
    source: "OMG BPMN 2.0.2 (formal/13-12-09) Table 8.45 and clause 11 (rule BPMN-CONN-011): a process and a choreography do not share flow elements; derived from the rule, not printed as a table"
    connectors:
      s: SequenceFlow
    cells:
      Activity:
        Activity: "s"
      Choreography:
        Choreography: "s"
  bpmn-2-conversation-link:
    source: "OMG BPMN 2.0.2 (formal/13-12-09) Table 9.13 and 9.5.6 (rule BPMN-CONN-015): a conversation link joins one conversation node to a participant; derived from the rule, not printed as a table"
