# OMG Systems Modeling Language (SysML) 1.5: language file (schema_version 1).
# Written from the standard only. Concept names are the standard's own names (no spaces).
# Keys beyond the base language-file layout: extends, newer_versions, uml_subset, concepts.groups,
#   concepts.elements[].group / .uml_base / .basis / .external / .definition, relationships.items[].uml_base / .ends_per_relationship / .note,
#   diagram_types[].frame / .admits_note / .excludes / .relation_to_uml, constraints[].category / .checkable / .applies_when.
#   constraints[].checkable : static = a validator that sees only the saved model can check it; partial = structure or simple cases only;
#                              runtime = needs instances or an executing model; none = not a property of a model.
#   constraints[].applies_when : omitted = always; otherwise the condition under which the rule applies.
#   concepts.elements[].basis : classification = a classification the standard names in prose, not an element of its profile;
#                              xmi = a generalization or abstractness the text does not state, read from SysML.xmi or SysMLDI.xmi.
#   Strength policy: must = error, should = warning, note = advice only.
schema_version: 1
id: sysml-1
name: OMG Systems Modeling Language (SysML)
owner: {name: Object Management Group, kind: standards-body}
standard: {name: OMG Systems Modeling Language (SysML), version: '1.5', status: published, reference: 'OMG formal/17-05-01 (specification, May 2017); changebar edition formal/17-05-02; normative machine-readable model SysML.xmi (ptc/16-12-10). https://www.omg.org/spec/SysML/1.5/', supersedes: 1.4 (August 2015), kind: 'profile of UML 2.5 (the language reuses a subset of UML, called UML4SysML, and extends it with profile elements, diagram extensions and model libraries)'}
newer_versions:
- {version: '1.6', date: December 2019, url: 'https://www.omg.org/spec/SysML/1.6'}
- {version: '1.7', date: June 2024, url: 'https://www.omg.org/spec/SysML/1.7'}
- {version: '2.0', date: September 2025, url: 'https://www.omg.org/spec/SysML/2.0', note: 'SysML v2: a new language with its own abstract syntax, not researched here.'}
extends: {language: uml, version: '2.5', note: SysML is a UML profile. UML concepts are defined by the UML language skill; this file names the ones SysML reuses and states the SysML additions. The id of the UML language is to be set when that skill exists.}
concepts:
  source: 'OMG SysML 1.5: the profile definitions in each clause''s UML Extensions sub clause (7.3.2, 8.3.2, 9.3.2, 10.3.2, 11.3.2, 15.3.2, 16.3.2), the model libraries (8.3.3, 11.3.3), Annex B (informative) and Annex C (deprecated). Generalizations and abstractness that the text does not state were read from the normative machine-readable models (SysML.xmi, and SysMLDI.xmi for Annex B) and are marked basis: xmi.'
  count_defined_here: 86
  count_reused_uml: 93
  groups:
    Model management: {defined_by: Clause 7, notes: 'Views, viewpoints, stakeholders, element groups, rationale and problems; the package diagram organizes the model.'}
    Blocks and properties: {defined_by: Clause 8, notes: 'Blocks, the kinds of property, connectors and property paths.'}
    Value types and units: {defined_by: 'Clauses 8.3.2.15, 8.3.3', notes: 'Value types, units, quantity kinds and the primitive value type library.'}
    Ports and flows: {defined_by: Clause 9, notes: 'Ports, interface blocks, flow properties, item flows, provided and required features.'}
    Constraint blocks: {defined_by: Clause 10, notes: Reusable constraints and their usages for parametric models.}
    Activity extensions: {defined_by: Clause 11, notes: 'Extensions to UML activities: control as data, rates, probabilities, buffering.'}
    Allocation: {defined_by: Clause 15, notes: The cross-mapping relationship and its partition notation.}
    Requirements: {defined_by: Clause 16, notes: 'Requirements, test cases and the requirement relationships.'}
    Diagram interchange: {defined_by: Annex B (informative), notes: Elements that describe SysML diagrams for interchange.}
    Deprecated: {defined_by: Annex C (normative), notes: 'Flow ports and flow specifications, kept for compatibility; not part of conformance.'}
    Reused from UML: {defined_by: Clause 4 (Table 4.2), notes: 'UML concepts SysML reuses that appear in its diagram and relationship tables. They are defined by UML, not here; see the UML language skill.'}
  elements:
    Rationale: {display: Rationale, group: Model management, uml_base: Comment, section: 7.3.2.5, definition: 'A comment that records the justification for a decision, a requirement or a design choice; it can be attached to any element, including a relationship, and can point to a trade study or analysis report.'}
    Problem: {display: Problem, group: Model management, uml_base: Comment, section: 7.3.2.4, definition: 'A comment that records a deficiency, limitation or failure of one or more elements to satisfy a requirement or need, and attaches that problem to the elements concerned.'}
    ElementGroup: {display: Element Group, group: Model management, uml_base: Comment, section: 7.3.2.2, definition: 'A lightweight, modeler-defined grouping of possibly unlike elements: the comment text states the membership criterion and the annotated elements are the members. A group owns nothing, so an element can be in many groups.', attributes: [{name: name}, {name: criterion}, {name: size}, {name: member}, {name: orderedMember}]}
    Stakeholder: {display: Stakeholder, group: Model management, uml_base: Classifier, section: 7.3.2.6, definition: 'A role, group or individual whose concerns a view is meant to address; it lists those concerns.', attributes: [{name: concernList}, {name: concern}]}
    Viewpoint: {display: Viewpoint, group: Model management, uml_base: Class, section: 7.3.2.8, definition: 'The conventions and rules for building and using a view to address a set of stakeholder concerns: its stakeholders, purpose, concerns, languages, method and presentation rules.', attributes: [{name: stakeholder}, {name: purpose}, {name: concernList}, {name: concern}, {name: language}, {name: method}, {name: presentation}]}
    View: {display: View, group: Model management, uml_base: Class, section: 7.3.2.7, definition: 'A model element that stands for an artifact presented to stakeholders, produced by querying the model by a viewpoint method; it conforms to exactly one viewpoint.', attributes: [{name: viewpoint}, {name: stakeholder}]}
    Conform: {display: Conform, group: Model management, uml_base: Generalization, section: 7.3.2.1, definition: 'The relationship from a view to the viewpoint it conforms to, a generalization with the view as specific and the viewpoint as general.'}
    Expose: {display: Expose, group: Model management, uml_base: Dependency, section: 7.3.2.3, definition: The relationship from a view to each model element that is an access point from which the view method starts its query.}
    Block: {display: Block, group: Blocks and properties, uml_base: Class, section: 8.3.2.4, definition: 'A modular unit that describes the structure of a system or any element of interest, owning properties, operations and connectors. It is the basic unit of system decomposition and can be used at any level of any kind of system.', attributes: [{name: isEncapsulated, type: Boolean, multiplicity: "0..1"}]}
    PartProperty: {display: Part Property, group: Blocks and properties, uml_base: Property, section: 8.3.2.4, definition: 'A property typed by a block and having composite aggregation (other than a constraint property): it holds instances that belong to a larger whole.', basis: classification}
    ReferenceProperty: {display: Reference Property, group: Blocks and properties, uml_base: Property, section: 8.3.2.4, definition: 'A property typed by a block and not having composite aggregation: it refers to instances owned elsewhere.', basis: classification}
    ValueProperty: {display: Value Property, group: Blocks and properties, uml_base: Property, section: 8.3.2.4, definition: A property typed by a value type; it always has composite aggregation., basis: classification}
    AssociationBlock: {display: Association Block, group: Blocks and properties, uml_base: AssociationClass, section: 8.3.2.13, definition: A block applied to an association class (the standard names it informally); each instance links instances at the association ends and can own properties and connectors., basis: classification}
    BindingConnector: {display: Binding Connector, group: Blocks and properties, uml_base: Connector, section: 8.3.2.3, definition: A connector that says the properties at its two ends hold equal values (value-typed ends) or refer to the same block instance (block-typed ends).}
    ConnectorProperty: {display: Connector Property, group: Blocks and properties, uml_base: Property, section: 8.3.2.7, definition: A composite property whose values are the instances of the association block that types a connector of the owning block., attributes: [{name: connector}]}
    ParticipantProperty: {display: Participant Property, group: Blocks and properties, uml_base: Property, section: 8.3.2.13, definition: A property of an association block that identifies the value or object at one end of a link of that association block., attributes: [{name: end}]}
    AdjunctProperty: {display: Adjunct Property, group: Blocks and properties, uml_base: Property, section: 8.3.2.2, definition: 'A property whose values are constrained to those of a principal element: a connector, call action, object node, variable, parameter, interaction use or submachine state.', attributes: [{name: principal}]}
    ClassifierBehaviorProperty: {display: Classifier Behavior Property, group: Blocks and properties, uml_base: Property, section: 8.3.2.6, definition: A composite property whose values are the executions of the classifier behavior of its owning block.}
    EndPathMultiplicity: {display: End Path Multiplicity, group: Blocks and properties, uml_base: Property, section: 8.3.2.11, definition: 'Gives the minimum and maximum number of values at the end of the binding path of a bound reference, for each object reached along the path; applied to a property that redefines a bound reference.', attributes: [{name: lower, default: "0"}, {name: upper, default: "unlimited"}]}
    BoundReference: {display: Bound Reference, group: Blocks and properties, uml_base: Property, specializes: EndPathMultiplicity, section: 8.3.2.5, definition: Highlights a property that is bound by a binding connector so that it constrains other (possibly deeply nested) properties; its type and multiplicity constrain the values reached along the binding path. The text calls bound references end path multiplicities., attributes: [{name: boundEnd}, {name: bindingPath, derived: true, ordered: true, unique: false}]}
    ElementPropertyPath: {display: Element Property Path, group: Blocks and properties, uml_base: Element, abstract: true, section: 8.3.2.10, definition: Lets an element identify another element through a multi-level path of properties from a context block. Specializations say what the context is., basis: xmi, attributes: [{name: propertyPath}]}
    DirectedRelationshipPropertyPath: {display: Directed Relationship Property Path, group: Blocks and properties, uml_base: DirectedRelationship, abstract: true, section: 8.3.2.8, definition: Lets a directed relationship identify its source and target by multi-level property paths from context blocks., basis: xmi, attributes: [{name: sourceContext}, {name: sourcePropertyPath}, {name: targetContext}, {name: targetPropertyPath}]}
    NestedConnectorEnd: {display: Nested Connector End, group: Blocks and properties, uml_base: ConnectorEnd, specializes: ElementPropertyPath, section: 8.3.2.12, definition: Lets a connector end attach to a property reached by a multi-level path of properties from the block that owns the connector; applied automatically to ends nested more than one level deep.}
    PropertySpecificType: {display: Property Specific Type, group: Blocks and properties, uml_base: Classifier, section: 8.3.2.14, definition: 'An unnamed classifier owned by a block and used as the type of exactly one property, to hold local additions or redefinitions of the type written in square brackets.'}
    DistributedProperty: {display: Distributed Property, group: Blocks and properties, uml_base: Property, section: 8.3.2.9, definition: Applies a probability distribution to the values of a property of a block or value type; specific distributions are specializations.}
    ValueType: {display: Value Type, group: Value types and units, uml_base: DataType, section: 8.3.2.15, definition: A type of value that cannot be the target of a reference and may carry a unit and quantity kind; used to type properties and parameters., attributes: [{name: unit, type: InstanceSpecification, multiplicity: "0..1"}, {name: quantityKind, type: InstanceSpecification, multiplicity: "0..1"}]}
    Unit: {display: Unit, group: Value types and units, uml_base: (model library block), specializes: Block, section: 8.3.3.2.2, definition: A quantity in terms of which other quantities of the same quantity kind are stated. A non-abstract block in the UnitAndQuantityKind library; an instance specification classified by it (or a specialization) defines one measurement unit., attributes: [{name: symbol, type: String, multiplicity: "0..1"}, {name: description, type: String, multiplicity: "0..1"}, {name: definitionURI, type: String, multiplicity: "0..1"}, {name: quantityKind, type: QuantityKind, multiplicity: "0..*"}]}
    QuantityKind: {display: Quantity Kind, group: Value types and units, uml_base: (model library block), specializes: Block, section: 8.3.3.2.1, definition: A kind of quantity that may be stated by means of defined units. A non-abstract block in the UnitAndQuantityKind library; an instance specification classified by it defines one kind of quantity., attributes: [{name: symbol, type: String, multiplicity: "0..1"}, {name: description, type: String, multiplicity: "0..1"}, {name: definitionURI, type: String, multiplicity: "0..1"}]}
    Boolean: {display: Boolean, group: Value types and units, uml_base: (model library value type), specializes: ValueType, section: 8.3.3.1.1, definition: The value type with the values true and false.}
    Number: {display: Number, group: Value types and units, uml_base: (model library value type), specializes: ValueType, abstract: true, section: 8.3.3.1.4, definition: The abstract value type from which the numeric value types are specialized.}
    Integer: {display: Integer, group: Value types and units, uml_base: (model library value type), specializes: Number, section: 8.3.3.1.3, definition: 'The mathematical integers, without committing to a representation.', basis: xmi}
    Real: {display: Real, group: Value types and units, uml_base: (model library value type), specializes: Number, section: 8.3.3.1.5, definition: 'The mathematical reals (continuous quantities), without committing to precision or scale.', basis: xmi}
    Complex: {display: Complex, group: Value types and units, uml_base: (model library value type), specializes: Number, section: 8.3.3.1.2, definition: 'A complex number with a real part and an imaginary part, each of type Real.', basis: xmi, attributes: [{name: realPart, type: Real}, {name: imaginaryPart, type: Real}]}
    String: {display: String, group: Value types and units, uml_base: (model library value type), specializes: ValueType, section: 8.3.3.1.6, definition: A sequence of characters in a suitable character set.}
    InterfaceBlock: {display: Interface Block, group: Ports and flows, uml_base: Class, specializes: Block, section: 9.3.2.9, definition: 'A block with no behaviors and no internal parts, used to type proxy ports; its ports can only be typed by interface blocks.'}
    ProxyPort: {display: Proxy Port, group: Ports and flows, uml_base: Port, section: 9.3.2.12, definition: A port that exposes features of its owning block or of its internal parts to external connectors without being a separate element; typed by an interface block.}
    FullPort: {display: Full Port, group: Ports and flows, uml_base: Port, section: 9.3.2.8, definition: 'A port that is a separate element of the system with its own features, parts and behaviors; not behavioral and not conjugated.'}
    FlowDirection: {display: Flow Direction, group: Ports and flows, uml_base: (enumeration), section: 9.3.2.6, definition: 'Enumeration with the literals in, out and inout (the text and the model agree) giving the direction items can flow to or from the owning block.'}
    FlowProperty: {display: Flow Property, group: Ports and flows, uml_base: Property, section: 9.3.2.7, definition: 'A property signifying one kind of item (data, material, energy) that can flow into or out of a block, with a direction.', attributes: [{name: direction, type: FlowDirection}]}
    FeatureDirection: {display: Feature Direction, group: Ports and flows, uml_base: (enumeration), section: 9.3.2.5, definition: 'Enumeration with the literals provided, required and providedRequired (the text writes the last one providedrequired).'}
    DirectedFeature: {display: Directed Feature, group: Ports and flows, uml_base: Feature, section: 9.3.2.4, definition: 'Says whether a non-flow property or behavioral feature is provided by the owning block, required from other blocks, or both.', attributes: [{name: featureDirection, type: FeatureDirection}]}
    ItemFlow: {display: Item Flow, group: Ports and flows, uml_base: InformationFlow, section: 9.3.2.11, definition: 'The items that do flow across a connector or association in a particular context, optionally with an item property that holds the flowing values.', attributes: [{name: itemProperty, type: Property, multiplicity: "0..1"}]}
    InvocationOnNestedPortAction: {display: Invocation On Nested Port Action, group: Ports and flows, uml_base: InvocationAction, specializes: ElementPropertyPath, section: 9.3.2.10, definition: Extends an invocation action so it can send to a port reached by a multi-level path of nested ports.}
    TriggerOnNestedPort: {display: Trigger On Nested Port, group: Ports and flows, uml_base: Trigger, specializes: ElementPropertyPath, section: 9.3.2.13, definition: Extends a trigger so it can receive on a port reached by a multi-level path of nested ports; not applicable to full ports.}
    ChangeStructuralFeatureEvent: {display: Change Structural Feature Event, group: Ports and flows, uml_base: ChangeEvent, section: 9.3.2.3, definition: An event that models changes in the values of a structural feature., attributes: [{name: structuralFeature}]}
    AcceptChangeStructuralFeatureEventAction: {display: Accept Change Structural Feature Event Action, group: Ports and flows, uml_base: AcceptEventAction, section: 9.3.2.1, definition: 'An accept-event action for change structural feature events with two output pins: the values just after and just before the change.'}
    ConstraintBlock: {display: Constraint Block, group: Constraint blocks, uml_base: Class, specializes: Block, section: 10.3.2.1, definition: 'A block that packages a constraint so it can be reused to constrain properties of other blocks; its properties are the constraint parameters, plus nested constraint properties.'}
    ConstraintProperty: {display: Constraint Property, group: Constraint blocks, uml_base: Property, section: 10.3.2.1, definition: 'A property of any block that is typed by a constraint block: a local usage of the constraint, with composite aggregation.', basis: classification}
    ConstraintParameter: {display: Constraint Parameter, group: Constraint blocks, uml_base: Property, section: 10.3.2.1, definition: A property of a constraint block that stands for one variable of its constraint (other than constraint properties holding nested usages); bound by binding connectors., basis: classification}
    ControlOperator: {display: Control Operator, group: Activity extensions, uml_base: 'Behavior, Operation', section: 11.3.2.2, definition: 'A behavior or operation that takes or returns control values as data, so it can enable and disable other actions.'}
    ControlValue: {display: Control Value, group: Activity extensions, uml_base: (model library enumeration), section: 11.3.3.1.1, definition: 'Enumeration, in the ControlValues library, that treats control as data; its literals are enable and disable and modelers may add more.'}
    Rate: {display: Rate, group: Activity extensions, uml_base: 'ActivityEdge, ObjectNode, Parameter', section: 11.3.2.8, definition: The expected number of objects or values per time interval that traverse an edge or flow through a streaming parameter., attributes: [{name: rate, type: InstanceSpecification}]}
    Continuous: {display: Continuous, group: Activity extensions, uml_base: 'ActivityEdge, ObjectNode, Parameter (through Rate)', specializes: Rate, section: 11.3.2.1, definition: 'A rate where the time between items approaches zero, for continuous flows.'}
    Discrete: {display: Discrete, group: Activity extensions, uml_base: 'ActivityEdge, ObjectNode, Parameter (through Rate)', specializes: Rate, section: 11.3.2.3, definition: 'A rate where the time between items is non-zero, for discrete flows.'}
    Probability: {display: Probability, group: Activity extensions, uml_base: 'ActivityEdge, ParameterSet', section: 11.3.2.7, definition: 'The probability that an edge leaving a decision node or object node is traversed, or that an output parameter set receives values.', attributes: [{name: probability, type: ValueSpecification}]}
    NoBuffer: {display: No Buffer, group: Activity extensions, uml_base: ObjectNode, section: 11.3.2.4, definition: 'On an object node, tokens refused by outgoing edges (or by the action, for input pins) are discarded instead of held.'}
    Overwrite: {display: Overwrite, group: Activity extensions, uml_base: ObjectNode, section: 11.3.2.5, definition: 'On an object node, a token arriving at a full node removes the one that has been there longest before being added.'}
    Optional: {display: Optional, group: Activity extensions, uml_base: Parameter, section: 11.3.2.6, definition: 'On a parameter, says its lower multiplicity is zero, so it need not have a value for the behavior to start or end.'}
    Allocate: {display: Allocate, group: Allocation, uml_base: Abstraction, specializes: DirectedRelationshipPropertyPath, section: 15.3.2.1, definition: 'A directed relationship that maps an element of one kind or hierarchy onto an element of another at an abstract level (behavior to structure, flow to flow, structure to structure); a precursor to concrete relationships.'}
    AllocateActivityPartition: {display: Allocate Activity Partition, group: Allocation, uml_base: ActivityPartition, section: 15.3.2.2, definition: 'An activity partition that depicts an allocation: its actions are the clients, and the element the partition represents is the supplier, of allocate dependencies.'}
    AbstractRequirement: {display: Abstract Requirement, group: Requirements, uml_base: NamedElement, abstract: true, section: 16.3.2.1, definition: 'Establishes the attributes (text, id) and derived relationships common to every kind of requirement; the base for every requirement kind.', basis: xmi, attributes: [{name: text, type: String}, {name: id, type: String}, {name: satisfiedBy, derived: true}, {name: verifiedBy, derived: true}, {name: tracedTo, derived: true}, {name: derived, derived: true}, {name: derivedFrom, derived: true}, {name: refinedBy, derived: true}, {name: master, derived: true}]}
    Requirement: {display: Requirement, group: Requirements, uml_base: Class, specializes: AbstractRequirement, section: 16.3.2.5, definition: 'A capability or condition that must (or should) be satisfied: a contract between stakeholders and the designers. Compound requirements nest sub-requirements.'}
    TestCase: {display: Test Case, group: Requirements, uml_base: 'Behavior, Operation', section: 16.3.2.6, definition: A method for verifying that a requirement is satisfied; its return parameter is a verdict.}
    VerdictKind: {display: Verdict Kind, group: Requirements, uml_base: (enumeration), section: 16.3.2.6, definition: 'The enumeration, borrowed from the UML testing profile, that types the return parameter of a test case; its literals in the machine-readable model are pass, fail, inconclusive and error.'}
    Satisfy: {display: Satisfy, group: Requirements, uml_base: Abstraction, specializes: Trace, section: 16.3.2.7, definition: A dependency from a model element that fulfills a requirement (client) to the requirement (supplier)., basis: xmi}
    Verify: {display: Verify, group: Requirements, uml_base: Abstraction, specializes: Trace, section: 16.3.2.9, definition: A dependency from a test case or other element that can determine whether the system fulfills a requirement (client) to the requirement (supplier)., basis: xmi}
    DeriveReqt: {display: Derive Requirement, group: Requirements, uml_base: Abstraction, specializes: Trace, section: 16.3.2.3, definition: A dependency between two requirements in which the client is derived from the supplier., basis: xmi}
    Refine: {display: Refine, group: Requirements, uml_base: Abstraction, specializes: DirectedRelationshipPropertyPath, section: 16.3.2.4, definition: 'A dependency saying an element, or set of elements, refines a requirement (or a requirement refines a model element); with exactly one client and one supplier.'}
    Trace: {display: Trace, group: Requirements, uml_base: Abstraction, specializes: DirectedRelationshipPropertyPath, section: 16.3.2.8, definition: 'A general-purpose, weak relationship between a requirement and any other model element; with exactly one client and one supplier.'}
    Copy: {display: Copy, group: Requirements, uml_base: Abstraction, specializes: Trace, section: 16.3.2.2, definition: 'A dependency making the client (slave) requirement text a read-only copy of the supplier (master) requirement text, for reuse across hierarchies.', basis: xmi}
    SysMLDiagramElement: {display: SysML Diagram Element, group: Diagram interchange, uml_base: UML diagram element, abstract: true, section: B.2.5, definition: Abstract base for all SysML diagram-interchange elements; records whether a decomposition symbol is shown., basis: xmi}
    SysMLDiagram: {display: SysML Diagram, group: Diagram interchange, uml_base: UML diagram element, specializes: SysMLDiagramElement, abstract: true, section: B.2.4, definition: 'Abstract base for all SysML diagrams: requires a frame and a heading, and records the default namespace.', basis: xmi}
    SysMLDiagramWithAssociations: {display: SysML Diagram With Associations, group: Diagram interchange, uml_base: UML diagram element, specializes: SysMLDiagram, abstract: true, section: B.2.6, definition: 'Abstract base for diagrams that show associations: no association dot, one-way navigability notation, no non-navigability notation.', basis: xmi}
    SysMLStructureDiagram: {display: SysML Structure Diagram, group: Diagram interchange, uml_base: UML diagram element, specializes: SysMLDiagramWithAssociations, abstract: true, section: B.2 (Figure B.3), definition: Abstract grouping for the structure diagram kinds., basis: xmi}
    SysMLBlockDefinitionDiagram: {display: SysML Block Definition Diagram, group: Diagram interchange, uml_base: UML diagram element, specializes: SysMLStructureDiagram, section: B.2.3, definition: Interchange form of a block definition diagram; default namespace is a block or a package., basis: xmi}
    SysMLInternalBlockDiagram: {display: SysML Internal Block Diagram, group: Diagram interchange, uml_base: UML diagram element, specializes: SysMLStructureDiagram, section: B.2.8, definition: Interchange form of an internal block diagram; default namespace is a block., basis: xmi}
    SysMLParametricDiagram: {display: SysML Parametric Diagram, group: Diagram interchange, uml_base: UML diagram element, specializes: SysMLInternalBlockDiagram, section: B.2.10, definition: Interchange form of a parametric diagram; default namespace is a block; records whether constraint properties are drawn with rounded corners., basis: xmi}
    SysMLRequirementDiagram: {display: SysML Requirement Diagram, group: Diagram interchange, uml_base: UML diagram element, specializes: SysMLStructureDiagram, section: B.2.11, definition: Interchange form of a requirement diagram; default namespace is a package or a requirement., basis: xmi}
    SysMLPackageDiagram: {display: SysML Package Diagram, group: Diagram interchange, uml_base: UML diagram element, specializes: SysMLStructureDiagram, section: B.2.9, definition: Interchange form of a package diagram; default namespace is a package., basis: xmi}
    SysMLBehaviorDiagram: {display: SysML Behavior Diagram, group: Diagram interchange, uml_base: UML diagram element, specializes: SysMLDiagram, abstract: true, section: B.2.2, definition: Abstract base for the behavior diagram kinds., basis: xmi}
    SysMLActivityDiagram: {display: SysML Activity Diagram, group: Diagram interchange, uml_base: UML diagram element, specializes: SysMLBehaviorDiagram, section: B.2.1, definition: Interchange form of an activity diagram; default namespace is an activity; records whether control flows are dashed., basis: xmi}
    SysMLInteractionDiagram: {display: SysML Interaction Diagram, group: Diagram interchange, uml_base: UML diagram element, specializes: SysMLBehaviorDiagram, section: B.2.7, definition: Interchange form of a sequence diagram; default namespace is an interaction; only the sequence kind., basis: xmi}
    SysMLStateMachineDiagram: {display: SysML State Machine Diagram, group: Diagram interchange, uml_base: UML diagram element, specializes: SysMLBehaviorDiagram, section: B.2.12, definition: Interchange form of a state machine diagram; default namespace is a state machine., basis: xmi}
    SysMLUseCaseDiagram: {display: SysML Use Case Diagram, group: Diagram interchange, uml_base: UML diagram element, specializes: SysMLBehaviorDiagram, section: B.2.13, definition: Interchange form of a use case diagram; default namespace is a package. In the machine-readable model it also specializes the diagram with associations kind., basis: xmi}
    FlowPort: {display: Flow Port, group: Deprecated, uml_base: Port, section: C.3.2.2, definition: 'Deprecated. A port through which items flow into or out of the owning block; atomic (typed by one block, value type or signal) or non-atomic (typed by a flow specification).', attributes: [{name: isAtomic, type: Boolean, derived: true}, {name: direction, type: FlowDirection}]}
    FlowSpecification: {display: Flow Specification, group: Deprecated, uml_base: Interface, section: C.3.2.4, definition: Deprecated. An interface that lists flow properties only; types non-atomic flow ports.}
    Package: {display: Package, group: Reused from UML, external: UML 2.5}
