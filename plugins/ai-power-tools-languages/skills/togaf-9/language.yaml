extension_modules:
  source: 34.4 (text), Figure 34-7 (membership), Figure 35-3 (artifact membership). All optional; the grouping is a suggestion (34.2.1).
  modules:
    core: {name: Core, purpose: Minimum content for traceability across artifacts (34.2.1; Figures 34-6 and 34-7).}
    governance:
      name: Governance
      section: 34.4.1
      adds_entities: [Measure, ServiceQuality, Contract]
      adds_diagram_types: [Contract/Measure Catalog, Enterprise Manageability Diagram]
      purpose: 'Structured data on objectives and business services for operational governance: measures, service contracts, reusable service-quality profiles.'
    services:
      name: Services
      section: 34.4.2
      adds_entities: [InformationSystemService]
      adds_diagram_types: [Business Use-Case Diagram, Organization Decomposition Diagram]
      purpose: Information system services as a kind of business service, so business and technical views of services can differ.
    process-modeling:
      name: Process Modeling
      section: 34.4.3
      adds_entities: [Event, Control, Product]
      adds_diagram_types: [Process/Event/Control/Product Catalog, Process Flow Diagram, Event Diagram]
      purpose: Detailed process flow with events, controls and products.
    data:
      name: Data
      section: 34.4.4
      adds_entities: [LogicalDataComponent, PhysicalDataComponent]
      adds_diagram_types: [Data Security Diagram, Data Migration Diagram, Data Lifecycle Diagram]
      purpose: Logical and physical encapsulation of data entities into governable, deployable components.
    infrastructure-consolidation:
      name: Infrastructure Consolidation
      section: 34.4.5
      adds_entities: [Location, PhysicalApplicationComponent, LogicalTechnologyComponent]
      adds_entities_note: Per Figure 34-7. The text of 34.4.5 names all four logical and physical application and technology components.
      adds_diagram_types: [Location Catalog, Process/Application Realization Diagram, Software Engineering Diagram, Application Migration Diagram, Software Distribution Diagram, Processing Diagram, Networked Computing/Hardware Diagram, Communications Engineering Diagram]
      purpose: Consolidating fragmented application and technology portfolios; location as an entity; logical and physical application and technology components.
    motivation:
      name: Motivation
      section: 34.4.6
      adds_entities: [Driver, Goal, Objective]
      adds_diagram_types: [Driver/Goal/Objective Catalog, Goal/Objective/Service Diagram]
      purpose: Drivers, goals and objectives that motivate the organization to provide business services.
diagram_types:
  note: TOGAF defines no notation. These are the 56 named catalogs, matrices and diagrams of 35.6 (14 catalogs, 10 matrices, 32 diagrams), keyed by the standard's own names. `admits` lists entity types; for catalogs and matrices the standard gives the list, for diagrams it is read from the prose and is not exhaustive. Module membership follows Figure 35-3.
  types:
    Principles Catalog:
      kind: catalog
      defined_by: 35.6.1 (Preliminary)
      phase: Preliminary
      module: core
      admits: [Principle]
      admits_basis: stated-list-in-35.6
      shows: Business and architecture principles that describe what a good solution or architecture looks like; used to evaluate decision points and to govern change.
      conventions: not-measured
    Stakeholder Map Matrix: {kind: matrix, defined_by: 35.6.2 (A Architecture Vision), phase: A Architecture Vision, module: core, admits: none-stated, shows: 'Stakeholders of the engagement, their influence, and the key questions or concerns the architecture must address.', notes: 'The standard says no specific metamodel entities are used, because the phase is informal and the data sensitive.', conventions: not-measured}
    Value Chain Diagram: {kind: diagram, defined_by: 35.6.2 (A Architecture Vision), phase: A Architecture Vision, module: core, admits: none-stated, shows: 'A high-level orientation of the enterprise and how it interacts with the outside world, aimed at presentational impact; a quick way to align stakeholders.', notes: No entities listed by the standard. Contrasted with the formal Functional Decomposition Diagram., conventions: not-measured}
    Solution Concept Diagram: {kind: diagram, defined_by: 35.6.2 (A Architecture Vision), phase: A Architecture Vision, module: core, admits: none-stated, shows: 'A pencil-sketch of the solution envisaged at the start; may carry key objectives, requirements and constraints and flag areas for formal modeling.', notes: No entities listed by the standard., conventions: not-measured}
    Organization/Actor Catalog:
      kind: catalog
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: core
      admits: [OrganizationUnit, Actor, Location]
      admits_basis: stated-list-in-35.6
      shows: A definitive list of all participants that interact with IT, including users and owners of IT systems; used to test requirements for completeness.
      notes: Location may be included if no independent Location Catalog is kept.
      conventions: not-measured
    Driver/Goal/Objective Catalog:
      kind: catalog
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: motivation
      admits: [OrganizationUnit, Driver, Goal, Objective, Measure]
      admits_basis: stated-list-in-35.6
      shows: A cross-organization reference of how drivers are met through goals, objectives and, optionally, measures; used to find synergies.
      notes: Measure is optional.
      conventions: not-measured
    Role Catalog:
      kind: catalog
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: core
      admits: [Role]
      admits_basis: stated-list-in-35.6
      shows: All authorization levels or zones in the enterprise; input to security definition, change impact, job functions and training.
      conventions: not-measured
    Business Service/Function Catalog:
      kind: catalog
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: core
      admits: [OrganizationUnit, Function, BusinessService, InformationSystemService]
      admits_basis: stated-list-in-35.6
      shows: A functional decomposition in filterable, queryable form; identifies capabilities and the level at which governance applies.
      notes: Information System Service may optionally be included.
      conventions: not-measured
    Location Catalog:
      kind: catalog
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: infrastructure-consolidation
      admits: [Location]
      admits_basis: stated-list-in-35.6
      shows: All locations where the enterprise operates or houses architecturally relevant assets such as data centers.
      conventions: not-measured
    Process/Event/Control/Product Catalog:
      kind: catalog
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: process-modeling
      admits: [Process, Event, Control, Product]
      admits_basis: stated-list-in-35.6
      shows: A hierarchy of processes, the events that trigger them, their outputs and the controls on them; supports impact analysis across process chains.
      conventions: not-measured
    Contract/Measure Catalog:
      kind: catalog
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: governance
      admits: [BusinessService, InformationSystemService, Contract, Measure]
      admits_basis: stated-list-in-35.6
      shows: 'All agreed service contracts and, optionally, their measures: the master list of agreed service levels.'
      notes: Information System Service is optional; Measure is optional per the text ("and (optionally) the measures").
      conventions: not-measured
    Business Interaction Matrix:
      kind: matrix
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: core
      admits: [OrganizationUnit, Function, BusinessService]
      admits_basis: stated-list-in-35.6
      axes: not stated
      shows: Interactions between organizations and business functions; highlights value chain and dependencies.
      notes: Text also names the relationships Business Service communicates with Business Service and Business Service is dependent on Business Service, which the relationship table does not list.
      conventions: not-measured
    Actor/Role Matrix:
      kind: matrix
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: core
      admits: [Actor, Role]
      admits_basis: stated-list-in-35.6
      axes: Actor by Role
      shows: Which actors perform which roles; supports security, skills and change-management definition.
      notes: Relationship named Actor performs Role; the table calls it Actor performs task in Role.
      conventions: not-measured
    Business Footprint Diagram: {kind: diagram, defined_by: 35.6.3 (B Business Architecture), phase: B Business Architecture, module: core, admits: none-stated, shows: 'Links between business goals, organizational units, business functions and services, and maps functions to the technical components delivering them; traces a technical component to the goal it satisfies and shows service ownership. Senior-stakeholder communication.', notes: 'Entities are named in prose (goals, organizational units, functions, services, technical components), not as a list.', conventions: not-measured}
    Business Service/Information Diagram:
      kind: diagram
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: core
      admits: [BusinessService, DataEntity]
      admits_basis: prose-in-35.6; not a closed list
      shows: 'The information needed to support one or more business services: data consumed or produced, and possibly the source. A first view of information, elaborated in Phase C.'
      conventions: not-measured
    Functional Decomposition Diagram:
      kind: diagram
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: core
      admits: [Function]
      admits_basis: prose-in-35.6; not a closed list
      shows: The capabilities of an organization relevant to the architecture, on one page; a base for heat-maps of scope and decisions.
      conventions: not-measured
    Product Lifecycle Diagram: {kind: diagram, defined_by: 35.6.3 (B Business Architecture), phase: B Business Architecture, module: core, admits: none-stated, shows: 'Lifecycles of key entities in the enterprise, for example products tracked from manufacture to disposal.', notes: No entities listed by the standard., conventions: not-measured}
    Goal/Objective/Service Diagram:
      kind: diagram
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: motivation
      admits: [Driver, Goal, Objective, Measure, BusinessService]
      admits_basis: prose-in-35.6; not a closed list
      shows: 'How a service contributes to the business vision or strategy: services tied to the drivers, goals, objectives and measures they support.'
      conventions: not-measured
    Business Use-Case Diagram:
      kind: diagram
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: services
      admits: [Actor, Role, BusinessService, Process, Function]
      admits_basis: prose-in-35.6; not a closed list
      shows: Consumers and providers of business services, showing how and when a capability is used; helps validate the interaction of actors and roles with processes and functions.
      notes: Entities are named in prose.
      conventions: not-measured
    Organization Decomposition Diagram:
      kind: diagram
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: services
      admits: [Actor, Role, Location]
      admits_basis: prose-in-35.6; not a closed list
      shows: Links between actors, roles and locations in an organization tree; a chain of command of owners and decision-makers.
      conventions: not-measured
    Process Flow Diagram:
      kind: diagram
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: process-modeling
      admits: [Process, Function, Event, Control, Product]
      admits_basis: prose-in-35.6; not a closed list
      shows: 'All models and mappings for the process entity: sequential flow of control between activities, with swim-lanes for ownership, plus the controls, events and products around them.'
      notes: Entities are named in prose.
      conventions: not-measured
    Event Diagram:
      kind: diagram
      defined_by: 35.6.3 (B Business Architecture)
      phase: B Business Architecture
      module: process-modeling
      admits: [Event, Process]
      admits_basis: prose-in-35.6; not a closed list
      shows: 'The relationship between events and processes: events as triggers, where they come from, what they trigger.'
      conventions: not-measured
    Data Entity/Data Component Catalog:
      kind: catalog
      defined_by: 35.6.4 (C Data Architecture)
      phase: C Data Architecture
      module: core
      admits: [DataEntity, LogicalDataComponent, PhysicalDataComponent]
      admits_basis: stated-list-in-35.6
      shows: All data used across the enterprise, with the components where data entities are stored; supports data governance and re-use.
      notes: Colored core in Figure 35-3 although two of its entities belong to the Data extension.
      conventions: not-measured
    Data Entity/Business Function Matrix:
      kind: matrix
      defined_by: 35.6.4 (C Data Architecture)
      phase: C Data Architecture
      module: core
      admits: [DataEntity, Function, OrganizationUnit]
      admits_basis: stated-list-in-35.6
      axes: Data Entity by Function
      shows: Which business functions use which data entities; assigns ownership of data to organizations and supports gap analysis and data governance.
      notes: Text also names the relationship of a data entity to its owning Organization Unit, which the relationship table does not list.
      conventions: not-measured
    Application/Data Matrix:
      kind: matrix
      defined_by: 35.6.4 (C Data Architecture)
      phase: C Data Architecture
      module: core
      admits: [LogicalApplicationComponent, DataEntity]
      admits_basis: stated-list-in-35.6
      axes: Logical Application Component by Data Entity
      shows: Which applications create, read, update and delete which data entities; supports access assignment, duplication analysis and gap analysis.
      conventions: not-measured
    Conceptual Data Diagram:
      kind: diagram
      defined_by: 35.6.4 (C Data Architecture)
      phase: C Data Architecture
      module: core
      admits: [DataEntity]
      admits_basis: prose-in-35.6; not a closed list
      shows: 'Relationships between critical data entities, for business stakeholders. Techniques: entity relationship models, simplified UML class diagrams.'
      conventions: not-measured
    Logical Data Diagram:
      kind: diagram
      defined_by: 35.6.4 (C Data Architecture)
      phase: C Data Architecture
      module: core
      admits: [DataEntity]
      admits_basis: prose-in-35.6; not a closed list
      shows: Logical views of relationships between critical data entities, for application developers and database designers.
      conventions: not-measured
    Data Dissemination Diagram:
      kind: diagram
      defined_by: 35.6.4 (C Data Architecture)
      phase: C Data Architecture
      module: core
      admits: [DataEntity, BusinessService, ApplicationComponent]
      admits_basis: prose-in-35.6; not a closed list
      shows: How logical data entities are physically realized by application components; supports sizing and shows replication and master-copy ownership.
      notes: The text says application components; the metamodel splits them into logical and physical.
      conventions: not-measured
    Data Security Diagram:
      kind: diagram
      defined_by: 35.6.4 (C Data Architecture)
      phase: C Data Architecture
      module: data
      admits: [Actor, DataEntity]
      admits_basis: prose-in-35.6; not a closed list
      shows: Which actor can access which enterprise data; shows compliance with privacy law and trust implications for partners. May be a matrix or a mapping.
      conventions: not-measured
    Data Migration Diagram: {kind: diagram, defined_by: 35.6.4 (C Data Architecture), phase: C Data Architecture, module: data, admits: none-stated, shows: 'The flow of data from source to target applications: extraction, profiling, transformation, mapping and loading; a tool for auditing and traceability.', notes: No entities listed by the standard; data and applications are implied., conventions: not-measured}
    Data Lifecycle Diagram:
      kind: diagram
      defined_by: 35.6.4 (C Data Architecture)
      phase: C Data Architecture
      module: data
      admits: [DataEntity]
      admits_basis: prose-in-35.6; not a closed list
      shows: Data entities across their lifecycle from conception to disposal, each state change with the event or rule that triggers it; decoupled from business process.
      conventions: not-measured
    Application Portfolio Catalog:
      kind: catalog
      defined_by: 35.6.5 (C Application Architecture)
      phase: C Application Architecture
      module: core
      admits: [InformationSystemService, LogicalApplicationComponent, PhysicalApplicationComponent]
      admits_basis: stated-list-in-35.6
      shows: All applications in the enterprise; defines the horizontal scope of change and is the usual start of the Application Architecture phase.
      notes: Colored core in Figure 35-3 although Information System Service and Physical Application Component belong to extensions.
      conventions: not-measured
    Interface Catalog:
      kind: catalog
      defined_by: 35.6.5 (C Application Architecture)
      phase: C Application Architecture
      module: core
      admits: [LogicalApplicationComponent, PhysicalApplicationComponent]
      admits_basis: stated-list-in-35.6
      shows: The interfaces between applications (batch file, direct database connection, API or web service); scopes dependencies early. Uses the relationship Application communicates with application.
      conventions: not-measured
    Application/Organization Matrix:
      kind: matrix
      defined_by: 35.6.5 (C Application Architecture)
      phase: C Application Architecture
      module: core
      admits: [LogicalApplicationComponent, PhysicalApplicationComponent, OrganizationUnit]
      admits_basis: stated-list-in-35.6
      axes: Logical or Physical Application Component by Organization Unit
      shows: Which organization units use which applications.
      notes: 'The text calls the relationship a composite to be validated: Organization Units own Services; Actors belonging to them use Services; Services are realized by application components.'
      conventions: not-measured
    Role/Application Matrix:
      kind: matrix
      defined_by: 35.6.5 (C Application Architecture)
      phase: C Application Architecture
      module: core
      admits: [LogicalApplicationComponent, Role]
      admits_basis: stated-list-in-35.6
      axes: Logical Application Component by Role
      shows: Which business roles use which applications; supports role-based computing and security checks.
      notes: 'Composite to be validated: Role accesses Function; Function is bounded by Service; Services are realized by application components.'
      conventions: not-measured
    Application/Function Matrix:
      kind: matrix
      defined_by: 35.6.5 (C Application Architecture)
      phase: C Application Architecture
      module: core
      admits: [LogicalApplicationComponent, Function]
      admits_basis: stated-list-in-35.6
      axes: Logical Application Component by Function
      shows: Which applications support which business functions.
      notes: 'Composite to be validated: Function is bounded by Service; Services are realized by application components.'
      conventions: not-measured
    Application Interaction Matrix:
      kind: matrix
      defined_by: 35.6.5 (C Application Architecture)
      phase: C Application Architecture
      module: core
      admits: [Service, LogicalApplicationComponent, PhysicalApplicationComponent]
      admits_basis: stated-list-in-35.6
      axes: Application Service, Logical and Physical Application Component on both rows and columns
      shows: 'Communication relationships between applications: the matrix equivalent of the Interface Catalog or Application Communication Diagram.'
      notes: 'Relationships named: Application Service consumes Application Service; Logical (or Physical) Application Component communicates with Logical (or Physical) Application Component.'
      conventions: not-measured
    Application Communication Diagram:
      kind: diagram
      defined_by: 35.6.5 (C Application Architecture)
      phase: C Application Architecture
      module: core
      admits: [ApplicationComponent, DataEntity, BusinessService]
      admits_basis: prose-in-35.6; not a closed list
      shows: 'Communication between applications: components and their interfaces, interfaces tied to data entities, applications tied to business services. Logical; shows intermediary technology only where relevant.'
      conventions: not-measured
    Application and User Location Diagram:
      kind: diagram
      defined_by: 35.6.5 (C Application Architecture)
      phase: C Application Architecture
      module: core
      admits: [Location, ApplicationComponent]
      admits_basis: prose-in-35.6; not a closed list
      shows: 'The geographical distribution of applications: where users use them, where hosts run, where they are built and tested. Shows rationalization opportunities, license and support estimates.'
      notes: Entities named in prose.
      conventions: not-measured
    Application Use-Case Diagram:
      kind: diagram
      defined_by: 35.6.5 (C Application Architecture)
      phase: C Application Architecture
      module: core
      admits: [Actor, Role, Service]
      admits_basis: prose-in-35.6; not a closed list
      shows: Consumers and providers of application services, showing how and when functionality is used; can be re-used in systems design.
      notes: Entities named in prose (actors, application services).
      conventions: not-measured
    Enterprise Manageability Diagram:
      kind: diagram
      defined_by: 35.6.5 (C Application Architecture)
      phase: C Application Architecture
      module: governance
      admits: [ApplicationComponent, TechnologyComponent]
      admits_basis: prose-in-35.6; not a closed list
      shows: How applications interact with application and technology components that support operational management; a filter on the Application Communication Diagram for management software.
      notes: Listed under the Governance extension in 34.4.1 and Figure 35-3, and under Application Architecture in 35.6.5.
      conventions: not-measured
    Process/Application Realization Diagram:
      kind: diagram
      defined_by: 35.6.5 (C Application Architecture)
      phase: C Application Architecture
      module: infrastructure-consolidation
      admits: [Process, ApplicationComponent]
      admits_basis: prose-in-35.6; not a closed list
      shows: The sequence of events when several applications execute a business process, adding sequencing and batch/real-time hand-offs to the Application Communication Diagram.
      notes: Entities named in prose.
      conventions: not-measured
    Software Engineering Diagram:
      kind: diagram
      defined_by: 35.6.5 (C Application Architecture)
      phase: C Application Architecture
      module: infrastructure-consolidation
      admits: [ApplicationComponent]
      admits_basis: prose-in-35.6; not a closed list
      shows: Applications broken into packages, modules, services and operations from a development view; supports impact analysis for migration.
      notes: Entities named in prose.
      conventions: not-measured
    Application Migration Diagram:
      kind: diagram
      defined_by: 35.6.5 (C Application Architecture)
      phase: C Application Architecture
      module: infrastructure-consolidation
      admits: [ApplicationComponent]
      admits_basis: prose-in-35.6; not a closed list
      shows: 'Migration from baseline to target application components: which applications and interfaces map between stages, temporary applications and staging areas.'
      notes: Entities named in prose.
      conventions: not-measured
    Software Distribution Diagram:
      kind: diagram
      defined_by: 35.6.5 (C Application Architecture)
      phase: C Application Architecture
      module: infrastructure-consolidation
      admits: [PhysicalApplicationComponent, PhysicalTechnologyComponent, Location]
      admits_basis: prose-in-35.6; not a closed list
      shows: 'How application software is structured and distributed across the estate: physical applications on physical technology and the location of that technology.'
      conventions: not-measured
    Technology Standards Catalog:
      kind: catalog
      defined_by: 35.6.6 (D Technology Architecture)
      phase: D Technology Architecture
      module: core
      admits: [PlatformService, LogicalTechnologyComponent, PhysicalTechnologyComponent]
      admits_basis: stated-list-in-35.6
      shows: 'The agreed technology standards: technologies, versions, lifecycles and refresh cycles; may carry location- or domain-specific standards.'
      notes: The entity list the text gives sits under the Technology Portfolio Catalog wording and repeats it; see gaps.
      conventions: not-measured
    Technology Portfolio Catalog:
      kind: catalog
      defined_by: 35.6.6 (D Technology Architecture)
      phase: D Technology Architecture
      module: core
      admits: [PlatformService, LogicalTechnologyComponent, PhysicalTechnologyComponent]
      admits_basis: stated-list-in-35.6
      shows: All technology in use (hardware, infrastructure software, application software), classified against the Technical Reference Model; the start of the Technology Architecture phase.
      conventions: not-measured
    Application/Technology Matrix:
      kind: matrix
      defined_by: 35.6.6 (D Technology Architecture)
      phase: D Technology Architecture
      module: core
      admits: [LogicalApplicationComponent, PhysicalApplicationComponent, Service, LogicalTechnologyComponent, PhysicalTechnologyComponent]
      admits_basis: stated-list-in-35.6
      axes: Application Component by Technology Component (with Services)
      shows: The mapping of applications to technology platform; aligned with platform decomposition diagrams. Uses the relationship Physical Technology Component realizes Physical Application Component.
      conventions: not-measured
    Environments and Locations Diagram:
      kind: diagram
      defined_by: 35.6.6 (D Technology Architecture)
      phase: D Technology Architecture
      module: core
      admits: [Location, ApplicationComponent, TechnologyComponent]
      admits_basis: prose-in-35.6; not a closed list
      shows: Which locations host which applications and technologies, where users interact, and where the deployment environments (including non-production) exist.
      notes: Entities named in prose.
      conventions: not-measured
    Platform Decomposition Diagram:
      kind: diagram
      defined_by: 35.6.6 (D Technology Architecture)
      phase: D Technology Architecture
      module: core
      admits: [LogicalTechnologyComponent, PhysicalTechnologyComponent]
      admits_basis: prose-in-35.6; not a closed list
      shows: 'The technology platform supporting the information systems architecture: hardware and software, logical and physical technology components with attributes; may be mapped to application components.'
      conventions: not-measured
    Processing Diagram:
      kind: diagram
      defined_by: 35.6.6 (D Technology Architecture)
      phase: D Technology Architecture
      module: infrastructure-consolidation
      admits: [ApplicationComponent, TechnologyComponent]
      admits_basis: prose-in-35.6; not a closed list
      shows: 'Deployable units of code and configuration and how they are deployed onto technology: grouping into deployment units, interactions between units, load and capacity.'
      notes: Entities named in prose.
      conventions: not-measured
    Networked Computing/Hardware Diagram:
      kind: diagram
      defined_by: 35.6.6 (D Technology Architecture)
      phase: D Technology Architecture
      module: infrastructure-consolidation
      admits: [LogicalApplicationComponent, TechnologyComponent]
      admits_basis: prose-in-35.6; not a closed list
      shows: The as-deployed logical view of logical application components in a distributed network environment, mapped to technology components such as servers.
      notes: Entities named in prose.
      conventions: not-measured
    Communications Engineering Diagram: {kind: diagram, defined_by: 35.6.6 (D Technology Architecture), phase: D Technology Architecture, module: infrastructure-consolidation, admits: none-stated, shows: 'The means of communication between assets in the technology architecture: logical client-server connections, network boundaries and infrastructure; protocol and capacity, not content.', notes: No entities listed by the standard., conventions: not-measured}
    Project Context Diagram:
      kind: diagram
      defined_by: 35.6.7 (E Opportunities and Solutions)
      phase: E Opportunities and Solutions
      module: core
      admits: [WorkPackage]
      admits_basis: prose-in-35.6; not a closed list
      shows: The scope of a work package within the transformation roadmap, linked to the organizations, functions, services, processes, applications, data and technology it adds, removes or affects.
      notes: Linked entity types named in prose.
      conventions: not-measured
    Benefits Diagram: {kind: diagram, defined_by: 35.6.7 (E Opportunities and Solutions), phase: E Opportunities and Solutions, module: core, admits: none-stated, shows: 'Opportunities in an architecture definition, classified by relative size, benefit and complexity; used to select, prioritize and sequence opportunities.', notes: No entities listed by the standard., conventions: not-measured}
    Requirements Catalog:
      kind: catalog
      defined_by: 35.6.8 (Requirements Management)
      phase: Requirements Management
      module: core
      admits: [Requirement, Assumption, Constraint, Gap]
      admits_basis: stated-list-in-35.6
      shows: Things the enterprise needs to do to meet its objectives; usually implemented through Phase E change initiatives; used as a quality check on fitness for purpose.
      conventions: not-measured
viewpoints:
  note: Eight recommended views (35.7). The standard says they are a starting point, not a full viewpoint definition. Not a closed set.
  views:
    Business Architecture View: {status: recommended-guidance, section: 35.7.1, stakeholders: users of the system, concerns: 'People, process, function, business information, usability, performance.'}
    Enterprise Security View: {status: recommended-guidance, section: 35.7.2, stakeholders: security engineers, concerns: 'That only permitted parties can reach the system and that it is protected from tampering; which information is held and processed, its value, threats and responses.'}
    Software Engineering View: {status: recommended-guidance, section: 35.7.3, stakeholders: software engineers who will develop the system, concerns: 'Development approach, software modularity and re-use, portability, migration and interoperability.'}
    System Engineering View: {status: recommended-guidance, section: 35.7.4, stakeholders: systems engineering personnel, concerns: 'Location, modifiability, re-usability and availability of all components; how software and hardware assemble into a working system.'}
    Communications Engineering View: {status: recommended-guidance, section: 35.7.5, stakeholders: communications engineering personnel, concerns: 'Location, modifiability, re-usability and availability of communications and networking services; network and communications requirements.'}
    Data Flow View: {status: recommended-guidance, section: 35.7.6, stakeholders: database engineers, concerns: 'Storage, retrieval, processing, archiving and security of data; providing data to the right people and applications at the right time.'}
    Enterprise Manageability View: {status: recommended-guidance, section: 35.7.7, stakeholders: 'operations, administration and management personnel', concerns: 'How the system is managed as a whole; managing change and predicting preventive maintenance; availability under change; security, data, software, hardware and networking assets.'}
    Acquirer View: {status: recommended-guidance, section: 35.7.8, stakeholders: personnel who acquire components, concerns: Which building blocks can be bought and what constraints or standards apply; purchasing decisions that fit the architecture.}
conventions:
- {subject: Conceptual Data Diagram, text: Techniques used include entity relationship models and simplified UML class diagrams., section: 35.6.4}
- {subject: Process Flow Diagram, text: 'Swim-lane technique may show ownership and realization of process steps, for example the application that supports a step as a lane.', section: 35.6.3}
- {subject: Functional Decomposition Diagram, text: 'Heat-maps may be layered over the diagram to show scope and decisions, for example capabilities delivered in different phases.', section: 35.6.3}
- {subject: Data Security Diagram, text: The access of actors to data may be shown as a matrix between two object types or as a mapping., section: 35.6.4}
- {subject: Business domains example viewpoint, text: 'Nested boxes: outer boxes are locations, inner boxes are business functions, and nesting means the functions are performed in those locations.', section: 35.1.1}
- {subject: Platform Decomposition Diagram, text: 'May give product-level detail (versions, CPUs) or be an informal overview of the technical environment.', section: 35.6.6}
conventions_note: The standard names techniques but defines no notation, shapes or styles. Nothing here is measured.
deliverables:
  section: '36'
  note: Deliverables are the contractual work products of the ADM; they contain artifacts. Phase input and output relationships are in the 36.1 table, not reproduced.
  list: [Architecture Building Blocks, Architecture Contract, Architecture Definition Document, Architecture Principles, Architecture Repository, Architecture Requirements Specification, Architecture Roadmap, Architecture Vision, 'Business Principles, Business Goals, and Business Drivers', Capability Assessment, Change Request, Communications Plan, Compliance Assessment, Implementation and Migration Plan, Implementation Governance Model, Organizational Model for Enterprise Architecture, Request for Architecture Work, Requirements Impact Assessment, Solution Building Blocks, Statement of Architecture Work, Tailored Architecture Framework]
constraints:
- {id: TOGAF-REL-001, statement: 'A relationship between two entities should be one the content metamodel lists for that source entity, target entity and relationship name. The list is the table in 34.7. The standard presents the metamodel as the possible relationships and invites tailoring, so a link outside the table is a warning, not an error.', strength: should, section: 33.2; 34.2.1; 34.7, checkable: static}
- {id: TOGAF-REL-002, statement: A relationship the table assigns to an extension module is available only when that module is part of the engagement. Relationships labeled Core are always available., strength: should, section: 34.4; 34.7, applies_when: the engagement has chosen its extension modules, checkable: partial}
- {id: TOGAF-DEF-001, statement: A Process describes flow of control. It is not itself deployed. An application component implements the Function (through the services that bound it) that a process supports; an application does not implement a process., strength: should, section: 34.2.1, applies_when: a model links an application or technology component directly to a Process, checkable: partial}
- {id: TOGAF-DEF-002, statement: 'Function is the single entity for a bounded unit of business capability at any granularity (value chain, process area, capability, business function). Such units should be modeled as Functions.', strength: should, section: 34.2.1, checkable: none}
- {id: TOGAF-DEF-003, statement: 'A Business Service is explicitly governed by an organization and has an explicitly defined interface. It should be owned and governed by an Organization Unit, and be defined at a granularity that matches the governance applied to it.', strength: should, section: 34.2.1; 34.5, checkable: partial}
- {id: TOGAF-DEF-004, statement: A Business Service operates as the boundary of one or more Functions., strength: should, section: 34.2.1, checkable: partial}
- {id: TOGAF-DEF-005, statement: 'A Business Service that is supported by IT is deployed onto application components, and an application component is implemented on a suite of technology components.', strength: note, section: 34.2.1, checkable: none}
- {id: TOGAF-DEF-006, statement: A Business Service supported by several application components is possible but problematic for governance. It is a sign that the service is too coarse or the components too fine., strength: note, section: 34.2.1, checkable: partial}
- {id: TOGAF-DEF-007, statement: 'A service in the service-oriented-architecture sense (a deployable unit of application functionality) corresponds to an application service, application component or technology component that implements or supports a Business Service, not to a Business Service.', strength: note, section: 34.2.1, checkable: none}
- {id: TOGAF-DEF-008, statement: A Principle has at least a supporting rationale and a measure of importance (priority)., strength: should, section: 34.5; 34.6, checkable: static}
- {id: TOGAF-DEF-009, statement: 'A Requirement states whether it shall be met, should be met or may be met.', strength: should, section: 34.6 (Requirement entry), checkable: partial}
- {id: TOGAF-DEF-010, statement: 'Requirements should be specific and measurable (SMART). Concerns and requirements are different things: a concern is an area of interest and is decomposed into requirements.', strength: note, section: '35.1', checkable: none}
- {id: TOGAF-DEF-011, statement: An Objective is a time-bounded milestone toward a Goal., strength: note, section: 34.5; 34.4.6, checkable: partial}
- {id: TOGAF-EXT-001, statement: The core metamodel is the minimum content for traceability. Extension modules are optional and are chosen to meet the needs of the engagement; the grouping of entities into modules is a suggestion that the architects may tailor., strength: note, section: 34.2.1; 34.4, checkable: static}
- {id: TOGAF-EXT-002, statement: 'The extension modules to use should be selected when the engagement is scoped: the Preliminary Phase in 34.2.1, the Architecture Vision phase in 34.4. The standard names both.', strength: should, section: 34.2.1; 34.4, checkable: runtime}
- {id: TOGAF-EXT-003, statement: 'An entity, relationship or artifact that belongs to an extension module should appear in a model only when that module has been selected. Core content is always available.', strength: should, section: '34.2.1; 34.4; Figures 34-7, 35-3', applies_when: the engagement has chosen its extension modules, checkable: partial}
- {id: TOGAF-EXT-004, statement: 'Governance extension: Measure, Service Quality and Contract are added. A Measure links an Objective to a Business Service. A Service Quality is a reusable service-level profile applied to a Business Service or a Contract. A Contract formalizes a service interaction.', strength: note, section: 34.4.1, checkable: static}
- {id: TOGAF-EXT-005, statement: 'Services extension: Information System Service is a kind of Business Service. It inherits every relationship a Business Service has, and one new relationship links it to a Business Service.', strength: should, section: 34.4.2; Figure 34-12, applies_when: the Services extension is selected, checkable: static}
- {id: TOGAF-EXT-006, statement: 'Process Modeling extension: Event sits between Actor, Process and Service; Control relates to a Process; Product links Organization Unit and Process.', strength: note, section: 34.4.3, checkable: static}
- {id: TOGAF-EXT-007, statement: 'Data extension: a Logical Data Component encapsulates Data Entities and a Physical Data Component extends it. A Physical Data Component is related to an Application Component. When the Infrastructure Consolidation extension is also used, that component is a Physical Application Component, and the Physical Data Component is also related to a Location.', strength: should, section: 34.4.4; 34.4.5, applies_when: the Data extension is selected, checkable: partial}
- {id: TOGAF-EXT-008, statement: 'Infrastructure Consolidation extension: location becomes an entity. The location attribute on Organization, Actor, Application Component, Data Component and Technology Component is removed and replaced by a relationship to a Location. Application and Technology Components each gain a logical and a physical kind.', strength: should, section: 34.4.5, applies_when: the Infrastructure Consolidation extension is selected, checkable: partial}
- {id: TOGAF-EXT-009, statement: 'Motivation extension: Driver, Goal and Objective are added and link an Organization Unit to a Business Service. Drivers motivate Organization Units and create Goals; Goals are realized through Objectives.', strength: note, section: 34.4.6, checkable: static}
- {id: TOGAF-ATTR-001, statement: 'The attributes in 34.6 are typical, not mandatory. Every entity typically carries ID, Name and Description, and optionally Category, Source and Owner. Beyond these, the standard lists further typical attributes for particular entities.', strength: note, section: '34.6', checkable: static}
- {id: TOGAF-ATTR-002, statement: 'Standards class takes one of six values: Non-Standard, Proposed Standard, Provisional Standard, Standard, Phasing-Out Standard, Retired Standard. It is typical for Business Service, Function, Process, Service, Application Component, Information System Service, Logical and Physical Application Component, Logical and Physical Data Component, Logical and Physical Technology Component, Platform Service and Technology Component.', strength: should, section: '34.6', checkable: static}
- {id: TOGAF-ATTR-003, statement: 'Lifecycle status of a Physical Application Component takes one of five values: Proposed, In Development, Live, Phasing Out, Retired.', strength: should, section: 34.6 (Physical Application Component entry), checkable: static}
- {id: TOGAF-ATTR-004, statement: 'Principle category takes one of six values: Guiding, Business, Data, Application, Integration, Technology.', strength: should, section: 34.6 (Principle entry), checkable: static}
- {id: TOGAF-ATTR-005, statement: 'Data Entity category takes one of two values: Message, Internally Stored Entity.', strength: should, section: 34.6 (Data Entity entry), checkable: static}
- {id: TOGAF-ATTR-006, statement: 'Work Package category takes one of five values: Work Package, Work Stream, Project, Program, Portfolio.', strength: should, section: 34.6 (Work Package entry), checkable: static}
- {id: TOGAF-ATTR-007, statement: 'Location category is Region, Country, Building or Specific Location. The nature of the business may introduce other kinds of location, so the set is open.', strength: note, section: 34.6 (Location entry), checkable: static}
- {id: TOGAF-ATTR-008, statement: 'The category of a Logical Technology Component, Physical Technology Component and Platform Service comes from the TOGAF Technical Reference Model, which may be extended.', strength: note, section: '34.6', checkable: none}
- {id: TOGAF-ART-001, statement: A catalog lists only building blocks of the entity types the standard assigns to that catalog. A matrix relates the entity types the standard names for its axes. See each artifact in language.yaml., strength: should, section: '35.6', checkable: partial}
- {id: TOGAF-ART-002, statement: 'The relationship behind the Application/Organization matrix is a composite and needs validating: Organization Units own Services; Actors belonging to those Organization Units use Services; Services are realized by Logical or Physical Application Components. A cell is supported only if that path exists.', strength: should, section: 35.6.5 (Application/Organization Matrix), checkable: partial}
- {id: TOGAF-ART-003, statement: 'The relationship behind the Role/Application matrix is a composite and needs validating: a Role accesses a Function; the Function is bounded by a Service; the Service is realized by a Logical or Physical Application Component.', strength: should, section: 35.6.5 (Role/Application Matrix), checkable: partial}
- {id: TOGAF-ART-004, statement: 'The relationship behind the Application/Function matrix is a composite and needs validating: a Function is bounded by a Service; the Service is realized by a Logical or Physical Application Component.', strength: should, section: 35.6.5 (Application/Function Matrix), checkable: partial}
- {id: TOGAF-ART-005, statement: 'A deliverable may contain many artifacts and artifacts form the content of the repository. The Architecture Definition Document is the container for the core artifacts across business, data, application and technology, for each state (baseline, transition, target).', strength: note, section: 33.1; 36.2.3, checkable: none}
- {id: TOGAF-ART-006, statement: 'Each artifact is recommended for production in the ADM phase 35.6 lists it under. The standard says the artifacts "may be created" there; the phase is a recommendation, not a requirement.', strength: note, section: '35.6', checkable: none}
- {id: TOGAF-ART-007, statement: 'The Stakeholder Map matrix uses no specific metamodel entities, because stakeholder mapping is sensitive and the Architecture Vision phase is informal.', strength: note, section: 35.6.2 (Stakeholder Map Matrix), checkable: none}
- {id: TOGAF-ART-008, statement: 'Catalogs, matrices and diagrams can also be generated on demand by querying the repository. Such ad hoc artifacts are not restricted or defined by the content metamodel.', strength: note, section: 34.2.1, checkable: none}
- {id: TOGAF-VIEW-001, statement: 'Every view has an associated viewpoint, at least implicitly. A viewpoint is generic and re-usable; a view is specific to the architecture it was made for.', strength: note, section: '35.1', checkable: none}
- {id: TOGAF-VIEW-002, statement: 'A viewpoint defines how to construct and use a view, the information that appears in it, the modeling techniques for expressing and analyzing that information, and the rationale (purpose and audience).', strength: should, section: '35.1', checkable: partial}
- {id: TOGAF-VIEW-003, statement: 'An architecture description identifies at least one stakeholder and at least one concern, selects at least one viewpoint, is organized by at least one view and aggregates at least one model. Each stakeholder has at least one concern. A view conforms to a viewpoint.', strength: should, section: Figure 35-1; 35.1, checkable: partial}
- {id: TOGAF-VIEW-004, statement: 'The architect must develop pertinent views of both the Baseline Architecture and the Target Architecture, which gives the context for gap analysis at the end of Phases B, C and D.', strength: must, section: 35.2.1, checkable: none}
- {id: TOGAF-VIEW-005, statement: 'The architect is responsible for completeness (all pertinent stakeholder concerns addressed) and integrity (the views connected, conflicting concerns reconciled, trade-offs shown), within the limit of fitness for purpose.', strength: note, section: 35.2.1, checkable: none}
- {id: TOGAF-BB-001, statement: 'A building block has a type that corresponds to a content metamodel entity, a defined boundary generally recognizable as a thing by domain experts, and may interoperate with other building blocks.', strength: should, section: 37.2.2, checkable: partial}
- {id: TOGAF-BB-002, statement: 'A building block specification should be loosely coupled to its implementation, so it can be realized several ways without changing its boundary or specification.', strength: note, section: 37.2.2, checkable: none}
- {id: TOGAF-BB-003, statement: An architecture need only contain the building blocks relevant to the business problem it addresses., strength: note, section: 37.3.1.1, checkable: none}
- {id: TOGAF-BB-004, statement: 'An Architecture Building Block specification includes at least: fundamental functionality and attributes (including security capability and manageability); interfaces (chosen set, supplied); interoperability and relationship with other building blocks; dependent building blocks with required functionality and named interfaces; a map to business and organizational entities and policies.', strength: should, section: 37.2.3.2, checkable: none}
- {id: TOGAF-BB-005, statement: 'A Solution Building Block specification includes at least: specific functionality and attributes; interfaces (the implemented set); required building blocks and the interfaces used; a mapping to the IT topology and operational policies; shared attributes such as security, manageability, localizability and scalability; performance and configurability; design drivers and constraints, including the physical architecture; the relationships between solution and architecture building blocks.', strength: should, section: 37.2.4.2, checkable: none}
- {id: TOGAF-BB-006, statement: Architecture Building Blocks capture architecture requirements and direct and guide the development of Solution Building Blocks., strength: note, section: 37.2.3.1, checkable: none}
notes: 'Version 9.1 (December 2011). TOGAF 9.2 (16 April 2018, document C182) and the TOGAF Standard 10th Edition (25 April 2022, document C220) are newer; this guide does not describe them. The standard is informal: nothing in Part IV is stated as a requirement except that the architect must develop views of both baseline and target (35.2.1), so one constraint is `must` and the rest are `should` or `note`. The metamodel defines no mandatory attributes and no multiplicities for its relationships. Core membership differs between the text of 34.2.1, Figure 34-6 and Figure 34-7; this file follows Figure 34-7.'

layout:
  basis: Our conventions, not this standard's. Sizes and spacing come from the shared layout standard.
  element_types: {}
  exceptions: {}
  diagram_types: {}
  viewpoints: {}
