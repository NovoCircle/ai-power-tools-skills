  # The abstract groupings above are never applied to a model element (UPDM-GEN-006), so they have no drawing. Matrix views (for example OV-3, SV-3, SV-6, SV-7) are shown as tables, not diagrams (Annex D, Tables D.8, D.10).

layout:
  basis: Our conventions, not this standard's. Sizes and spacing come from the shared layout standard; this block only says which element type each concept takes.
  element_types:        # concept -> element type; a concept left out is drawn as a rectangle (box)
    NodePort: attached-item
    ResourcePort: attached-item
    Service: attached-item
    Request: attached-item
    OperationalParameter: attached-item
    OperationalConstraint: note
    ResourceConstraint: note
    Metadata: note
    ArchitectureMetadata: note
    StandardConfiguration: note
    ServicePolicy: note
    VisionStatement: note
    Information: note
    Definition: note
    Alias: note
    StereotypeExtension: note
    DesignRule: note
    ActualPropertySet: note
    OperationalEventTrace: container
    LogicalDataModel: container
    ResourceEventTrace: container
    PhysicalDataModel: container
    View: container
    ArchitecturalDescription: container
    Viewpoint: container
    ServiceInteraction: container
    ServiceDescription: container
  exceptions: {}        # none: no standard states a size
  no_element_type:      # concepts with no element of their own, and why
    line:
      reason: 'A relationship: it is drawn as a line between elements and takes no element size.'
      concepts: [ActualOrganizationRelationship, FillsPost, ProvidesCompetence, RequiresCompetence, ArbitraryConnector,
        Needline, OperationalMessage, OperationalActivityEdge, Command, OperationalExchange, ResourceInterface,
        Forecast, ResourceConnector, ResourceInteraction, FunctionEdge, ResourceMessage, ArchitecturalReference,
        IsCapableOfPerforming, Implements, Details, EntityRelationship, ServiceMessage, ServiceFunctionEdge,
        MapsToCapability, Exhibits, OrganizationalProjectRelationship, AssociationOfInformation,
        ActivityPerformedByPerformer, ActivityPartOfProject, ProjectActivityEdge, SkillOfPersonType,
        ActivityPartOfCapability, CapabilityOfPerformer, DesiredEffect, Trustline, OwnsProcess, Control,
        ProjectSequence, ProjectOwnership, MilestoneSequence, SameAs, Overlap, Contract]
    text-inside:
      reason: Written as a line of text inside the box that owns it (a slot, operation, parameter, reception or literal), so it has no box of its own. ResourceParameter and ServiceParameter are here because the guide records no figure of them; OperationalParameter has a pin form in Annex D, Figure D.21, so it is an attached item.
      concepts: [ActualOrganizationRole, NodeOperation, ResourceParameter, ResourceOperation, ISO8601DateTime, ActualProperty,
        ActualMeasurement, ServiceLevelValue, ServiceMessageHandler, ServiceOperation, ServiceParameter,
        ActualProjectMilestoneRole, ProjectStatus]
    not-drawn:
      reason: Abstract, or a concept that exists only in the metamodel, so nothing is drawn for it.
      concepts: [CompetenceProvider, ActualOrganizationalResource, CompetenceRequirer, OrganizationalResource, ConceptItem,
        NodeParent, SubjectOfOperationalConstraint, SubjectOfOperationalStateMachine, OperationalExchangeItem,
        SubjectOfForecast, PhysicalResource, SystemResource, SubjectOfResourceConstraint, ResourceInteractionItem,
        DataModel, PropertySet, UPDMElement, ConditionType, LocationHolder, Exchange, Participant, Resource, Rule,
        Activity, CapableElement, ProtocolImplementation, ServicePort, ServiceFeature, DesiredState, Desirer,
        ActivitySubject, Process, OntologyReference]
