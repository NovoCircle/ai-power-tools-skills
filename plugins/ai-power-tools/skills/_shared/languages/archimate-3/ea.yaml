conventions: not-harvested
harvest:
  stereotypes:
    source: shipped-xml
    what: 'the plain technology file MDGTechnologies\ArchiMate3.xml in the EA install folder: 73 distinct stereotypes with
      metaclasses (Apply), tagged values, default diagram type, toolbox pages and diagram types; confirmed complete against
      the Resources tab (76 rows: the three network stereotypes are listed once per metaclass)'
  metaclass_and_binding:
    source: model-pattern
    what: 'one element per element stereotype and one connector per relationship stereotype created in a new model with the
      qualified type, then t_object.Object_Type, t_object.Stereotype, t_xref (FQName), t_objectproperties and t_connector.Connector_Type
      read back: 59 element stereotypes (all bound to ArchiMate3), 14 connector stereotypes, 5 diagram types; the Path, Communication
      Network and Distribution Network element forms in a second small package'
  diagram_types:
    source: shipped-xml and model-pattern
    what: names, base and toolbox from the file; Diagram_Type Logical and MDGDgm=ArchiMate3::<name> read back from t_diagram
  toolbox:
    source: shipped-xml
    what: 5 toolboxes, 28 pages, items in file order
  quick_links:
    source: shipped-xml
    what: 'the technology file''s embedded RelationshipTable: rows are targets and columns sources in the file; here stored
      as source -> target -> letters, 3,600 concept pairs plus the rows that have a junction or a relationship at one end.
      Letters a c f g i n o r s t v are the relationships of the standard (rule table in language.yaml); d p w are EA''s network
      connectors'
  on_screen_2026_11_04:
    measured_on: EA 17.1 build 1716, 2026-11-04, read on screen; the profile rows were not recounted
    resources_tab: the Diagram Types group 'ArchiMate 3.1' lists 5 types (Business Layer Diagram, Application Layer Diagram,
      Technology Layer Diagram, Motivation Diagram, Implementation and Migration, name cut off); the Toolboxes node lists
      Application, Business, Implementation, Motivation, Technology; ArchiMate 3.2 is not listed
    toolbox_pages_of_a_business_layer_diagram: 'Active Structure (Business) Concepts: Business Actor, Business Role, Business
      Collaboration, Business Interface; Behavioral (Business) Concepts: Business Process, Function, Interaction, Service,
      Event; Passive Structure (Business) Concepts: Business Object, Contract, Representation, Product; Structural Relationships:
      Composition, Aggregation, Realization, Assignment, Serving, Access, Association, Influence; Dynamic Relationships: Triggering,
      Flow; Other Concepts: Specialization, Junction, Grouping, Location. Only the Business layer pages are shown on this
      diagram type'
    quick_links_from_a_BusinessActor: 'targets: BusinessActor, BusinessCollaboration, BusinessEvent, BusinessFunction, BusinessInteraction,
      BusinessInterface, BusinessObject, BusinessProcess, BusinessRole, BusinessService, Contract, Grouping, Junction, Location,
      Product, Representation (the menu is limited to the Business layer because the diagram is a Business Layer diagram);
      BusinessRole and BusinessProcess: Assigned to, Flows to, Serving, Triggers, Flows from, Served by, Triggered by; BusinessObject:
      Accesses; BusinessActor: Aggregation of, Composed of, Flows to, Serving, Specializes, Triggers, Aggregates, Composes,
      Flows from, Served by, Specialized by, Triggered by. One source, four pairs'
  values_not_harvested:
  - conventions (per-diagram-type layout numbers are carried from the existing diagram binding, not re-measured here)

quick_links:
  # EA's quick linker: the letters it offers when you drag from the source element to the target element.
  # The standard's table is the language file's relationships.allowed; this is what EA offers, which is wider.
  letters:
    a: ArchiMate_Access
    c: ArchiMate_Composition
    d: ArchiMate_DistributionNetwork
    f: ArchiMate_Flow
    g: ArchiMate_Aggregation
    i: ArchiMate_Assignment
    n: ArchiMate_Influence
    o: ArchiMate_Association
    p: ArchiMate_Path
    r: ArchiMate_Realization
    s: ArchiMate_Specialization
    t: ArchiMate_Triggering
    v: ArchiMate_Serving
    w: ArchiMate_CommunicationNetwork
  differs_from_standard:
    summary: >
      By a plain cell count EA's table holds 3,045 relationship letters (counting a c f g i n o r s t v) that the standard's table
      does not. 1,386 of those are an artifact of keys: EA keys a relationship end by the relationship's name (Access,
      Aggregation, ...) and the standard by one Relationship row, so 1,342 association letters the standard also allows, and 44
      composition and aggregation letters on grouping, location and plateau rows, are counted twice. Like for like, EA offers
      1,659 letters the standard refuses and omits one it allows. 1,298 are composition and aggregation into a relationship from
      elements other than grouping, location and plateau; 357 are composition, aggregation and specialization at a junction; 4 are
      between two concepts, listed below. EA also offers the network letters d, p, w (54 cells). A quick link is therefore not
      proof that a relationship is valid; validate against the standard's table.
    counts:
      plain_cell_count: 3045
      like_for_like: {total: 1659, relationship_end: 1298, junction_end: 357, concept_pair: 4}
    concept_pairs_where_ea_offers_more:
      - {source: CommunicationNetwork, target: TechnologyInterface, extra: c}
      - {source: Equipment, target: Material, extra: r}
      - {source: Outcome, target: Plateau, extra: cg}
    concept_pairs_where_ea_offers_less:
      - {source: BusinessRole, target: TechnologyEvent, missing: f}
    network_letters_d_p_w_cells: 54
