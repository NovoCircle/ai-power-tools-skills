    OperatingMode: {display: Operating Mode, group: ISO 26262 requirements, kind: relationship profile element, layer: profile, abstract: false, uml_base: Dependency, section: 9.7.2 p. 107, definition: 'A state of a function realized by one or more architectural components, associated with specific behaviors.', note: Described as a state although it extends a dependency.}
relationships:
  note: RAAML gives no table of allowed endpoint pairs. Endpoint rules are the numbered constraints of each profile relationship (see constraints, categories REL, GSN and STPA) and the multiplicities of the part properties. Dependencies run from client (source) to supplier (target). Multiplicity keys are targets_per_source and sources_per_target. Part (composition) relationships belong to a library class; sources_per_target is 1. Endpoints written sysml-1:Name or uml:Name are defined in those languages; any model element means the standard does not restrict the kind.
  count: 51
  items:
  - name: Causality
    kind: association
    source: AnySituation
    target: AnySituation
    roles: {source: from, target: to}
    multiplicity: {targets_per_source: 0..*, sources_per_target: 0..*}
    section: 9.1.1 p. 21
    note: 'The universal root relationship between situations: direct, conditional, probabilistic or user-defined cause and effect. Several situations can cause one and one can cause several.'
  - name: Activation
    kind: association
    source: AbstractCause
    target: DysfunctionalEvent
    roles: {source: fault, target: error}
    multiplicity: {targets_per_source: 0..*, sources_per_target: 0..*}
    generalizes: Causality
    section: 9.2.1 p. 30
    note: Propagation of an initial cause to a dysfunctional event in the system.
  - name: ErrorPropagation
    kind: association
    source: DysfunctionalEvent
    target: DysfunctionalEvent
    roles: {source: fromError, target: toError}
    multiplicity: {targets_per_source: 0..*, sources_per_target: 0..*}
    generalizes: Causality
    section: 9.2.1 p. 30
    note: One error leading to another through the system.
  - name: ErrorRealization
    kind: association
    source: DysfunctionalEvent
    target: DysfunctionalEvent
    roles: {source: error, target: failure}
    multiplicity: {targets_per_source: 0..*, sources_per_target: 0..*}
    generalizes: Causality
    section: 9.2.1 p. 31
    note: An error propagating to a failure.
  - name: ProcessModelFactor
    kind: association
    source: Factor
    target: ProcessModel
    roles: {source: Factor, target: processModel}
    multiplicity: {targets_per_source: 0..*, sources_per_target: 0..*}
    generalizes: Causality
    section: 9.5.1 p. 77
    note: Causal relationship between a causal factor and a process flaw.
  - name: ProcessModelConsequence
    kind: association
    source: ProcessModel
    target: UnsafeControlAction
    roles: {source: processModel, target: unsafeControlAction}
    multiplicity: {targets_per_source: 0..*, sources_per_target: 0..*}
    generalizes: Causality
    section: 9.5.1 p. 77
    note: Causal relationship between a process flaw and an unsafe control action.
  - name: UnsafeControlActionHarmPotential
    kind: association
    source: UnsafeControlAction
    target: HarmPotential
    roles: {source: unsafeControlAction, target: harmPotential}
    multiplicity: {targets_per_source: 0..*, sources_per_target: 0..*}
    generalizes: Causality
    section: 9.5.1 p. 77
    note: Causal relationship between an unsafe control action and a source of risk.
  - {name: RiskRealization, kind: association class, source: Loss, target: Hazard, generalizes: AbstractRisk and Causality, section: 9.5.1 p. 76, note: Association between a loss and a hazard (potential harm). The text names the two ends but gives no direction or role names; source and target here follow the order of the text only.}
  - {name: RelevantTo, kind: dependency, source: Situation, target: any model element, section: 9.1.2 p. 22, note: 'Client must be a Situation. Supplier is the system-model element that gives context. Used in STPA to connect an unsafe control action to its control action, and to tie failure states to failure modes.'}
  - {name: ControllingMeasure, kind: dependency, source: any model element, target: Situation, section: 9.1.2 p. 23, note: Abstract. Supplier must be a Situation. The client is the measure or action item (for example a requirement).}
  - {name: Detection, kind: dependency, source: any model element, target: Situation, generalizes: ControllingMeasure, section: 9.2.2 p. 35, note: A measure that raises the probability of detecting the situation.}
  - {name: Prevention, kind: dependency, source: any model element, target: Situation, generalizes: ControllingMeasure, section: 9.2.2 p. 36, note: A measure that lowers the probability of the situation occurring.}
  - {name: Mitigation, kind: dependency, source: any model element, target: Situation, generalizes: ControllingMeasure, section: 9.2.2 p. 36, note: A measure that lowers the severity of the situation.}
  - {name: Recommendation, kind: dependency, source: any model element, target: Situation, generalizes: ControllingMeasure, section: 9.2.2 p. 37, note: 'Connects the situation to an action item, normally a requirement.'}
  - {name: Violates, kind: dependency, source: Situation, target: any model element, section: 9.1.2 p. 23, note: 'Client must be a Situation. Supplier is a requirement, design constraint or other element that prescribes a characteristic.'}
  - {name: InContextOf, kind: dependency, source: GSNArgumentNode, target: ContextualInformation, section: 9.6.1 p. 86, note: 'Client must be a goal or strategy. Supplier may be contextual information or a non-GSN element, never another GSN node kind. Permitted: goal or strategy to context, assumption or justification.'}
  - {name: SupportedBy, kind: dependency, source: GSNArgumentNode, target: GSNNode, section: 9.6.1 p. 87, note: 'Client must be a goal or strategy that is not marked undeveloped. Supplier may be a GSN node or a non-GSN element, never contextual information. If the client is a strategy the supplier is a goal. Permitted: goal to goal, strategy or solution; strategy to goal.'}
  - {name: IndependenceRequirement, kind: dependency, source: 'sysml-1:Requirement', target: 'sysml-1:Requirement', generalizes: DeriveReqt, section: 9.7.2 p. 104, note: From the child requirement that states the independence criterion to its parent. Endpoint kinds are not otherwise constrained by the text.}
  - {name: ASILDecompose, kind: dependency, source: 'sysml-1:Requirement', target: 'sysml-1:Requirement', generalizes: DeriveReqt, section: 9.7.2 p. 105, note: Applied in pairs. The supplier should be at a higher abstraction than the client.}
  - {name: SafeState, kind: dependency, source: not stated, target: not stated, section: 9.7.2 p. 105, note: Endpoints are not stated.}
  - {name: UserInfoRequirement, kind: dependency, source: 'uml:State', target: FunctionalSafetyRequirement or TechnicalSafetyRequirement, generalizes: Satisfy, section: 9.7.2 p. 106, note: Arrow from a state (client) to the requirement (supplier).}
  - {name: RecoveryRequirement, kind: dependency, source: SafeState, target: 'sysml-1:Requirement', generalizes: Satisfy, section: 9.7.2 p. 106, note: Between a safe state and a requirement that gives recovery criteria.}
  - {name: OperatingMode, kind: dependency, source: not stated, target: not stated, section: 9.7.2 p. 107, note: Endpoints are not stated.}
