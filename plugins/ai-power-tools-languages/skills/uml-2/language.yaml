# Stub: holds only the layout block until the guide arrives.
# The guide replaces this file and keeps the `layout` block.
id: uml-2
name: Unified Modeling Language (UML)
stub: true
layout:
  basis: Our conventions, not this standard's.  Sizes and spacing come from the shared layout standard.
  element_types:
    Actor: actor
    Package: container
    Port: attached-item
    UseCase: large-box
    Comment: note
    DecisionNode: decision-diamond
    MergeNode: decision-diamond
    Pseudostate: small-node
    FinalState: small-node
    InitialNode: small-node
    ActivityFinalNode: small-node
    FlowFinalNode: small-node
    InputPin: attached-item
    OutputPin: attached-item
    ValuePin: attached-item
    ActionInputPin: attached-item
  exceptions: {}
  diagram_types:
    Class diagram:
      arrangement: graph
      title: frame-header
      route: straight
      trunk:
        route: tree-vertical
        for:
        - Generalization
      channels:
        fill: null
        claimed:
          position: Set by automatic layout rather than by the notation. UML gives position no meaning
            on this diagram, and a layout pass overwrites anything set beforehand, so it can't carry a
            second variable.
          size: Compartment content. A class box is sized by the attributes and operations it shows, so
            using size to encode something else fights the content.
          line_style: 'Normative in UML: dashed against solid separates a dependency or a realization
            from an association. Overwriting it changes what a connector means.'
        free:
        - fill
        - border
        - border_width
        - line_color
        - font_color
        - opacity
        - icon
