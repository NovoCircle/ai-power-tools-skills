  diagram_types:
    Role Collaboration:
      arrangement: graph
      title: frame-header
      route: straight
      channels:
        claimed:
          line_style: Solid against dashed separates a tangible deliverable from an intangible one (8.2).
        free:
        - fill
        - border
        - border_width
        - line_color
        - font_color
        - opacity
