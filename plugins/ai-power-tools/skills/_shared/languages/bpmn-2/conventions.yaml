      grid_pad: 12
      label_height: 28
    routing:
      default: OrthogonalSquare
    channels:
      fill: Kind of node, as in a process diagram.
      claimed:
        position: The pool says which participant; position along the flow says when.
        size: Kind of node.
      free:
