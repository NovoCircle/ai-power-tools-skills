ea_only:
  ArchiMate_TechnologyObject:
    kind: element
    metaclass: Class
    default_diagram_type: ArchiMate3::Technology
    measured: true
    what: The generic passive element of the technology layer, which the standard's text mentions as the parent of Artifact
      and Material but does not list as a concept of its own. Not in the open exchange schema; the relationship table does
      not name it, so a relationship ruleset ignores it.
  diagram_type_stereotypes:
    names:
    - Business
    - Application
    - Technology
    - Motivation
    - Implementation
    what: One stereotype per diagram type in the technology file (Business, Application, Technology, Motivation, Implementation).
      They name the diagram types; no element or connector carries them.
  toolbox_page_stereotypes:
    names:
    - Active Structure (Application) Concepts
    - Behavioral (Application) Concepts
    - Passive Structure (Application) Concepts
    - Structural Relationships
    - Dynamic Relationships
    - Other Concepts
    - Active Structure (Business) Concepts
    - Behavioral (Business) Concepts
    - Passive Structure (Business) Concepts
    - Implementation and Migration Concepts
