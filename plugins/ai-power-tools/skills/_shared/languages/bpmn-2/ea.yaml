  BPELProcess: a process container for BPEL generation, with its own composite BPEL diagram; the standard has no counterpart
  toolbox page names:
  - BPMN2.0::IntermediateEvent
  - BPMN2.0BusinessProcessConnecters
  - BPMN2.0BusinessProcessCore
  - BPMN2.0Choreography
  - BPMN2.0ChoreographyConnectors
  - BPMN2.0Collaboration
  - BPMN2.0CollaborationConnectors
  - BPMN2.0Conversation
  - BPMN2.0ConversationConnectors
  - BPMN2.0Types
  toolbox item stereotypes: the file's toolbox profiles carry 35 further Stereotype elements spelled BPMN2.0::<name>(UML::<metaclass>)
    that place an item on a page; they are not element stereotypes
  diagram profile:
  - BPEL
  - Business Process
  - Choreography
  - Collaboration
  - Conversation
