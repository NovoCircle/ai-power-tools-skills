    InternalActiveStructureElement: {display: Internal Active Structure Element, category: Generic metamodel, aspect: active-structure, abstract: true, specializes: ActiveStructureElement, section: 4.1.1}
    Interface: {display: Interface (external active structure element), category: Generic metamodel, aspect: active-structure, abstract: true, specializes: ActiveStructureElement, section: 4.1.1}
    PassiveStructureElement: {display: Passive Structure Element, category: Generic metamodel, aspect: passive-structure, abstract: true, specializes: StructureElement, section: 4.1.3}
    BehaviorElement: {display: Behavior Element, category: Generic metamodel, aspect: behavior, abstract: true, specializes: Element, section: 4.1.2}
    InternalBehaviorElement: {display: Internal Behavior Element, category: Generic metamodel, aspect: behavior, abstract: true, specializes: BehaviorElement, section: 4.1.2}
    Service: {display: Service (external behavior element), category: Generic metamodel, aspect: behavior, abstract: true, specializes: BehaviorElement, section: 4.1.2}
    Event: {display: Event, category: Generic metamodel, aspect: behavior, abstract: true, specializes: BehaviorElement, section: 4.1.2}
    Collaboration: {display: Collaboration (generic), category: Generic metamodel, aspect: active-structure, abstract: true, specializes: InternalActiveStructureElement, section: '4.2'}
