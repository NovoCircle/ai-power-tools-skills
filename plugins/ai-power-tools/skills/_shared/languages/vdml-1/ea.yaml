    note: a Collaboration's own port, a Part element drawn as a pyramid; tag InputOutput (Input, Output, Either)
  InputPort:
    representation: stereotype and tag
    stereotype: BoundaryPort
    metaclass: Port
    tags:
    - InputOutput
