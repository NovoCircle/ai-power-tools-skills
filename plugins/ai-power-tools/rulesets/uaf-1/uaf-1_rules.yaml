    name: 'OwnsProcess: the kinds of element at its two ends'
    implements: UAF-END-091
    also_implements:
    - UAF-END-092
    description: The client of an OwnsProcess must be an ActualOrganizationalResource (or a specialization of it). The supplier
      of an OwnsProcess must be an OperationalActivity (or a specialization of it). In EA the relationship is an Abstraction
      connector stereotyped OwnsProcess (source = client or information source, target = supplier or information target).
      Each end must carry a stereotype that the standard allows there (the table lists the concrete stereotypes); an end with
      no stereotype, or with one that is not in the table, is reported. [OMG UAF 1.0 (formal/17-12-01) 7.1.12.5]
    category: end
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: connector
      connector_stereotype: OwnsProcess
    condition:
      type: relationship_table
      table: uaf-1-ownsProcess
      unknown_endpoint: error
    remediation:
      short: Join the kinds of element the standard allows at the two ends of an OwnsProcess.
      auto_fixable: false

  - id: UAF1-VAL-002
    name: A Forecast joins two elements of the same kind
    implements: UAF-VAL-002
    description: 'The client and the supplier of a Forecast must be the same specialization of SubjectOfForecast. The rule
      reads ''same specialization'' as the same group among the direct specializations of SubjectOfForecast (resource performers,
      competences, standards with protocols and protocol stacks): a Forecast from a Software to a Standard is reported; a
      Software to a System is not. [OMG UAF 1.0 (formal/17-12-01) 7.1.8.9]'
    category: val
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: Which level of the specialization hierarchy counts as 'the same specialization' is read as the direct specializations
      of SubjectOfForecast; the standard gives only the examples Software to Software and Standard to Standard.
    selector:
      type: connector
      connector_stereotype: Forecast
    condition:
      type: relationship_table
      table: uaf-1-forecastSameKind
      unknown_endpoint: ignore
    remediation:
      short: Join two elements of the same kind (for example two Software elements or two Standards).
      auto_fixable: false

