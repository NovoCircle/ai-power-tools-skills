  - name: HazardousEvent.systemLevelEffect
    kind: composition
    source: HazardousEvent
    target: SystemLevelEffect
    roles: {source: hazardousEvent, target: systemLevelEffect}
    multiplicity: {targets_per_source: 0..*, sources_per_target: '1'}
    section: 9.7.1 p. 98
  - name: HazardousEvent.vehicleLevelEffect
    kind: composition
    source: HazardousEvent
    target: VehicleLevelEffect
    roles: {source: hazardousEvent, target: vehicleLevelEffect}
    multiplicity: {targets_per_source: 0..*, sources_per_target: '1'}
    section: 9.7.1 p. 98
    note: Redefines harm.
diagram_types:
  block definition:
    display: SysML block definition diagram
    form: diagram
    defined_by: 7.3 (p. 12); Examples 2.1, 2.5 (informative)
    reused_from: sysml-1
    admits: [AnySituation, Situation, Scenario, AbstractRisk, AbstractFMEAItem, FMEAItem, FTATree, HazardousEvent, AccidentScenario, TypicalAutomotiveSituation, OperationalCondition, AnyMalfunction, Hazard, AutomotiveEffect, Exposure, Severity, Controllability, ASIL, DependabilityRequirement, SafetyGoal, Violates, RelevantTo, Causality]
    admits_note: The main diagram for defining situations, scenarios, library classes and their specializations, and for showing FMEA items, operational conditions, accident scenarios, hazardous events and safety goal decomposition. The standard names it as one of the diagrams in which situation and scenario models are created and shown.
  internal block:
    display: SysML internal block diagram
    form: diagram
    defined_by: 7.3 (p. 12); Examples 2.1, 2.3 (informative)
    reused_from: sysml-1
    admits: [Situation, Scenario, FMEAItem, Cause, FailureMode, Effect, ControlStructure, Controller, ControlledProcess, Actuator, Sensor, ControlAction, Feedback, Loss, Hazard]
    admits_note: Used for the composition of scenarios, for chaining causes, failure modes and effects across levels of a system in an FMEA, for the STPA control structure, and for mapping losses to hazards.
  parametric:
    display: SysML parametric diagram
    form: diagram
    defined_by: 9.1, Table 9.1 (p. 20); Examples 2.1 (informative)
    reused_from: sysml-1
    admits: [RPNCalculation, ANDConstraintBlock, ORConstraintBlock, SEQConstraintBlock, XORConstraintBlock, INHIBITConstraintBlock, MAJORITY_VOTEConstraintBlock, NOTConstraintBlock]
    admits_note: Used for the RPN formula, the gate probability formulas, and any formula relating quantitative attributes of situations.
  requirement:
    display: SysML requirement diagram
    form: diagram
    defined_by: Examples 2.5 (informative)
    reused_from: sysml-1
    admits: [SafetyGoal, FunctionalSafetyRequirement, TechnicalSafetyRequirement, SoftwareSafetyRequirement, HardwareSafetyRequirement, DependabilityRequirement, ASILDecompose, IndependenceRequirement, Violates]
    admits_note: Used for safety goal decomposition and for requirements that result from an analysis.
  fault tree:
    display: Fault tree diagram
    form: diagram
    defined_by: 9.4 (pp. 44-69); Examples 2.2 (informative)
    admits: [FTATree, Tree, TopEvent, IntermediateEvent, BasicEvent, UndevelopedEvent, ConditionalEvent, DormantEvent, HouseEvent, ZeroEvent, Event, Gate, AND, OR, NOT, XOR, SEQ, INHIBIT, MAJORITY_VOTE, TransferIn, TransferOut, Undeveloped]
    admits_note: A top-down tree of events combined by gates. The standard gives no frame or notation of its own beyond saying the event and gate markers carry icons; trees can be split and linked with transfer-in and transfer-out nodes.
  GSN argument:
    display: Goal Structuring Notation argument diagram
    form: diagram
    defined_by: 9.6 (pp. 81-88); Examples 2.4 (informative)
    admits: [Goal, Strategy, Solution, Context, Assumption, Justification, InContextOf, SupportedBy, Undeveloped, IDCarrier]
    admits_note: An argument of goals, strategies and solutions with contextual information. Drawn as a class-style diagram, with the notation described under conventions. The profile covers the core notation of the second version of the Goal Structuring Notation only.
  control structure:
    display: STPA control structure diagram
    form: diagram
    defined_by: 9.5.2 (pp. 78-81); Examples 2.3 (informative)
    reused_from: sysml-1
    admits: [ControlStructure, Controller, ControlledProcess, Actuator, Sensor, ControlAction, Feedback]
    admits_note: A feedback control loop of controllers and controlled processes with control actions and feedback. It can stand alone or be built into the system model; control actions and feedback may be shown or hidden.
  situation table:
    display: Situation table
    form: table
    defined_by: 7.3.2 (pp. 13-16, Tables 7.1 and 7.2); Examples 2.5 (informative)
    admits: [Situation, AbstractOperationalSituation, TypicalAutomotiveSituation, AccidentScenario, HazardousEvent, OperationalCondition, AutomotiveEffect, Hazard, AnyMalfunction]
    admits_note: A table with a name column and one column per attribute of the situation type. Rows are situations; indented rows are specializations; a composite sub-situation becomes a group of columns, so one table can cover several levels (for example a hazardous event with its accident scenario and operational situation). Examples show tables of operational conditions, operational situations, accident scenarios, effects, hazards and hazardous events.
  FMEA table:
    display: FMEA table
    form: table
    defined_by: Examples 2.1 (informative)
    admits: [FMEAItem, FailureMode, Cause, Effect]
    admits_note: 'A classical FMEA table: each row is an FMEA item, with the item (reached through RelevantTo), failure mode, cause, local effect, final effect, and the severity, detectability, occurrence and RPN columns. Tool vendors may color the RPN by priority.'
  unsafe control action table:
    display: Unsafe control action table
    form: table
    defined_by: Examples 2.3, Table 2.1 (informative)
    admits: [ControlAction, UnsafeControlAction, Provided, NotProvided, STPAEarly, STPALate, OutOfSequence, TooLong, TooShort, AbstractOperationalSituation, Hazard]
    admits_note: Rows are control actions; guideword columns hold the unsafe control actions with references to context and hazard elements.
  HAZOP table:
    display: HAZOP table
    form: table
    defined_by: Examples 2.5, Figure 2.22 (informative)
    admits: [AnyMalfunction, Less, More, 'No', Intermittent, Unintended, ISO26262Early, ISO26262Late, Inverted, RelevantTo]
    admits_note: Rows are behavioral elements (activities); columns are the guidewords; cells hold the malfunctioning behaviors related by RelevantTo.
