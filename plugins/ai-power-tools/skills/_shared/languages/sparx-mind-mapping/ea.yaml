# EA's names for this language's layout. `tools/gen_conventions.py` reads `layout_map`.
# This family is EA's own, with no guide on the language shelf, so the map holds everything.
language: sparx-mind-mapping
layout_map:
  technology: MindMapping
  extends: UML
  stereotype_prefix: ''
  notes: |
    ONE DIAGRAM TYPE, AND IT IS BOUND. There is nothing left out at the diagram-type level, which makes this the only binding in the directory with complete coverage of its technology.

    THE OMISSION THAT MATTERS IS `CentralTopic`. It is the hub the radial-tree grammar places at the middle of the diagram and the one element whose size a composer most wants, and it cannot be stated: n=4, one per diagram, which rule 1 refuses on sample size. Its modal size is 120x60 (2 of 4, over 3 distinct sizes) and its median is 120x60 too, so the figure is probably right and it is four diagrams short of being sayable. It falls back to the 90x40 default, which is a main-topic box - visibly too small for a central topic. State it the day there are ten mind maps. This is the highest-value single measurement missing from this file.

    ROUTE NAME IS CONVENTIONAL, WITH MEASURED CORROBORATION THAT IT IS NOT THE UML DEFAULT. `t_diagramlinks.Style` carries Mode=8 on 49 of 49 connectors here - unanimous, and distinct from the Mode=3 that dominates plain UML (346 of 347 on Logical) and every straight-routed StrategyMap diagram type. So the measurement says confidently that this notation routes differently; what it cannot say is the route's NAME, because the integer-to-name mapping lives in the server's `_ROUTE_STYLES` and the skills bundle deliberately does not import the server. `Bezier` is stated because the corpus row's routing is CURVED-ARC and Bezier is the only curved route in EA's own Line Style list. That is an inference from two sides rather than a measurement, and it is the one value in this file to confirm first.

    GRAMMAR. `radial-tree` is the notation's own figure and it is implemented - `compose_radial_tree.py` opens by describing itself as a mind map, and its reasons for not being `compose_radial` are this diagram type's reasons: depth below the central topic is ordinary and branches carry unequal numbers of children. The corpus row independently calls the grammar `radial-tree`. Nothing here is an approximation of a grammar we do not have.
  diagram_types:
    MindMapping:
      base: Analysis
      arrangement: radial-tree
      title: drawn
      route: curved
      channels:
        fill: Topic level. The corpus row's color encoding is "kind", and the kind is the four-stereotype
          vocabulary - CentralTopic, MainTopic, Topic, SubTopic. Recoloring a mind map overwrites the
          one thing its colors say.
        claimed:
          position: Depth and branch. How far a node sits from the central topic is its depth, and the
            bearing it sits on is which branch it belongs to, so both polar coordinates are spoken for
            - and the radial-tree composer computes them, so they are not available in any case.
          size: Content. 18 distinct sizes across 48 nodes, and SubTopic alone has 10 distinct sizes over
            12 elements, because a topic box is sized by the text it carries. The corpus row records free
            multi-line text as leaf labels, which is the same fact from the other side.
          line_style: 'Normative in UML and used here: 44 of the 49 connectors are solid Associations
            and 5 are dashed Dependencies, so the dash pattern already separates a branch from a cross-reference.'
        free:
        - border
        - border_width
        - line_color
        - font_color
        - opacity
        - icon
