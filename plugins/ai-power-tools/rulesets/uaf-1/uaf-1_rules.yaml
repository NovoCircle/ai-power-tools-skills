# UAF 1.0 Conformance Ruleset
# Language:     Unified Architecture Framework 1.0 (OMG formal/17-12-01), as modeled with Sparx's built-in `UAF` technology
#               (profile UAFP; EA reports technology version 1.1, its perspective text says UAF 1.0)
# Enforced by:  AI Power Tools for Sparx EA - validate_model tool
# Generated from the language skill's rules, relationships and specializations; do not edit by hand.
#
# STEREOTYPE NAMES ARE UNQUALIFIED, UPPER CAMEL CASE, AND THAT IS MEASURED.
#
# validate_model selects with `Stereotype IN (...)` on t_object and t_connector. For Sparx's UAF technology that column holds the
# bare name as the profile writes it (`Capability`, `OperationalPerformer`, `IsCapableToPerform`); the qualified form
# `UAFP::IsCapableToPerform` is only in the t_xref row named `Stereotypes`. The prefix is the profile name UAFP, not the technology
# id UAF (`UAF::<name>` binds nothing). Measured on EA 17.1 build 1716 by creating one object per stereotype in a test model and
# reading it back: 172 of the 178 names on the Resources tab bound, FQName `UAFP::<name>`. EA matches a name without regard to case
# when it creates an object, but a selector compares the stored string exactly.
#
# WHAT IS CHECKED. Each relationship of the standard is a stereotyped connector in EA (Abstraction, Dependency, InformationFlow,
# ControlFlow or Connector). The end rules say which kinds of element may stand at its two ends; the standard names abstract
# groupings (OperationalAgent, CapableElement, Asset ...) that EA has no stereotype for, so each table lists the concrete stereotypes
# that specialize them. 41 such rules implement 79 of the 92 END ids (client and supplier together). Thirteen of the 17 exactly-one
# properties are tagged values of the stereotype in EA and are checked as required tags; one rule reads the Forecast same-kind rule.
# 29 rules check where an element sits (contained_in): the owner of a role, port, part,
# action, state description, signal property or information element is the element it is nested under (ParentID) or, for an element
# in a package, that package; each rule lists the stereotypes the standard allows as the owner.
#
# WHAT THE VALIDATOR CANNOT SEE. A rule cannot read what a part or port is typed by (the classifier), the tagged values of a
# connector, numbers, dates or formats, what a diagram shows, the operations and attributes of a class, or a second stereotype. It
# can select the note and constraint links of Alias, Definition and the constraints (connectors of type NoteLink with no stereotype)
# but cannot say that a link from one kind of note ends at one kind of element and a link from another ends at another, so those
# rules are not here. Nor can it say that everything a performer owns of a kind is of one stereotype (the converse ownership
# rules). Most of UAF's typing and exchange rules are about those, so they are not in this file. An element with two stereotypes (for
# example a UAF stereotype and a SysML block) stores only the first in t_object.Stereotype, which is all a rule sees.
#
# EA'S UAF TECHNOLOGY HAS NO STEREOTYPE for the abstract groupings, the 16 enumerations (the 15 kinds and SecurityClassificationKind), ActualMeasurement and the other five
# slot concepts (the tab lists them; EA binds none), SecurityControlAction, SecurityProperty and a few others; rules about them are not
# written.
#
# Sources:
#   [S1] OMG, Unified Architecture Framework Profile (UAFP) 1.0, formal/17-12-01, and the domain metamodel, formal/17-12-02
#        https://www.omg.org/spec/UAF/1.0/
#   [S2] Sparx Systems, the UAF technology built into Enterprise Architect 17.1 (MDG technology id UAF, profile UAFP)

meta:
  version: "0.1"
  language: uaf-1
  organization: "(your organization)"
  mdg_family: UAF
  description: >
    Conformance rules for UAF 1.0 models built with Sparx Enterprise Architect's UAF technology: which kinds of element each
    relationship may join, that a Forecast joins elements of the same kind, that the exactly-one properties EA carries as tagged
    values have a value, and that roles, ports, parts, actions, state descriptions and data elements sit in the owner the standard
    names. Each rule names the rules.md id it implements.
  severity_levels:
    error: A requirement of the standard (rules.md strength must)
    warning: Guidance of the standard (rules.md strength should)
    info: Advisory note; not a conformance violation

