layout:
  basis: Our conventions, not this standard's. Sizes and spacing come from the shared layout standard.
  element_types:
    # Every other concept is drawn as a rectangle or rounded rectangle, which is a box.
    Grouping: container            # dashed outline with a tab, holds other elements
    Meaning: box                   # cloud outline
    Value: box                     # ellipse
    Junction: small-node           # a dot on a relationship line
  exceptions: {}
