conventions:
  standard_notation: The standard defines no drawing notation of its own. Views are drawn as UML and SysML diagrams (class, composite structure, activity, state machine, sequence, package); the profile elements are applied to the UML elements
    shown. Constraint and dependency diagrams in the specification are documentation notation and are not part of the interchanged profile.
  provenance:
    status: not-measured
    note: No drawing conventions were measured for this language.
constraints:
- id: UPDM-CONF-001
  statement: A tool conforms at compliance level 0 only if every element, attribute, constraint, association and package structure scoped to the level 0 package, including its sub-packages, exists and complies with the specification.
  strength: must
  section: 2.1.1
  checkable: none
- id: UPDM-CONF-002
  statement: A conforming tool supports exchange of both the user model and the profile through the XMI interchange format.
  strength: must
  section: 2.1.1; 2.1.2
  checkable: runtime
- id: UPDM-CONF-003
  statement: A level 0 tool imports and exports level 0 models with full fidelity, with no loss and no transformation.
  strength: must
  section: 2.1.1
  checkable: runtime
- id: UPDM-CONF-004
  statement: A level 0 tool imports level 1 models with only minimal loss.
  strength: must
  section: 2.1.1
  checkable: runtime
- id: UPDM-CONF-005
  statement: Compliance level 1 includes everything in level 0, imports the whole SysML profile with its sub-profiles, and adds the constraints that pair SysML elements with level 0 elements (rules UPDM-SYS-001 to 039).
  strength: must
  section: 2.1.2; 8.1
  checkable: none
- id: UPDM-CONF-006
  statement: A level 1 tool imports and exports level 1 models with full fidelity, with no loss and no transformation.
  strength: must
  section: 2.1.2
  checkable: runtime
- id: UPDM-CONF-007
  statement: A level 1 tool imports level 0 models with no loss, transforming where necessary.
  strength: must
  section: 2.1.2
  checkable: runtime
- id: UPDM-CONF-008
  statement: Level 0 imports a minimum of ten SoaML elements (Capability, ServiceInterface, Expose, Attachment, Request, Service, MessageType, Property, ServiceChannel, Participant); they are used as SoaML defines them and are not redocumented.
  strength: note
  section: 2.1.1; 7.6.2; 8.3.1
  checkable: none
- id: UPDM-CONF-009
  statement: The specification states that it conforms to DoDAF 2.02 at level 3, the physical data model; each tool vendor remains responsible for its own conformance claim. The DoD CIO did not expect export of the physical exchange specification
    or a four-dimensional implementation.
  strength: note
  section: 3.4.1
  checkable: none
- id: UPDM-GEN-001
  statement: If the architecture framework of an ArchitecturalDescription is DoDAF, only aliases scoped under the DoDAF elements may be used; if it is MODAF, only the MODAF aliases; if it is not set, no aliases may be used.
  strength: must
  section: 8.3.1.1.2.7 (ArchitecturalDescription)
  subject: ArchitecturalDescription
  property: architectureFramework
  checkable: static
- id: UPDM-GEN-002
  statement: The start and end of an EnterprisePhase must fall within the start and end of the enterprise it belongs to, the whole life cycle.
  strength: must
  section: 8.3.1.1.6.1 (EnterprisePhase)
  subject: EnterprisePhase
  property: startDate
  checkable: partial
- id: UPDM-GEN-003
