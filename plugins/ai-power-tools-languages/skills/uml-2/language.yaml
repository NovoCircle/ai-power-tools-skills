# Unified Modeling Language (UML) 2.5.1: language file (schema_version 1).
# Written from the standard only. Concept names are the standard's own metaclass names (no spaces).
# Facts of the metamodel (classes, generalizations, abstractness, multiplicities, constraint names) come from the normative
# machine-readable model (UML.xmi, ptc/18-01-01); notation and prose rules come from the document (formal/17-12-05).
# Keys beyond the base schema:
#   concepts.elements[].specializes   : a name, or a list of names when the metaclass has several generalizations (UML has multiple inheritance)
#   concepts.elements[].attributes    : list of strings `name:Type[multiplicity]=default`, only the attributes that carry no association
#   concepts.enumerations             : the 13 enumeration types with their literals
#   relationships.kinds               : the relationship kinds a modeler draws, with metaclass, ends, notation
#   relationships.allowed             : for each kind, the metaclass names allowed at the source and target ends (read from the ends' types)
#   relationships.metamodel_associations : every association of the metamodel with both ends (60 of the 109 Actions associations)
#   diagram_types[].admits_basis      : inferred (the standard gives no closed list per diagram type) ; admits is guidance, not a rule
#   keywords, standard_profile        : Annex C Table C.1 and clause 22 Table 22.1
#   constraints[].applies_when        : omitted = always; package-merge = only when a package merge is present; profile-applied = only for a model
#                                       to which a profile is applied; execution = describes running behavior, not a saved model
#   constraints[].checkable           : static = a validator that sees only the saved model can check it; partial = only the structure, simple cases
#                                       or type-conformance reasoning; runtime = needs a running instance; none = not a property of a model
#   constraints[].source              : `formal: Metaclass::name` is the constraint's name in the machine-readable model; `prose: key` is a rule
#                                       stated in the text of the clause named in `section`
#   Strength policy: must = error, should = warning, note = advice only.
schema_version: 1
id: uml-2
name: Unified Modeling Language (UML)
owner: {name: Object Management Group, kind: standards-body}
standard:
  name: Unified Modeling Language
  version: 2.5.1
  status: published
  reference: OMG formal/17-12-05 (specification PDF, December 2017); normative machine-readable models ptc/18-01-01 (UML.xmi), ptc/18-01-02 (PrimitiveTypes.xmi), ptc/18-01-03 (StandardProfile.xmi), ptc/18-01-04 (UMLDI.xmi); https://www.omg.org/spec/UML/2.5.1/
  iso_edition: not compared
  supersedes: '2.5'
  newer_version: none found (2.5.1 is the newest formal version OMG lists)
conformance_types:
  AbstractSyntax:
    section: '2'
    requires: A user interface or API that creates, reads, updates and deletes instances of concrete metaclasses, and a way to validate well-formedness against the metamodel constraints.
  ConcreteSyntax:
    section: '2'
    requires: A user interface or API that creates, reads, updates and deletes instances of UML notation; additional diagrams and notation not defined in UML are allowed.
  ModelInterchange:
    section: '2'
    requires: Import and export of conformant XMI for all valid UML models, including models with profiles defined or applied; also reads and writes UML 2.4.1 XMI. Implies abstract syntax conformance.
    includes: AbstractSyntax
  DiagramInterchange:
    section: '2'
    requires: Import and export of conformant diagram interchange (Annex B) for all valid models with diagrams. Implies concrete syntax and model interchange conformance.
    includes: [ConcreteSyntax, ModelInterchange]
  Semantic:
    section: '2'
    requires: A demonstrable way to interpret UML semantics (code generation, model execution or semantic analysis); the normative semantics are clause 6.3 and the Semantics subclauses of clauses 7 to 22. Implies abstract syntax conformance.
    includes: AbstractSyntax
concepts:
  source: 'OMG UML 2.5.1: the abstract syntax in UML.xmi (242 classes, 13 enumerations, 418 associations, 449 class constraints) with the clauses of formal/17-12-05 (7 to 20) for definitions and sections. Definitions are in the skill''s own words.'
  groups:
    Common Structure:
      defined_by: Clause 7 (Common Structure); association descriptions 7.9
      package: CommonStructure
    Values:
      defined_by: Clause 8 (Values); association descriptions 8.7
      package: Values
    Classification:
      defined_by: Clause 9 (Classification); association descriptions 9.10
      package: Classification
    Simple Classifiers:
      defined_by: Clause 10 (Simple Classifiers); association descriptions 10.6
      package: SimpleClassifiers
    Structured Classifiers:
      defined_by: Clause 11 (Structured Classifiers); association descriptions 11.9
      package: StructuredClassifiers
    Packages:
      defined_by: Clause 12 (Packages); association descriptions 12.5
      package: Packages
    Common Behavior:
      defined_by: Clause 13 (Common Behavior); association descriptions 13.5
      package: CommonBehavior
    StateMachines:
      defined_by: Clause 14 (StateMachines); association descriptions 14.6
      package: StateMachines
    Activities:
      defined_by: Clause 15 (Activities); association descriptions 15.8
      package: Activities
    Actions:
      defined_by: Clause 16 (Actions); association descriptions 16.15
      package: Actions
    Interactions:
      defined_by: Clause 17 (Interactions); association descriptions 17.13
      package: Interactions
    UseCases:
      defined_by: Clause 18 (UseCases); association descriptions 18.3
      package: UseCases
    Deployments:
      defined_by: Clause 19 (Deployments); association descriptions 19.6
      package: Deployments
    InformationFlows:
      defined_by: Clause 20 (InformationFlows); association descriptions 20.3
      package: InformationFlows
    Standard profile and primitive types:
      defined_by: Clauses 21 and 22
      package: n/a (separate models)
  elements:
    Abstraction:
      display: Abstraction
      category: Common Structure
      specializes: Dependency
      section: 7.8.1
      definition: A dependency whose two sides stand for the same idea at different levels of abstraction or from different viewpoints; the base for Realization, Substitution, Usage's siblings and similar mappings.
    Comment:
      display: Comment
      category: Common Structure
      specializes: Element
      section: 7.8.2
      attributes:
      - {name: body, type: String, multiplicity: "0..1"}
      definition: A piece of free text that can be attached to any set of elements.
    Constraint:
      display: Constraint
      category: Common Structure
      specializes: PackageableElement
      section: 7.8.3
      definition: A condition or restriction, written in natural language or a machine-readable language, that states part of the meaning of one or more elements.
    Dependency:
      display: Dependency
      category: Common Structure
      specializes: [DirectedRelationship, PackageableElement]
      section: 7.8.4
      definition: A relationship saying that some client elements need some supplier elements for their specification or implementation, so a change to a supplier may affect the client.
    DirectedRelationship:
      display: DirectedRelationship
      category: Common Structure
      specializes: Relationship
      abstract: true
      section: 7.8.5
      definition: A relationship with a defined direction, from one or more source elements to one or more target elements.
    Element:
      display: Element
      category: Common Structure
      abstract: true
      section: 7.8.6
      definition: 'The root of the metamodel: anything that can appear in a model; it can own other elements and comments.'
    ElementImport:
      display: ElementImport
      category: Common Structure
      specializes: DirectedRelationship
      section: 7.8.7
      attributes:
      - {name: alias, type: String, multiplicity: "0..1"}
      - {name: visibility, type: VisibilityKind, multiplicity: "1", default: "public"}
      definition: Brings one named element from another namespace into the importing namespace so it can be used there under its unqualified name or an alias.
    MultiplicityElement:
      display: MultiplicityElement
      category: Common Structure
      specializes: Element
      abstract: true
      section: 7.8.8
      attributes:
      - {name: isOrdered, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isUnique, type: Boolean, multiplicity: "1", default: "true"}
      - {name: lower, type: Integer, multiplicity: "1", derived: true}
      - {name: upper, type: UnlimitedNatural, multiplicity: "1", derived: true}
      definition: 'An element that carries a multiplicity: an inclusive range of non-negative whole numbers (lower to a possibly unlimited upper) for how many values or instances are allowed.'
    NamedElement:
      display: NamedElement
      category: Common Structure
      specializes: Element
      abstract: true
      section: 7.8.9
      attributes:
      - {name: name, type: String, multiplicity: "0..1"}
      - {name: qualifiedName, type: String, multiplicity: "0..1", derived: true}
      - {name: visibility, type: VisibilityKind, multiplicity: "0..1"}
      definition: An element that may have a name (given directly or by a string expression), a visibility, and a qualified name built from its owning namespaces.
    Namespace:
      display: Namespace
      category: Common Structure
      specializes: NamedElement
      abstract: true
      section: 7.8.10
      definition: An element that owns or imports named elements, so those can be identified by name inside it.
    PackageImport:
      display: PackageImport
      category: Common Structure
      specializes: DirectedRelationship
      section: 7.8.11
      attributes:
      - {name: visibility, type: VisibilityKind, multiplicity: "1", default: "public"}
      definition: Imports all the non-private members of a package into the importing namespace, so they can be named without qualification.
    PackageableElement:
      display: PackageableElement
      category: Common Structure
      specializes: [ParameterableElement, NamedElement]
      abstract: true
      section: 7.8.12
      attributes:
      - {name: visibility, type: VisibilityKind, multiplicity: "0..1", default: "public"}
      definition: A named element that a package may own directly; also usable as the parametered element of a template parameter.
    ParameterableElement:
      display: ParameterableElement
      category: Common Structure
      specializes: Element
      abstract: true
      section: 7.8.13
      definition: An element that can be exposed as a formal template parameter, or supplied as an actual parameter when a template is bound.
    Realization:
      display: Realization
      category: Common Structure
      specializes: Abstraction
      section: 7.8.14
      definition: An abstraction in which the client (an implementation) realizes the supplier (a specification); used for refinement, transformation, template instantiation and the like.
    Relationship:
      display: Relationship
      category: Common Structure
      specializes: Element
      abstract: true
      section: 7.8.15
      definition: The abstract notion of some kind of relationship among elements.
    TemplateBinding:
      display: TemplateBinding
      category: Common Structure
      specializes: DirectedRelationship
      section: 7.8.16
      definition: Binds a template to actual parameters, by owning the substitutions of actual parameters for the template's formal parameters.
    TemplateParameter:
      display: TemplateParameter
      category: Common Structure
      specializes: Element
      section: 7.8.17
      definition: Exposes one parameterable element as a formal parameter of a template.
    TemplateParameterSubstitution:
      display: TemplateParameterSubstitution
      category: Common Structure
      specializes: Element
      section: 7.8.18
      definition: Pairs an actual parameter with a formal template parameter as part of a template binding.
    TemplateSignature:
      display: TemplateSignature
      category: Common Structure
      specializes: Element
      section: 7.8.19
      definition: Bundles the formal template parameters of one template.
    TemplateableElement:
      display: TemplateableElement
      category: Common Structure
      specializes: Element
      abstract: true
      section: 7.8.20
      definition: An element that can be defined as a template and can be bound to other templates.
    Type:
      display: Type
      category: Common Structure
      specializes: PackageableElement
      abstract: true
      section: 7.8.21
      definition: Constrains the values that a typed element can represent.
    TypedElement:
      display: TypedElement
      category: Common Structure
      specializes: NamedElement
      abstract: true
      section: 7.8.22
      definition: A named element that may have a type.
    Usage:
      display: Usage
      category: Common Structure
      specializes: Dependency
      section: 7.8.23
      definition: A dependency in which the client needs the supplier for its full implementation or operation.
    Duration:
      display: Duration
      category: Values
      specializes: ValueSpecification
      section: 8.6.1
      definition: A value specification for the length of time between two instants.
    DurationConstraint:
      display: DurationConstraint
      category: Values
      specializes: IntervalConstraint
      section: 8.6.2
      attributes:
      - {name: firstEvent, type: Boolean, multiplicity: "0..2"}
      definition: A constraint that restricts a duration, given by a duration interval, measured between one or two constrained elements.
    DurationInterval:
      display: DurationInterval
      category: Values
      specializes: Interval
      section: 8.6.3
      definition: A range between a minimum and a maximum duration.
    DurationObservation:
      display: DurationObservation
      category: Values
      specializes: Observation
      section: 8.6.4
      attributes:
      - {name: firstEvent, type: Boolean, multiplicity: "0..2"}
      definition: A reference to a duration seen during execution; it names the elements observed and whether the observation is on entry to or exit from each.
    Expression:
      display: Expression
      category: Values
      specializes: ValueSpecification
      section: 8.6.5
      attributes:
      - {name: symbol, type: String, multiplicity: "0..1"}
      definition: 'A node in an expression tree: a symbol with an ordered, possibly empty list of operand value specifications.'
    Interval:
      display: Interval
      category: Values
      specializes: ValueSpecification
      section: 8.6.6
      definition: A range between a minimum and a maximum value specification.
    IntervalConstraint:
      display: IntervalConstraint
      category: Values
      specializes: Constraint
      section: 8.6.7
      definition: A constraint whose specification is an interval.
    LiteralBoolean:
      display: LiteralBoolean
      category: Values
      specializes: LiteralSpecification
      section: 8.6.8
      attributes:
      - {name: value, type: Boolean, multiplicity: "1", default: "false"}
      definition: A literal true or false value.
    LiteralInteger:
      display: LiteralInteger
      category: Values
      specializes: LiteralSpecification
      section: 8.6.9
      attributes:
      - {name: value, type: Integer, multiplicity: "1", default: "0"}
      definition: A literal whole number.
    LiteralNull:
      display: LiteralNull
      category: Values
      specializes: LiteralSpecification
      section: 8.6.10
      definition: A literal that stands for the absence of a value.
    LiteralReal:
      display: LiteralReal
      category: Values
      specializes: LiteralSpecification
      section: 8.6.11
      attributes:
      - {name: value, type: Real, multiplicity: "1"}
      definition: A literal real number.
    LiteralSpecification:
      display: LiteralSpecification
      category: Values
      specializes: ValueSpecification
      abstract: true
      section: 8.6.12
      definition: A value specification that gives a literal constant.
    LiteralString:
      display: LiteralString
      category: Values
      specializes: LiteralSpecification
      section: 8.6.13
      attributes:
      - {name: value, type: String, multiplicity: "0..1"}
      definition: A literal character string.
    LiteralUnlimitedNatural:
      display: LiteralUnlimitedNatural
      category: Values
      specializes: LiteralSpecification
      section: 8.6.14
      attributes:
      - {name: value, type: UnlimitedNatural, multiplicity: "1", default: "0"}
      definition: A literal natural number or the unlimited value (written *).
    Observation:
      display: Observation
      category: Values
      specializes: PackageableElement
      abstract: true
      section: 8.6.15
      definition: A value determined by watching events that occur relative to other model elements.
    OpaqueExpression:
      display: OpaqueExpression
      category: Values
      specializes: ValueSpecification
      section: 8.6.16
      attributes:
      - {name: body, type: String, multiplicity: "0..*", ordered: true, unique: false}
      - {name: language, type: String, multiplicity: "0..*", ordered: true}
      definition: A value computed either by a UML behavior or by text written in some other language, with one body per language.
    StringExpression:
      display: StringExpression
      category: Values
      specializes: [TemplateableElement, Expression]
      section: 8.6.17
      definition: An expression that yields a string by joining string operands or sub-expressions, some of which may be template parameters.
    TimeConstraint:
      display: TimeConstraint
      category: Values
      specializes: IntervalConstraint
      section: 8.6.18
      attributes:
      - {name: firstEvent, type: Boolean, multiplicity: "0..1", default: "true"}
      definition: A constraint on a point in time, given by a time interval.
    TimeExpression:
      display: TimeExpression
      category: Values
      specializes: ValueSpecification
      section: 8.6.19
      definition: A value specification that stands for a time value.
    TimeInterval:
      display: TimeInterval
      category: Values
      specializes: Interval
      section: 8.6.20
      definition: A range between a minimum and a maximum time expression.
    TimeObservation:
      display: TimeObservation
      category: Values
      specializes: Observation
      section: 8.6.21
      attributes:
      - {name: firstEvent, type: Boolean, multiplicity: "1", default: "true"}
      definition: A reference to an instant seen during execution; it names the element observed and whether the observation is on entry or on exit.
    ValueSpecification:
      display: ValueSpecification
      category: Values
      specializes: [TypedElement, PackageableElement]
      abstract: true
      section: 8.6.22
      definition: The specification of a possibly empty set of values; can be used as a template parameter or an actual parameter in a binding.
    BehavioralFeature:
      display: BehavioralFeature
      category: Classification
      specializes: [Feature, Namespace]
      abstract: true
      section: 9.9.2
      attributes:
      - {name: concurrency, type: CallConcurrencyKind, multiplicity: "1", default: "sequential"}
      - {name: isAbstract, type: Boolean, multiplicity: "1", default: "false"}
      definition: A feature that specifies part of the behavior of a classifier's instances; implemented by behaviors (methods) and invoked in answer to a request.
    Classifier:
      display: Classifier
      category: Classification
      specializes: [Namespace, Type, TemplateableElement, RedefinableElement]
      abstract: true
      section: 9.9.4
      attributes:
      - {name: isAbstract, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isFinalSpecialization, type: Boolean, multiplicity: "1", default: "false"}
      definition: A classification of instances according to their features; the base of every class-like thing.
    ClassifierTemplateParameter:
      display: ClassifierTemplateParameter
      category: Classification
      specializes: TemplateParameter
      section: 9.9.5
      attributes:
      - {name: allowSubstitutable, type: Boolean, multiplicity: "1", default: "true"}
      definition: A template parameter that exposes a classifier as the formal parameter.
    Feature:
      display: Feature
      category: Classification
      specializes: RedefinableElement
      abstract: true
      section: 9.9.6
      attributes:
      - {name: isStatic, type: Boolean, multiplicity: "1", default: "false"}
      definition: A structural or behavioral characteristic declared by classifiers.
    Generalization:
      display: Generalization
      category: Classification
      specializes: DirectedRelationship
      section: 9.9.7
      attributes:
      - {name: isSubstitutable, type: Boolean, multiplicity: "0..1", default: "true"}
      definition: A taxonomic link from a more specific classifier to a more general one; instances of the specific one are also instances of the general one, and it inherits the general one's features.
    GeneralizationSet:
      display: GeneralizationSet
      category: Classification
      specializes: PackageableElement
      section: 9.9.8
      attributes:
      - {name: isCovering, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isDisjoint, type: Boolean, multiplicity: "1", default: "false"}
      definition: A named set of generalizations that share a general classifier, with flags saying whether the subclasses cover all instances and whether they overlap.
    InstanceSpecification:
      display: InstanceSpecification
      category: Classification
      specializes: [DeploymentTarget, PackageableElement, DeployedArtifact]
      section: 9.9.9
      definition: A model element standing for an instance in the modeled system; its slots give values for the features of its classifiers.
    InstanceValue:
      display: InstanceValue
      category: Classification
      specializes: ValueSpecification
      section: 9.9.10
      definition: A value specification that points at an instance specification.
    Operation:
      display: Operation
      category: Classification
      specializes: [TemplateableElement, ParameterableElement, BehavioralFeature]
      section: 9.9.11
      attributes:
      - {name: isQuery, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isOrdered, type: Boolean, multiplicity: "1", derived: true}
      - {name: isUnique, type: Boolean, multiplicity: "1", derived: true}
      - {name: lower, type: Integer, multiplicity: "0..1", derived: true}
      - {name: upper, type: UnlimitedNatural, multiplicity: "0..1", derived: true}
      definition: A behavioral feature with a name, parameters, a return type and conditions, used to invoke an associated behavior.
    OperationTemplateParameter:
      display: OperationTemplateParameter
      category: Classification
      specializes: TemplateParameter
      section: 9.9.12
      definition: A template parameter that exposes an operation as the formal parameter.
    Parameter:
      display: Parameter
      category: Classification
      specializes: [MultiplicityElement, ConnectableElement]
      section: 9.9.13
      attributes:
      - {name: direction, type: ParameterDirectionKind, multiplicity: "1", default: "in"}
      - {name: effect, type: ParameterEffectKind, multiplicity: "0..1"}
      - {name: isException, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isStream, type: Boolean, multiplicity: "1", default: "false"}
      - {name: default, type: String, multiplicity: "0..1", derived: true}
      definition: An argument used to pass information into or out of an invocation of a behavioral feature or behavior.
    ParameterSet:
      display: ParameterSet
      category: Classification
      specializes: NamedElement
      section: 9.9.16
      definition: A group of parameters that are alternative sets of inputs or outputs of a behavior or behavioral feature.
    Property:
      display: Property
      category: Classification
      specializes: [ConnectableElement, DeploymentTarget, StructuralFeature]
      section: 9.9.17
      attributes:
      - {name: aggregation, type: AggregationKind, multiplicity: "1", default: "none"}
      - {name: isComposite, type: Boolean, multiplicity: "1", derived: true}
      - {name: isDerived, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isDerivedUnion, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isID, type: Boolean, multiplicity: "1", default: "false"}
      definition: A structural feature; owned by a classifier it is an attribute, and it may be an association end; owned by an association it is a navigable or non-navigable end.
    RedefinableElement:
      display: RedefinableElement
      category: Classification
      specializes: NamedElement
      abstract: true
      section: 9.9.18
      attributes:
      - {name: isLeaf, type: Boolean, multiplicity: "1", default: "false"}
      definition: An element that a specializing classifier can redefine in its own context.
    RedefinableTemplateSignature:
      display: RedefinableTemplateSignature
      category: Classification
      specializes: [RedefinableElement, TemplateSignature]
      section: 9.9.19
      definition: A template signature that lets a specialization of a template classifier add formal parameters.
    Slot:
      display: Slot
      category: Classification
      specializes: Element
      section: 9.9.20
      definition: Gives values on an instance specification for one structural feature.
    StructuralFeature:
      display: StructuralFeature
      category: Classification
      specializes: [MultiplicityElement, TypedElement, Feature]
      abstract: true
      section: 9.9.21
      attributes:
      - {name: isReadOnly, type: Boolean, multiplicity: "1", default: "false"}
      definition: A typed feature that specifies the structure of a classifier's instances.
    Substitution:
      display: Substitution
      category: Classification
      specializes: Realization
      section: 9.9.22
      definition: A relationship saying the substituting classifier complies with the contract of the contract classifier, so its instances can stand wherever the contract classifier's are expected.
    BehavioredClassifier:
      display: BehavioredClassifier
      category: Simple Classifiers
      specializes: Classifier
      abstract: true
      section: 10.5.1
      definition: A classifier that may realize interfaces and owns behaviors, one of which can describe the behavior of the classifier itself.
    DataType:
      display: DataType
      category: Simple Classifiers
      specializes: Classifier
      section: 10.5.2
      definition: A type whose instances are identified only by their value.
    Enumeration:
      display: Enumeration
      category: Simple Classifiers
      specializes: DataType
      section: 10.5.3
      definition: A data type whose values are the enumeration literals listed in the model.
    EnumerationLiteral:
      display: EnumerationLiteral
      category: Simple Classifiers
      specializes: InstanceSpecification
      section: 10.5.4
      definition: A user-defined value of an enumeration.
    Interface:
      display: Interface
      category: Simple Classifiers
      specializes: Classifier
      section: 10.5.5
      definition: Declares a coherent set of services that behaviored classifiers provide by realizing the interface.
    InterfaceRealization:
      display: InterfaceRealization
      category: Simple Classifiers
      specializes: Realization
      section: 10.5.6
      definition: 'A realization from a behaviored classifier to an interface: the classifier conforms to the interface''s contract.'
    PrimitiveType:
      display: PrimitiveType
      category: Simple Classifiers
      specializes: DataType
      section: 10.5.7
      definition: A predefined data type with no substructure; its algebra may be defined outside UML.
    Reception:
      display: Reception
      category: Simple Classifiers
      specializes: BehavioralFeature
      section: 10.5.8
      definition: A declaration that a classifier is prepared to react to receiving a signal.
    Signal:
      display: Signal
      category: Simple Classifiers
      specializes: Classifier
      section: 10.5.9
      definition: 'A kind of asynchronous communication between objects: a reaction is triggered in the receiver and nothing is returned.'
    Association:
      display: Association
      category: Structured Classifiers
      specializes: [Relationship, Classifier]
      section: 11.8.1
      attributes:
      - {name: isDerived, type: Boolean, multiplicity: "1", default: "false"}
      definition: Classifies a set of links, each link being a tuple of objects typed by the association's ends; the base of association relationships.
    AssociationClass:
      display: AssociationClass
      category: Structured Classifiers
      specializes: [Class, Association]
      section: 11.8.2
      definition: 'Both a class and an association: it connects classifiers and also has its own features.'
    Class:
      display: Class
      category: Structured Classifiers
      specializes: [BehavioredClassifier, EncapsulatedClassifier]
      section: 11.8.3
      attributes:
      - {name: isAbstract, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isActive, type: Boolean, multiplicity: "1", default: "false"}
      definition: Classifies objects and specifies the features that give them structure and behavior; may have an internal structure and ports.
    Collaboration:
      display: Collaboration
      category: Structured Classifiers
      specializes: [StructuredClassifier, BehavioredClassifier]
      section: 11.8.4
      definition: Describes a structure of collaborating roles that together achieve some functionality.
    CollaborationUse:
      display: CollaborationUse
      category: Structured Classifiers
      specializes: NamedElement
      section: 11.8.5
      definition: Applies the pattern described by a collaboration to a particular situation, binding roles to elements.
    Component:
      display: Component
      category: Structured Classifiers
      specializes: Class
      section: 11.8.6
      attributes:
      - {name: isIndirectlyInstantiated, type: Boolean, multiplicity: "1", default: "true"}
      definition: A modular, replaceable part of a system that encapsulates its contents and exposes provided and required interfaces.
    ComponentRealization:
      display: ComponentRealization
      category: Structured Classifiers
      specializes: Realization
      section: 11.8.7
      definition: A realization that names the classifiers that realize a component's contract.
    ConnectableElement:
      display: ConnectableElement
      category: Structured Classifiers
      specializes: [TypedElement, ParameterableElement]
      abstract: true
      section: 11.8.8
      definition: An element, such as a part or port, that plays a role in a structured classifier and can be attached to connectors.
    ConnectableElementTemplateParameter:
      display: ConnectableElementTemplateParameter
      category: Structured Classifiers
      specializes: TemplateParameter
      section: 11.8.9
      definition: A template parameter that exposes a connectable element as the formal parameter.
    Connector:
      display: Connector
      category: Structured Classifiers
      specializes: Feature
      section: 11.8.10
      attributes:
      - {name: kind, type: ConnectorKind, multiplicity: "1", derived: true}
      definition: A link between two or more connectable elements, enabling communication between the instances that play those roles only.
    ConnectorEnd:
      display: ConnectorEnd
      category: Structured Classifiers
      specializes: MultiplicityElement
      section: 11.8.11
      definition: An endpoint of a connector, attaching it to a connectable element.
    EncapsulatedClassifier:
      display: EncapsulatedClassifier
      category: Structured Classifiers
      specializes: StructuredClassifier
      abstract: true
      section: 11.8.13
      definition: A structured classifier that may own ports, its typed interaction points.
    Port:
      display: Port
      category: Structured Classifiers
      specializes: Property
      section: 11.8.14
      attributes:
      - {name: isBehavior, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isConjugated, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isService, type: Boolean, multiplicity: "1", default: "true"}
      definition: A property of an encapsulated classifier that is a distinct interaction point with its environment or with its internal parts.
    StructuredClassifier:
      display: StructuredClassifier
      category: Structured Classifiers
      specializes: Classifier
      abstract: true
      section: 11.8.15
      definition: A classifier with an internal structure of connected parts, each playing a role in the classifier's behavior.
    Extension:
      display: Extension
      category: Packages
      specializes: Association
      section: 12.4.1
      attributes:
      - {name: isRequired, type: Boolean, multiplicity: "1", derived: true}
      definition: The association that says a stereotype extends a metaclass, so stereotypes can be added to and removed from instances of that metaclass.
    ExtensionEnd:
      display: ExtensionEnd
      category: Packages
      specializes: Property
      section: 12.4.2
      attributes:
      - {name: lower, type: Integer, multiplicity: "0..1", derived: true}
      definition: The end of an extension that ties it to the stereotype; its multiplicity is 0..1 (or 1 when required).
    Image:
      display: Image
      category: Packages
      specializes: Element
      section: 12.4.3
      attributes:
      - {name: content, type: String, multiplicity: "0..1"}
      - {name: format, type: String, multiplicity: "0..1"}
      - {name: location, type: String, multiplicity: "0..1"}
      definition: A graphical image, held inline or at a location, that can serve as a stereotype's icon.
    Model:
      display: Model
      category: Packages
      specializes: Package
      section: 12.4.4
      attributes:
      - {name: viewpoint, type: String, multiplicity: "0..1"}
      definition: A package that captures a view of a system, abstracted for a purpose that decides what it includes.
    Package:
      display: Package
      category: Packages
      specializes: [PackageableElement, TemplateableElement, Namespace]
      section: 12.4.5
      attributes:
      - {name: URI, type: String, multiplicity: "0..1"}
      definition: A namespace for grouping packageable elements and other packages; it can merge other packages and have profiles applied.
    PackageMerge:
      display: PackageMerge
      category: Packages
      specializes: DirectedRelationship
      section: 12.4.6
      definition: Says that a receiving package is extended with the contents of a merged package.
    Profile:
      display: Profile
      category: Packages
      specializes: Package
      section: 12.4.7
      definition: A package that defines limited extensions to a reference metamodel to adapt it to a platform or domain.
    ProfileApplication:
      display: ProfileApplication
      category: Packages
      specializes: DirectedRelationship
      section: 12.4.8
      attributes:
      - {name: isStrict, type: Boolean, multiplicity: "1", default: "false"}
      definition: Shows that a profile has been applied to a package.
    Stereotype:
      display: Stereotype
      category: Packages
      specializes: Class
      section: 12.4.9
      definition: Defines how an existing metaclass may be extended and lets domain-specific terms or notation be used for it.
    AnyReceiveEvent:
      display: AnyReceiveEvent
      category: Common Behavior
      specializes: MessageEvent
      section: 13.4.1
      definition: An event for the receipt of any message that no other trigger of the behavior handles explicitly.
    Behavior:
      display: Behavior
      category: Common Behavior
      specializes: Class
      abstract: true
      section: 13.4.2
      attributes:
      - {name: isReentrant, type: Boolean, multiplicity: "1", default: "true"}
      definition: The specification of how a behaviored classifier changes state over time, either as a definition of possible executions or as an illustrative subset.
    CallEvent:
      display: CallEvent
      category: Common Behavior
      specializes: MessageEvent
      section: 13.4.3
      definition: The receipt by an object of a message that invokes a call of an operation.
    ChangeEvent:
      display: ChangeEvent
      category: Common Behavior
      specializes: Event
      section: 13.4.4
      definition: A change in the system that makes a stated condition become true.
    Event:
      display: Event
      category: Common Behavior
      specializes: PackageableElement
      abstract: true
      section: 13.4.5
      definition: The specification of an occurrence that may trigger effects in an object.
    FunctionBehavior:
      display: FunctionBehavior
      category: Common Behavior
      specializes: OpaqueBehavior
      section: 13.4.6
      definition: An opaque behavior that does not read or change any objects or external data.
    MessageEvent:
      display: MessageEvent
      category: Common Behavior
      specializes: Event
      abstract: true
      section: 13.4.7
      definition: The receipt by an object of an operation call or a signal instance.
    OpaqueBehavior:
      display: OpaqueBehavior
      category: Common Behavior
      specializes: Behavior
      section: 13.4.8
      attributes:
      - {name: body, type: String, multiplicity: "0..*", ordered: true, unique: false}
      - {name: language, type: String, multiplicity: "0..*", ordered: true}
      definition: A behavior specified as text in a language other than UML.
    SignalEvent:
      display: SignalEvent
      category: Common Behavior
      specializes: MessageEvent
      section: 13.4.9
      definition: The receipt of an asynchronous signal instance.
    TimeEvent:
      display: TimeEvent
      category: Common Behavior
      specializes: Event
      section: 13.4.10
      attributes:
      - {name: isRelative, type: Boolean, multiplicity: "1", default: "false"}
      definition: An event that occurs at a given point in time, absolute or relative.
    Trigger:
      display: Trigger
      category: Common Behavior
      specializes: NamedElement
      section: 13.4.11
      definition: The point at which an event occurrence may trigger an effect in a behavior; may be qualified by the port on which the event occurred.
    ConnectionPointReference:
      display: ConnectionPointReference
      category: StateMachines
      specializes: Vertex
      section: 14.5.1
      definition: The use, inside a submachine state, of an entry or exit point pseudostate defined in the state machine the submachine state refers to.
    FinalState:
      display: FinalState
      category: StateMachines
      specializes: State
      section: 14.5.2
      definition: A state that, when entered, says the enclosing region is complete; when every region of a state machine is complete the whole behavior is complete.
    ProtocolConformance:
      display: ProtocolConformance
      category: StateMachines
      specializes: DirectedRelationship
      section: 14.5.3
      definition: Says that a specific protocol state machine conforms to a general one, or that a behavioral state machine abides by the general protocol.
    ProtocolStateMachine:
      display: ProtocolStateMachine
      category: StateMachines
      specializes: StateMachine
      section: 14.5.4
      definition: A state machine defined for a classifier that states which behavioral features can be called in which states and under what conditions, giving the legal call sequences.
    ProtocolTransition:
      display: ProtocolTransition
      category: StateMachines
      specializes: Transition
      section: 14.5.5
      definition: A legal transition for an operation, described by a pre-condition, a trigger and a post-condition; attached to at most one behavioral feature.
    Pseudostate:
      display: Pseudostate
      category: StateMachines
      specializes: Vertex
      section: 14.5.6
      attributes:
      - {name: kind, type: PseudostateKind, multiplicity: "1", default: "initial"}
      definition: A transient vertex of a state machine graph; the machine never rests in it but passes through within a single run-to-completion step.
    Region:
      display: Region
      category: StateMachines
      specializes: [Namespace, RedefinableElement]
      section: 14.5.8
      definition: A top-level part of a state machine or composite state that contains vertices and transitions; several regions run in parallel.
    State:
      display: State
      category: StateMachines
      specializes: [Namespace, Vertex]
      section: 14.5.9
      attributes:
      - {name: isComposite, type: Boolean, multiplicity: "1", derived: true}
      - {name: isOrthogonal, type: Boolean, multiplicity: "1", derived: true}
      - {name: isSimple, type: Boolean, multiplicity: "1", derived: true}
      - {name: isSubmachineState, type: Boolean, multiplicity: "1", derived: true}
      definition: A situation during which some (usually implicit) invariant holds; simple, composite (one or more regions) or submachine.
    StateMachine:
      display: StateMachine
      category: StateMachines
      specializes: Behavior
      section: 14.5.10
      definition: Event-driven behavior expressed as traversal of a graph of vertices joined by transitions triggered by event occurrences.
    Transition:
      display: Transition
      category: StateMachines
      specializes: [Namespace, RedefinableElement]
      section: 14.5.11
      attributes:
      - {name: kind, type: TransitionKind, multiplicity: "1", default: "external"}
      definition: An arc from exactly one source vertex to exactly one target vertex; the pieces of a compound transition take the machine from one stable configuration to another.
    Vertex:
      display: Vertex
      category: StateMachines
      specializes: [NamedElement, RedefinableElement]
      abstract: true
      section: 14.5.13
      definition: A node in a state machine graph, source or target of any number of transitions.
    Activity:
      display: Activity
      category: Activities
      specializes: Behavior
      section: 15.7.1
      attributes:
      - {name: isReadOnly, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isSingleExecution, type: Boolean, multiplicity: "1", default: "false"}
      definition: A parameterized behavior given as the coordinated sequencing of subordinate units (nodes and edges).
    ActivityEdge:
      display: ActivityEdge
      category: Activities
      specializes: RedefinableElement
      abstract: true
      section: 15.7.2
      definition: A directed connection between two activity nodes.
    ActivityFinalNode:
      display: ActivityFinalNode
      category: Activities
      specializes: FinalNode
      section: 15.7.3
      definition: A final node that stops the whole execution of its owning activity or structured activity node.
    ActivityGroup:
      display: ActivityGroup
      category: Activities
      specializes: NamedElement
      abstract: true
      section: 15.7.4
      definition: A set of activity nodes and edges in an activity; the base of partitions and interruptible regions.
    ActivityNode:
      display: ActivityNode
      category: Activities
      specializes: RedefinableElement
      abstract: true
      section: 15.7.5
      definition: A point in the flow of an activity that edges connect.
    ActivityParameterNode:
      display: ActivityParameterNode
      category: Activities
      specializes: ObjectNode
      section: 15.7.6
      definition: An object node that accepts values from the activity's input parameters or supplies values to its output parameters.
    ActivityPartition:
      display: ActivityPartition
      category: Activities
      specializes: ActivityGroup
      section: 15.7.7
      attributes:
      - {name: isDimension, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isExternal, type: Boolean, multiplicity: "1", default: "false"}
      definition: A group that collects nodes that share a characteristic, such as who performs them (a swimlane).
    CentralBufferNode:
      display: CentralBufferNode
      category: Activities
      specializes: ObjectNode
      section: 15.7.8
      definition: An object node that manages flows from several sources to several targets.
    ControlFlow:
      display: ControlFlow
      category: Activities
      specializes: ActivityEdge
      section: 15.7.9
      definition: An edge carrying control tokens (or control-typed object tokens) that controls when executable nodes run.
    ControlNode:
      display: ControlNode
      category: Activities
      specializes: ActivityNode
      abstract: true
      section: 15.7.10
      definition: An activity node that coordinates flows.
    DataStoreNode:
      display: DataStoreNode
      category: Activities
      specializes: CentralBufferNode
      section: 15.7.11
      definition: A central buffer for persistent data.
    DecisionNode:
      display: DecisionNode
      category: Activities
      specializes: ControlNode
      section: 15.7.12
      definition: A control node that routes each token to one of its outgoing edges.
    ExceptionHandler:
      display: ExceptionHandler
      category: Activities
      specializes: Element
      section: 15.7.13
      definition: Names a handler body to run if a stated kind of exception occurs while the protected executable node runs.
    ExecutableNode:
      display: ExecutableNode
      category: Activities
      specializes: ActivityNode
      abstract: true
      section: 15.7.14
      definition: A node whose execution can be controlled by control flows and which can have exception handlers.
    FinalNode:
      display: FinalNode
      category: Activities
      specializes: ControlNode
      abstract: true
      section: 15.7.15
      definition: A control node at which a flow stops.
    FlowFinalNode:
      display: FlowFinalNode
      category: Activities
      specializes: FinalNode
      section: 15.7.16
      definition: A final node that ends one flow by consuming its tokens, without ending the activity.
    ForkNode:
      display: ForkNode
      category: Activities
      specializes: ControlNode
      section: 15.7.17
      definition: A control node that splits one flow into several concurrent flows.
    InitialNode:
      display: InitialNode
      category: Activities
      specializes: ControlNode
      section: 15.7.18
      definition: A control node that offers one control token when the activity starts.
    InterruptibleActivityRegion:
      display: InterruptibleActivityRegion
      category: Activities
      specializes: ActivityGroup
      section: 15.7.19
      definition: A group of nodes in which all tokens can be terminated when an interrupting edge fires.
    JoinNode:
      display: JoinNode
      category: Activities
      specializes: ControlNode
      section: 15.7.20
      attributes:
      - {name: isCombineDuplicate, type: Boolean, multiplicity: "1", default: "true"}
      definition: A control node that synchronizes several flows into one.
    MergeNode:
      display: MergeNode
      category: Activities
      specializes: ControlNode
      section: 15.7.21
      definition: A control node that accepts one of several alternative flows; it does not synchronize.
    ObjectFlow:
      display: ObjectFlow
      category: Activities
      specializes: ActivityEdge
      section: 15.7.22
      attributes:
      - {name: isMulticast, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isMultireceive, type: Boolean, multiplicity: "1", default: "false"}
      definition: An edge carrying object tokens that hold values; supports multicast, multireceive, token selection and transformation.
    ObjectNode:
      display: ObjectNode
      category: Activities
      specializes: [TypedElement, ActivityNode]
      abstract: true
      section: 15.7.23
      attributes:
      - {name: isControlType, type: Boolean, multiplicity: "1", default: "false"}
      - {name: ordering, type: ObjectNodeOrderingKind, multiplicity: "1", default: "FIFO"}
      definition: A node that holds tokens in the object flow, with optional selection, upper bound and required state.
    Variable:
      display: Variable
      category: Activities
      specializes: [ConnectableElement, MultiplicityElement]
      section: 15.7.25
      definition: A connectable element that stores values during an activity; an alternative to object flows for passing data.
    AcceptCallAction:
      display: AcceptCallAction
      category: Actions
      specializes: AcceptEventAction
      section: 16.14.1
      definition: An accept-event action that receives a synchronous call request and yields the return information a later reply action needs.
    AcceptEventAction:
      display: AcceptEventAction
      category: Actions
      specializes: Action
      section: 16.14.2
      attributes:
      - {name: isUnmarshall, type: Boolean, multiplicity: "1", default: "false"}
      definition: An action that waits for the occurrence of one or more specific events.
    Action:
      display: Action
      category: Actions
      specializes: ExecutableNode
      abstract: true
      section: 16.14.3
      attributes:
      - {name: isLocallyReentrant, type: Boolean, multiplicity: "1", default: "false"}
      definition: 'The fundamental unit of executable functionality: a transformation or processing step in the modeled system; usable in activities and interactions.'
    ActionInputPin:
      display: ActionInputPin
      category: Actions
      specializes: InputPin
      section: 16.14.4
      definition: An input pin that runs an action to determine the values it supplies to another action.
    AddStructuralFeatureValueAction:
      display: AddStructuralFeatureValueAction
      category: Actions
      specializes: WriteStructuralFeatureAction
      section: 16.14.5
      attributes:
      - {name: isReplaceAll, type: Boolean, multiplicity: "1", default: "false"}
      definition: Adds values to a structural feature.
    AddVariableValueAction:
      display: AddVariableValueAction
      category: Actions
      specializes: WriteVariableAction
      section: 16.14.6
      attributes:
      - {name: isReplaceAll, type: Boolean, multiplicity: "1", default: "false"}
      definition: Adds values to a variable.
    BroadcastSignalAction:
      display: BroadcastSignalAction
      category: Actions
      specializes: InvocationAction
      section: 16.14.7
      definition: Sends a signal instance to all potential target objects in the system; the sender continues at once and gets no reply.
    CallAction:
      display: CallAction
      category: Actions
      specializes: InvocationAction
      abstract: true
      section: 16.14.8
      attributes:
      - {name: isSynchronous, type: Boolean, multiplicity: "1", default: "true"}
      definition: An action that invokes a behavior with argument values and, if synchronous, receives reply values.
    CallBehaviorAction:
      display: CallBehaviorAction
      category: Actions
      specializes: CallAction
      section: 16.14.9
      definition: A call action that invokes a behavior directly.
    CallOperationAction:
      display: CallOperationAction
      category: Actions
      specializes: CallAction
      section: 16.14.10
      definition: A call action that sends an operation call request to a target object, which may invoke the associated behavior.
    Clause:
      display: Clause
      category: Actions
      specializes: Element
      section: 16.14.11
      definition: 'One branch of a conditional node: a test section and a body section executed only if the test is true.'
    ClearAssociationAction:
      display: ClearAssociationAction
      category: Actions
      specializes: Action
      section: 16.14.12
      definition: Destroys all links of an association in which a given object takes part.
    ClearStructuralFeatureAction:
      display: ClearStructuralFeatureAction
      category: Actions
      specializes: StructuralFeatureAction
      section: 16.14.13
      definition: Removes all values of a structural feature.
    ClearVariableAction:
      display: ClearVariableAction
      category: Actions
      specializes: VariableAction
      section: 16.14.14
      definition: Removes all values of a variable.
    ConditionalNode:
      display: ConditionalNode
      category: Actions
      specializes: StructuredActivityNode
      section: 16.14.15
      attributes:
      - {name: isAssured, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isDeterminate, type: Boolean, multiplicity: "1", default: "false"}
      definition: A structured node that chooses one of several alternative sets of executable nodes to run.
    CreateLinkAction:
      display: CreateLinkAction
      category: Actions
      specializes: WriteLinkAction
      section: 16.14.16
      definition: Creates links.
    CreateLinkObjectAction:
      display: CreateLinkObjectAction
      category: Actions
      specializes: CreateLinkAction
      section: 16.14.17
      definition: Creates link objects (instances of association classes).
    CreateObjectAction:
      display: CreateObjectAction
      category: Actions
      specializes: Action
      section: 16.14.18
      definition: Creates an instance of a given classifier.
    DestroyLinkAction:
      display: DestroyLinkAction
      category: Actions
      specializes: WriteLinkAction
      section: 16.14.19
      definition: Destroys links, including link objects.
    DestroyObjectAction:
      display: DestroyObjectAction
      category: Actions
      specializes: Action
      section: 16.14.20
      attributes:
      - {name: isDestroyLinks, type: Boolean, multiplicity: "1", default: "false"}
      - {name: isDestroyOwnedObjects, type: Boolean, multiplicity: "1", default: "false"}
      definition: Destroys objects.
    ExpansionNode:
      display: ExpansionNode
      category: Actions
      specializes: ObjectNode
      section: 16.14.22
      definition: An object node marking a collection input or output of an expansion region.
    ExpansionRegion:
      display: ExpansionRegion
      category: Actions
      specializes: StructuredActivityNode
      section: 16.14.23
      attributes:
      - {name: mode, type: ExpansionKind, multiplicity: "1", default: "iterative"}
      definition: A structured node whose content runs once per element of its input collections.
    InputPin:
      display: InputPin
      category: Actions
      specializes: Pin
      section: 16.14.24
      definition: A pin that holds input values for an action to consume.
    InvocationAction:
      display: InvocationAction
      category: Actions
      specializes: Action
      abstract: true
      section: 16.14.25
      definition: The base of actions that request behavior invocation.
    LinkAction:
      display: LinkAction
      category: Actions
      specializes: Action
      abstract: true
      section: 16.14.26
      definition: The base of actions that identify links to act on through link end data.
    LinkEndCreationData:
      display: LinkEndCreationData
      category: Actions
      specializes: LinkEndData
      section: 16.14.27
      attributes:
      - {name: isReplaceAll, type: Boolean, multiplicity: "1", default: "false"}
      definition: Link end data giving values for one end of a link to be created.
    LinkEndData:
      display: LinkEndData
      category: Actions
      specializes: Element
      section: 16.14.28
      definition: Identifies one end of a link to be read or written by a link action, through the end object and any qualifier values.
    LinkEndDestructionData:
      display: LinkEndDestructionData
      category: Actions
      specializes: LinkEndData
      section: 16.14.29
      attributes:
      - {name: isDestroyDuplicates, type: Boolean, multiplicity: "1", default: "false"}
      definition: Link end data giving values for one end of a link to be destroyed.
    LoopNode:
      display: LoopNode
      category: Actions
      specializes: StructuredActivityNode
      section: 16.14.30
      attributes:
      - {name: isTestedFirst, type: Boolean, multiplicity: "1", default: "false"}
      definition: A structured node for an iterative loop with setup, test and body sections.
    OpaqueAction:
      display: OpaqueAction
      category: Actions
      specializes: Action
      section: 16.14.31
      attributes:
      - {name: body, type: String, multiplicity: "0..*", ordered: true, unique: false}
      - {name: language, type: String, multiplicity: "0..*", ordered: true}
      definition: An action whose functionality is not specified in UML.
    OutputPin:
      display: OutputPin
      category: Actions
      specializes: Pin
      section: 16.14.32
      definition: A pin that holds output values an action produces.
    Pin:
      display: Pin
      category: Actions
      specializes: [ObjectNode, MultiplicityElement]
      abstract: true
      section: 16.14.33
      attributes:
      - {name: isControl, type: Boolean, multiplicity: "1", default: "false"}
      definition: An object node and multiplicity element that supplies input values to an action or takes its output values.
    QualifierValue:
      display: QualifierValue
      category: Actions
      specializes: Element
      section: 16.14.34
      definition: 'Part of link end data: the value for one qualifier of that end.'
    RaiseExceptionAction:
      display: RaiseExceptionAction
      category: Actions
      specializes: Action
      section: 16.14.35
      definition: Causes an exception; the input value becomes the exception object.
    ReadExtentAction:
      display: ReadExtentAction
      category: Actions
      specializes: Action
      section: 16.14.36
      definition: Retrieves the current instances of a classifier.
    ReadIsClassifiedObjectAction:
      display: ReadIsClassifiedObjectAction
      category: Actions
      specializes: Action
      section: 16.14.37
      attributes:
      - {name: isDirect, type: Boolean, multiplicity: "1", default: "false"}
      definition: Tests whether an object is classified by a given classifier.
    ReadLinkAction:
      display: ReadLinkAction
      category: Actions
      specializes: LinkAction
      section: 16.14.38
      definition: Navigates an association to retrieve the objects at one end.
    ReadLinkObjectEndAction:
      display: ReadLinkObjectEndAction
      category: Actions
      specializes: Action
      section: 16.14.39
      definition: Retrieves an end object from a link object.
    ReadLinkObjectEndQualifierAction:
      display: ReadLinkObjectEndQualifierAction
      category: Actions
      specializes: Action
      section: 16.14.40
      definition: Retrieves a qualifier end value from a link object.
    ReadSelfAction:
      display: ReadSelfAction
      category: Actions
      specializes: Action
      section: 16.14.41
      definition: Retrieves the context object of the behavior execution it runs in.
    ReadStructuralFeatureAction:
      display: ReadStructuralFeatureAction
      category: Actions
      specializes: StructuralFeatureAction
      section: 16.14.42
      definition: Retrieves the values of a structural feature.
    ReadVariableAction:
      display: ReadVariableAction
      category: Actions
      specializes: VariableAction
      section: 16.14.43
      definition: Retrieves the values of a variable.
    ReclassifyObjectAction:
      display: ReclassifyObjectAction
      category: Actions
      specializes: Action
      section: 16.14.44
      attributes:
      - {name: isReplaceAll, type: Boolean, multiplicity: "1", default: "false"}
      definition: Changes the classifiers that classify an object.
    ReduceAction:
      display: ReduceAction
      category: Actions
      specializes: Action
      section: 16.14.45
      attributes:
      - {name: isOrdered, type: Boolean, multiplicity: "1", default: "false"}
      definition: Reduces a collection to a single value by repeatedly combining elements with a reducer behavior.
    RemoveStructuralFeatureValueAction:
      display: RemoveStructuralFeatureValueAction
      category: Actions
      specializes: WriteStructuralFeatureAction
      section: 16.14.46
      attributes:
      - {name: isRemoveDuplicates, type: Boolean, multiplicity: "1", default: "false"}
      definition: Removes values from a structural feature.
    RemoveVariableValueAction:
      display: RemoveVariableValueAction
      category: Actions
      specializes: WriteVariableAction
      section: 16.14.47
      attributes:
      - {name: isRemoveDuplicates, type: Boolean, multiplicity: "1", default: "false"}
      definition: Removes values from a variable.
    ReplyAction:
      display: ReplyAction
      category: Actions
      specializes: Action
      section: 16.14.48
      definition: Returns reply values to the caller of an earlier accept-call action, completing the call.
    SendObjectAction:
      display: SendObjectAction
      category: Actions
      specializes: InvocationAction
      section: 16.14.49
      definition: Sends an input object to a target object as a request message; the sender continues at once.
    SendSignalAction:
      display: SendSignalAction
      category: Actions
      specializes: InvocationAction
      section: 16.14.50
      definition: Creates a signal instance from argument pins and sends it to a target object; the sender continues at once.
    SequenceNode:
      display: SequenceNode
      category: Actions
      specializes: StructuredActivityNode
      section: 16.14.51
      definition: A structured node that runs its executable nodes in order.
    StartClassifierBehaviorAction:
      display: StartClassifierBehaviorAction
      category: Actions
      specializes: Action
      section: 16.14.52
      definition: Starts the classifier behavior of the input object.
    StartObjectBehaviorAction:
      display: StartObjectBehaviorAction
      category: Actions
      specializes: CallAction
      section: 16.14.53
      definition: Starts the execution of a behavior, or of an object's classifier behavior, with optional arguments.
    StructuralFeatureAction:
      display: StructuralFeatureAction
      category: Actions
      specializes: Action
      abstract: true
      section: 16.14.54
      definition: The base of actions that operate on structural features.
    StructuredActivityNode:
      display: StructuredActivityNode
      category: Actions
      specializes: [Namespace, ActivityGroup, Action]
      section: 16.14.55
      attributes:
      - {name: mustIsolate, type: Boolean, multiplicity: "1", default: "false"}
      definition: An action that is also an activity group and whose behavior is given by the nodes and edges it owns.
    TestIdentityAction:
      display: TestIdentityAction
      category: Actions
      specializes: Action
      section: 16.14.56
      definition: Tests whether two values are the same object.
    UnmarshallAction:
      display: UnmarshallAction
      category: Actions
      specializes: Action
      section: 16.14.57
      definition: Retrieves the values of an object's structural features and puts them on output pins.
    ValuePin:
      display: ValuePin
      category: Actions
      specializes: InputPin
      section: 16.14.58
      definition: An input pin that gets its value from a value specification.
    ValueSpecificationAction:
      display: ValueSpecificationAction
      category: Actions
      specializes: Action
      section: 16.14.59
      definition: Evaluates a value specification and provides the result.
    VariableAction:
      display: VariableAction
      category: Actions
      specializes: Action
      abstract: true
      section: 16.14.60
      definition: The base of actions that operate on a given variable.
    WriteLinkAction:
      display: WriteLinkAction
      category: Actions
      specializes: LinkAction
      abstract: true
      section: 16.14.61
      definition: The base of link actions that create and destroy links.
    WriteStructuralFeatureAction:
      display: WriteStructuralFeatureAction
      category: Actions
      specializes: StructuralFeatureAction
      abstract: true
      section: 16.14.62
      definition: The base of structural feature actions that change values.
    WriteVariableAction:
      display: WriteVariableAction
      category: Actions
      specializes: VariableAction
      abstract: true
      section: 16.14.63
      definition: The base of variable actions that change values.
    ActionExecutionSpecification:
      display: ActionExecutionSpecification
      category: Interactions
      specializes: ExecutionSpecification
      section: 17.12.1
      definition: An execution specification that stands for the execution of an action.
    BehaviorExecutionSpecification:
      display: BehaviorExecutionSpecification
      category: Interactions
      specializes: ExecutionSpecification
      section: 17.12.2
      definition: An execution specification that stands for the execution of a behavior.
    CombinedFragment:
      display: CombinedFragment
      category: Interactions
      specializes: InteractionFragment
      section: 17.12.3
      attributes:
      - {name: interactionOperator, type: InteractionOperatorKind, multiplicity: "1", default: "seq"}
      definition: An expression over interaction fragments, made of an operator and operands, that describes many traces compactly.
    ConsiderIgnoreFragment:
      display: ConsiderIgnoreFragment
      category: Interactions
      specializes: CombinedFragment
      section: 17.12.4
      definition: A combined fragment for consider and ignore, which list the messages that are pertinent or can be dropped.
    Continuation:
      display: Continuation
      category: Interactions
      specializes: InteractionFragment
      section: 17.12.5
      attributes:
      - {name: setting, type: Boolean, multiplicity: "1", default: "true"}
      definition: A label at the start or end of an alternative operand that lets one branch continue into another fragment.
    DestructionOccurrenceSpecification:
      display: DestructionOccurrenceSpecification
      category: Interactions
      specializes: MessageOccurrenceSpecification
      section: 17.12.6
      definition: The destruction of the object a lifeline represents.
    ExecutionOccurrenceSpecification:
      display: ExecutionOccurrenceSpecification
      category: Interactions
      specializes: OccurrenceSpecification
      section: 17.12.7
      definition: A moment at which an action or behavior starts or finishes.
    ExecutionSpecification:
      display: ExecutionSpecification
      category: Interactions
      specializes: InteractionFragment
      abstract: true
      section: 17.12.8
      definition: The execution of a unit of behavior or action on a lifeline, bounded by a start and a finish occurrence.
    Gate:
      display: Gate
      category: Interactions
      specializes: MessageEnd
      section: 17.12.9
      definition: A message end that connects a message crossing the boundary of a fragment with the matching message inside it.
    GeneralOrdering:
      display: GeneralOrdering
      category: Interactions
      specializes: NamedElement
      section: 17.12.10
      definition: A binary ordering saying one occurrence must come before another in a valid trace; allows partial orders.
    Interaction:
      display: Interaction
      category: Interactions
      specializes: [InteractionFragment, Behavior]
      section: 17.12.11
      definition: A unit of behavior focused on the observable exchange of information between connectable elements.
    InteractionConstraint:
      display: InteractionConstraint
      category: Interactions
      specializes: Constraint
      section: 17.12.12
      definition: A Boolean expression that guards an operand of a combined fragment, with optional loop bounds.
    InteractionFragment:
      display: InteractionFragment
      category: Interactions
      specializes: NamedElement
      abstract: true
      section: 17.12.13
      definition: The most general unit of an interaction; each fragment is like a small interaction.
    InteractionOperand:
      display: InteractionOperand
      category: Interactions
      specializes: [InteractionFragment, Namespace]
      section: 17.12.14
      definition: One operand of the expression a combined fragment states, with an optional guard.
    InteractionUse:
      display: InteractionUse
      category: Interactions
      specializes: InteractionFragment
      section: 17.12.16
      definition: A reference to another interaction, standing for its contents at that place, with arguments and gates.
    Lifeline:
      display: Lifeline
      category: Interactions
      specializes: NamedElement
      section: 17.12.17
      definition: An individual participant in an interaction; always a single interacting entity.
    Message:
      display: Message
      category: Interactions
      specializes: NamedElement
      section: 17.12.18
      attributes:
      - {name: messageKind, type: MessageKind, multiplicity: "1", derived: true}
      - {name: messageSort, type: MessageSort, multiplicity: "1", default: "synchCall"}
      definition: A particular communication between lifelines of an interaction.
    MessageEnd:
      display: MessageEnd
      category: Interactions
      specializes: NamedElement
      abstract: true
      section: 17.12.19
      definition: What can occur at an end of a message.
    MessageOccurrenceSpecification:
      display: MessageOccurrenceSpecification
      category: Interactions
      specializes: [MessageEnd, OccurrenceSpecification]
      section: 17.12.21
      definition: 'The occurrence of a message event: sending or receiving a signal, or invoking or receiving an operation call.'
    OccurrenceSpecification:
      display: OccurrenceSpecification
      category: Interactions
      specializes: InteractionFragment
      section: 17.12.23
      definition: The basic semantic unit of interactions; sequences of occurrences give an interaction its meaning.
    PartDecomposition:
      display: PartDecomposition
      category: Interactions
      specializes: InteractionUse
      section: 17.12.24
      definition: The description of the internal interactions of one lifeline relative to an interaction.
    StateInvariant:
      display: StateInvariant
      category: Interactions
      specializes: InteractionFragment
      section: 17.12.25
      definition: A runtime constraint on participants, placed on a lifeline, such as attribute values or states.
    Actor:
      display: Actor
      category: UseCases
      specializes: BehavioredClassifier
      section: 18.2.1
      definition: A role played by a user or another system that interacts with the subject.
    Extend:
      display: Extend
      category: UseCases
      specializes: [NamedElement, DirectedRelationship]
      section: 18.2.2
      definition: A relationship from an extending use case to an extended use case saying how and when the extending behavior can be inserted into the extended behavior.
    ExtensionPoint:
      display: ExtensionPoint
      category: UseCases
      specializes: RedefinableElement
      section: 18.2.3
      definition: A point in a use case's behavior where an extending use case may add behavior.
    Include:
      display: Include
      category: UseCases
      specializes: [DirectedRelationship, NamedElement]
      section: 18.2.4
      definition: A relationship saying a use case contains the behavior of another use case.
    UseCase:
      display: UseCase
      category: UseCases
      specializes: BehavioredClassifier
      section: 18.2.5
      definition: A set of actions performed by the subject that yields an observable result of value to one or more actors or other stakeholders.
    Artifact:
      display: Artifact
      category: Deployments
      specializes: [Classifier, DeployedArtifact]
      section: 19.5.1
      attributes:
      - {name: fileName, type: String, multiplicity: "0..1"}
      definition: 'A physical piece of information used or produced by development or by deploying and running a system: a model file, source file, script, executable, database table or document.'
    CommunicationPath:
      display: CommunicationPath
      category: Deployments
      specializes: Association
      section: 19.5.2
      definition: An association between two deployment targets through which they exchange signals and messages.
    DeployedArtifact:
      display: DeployedArtifact
      category: Deployments
      specializes: NamedElement
      abstract: true
      section: 19.5.3
      definition: An artifact or artifact instance that has been deployed to a deployment target.
    Deployment:
      display: Deployment
      category: Deployments
      specializes: Dependency
      section: 19.5.4
      definition: The allocation of an artifact or artifact instance to a deployment target, optionally configured by a deployment specification.
    DeploymentSpecification:
      display: DeploymentSpecification
      category: Deployments
      specializes: Artifact
      section: 19.5.5
      attributes:
      - {name: deploymentLocation, type: String, multiplicity: "0..1"}
      - {name: executionLocation, type: String, multiplicity: "0..1"}
      definition: An artifact that holds the execution parameters of a component artifact deployed on a node.
    DeploymentTarget:
      display: DeploymentTarget
      category: Deployments
      specializes: NamedElement
      abstract: true
      section: 19.5.6
      definition: The location for a deployed artifact.
    Device:
      display: Device
      category: Deployments
      specializes: Node
      section: 19.5.7
      definition: A physical computational resource with processing capability on which artifacts may be deployed; may consist of other devices.
    ExecutionEnvironment:
      display: ExecutionEnvironment
      category: Deployments
      specializes: Node
      section: 19.5.8
      definition: A node that offers an execution environment for components deployed on it as executable artifacts.
    Manifestation:
      display: Manifestation
      category: Deployments
      specializes: Abstraction
      section: 19.5.9
      definition: The concrete physical rendering of one or more model elements by an artifact.
    Node:
      display: Node
      category: Deployments
      specializes: [Class, DeploymentTarget]
      section: 19.5.10
      definition: A computational resource on which artifacts may be deployed; nodes are joined by communication paths to form networks.
    InformationFlow:
      display: InformationFlow
      category: InformationFlows
      specializes: [DirectedRelationship, PackageableElement]
      section: 20.2.1
      definition: The circulation of information from sources to targets in a general way, without saying how it is conveyed or in what sequence; may be realized by connectors, messages or activity edges.
    InformationItem:
      display: InformationItem
      category: InformationFlows
      specializes: Classifier
      section: 20.2.2
      definition: An abstract kind of information that can flow, without detail; other classifiers may represent it.
  enumerations:
    VisibilityKind:
      category: Common Structure
      section: 7.8.24
      literals: [public, private, protected, package]
      definition: The four levels of visibility an element can have.
    AggregationKind:
      category: Classification
      section: 9.9.1
      literals: [none, shared, composite]
      definition: Whether a property is a plain association end, a shared aggregation (hollow diamond) or a composite aggregation (filled diamond).
    CallConcurrencyKind:
      category: Classification
      section: 9.9.3
      literals: [sequential, guarded, concurrent]
      definition: How concurrent calls to a behavioral feature are handled.
    ParameterDirectionKind:
      category: Classification
      section: 9.9.14
      literals: [in, inout, out, return]
      definition: The direction of a parameter.
    ParameterEffectKind:
      category: Classification
      section: 9.9.15
      literals: [create, read, update, delete]
      definition: What a behavior does to the values passed through a parameter.
    ConnectorKind:
      category: Structured Classifiers
      section: 11.8.12
      literals: [assembly, delegation]
      definition: Whether a connector is an assembly connector or a delegation connector.
    PseudostateKind:
      category: StateMachines
      section: 14.5.7
      literals: [initial, deepHistory, shallowHistory, join, fork, junction, choice, entryPoint, exitPoint, terminate]
      definition: The ten kinds of pseudostate.
    TransitionKind:
      category: StateMachines
      section: 14.5.12
      literals: [internal, local, external]
      definition: Whether a transition is internal, local or external (affects exit and entry of the source and target).
    ObjectNodeOrderingKind:
      category: Activities
      section: 15.7.24
      literals: [unordered, ordered, LIFO, FIFO]
      definition: The order in which an object node offers the tokens it holds.
    ExpansionKind:
      category: Actions
      section: 16.14.21
      literals: [parallel, iterative, stream]
      definition: How an expansion region runs its content over the elements of its input.
    InteractionOperatorKind:
      category: Interactions
      section: 17.12.15
      literals: [seq, alt, opt, break, par, strict, loop, critical, neg, assert, ignore, consider]
      definition: The operator of a combined fragment.
    MessageKind:
      category: Interactions
      section: 17.12.20
      literals: [complete, lost, found, unknown]
      definition: Whether both ends of a message are known, or it is lost, found or unknown.
    MessageSort:
      category: Interactions
      section: 17.12.22
      literals: [synchCall, asynchCall, asynchSignal, createMessage, deleteMessage, reply]
      definition: The kind of communication action that generated a message.
relationships:
  note: UML has no single source-to-target matrix. A relationship kind is a metaclass whose ends have types; `kinds` lists the relationships a modeler draws, `allowed` reads the metaclass names at each end, and `metamodel_associations` lists every association of the metamodel (ends written Owner.role:Type[multiplicity] with flags c composite, d derived, o ordered; ~role means the end is owned by the association). Only 60 of the 109 Actions associations are listed.
  kinds:
    Association:
      metaclass: Association
      specializes: [Relationship, Classifier]
      from: memberEnd:Property[2..*] (ends typed by endType)
      to: '-'
      notation: A solid line between classifiers (or one classifier and itself), or a diamond with a line per end (required for more than two ends); name, derived slash, read-direction arrow, end adornments.
      section: 11.5.3, 11.5.4, 11.8.1
      note: Binary unless n-ary. Only a binary association can have an aggregation end. Ends owned by a class or listed as navigableOwnedEnd are navigable.
    Aggregation (shared):
      metaclass: Property (aggregation = shared) on an end of a binary Association
      from: whole end
      to: part end
      notation: Hollow diamond on the line at the aggregate end, smaller than an association diamond.
      section: 11.5.3, 11.5.4, 9.9.1
      note: At most one end of an association has aggregation shared or composite.
    Composition (composite aggregation):
      metaclass: Property (aggregation = composite, isComposite derived)
      from: whole end (upper bound at most 1)
      to: part end
      notation: Filled diamond at the aggregate end.
      section: 11.5.3, 11.5.4, 9.9.17
      note: The composing end has upper bound at most 1 (Property::multiplicity_of_composite).
    Association class:
      metaclass: AssociationClass
      specializes: [Class, Association]
      from: '-'
      to: '-'
      notation: A class symbol joined to the association path (or its diamond) by a dashed line; one shared name.
      section: 11.5.3.2, 11.5.4, 11.8.2
      note: Cannot generalize an Association or a Class; attributes, member ends and opposite ends have distinct names.
    Link:
      metaclass: InstanceSpecification whose classifier is an Association
      specializes: InstanceSpecification
      from: '-'
      to: '-'
      notation: Association notation between instance specifications (names underlined when needed).
      section: 9.8.4, 9.9.9
      note: Navigation arrows, if shown, agree with the association.
    Generalization:
      metaclass: Generalization
      specializes: DirectedRelationship
      from: specific:Classifier[1] (owner)
      to: general:Classifier[1]
      notation: Solid line with a hollow triangle at the general classifier; separate-target or shared-target style.
      section: 9.9.7, 9.2.4, 9.7.4
      note: Hierarchy is directed and acyclic; parents are not final; a Generalization may belong to GeneralizationSets.
    Generalization set:
      metaclass: GeneralizationSet
      specializes: PackageableElement
      from: '-'
      to: '-'
      notation: 'Name on generalization lines, shared arrowhead, or a dashed line across arrows; {complete|incomplete, disjoint|overlapping}; power type after a colon.'
      section: 9.7.4, 9.9.8
    Dependency:
      metaclass: Dependency
      specializes: [DirectedRelationship, PackageableElement]
      from: client:NamedElement[1..*]
      to: supplier:NamedElement[1..*]
      notation: Dashed arrow from client (tail) to supplier (head), optional keyword and name; dot junction for sets.
      section: 7.8.4, 7.7.4
      note: Superclass of the dependency kinds below.
    Abstraction:
      metaclass: Abstraction
      specializes: Dependency
      from: client
      to: supplier (same concept, different abstraction level)
      notation: Dependency with <<abstraction>> or a standard stereotype <<derive>>, <<refine>>, <<trace>>; optional mapping expression.
      section: 7.8.1, 7.7.4, 22.3
    Realization:
      metaclass: Realization
      specializes: Abstraction
      from: client (implementation)
      to: supplier (specification)
      notation: Dashed line with a hollow triangular arrowhead at the realized element.
      section: 7.8.14, 7.7.4
    Substitution:
      metaclass: Substitution
      specializes: Realization
      from: substitutingClassifier:Classifier[1]
      to: contract:Classifier[1]
      notation: Dependency with <<substitute>>.
      section: 9.9.22, 9.2.4
    Usage:
      metaclass: Usage
      specializes: Dependency
      from: client
      to: supplier
      notation: Dependency with <<use>>; standard stereotypes <<call>>, <<create>>, <<instantiate>>, <<responsibility>>, <<send>> restrict it further.
      section: 7.8.23, 22.3
      note: A socket attached to a classifier is a Usage of an Interface.
    Interface realization:
      metaclass: InterfaceRealization
      specializes: Realization
      from: implementingClassifier:BehavioredClassifier[1]
      to: contract:Interface[1]
      notation: A ball (lollipop) attached to the realizing classifier, or a dashed line with a hollow triangle to the interface rectangle.
      section: 10.5.6, 10.4.4
    Component realization:
      metaclass: ComponentRealization
      specializes: Realization
      from: abstraction:Component[1] (owner)
      to: realizingClassifier:Classifier[1..*]
      notation: Dashed line with a hollow triangle (same as Realization).
      section: 11.8.7, 11.6.4
    Role binding:
      metaclass: Dependency owned by a CollaborationUse (roleBinding)
      specializes: Dependency
      from: client element in the context classifier
      to: supplier role in the collaboration
      notation: Dashed line from the occurrence ellipse to the client, labeled with the supplier's name; or ordinary dependency arrows with <<occurrence>>.
      section: 11.8.5, 11.7.4
      note: All clients in one classifier, all suppliers in one collaboration.
    Manifestation:
      metaclass: Manifestation
      specializes: Abstraction
      from: artifact:Artifact[1] (owner)
      to: utilizedElement:PackageableElement[1]
      notation: Dashed open arrow with <<manifest>>.
      section: 19.5.9, 19.3.4
    Deployment:
      metaclass: Deployment
      specializes: Dependency
      from: location:DeploymentTarget[1]
      to: deployedArtifact:DeployedArtifact[*]
      notation: Dashed arrow from artifact to target with <<deploy>>, or nesting inside the target.
      section: 19.5.4, 19.2.4
      note: Configured by DeploymentSpecifications, which need an ExecutionEnvironment target.
    Template binding:
      metaclass: TemplateBinding
      specializes: DirectedRelationship
      from: boundElement:TemplateableElement[1]
      to: signature:TemplateSignature[1]
      notation: Dashed arrow from bound element to template with <<bind>> and substitutions.
      section: 7.8.16, 7.3.4
    Element import:
      metaclass: ElementImport
      specializes: DirectedRelationship
      from: importingNamespace:Namespace[1]
      to: importedElement:PackageableElement[1]
      notation: Dashed open arrow with <<element import>> / <<element access>> (private), optional alias.
      section: 7.8.7, 7.4.4
    Package import:
      metaclass: PackageImport
      specializes: DirectedRelationship
      from: importingNamespace:Namespace[1]
      to: importedPackage:Package[1]
      notation: Dashed open arrow with <<import>> (public) or <<access>> (private).
      section: 7.8.11, 7.4.4
    Package merge:
      metaclass: PackageMerge
      specializes: DirectedRelationship
      from: receivingPackage:Package[1]
      to: mergedPackage:Package[1]
      notation: Dashed open arrow with <<merge>>.
      section: 12.4.6, 12.2.4
      note: No cycles; not with itself or a containing or contained package.
    Profile application:
      metaclass: ProfileApplication
      specializes: DirectedRelationship
      from: applyingPackage:Package[1]
      to: appliedProfile:Profile[1]
      notation: Dashed open arrow with <<apply>> or, if isStrict, <<strict>>.
      section: 12.4.8, 12.3.4
    Extension:
      metaclass: Extension
      specializes: Association
      from: metaclass:Class[1]
      to: ExtensionEnd typed by Stereotype[1]
      notation: Arrow from the stereotype to the metaclass with a filled triangle; {required} when isRequired.
      section: 12.4.1, 12.3.4
      note: Binary; the extension end is composite.
    Include:
      metaclass: Include
      specializes: [DirectedRelationship, NamedElement]
      from: includingCase:UseCase[1]
      to: addition:UseCase[1]
      notation: Dashed open arrow from the base use case with <<include>>.
      section: 18.2.4, 18.1.4
      note: A use case cannot include one that includes it.
    Extend:
      metaclass: Extend
      specializes: [DirectedRelationship, NamedElement]
      from: extension:UseCase[1] (extending)
      to: extendedCase:UseCase[1]; extensionLocation:ExtensionPoint[1..*]; condition:Constraint[0..1]
      notation: Dashed open arrow from the extending use case with <<extend>>; condition and extension points in an attached note.
      section: 18.2.2, 18.1.4
      note: Extension points belong to the extended use case.
    Protocol conformance:
      metaclass: ProtocolConformance
      specializes: DirectedRelationship
      from: specificMachine:ProtocolStateMachine[1]
      to: generalMachine:ProtocolStateMachine[1]
      notation: (no distinct notation read)
      section: 14.5.3
    Information flow:
      metaclass: InformationFlow
      specializes: [DirectedRelationship, PackageableElement]
      from: informationSource:NamedElement[1..*]
      to: informationTarget:NamedElement[1..*]; conveyed:Classifier[1..*]
      notation: Dependency-style dashed arrow with <<flow>>; item names near it.
      section: 20.2.1, 20.1.4
      note: Realized by relationships, connectors, activity edges or messages.
    Connector:
      metaclass: Connector (a Feature, not a Relationship)
      specializes: Feature
      from: end:ConnectorEnd[2..*]
      to: role:ConnectableElement[1] per end; type:Association[0..1]
      notation: Line like an association, optionally with ball-and-socket for simple ports; assembly or delegation.
      section: 11.8.10, 11.2.4
    Communication path:
      metaclass: CommunicationPath
      specializes: Association
      from: '-'
      to: '-'
      notation: Association notation between nodes.
      section: 19.5.2, 19.4.4
      note: Ends are deployment targets.
    Transition:
      metaclass: Transition
      specializes: [Namespace, RedefinableElement]
      from: source:Vertex[1]
      to: target:Vertex[1]
      notation: Directed arc labeled trigger [guard] / effect.
      section: 14.5.11, 14.2.4
    Activity edge (control flow, object flow):
      metaclass: ActivityEdge (ControlFlow, ObjectFlow)
      specializes: RedefinableElement
      from: source:ActivityNode[1]
      to: target:ActivityNode[1]
      notation: Open-arrowhead line; guard in brackets, weight in braces.
      section: 15.7.2, 15.7.9, 15.7.22, 15.2.4
      note: Control flows carry control; object flows carry object tokens; no object flow at executable nodes.
    Message:
      metaclass: Message
      specializes: NamedElement
      from: sendEvent:MessageEnd[0..1]
      to: receiveEvent:MessageEnd[0..1]
      notation: Arrows by messageSort; lost and found with circles.
      section: 17.12.18, 17.4.4
      note: Cannot cross combined fragment or operand boundaries.
    General ordering:
      metaclass: GeneralOrdering
      specializes: NamedElement
      from: before:OccurrenceSpecification[1]
      to: after:OccurrenceSpecification[1]
      notation: Dotted line with a mid-line arrowhead.
