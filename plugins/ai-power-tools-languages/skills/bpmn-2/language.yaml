# Which event types may occupy which positions.
event_placement:
  process:
    source: Table 10.93 (10.5.5, pp. 259 to 260), read from rendered images. An event type is listed under every position where the standard defines a shape for it.
    positions: [StartTopLevel, StartEventSubProcessInterrupting, StartEventSubProcessNonInterrupting, IntermediateCatching, BoundaryInterrupting, BoundaryNonInterrupting, IntermediateThrowing, End]
    matrix:
      None: [StartTopLevel, IntermediateThrowing, End]
      Message: [StartTopLevel, StartEventSubProcessInterrupting, StartEventSubProcessNonInterrupting, IntermediateCatching, BoundaryInterrupting, BoundaryNonInterrupting, IntermediateThrowing, End]
      Timer: [StartTopLevel, StartEventSubProcessInterrupting, StartEventSubProcessNonInterrupting, IntermediateCatching, BoundaryInterrupting, BoundaryNonInterrupting]
      Error: [StartEventSubProcessInterrupting, BoundaryInterrupting, End]
      Escalation: [StartEventSubProcessInterrupting, StartEventSubProcessNonInterrupting, BoundaryInterrupting, BoundaryNonInterrupting, IntermediateThrowing, End]
      Cancel: [BoundaryInterrupting, End]
      Compensation: [StartEventSubProcessInterrupting, BoundaryInterrupting, IntermediateThrowing, End]
      Conditional: [StartTopLevel, StartEventSubProcessInterrupting, StartEventSubProcessNonInterrupting, IntermediateCatching, BoundaryInterrupting, BoundaryNonInterrupting]
      Link: [IntermediateCatching, IntermediateThrowing]
      Signal: [StartTopLevel, StartEventSubProcessInterrupting, StartEventSubProcessNonInterrupting, IntermediateCatching, BoundaryInterrupting, BoundaryNonInterrupting, IntermediateThrowing, End]
      Terminate: [End]
      Multiple: [StartTopLevel, StartEventSubProcessInterrupting, StartEventSubProcessNonInterrupting, IntermediateCatching, BoundaryInterrupting, BoundaryNonInterrupting, IntermediateThrowing, End]
      Parallel Multiple: [StartTopLevel, StartEventSubProcessInterrupting, StartEventSubProcessNonInterrupting, IntermediateCatching, BoundaryInterrupting, BoundaryNonInterrupting]
    notes: 'Counts: start events at top level 7, in an event sub-process 9; intermediate 12 types, 10 in normal flow and 10 on the boundary; end 9. Error and Cancel occur only on a boundary and as end events; Cancel only with a Transaction. Compensation catches only at a boundary or an event sub-process start and throws in normal flow or at an end. Sub-process (embedded or called) starts are None only (Table 10.85). Table 12.22 lists a catching Escalation in normal flow, which this table does not allow; this table governs.'
  choreography:
    source: Tables 11.6 to 11.8 (11.6, pp. 339 to 344)
    positions: [Start, IntermediateNormalFlow, IntermediateBoundary, InEventBasedGateway, End]
    matrix:
      None: {Start: allowed, IntermediateNormalFlow: allowed, IntermediateBoundary: not-allowed, InEventBasedGateway: not-addressed, End: allowed}
      Message: {Start: not-allowed, IntermediateNormalFlow: not-allowed, IntermediateBoundary: 'allowed (choreography tasks only, on the receiver''s band)', InEventBasedGateway: not-allowed, End: not-allowed}
      Timer: {Start: allowed, IntermediateNormalFlow: allowed, IntermediateBoundary: allowed, InEventBasedGateway: allowed, End: not-addressed}
      Escalation: {Start: not-allowed, IntermediateNormalFlow: not-allowed, IntermediateBoundary: not-allowed, InEventBasedGateway: not-addressed, End: not-allowed}
      Error: {Start: not-allowed, IntermediateNormalFlow: not-addressed, IntermediateBoundary: not-allowed, InEventBasedGateway: not-addressed, End: not-allowed}
      Cancel: {Start: not-addressed, IntermediateNormalFlow: not-allowed (throw), IntermediateBoundary: 'allowed (catch, interrupting)', InEventBasedGateway: not-addressed, End: not-allowed}
      Compensation: {Start: not-allowed, IntermediateNormalFlow: not-allowed (throw), IntermediateBoundary: allowed (catch), InEventBasedGateway: not-addressed, End: not-allowed}
      Conditional: {Start: allowed, IntermediateNormalFlow: allowed, IntermediateBoundary: allowed, InEventBasedGateway: allowed, End: not-addressed}
      Link: {Start: not-addressed, IntermediateNormalFlow: allowed, IntermediateBoundary: not-addressed, InEventBasedGateway: not-addressed, End: not-addressed}
      Signal: {Start: allowed, IntermediateNormalFlow: allowed (catch only), IntermediateBoundary: allowed (catch; not on a band), InEventBasedGateway: allowed, End: not-allowed}
      Multiple: {Start: allowed (signals/timers only), IntermediateNormalFlow: allowed (valid catch events only), IntermediateBoundary: allowed (valid catch events only), InEventBasedGateway: not-addressed, End: not-allowed}
      Terminate: {Start: not-addressed, IntermediateNormalFlow: not-addressed, IntermediateBoundary: not-addressed, InEventBasedGateway: not-addressed, End: allowed (best with two participants)}
    notes: not-addressed means the table does not address that cell. A Multiple start event is allowed for signals and timers only; a Multiple intermediate event only for valid catch events.

# The standard gives no closed list of diagram types (7.2.1, 7.4); these four are the conformance wording (2.2.1, 2.5).
diagram_types:
  Process:
    defined_by: Clauses 2.2.1, 7.6.1 and 10.2 name the Process diagram. The standard gives no closed list of diagram types (7.2.1, 7.4); this name is from the conformance wording.
    conformance: [ProcessModeling, ProcessExecution (when the process is executable)]
    admits: [Task, ServiceTask, SendTask, ReceiveTask, UserTask, ManualTask, BusinessRuleTask, ScriptTask, SubProcess, AdHocSubProcess, Transaction, CallActivity, StartEvent, IntermediateCatchEvent, IntermediateThrowEvent, BoundaryEvent, EndEvent, ExclusiveGateway, InclusiveGateway, ParallelGateway, ComplexGateway, EventBasedGateway, SequenceFlow, DataObject, DataObjectReference, DataInput, DataOutput, DataStore, DataStoreReference, DataAssociation, Association, Group, TextAnnotation, Participant, Lane, LaneSet, Message]
    admits_note: Message flows appear only when the process is shown inside a collaboration. A private process lives inside one pool. Messages appear as decorators. Event sub-processes and compensation handlers are expressed by the variants EventSubProcess and CompensationActivity.
    excludes: [ChoreographyActivity, ChoreographyTask, SubChoreography, CallChoreography]
    root_of_plane: [Process, SubProcess, AdHocSubProcess, Transaction]
    home_concepts: [Events, Activities, Gateways, Data, Swimlanes, Artifacts]
    conventions: not-measured
  Collaboration:
    defined_by: Clauses 2.2.1, 7.6.2 and 9.2. A collaboration diagram shows two or more pools and the message flows between them.
    conformance: [ProcessModeling, ChoreographyModeling]
    admits: [Participant, MessageFlow, Process, ConversationNode, Conversation, SubConversation, CallConversation, ConversationLink, Choreography, ChoreographyTask, SubChoreography, CallChoreography, Association, Group, TextAnnotation, Message]
    admits_note: Everything a Process diagram admits may sit inside a white-box pool. A choreography may be drawn between pools. All combinations of black-box pools, white-box pools and choreography are allowed. At most one pool may be drawn without a boundary.
    excludes: [MessageFlow between two objects in one pool, SequenceFlow across a pool boundary]
    root_of_plane: [Collaboration]
    home_concepts: [Swimlanes, Connecting objects, Conversation, Choreography]
    conventions: not-measured
  Choreography:
    defined_by: Clauses 2.5, 11 and 11.8. A choreography describes the expected message exchange between participants with no central controller.
    conformance: [ChoreographyModeling]
    admits: [ChoreographyTask, SubChoreography, CallChoreography, StartEvent, IntermediateCatchEvent, IntermediateThrowEvent, BoundaryEvent, EndEvent, ExclusiveGateway, InclusiveGateway, ParallelGateway, ComplexGateway, EventBasedGateway, SequenceFlow, TextAnnotation, Group, Association, Message, Participant]
    admits_note: 'Events and gateways are constrained: events by Tables 11.6 to 11.8 (see event_placement.choreography), gateways by 11.7. Participants appear as bands on choreography activities. Inside a collaboration, pools are shown and the choreography sits between them. Message flows are hidden; the activity stands for the interaction. Messages appear as tethered decorators.'
    excludes: [DataObject, DataStore, Task, SubProcess, CallActivity, DataAssociation, Lane, LaneSet, pools of its own]
    root_of_plane: [Choreography, SubChoreography]
    home_concepts: [Choreography]
    conventions: not-measured
  Conversation:
    defined_by: Clause 9.5 and 7.2.1. The standard describes the Conversation diagram as a particular use of the Collaboration diagram.
    conformance: [ProcessModeling]
    admits: [Participant, Conversation, SubConversation, CallConversation, ConversationLink, MessageFlow, Process, Association, Group, TextAnnotation, Message]
    admits_note: Pools usually carry no process. A conversation may be expanded into its message flows, conversations and sub-conversations. Processes may appear inside pools and link to a conversation. Each link joins exactly one conversation node to a participant (or an activity or event).
    excludes: [Choreography between the pools (usually)]
    root_of_plane: [Collaboration]
    home_concepts: [Conversation, Swimlanes]
    conventions: not-measured

# 263 constraints: 96 from clauses 2 to 12 and 15 (first pass) and 167 from Clauses 13 and 14, the annexes, correlation, resources and services (second pass). Ids are BPMN-<CAT>-nnn; categories: CONN Connection and containment; EVT Events; ACT Activities and processes; DATA Data; GATE Gateways; CHOR Choreography; CONF Conformance, notation and interchange; INST Execution scope and process instances; LIFE Activity behavior and life cycle; SUBP Sub-process, ad-hoc and loop behavior; EXGW Gateway execution; EXEV Events at runtime; COMP Compensation and transaction; BPEL WS-BPEL mapping; CORR Correlation; RSRC Resources and roles; SERV Services; ANNX Annexes.
constraints:
- id: BPMN-CONN-001
  statement: A message flow must connect two separate pools (the pool boundary or objects inside); it must not connect two objects within the same pool.
  strength: must
  section: 9.4 p. 119; 10.3 p. 152; 10.5.2 to 10.5.4
  checkable: static
- id: BPMN-CONN-002
  statement: A sequence flow has exactly one source and one target, drawn from events, activities (process) or choreography activities (choreography), and gateways.
  strength: must
  section: 8.4.13 p. 95
  checkable: static
- id: BPMN-CONN-003
  statement: Sequence flows cannot cross a pool boundary; they may cross lane boundaries.
  strength: must
  section: 7.6.1 p. 40; 9.3 p. 111
  checkable: static
- id: BPMN-CONN-004
  statement: Within an expanded sub-process, objects cannot connect to objects outside it (except boundary-attached start/end events).
  strength: must
  section: 7.6.1 p. 40; 10.5.2; 10.5.3
  checkable: static
- id: BPMN-CONN-005
  statement: An artifact (association, group, text annotation) must not be the source or target of a sequence flow or a message flow.
  strength: must
  section: 8.4.1 pp. 64 to 65
  checkable: static
- id: BPMN-CONN-006
  statement: Pool, lane, data object, group and text annotation cannot have sequence flows; lane, gateway, data object, group and text annotation cannot have message flows.
  strength: must
  section: 7.6.1 to 7.6.2 pp. 41 to 42
  checkable: static
- id: BPMN-CONN-007
  statement: A message flow's source and target are pools/participants, activities or events only.
  strength: must
  section: 9.4 p. 122; Table 9.8
  checkable: static
- id: BPMN-CONN-008
  statement: A black-box pool has no sequence flows; message flows attach to its boundary.
  strength: must
  section: 9.3 p. 111
  checkable: static
