  not_specified: [NodeDescriptor, FreeFormDescriptor, FreeFormValue, MotivationElement]

layout:
  basis: Our conventions, not this standard's. Sizes and spacing come from the shared layout standard;
    this block says only which size class each concept takes and how each diagram type is arranged.
  element_types:
    Agent: box
    Capability: box
    Category: box
    CategoryValue: box
    Consumer: box
    MessageType: box
    Participant: box
    Provider: box
    ServiceInterface: box
    Collaboration: large-box
    CollaborationUse: large-box
    ServiceContract: large-box
    ServicesArchitecture: large-box
    Catalog: container
    Milestone: note
    Port: attached-item
    Request: attached-item
    Service: attached-item
  no_element_type:
    drawn_as_text:
      reason: Shown as an attribute line inside a message type box, so there is no symbol to size.
      concepts:
      - Attachment
      - Property
    drawn_as_line:
      reason: The relationship concepts are lines, so there is no symbol to size.
      concepts:
      - Expose
      - MotivationRealization
      - ServiceChannel
      - Categorization
    not_drawn:
      reason: The standard gives these no drawing of their own.
      concepts:
      - NodeDescriptor
      - FreeFormDescriptor
      - FreeFormValue
      - MotivationElement
  exceptions: {}
  diagram_types:
    Services Architecture:
      arrangement: graph
      title: frame-header
      route: straight
      channels:
        claimed:
          line_style: Solid against dashed separates a service channel from a role binding or a use (6.4.15, 6.2.1).
        free:
        - fill
        - border
        - border_width
        - line_color
        - font_color
        - opacity
        - icon
