    DataOutputAssociation: {display: Data Output Association, category: Data, directed: true, specializes: DataAssociation, section: 10.4.1}
    ConversationLink: {display: Conversation Link, category: Connecting objects, directed: false, section: 9.5.6}
  variants:
    PrivateProcess: {of: Process, when: processType = Private, section: 10.2.1.1, note: Internal to one organization. Executable or not.}
    PublicProcess: {of: Process, when: processType = Public, section: 10.2.1.2, note: Shows only activities that communicate with other participants and their order. Formerly called an abstract process. May not be executable.}
    ExecutableProcess: {of: Process, when: isExecutable = true, section: 10.2.1.1; 13, note: Modeled to be executed under the Clause 13 semantics. Rules with applies_when executable apply.}
    WhiteBoxPool: {of: Participant, when: processRef present, section: '9.3', note: A pool that shows its process.}
    BlackBoxPool: {of: Participant, when: processRef absent, section: '9.3', note: 'An empty pool; has no sequence flows, message flows attach to its boundary.'}
    EventSubProcess: {of: SubProcess, when: triggeredByEvent = true, section: 10.3.5, note: Outside normal flow; started by its own single start event while its parent runs; dotted border.}
    CompensationActivity: {of: Activity, when: isForCompensation = true, section: '10.3, 13.5.5', note: An activity that is a compensation handler for another activity.}
    AbstractTask: {of: Task, when: 'the plain Task, with no more specific subclass', section: 10.3.3, note: Formerly the 'None task'.}
    InstantiatingReceiveTask: {of: ReceiveTask, when: instantiate = true, section: 10.3.3.1, note: Starts a process; has no incoming sequence flow.}
    InstantiatingEventBasedGateway: {of: EventBasedGateway, when: instantiate = true, section: 10.6.6, note: Starts a process; exclusive or parallel by eventGatewayType.}
    NoneEvent: {of: Event, when: no event definition, section: 10.5.5, note: Has no trigger or result.}
    TypedEvent: {of: Event, when: exactly one event definition of a named type, section: 10.5.5, note: 'Written Class[Type] in this file, for example StartEvent[Message], EndEvent[Terminate].'}
    MultipleEvent: {of: Event, when: more than one event definition and parallelMultiple = false, section: 10.5.5, note: Any one trigger starts or continues the flow.}
    ParallelMultipleEvent: {of: CatchEvent, when: more than one event definition and parallelMultiple = true, section: 10.5.5, note: All the triggers are needed.}
    InterruptingBoundaryEvent: {of: BoundaryEvent, when: cancelActivity = true, section: 10.5.4, note: Cancels the activity it is attached to.}
    NonInterruptingBoundaryEvent: {of: BoundaryEvent, when: cancelActivity = false, section: 10.5.4, note: The activity keeps running; flow from the event runs in parallel.}
    InterruptingStartEvent: {of: StartEvent, when: isInterrupting = true, section: 10.5.2, note: Event sub-process starts only. Error starts are always interrupting.}
    NonInterruptingStartEvent: {of: StartEvent, when: isInterrupting = false, section: 10.5.2, note: Event sub-process starts only.}
    ConditionalSequenceFlow: {of: SequenceFlow, when: conditionExpression present, section: 8.4.13, note: Mini-diamond when leaving an activity; none when leaving a gateway.}
    DefaultSequenceFlow: {of: SequenceFlow, when: named as default by its source gateway or activity, section: 8.4.13, note: Slash marker; taken only if no other condition is true.}
    ExceptionFlow: {of: SequenceFlow, when: source is a BoundaryEvent, section: 7.3.2, note: Informal name in the notation overview; not a schema type.}
  enumerations:
    AdHocOrdering: [Parallel, Sequential]
    AssociationDirection: [None, One, Both]
    ChoreographyLoopType: [None, Standard, MultiInstanceSequential, MultiInstanceParallel]
    EventBasedGatewayType: [Exclusive, Parallel]
    GatewayDirection: [Unspecified, Converging, Diverging, Mixed]
    Implementation: ['##unspecified', '##WebService']
    ItemKind: [Information, Physical]
    MultiInstanceFlowCondition: [None, One, All, Complex]
    ProcessType: [None, Public, Private]
    RelationshipDirection: [None, Forward, Backward, Both]
    TransactionMethod: ['##Compensate', '##Image', '##Store']

relationships:
  note: BPMN's relationships are the connecting-object classes in concepts.relationships plus the reference attributes listed under references. The two connection tables (Tables 7.3 and 7.4) are data here; their prose refinements are endpoint_requirements and the constraints.
  connection_tables:
    SequenceFlow:
      source: Table 7.3, 7.6.1 (pp. 40 to 41)
      applies_in: [Process, Choreography]
      orientation: Outer key is the object at the From end (source); the list holds the objects it may reach at the To end (target). A source or target absent from the table cannot have a sequence flow.
      authority: Permissive upper bound at the table's coarse level of detail. The prose refinements (relationships.endpoint_requirements and the constraints) narrow it for boundary events, event sub-processes, link events and gateway kinds.
      kinds:
        StartEvent:
          covers: [StartEvent]
        Task:
          covers: [Task]
          note: Includes every Task subclass.
        SubProcess:
          covers: [SubProcess, CallActivity]
          note: Includes ad-hoc sub-process, transaction and event sub-process by specialization; Call Activity is read as an Activity of this row (our reading).
        Gateway:
          covers: [Gateway]
          note: All five gateway kinds.
        IntermediateEvent:
          covers: [IntermediateCatchEvent, IntermediateThrowEvent, BoundaryEvent]
          note: A boundary event may only be a source (see endpoint_requirements).
        EndEvent:
          covers: [EndEvent]
      in_choreography:
        Task: [ChoreographyTask]
        SubProcess: [SubChoreography, CallChoreography]
      cells:
        StartEvent: [Task, SubProcess, Gateway, IntermediateEvent, EndEvent]
        Task: [Task, SubProcess, Gateway, IntermediateEvent, EndEvent]
        SubProcess: [Task, SubProcess, Gateway, IntermediateEvent, EndEvent]
        Gateway: [Task, SubProcess, Gateway, IntermediateEvent, EndEvent]
        IntermediateEvent: [Task, SubProcess, Gateway, IntermediateEvent, EndEvent]
        EndEvent: []
      never_source: [EndEvent]
      never_target: [StartEvent]
      no_sequence_flows: [Participant, Lane, DataObject, Group, TextAnnotation]
    MessageFlow:
      source: Table 7.4, 7.6.2 (p. 42)
      applies_in: [Collaboration]
      orientation: Outer key is the object at the From end (source); the list holds the objects it may reach at the To end (target).
      authority: Permissive upper bound. A message flow may not join two objects in the same pool. The marks in the printed table's first column render with a different glyph; the prose agrees that a start event may be a target (10.5.2), so every mark is read as may-connect.
      kinds:
        MessageStartEvent:
          covers: [StartEvent]
          where: exactly one Message event definition
        Pool:
          covers: [Participant]
          note: A black-box pool is allowed; the flow attaches to its boundary.
        Task:
          covers: [Task]
        SubProcess:
          covers: [SubProcess, CallActivity]
        CatchingMessageIntermediateEvent:
          covers: [IntermediateCatchEvent, BoundaryEvent]
          where: Message event definition (a boundary event is a catching event)
        ThrowingMessageIntermediateEvent:
          covers: [IntermediateThrowEvent]
          where: Message event definition
        MessageEndEvent:
          covers: [EndEvent]
          where: Message event definition
      cells:
        MessageStartEvent: []
        Pool: [MessageStartEvent, Pool, Task, SubProcess, CatchingMessageIntermediateEvent]
        Task: [MessageStartEvent, Pool, Task, SubProcess, CatchingMessageIntermediateEvent]
        SubProcess: [MessageStartEvent, Pool, Task, SubProcess, CatchingMessageIntermediateEvent]
        ThrowingMessageIntermediateEvent: [MessageStartEvent, Pool, Task, SubProcess, CatchingMessageIntermediateEvent]
        MessageEndEvent: [MessageStartEvent, Pool, Task, SubProcess, CatchingMessageIntermediateEvent]
      never_source: [MessageStartEvent, CatchingMessageIntermediateEvent]
      never_target: [MessageEndEvent, ThrowingMessageIntermediateEvent]
      no_message_flows: [Lane, Gateway, DataObject, Group, TextAnnotation]
      interaction_node_types: [Participant, Activity, Event]
  endpoint_requirements:
    orientation: Per element kind, what the prose of 10.3 and 10.5 requires of incoming and outgoing flows. These narrow the coarse connection tables; each cites the constraint that states it.
    crossing: {pool_boundary: Sequence flows cannot cross it; message flows can (BPMN-CONN-003)., expanded_sub_process_boundary: 'Objects inside cannot connect to objects outside, except the boundary-attached start and end events (BPMN-CONN-004).'}
    by_element:
      StartEvent:
        sequence_in: 'forbidden (exception: a start event attached to the boundary of an expanded sub-process may take the parent flow)'
        sequence_out: required, one or more, none with a condition
        message_in: allowed, each incoming flow is one trigger
        message_out: forbidden
        rules: [BPMN-EVT-002, BPMN-EVT-003]
      EndEvent:
        sequence_in: required, many allowed
        sequence_out: forbidden (same exception)
        message_in: forbidden
        message_out: allowed; the result must be Message, or Multiple when there is more than one flow
        rules: [BPMN-EVT-004, BPMN-EVT-005]
      IntermediateEvent (normal flow):
        sequence_in: required
        sequence_out: required (a Link source event needs none)
        message_in: 'message events: at most one incoming or one outgoing, not both'
        message_out: same
        rules: [BPMN-EVT-007, BPMN-EVT-012, BPMN-EVT-013]
      BoundaryEvent:
        sequence_in: forbidden
        sequence_out: 'required (a Compensation boundary event: forbidden, an association is allowed)'
        message_in: message boundary events as for intermediate events
        message_out: same
        rules: [BPMN-EVT-008]
      Activity:
        sequence_in: allowed, many (alternative or parallel); none means instantiated with the process, except compensation activities and event sub-processes
        sequence_out: allowed, many (parallel paths); none means the path ends
        message_in: zero or more
        message_out: zero or more
        rules: [BPMN-ACT-003]
      EventSubProcess:
        sequence_in: forbidden
        sequence_out: forbidden
        message_in: not stated
        message_out: not stated
        rules: [BPMN-EVT-024]
      Gateway:
        sequence_in: zero, one or many; must merge or split
        sequence_out: zero, one or many
        message_in: forbidden
        message_out: forbidden
        rules: [BPMN-GATE-001, BPMN-CONN-006]
      Artifact (association, group, text annotation):
        sequence_in: forbidden
        sequence_out: forbidden
        message_in: forbidden
        message_out: forbidden
        rules: [BPMN-CONN-005]
