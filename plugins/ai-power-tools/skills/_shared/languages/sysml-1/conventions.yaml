# GENERATED by tools/gen_conventions.py. Do not edit: CI and the plugin build fail on any
# difference. Sizes, spacing, and vocabulary come from the layout standard on the language
# shelf. EA's names come from `layout_map` in this folder's ea.yaml. To change a value,
# change the source and run `python tools/gen_conventions.py`.

technology: SysML1.4
display_name: SysML 1.4
extends: UML
stereotype_prefix: ''
notes: |
  EA's SysML1.4 MDG declares nine diagram types. Only two are bound here, and the other seven are left out on purpose. Each is classified below as (b) an ordinary graph where EA's own layout is acceptable, or (c) EA-semantic, where the diagram type dictates the arrangement and we should not be placing coordinates at all. A caller resolving an unbound type gets no binding and should fall back to a plain graph layout: EXCEPT for the two classified (c), where it must not. Handing a sequence diagram or a state machine to a graph layout places the participants and ignores the order, which is worse than not drawing it because it looks like the diagram it is not. For those two, say the type is classified and not producible, and stop.

  BOUND. BlockDefinition and Requirement are hierarchies: a generalization or composition tree, and a requirement containment tree. They are composed as layered bands with one band per level of the hierarchy, following the ArchiMate Motivation precedent of a tree composed as bands. This is an approximation and the binding says so: a parent is not centered over its children, and each band carries a label strip that a hand-drawn tree does not have, so level-to-level distance runs larger than the corpus shows. Band container rectangles are geometry the caller may leave unplaced.

  UNBOUND, GRAPH (b). InternalBlock and UseCase are free graphs. Parametric is constraint blocks nested two deep with binding connectors, so the arrows are the point and a nested grid would contradict it. Package mixes a grid of package tabs, nested containers with dependencies, and a generalization tree across its three corpus rows. Activity is lanes in 2 of its 6 corpus rows (allocation partitions) and fork-join or free graph in the other 4. No single grammar represents every row of any of these five types, and the schema requires a grammar, so recording one would be a lie stored as data.

  UNBOUND, EA-SEMANTIC (c). Sequence and StateMachine. A sequence diagram is lifeline order and message order, and a state machine is transition topology with composite states and orthogonal regions that EA owns as containment. Neither is coordinates we compute. Each needs a separate design, and no grammar is invented for them here.
diagram_types:
  BlockDefinition:
    base: Logical
    grammar: layered-bands
    title: frame-header
    sizing:
      default:
        w: 100
        h: 70
    spacing:
      item_gap_x: 80
      item_gap_y: 50
      item_gap_flow: 60
      lane_gap: 0
      min_lane_thickness: 120
      band_gap: 30
      origin_left: 40
      origin_top: -40
      band_pad_x: 12
      band_pad_y: 12
      lane_pad: 12
      grid_pad: 12
      label_height: 28
    routing:
      default: OrthogonalSquare
    channels:
      fill: null
      claimed:
        position: Hierarchy level. Which band a block sits in says how deep in the generalization or composition
          tree it is.
        line_style: Relationship kind. Dashed lines are dependencies (import, verify), so a second variable
          cannot use dash pattern.
      free:
      - fill
      - border
      - border_width
      - line_color
      - font_color
      - opacity
      - icon
  Requirement:
    base: Custom
    grammar: layered-bands
    title: frame-header
    sizing:
      default:
        w: 100
        h: 70
    spacing:
      item_gap_x: 80
      item_gap_y: 50
      item_gap_flow: 60
      lane_gap: 0
      min_lane_thickness: 120
      band_gap: 30
      origin_left: 40
      origin_top: -40
      band_pad_x: 12
      band_pad_y: 12
      lane_pad: 12
      grid_pad: 12
      label_height: 28
    routing:
      default: OrthogonalSquare
    channels:
      fill: 'Requirement kind. Treated as claimed: recoloring a diagram whose fill already encodes kind
        breaks it, while leaving a channel unused costs nothing.'
      claimed:
        position: Decomposition level. Which band a requirement sits in says how deep in the containment
          tree it is.
        line_style: Relationship kind. Dashed lines are deriveReqt dependencies.
      free:
      - border
      - border_width
      - line_color
      - font_color
      - opacity
      - icon
