  section: 13.2 (p. 426)
  checkable: runtime
  applies_when: executable
- id: BPMN-INST-014
  statement: For an instance to complete, all tokens must reach a node without outgoing Sequence Flows. A model where some token cannot reach one (dead end, trapping loop) can never complete.
  strength: must
  section: 13.2 (p. 426)
  checkable: partial
  applies_when: executable
- id: BPMN-INST-015
  statement: A token reaching an End Event triggers that event type's behavior (message sent, signal sent). A token reaching a Terminate End Event terminates the whole Process abnormally; 13.5.6 adds that other instances are unaffected.
  strength: must
  section: 13.2; 13.5.6 (pp. 426; 443)
  checkable: runtime
  applies_when: executable
- id: BPMN-INST-016
  statement: 'Process-level end: the instance completes iff all start nodes were visited (every Start Event triggered; for every starting Event-Based Gateway one of its events triggered) and no token remains. This conflicts with the alternative-start rule BPMN-INST-011, so this file treats it as guidance.'
  strength: should
  section: 13.5.6 (p. 443)
  checkable: runtime
  applies_when: executable
- id: BPMN-LIFE-001
  statement: 'An Activity with several incoming Sequence Flows is in uncontrolled flow: each arriving token enables it independently, as if an implied Exclusive Gateway sat in front. If tokens need to be controlled, non-exclusive Gateways should be modeled explicitly before the Activity.'
  strength: should
  section: 13.3.1 (p. 427)
  checkable: static
  applies_when: executable
- id: BPMN-LIFE-002
  statement: 'An Activity with no incoming Sequence Flow is instantiated when its containing Process or Sub-Process is instantiated (exception: Compensation Activities).'
  strength: note
  section: 13.3.1 (p. 427)
  checkable: static
  applies_when: executable
- id: BPMN-LIFE-003
  statement: 'When an Activity reaches Completed, every outgoing Sequence Flow gets a token: several unconditional flows act as a parallel split; several conditional flows as an inclusive split; a mix acts as both combined.'
  strength: must
  section: 13.3.1; 13.3.2 (pp. 427; 429)
  checkable: runtime
  applies_when: executable
- id: BPMN-LIFE-004
  statement: An Activity with no outgoing Sequence Flow ends without producing tokens, and the container's termination semantics then apply.
  strength: note
  section: 13.3.1 (p. 427)
  checkable: static
  applies_when: executable
- id: BPMN-LIFE-005
  statement: Token movement along a flow has no timing constraint. isImmediate=false (or unset, read as false) lets other activities run while a token is in transit; true forbids it. (isImmediate is non-operational, BPMN-INST-002.)
  strength: note
  section: 13.3.1 (p. 427)
  checkable: none
  applies_when: executable
- id: BPMN-LIFE-006
  statement: 'Ready: an Activity is ready when startQuantity tokens are available (startQuantity is 1 or more).'
  strength: must
  section: 13.3.2 (p. 429)
  checkable: partial
  applies_when: executable
- id: BPMN-LIFE-007
  statement: 'Ready to Active: when some data InputSet becomes available. InputSets are evaluated in list order, the first available one is used and later ones are not evaluated; the Activity waits until one is available. InputSet order is therefore significant.'
  strength: must
  section: 13.3.2 (p. 429)
  checkable: partial
  applies_when: executable
- id: BPMN-LIFE-008
  statement: An InputSet is available if each of its required data inputs is available; a data input is required unless it is optional in that InputSet.
  strength: must
  section: 13.3.2 (p. 429)
  checkable: runtime
  applies_when: executable
- id: BPMN-LIFE-009
  statement: 'A Ready or Active Activity can be Withdrawn in a race: for Tasks after an Event-Based Exclusive Gateway, the first Task or Event to complete withdraws the others.'
  strength: must
  section: 13.3.2 (p. 429)
  checkable: runtime
  applies_when: executable
- id: BPMN-LIFE-010
  statement: An Active Activity that fails moves to Failed; a fault in its environment moves it to Terminated; normal end of work moves it to Completing.
  strength: must
  section: 13.3.2 (p. 429)
  checkable: runtime
  applies_when: executable
- id: BPMN-LIFE-011
  statement: Completing is an intermediate state that waits for non-interrupting event handlers; no new non-interrupting handler may be created while Completing (a handler may be created only while Active). 13.3.2 words this as 'should' and 13.5.4 states it flatly; this file takes the flat form.
  strength: must
  section: 13.3.2 (p. 429)
  checkable: runtime
  applies_when: executable
- id: BPMN-LIFE-012
  statement: An interrupting event or interrupting Event Sub-Process moves the Activity to Failing (error) or Terminating (any other event). Nested activities not yet in a final state, and non-interrupting Event Sub-Processes, are terminated; the Activity's data context is kept while an interrupting Event Sub-Process runs and released when it reaches a final state.
  strength: must
  section: 13.3.2 (p. 429)
  checkable: runtime
  applies_when: executable
- id: BPMN-LIFE-013
  statement: 'Completed: after all completion dependencies are met, completionQuantity tokens go onto the outgoing flows (an implicit Parallel Gateway when several) and a data OutputSet is selected.'
  strength: must
  section: 13.3.2 (p. 429)
  checkable: partial
  applies_when: executable
- id: BPMN-LIFE-014
  statement: 'OutputSet selection: OutputSets are checked in list order; one is available if all its required data outputs are available; the first available is used and its output Data Associations push data into the context. If none is available a runtime exception is thrown. If an IORule exists, the chosen OutputSet together with the InputSet used must satisfy it, else a runtime exception. OutputSet order is significant.'
  strength: must
  section: 13.3.2 (p. 429)
  checkable: partial
  applies_when: executable
- id: BPMN-LIFE-015
  statement: Only a Completed Activity can be compensated; it still ends Completed when no compensation is triggered or no handler exists. If a handler is invoked it goes Compensating, then Compensated (success), Failed (exception) or Terminated (termination).
  strength: must
  section: 13.3.2 (p. 430)
  checkable: runtime
  applies_when: executable
- id: BPMN-LIFE-016
  statement: 'Activity life cycle state machine (Figure 13.2): the states and transitions are in references/execution.md.'
  strength: note
  section: 13.3.2 (p. 428)
  checkable: none
  applies_when: executable
- id: BPMN-LIFE-017
  statement: 'Service Task: on activation the operation''s in-message is filled from the Task''s data input and the operation is invoked; on completion the Task''s data output is filled from the out-message. A fault returned by the service is treated as an interrupting error and the Activity fails.'
  strength: must
  section: 13.3.3 (p. 430)
  checkable: runtime
  applies_when: executable
- id: BPMN-LIFE-018
  statement: 'Send Task: on activation the message is filled from the data input, sent, and the Task completes.'
  strength: must
  section: 13.3.3 (p. 430)
  checkable: runtime
  applies_when: executable
- id: BPMN-LIFE-019
  statement: 'Receive Task: waits for its message, fills the data output from it, completes. With key-based correlation only one receive per CorrelationKey can be active (the message matches at most one instance); with predicate-based correlation the message may go to several Receive Tasks. With instantiate=true it may start an instance.'
  strength: must
  section: 13.3.3 (p. 430)
  checkable: runtime
  applies_when: executable
- id: BPMN-LIFE-020
  statement: 'User Task: on activation it is distributed to the assigned person or group and completes when the work is done.'
  strength: must
  section: 13.3.3 (p. 430)
  checkable: runtime
  applies_when: executable
- id: BPMN-LIFE-021
  statement: 'Manual Task and Abstract Task are conceptual only: a Manual Task is distributed to people but never executed by an IT system; an Abstract Task completes immediately on activation. Both are non-operational (BPMN-INST-002).'
  strength: note
  section: 13.3.3 (p. 430)
  checkable: static
  applies_when: executable
- id: BPMN-LIFE-022
  statement: 'Business Rule Task: on activation the business rule is called, and the Task completes when it returns. Script Task: on activation the script is invoked, and the Task completes when it returns.'
  strength: must
  section: 13.3.3 (p. 430)
  checkable: runtime
  applies_when: executable
- id: BPMN-LIFE-023
  statement: An executable Service, Send or Receive Task has to say which operation or message it uses (operationRef, messageRef); the standard does not require this, so an executable model without them cannot run on a service engine.
  strength: should
  section: 13.3.3 with 10.3.3.1 (pp. 430; 157 to 160)
  checkable: static
  applies_when: executable
  basis: inferred
- id: BPMN-SUBP-001
  statement: A Sub-Process is instantiated when a Sequence Flow token reaches it. It has either one unique empty Start Event (which gets the token) or no Start Event, in which case all Activities and Gateways without incoming Sequence Flows get a token.
  strength: must
  section: 13.3.4 (p. 430)
  checkable: static
  applies_when: executable
- id: BPMN-SUBP-002
  statement: A Sub-Process must not have any non-empty Start Events.
  strength: must
  section: 13.3.4 (p. 430)
  checkable: static
  applies_when: executable
- id: BPMN-SUBP-003
  statement: If a Sub-Process has no incoming flow but Start Events that are targets of flows from outside it, it is instantiated when one of those Start Events receives a token; several such Start Events are alternatives and each arrival creates a new instance.
  strength: note
  section: 13.3.4 (p. 431)
  checkable: static
  applies_when: executable
- id: BPMN-SUBP-004
  statement: A Sub-Process instance completes when no tokens remain in it and none of its Activities is active.
  strength: must
  section: 13.3.4 (p. 431)
  checkable: runtime
  applies_when: executable
- id: BPMN-SUBP-005
  statement: In a Sub-Process, a Terminate End Event terminates it abnormally (only the affected instance when multi-instance); a Cancel End Event terminates it abnormally and aborts the Transaction, with control leaving through a Cancel boundary event; other end events perform their type behavior.
  strength: must
  section: 13.3.4; 13.5.6 (pp. 431; 443)
  checkable: runtime
  applies_when: executable
- id: BPMN-SUBP-006
  statement: 'Sub-process-level end: the instance completes iff all its start nodes were visited and no token remains.'
  strength: must
  section: 13.5.6 (p. 443)
  checkable: runtime
  applies_when: executable
- id: BPMN-SUBP-007
  statement: A Call Activity has the same instantiation and termination semantics as a Sub-Process. The called global Process may also have non-empty Start Events; these are alternatives to its empty Start Event and are ignored when it is called from another Process.
  strength: must
  section: 13.3.4 (p. 431)
  checkable: partial
  applies_when: executable
- id: BPMN-SUBP-008
  statement: A called global Process should therefore be callable through an empty Start Event or start-less activities; a process with only non-empty Start Events cannot be entered by a Call Activity.
  strength: should
  section: 13.3.4 with 10.3.6 (p. 431)
  checkable: static
  applies_when: executable
  basis: inferred
- id: BPMN-SUBP-009
  statement: An Ad-Hoc Sub-Process or Process contains only Activities, Sequence Flows, Gateways and Intermediate Events, and may also contain Data Objects and Data Associations; it has no Start or End Events.
  strength: must
  section: 13.3.5 (p. 431)
  checkable: static
  applies_when: executable
- id: BPMN-SUBP-010
  statement: Activities inside an Ad-Hoc Sub-Process need not have incoming or outgoing flows; where flows are given they impose the usual ordering.
  strength: note
  section: 13.3.5 (p. 431)
  checkable: static
  applies_when: executable
- id: BPMN-SUBP-011
  statement: To mean anything, an Intermediate Event inside an Ad-Hoc Sub-Process needs outgoing Sequence Flows; it can fire several times while the Sub-Process is active.
  strength: note
  section: 13.3.5 (p. 431)
  checkable: static
  applies_when: executable
- id: BPMN-SUBP-012
  statement: 'Initially all Activities with no incoming flow are enabled; a human performer, not the engine, selects which enabled Activity runs. ordering=sequential: the next may start only after the previous terminated; ordering=parallel: any time, including several instances of the same Activity.'
  strength: must
  section: 13.3.5 (p. 431)
  checkable: runtime
  applies_when: executable
- id: BPMN-SUBP-013
  statement: 'After each inner Activity completes, completionCondition is evaluated: false updates the enabled set; true completes the Sub-Process without further activities; with ordering=parallel and cancelRemainingInstances=true running instances are cancelled, with false it waits for them to end.'
  strength: must
  section: 13.3.5 (p. 431)
  checkable: partial
  applies_when: executable
- id: BPMN-SUBP-014
  statement: When an inner Activity completes it produces completionQuantity tokens; propagation continues until every token sits on an Activity input, a converging Parallel or Complex Gateway, or an Intermediate Event; an inner Activity is enabled with no incoming flow or when enough tokens (startQuantity) are present.
  strength: must
  section: 13.3.5 (p. 432)
  checkable: runtime
  applies_when: executable
- id: BPMN-SUBP-015
  statement: The standard does not say how an Ad-Hoc Sub-Process without a completionCondition ends; in an executable model one should be given.
  strength: should
  section: 13.3.5 (gap) (p. 431)
  checkable: static
  applies_when: executable
  basis: inferred
- id: BPMN-SUBP-016
  statement: 'Standard loop: the inner Activity repeats while loopCondition is true; testBefore chooses pre-test or post-test; loopMaximum bounds the iterations (unbounded when absent).'
  strength: must
  section: 13.3.6 (p. 432)
  checkable: partial
  applies_when: executable
- id: BPMN-SUBP-017
  statement: 'Multi-instance: the instance count is evaluated once (loopCardinality, or the size of the loopDataInput collection); isSequential chooses sequential or parallel creation; completionCondition is evaluated after every instance completes and, when true, cancels the rest, produces the outgoing tokens and completes the Activity.'
  strength: must
  section: 13.3.7 (p. 432)
  checkable: partial
  applies_when: executable
- id: BPMN-SUBP-018
  statement: 'MultiInstance behavior: none throws the event definition for every completing instance; one throws it for the first completing instance; all throws no event; complex evaluates every ComplexBehaviorDefinition after each completion and throws the event of each whose condition is true (events are caught on the Activity boundary).'
  strength: must
  section: 13.3.7 (pp. 432 to 433)
  checkable: partial
  applies_when: executable
- id: BPMN-SUBP-019
  statement: For behavior none or one, the thrown event definition is referenced from the loop characteristics and carries the Activity's runtime attributes. The PDF names the references noneEvent and oneEvent; the XSD names them noneBehaviorEventRef and oneBehaviorEventRef.
  strength: note
  section: 13.3.7 (p. 433)
  checkable: static
  applies_when: executable
- id: BPMN-SUBP-020
  statement: 'Multi-instance data flow: the input collection reaches loopDataInput through a DataInputAssociation from a Data Object (marked as a collection); each instance gets an inputDataItem; results flow to outputDataItem and loopDataOutput and out through a DataOutputAssociation. The extraction and update mechanisms are left unspecified.'
  strength: note
  section: 13.3.7 (p. 433)
  checkable: partial
  applies_when: executable
- id: BPMN-SUBP-021
  statement: The collection receiving multi-instance output should not be accessed until all items are written, since a concurrent Activity could read it before token flow guarantees completeness.
  strength: should
  section: 13.3.7 (p. 433)
  checkable: none
  applies_when: executable
- id: BPMN-SUBP-022
  statement: A multi-instance Activity is compensated only if all its instances completed successfully.
  strength: must
  section: 13.3.7 (p. 433)
  checkable: runtime
  applies_when: executable
- id: BPMN-EXGW-001
  statement: 'Parallel Gateway: activated when every incoming flow holds at least one token; consumes exactly one token per incoming flow and produces exactly one on every outgoing flow; excess tokens stay; it cannot throw an exception.'
  strength: must
  section: 13.4.1; Table 13.1 (p. 434)
  checkable: runtime
  applies_when: executable
- id: BPMN-EXGW-002
  statement: 'Exclusive Gateway: each arriving token goes to exactly one outgoing flow; conditions are evaluated in order and the first true one wins; the default flow is taken if and only if none is true; if none is true and there is no default flow an exception is thrown.'
  strength: must
  section: 13.4.2; Table 13.2 (p. 435)
  checkable: partial
  applies_when: executable
- id: BPMN-EXGW-003
  statement: Because exclusive evaluation is ordered, the order of an Exclusive Gateway's outgoing flows is significant; a diverging Exclusive Gateway without a default flow can throw at runtime.
  strength: should
  section: 13.4.2; Table 13.2 (p. 435)
  checkable: static
  applies_when: executable
  basis: inferred
- id: BPMN-EXGW-004
  statement: Inclusive Gateway is activated when at least one incoming flow has a token and no token on another path can still arrive on an empty incoming flow (the path-based synchronizing-merge rule of Table 13.3). On execution it consumes a token from every incoming flow that has one.
  strength: must
  section: 13.4.3; Table 13.3 (p. 436)
  checkable: runtime
  applies_when: executable
- id: BPMN-EXGW-005
  statement: 'Inclusive Gateway outputs: all outgoing conditions are evaluated in any order; every true condition gets a token (must); the default flow gets one if and only if none is true; none true and no default throws an exception.'
  strength: must
  section: 13.4.3; Table 13.3 (p. 436)
  checkable: partial
  applies_when: executable
- id: BPMN-EXGW-006
  statement: 'Event-Based Gateway: pass-through merge; exactly one outgoing branch is taken, decided by the first event of the configuration to occur; the first Task or Event to complete withdraws the others; it cannot throw an exception.'
  strength: must
  section: 13.4.4; Table 13.4 (p. 437)
  checkable: runtime
  applies_when: executable
- id: BPMN-EXGW-007
  statement: An Event-Based Gateway that starts a Process as a Parallel gateway allows only message-based triggers, and its Message triggers must belong to a Conversation with the same correlation information; after the first trigger the rest attach to the running instance. This is stricter than BPMN-GATE-006 and BPMN-GATE-007, which allow Signal, Timer and Conditional triggers; the stricter form applies to executable processes.
  strength: must
  section: 13.4.4 (p. 437)
  checkable: static
  applies_when: executable
- id: BPMN-EXGW-008
  statement: 'Complex Gateway: each incoming gate has an activationCount (tokens present) usable in the activationExpression; the expression is a boolean over data and activationCounts and is not evaluated until a token is present.'
  strength: must
  section: 13.4.5 (p. 437)
  checkable: partial
  applies_when: executable
- id: BPMN-EXGW-009
  statement: To avoid oscillation, activationCount should be used only in subexpressions of the form expr >= const, where expr uses only addition and const stays constant during the run.
  strength: should
  section: 13.4.5 (pp. 437 to 438)
  checkable: partial
  applies_when: executable
- id: BPMN-EXGW-010
  statement: Complex Gateway has two states, waiting for start and waiting for reset (runtime attribute waitingForStart, initially true). In the first phase, once the activation expression is true, it consumes one token per incoming flow that has one, evaluates all outgoing conditions in any order, gives tokens to the true ones (default only if none is true; exception if none and no default), then moves to waiting for reset while remembering which flows it consumed from.
  strength: must
  section: 13.4.5; Table 13.5 (pp. 438 to 439)
  checkable: runtime
  applies_when: executable
- id: BPMN-EXGW-011
  statement: 'Complex Gateway reset: when no path can still deliver a token to an incoming flow that has neither a token nor a first-phase consumption, it consumes remaining tokens, evaluates outgoing conditions again (it may produce no token here, without an exception) and returns to waiting for start. Conditions may refer to waitingForStart and so evaluate differently in the two phases.'
  strength: must
  section: 13.4.5; Table 13.5 (pp. 438 to 439)
  checkable: runtime
  applies_when: executable
- id: BPMN-EXGW-012
  statement: If a Complex Gateway's activation expression never becomes true, tokens block indefinitely and the Process can deadlock. The gateway throws an exception only when activated in waiting-for-start with no true outgoing condition and no default.
  strength: note
  section: 13.4.5; Table 13.5 (p. 439)
  checkable: none
  applies_when: executable
- id: BPMN-EXEV-001
  statement: A Start Event of an embedded Sub-Process or top-level Process creates an instance on each occurrence and then flows as usual. Only an Event-Based Gateway can exist without incoming flow in a Process; several such groups are allowed if they share a Conversation, and one event of each group must arrive.
  strength: must
  section: 13.5.1 (pp. 439 to 440)
  checkable: partial
  applies_when: executable
- id: BPMN-EXEV-002
  statement: 'Intermediate catch event: waiting starts when the event is reached; the occurrence is consumed when it arrives. Message catch events use the Receive Task correlation behavior.'
  strength: must
  section: 13.5.2 (p. 440)
  checkable: runtime
  applies_when: executable
- id: BPMN-EXEV-003
  statement: 'Boundary event: the occurrence is consumed first; if cancelActivity is set the attached Activity is cancelled (all instances when multi-instance), else it continues; then flow follows the boundary event''s outgoing flow. The text limits non-cancelling boundary events to Message, Signal, Timer and Conditional, while Table 10.92 also allows Escalation and Multiple; the table governs.'
  strength: must
  section: 13.5.3 (p. 440)
  checkable: partial
  applies_when: executable
- id: BPMN-EXEV-004
  statement: An Event Sub-Process starts with a Start Event, creates a scope, is instantiated only when that Start Event triggers, must not be connected to the rest of the Sequence Flows, cannot have boundary events attached, and runs in the context (data) of its parent.
  strength: must
  section: 13.5.4 (p. 440)
  checkable: static
  applies_when: executable
- id: BPMN-EXEV-005
  statement: 'isInterrupting set on the Start Event: the Event Sub-Process cancels the enclosing Sub-Process (only the affected instance for multi-instance); not set (not possible for Error): the parent keeps running in parallel. The handler may re-throw the triggering event to continue outside the parent''s boundary through a matching boundary event.'
  strength: must
  section: 13.5.4 (p. 440)
  checkable: partial
  applies_when: executable
- id: BPMN-EXEV-006
  statement: An Event Sub-Process is initiated only while its parent is running. Several instances of non-interrupting handlers may run, started at different times. Only one interrupting handler may be initiated per event definition within a parent; once it starts, the parent is interrupted and no new handlers start.
  strength: must
  section: 13.5.4 (pp. 440 to 441)
  checkable: partial
  applies_when: executable
- id: BPMN-EXEV-007
  statement: A parent in Completing stays there until its active Event Sub-Processes finish; no new ones start in Completing. After an error-triggered interrupting handler the parent is Failing until the handler reaches a final state; after a non-error interrupting handler it is Terminating; in both, the handler can read the parent's context and new handlers must not start.
  strength: must
  section: 13.5.4 (p. 441)
  checkable: runtime
  applies_when: executable
- id: BPMN-EXEV-008
  statement: An Event Sub-Process started by a Message uses the Receive Task correlation behavior.
  strength: must
  section: 13.5.4 (p. 441)
  checkable: runtime
  applies_when: executable
- id: BPMN-EXEV-009
  statement: 'Process-level Terminate End Event: the Process is abnormally terminated; no other Process instances are affected.'
  strength: must
  section: 13.5.6 (p. 443)
  checkable: runtime
  applies_when: executable
- id: BPMN-EXEV-010
  statement: 'Sub-process-level Terminate End Event: the Sub-Process is abnormally terminated; for multi-instance only the affected instance; no other Sub-Process instance and no higher-level instance is affected.'
  strength: must
  section: 13.5.6 (p. 443)
  checkable: runtime
  applies_when: executable
- id: BPMN-COMP-001
  statement: Compensation reverses effects of Activities that already completed; an Activity still active cannot be compensated but must be cancelled, and cancelling a Sub-Process can compensate its completed parts.
  strength: must
  section: 13.5.5 (p. 441)
  checkable: runtime
  applies_when: executable
- id: BPMN-COMP-002
  statement: 'A compensation handler is a Compensation Event Sub-Process (for a Process or Sub-Process) or an associated Compensation Activity (for any Activity). It is a set of Activities not connected to the rest of the model and starts with a catching Compensation event: a boundary event, or the Start Event of the Event Sub-Process.'
  strength: must
  section: 13.5.5 (p. 441)
  checkable: static
  applies_when: executable
- id: BPMN-COMP-003
  statement: A handler attached through a boundary event can only do black-box compensation, modeled as a Compensation Activity (isForCompensation=true).
  strength: must
  section: 13.5.5 (p. 441)
  checkable: static
  applies_when: executable
- id: BPMN-COMP-004
  statement: A Compensation Event Sub-Process lives inside a Process or Sub-Process, sees a snapshot of the parent's data taken at completion, and may itself trigger compensation of the parent's activities.
  strength: must
  section: 13.5.5 (p. 441)
  checkable: runtime
  applies_when: executable
- id: BPMN-COMP-005
  statement: A Sub-Process attribute 'compensable' is said to switch on implicit default compensation (completed inner Activities compensated in reverse order). The attribute is defined nowhere else in the PDF and is not in the XSD.
  strength: note
  section: 13.5.5 (p. 441)
  checkable: none
  applies_when: executable
- id: BPMN-COMP-006
  statement: Compensation is triggered by a throwing Compensation event (intermediate or end) that references the Activity; if clear from context it defaults to the current Activity; in a global context with no Activity named, all completed Activities of the Process are compensated.
  strength: must
  section: 13.5.5 (p. 442)
  checkable: partial
  applies_when: executable
- id: BPMN-COMP-007
  statement: Triggering is synchronous by default (the thrower waits for the handler); waitForCompletion=false triggers without waiting.
  strength: must
  section: 13.5.5 (p. 442)
  checkable: static
  applies_when: executable
- id: BPMN-COMP-008
  statement: Each instance of a loop or multi-instance Sub-Process has its own Compensation Event Sub-Process and data snapshot; triggering compensation compensates all instances in the current scope. For a boundary compensation handler the same text says the handler runs once per instance, while the operational semantics say a Compensation Activity on a multi-instance Activity runs once for all instances. The two statements conflict, so this file treats the rule as guidance.
  strength: should
  section: 13.5.5 (p. 442)
  checkable: none
  applies_when: executable
- id: BPMN-COMP-009
  statement: 'Presumed abort: only completed Activities are compensated (compensating a failed Activity does nothing); the error handler must make sure no further compensation is needed. With no error Event Sub-Process for an error in a Sub-Process, the default is to compensate all its contained Activities automatically.'
  strength: must
  section: 13.5.5 (p. 442)
  checkable: runtime
  applies_when: executable
- id: BPMN-COMP-010
  statement: A Compensation Event Sub-Process becomes enabled when its parent reaches Completed (data snapshot taken, one per instance for loops and multi-instance); an associated Compensation Activity becomes enabled when its Activity reaches Completed.
  strength: must
  section: 13.5.5 (p. 442)
  checkable: runtime
  applies_when: executable
- id: BPMN-COMP-011
  statement: Default compensation runs in reverse order of the original execution, concurrently where the originals had no dependency. A flow from A to B means B is compensated first; a data dependency between A and B means B is compensated first; in an Ad-Hoc Sub-Process B is compensated first if A completed before B started; loop and sequential multi-instance instances reverse their completion order; parallel multi-instance instances can compensate in parallel; if a boundary event of Sub-Process A leads to B and the event occurred, B is compensated before A.
  strength: must
  section: 13.5.5 (pp. 442 to 443)
  checkable: runtime
  applies_when: executable
- id: BPMN-COMP-012
  statement: 'A Transaction Sub-Process has three outcomes: success (normal outgoing flow), cancel (flow leaves via the Cancel boundary event after rollback and compensation), and hazard (flow leaves via an Error boundary event, with the Activity interrupted and no compensation).'
  strength: must
  section: 10.3.5 Transaction (p. 178)
  checkable: partial
- id: BPMN-COMP-013
  statement: Only cancellation of a Transaction triggers compensation; interruption by Error, Timer or anything on a non-Transaction Activity does not.
  strength: must
  section: 10.3.5 Transaction (p. 178)
  checkable: runtime
- id: BPMN-COMP-014
  statement: Cancellation is signalled by a Cancel End Event inside the Transaction or by a cancel message through the transaction protocol. Cancel End Event and Cancel boundary event are valid only in/on a Transaction (see BPMN-EVT-010).
  strength: must
  section: 10.3.5 Transaction; 13.3.4 (pp. 178; 431)
  checkable: static
- id: BPMN-COMP-015
  statement: 'On reaching non-Cancel end events a Transaction does not hand control up at once: the transaction protocol first verifies all participants finished; a participant problem can still redirect flow to the Cancel or Error event.'
  strength: must
  section: 10.3.5 Transaction (p. 178)
  checkable: runtime
- id: BPMN-COMP-016
  statement: 'For executable Processes the Transaction method should be a technology-specific URI (WS-AtomicTransaction or WS-BusinessActivity); ##compensate, ##store and ##image are kept for BPMN 1.1 compatibility. The PDF writes lowercase, the XSD default is ##Compensate.'
  strength: should
  section: 10.3.5 Table 10.21 (p. 178)
  checkable: static
  applies_when: executable
- id: BPMN-BPEL-001
  statement: Clause 14 is required for BPEL Process Execution Conformance and Complete Conformance, and not for Process Modeling, Choreography or plain Process Execution Conformance.
  strength: note
  section: 14.1 (p. 445)
  checkable: none
  applies_when: bpel-mapping
- id: BPMN-BPEL-002
  statement: 'There is no mapping of the diagram itself: each pool''s orchestration Process maps to its own WS-BPEL process.'
  strength: note
  section: 14.1 (p. 445)
  checkable: static
  applies_when: bpel-mapping
- id: BPMN-BPEL-003
  statement: 'To be mapped, an orchestration Process must be sound: no reachable state with a token that can never be removed (deadlock) and none with more than one token on a Sequence Flow (lack of synchronization).'
  strength: must
  section: 14.1 (p. 445)
  checkable: partial
  applies_when: bpel-mapping
- id: BPMN-BPEL-004
  statement: The Gateways and Sequence Flows form a directed graph; a block is a connected subgraph joined to the rest by exactly one entering and one leaving Sequence Flow; a block hierarchy is a set of blocks that are pairwise nested or disjoint and include the whole Process.
  strength: note
  section: 14.1 (p. 445)
  checkable: static
  applies_when: bpel-mapping
- id: BPMN-BPEL-005
  statement: The syntactic mapping covers only models built from the block patterns of 14.2; the semantic mapping extends it to larger models by requiring the same observable behavior without fixing the BPEL shape.
  strength: note
  section: 14.1; 14.2 (p. 446)
  checkable: partial
  applies_when: bpel-mapping
- id: BPMN-BPEL-006
  statement: The mapped BPEL process must show the same observable behavior as the BPMN Process.
  strength: must
  section: 14.2 (p. 446)
  checkable: none
  applies_when: bpel-mapping
- id: BPMN-BPEL-007
  statement: 'Process: a Process (with its defining Collaboration) maps to a BPEL process whose partner links come from the interfaces of its own Participant (myRole) and of each other Participant (partnerRole); variables from the Data Objects and Properties in its graph (not those in nested Sub-Processes); correlation sets from the CorrelationKeys of its Conversations. Output uses suppressJoinFailure=yes.'
  strength: must
  section: 14.2.1 (pp. 447 to 448)
  checkable: partial
  applies_when: bpel-mapping
- id: BPMN-BPEL-008
  statement: 'Names: an Activity name maps to a BPEL name by removing characters not allowed in an XML NCName and adding a suffix for uniqueness. Link names (from Sequence Flow names) must be canonicalized the same way.'
  strength: must
  section: 14.2.2 Table 14.1; 14.2.4 (pp. 448; 463)
  checkable: static
  applies_when: bpel-mapping
- id: BPMN-BPEL-009
  statement: Service Task and Send Task map to invoke; the partner link comes from the Participant they are linked to by Message Flows and the interface of their operation. A mappable Service or Send Task therefore needs an operation and a connected participant.
  strength: must
  section: 14.2.2 (pp. 448 to 449)
  checkable: static
  applies_when: bpel-mapping
- id: BPMN-BPEL-010
  statement: Receive Task maps to receive (createInstance from instantiate); the partner link comes from the interface of its operation. Abstract Task maps to empty.
  strength: must
  section: 14.2.2 (pp. 448 to 449)
  checkable: static
  applies_when: bpel-mapping
- id: BPMN-BPEL-011
  statement: The basic mapping defines no BPEL for User, Manual, Business Rule or Script Tasks, Call Activities, Ad-Hoc Sub-Processes or Transactions (the clause does not mention them). 14.3 says only that User Tasks could use BPEL4People. These are unmappable in the basic sense.
  strength: must
  section: 14.2.2; 14.3 (pp. 448 to 455; 469)
  checkable: static
  applies_when: bpel-mapping
  basis: inferred
- id: BPMN-BPEL-012
  statement: Messages with a scalar item definition typed by an XML schema map to a WSDL 1.1 message; the top-level child elements of the schema become the message parts. A Message therefore needs an XML-schema item definition to be mappable.
  strength: must
  section: 14.2.2 Message (pp. 449 to 450)
  checkable: partial
  applies_when: bpel-mapping
- id: BPMN-BPEL-013
  statement: Interface and Operation map to a WSDL 1.1 portType and operations (in-message to input, out-message to output, errors to faults).
  strength: must
  section: 14.2.2 (p. 450)
  checkable: static
  applies_when: bpel-mapping
- id: BPMN-BPEL-014
  statement: Key-based Correlation Keys map to BPEL properties, property aliases (message type and part from the key expression's message and message path), and correlation sets; the initiate flag is join or no according to whether the Message Flow initiates the Conversation. Several keys give several correlation elements.
  strength: must
  section: 14.2.2 Conversations and Correlation (pp. 450 to 451)
  checkable: partial
  applies_when: bpel-mapping
- id: BPMN-BPEL-015
  statement: 'An embedded Sub-Process with ad-hoc false maps to a BPEL scope; Event Sub-Processes become handlers of the enclosing scope (or process): non-interrupting Message to onEvent, Timer to onAlarm, Error to faultHandlers catch, Compensation to compensationHandler. Interrupting Message, Signal, Escalation and Conditional Event Sub-Processes are not mapped.'
  strength: must
  section: 14.2.2 Sub-Process (pp. 451 to 453)
  checkable: static
  applies_when: bpel-mapping
  basis: inferred
- id: BPMN-BPEL-016
  statement: 'Standard loops: testTime before maps to while, after maps to repeatUntil (negated condition); a loopMaximum adds a counter variable and extra condition. The PDF names the attribute testTime, the XSD names it testBefore.'
  strength: must
  section: 14.2.2 Loops (pp. 453 to 455)
  checkable: static
  applies_when: bpel-mapping
- id: BPMN-BPEL-017
  statement: Multi-instance Task maps to forEach (parallel unless sequential) only for the flow condition All; other behaviors (None, One, Complex) are not mapped.
  strength: must
  section: 14.2.2 Multi-Instance (p. 455)
  checkable: static
  applies_when: bpel-mapping
  basis: inferred
- id: BPMN-BPEL-018
  statement: 'Start Events: only a Message Start Event maps to a top-level construct (receive createInstance=yes). Error and Compensation Start Events occur only in Event Sub-Processes. None, Timer, Conditional, Signal, Multiple and Parallel Multiple Start Events have no mapping in the text.'
  strength: must
  section: 14.2.3 (p. 455)
  checkable: static
  applies_when: bpel-mapping
  basis: inferred
- id: BPMN-BPEL-019
  statement: 'Intermediate Events: Message catch maps to receive, Message throw to invoke, Timer to wait (for or until), Compensation throw to compensate or compensateScope (when waitForCompletion is true and inside an error or compensation Event Sub-Process). Signal, Escalation, Link, Conditional and Cancel intermediate events have no mapping. Timer mapping uses timeCycle and timeDate, not timeDuration.'
  strength: must
  section: 14.2.3 (pp. 456 to 457)
  checkable: static
  applies_when: bpel-mapping
  basis: inferred
- id: BPMN-BPEL-020
  statement: 'End Events: None to empty, Message to invoke, Error to throw, Compensation to compensate or compensateScope, Terminate to exit. Signal, Escalation, Cancel and Multiple end events have no mapping.'
  strength: must
  section: 14.2.3 (pp. 457 to 458)
  checkable: static
  applies_when: bpel-mapping
  basis: inferred
- id: BPMN-BPEL-021
  statement: 'Boundary Events: non-interrupting Message to a scope with onEvent, non-interrupting Timer to onAlarm, Error to a scope with a fault handler (using flow and links so the handler path can rejoin), Compensation to a compensationHandler. Several boundary events on one Activity share one scope; a loop or multi-instance with boundary events sits inside that scope. Interrupting Message and Timer boundary events, and Signal, Escalation, Conditional boundary events, are not mapped.'
  strength: must
  section: 14.2.3 Boundary Intermediate Events (pp. 458 to 460)
  checkable: static
  applies_when: bpel-mapping
  basis: inferred
- id: BPMN-BPEL-022
  statement: 'Gateways: data-based Exclusive Gateway to if/else-if/else; Event-Based Gateway (Message events, Receive Tasks, Timer events in any mix) to pick with createInstance from instantiate; Inclusive Gateway (pattern without otherwise gate) to flow with links and transition conditions; Parallel fork-join to flow; chains of unconditional Activities to sequence. Complex Gateways have no mapping.'
  strength: must
  section: 14.2.4 (pp. 461 to 464)
  checkable: static
  applies_when: bpel-mapping
  basis: inferred
- id: BPMN-BPEL-023
  statement: Loops built from Sequence Flows map to while (test first) or repeatUntil (test last) when they follow the structured while or repeat shape.
  strength: must
  section: 14.2.4 (pp. 464 to 465)
  checkable: partial
  applies_when: bpel-mapping
- id: BPMN-BPEL-024
  statement: 'Data Objects map to BPEL variables typed by the item definition (declared in the process or the scope of the Sub-Process holding them). Properties map to variables named container.property: a Process property is global; an Event property lives in the enclosing Sub-Process scope; an Activity property lives in its enclosing scope, or its own scope if it is a Sub-Process.'
  strength: must
  section: 14.2.5 (pp. 465 to 466)
  checkable: static
  applies_when: bpel-mapping
- id: BPMN-BPEL-025
  statement: 'Input and Output Sets: for Send and Service Tasks the single input set, and for Receive and Service Tasks the single output set, map to a WSDL message; each data input or output is a message part typed by its item definition. More than one set is not mapped.'
  strength: must
  section: 14.2.5 (pp. 466 to 467)
  checkable: static
  applies_when: bpel-mapping
- id: BPMN-BPEL-026
  statement: Data Associations map to toParts and fromParts of invoke or receive. If the Task's sets differ in structure from its message, assignments are needed (assign, invoke, assign).
  strength: must
  section: 14.2.5 (pp. 467 to 469)
  checkable: partial
  applies_when: bpel-mapping
- id: BPMN-BPEL-027
  statement: XPath expressions are used as written, with the BPMN context functions rewritten to BPEL variable access (Table 14.2); the arguments must be literal strings so the rewrite is possible.
  strength: must
  section: 14.2.5 Table 14.2 (p. 468)
  checkable: static
  applies_when: bpel-mapping
- id: BPMN-BPEL-028
  statement: Data Stores, Groups, Text Annotations, Pools/Lanes as such, Choreographies and Conversations have no mapping (the clause does not mention them).
  strength: note
  section: 14 (pp. 445 to 474)
  checkable: static
  applies_when: bpel-mapping
  basis: inferred
- id: BPMN-BPEL-029
  statement: 'Extended mapping: additional sound Process models whose block hierarchy contains unaddressed blocks can be mapped; the mapped BPEL must match the operational semantics of the BPMN Process.'
  strength: must
  section: 14.3 (p. 469)
  checkable: none
  applies_when: bpel-mapping
- id: BPMN-BPEL-030
  statement: The extended mapping says the mappings of 'sub clause 15.1' should be used where applicable; 15.1 is about interchanging incomplete models, so this looks like a stale reference to 14.2.
  strength: note
  section: 14.3 (p. 469)
  checkable: none
  applies_when: bpel-mapping
- id: BPMN-BPEL-031
  statement: 'Interleaved (overlapping, non-nested) loops: the looping part must be moved out into derived BPEL processes that spawn each other; the main process gets a one-way invoke named Spawn_<loop target>_Derived_Process followed by a receive named <loop target>_Derived_Process_Completed; derived processes are named <loop target>_Derived_Process and signal completion by a one-way invoke. Gateways there map to switch, not while.'
  strength: must
  section: 14.3.3 (pp. 470 to 472)
  checkable: partial
  applies_when: bpel-mapping
- id: BPMN-BPEL-032
  statement: 'Loop with a decision of three or more outgoing flows (one looping back): maps to a while followed by a switch inside a sequence; the looping flow''s condition becomes the while condition, the other outgoing flows become switch cases.'
  strength: must
  section: 14.3.2 (pp. 469 to 470)
  checkable: partial
  applies_when: bpel-mapping
- id: BPMN-BPEL-033
  statement: 'Infinite loop (flow looping back with no gateway): maps to a while with an always-false condition such as 1 = 0, the looped activities inside it.'
  strength: must
  section: 14.3.4 (p. 473)
  checkable: partial
  applies_when: bpel-mapping
- id: BPMN-BPEL-034
  statement: An element reached by flows that merge before all branches of a BPEL structured element merge must be duplicated into each branch, or moved to a derived process invoked from each place (named <target>_Derived_Process). A BPEL flow avoids duplication but is not always usable, for example under a pick.
  strength: must
  section: 14.3.5 (pp. 473 to 474)
  checkable: partial
  applies_when: bpel-mapping
- id: BPMN-BPEL-035
  statement: End Events can be combined with other BPMN objects to complete merging or joining of the paths of a BPEL structured element (Figure 14.2, distributed token recombination).
  strength: note
  section: 14.3.1 (p. 469)
  checkable: partial
  applies_when: bpel-mapping
- id: BPMN-BPEL-036
  statement: Clause 14 mixes BPEL 2.0 syntax (if/else, 14.2) with BPEL 1.1 constructs (switch/case, 14.3).
  strength: note
  section: 14.2.4; 14.3 (pp. 461; 470)
  checkable: none
  applies_when: bpel-mapping
  basis: inferred
- id: BPMN-CORR-001
  statement: Correlation ties a Message to an ongoing Conversation (instance routing). It applies at Collaboration, Choreography and Process level but happens at runtime in the Process. References to Send or Receive Tasks include message catch and throw events.
  strength: note
  section: 8.4.2 (p. 72)
  checkable: none
- id: BPMN-CORR-002
  statement: 'Two non-exclusive mechanisms exist: key-based and context-based correlation.'
  strength: note
  section: 8.4.2 (pp. 72 to 73)
  checkable: none
- id: BPMN-CORR-003
  statement: 'Key-based: every Message sent or received within a Conversation must carry in its payload the value of at least one of the Conversation''s CorrelationKeys.'
  strength: must
  section: 8.4.2 (p. 72)
  checkable: partial
- id: BPMN-CORR-004
  statement: A CorrelationKey is a composite key of CorrelationProperties (its partial keys); it is valid for use only if the Message populates all its properties; name is optional.
  strength: must
  section: 8.4.2; Table 8.31 (pp. 72; 75)
  checkable: partial
- id: BPMN-CORR-005
  statement: Each CorrelationProperty needs at least one CorrelationPropertyRetrievalExpression, one per Message used in the Conversation; it may name a type.
  strength: must
  section: 8.4.2; Table 8.32; Table 8.37 (pp. 72; 75; 77)
  checkable: static
- id: BPMN-CORR-006
  statement: A CorrelationPropertyRetrievalExpression has a messagePath (FormalExpression) and a messageRef to the Message it extracts from; both are required.
  strength: must
  section: Table 8.33; Table 8.39 (pp. 76; 78)
  checkable: static
- id: BPMN-CORR-007
  statement: If a follow-up Message derives a CorrelationKey already initialized in the Conversation, the values must match; if the key was not yet initialized, its value becomes associated with the Conversation.
  strength: must
  section: 8.4.2 (p. 72)
  checkable: runtime
- id: BPMN-CORR-008
  statement: The first Send or Receive Task of a Conversation must populate at least one CorrelationKey instance from the first Message.
  strength: must
  section: 8.4.2 Key-based (p. 75)
  checkable: runtime
- id: BPMN-CORR-009
  statement: 'Context-based: a Process may supply a CorrelationSubscription (one per CorrelationKey, correlationKeyRef required) holding CorrelationPropertyBindings, one per CorrelationProperty of the key; each binding has a correlationPropertyRef and a dataPath FormalExpression, both required. The text says ''as many bindings as properties''; the XSD allows zero or more (so treat the count rule as should).'
  strength: should
  section: 8.4.2; Tables 8.34, 8.35; XSD (pp. 73; 76 to 78)
  checkable: static
- id: BPMN-CORR-010
  statement: At runtime, subscription expressions are re-evaluated when the Data Objects or Properties they reference change, so the correlation condition can change during the run. The text calls the result 'SubscriptionProperty', a term not defined elsewhere.
  strength: note
  section: 8.4.2 Context-based (pp. 76 to 77)
  checkable: runtime
- id: BPMN-CORR-011
  statement: 'The CorrelationKeys that apply to a Message Flow are those of its containers: Collaborations, Choreographies, Conversation Nodes, Choreography Activities. Several keys can apply at once. Calls of Collaborations and Choreographies count as containment, so the caller''s keys apply to Message Flows in the called element.'
  strength: must
  section: 8.4.2 (p. 73)
  checkable: partial
- id: BPMN-CORR-012
  statement: The XSD (normative) defines CorrelationSubscription with a correlationKeyRef attribute and no 'process' element; Table 8.40 in the PDF shows a 'process' element and a correlationKeyRef element, and writes xsd:String. The XSD is followed.
  strength: note
  section: Table 8.40; Semantic.xsd (p. 78)
  checkable: none
- id: BPMN-RSRC-001
  statement: A Resource is an abstract definition (not actual user IDs) that Activities reference; several Activities may use the same Resource. It has a required name and zero or more ResourceParameters.
  strength: must
  section: 8.4.12; Table 8.49; Table 8.62 (pp. 93; 94; 100)
  checkable: static
- id: BPMN-RSRC-002
  statement: A ResourceParameter (name, type, isRequired) is a query parameter resolved at runtime (for example against an organizational directory); an Activity referencing the Resource can bind values to it.
  strength: note
  section: 8.4.12; Table 8.63 (pp. 93 to 94; 101)
  checkable: static
- id: BPMN-RSRC-003
  statement: 'ResourceRole (on an Activity or a Process) refers to a Resource by resourceRef or carries a ResourceAssignmentExpression, not both: the PDF says ''should not be specified'' for the other; the XSD makes them mutually exclusive.'
  strength: must
  section: 10.3.1 Table 10.5; XSD (pp. 152 to 153)
  checkable: static
- id: BPMN-RSRC-004
  statement: ResourceParameterBindings (parameterRef, expression) apply only when resourceRef is given.
  strength: must
  section: 10.3.1 Tables 10.5, 10.7 (pp. 153 to 154)
  checkable: static
- id: BPMN-RSRC-005
  statement: A ResourceAssignmentExpression must contain an Expression, and such Expressions must return resource entities (Users, Groups); several Expressions may return several Resources, all assigned to that ResourceRole subtype (potential owners, for example).
  strength: must
  section: 10.3.1 Table 10.6 (p. 153)
  checkable: partial
- id: BPMN-RSRC-006
  statement: 'Parameterized assignment: the infrastructure may use zero or more of the declared parameters and may override some with deployment values; failed queries count as empty results; a query returns one Resource or a set.'
  strength: note
  section: 10.3.1 (p. 153)
  checkable: runtime
- id: BPMN-RSRC-007
  statement: 'Performer: the resource that performs or is responsible for an Activity (individual, group, role or position, organization); no extra attributes. HumanPerformer specializes it for people; PotentialOwner specializes HumanPerformer for people who may claim a User Task and become its actual owner. In the XSD HumanPerformer and PotentialOwner add nothing; the PDF''s Table 10.17 adds a peopleAssignment element the XSD does not have.'
  strength: note
  section: 10.3.2; 10.3.4; Tables 10.17, 10.18 (pp. 154; 165 to 168)
  checkable: static
- id: BPMN-RSRC-008
  statement: User Task runtime instance attributes actualOwner (user who claimed it) and taskPriority are reported, not modeled.
  strength: note
  section: 10.3.4 Table 10.14 (p. 165)
  checkable: runtime
- id: BPMN-RSRC-009
  statement: User Task renderings are an optional extension point; a User Task can deploy on any compliant implementation whether or not it supports the rendering methods; extensions should reuse WS-HumanTask attributes.
  strength: should
  section: 10.3.4 (pp. 164 to 165)
  checkable: none
- id: BPMN-SERV-001
  statement: An Interface (name required, implementationRef optional such as a WSDL portType) defines at least one Operation and is used by CallableElements and Participants.
  strength: must
  section: 8.5.1; Table 8.65; Table 8.67 (pp. 102 to 104)
  checkable: static
- id: BPMN-SERV-002
  statement: An Operation (name required) has exactly one input Message (inMessageRef), at most one output Message (outMessageRef), and zero or more Errors it may return; implementationRef optional (for example a WSDL operation). The PDF's Table 8.66 says 'at most one input Message' for outMessageRef (typo).
  strength: must
  section: 8.5.3; Table 8.66; Table 8.68 (pp. 103 to 104)
  checkable: static
- id: BPMN-SERV-003
  statement: EndPoint is an empty extension point on RootElement for service addresses (for example WS-Addressing); the address definition is out of scope. EndPoints can be assigned to Participants (endPointRefs).
  strength: note
  section: 8.5.2; 9.3 Table 9.2 (pp. 103; 115)
  checkable: static
- id: BPMN-SERV-004
  statement: A Participant lists supported Interfaces (interfaceRef, zero or more) and EndPoints; Processes and GlobalTasks list supportedInterfaceRefs for the external behavior they provide.
  strength: note
  section: 9.3 Table 9.2; 10.3.6 Table 10.24 (pp. 115; 186)
  checkable: static
- id: BPMN-SERV-005
  statement: 'Service, Send and Receive Tasks reference one Operation (operationRef, optional in the XSD); implementation default is ##WebService. A Message event definition''s operationRef must be specified when the Process is executable.'
  strength: must
  section: 10.3.3.1; 10.5.5 Table 10.108 (pp. 157 to 160; 270)
  checkable: static
  applies_when: executable
- id: BPMN-ANNX-001
  statement: Annex A (Changes from v1.2) is informative. It lists new Choreography and Conversation diagrams, non-interrupting events, event Sub-Processes, a formal metamodel, XMI and XSD interchange for syntax and diagrams, and XSLT between them; Reference Tasks were removed in favor of GlobalTasks.
  strength: note
  section: Annex A (p. 479)
  checkable: none
- id: BPMN-ANNX-002
  statement: Annex B (Diagram Interchange) is non-normative documentation of a subset of an alpha Diagram Definition specification (DC and DI packages) referenced by BPMN DI; the DG package is not documented. The normative DI/DC artifacts are the CMOF and XSD files. Annex B refers to 'Clause 13 - BPMN DI' but BPMN DI is Clause 12.
  strength: note
  section: Annex B (pp. 481 to 498)
  checkable: none
- id: BPMN-ANNX-003
  statement: 'Annex B states the DD design principle: interchange only graphics the user controls (positions, routing points); do not interchange graphics fixed by the language (shapes, line styles).'
  strength: note
  section: B.2 (pp. 481 to 482)
  checkable: none
  see_conventions: conventions.depiction
- id: BPMN-ANNX-004
  statement: 'Annex B DI package facts: a Diagram has a root DiagramElement; a DiagramElement references at most one model element; Plane children are ordered and the order is the z-order; Shape has bounds, Edge has two or more waypoints, optional source/target only when not derivable; Label bounds are optional (default position when absent) and the presence of a label means it is visible; Style properties are shared across elements; tool-specific data goes in the interchange format''s extension mechanism.'
  strength: note
  section: B.3 to B.4 (pp. 483 to 497)
  checkable: none
  see_conventions: conventions.depiction
- id: BPMN-ANNX-005
  statement: Annex C (Glossary) is informative. It uses some older vocabulary (Abstract Process for Public Process; End Event results include Link; Trigger list includes Link) that disagrees with the normative clauses.
  strength: note
  section: Annex C (pp. 499 to 502)
  checkable: none
- id: BPMN-ANNX-006
  statement: 'There is no Annex D in this PDF: the table of contents ends with Annexes A, B and C.'
  strength: note
  section: Contents (p. viii)
  checkable: none

conventions:
  provenance: {status: standard, note: 'Drawing rules stated by the standard (7.5, 10.3, 10.5, 10.6, 11.5, 12.3, Annex B). They are conventions for a renderer, not validation. The few sentences the standard words as requirements are also kept as constraints with checkable none or static and a see_conventions pointer. Layout numbers (spacing, sizes) are not part of the standard.'}
  notation:
    events: {line_weight: 'Start events are drawn with a thin line, intermediate events with a double thin line, end events with a thick line (10.5.2 to 10.5.4).', marker_fill: 'Throwing events use a dark (filled) marker; catching events use an unfilled marker (7.5, 10.5).', shape: A circle. A boundary event is an intermediate circle placed on the edge of the activity it is attached to., section: 7.5; 10.5}
    activities: {shape: Rounded rectangle., border_styles: 'Reserved: thick border for a Call Activity, dotted for an Event Sub-Process, double for a Transaction. None of these is allowed on a Task (10.3.3, 10.3.5).', markers: 'Loop; multi-instance (parallel: vertical bars, sequential: horizontal bars); compensation; ad-hoc (tilde); sub-process plus. Loop and multi-instance are not shown together; markers are grouped and centered at the bottom (10.3.5).', task_type_marker: Upper left; the Abstract Task has none (12.3)., section: '10.3'}
    gateways: {shape: Diamond., markers: 'Inclusive: circle (required). Parallel: plus (required). Complex: asterisk (required). Exclusive: an X, optional, but a diagram should be consistent about it. Event-Based: a marker that looks like a catching Multiple intermediate event (10.6.2 to 10.6.6).', section: '10.6'}
    flows: {sequence_flow: 'Solid line with a solid arrowhead. Conditional: a mini-diamond at the start when leaving an activity, none when leaving a gateway. Default: a slash marker (8.4.13).', message_flow: 'Dashed line, a circle at the start, an open arrowhead (9.4).', association: 'Dotted line, optionally with an arrowhead by associationDirection; a compensation association joins a compensation boundary event to its handler (8.4.1).', conversation_link: Double thin line (9.5.6)., section: 7.3.2; 7.5}
    pools: {pool: 'A named rectangle, horizontal or vertical, holding a process (white box) or empty (black box). One and only one pool may be drawn without a boundary; every other pool has one (9.3).', multiplicity: A multi-instance marker shows when the participant's maximum is greater than 1 (12.3)., section: 9.3; 10.8}
    choreography: {bands: Participants appear as bands on the activity; the non-initiating band is lightly shaded (11.5.1)., message_icons: A return message icon is lightly filled and the initiating message icon unfilled (11.5.1)., loop_markers: 'Loop, parallel multi-instance and sequential multi-instance match the activity''s loop type; only one marker at a time (11.5.1).', section: '11.5'}
    artifacts: {group: A dashed rounded rectangle; does not affect flow; may span pools (8.4.1)., text_annotation: An open rectangle carrying free text (8.4.1)., section: 8.4.1}
    extension: {flexible: 'Size, color, line style and label position are flexible except where the standard states otherwise (2.2.3, 7.5).', permitted: New markers; new artifact shapes that do not conflict; colors with their own semantics; line styles that do not conflict., forbidden: 'Changing a shape (square to triangle, rounded to square); altering the footprint of events, activities and gateways; modifying or duplicating the line styles of sequence flows, message flows and text associations.', attributes: Extension attributes must not contradict BPMN semantics. A mandatory extension must be understood; an optional one may be ignored (7.7)., section: 2.2.3; 7.5; 7.7}
  depiction:
    source: Clause 12.3 (pp. 380 to 412), the depiction library; Annex B for the interchange classes. 177 rows. The depiction images were not read; the resolution tables were.
    rules: [Labels are optional. A label shows the name of the referenced model element; for a Data Object Reference it shows the name plus the data state name. A label is visible if a label object exists; its bounds are optional and relative to the plane origin., 'No model element, no depiction. A shape or edge whose model element reference is absent or invalid is not drawn. The one exception is a Data Association attached to a Sequence Flow, a visual shortcut for two associations, resolved from the interchange attributes.', 'Activity markers: loop, parallel multi-instance and sequential multi-instance are mutually exclusive; a compensation marker may combine with one of them. All markers are grouped and centered at the bottom of the shape; on collapsed shapes they sit to the left of the plus, and the ad-hoc tilde sits to the right of it. The same marker patterns apply to Transaction (double border) and Call Activity (thick border).', 'Task kinds: the task-type marker sits in the upper left. An Abstract Task has none. A Call Activity that calls a Global Task shows the marker of that global task type.', 'Expanded or collapsed is chosen by isExpanded. This file reads an absent value as collapsed for every activity kind (the standard says so for the plain Sub-Process and its tables for Ad-Hoc, Transaction and Call Activity accept an absent value for both forms).', 'Event Sub-Process depiction is selected by the single start event''s definition and isInterrupting: sixteen collapsed variants and one expanded.', 'Events are selected by event class, the number of definitions, parallelMultiple, isInterrupting (start events) or cancelActivity (boundary events): 58 variants in Table 12.22.', 'Gateways: the Exclusive marker is shown only when isMarkerVisible is true; the Event-Based gateway has three forms (plain, instantiating exclusive, instantiating parallel).', 'Pools and lanes: isVertical chooses orientation. A pool whose participant multiplicity maximum is greater than 1 shows the multi-instance marker.', 'Choreography: participant bands are separate shapes, each referencing its participant and carrying participantBandKind (top, middle or bottom; initiating or non-initiating) and an envelope decorator if isMessageVisible. The decorator sits outside the band bounds, close to the band and vertically centered, joined by a dotted line; its bounds are not interchanged; the message name may label it.', 'Edges: the conditional diamond is not drawn when the source is a Gateway. A message flow''s decorator sits at the midpoint. A message flow may end at the border of a black-box pool or collapsed sub-process, so the edge''s source or target then points to that shape. An edge never targets a participant band. An edge has two or more waypoints.', 'Not interchanged: the bounds of envelope decorators and their labels. Z-order is the document order of a plane''s children (Annex B). A shape references at most one model element.']
    corrections: ['Table 12.22, row ''Non-interrupting boundary Timer'': the table names an IntermediateCatchEvent; it is read as a BoundaryEvent (as the neighbouring rows are).', 'Table 12.22, row ''Catch Signal Intermediate'': the table gives a Message definition; read as a Signal definition. Row ''Throw Signal Intermediate'': the title says ''Interrupting - Boundary - Throw''; read as an intermediate throw event.', 'Table 12.22, row ''Catch Escalation Intermediate (normal flow)'': Table 10.93 allows no such event; the row is kept and marked not-allowed.', 'Table 12.22 uses isParallelMultiple and MultipleLoopCharacteristics, which the schema does not have; the schema''s parallelMultiple and MultiInstanceLoopCharacteristics are used.', 'Table 12.16, the two Multiple rows omit the parallelMultiple false condition; it is added.', 'Tables 12.13, 12.15 and 12.20 accept an absent isExpanded for the expanded form as well as the collapsed one; the expanded rows here require true.', 'Table 12.33: initiating rows say ''multiplicity unspecified or maximum greater than 1''; unspecified cannot be greater than 1, so unspecified and maximum 1 are one case and greater than 1 is the multi-instance case. participantBandKind and messageVisibleKind values use the schema''s spelling with underscores.', 'Table numbers repeat (12.8 appears twice, and the table captioned 12.15 is the expanded Transaction); the table column keeps the numbers as printed.']
    columns: table = the specification's table number as printed; depicts = the depiction; element_when = the model class and attribute condition that selects it; di = an extra interchange attribute; pages = printed pages.
