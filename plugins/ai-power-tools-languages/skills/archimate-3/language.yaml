    Junction: {display: Junction, kinds: [and, or], section: 5.5.1, notes: 'A relationship connector, not a relationship. The standard has one junction with an and/or variant; the exchange schema splits it into two types. Its rule is stated once in relationships.junction.'}
relationships:
  # ArchiMate relationships are 11 types over a concept matrix, not named fact types. This block therefore differs
  # in shape from a fact-type language: `allowed` is the table, `junction` and `special_ends` are the standard's rules.
  types_in: concepts.relationships
  letters: {c: Composition, g: Aggregation, i: Assignment, r: Realization, v: Serving, a: Access, n: Influence, o: Association, t: Triggering, f: Flow, s: Specialization}
  no_multiplicity: The standard gives relationships no multiplicity or roles beyond the names in concepts.relationships.
  allowed:
    authority: Permissive upper bound. A source and target pair absent from `cells` is an error; a pair present is allowed, never evidence that the relationship is right. Where the table and the prose disagree, the table is read (rule ARCHIMATE-REL-009).
    orientation: Outer key is the concept at the From end (source), inner key the concept at the To end (target). The value is the set of relationship letters allowed, written in alphabetical order; letters are defined in relationships.letters.
    source: 'See standard.reference for provenance: a third-party capture of the 3.1 table, not the specification. 62 by 62 concepts, 3841 non-empty cells.'
    always_allowed: Association between any two elements; composition, aggregation and specialization between two elements of the same type (rules ARCHIMATE-REL-004 and 005).
