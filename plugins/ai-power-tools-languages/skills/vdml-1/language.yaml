concepts:
  source: 'OMG VDML 1.0: clause 7.2 (class definitions), with generalizations, abstractness and multiplicities from the normative machine-readable model. 63 classes: 53 concrete and 10 abstract. Concept names are the standard''s own class names without spaces. Properties that are plain values (booleans, strings) are under attributes; properties that link two classes are under relationships.'
  elements:
    ValueDeliveryModel:
      display: Value Delivery Model
      category: Model and contexts
      specializes: VdmlElement
      section: 7.2.3.1.1, p. 53
    AnalysisContext:
