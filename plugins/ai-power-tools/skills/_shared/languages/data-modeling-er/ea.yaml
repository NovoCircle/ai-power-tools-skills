  dialog: Design ribbon > Transform with a package selected opens a 'Model Transformation' dialog that lists C#, C++, VBNet, PHP, DDL, EJB Entity,
    EJB Session, Java, JUnit, NUnit, Tables, WSDL, XSD, 'Data Modeling t...' and 'ERD to Data Mo...' (names cut off at the column edge), each
    with a Target Package cell
  attempts: 'four attempts with automated clicks gave no result: the transformation''s checkbox never showed a tick after a click, Do Transform
    produced no progress dialog, no message and no new package or element, so the transform''s full name, its output and whether it ran are not
    recorded. Nothing here describes the transform as working'
  how_to_finish: someone using the mouse by hand ticks the box, sets the target package, runs it once and records the result
samples_in_ea:
  files: 45
  note: 'EA''s model patterns: 40 de1.0 database engineering patterns, er1.0 simple ER model, bk3.0, three dws1.0 MySQL patterns'
  data_modeling_diagrams: 379
  idef1x_notation: 230
  information_engineering_notation: 149
  erd_diagrams: 1
  database_products_seen: 17
  referential_actions_seen:
  - No Action
  - Restrict
conventions:
  attribute_line_direction: ERD_Connector runs from the owner (entity or relationship diamond) to the ERD_Attribute
  generalization_direction: ERD_Disjoint / ERD_Overlapping run from the category to the generic entity
  fk_direction: the FK association runs from the referencing table to the referenced table, child end 0..*, parent end 1
  relationship_direction: this guide and the ruleset draw an ERD_Relationship from parent (owner) to child; EA stores no parent / child
  primary_key: 'ERD: attributeType = primaryKey on an ERD_Attribute. Data model: a PK operation of the table with the key columns as parameters'
  database_product: t_object.GenType on a table or view; exported as product_name
harvest:
  ea_build: 17.1 build 1716
  stereotype_list: 'ui: Resources tab, read by computer use ; 8 ERD rows, 24 EAUML data-modeling rows'
  metaclasses_tags_directions_diagram_types: 'api: created through COM in a test model and read back'
  columns_keys_indexes: 'api and sample-content: elements created through COM in a test model, and EA''s model patterns'
  database_products_notation_counts: 'model-pattern: EA''s ModelPatterns folder'
