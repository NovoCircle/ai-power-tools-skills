    Requirements Relationships:
    - Aggregate
    - Inheritance
    - Associate
    - Implements
    - Dependency
    - InformationFlow
    - Trace
    Patterns:
    - Functional Requirements
    - Non-Functional Requireme...
  note: the nine Extended Requirements items equal the nine EAREQ stereotypes; the plain Requirement item makes an element with no stereotype. What the
    Trace item creates (trace or Trace) was not tried
quick_links:
  status: read on screen, measured on EA 17.1 build 1716, 2026-11-04; one source, a new Requirement with no stereotype
  targets_offered:
  - Artifact
  - Change
  - Issue
  - Requirement
  - Risk
  - Note
  - Common
  requirement_submenu:
  - Aggregation to Whole
  - Association
  - Generalization
  - Aggregation to Part
  - Specialization
  artifact_submenu:
  - Aggregation to Whole
  - Association
  result: 'no requirements-specific quick link: no Trace, DeriveReqt or Satisfy'
conventions:
  priority: Two priorities exist. The EAREQ tag priority is empty until set (values High, Medium, Low, Essential, Conditional, Optional); EA's own Priority
    field is Medium by default. The ruleset reads the tag.
  memo tags: A memo tag reads as the text <memo> to a tagged-value test whether or not it holds text; only the enumeration tag priority can be tested.
  several stereotypes: Only the first is stored in t_object.Stereotype. A requirement that is both business level and functional is seen by a selector as
    the first only.
harvest:
  stereotype_names: 'ui: Resources tab, Core Extensions > UML Profiles > EAREQ, 9 names; api-readback: all nine bound by EAREQ::'
  metaclass_tags_storage_connectors_diagram: 'api-readback: elements and connectors created through the API in a test model and read back, over five probes'
  stored_form_of_patterns: 'model-pattern: EA''s model patterns (rq2.0 patterns store Functional, Aggregation, Extended::Requirements)'
  concept_to_stereotype_mapping: 'judgment: by name and tags; the definition text of the EAREQ stereotypes was not read (encrypted profile)'
  toolbox_quick_links_model_templates: 'ui, EA 17.1 build 1716, 2026-11-04: one diagram''s toolbox pages and one quick-link source were read; model templates
    were not read'
  ea_build: 17.1 build 1716

# EA's names for this language's layout. tools/gen_conventions.py reads layout_map.
layout_map:
  technology: EAExtended:Requirements
  display_name: EA Requirements
  extends: UML
  stereotype_prefix: ''
  notes: |
    The standard defines no diagram type, so this one is EA's own. Its arrangement and route are the shared defaults, not measurements.

    `EAExtended:Requirements` is the id EA reports, measured on EA 17.1 build 1716.
  diagram_types:
    Requirements:
      token: Extended::Requirements
      base: Custom
      arrangement: graph
      title: frame-header
      route: straight
      channels:
        fill: null
        free:
        - fill
        - border
        - border_width
        - line_color
        - font_color
        - opacity
        - icon
