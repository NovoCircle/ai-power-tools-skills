    Loss: {display: Loss, group: STPA, kind: situation, layer: library, specializes: AbstractEffect, abstract: true, marker: Situation, section: 9.5.1 p. 75, definition: 'An effect that is unacceptable and should be prevented, such as loss of life or injury, property damage, mission loss, financial loss, loss of public image or environmental pollution.'}
