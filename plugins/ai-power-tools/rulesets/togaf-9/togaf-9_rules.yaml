# TOGAF 9.1 Conformance Ruleset
# Language:     TOGAF 9.1 content metamodel (The Open Group, G116), as modeled with Sparx Enterprise Architect's TOGAF technology
# Enforced by:  AI Power Tools for Sparx EA - validate_model tool
# Generated from the language skill's rules and relationships; do not edit by hand.
#
# VERSION. The language guide describes TOGAF 9.1. The Open Group has published TOGAF 9.2 (2018) and the TOGAF Standard 10th Edition (2022), which
# were not studied. EA's technology reports version 3.0 (Repository.GetTechnologyVersion('TOGAF')), a number of its own that
# names no edition of the standard.
#
# STEREOTYPE NAMES ARE UNQUALIFIED, CASE-SENSITIVE AND HAVE NO SPACES, AND THAT IS MEASURED.
#
# validate_model selects with `Stereotype IN (...)` on t_object and t_connector. For Sparx's TOGAF technology that column holds the bare name
# (`BusinessService`, `OrganizationUnit`, `OwnsAndGoverns`); the qualified form `TOGAF::BusinessService` is only in the t_xref row named
# `Stereotypes`. The Resources tab shows display text with spaces (`Business Service`) and, for some rows, another spelling (`Platform Sevice`
# is stored PlatformService; `influence` is stored in lower case). Measured on EA 17.1 build 1716 by creating one object per tab row and
# reading it back: 204 stored names, FQName `TOGAF::<name>`; the IEEE1471 profile of the same technology stores `IEEE1471::<name>`.
#
# WHAT THE VALIDATOR CAN SEE, AND WHAT IT CANNOT. A rule selects an element by the FIRST stereotype in t_object.Stereotype, by its EA type and by its
# tagged values; selects a connector by its stereotype or by EA's own connector type; counts connectors; and checks where an element sits
# (`contained_in`, `contains_count`: the element it is attached to by ParentID, else its package, named by stereotype, type or name). No rule in
# this file uses types or containers yet. A rule cannot follow a generalization or read numeric values. Eight of the language skill's rules are in
# this file; the others are listed with the reason in the guide.
#
# RELATIONSHIP TABLE. 104 of the 143 relationship rows (34.7 and the figures) carry a relationship name that EA has as a connector stereotype;
# they are generated into `togaf-9-relationships` (39 stereotypes, 110 source/target cells). Abstract entities
# expand to their kinds (an Application Component row applies to the logical and physical kinds as well). Each stereotype's direction is its verb's. ITService (the Information System Service, which specializes Business Service) has the cells of BusinessService, as source and as target.
#
# Sources:
#   [S1] The Open Group, TOGAF Version 9.1, Part IV Architecture Content Framework (chapters 33 to 37), document G116
#   [S2] Sparx Systems, the TOGAF technology built into Enterprise Architect 17.1 (API id TOGAF, reported version 3.0)

meta:
  version: "0.1"
  language: togaf-9
  organization: "(your organization)"
  mdg_family: TOGAF
  description: >
    Conformance rules for TOGAF 9.1 content metamodel models built with Sparx Enterprise Architect's TOGAF technology: which entities a relationship may join,
    that a Business Service is owned and governed, that a Principle has a rationale and a priority, and the value sets of the standard's category attributes.
    Each rule names the rules.md id it implements.
  severity_levels:
    error: A requirement of the standard (rules.md strength must)
    warning: Guidance of the standard (rules.md strength should)
    info: Advisory note; not a conformance violation

