      auto_fixable: false

  - id: BPMN2-EVT-024a
    name: An event sub-process has no incoming sequence flow
    implements: BPMN-EVT-024
    description: An event sub-process is started by its own event; no sequence flow enters it. [OMG BPMN 2.0.2 (formal/13-12-09)
