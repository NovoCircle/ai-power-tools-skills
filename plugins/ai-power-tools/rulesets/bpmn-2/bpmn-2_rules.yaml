      - BusinessProcess
      - Category
      - CategoryValue
      - Choreography
      - ChoreographyModel
      - CollaborationModel
      - ComplexBehaviorDefinition
      - Conversation
      - ConversationModel
      - CorrelationKey
      - CorrelationProperty
      - CorrelationPropertyBinding
      - CorrelationPropertyRetrievalExpression
      - CorrelationSubscription
      - DataStore
      - EndEvent
      - EndPoint
      - Error
      - Escalation
