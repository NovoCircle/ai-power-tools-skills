ea_only:
  stereotypes:
    UPDMPackage: 'EA''s container for a view''s content: three rows (Package, Artifact, Text); tags VIEWID (default AV-1) and VIEWTYPE (AV, StV,
      OV, SOV, SV, AcV, TV, default AV)'
  diagram_types:
  - UPDM2_AV::AV-3
  - UPDM2_Framework::UPDM Framework
  samples: 'EA''s model patterns up2.0-*: one per Annex B and Table C.3 view, plus up2.0-dodaf-framework, up2.0-modaf-framework and up2.0-example-model'
toolbox:
  status: read on screen, measured on EA 17.1 build 1716, 2026-11-04; one diagram opened (OV-2)
  toolboxes: about 49, named by view (AcV-1/PV-1, AcV-2/PV-2, UPDM, AV-1, AV-2, AV-3, CV-7, OV-1 to OV-7, SOV-1 to SOV-5, StV-1/CV-1 to StV-6/CV-6,
    SV-1/SvcV-1 and the other SV pairs, SV-12, TV-1/TV-2/TV-3/StdV-1/StdV-2); counted from the tree, not exhaustively
  pages_of_the_OV_2_diagram:
    OV-2:
    - Actual Location
    - Capability
    - Condition
    - Environment
    - Exhibits
    - Implements
    - Is Capable of Performing
    - Known Resource
    - Logical Architecture
    - Needline
    - Node
    - Node Operation
    - Node Port
    - Node Role
    - Operational Activity
    - Operational Exchange
    - Operational Parameter
    - Performer
    - Problem Domain
    - Security Domain
    - Trustline
    All UPDM Stereotypes: collapsed, not read
quick_links:
  status: read on screen, measured on EA 17.1 build 1716, 2026-11-04; one source, the Node 'Retail Banking Operations'
  result: 'the menu offers UPDM2::Capability (submenu: Exhibits), Note and Common: one pair, matching the Exhibits direction'
connector_directions_on_screen:
  measured_on: EA 17.1 build 1716, 2026-11-04, toolbox tools drawn in a copy of the model; the guide's direction is the start of the drag = source
  same_as_the_guide:
    Exhibits: Dependency UPDM2::Exhibits, source = the Node, target = the Capability
    IsCapableOfPerforming: Dependency UPDM2::IsCapableOfPerforming, source = the Node, target = the OperationalActivity
    Trustline: Dependency UPDM2::Trustline, source = Node A, target = Node B
    Implements: Dependency UPDM2::Implements, source = a ResourceArtifact, target = a Function
    Needline: Connector UPDM2::Needline, source = Node Role 1, target = Node Role 2
  no_pair_check: 'the Implements tool also accepted the wrong way round (Function as source, ResourceArtifact as target) with no message: the
    toolbox does not check the pair, as the API does not'
  not_tested: ActivityPerformedByPerformer, Command, Control and the rest of the connectors were not drawn
tags_of_note:
  exchangeKind: 'on OperationalExchange (a connector tag): ConfigurationExchange, EnergyExchange, GeoPoliticalExtentExchange, InformationExchange,
    MaterielExchange, OrganizationalExchange; what the exchange conveys is not a tag'
  architectureFramework: 'on ArchitecturalDescription and ServiceDescription: DoDAF, MODAF or NAF, empty until set'
  ruleKind: on OperationalConstraint, ResourceConstraint and ServicePolicy
  startDate, endDate: on FillsPost, Forecast, OrganizationalProjectRelationship and ProjectOwnership (connector tags) and on EnterprisePhase,
    WholeLifeEnterprise, ActualProject and Project
  VIEWID, VIEWTYPE: on UPDMPackage
  isEncapsulated: on Node, inherited from the Class form, not a UPDM tag
conventions:
  parts_and_ports_need_a_host: the 18 Part stereotypes (NodeRole, ResourceRole, ConceptRole ...) and the Port stereotypes NodePort, ResourcePort,
    Service and Request are children of a class (ParentID); EA refuses a Port in a package
  package_forms: ArchitecturalDescription, ServiceDescription, View, Viewpoint, LogicalDataModel, PhysicalDataModel and UPDMPackage bind on an
    element of type Package or on a real package (Element.StereotypeEx); the qualified type at package level is refused
  operations: NodeOperation, ResourceOperation, ServiceOperation and ServiceMessageHandler are applied to an operation of a class
  second_stereotype: t_object.Stereotype holds the first; level 1's SysML block on a Node is only in the t_xref row, so apply the UPDM stereotype
    first
  connector_direction: a Dependency runs from client (Start_Object_ID) to supplier (End_Object_ID); an InformationFlow from its information source
  abstract_elements: none of the 33 abstract elements has a stereotype
  typing: the type of a part or port is its classifier (t_object.Classifier), which a ruleset selecting by stereotype cannot read
  ownership: the owner of a part, port, operation or parameter is ParentID (or Package_ID for a package). A ruleset reads the owner of an element
    and the children of an element (contained_in and contains_count in validate_model, 2026-10-21); it cannot read the owner of an operation or
    of a connector, or an attribute that is not an element
harvest:
  shipped-xml: not available (encrypted internal technology, InternalTechnologies\UPDM Technology.xml)
  sample-content:
  - stored metaclass (Object_Type) per row, binding (t_xref FQName), tagged values with Values and Default notes, Part, Port, parameter, operation,
    Package and connector forms, connector types, diagram types (t_diagram, StyleEx MDGDgm)
  binding-matrix: every name set with StereotypeEx on 40 element types, 16 connector types, attributes and operations
  model-pattern: diagram type tokens read from the 102 up2.0-*.xml model patterns (read only), then tested for binding; 208 further tokens tried
  ui: 'the Resources tab (read 2026-10-20) gives 179 names and 181 rows; the Views, Searches and Model Templates nodes were not read;
    the API does not expose them. Measured on EA 17.1 build 1716, 2026-11-04: the Diagram Types node lists 74 types in seven groups with the guide''s
    names; the Toolboxes node was read; the OV-2 toolbox page, one quick-link source and the connector directions in connector_directions_on_screen
    were checked. The 181 rows were not recounted on screen; most other toolbox pages and quick-link sources were not read.'
  ea_build: 17.1 build 1716

