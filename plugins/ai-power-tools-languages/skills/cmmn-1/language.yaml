  - {name: Definitions.caseFileItemDefinitions, source: Definitions, target: CaseFileItemDefinition, role: caseFileItemDefinitions, kind: composition, multiplicity: {targets_per_source: 0..*}, section: 5.1.2}
  - {name: Definitions.cases, source: Definitions, target: Case, role: cases, kind: composition, multiplicity: {targets_per_source: 0..*}, section: 5.1.2}
  - {name: Definitions.processes, source: Definitions, target: Process, role: processes, kind: composition, multiplicity: {targets_per_source: 0..*}, section: 5.1.2}
  - {name: Definitions.decisions, source: Definitions, target: Decision, role: decisions, kind: composition, multiplicity: {targets_per_source: 0..*}, section: 5.1.2}
  - {name: Definitions.relationships, source: Definitions, target: Relationship, role: relationships, kind: composition, multiplicity: {targets_per_source: 0..*}, section: 5.1.2}
  - {name: Definitions.artifacts, source: Definitions, target: Artifact, role: artifacts, kind: composition, multiplicity: {targets_per_source: 0..*}, section: 5.1.2}
  - {name: Definitions.cmmnDi, source: Definitions, target: CMMNDI, role: cmmnDi, kind: composition, multiplicity: {targets_per_source: 0..1}, section: 5.1.2}
  - {name: Definitions.extensions, source: Definitions, target: Extension, role: extensions, kind: composition, multiplicity: {targets_per_source: 0..*}, section: 5.1.5.1, note: Inferred from "contained within Definitions"; not in the attribute table.}
  - {name: CMMNElement.documentation, source: CMMNElement, target: Documentation, role: documentation, kind: composition, multiplicity: {targets_per_source: 0..*}, section: '5.1.1, Table 5.1'}
  - {name: CMMNElement.extensionDefinitions, source: CMMNElement, target: ExtensionDefinition, role: extensionDefinitions, kind: reference, multiplicity: {targets_per_source: 0..*}, section: '5.1.1, Table 5.1', note: Not used in XML schema exchange.}
  - {name: CMMNElement.extensionValues, source: CMMNElement, target: ExtensionAttributeValue, role: extensionValues, kind: composition, multiplicity: {targets_per_source: 0..*}, section: '5.1.1, Table 5.1', note: Not used in XML schema exchange.}
