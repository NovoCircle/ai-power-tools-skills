conventions:
  provenance: standard-text
  measured: false
  note: Drawing rules read from clause 6 and Table 7.9. They are conventions of the notation, not model constraints; the sentences that the standard words as requirements are also constraints in the NOT, DEC and DI categories.
  shapes:
    CasePlanModel: 'Folder shape: a rectangle with a smaller rectangle attached at the upper left that may hold the case name (6.3).'
    CaseFileItem: 'Document shape: a rectangle with a broken upper right corner (6.4).'
    Stage: 'Rectangle with angled corners and a small box at the bottom center holding plus (collapsed) or minus (expanded). Discretionary: short dashed lines (6.5).'
    PlanFragment: Rectangle with dashed lines and softly rounded corners and a plus or minus box at the bottom center (6.7).
    Task: 'Rectangle with rounded corners; discretionary: dashed lines (6.8).'
    HumanTask: Rounded rectangle with a hand symbol at the upper left when non-blocking, or a user symbol when blocking (6.8.1).
    CaseTask: 'Rounded rectangle with a folder symbol at the upper left (6.8.2). BPMN compatibility alternative: add a collapsed marker and a thick border (6.8.2.1).'
    ProcessTask: 'Rounded rectangle with a chevron symbol at the upper left (6.8.3). BPMN compatibility alternative: optional chevron, a collapsed marker and a thick border (6.8.3.1).'
    DecisionTask: 'Rounded rectangle with a decision table symbol at the upper left (6.8.4). DMN compatibility alternative: add a collapsed marker (6.8.4.1).'
    Milestone: Rectangle with half-rounded ends (6.9).
    EventListener: Double-line circle with an open center; the circle must be double-lined (6.10).
    TimerEventListener: Double-line circle with a clock marker (6.10).
    UserEventListener: Double-line circle with a user symbol (6.10).
    EntryCriterion: Shallow (open) diamond on the boundary of the item (6.6).
    ExitCriterion: Solid diamond on the boundary of the item (6.6).
    PlanningTable: Table of six cells with a plus or minus in the bottom center cell (6.12).
    Association: Dotted single line, optional arrowhead (6.14.1).
    TextAnnotation: Open rectangle drawn with a solid single line (6.14.2).
  lines:
    Connector: "dash-dot-dot line; the text also calls it dotted, no arrowheads (6.11)"
    DiscretionaryAssociation: dashed, no arrowheads (6.11)
    Association: dotted, optional arrowhead (6.14.1)
  free_choices: Size, fill, line color, label text and position may vary; colors may carry tool-defined meaning; new decorators may be added; none may change a defined shape (2.2).
notes: CMMN 1.1 defines a metamodel, a notation, a diagram interchange model, execution semantics (clause 8) and an XML exchange format. It defines one diagram kind (the CMMN diagram) and no viewpoints. Concept names are the class names of the metamodel; the standard's own convenience names (discretionary task, blocking and non-blocking task, case plan model) are under concepts.variants. Tool-specific encodings of these concepts belong in the tool's own file, not here. Run-time rules (category LIF) apply only when a case is executed.

# Our conventions for drawing this language, kept apart from `notation`, which holds only what the standard states.
# Sizes and spacing come from the shared layout standard; this block says which size class each concept takes.
# A concept not listed here is a plain rectangle (box) or has no shape of its own (see `notation`).
layout:
  basis: Our conventions, not this standard's. Sizes and spacing come from the shared layout standard.
  element_types:
    CasePlanModel: container
    Stage: container
    PlanFragment: container
    Milestone: box
    EventListener: event-circle
    TimerEventListener: event-circle
    UserEventListener: event-circle
    EntryCriterion: attached-item
    ExitCriterion: attached-item
    PlanningTable: attached-item
    ManualActivationRule: attached-item
    RequiredRule: attached-item
    RepetitionRule: attached-item
    CaseFileItem: data-item
    TextAnnotation: note
  exceptions: {}
  diagram_types:
    CMMNDiagram:
      arrangement: nested-grid
      title: frame-header
      route: orthogonal
      channels:
        fill: Free in the standard (2.2), so it carries no meaning here.
        claimed:
          position: Containment. An item drawn inside a case plan model, stage or plan fragment belongs to
            it, and a criterion or planning table sits on the border of the shape it belongs to.
          size: Enclosure. A case plan model, stage or plan fragment is sized by what it holds.
          line_style: Dashed outlines mean discretionary, and the three kinds of line are told apart by their
            style (clause 6).
          icon: Kind of task or event listener, and the decorators.
        free:
        - border_width
        - line_color
        - font_color
        - opacity
  no_element_type:
    drawn_as_its_definition:
      reason: Drawn as the shape of the definition it uses, and takes that definition's element size.
      concepts:
      - PlanItem
      - DiscretionaryItem
