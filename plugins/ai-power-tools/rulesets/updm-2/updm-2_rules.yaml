# UPDM 2.1 Conformance Ruleset
# Language:     UPDM 2.1 (OMG formal/13-08-04), as modeled with Sparx's built-in UPDM technology
#               (shown as "UPDM 2.0" in Resources > MDG Technologies; its id is UPDM2 and the API reports version 2.1)
# Enforced by:  AI Power Tools for Sparx EA - validate_model tool
# Generated from the language skill's rules and relationships; do not edit by hand.
#
# STEREOTYPE NAMES ARE UNQUALIFIED AND CASE-SENSITIVE, AND THAT IS MEASURED.
#
# validate_model selects with `Stereotype IN (...)` on t_object and t_connector. For Sparx's UPDM technology that column holds the bare name
# (`Node`, `FillsPost`, `Needline`); the qualified form `UPDM2::Node` is only in the t_xref row named `Stereotypes`. Measured on EA 17.1 build 1716
# by creating one object per row of the Resources tab in a test model and reading it back: 179 names bound, FQName `UPDM2::<name>`.
# The prefix is the profile name `UPDM2`, not the technology's display name `UPDM 2.0` and not `UPDM`: `UPDM::Node`, `UPDM2.0::Node` and
# `UPDM2.1::Node` are refused as an unknown type.
#
# WHAT THE VALIDATOR CAN SEE, AND WHAT IT CANNOT. A rule selects an element by the FIRST stereotype in t_object.Stereotype (a second stereotype, such as SysML's
# block on a Node, is only in t_xref), by its EA type and by its tagged values; selects a connector by its stereotype or its EA connector type (so a
# NoteLink, which has no stereotype, can be selected); counts connectors; and checks ownership (below). It cannot read what a part or port is typed by,
# follow a generalization, read numeric values or an element's attributes and operations, or see what an information flow
# conveys. Most of UPDM's typing rules and its level 1 SysML pairing are about those, so only 88 of the language skill's rules are in this
# file.
#
# OWNERSHIP RULES (contained_in, contains_count). An element's owner is the element it is attached to (t_object.ParentID, how EA nests a part, port,
# parameter, state, state machine or interaction under its class), else its package. "The owner of X must be Y" is a contained_in rule on X.
# "Every P owned by Y must be Q" is a contains_count rule on Y with max 0 over the stereotypes of the same kind (all the Part stereotypes, all the Port
# stereotypes ...) that are not Q: the grammar has a positive child filter only, so the wrong children are listed by name, as the relationship tables list
# the wrong ends. Such a rule is partial: a child with no stereotype or with another technology's stereotype is not seen.
#
# RELATIONSHIP TABLES. Each end rule has a table written from the language skill's end sets: "X or a specialization of X" is the set of stereotypes
# EA binds for X and for every concept that specializes it (Performer is a Node, Post is an OrganizationalResource and so on). A connector is judged
# only when both its ends carry a stereotype the table names (every stereotype EA binds to an element, part, port or package-element); an end
# with no stereotype, or with another technology's first stereotype, is not judged. Rows shared by many stereotypes are written once and reused with
# YAML anchors (&name and *name), which the validator's safe_load reads.
#
# CONNECTOR DIRECTION. For a Dependency the client is the start of the connector and the supplier the end; for an InformationFlow the information
# source is the start. The rules read the connector as EA stores it (Start_Object_ID, End_Object_ID).
#
# Sources:
#   [S1] OMG, Unified Profile for DoDAF and MODAF (UPDM) Version 2.1, formal/13-08-04
#   [S2] Sparx Systems, the UPDM technology built into Enterprise Architect 17.1 (the Resources tab shows UPDM 2.0, the API reports UPDM2 version 2.1)

meta:
  version: "0.1"
  language: updm-2
  organization: "(your organization)"
  mdg_family: UPDM2
  description: >
    Conformance rules for UPDM 2.1 models built with Sparx Enterprise Architect's UPDM technology: which kinds of element each relationship
    stereotype may join (the end rules of the standard's profile, with aliases and specializations expanded), what an IsCapableOfPerforming
    connector reaches from a node and from a system resource, the pairing of a Forecast, and which kind of element owns each part, state machine and trace
    and what each owner may hold. Each rule names the rules.md id it implements.
  severity_levels:
    error: A requirement of the standard (rules.md strength must)
    warning: Guidance of the standard (rules.md strength should)
    info: Advisory note; not a conformance violation

