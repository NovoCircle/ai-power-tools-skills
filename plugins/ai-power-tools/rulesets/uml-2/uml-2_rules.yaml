  - id: UML2-INF-005a
    name: An information item has no generalization (outgoing)
    implements: UML-INF-005
    description: An information item has no features, no generalizations and no associations. This rule reports a generalization
      leaving an InformationItem element. [OMG UML 2.5.1 (formal/17-12-05) 20.2.2.5 Constraints]
    category: information-flow
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: Features (attributes and operations) and aggregations are not checked.
    selector:
      type: element
      types:
        any_of:
        - InformationItem
    condition:
      type: connector_count
      connector_type: Generalization
      direction: outgoing
      max: 0
    remediation:
      short: Remove the generalization from the information item.
      auto_fixable: false

