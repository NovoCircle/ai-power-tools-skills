rules:
  - id: UML2-CLS-002
    name: A generalization joins two classifiers
    implements: UML-CLS-002
    description: A Generalization connector joins a specific classifier (the source) to a general classifier (the target);
      a note, a package, a decision or a text label is not a classifier. EA stores a classifier as a Class, Interface, Component,
      Node, Device, ExecutionEnvironment, Artifact, Actor, UseCase, Collaboration, DataType, PrimitiveType, Enumeration, Signal,
      Activity, StateMachine, Interaction, InformationItem, Association, Boundary, Entity or Requirement element; both ends
      must be one of these. [OMG UML 2.5.1 (formal/17-12-05) 9.9.4.8 Constraints]
    category: classification
    severity: error
    demo_trigger: true
    coverage: partial
    not_checked: 'That the two classifiers are of a valid pair (the standard says a classifier may specialize only classifiers
      of a valid type) is not checked: only that both ends are classifiers.'
    selector:
      type: connector
      connector_types:
      - Generalization
    condition:
      type: connector_endpoint_stereotype
      source_must_be_one_of:
      - type:Class
      - type:Interface
      - type:Component
      - type:Node
      - type:Device
      - type:ExecutionEnvironment
      - type:Artifact
      - type:Actor
      - type:UseCase
      - type:Collaboration
      - type:DataType
      - type:PrimitiveType
      - type:Enumeration
      - type:Signal
      - type:Activity
      - type:StateMachine
      - type:Interaction
      - type:InformationItem
      - type:Association
      - type:Boundary
      - type:Entity
      - type:Requirement
      target_must_be_one_of:
      - type:Class
      - type:Interface
      - type:Component
      - type:Node
      - type:Device
      - type:ExecutionEnvironment
      - type:Artifact
      - type:Actor
      - type:UseCase
      - type:Collaboration
      - type:DataType
      - type:PrimitiveType
      - type:Enumeration
      - type:Signal
      - type:Activity
      - type:StateMachine
      - type:Interaction
      - type:InformationItem
      - type:Association
      - type:Boundary
      - type:Entity
      - type:Requirement
    remediation:
      short: Draw the generalization between two classifiers.
      auto_fixable: false

  - id: UML2-UC-001
    name: A use case connector joins an actor, use case, component or class
    implements: UML-UC-001
    description: In EA the association between an actor and a use case is a connector of type UseCase (an include or extend
      is the same type with a stereotype). An actor may be associated only with use cases, components and classes, so both
      ends of a UseCase connector must be an Actor, UseCase, Component or Class. [OMG UML 2.5.1 (formal/17-12-05) 18.2.1.4
      Constraints]
    category: usecase
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: Plain Association connectors that have an actor at one end are not checked (a positive end list cannot say
      'if one end is an Actor, the other is ...'); that the association is binary is not stored.
    selector:
      type: connector
      connector_types:
      - UseCase
    condition:
      type: connector_endpoint_stereotype
      source_must_be_one_of:
      - type:Actor
      - type:UseCase
      - type:Component
      - type:Class
      target_must_be_one_of:
      - type:Actor
      - type:UseCase
      - type:Component
      - type:Class
    remediation:
      short: Join the actor to a use case, component or class.
      auto_fixable: false

  - id: UML2-PKG-001
    name: An extension joins a stereotype class to a metaclass class
    implements: UML-PKG-001
    description: An Extension runs from the stereotype to the metaclass it extends; the end the extension does not own is
      typed by a class. In EA a stereotype and a metaclass are Class elements (the stereotype carries the stereotype 'stereotype'),
      so both ends of an Extension connector must be Class elements. [OMG UML 2.5.1 (formal/17-12-05) 12.4.1.7 Constraints]
    category: profile
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: That the source is a stereotype and the target a metaclass is not checked (both are plain Class elements
      to the validator).
    selector:
      type: connector
      connector_types:
      - Extension
    condition:
      type: connector_endpoint_stereotype
      source_must_be_one_of:
      - type:Class
      target_must_be_one_of:
      - type:Class
    remediation:
      short: Draw the extension from a stereotype class to a metaclass class.
      auto_fixable: false

  - id: UML2-STD-003
    name: A call usage joins the classes that contain operations
    implements: UML-STD-003
    description: 'A Call usage has an operation as client and an operation as supplier, or the classes that contain them.
      EA connects elements, not operations, so the connector joins classifiers that own operations: a Class, Interface, Component,
      DataType, Node, Device, ExecutionEnvironment, Boundary or Entity. The stereotype is stored as ''call'' (plain string)
      or ''Call'' (StandardProfileL2). [OMG UML 2.5.1 (formal/17-12-05) 22.3]'
    category: standard-profile
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: 'That the operations themselves are the ends cannot be seen: EA connectors end on elements.'
    selector:
      type: connector
      connector_stereotypes:
      - call
      - Call
    condition:
      type: connector_endpoint_stereotype
      source_must_be_one_of:
      - type:Class
      - type:Interface
      - type:Component
      - type:DataType
      - type:Node
      - type:Device
      - type:ExecutionEnvironment
      - type:Boundary
      - type:Entity
      target_must_be_one_of:
      - type:Class
      - type:Interface
      - type:Component
      - type:DataType
      - type:Node
      - type:Device
      - type:ExecutionEnvironment
      - type:Boundary
      - type:Entity
    remediation:
      short: Join the classes (or classifiers) that own the calling and the called operation.
      auto_fixable: false

  - id: UML2-STD-004
    name: A send usage ends at a signal
    implements: UML-STD-004
    description: A Send usage has an operation as client and a signal as supplier. EA connects the class that owns the sending
      operation to the Signal element. The stereotype is stored as 'send' (plain string) or 'Send' (StandardProfileL2). [OMG
      UML 2.5.1 (formal/17-12-05) 22.3]
    category: standard-profile
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: 'That the client is an operation is not seen: EA connectors end on the owning class.'
