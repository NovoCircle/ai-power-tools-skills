# EA facts for the Zachman Framework (language file zachman), as Sparx Enterprise Architect's built-in ZF technology stores them.
# Generated from elements created in EA and read back, and from Sparx's model pattern;
# do not edit by hand. The framework is a classification schema: `concepts` maps the 20 concepts of the language skill to what EA offers,
# and `cell_recording` says how a model records a cell. Westbrook Bank appears only in howto.md, as an illustration.

language: zachman
technology: ZF
display_name: Zachman Framework
profile: ZF
stereotype_prefix: ''
stereotype_storage: bare name in t_object.Stereotype and t_connector.Stereotype (BusinessEntity, ZFCell, Communicate); the qualified form ZF::<name>
  is the FQName in the t_xref row named Stereotypes and is what AddNew takes. The Resources tab shows names with spaces and capitals ('Business
  Entity', 'Based On', 'Board Of Directors'); EA stores BusinessEntity, basedOn, BOD
