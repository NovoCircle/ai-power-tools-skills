      - Business Motivation Model
      - Organization Structure
      - Business Logistics
      - Business Process
      - Benefits
      TOGAF_DataArchitecture:
      - Data Map
      TOGAF Diagrams:
      - TOGAF Interface
      - Conceptual Framework
      - Architecture Content
      - Architecture Development
      - Service Model
      - Enterprise Continuum
      - Standards Information Base
