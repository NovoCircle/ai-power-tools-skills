diagram_types:
  RAAML:
    token: RAAML::RAAML
    stored_diagram_type: Logical
    style_ex: MDGDgm=RAAML::RAAML;
    standard_views:
    - FMEA (the FMEA pattern is drawn on it)
    - fault tree (the FTA pattern)
    note: Sparx's FMEA and fault tree examples are drawn on this type, although EA also lists a type for each (see Failure Mode
      and Effect Analysis and Fault Tree Analysis below); the standard defines no diagram type of its own
  RAAML - Core:
    token: RAAML::RAAML - Core
    stored_diagram_type: Logical
    style_ex: MDGDgm=RAAML::RAAML - Core;
    standard_views:
    - Core library and profile
  RAAML - General Concepts:
    token: RAAML::RAAML - General Concepts
    stored_diagram_type: Logical
    style_ex: MDGDgm=RAAML::RAAML - General Concepts;
    standard_views:
    - General concepts library and profile
  Systems Theoretic Process Analysis:
    token: RAAML::Systems Theoretic Process Analysis
    stored_diagram_type: Logical
    style_ex: MDGDgm=RAAML::Systems Theoretic Process Analysis;
    standard_views:
    - STPA control structure and loss scenarios
    note: the model pattern stores the token with ' - STPA' appended; that spelling does not bind
  Goal Structuring Notation:
    token: RAAML::Goal Structuring Notation
    stored_diagram_type: Logical
    style_ex: MDGDgm=RAAML::Goal Structuring Notation;
    standard_views:
    - GSN argument
    note: the ISO 26262 model pattern is drawn on 'Goal Structuring Notation - GSN', which does not bind (measured through the
      API)
  Failure Mode and Effect Analysis:
    listed_on_resources_tab: true
    created_on_screen: false
    token: not measured
    standard_views:
    - FMEA
    note: seen on the Resources tab and in the New Diagram dialog on 2026-11-04; no diagram of this type was created, so its stored
      token and toolbox pages were not read
  Fault Tree Analysis:
    listed_on_resources_tab: true
    created_on_screen: true
    properties_type_shown: Fault Tree Analysis - FTA
    token: not measured
    standard_views:
    - fault tree
    toolbox_pages_on_screen:
    - Core Profile
    - FTA Pattern
    - FTA GATE (AND, INHIBIT, MAJORITY VOTE, NOT, OR, SEQ, Tree, XOR)
    - FTA Library (nine constraint blocks and FTA Tree, UndevelopedEvent)
    - FTA EVENT (Basic, Conditional, Dormant, House, Intermediate, Top, Undeveloped, Zero Event)
    note: created in a copy of the model on 2026-11-04; the diagram's Properties show the type as 'Fault Tree Analysis - FTA'.
      Its stored token and style were not read
  ISO 26262 Road Vehicles - Functional Safety:
    listed_on_resources_tab: true
    created_on_screen: false
    token: not measured
    standard_views:
    - ISO 26262 concepts
    note: seen on the Resources tab and in the New Diagram dialog on 2026-11-04; the name was cut off at the panel edge, so the
      full name is not confirmed; no diagram of this type was created
