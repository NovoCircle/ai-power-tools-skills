  no_element_type:   # concepts that take no size class, each group with its reason
    drawn_as_text:
      reason: Shown as text inside or beside another symbol (a compartment line, a label, an expression), so there is no symbol to size.
      concepts: [AnyReceiveEvent, CallEvent, ChangeEvent, ClassifierTemplateParameter, ConnectableElementTemplateParameter, Duration, DurationInterval, EnumerationLiteral, Expression, ExtensionPoint, InstanceValue, InteractionConstraint, Interval, LiteralBoolean, LiteralInteger, LiteralNull, LiteralReal, LiteralSpecification, LiteralString, LiteralUnlimitedNatural, MultiplicityElement, OpaqueExpression, Operation, OperationTemplateParameter, Parameter, PartDecomposition, Property, Reception, RedefinableElement, SignalEvent, Slot, StringExpression, StructuralFeature, TemplateParameterSubstitution, TimeEvent, TimeExpression, TimeInterval, Trigger]
    drawn_as_line_or_line_end:
      reason: Shown as a line, an arrow or the end of a line, so there is no symbol to size. The relationship kinds under `notation.relationships` are lines too.
      concepts: [Abstraction, ActivityEdge, Association, CommunicationPath, ComponentRealization, Connector, ConnectorEnd, ControlFlow, Dependency, Deployment, DurationConstraint, DurationObservation, ElementImport, ExceptionHandler, Extend, Extension, ExtensionEnd, GeneralOrdering, Generalization, GeneralizationSet, Include, InformationFlow, InterfaceRealization, IntervalConstraint, Manifestation, Message, ObjectFlow, Observation, PackageImport, PackageMerge, ProfileApplication, ProtocolTransition, Realization, Substitution, TemplateBinding, TimeConstraint, TimeObservation, Transition, Usage]
    drawn_as_marker:
      reason: Shown as a mark where a line meets another symbol, or as an icon in place of a symbol, so there is no symbol to size.
      concepts: [ExecutionOccurrenceSpecification, Image, MessageOccurrenceSpecification, OccurrenceSpecification]
    not_drawn:
      reason: The standard gives these no drawing of their own (abstract, or shown only through their subclasses).
      concepts: see `notation.not_specified`
  exceptions: {}
  diagram_types:   # only the departures from the defaults (graph, frame-header); the other twelve take the defaults
    Sequence diagram: {arrangement: type-fixed}   # order of lifelines and messages is the layout
    Timing diagram: {arrangement: type-fixed}   # timelines on a time axis
