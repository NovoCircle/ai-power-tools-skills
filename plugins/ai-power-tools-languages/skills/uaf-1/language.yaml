# Unified Architecture Framework (UAF) 1.0: language file (schema_version 1).
# Written from the standard only (UAFP formal/17-12-01 and domain metamodel formal/17-12-02). Tool-neutral.
schema_version: 1
id: uaf-1
name: Unified Architecture Framework (UAF)
owner: {name: Object Management Group, kind: standards-body}
standard: {name: Unified Architecture Framework Profile (UAFP) and its Domain Metamodel (DMM), version: '1.0', status: published, reference: 'OMG formal/17-12-01 (UAFP specification, clauses 1 to 7, Annex A informative, Annex B class library) and formal/17-12-02 (Appendix A, the domain metamodel, normative), October 2017 on the OMG page (covers say November 2017); https://www.omg.org/spec/UAF/1.0/. Normative machine-readable files UAFP_Profile.xmi (dtc/17-05-15) and Class-Library-UAF.xmi (dtc/17-05-16) were not read; every fact here is from the text of the two documents. Later versions 1.1, 1.2 and 1.3 exist and are not described.'}
notes: 'UAF is a framework: a grid of viewpoints (domains by model kinds), a domain metamodel, and a language (a profile on SysML 1.4) derived from the metamodel. Concepts here are the profile elements, named as the profile writes them (no spaces). The language builds on SysML 1.4; SysML elements named as bases (Block, Requirement, Allocate, ItemFlow, DeriveReqt, InterfaceBlock, ProxyPort, ValueType, View, Viewpoint) are listed under base and are described in the SysML language file, not here. Relationship multiplicity is never stated; all relationships are many-to-many by default. Multiplicity keys on properties are the standard''s own.'
concepts:
  source: 'UAFP 1.0 clause 7.1 (226 elements: generalizations, abstract flags, extended UML metaclass, attributes, association ends as the entries state them) and the domain metamodel DMM 3.1 (195 elements; the 9 that are not in the profile are added with defined_in: [dmm]). The ''kind'' key is this library''s classification (relationship, usage, actual, behavior, annotation, enumeration, abstract, type). Definitions are in our own words. 33 profile elements are abstract (34 with the metamodel-only SecurityMeasurement).'
  elements:
    Alias:
      display: Alias
      category: Dictionary
      kind: annotation
      specializes: [MeasurableElement]
      uml_base: Comment
      defined_in: [uafp, dmm]
      section: 7.1.1
      definition: An alternative name recorded for an element.
      attributes: [{name: nameOwner, type: String, multiplicity: '*'}]
    Definition:
      display: Definition
      category: Dictionary
      kind: annotation
      specializes: [MeasurableElement]
      uml_base: Comment
      defined_in: [uafp, dmm]
      section: 7.1.1
      definition: A textual description of an element of the architecture.
      attributes: [{name: author, type: String, multiplicity: '*'}]
    SameAs:
      display: Same As
      category: Dictionary
      kind: relationship
      specializes: [MeasurableElement]
      uml_base: Dependency
      defined_in: [uafp, dmm]
      section: 7.1.1
      definition: Asserts that two elements denote the same real-world thing.
    ActualCondition:
      display: Actual Condition
      category: Parameters
      kind: actual
      specializes: [ActualPropertySet]
      uml_base: InstanceSpecification
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: The actual situation of an environment or location, with a time span.
      typing: {classifier: Condition}
    ActualEnvironment:
      display: Actual Environment
      category: Parameters
      kind: actual
      specializes: [ActualCondition]
      uml_base: InstanceSpecification
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: The actual circumstances of an Environment.
      typing: {classifier: Environment}
    ActualLocation:
      display: Actual Location
      category: Parameters
      kind: actual
      specializes: [ActualCondition]
      uml_base: InstanceSpecification
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: An actual physical place, described for example by an address or coordinates.
      attributes: [{name: address, type: String, multiplicity: '0..1'}, {name: customKind, type: String, multiplicity: '0..1'}, {name: locationNamedByAddress, type: Boolean, multiplicity: '1'}]
      association_ends: {locationKind: 'LocationKind[1]'}
      typing: {classifier: Location}
    ActualMeasurement:
      display: Actual Measurement
      category: Parameters
      kind: actual
      specializes: [ActualState]
      uml_base: Slot
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: A real, required or estimated value given to a Measurement.
      association_ends: {intention: 'ActualMeasurementKind[1]'}
      typing: {definingFeature: Measurement, owningInstance: ActualPropertySet}
    ActualMeasurementKind:
      display: Actual Measurement Kind
      category: Parameters
      kind: enumeration
      defined_in: [uafp]
      section: 7.1.2
      definition: Says whether an ActualMeasurement is a real-world value, a required value or an estimate.
      literals: [Actual, Required, Estimate]
    ActualMeasurementSet:
      display: Actual Measurement Set
      category: Parameters
      kind: actual
      specializes: [ActualPropertySet]
      uml_base: InstanceSpecification
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: A group of ActualMeasurements.
      association_ends: {appliesFor: 'MeasurableElement[*]'}
      typing: {classifier: MeasurementSet, slot: ActualMeasurement}
    ActualPropertySet:
      display: Actual Property Set
      category: Parameters
      kind: actual
      specializes: [ActualState]
      uml_base: InstanceSpecification
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: A group of actual property values held by an element.
      typing: {classifier: PropertySet}
    Condition:
      display: Condition
      category: Parameters
      kind: type
      specializes: [PropertySet]
      base: [ValueType]
      uml_base: DataType
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: The location, environment or geopolitical extent in which an activity can be performed.
    Environment:
      display: Environment
      category: Parameters
      kind: type
      specializes: [Condition]
      uml_base: DataType
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: The environmental factors in which something exists or works.
      association_ends: {kind: 'EnvironmentKind[1]'}
    EnvironmentKind:
      display: Environment Kind
      category: Parameters
      kind: enumeration
      defined_in: [uafp]
      section: 7.1.2
      definition: The kind of an Environment.
      literals: [TerrainType, WeatherConditions, LightConditions, CBRNEnvironment, SituationType]
    EnvironmentProperty:
      display: Environment Property
      category: Parameters
      kind: usage
      specializes: [MeasurableElement]
      uml_base: Property
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: A property of an Environment typed by a Condition (a Location, GeoPoliticalExtentType or Environment).
      typing: {class: Environment, type: Condition}
    GeoPoliticalExtentType:
      display: Geo Political Extent Type
      category: Parameters
      kind: type
      specializes: [ResourceExchangeItem, OperationalExchangeItem, Condition]
      uml_base: DataType
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: A geospatial extent whose borders are set by agreement or declaration of political parties.
      attributes: [{name: customKind, type: String, multiplicity: '0..1'}]
      association_ends: {kind: 'GeoPoliticalExtentTypeKind[1]'}
    GeoPoliticalExtentTypeKind:
      display: Geo Political Extent Type Kind
      category: Parameters
      kind: enumeration
      defined_in: [uafp]
      section: 7.1.2
      definition: The kind of a GeoPoliticalExtentType.
      literals: [GeoFeatureType, RegionOfCountryType, CountryType, RegionOfWorldType, FacilityType, SiteType, InstallationType, OtherType]
    Location:
      display: Location
      category: Parameters
      kind: type
      specializes: [ConceptItem, Condition]
      uml_base: DataType
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: The general area in which a LocationHolder must be.
      attributes: [{name: customKind, type: String, multiplicity: '0..1'}]
      association_ends: {kind: 'LocationTypeKind[1]'}
    LocationHolder:
      display: Location Holder
      category: Parameters
      kind: abstract
      abstract: true
      specializes: [UAFElement]
      uml_base: Element
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: Grouping of elements that may be tied to a Location.
      association_ends: {physicalLocation: 'ActualLocation[0..*]', requiredEnvironment: 'Environment[0..*]'}
    LocationKind:
      display: Location Kind
      category: Parameters
      kind: enumeration
      defined_in: [uafp]
      section: 7.1.2
      definition: The shape or form of an ActualLocation.
      literals: [SolidVolume, Surface, Line, Point, GeoStationaryPoint, PlanarSurface, PolygonArea, RectangularArea, ElipticalArea, CircularArea, Other]
    LocationTypeKind:
      display: Location Type Kind
      category: Parameters
      kind: enumeration
      defined_in: [uafp]
      section: 7.1.2
      definition: The shape or form of a Location type.
      literals: [OtherType, SolidVolumeType, SurfaceType, LineType, PointType, GeoStationaryPointType, PlanarSurfaceType, PolygonAreaType, RectangularAreaType, ElipticalAreaType, CircularAreaType]
    MeasurableElement:
      display: Measurable Element
      category: Parameters
      kind: abstract
      abstract: true
      specializes: [UAFElement]
      uml_base: Element
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: Grouping of elements to which MeasurementSets can be applied.
      association_ends: {actualMeasurementSet: 'ActualMeasurementSet[*]', measurementSet: 'MeasurementSet[*]'}
    Measurement:
      display: Measurement
      category: Parameters
      kind: usage
      specializes: [MeasurableElement]
      uml_base: Property
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: A measurable property of something in the physical world, in a unit of measure.
      association_ends: {environmentalContext: 'Condition[0..1]'}
      typing: {class: PropertySet}
    MeasurementSet:
      display: Measurement Set
      category: Parameters
      kind: type
      specializes: [PropertySet]
      base: [ValueType]
      uml_base: DataType
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: A collection of Measurements.
      association_ends: {appliesFor: 'MeasurableElement[*]'}
    PropertySet:
      display: Property Set
      category: Parameters
      kind: abstract
      abstract: true
      specializes: [UAFElement]
      uml_base: Element
      defined_in: [uafp, dmm]
      section: 7.1.2
      definition: Grouping of architectural elements that can own Measurements.
    ActualState:
      display: Actual State
      category: Metadata::Taxonomy
      kind: abstract
      abstract: true
      specializes: [UAFElement]
      uml_base: Element
      defined_in: [uafp, dmm]
      section: 7.1.3.1
      definition: Gives a time span (start and end) to elements realized as instances.
      attributes: [{name: endDate, type: ISO8601DateTime, multiplicity: '0..1'}, {name: startDate, type: ISO8601DateTime, multiplicity: '0..1'}]
    ISO8601DateTime:
      display: ISO8601 Date Time
      category: Metadata::Taxonomy
      kind: type
      specializes: [UAFElement]
      uml_base: LiteralString
      defined_in: [uafp, dmm]
      section: 7.1.3.1
      definition: A date and time written in the ISO 8601 format with time zone.
    Exchange:
      display: Exchange
      category: Metadata::Connectivity
      kind: relationship
      abstract: true
      specializes: [MeasurableElement]
      base: [ItemFlow]
      uml_base: InformationFlow
      defined_in: [uafp, dmm]
      section: 7.1.3.2
      definition: Grouping of OperationalExchange and ResourceExchange, the flows of Resources.
    Resource:
      display: Resource
      category: Metadata::Connectivity
      kind: abstract
      abstract: true
      specializes: [PropertySet]
      uml_base: Element
      defined_in: [uafp, dmm]
      section: 7.1.3.2
      definition: Grouping of everything an Exchange can convey.
    Activity:
      display: Activity
      category: Metadata::Processes
      kind: abstract
      abstract: true
      specializes: [MeasurableElement]
      uml_base: Activity
      defined_in: [uafp, dmm]
      section: 7.1.3.3
      definition: Grouping of behaviors (OperationalActivity, Function) that a performer can carry out.
      association_ends: {activityPerformableUnderCondition: 'Condition[*]'}
    CapableElement:
      display: Capable Element
      category: Metadata::Processes
      kind: abstract
      abstract: true
      specializes: [UAFElement]
      uml_base: Element
      defined_in: [uafp, dmm]
      section: 7.1.3.3
      definition: Grouping of structural elements that can perform behavior.
    IsCapableToPerform:
      display: Is Capable To Perform
      category: Metadata::Processes
      kind: relationship
      specializes: [MeasurableElement]
      base: [Allocate]
      uml_base: Abstraction
      defined_in: [uafp, dmm]
      section: 7.1.3.3
      definition: Traces a CapableElement to an Activity it can perform.
    PerformsInContext:
      display: Performs In Context
      category: Metadata::Processes
      kind: relationship
      specializes: [MeasurableElement]
      base: [Allocate]
      uml_base: Abstraction
      defined_in: [uafp, dmm]
      section: 7.1.3.3
      definition: Says a role performs an action in a particular context or configuration.
    ArchitectureMetadata:
      display: Architecture Metadata
      category: Metadata::Information
      kind: annotation
      specializes: [Metadata]
      uml_base: Comment
      defined_in: [uafp, dmm]
      section: 7.1.3.4
      definition: Extra facts about an ArchitecturalDescription, such as method and notation used.
    Information:
      display: Information
      category: Metadata::Information
      kind: annotation
      specializes: [MeasurableElement]
      uml_base: Comment
      defined_in: [uafp, dmm]
      section: 7.1.3.4
      definition: Describes the state of something of interest in any medium.
      association_ends: {informationKind: 'InformationKind[1]'}
    InformationKind:
      display: Information Kind
      category: Metadata::Information
      kind: enumeration
      defined_in: [uafp]
      section: 7.1.3.4
      definition: The kind of an Information item.
      literals: [Information, DomainInformation, PositionReferenceFrame, PedigreeInformation, Data]
    Metadata:
      display: Metadata
      category: Metadata::Information
      kind: annotation
      specializes: [MeasurableElement]
      uml_base: Comment
      defined_in: [uafp, dmm]
      section: 7.1.3.4
      definition: A comment attached to any element that links it to a semantic-web style category and scheme.
      attributes: [{name: category, type: String, multiplicity: '0..1'}, {name: dublinCoreElement, type: String, multiplicity: '0..1'}, {name: metaDataScheme, type: String, multiplicity: '0..1'}, {name: name, type: String, multiplicity: '0..1'}]
    Rule:
      display: Rule
      category: Metadata::Constraints
      kind: abstract
      abstract: true
      specializes: [MeasurableElement]
      uml_base: Constraint
      defined_in: [uafp, dmm]
      section: 7.1.3.5
      definition: Grouping of every kind of constraint.
      association_ends: {ruleKind: 'RuleKind[1]'}
    RuleKind:
      display: Rule Kind
      category: Metadata::Constraints
      kind: enumeration
      defined_in: [uafp]
      section: 7.1.3.5
      definition: The kind of a Rule.
      literals: [StructuralAssertion, ActionAssertion, Derivation, Contract, Constraint, Guidance, SecurityPolicy, Caveat]
    ArchitecturalReference:
      display: Architectural Reference
      category: Metadata::Traceability
      kind: relationship
      specializes: [MeasurableElement]
      uml_base: Dependency
      defined_in: [uafp, dmm]
      section: 7.1.3.6
      definition: States that one architectural description refers to another.
    Implements:
      display: Implements
      category: Metadata::Traceability
      kind: relationship
      specializes: [MeasurableElement]
      base: [Allocate]
      uml_base: Abstraction
      defined_in: [uafp, dmm]
      section: 7.1.3.6
      definition: Traces an element at a lower level of abstraction to the equivalent element it implements above.
    ActualEnterprisePhase:
      display: Actual Enterprise Phase
      category: Strategic::Taxonomy
      kind: actual
      specializes: [ActualPropertySet, CapableElement, Achiever]
      uml_base: InstanceSpecification
      defined_in: [uafp, dmm]
      section: 7.1.4.1
      definition: An actual phase of an enterprise endeavor, with dates.
      association_ends: {goal: 'EnterpriseGoal[*]', operationalArchitectureOfEnterprisePhase: 'OperationalArchitecture[*]', resourceArchitectureOfEnterprisePhase: 'ResourceArchitecture[*]', statementTask: 'ActualEnduringTask[*]', vision: 'EnterpriseVision[*]'}
      typing: {classifier: EnterprisePhase}
    Capability:
      display: Capability
      category: Strategic::Taxonomy
      kind: type
      specializes: [PropertySet, Desirer]
      base: [Block]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.4.1
      definition: An enterprise's ability to achieve a desired effect, measured by specified measures.
    EnterpriseGoal:
      display: Enterprise Goal
      category: Strategic::Taxonomy
      kind: type
      specializes: [PropertySet]
      base: [Requirement]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.4.1
      definition: A continuing state or condition the enterprise wants to bring about; amplifies a vision.
      attributes: [{name: benefits, type: String, multiplicity: '0..*'}]
      association_ends: {enterprisePhase: 'ActualEnterprisePhase[*]'}
    EnterprisePhase:
      display: Enterprise Phase
      category: Strategic::Taxonomy
      kind: type
      specializes: [PropertySet, CapableElement]
      base: [Block]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.4.1
      definition: A current or future state of the whole-life enterprise or of another phase.
    EnterpriseVision:
      display: Enterprise Vision
      category: Strategic::Taxonomy
      kind: type
      specializes: [PropertySet]
      base: [Block]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.4.1
      definition: The future state the enterprise wants, without saying how to reach it.
      attributes: [{name: statement, type: VisionStatement, multiplicity: '*'}]
      association_ends: {enterprisePhase: 'ActualEnterprisePhase[0..1]'}
    VisionStatement:
      display: Vision Statement
      category: Strategic::Taxonomy
      kind: annotation
      specializes: [MeasurableElement]
      uml_base: Comment
      defined_in: [uafp, dmm]
      section: 7.1.4.1
      definition: A comment that words an EnterpriseVision.
    WholeLifeEnterprise:
      display: Whole Life Enterprise
      category: Strategic::Taxonomy
      kind: type
      specializes: [EnterprisePhase]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.4.1
      definition: A purposeful endeavor of any size made of structural and temporal parts.
    CapabilityProperty:
      display: Capability Property
      category: Strategic::Structure
      kind: usage
      specializes: [MeasurableElement]
      uml_base: Property
      defined_in: [uafp, dmm]
      section: 7.1.4.2
      definition: A Capability used as a part of another Capability.
      typing: {class: Capability, type: Capability}
    StructuralPart:
      display: Structural Part
      category: Strategic::Structure
      kind: usage
      specializes: [MeasurableElement]
      uml_base: Property
      defined_in: [uafp]
      section: 7.1.4.2
      definition: An EnterprisePhase used as a spatial part of another.
      typing: {class: EnterprisePhase, type: EnterprisePhase}
    TemporalPart:
      display: Temporal Part
      category: Strategic::Structure
      kind: usage
      specializes: [MeasurableElement]
      uml_base: Property
      defined_in: [uafp]
      section: 7.1.4.2
      definition: An EnterprisePhase used as a temporal part of another.
      typing: {class: EnterprisePhase, type: EnterprisePhase}
    ActualEnduringTask:
      display: Actual Enduring Task
      category: Strategic::Processes
      kind: actual
      specializes: [CapableElement, ActualPropertySet]
      uml_base: InstanceSpecification
      defined_in: [uafp, dmm]
      section: 7.1.4.3
      definition: An actual undertaking the enterprise treats as essential to its goals.
      typing: {classifier: EnduringTask}
    CapabilityForTask:
      display: Capability For Task
      category: Strategic::Processes
      kind: relationship
      specializes: [MeasurableElement]
      base: [Allocate]
      uml_base: Abstraction
      defined_in: [uafp, dmm]
      section: 7.1.4.3
      definition: Says a Capability is needed for an enterprise to conduct a phase of an enduring task.
    EnduringTask:
      display: Enduring Task
      category: Strategic::Processes
      kind: type
      specializes: [PropertySet]
      base: [Block]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.4.3
      definition: A template for a strategic statement of what the enterprise does.
    AchievedEffect:
      display: Achieved Effect
      category: Strategic::States
      kind: relationship
      specializes: [MeasurableElement]
      uml_base: Dependency
      defined_in: [uafp, dmm]
      section: 7.1.4.4
      definition: Links an achiever's actual state to the desired effect it attempts to meet.
      association_ends: {desiredEffect: 'DesiredEffect[*]'}
    Achiever:
      display: Achiever
      category: Strategic::States
      kind: abstract
      abstract: true
      specializes: [UAFElement]
      uml_base: InstanceSpecification
      defined_in: [uafp, dmm]
      section: 7.1.4.4
      definition: Grouping of actual elements that can deliver a desired effect.
    DesiredEffect:
      display: Desired Effect
      category: Strategic::States
      kind: relationship
      specializes: [MeasurableElement]
      uml_base: Dependency
      defined_in: [uafp, dmm]
      section: 7.1.4.4
      definition: Links a desirer to the actual state it wants.
      association_ends: {achievedEffect: 'AchievedEffect[*]'}
    Desirer:
      display: Desirer
      category: Strategic::States
      kind: abstract
      abstract: true
      specializes: [UAFElement]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.4.4
      definition: Grouping of elements that can desire an effect.
    Exhibits:
      display: Exhibits
      category: Strategic::Traceability
      kind: relationship
      specializes: [MeasurableElement]
      base: [Allocate]
      uml_base: Abstraction
      defined_in: [uafp, dmm]
      section: 7.1.4.5
      definition: Says a capable element meets a Capability under given conditions.
      association_ends: {environmentalConditions: 'Environment[*]'}
    MapsToCapability:
      display: Maps To Capability
      category: Strategic::Traceability
      kind: relationship
      specializes: [MeasurableElement]
      base: [Allocate]
      uml_base: Abstraction
      defined_in: [uafp, dmm]
      section: 7.1.4.5
      definition: Says an Activity contributes to providing a Capability.
    OrganizationInEnterprise:
      display: Organization In Enterprise
      category: Strategic::Traceability
      kind: relationship
      specializes: [MeasurableElement]
      base: [Allocate]
      uml_base: Abstraction
      defined_in: [uafp, dmm]
      section: 7.1.4.5
      definition: Places an actual organization in an actual enterprise phase.
    ArbitraryConnector:
      display: Arbitrary Connector
      category: Operational::Taxonomy
      kind: relationship
      specializes: [MeasurableElement]
      uml_base: Dependency
      defined_in: [uafp]
      section: 7.1.5.1
      definition: A drawn link between concept roles in a high-level operational concept.
    ConceptItem:
      display: Concept Item
      category: Operational::Taxonomy
      kind: abstract
      abstract: true
      specializes: [UAFElement]
      uml_base: Element
      defined_in: [uafp, dmm]
      section: 7.1.5.1
      definition: Grouping of items that can appear in a high-level operational concept.
    ConceptRole:
      display: Concept Role
      category: Operational::Taxonomy
      kind: usage
      specializes: [MeasurableElement]
      uml_base: Property
      defined_in: [uafp]
      section: 7.1.5.1
      definition: A ConceptItem used within a high-level operational concept.
      typing: {class: HighLevelOperationalConcept, type: ConceptItem}
    HighLevelOperationalConcept:
      display: High Level Operational Concept
      category: Operational::Taxonomy
      kind: type
      specializes: [PropertySet]
      base: [Block]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.5.1
      definition: The resources and locations needed for an operational scenario, seen as a whole.
    KnownResource:
      display: Known Resource
      category: Operational::Structure
      kind: type
      specializes: [OperationalPerformer, ResourcePerformer]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.5.2
      definition: A known resource that plays a part in the operational architecture.
    OperationalAgent:
      display: Operational Agent
      category: Operational::Structure
      kind: abstract
      abstract: true
      specializes: [Asset, SubjectOfOperationalConstraint, CapableElement, Desirer]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.5.2
      definition: Grouping of operational performers and operational architectures.
    OperationalArchitecture:
      display: Operational Architecture
      category: Operational::Structure
      kind: type
      specializes: [OperationalAgent, Architecture]
      uml_base: Class
      defined_in: [uafp, dmm]
      section: 7.1.5.2
