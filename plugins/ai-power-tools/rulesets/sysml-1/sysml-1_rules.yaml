  - id: SYSML1-MOD-004
    name: A view conforms to one viewpoint
    implements: SYSML-MOD-004
    description: 'A view conforms to a single viewpoint: it is the source of at most one conform. EA stores a conform as a
      connector stereotyped conform that starts at the view. [OMG SysML 1.5 (formal/17-05-01) 7.3.2.7 [1]]'
    category: mod
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: element
      stereotypes:
        any_of:
        - view
    condition:
      type: connector_count
      connector_stereotype: conform
      direction: outgoing
      max: 1
    remediation:
      short: Keep one conform on the view, or split the view into one view per viewpoint.
      auto_fixable: false

  - id: SYSML1-REQ-007
    name: A requirement has an id and a text
    implements: SYSML-REQ-007
    description: Every requirement has a text and an id. In EA's SysML technology the seven requirement kinds (requirement,
      functionalRequirement, interfaceRequirement, performanceRequirement, physicalRequirement, designConstraint, extendedRequirement)
      carry the tagged values id and text (lower case), stored empty until set. The rule reports a requirement whose id or
      text is empty. [OMG SysML 1.5 (formal/17-05-01) 16.3.2.1 (attributes)]
    category: req
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: 'That the id is unique: the rule checks that an id is present, not that no other requirement uses it.'
    selector:
      type: element
      stereotypes:
        any_of:
        - requirement
        - functionalRequirement
        - interfaceRequirement
        - performanceRequirement
        - physicalRequirement
        - designConstraint
        - extendedRequirement
    condition:
      type: tagged_value_required
      tags:
      - name: id
        must_be_non_empty: true
      - name: text
        must_be_non_empty: true
    remediation:
      short: Fill in the tagged values id and text.
      auto_fixable: false

  - id: SYSML1-REQ-009
    name: A copy joins two requirements
    implements: SYSML-REQ-009
    description: A copy dependency is created only between two named elements that carry a requirement kind. In EA's SysML
      technology it is a Dependency stereotyped copy; both ends must carry one of the seven requirement stereotypes. [OMG
      SysML 1.5 (formal/17-05-01) 16.3.2.2 [1]]
    category: req
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: connector
      connector_stereotype: copy
    condition:
      type: connector_endpoint_stereotype
      source_must_be_one_of:
      - requirement
      - functionalRequirement
      - interfaceRequirement
      - performanceRequirement
      - physicalRequirement
      - designConstraint
      - extendedRequirement
      target_must_be_one_of:
      - requirement
      - functionalRequirement
      - interfaceRequirement
      - performanceRequirement
      - physicalRequirement
      - designConstraint
      - extendedRequirement
    remediation:
      short: Draw the copy between two requirements.
      auto_fixable: false

