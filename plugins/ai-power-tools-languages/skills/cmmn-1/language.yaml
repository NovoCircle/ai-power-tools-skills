# Case Management Model and Notation (CMMN) 1.1: language file (schema_version 1).
# Written from the standard only. Concept names are the standard's own class names (no spaces).
# Keys beyond the base guide shape: conformance_types, concepts.groups,
# concepts.variants, concepts.enumerations, concepts.elements[].abstract_stated (false = the standard does not say whether the class
# is abstract), relationships.items (with kind) and relationships.diagram_links, lifecycles, decorators, conventions.shapes,
# diagram_types.CMMNDiagram.scope, and on each constraint: applies_when, checkable and note.
#   constraints[].applies_when : omitted = always; execution = only when a case is executed (clause 8 semantics).
#   constraints[].checkable    : static = a validator that sees only the saved model can check it; partial = only the structure,
#                                simple cases or reading the drawing; runtime = needs a running case instance; none = not a property
#                                of a model (a requirement on tools, drawing or explanation).
#   constraints[].note         : how the rule was read where the standard is inconsistent, or what the schema allows instead.
#   Strength policy: must = error, should = warning, note = advice only.
#   relationships[].multiplicity: targets_per_source is how many target instances one source instance may link to;
#                                sources_per_target is given only where the standard states it; '*' means zero or more.
schema_version: 1
id: cmmn-1
name: Case Management Model and Notation (CMMN)
owner: {name: Object Management Group, kind: standards-body}
standard: {name: Case Management Model and Notation (CMMN), version: '1.1', status: published, reference: 'OMG formal/16-12-01 (PDF, December 2016); changebar edition formal/16-12-02. Normative machine-readable files: CMMN11.xsd (dtc/15-11-06), CMMN11CaseModel.xsd (dtc/15-11-20), CMMNDI11.xsd (dtc/15-11-07), DC.xsd, DI.xsd, CMMN11.xmi (dtc/15-12-05), CMMNDI11.xmi (dtc/15-12-03), under https://www.omg.org/spec/CMMN/20151109/. https://www.omg.org/spec/CMMN/1.1/', supersedes: '1.0', newer_version: none found}
conformance_types:
  VisualNotation:
    section: '2.2'
    requires: Use the standard's shapes, markers and decorators (clause 6); size, fill, line color and label position are free; extensions may add decorators, shapes and colors but not change a defined shape or conflict with CMMN or BPMN shapes and line styles. For entry-level tools.
  CaseModeling:
    section: '2.3'
    requires: The full metamodel (clause 5), the full notation (clause 6), the execution semantics as Table 2.1 lists (clause 8), and the exchange format. For modeling-only tools. Should also meet Visual Notation Conformance.
  BPMNCompatibility:
    section: '2.4'
    requires: The optional alternative shapes of 6.8.2.1 (case task) and 6.8.3.1 (process task) become required. For tools that support both BPMN and CMMN.
  DMNCompatibility:
    section: '2.5'
    requires: The optional alternative shapes of 6.8.4.1 (decision task) become required. For tools that support both DMN and CMMN.
  Complete:
    section: '2.6'
    requires: Metamodel, notation, diagram interchange, execution semantics (clause 8) and exchange format. For tools that model and execute cases.
    rules_apply_when: execution
concepts:
  source: 'OMG CMMN 1.1: the metamodel of clause 5 (and the diagram interchange classes of clause 7.4) with generalizations, abstract flags and multiplicities taken from the case model schema CMMN11CaseModel.xsd where the text is silent. 65 concept classes: 58 in the case model (clause 5) and 7 diagram interchange classes (7.4). Named uses that are not classes (the case plan model, blocking and non-blocking tasks, discretionary tasks) are under variants.'
  groups:
    Foundation: {defined_by: 'Clauses 5.1, 5.4.7', notes: 'Base class, documentation, containers, imports, extension and external-relationship hooks, expressions.'}
    Case model: {defined_by: Clause 5.2, notes: The case and its roles.}
    Information model: {defined_by: 'Clauses 5.1.4, 5.3', notes: 'The case file, its items, their definitions and properties.'}
    Plan model: {defined_by: Clause 5.4 (5.4.1 to 5.4.9), notes: 'Plan item definitions and uses, event listeners, milestones, stages, sentries and criteria, planning tables.'}
    Tasks: {defined_by: Clause 5.4.10, notes: 'The four task kinds, their parameters, and the external processes and decisions they call.'}
    Item control: {defined_by: Clause 5.4.11, notes: The plan item control and its three rules.}
    Artifacts: {defined_by: Clause 5.5, notes: Association and text annotation.}
    Diagram interchange: {defined_by: Clause 7.4, notes: Metamodel for exchanging the layout and look of a diagram.}
  elements:
    CMMNElement: {display: CMMN Element, category: Foundation, abstract: true, section: 5.1.1, attributes: [{name: id, type: String, section: '5.1.1, Table 5.1'}]}
    Documentation: {display: Documentation, category: Foundation, specializes: CMMNElement, section: 5.1.1.1, attributes: [{name: text, type: String, section: '5.1.1.1, Table 5.2'}, {name: textFormat, type: String, default: 'text/plain', section: '5.1.1.1, Table 5.2'}]}
    Definitions: {display: Definitions, category: Foundation, section: 5.1.2, note: 'Outermost container of every interchange. The schema type is not an extension of the common element type (it has its own id), although Table 5.3 gives it the extension attributes; its generalization is left unstated.', attributes: [{name: name, type: String, section: '5.1.2, Figure 5.2'}, {name: targetNamespace, type: URI, section: '5.1.2, Figure 5.2'}, {name: expressionLanguage, type: URI, section: '5.1.2, Figure 5.2'}, {name: exporter, type: String, section: '5.1.2, Figure 5.2'}, {name: exporterVersion, type: String, section: '5.1.2, Figure 5.2'}, {name: author, type: String, section: '5.1.2, Figure 5.2'}, {name: creationDate, type: DateTime, section: '5.1.2, Figure 5.2'}]}
    Import: {display: Import, category: Foundation, section: 5.1.3, attributes: [{name: importType, type: String, section: '5.1.3, Figure 5.2'}, {name: location, type: String, section: '5.1.3, Figure 5.2'}, {name: namespace, type: URI, section: '5.1.3, Figure 5.2'}]}
    Expression: {display: Expression, category: Foundation, specializes: CMMNElement, section: 5.4.7, note: The schema type is the mixed-content variant of the common element type., attributes: [{name: language, type: URI, section: '5.4.7, Table 5.33'}, {name: body, type: String, section: '5.4.7, Table 5.33'}]}
    Extension: {display: Extension, category: Foundation, section: 5.1.5.1, note: Not used when the XML schema is the exchange format (extension is by any attribute and any element)., attributes: [{name: mustUnderstand, type: Boolean, multiplicity: 0..1, default: 'false', section: '5.1.5.1, Table 5.9'}]}
    ExtensionDefinition: {display: Extension Definition, category: Foundation, section: 5.1.5.2, note: Not used when the XML schema is the exchange format., attributes: [{name: name, type: String, section: '5.1.5.2, Table 5.10'}]}
    ExtensionAttributeDefinition: {display: Extension Attribute Definition, category: Foundation, section: 5.1.5.3, note: Not used when the XML schema is the exchange format., attributes: [{name: name, type: String, section: '5.1.5.3, Table 5.11'}, {name: type, type: String, section: '5.1.5.3, Table 5.11'}, {name: isReference, type: Boolean, multiplicity: 0..1, default: 'false', section: '5.1.5.3, Table 5.11'}]}
    ExtensionAttributeValue: {display: Extension Attribute Value, category: Foundation, section: 5.1.5.4, note: Not used when the XML schema is the exchange format., attributes: [{name: value, type: Element, multiplicity: 0..1, section: '5.1.5.4, Table 5.12'}, {name: valueRef, type: Element, multiplicity: 0..1, section: '5.1.5.4, Table 5.12'}]}
    Relationship: {display: Relationship, category: Foundation, specializes: CMMNElement, section: 5.1.6, attributes: [{name: type, type: String, section: '5.1.6, Table 5.13'}, {name: direction, type: RelationshipDirection, section: '5.1.6, Table 5.13'}]}
    Case: {display: Case, category: Case model, specializes: CMMNElement, section: 5.2.1, attributes: [{name: name, type: String, section: '5.2.1, Table 5.14'}]}
    Role: {display: Role, category: Case model, specializes: CMMNElement, section: 5.2.2, attributes: [{name: name, type: String, section: '5.2.2, Table 5.15'}]}
    CaseFile: {display: Case File, category: Information model, specializes: CMMNElement, section: 5.3.1, note: Generalization from the schema.}
    CaseFileItem: {display: Case File Item, category: Information model, specializes: CMMNElement, section: 5.3.2, note: Generalization from the schema., attributes: [{name: name, type: String, section: '5.3.2, Table 5.17'}, {name: multiplicity, type: MultiplicityEnum, section: '5.3.2, Table 5.17'}]}
    CaseFileItemDefinition: {display: Case File Item Definition, category: Information model, specializes: CMMNElement, section: 5.1.4, note: Generalization from the schema., attributes: [{name: name, type: String, section: '5.1.4, Figure 5.2'}, {name: definitionType, type: URI, section: '5.1.4, Figure 5.2'}, {name: structureRef, type: QName, section: '5.1.4, Figure 5.2'}]}
    Property: {display: Property, category: Information model, specializes: CMMNElement, section: 5.1.4.1, note: Generalization from the schema., attributes: [{name: name, type: String, section: '5.1.4.1, Figure 5.2'}, {name: type, type: URI, section: '5.1.4.1, Figure 5.2'}]}
    PlanItemDefinition: {display: Plan Item Definition, category: Plan model, abstract: true, specializes: CMMNElement, section: 5.4.1, attributes: [{name: name, type: String, section: '5.4.1, Table 5.18'}]}
    EventListener: {display: Event Listener, category: Plan model, specializes: PlanItemDefinition, section: 5.4.2, abstract_stated: false, note: Described as a base for the timer and user kinds; the standard does not call it abstract and the schema allows it directly.}
    TimerEventListener: {display: Timer Event Listener, category: Plan model, specializes: EventListener, section: 5.4.2.1}
    UserEventListener: {display: User Event Listener, category: Plan model, specializes: EventListener, section: 5.4.2.2}
    StartTrigger: {display: Start Trigger, category: Plan model, abstract: true, specializes: CMMNElement, section: 5.4.2.1.1}
    CaseFileItemStartTrigger: {display: Case File Item Start Trigger, category: Plan model, specializes: StartTrigger, section: 5.4.2.1.2, attributes: [{name: standardEvent, type: CaseFileItemTransition, section: '5.4.2.1.2, Table 5.20'}]}
    PlanItemStartTrigger: {display: Plan Item Start Trigger, category: Plan model, specializes: StartTrigger, section: 5.4.2.1.3, attributes: [{name: standardEvent, type: PlanItemTransition, section: '5.4.2.1.3, Table 5.21'}]}
    Milestone: {display: Milestone, category: Plan model, specializes: PlanItemDefinition, section: 5.4.3}
    PlanFragment: {display: Plan Fragment, category: Plan model, specializes: PlanItemDefinition, section: 5.4.4}
    Stage: {display: Stage, category: Plan model, specializes: PlanFragment, section: 5.4.8, attributes: [{name: autoComplete, type: Boolean, default: 'false', section: '5.4.8, Figure 5.10'}]}
    PlanItem: {display: Plan Item, category: Plan model, specializes: CMMNElement, section: 5.4.5, attributes: [{name: name, type: String, section: '5.4.5, Figure 5.8'}]}
    Criterion: {display: Criterion, category: Plan model, abstract: true, specializes: CMMNElement, section: 5.4.5.1, attributes: [{name: name, type: String, section: '5.4.5.1, Figure 5.8'}]}
    EntryCriterion: {display: Entry Criterion, category: Plan model, specializes: Criterion, section: 5.4.5.2}
    ExitCriterion: {display: Exit Criterion, category: Plan model, specializes: Criterion, section: 5.4.5.3}
    Sentry: {display: Sentry, category: Plan model, specializes: CMMNElement, section: 5.4.6, attributes: [{name: name, type: String, section: '5.4.6, Table 5.26'}]}
    OnPart: {display: On Part, category: Plan model, abstract: true, specializes: CMMNElement, section: 5.4.6.1, attributes: [{name: name, type: String, multiplicity: 0..1, section: '5.4.6.1, Table 5.27'}]}
    CaseFileItemOnPart: {display: Case File Item On Part, category: Plan model, specializes: OnPart, section: 5.4.6.2, attributes: [{name: standardEvent, type: CaseFileItemTransition, section: '5.4.6.2, Table 5.28'}]}
    PlanItemOnPart: {display: Plan Item On Part, category: Plan model, specializes: OnPart, section: 5.4.6.3, attributes: [{name: standardEvent, type: PlanItemTransition, section: '5.4.6.3, Table 5.30'}]}
    IfPart: {display: If Part, category: Plan model, specializes: CMMNElement, section: 5.4.6.4}
    TableItem: {display: Table Item, category: Plan model, specializes: CMMNElement, section: 5.4.9.1, abstract_stated: false, note: The text does not say abstract; the schema marks it abstract.}
    PlanningTable: {display: Planning Table, category: Plan model, specializes: TableItem, section: 5.4.9}
    DiscretionaryItem: {display: Discretionary Item, category: Plan model, specializes: TableItem, section: 5.4.9.2, attributes: [{name: name, type: String, section: '5.4.9.2, Table 5.37'}]}
    ApplicabilityRule: {display: Applicability Rule, category: Plan model, specializes: CMMNElement, section: 5.4.9.3, attributes: [{name: name, type: String, section: '5.4.9.3, Table 5.38'}]}
    Task: {display: Task, category: Tasks, specializes: PlanItemDefinition, section: 5.4.10, abstract_stated: false, note: Described as the base class of all tasks; the standard does not call it abstract and the schema allows it directly (a plain task has no kind)., attributes: [{name: isBlocking, type: Boolean, default: 'true', section: '5.4.10, Table 5.39'}]}
