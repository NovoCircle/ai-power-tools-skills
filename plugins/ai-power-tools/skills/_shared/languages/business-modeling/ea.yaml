quick_links:
  status: read on screen, measured on EA 17.1 build 1716, 2026-11-04; one source, the Business Use Case 'Open Business Account'
  result: 'only ''Requirement'' and ''Common'' (and Create Multiple Elements): no business-modeling quick link'
conventions:
  worker_and_entity_element_type: Object. The stereotypes are refused on a Class, Interface, Artifact and Actor.
  generalization_direction: from the specialization (case worker) to the generalization (worker)
  realisation_direction: from the business use-case realization to the business use case
  association_keyword_direction: from the From element to the To element, as drawn; the OMG direction of communication is the direction of navigability
    (not stored by the ruleset)
  package_kinds: typed keywords on a Package; a work unit holds its entities directly, an object model holds its object system directly
harvest:
  ea_build: 17.1 build 1716
  stereotype_list: 'ui: Resources tab, read by computer use; 10 names, plus entity, boundary, control from
    the same EAUML list'
  metaclasses_binding_prefixes_diagram_token: 'api: created through COM in a test model and read back'
  typed_keywords: 'api: read back through COM'
  samples_in_ea: 'model-pattern: two business patterns, 4 diagrams'
  toolbox_quick_links: 'ui, EA 17.1 build 1716, 2026-11-04: the Business Modeling toolbox page and the quick links of one Business Use Case were read; the
    EAUML profile rows were not recounted'
