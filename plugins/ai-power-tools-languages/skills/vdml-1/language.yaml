  strength: note
  section: 7.1.14, p. 26
  checkable: none
- id: VDML-CONF-006
  statement: When models are integrated, each library (capability, business item, value, role) of the result must be a superset of the corresponding libraries of the models being integrated, the organization structure must be reconciled so overlapping OrgUnits are merged, and delegated flows, business items and value adds must be reconciled.
  strength: note
  section: 7.1.15, p. 27
  checkable: none
notes: 'VDML 1.0, October 2015. VDML 1.1 (March 2018) exists and is not covered. The standard defines a limited normative graphical notation of eight diagram types (clause 8) and no viewpoint catalogue as such; Annex B (informative) maps VDML to other techniques. Measurement is delegated to SMM: VDML elements carry MeasuredCharacteristics, SMM supplies measures, characteristics, measurements and observations. Multiplicity keys: ''*'' means zero or more.'

layout:
  basis: Our conventions, not this standard's. Sizes and spacing come from the shared layout standard;
    this block says only which size class each concept takes and how each diagram type is arranged.
  element_types:
    Activity: box
    BusinessNetwork: box
    Capability: box
    CapabilityCategory: box
    CapabilityDefinition: box
    CapabilityMethod: box
    CapabilityOffer: box
    Collaboration: box
    Community: box
    MeasuredCharacteristic: box
    OrgUnit: box
    Position: box
    Role: box
    Pool: data-item
    Store: data-item
    InputPort: attached-item
    OutputPort: attached-item
    ValueProposition: small-node
  no_element_type:
    no_shape_of_its_own:
      reason: The standard gives these no shape. A value add is shown by filling a port, a business item
        by the label of a flow, and an actor by its name as plain text at the end of a connector.
      concepts:
      - Actor
      - BusinessItem
      - ValueAdd
    drawn_as_line:
      reason: These concepts are lines (and the relationships under `notation.relationships` are lines
        too), so there is no symbol to size.
      concepts:
      - Assignment
      - DeliverableFlow
      - InputDelegation
      - OutputDelegation
    not_drawn:
      reason: The standard gives these no drawing of their own.
