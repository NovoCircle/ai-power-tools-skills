  - id: RAAML1-REL-001
    name: "The client of RelevantTo is a situation"
    implements: RAAML-REL-001
    description: "The client of a RelevantTo relationship is a Situation. In Sparx's RAAML technology a situation is a class carrying the stereotype Situation or one of the situation markers (FMEAItem, FailureMode, the event and gate kinds, UnsafeControlAction and the others in the table); RelevantTo is a Dependency whose source is the client. A RelevantTo that starts at a known non-situation (a Goal, a Controller and so on, or an element that is no class: a requirement, actor or use case with no stereotype) is reported. [OMG RAAML 1.0 (formal/22-12-06) 9.1.2 (RelevantTo) [1], p. 23]"
    category: rel
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "A class with no situation stereotype can still be a situation by generalization (the standard does not require the marker), and the validator cannot follow a generalization to its root, so such a class is not reported. An element of another EA type with no RAAML stereotype (a requirement, actor, use case, component, node, artifact or note) can never be a situation and is reported."
    selector:
      type: "connector"
      connector_stereotype: "RelevantTo"
    condition:
      type: "relationship_table"
      table: "raaml-1-situation-client"
      unknown_endpoint: "ignore"
    remediation:
      short: "Draw RelevantTo from a situation (a class with the Situation marker or a situation kind) to the element that gives it context."
      auto_fixable: false

  - id: RAAML1-REL-002
    name: "The supplier of a controlling measure is a situation"
    implements: RAAML-REL-002
    description: "The supplier of a controlling measure (Detection, Prevention, Mitigation, Recommendation) is a Situation; the client is any element. Each is a Dependency whose target is the supplier. A measure whose supplier is a known non-situation is reported. [OMG RAAML 1.0 (formal/22-12-06) 9.1.2 (ControllingMeasure) [1], p. 23]"
    category: rel
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "A class with no situation stereotype can still be a situation by generalization (the standard does not require the marker), and the validator cannot follow a generalization to its root, so such a class is not reported. An element of another EA type with no RAAML stereotype (a requirement, actor, use case, component, node, artifact or note) can never be a situation and is reported."
    selector:
      type: "connector"
      connector_stereotypes: ["Detection", "Prevention", "Mitigation", "Recommendation"]
    condition:
      type: "relationship_table"
      table: "raaml-1-measure-supplier"
      unknown_endpoint: "ignore"
    remediation:
      short: "Point the measure at the situation it addresses (the supplier end)."
      auto_fixable: false

  - id: RAAML1-REL-003
    name: "The client of Violates is a situation"
    implements: RAAML-REL-003
    description: "The client of a Violates relationship is a Situation; the supplier is the requirement or constraint that is violated. A Violates that starts at a known non-situation is reported. [OMG RAAML 1.0 (formal/22-12-06) 9.1.2 (Violates) [1], p. 24]"
    category: rel
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "A class with no situation stereotype can still be a situation by generalization (the standard does not require the marker), and the validator cannot follow a generalization to its root, so such a class is not reported. An element of another EA type with no RAAML stereotype (a requirement, actor, use case, component, node, artifact or note) can never be a situation and is reported."
    selector:
      type: "connector"
      connector_stereotype: "Violates"
    condition:
      type: "relationship_table"
      table: "raaml-1-situation-client"
      unknown_endpoint: "ignore"
    remediation:
      short: "Draw Violates from the situation to the requirement it violates."
      auto_fixable: false

  - id: RAAML1-REL-005
    name: "Causality joins two situations"
    implements: RAAML-REL-005
    description: "Every Causality relationship, and every specialization of it (Activation, ErrorPropagation, ErrorRealization, ProcessModelFactor, ProcessModelConsequence, UnsafeControlActionHarmPotential), joins two situations. A connector with a known non-situation at either end is reported. [OMG RAAML 1.0 (formal/22-12-06) 9.1.1 (Causality), p. 21]"
    category: rel
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "A class with no situation stereotype can still be a situation by generalization (the standard does not require the marker), and the validator cannot follow a generalization to its root, so such a class is not reported. An element of another EA type with no RAAML stereotype (a requirement, actor, use case, component, node, artifact or note) can never be a situation and is reported. That an Activation runs from a cause to a dysfunctional event, and ErrorPropagation and ErrorRealization between dysfunctional events (RAAML-REL-006 to 008), is not checked: all of them carry the marker Situation, so the validator cannot tell them apart."
    selector:
      type: "connector"
      connector_stereotypes: ["Causality", "Activation", "ErrorPropagation", "ErrorRealization", "ProcessModelFactor", "ProcessModelConsequence", "UnsafeControlActionHarmPotential"]
    condition:
      type: "relationship_table"
      table: "raaml-1-causality"
      unknown_endpoint: "ignore"
    remediation:
      short: "Join situations only; a cause, failure mode, event or effect class carries a situation stereotype."
      auto_fixable: false

  - id: RAAML1-SIT-001
    name: "A situation specializes another class"
    implements: RAAML-SIT-001
    description: "Every situation specializes AnySituation, directly or through intermediate situations. In Sparx's RAAML technology a user situation is a class that carries a situation marker and has a Generalization to a library or user situation. The rule reports a class carrying one of the situation markers below (the events, gates, trees and FMEA items are judged by RAAML1-MARK-001, 002, 003 and 006) that has no Generalization going out. [OMG RAAML 1.0 (formal/22-12-06) 9.1.1, p. 20; 7.3, p. 12]"
    category: sit
    severity: warning
    demo_trigger: false
    coverage: partial
    not_checked: "That the generalization leads to the library class itself, directly or through a chain, is not checked: the rule reports a class that specializes nothing. EA stores a generalization from the specific class (source) to the general one (target); the library classes are a model pattern, not elements this rule can name. A marker applied to a property typed by a library class (a Part) is not judged. The library classes themselves (AnySituation, the Any* conditions, FTATree, UndevelopedEvent) are left out of the selector."
    selector:
      type: "element"
      stereotypes:
        any_of: ["Situation", "Event", "Fault", "Error", "Factor", "ProcessModel", "UnsafeControlAction", "FailureMode", "MalfunctioningBehavior", "OperationalSituation", "LossScenario"]
    condition:
      type: "connector_count"
      connector_type: "Generalization"
      direction: "outgoing"
      min: 1
    remediation:
      short: "Draw a Generalization from the situation to the situation it specializes (ultimately AnySituation)."
      auto_fixable: false

  - id: RAAML1-MARK-001
    name: "The Tree marker is on a class that specializes FTATree"
    implements: RAAML-MARK-001
    description: "The Tree marker applies only to a class that specializes FTATree. The rule reports a class stereotyped Tree that has no Generalization going out. [OMG RAAML 1.0 (formal/22-12-06) 9.4.2 (Tree) [1], p. 57]"
    category: mark
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "That the generalization leads to the library class itself, directly or through a chain, is not checked: the rule reports a class that specializes nothing. EA stores a generalization from the specific class (source) to the general one (target); the library classes are a model pattern, not elements this rule can name. A marker applied to a property typed by a library class (a Part) is not judged."
    selector:
      type: "element"
      stereotypes:
        any_of: ["Tree"]
    condition:
      type: "connector_count"
      connector_type: "Generalization"
      direction: "outgoing"
      min: 1
    remediation:
      short: "Draw a Generalization from the class to FTATree, or remove the Tree marker."
      auto_fixable: false

  - id: RAAML1-MARK-002
    name: "An event marker is on a class that specializes the library event"
    implements: RAAML-MARK-002
    description: "A fault tree event marker (DormantEvent, BasicEvent, ConditionalEvent, ZeroEvent, HouseEvent, IntermediateEvent, TopEvent) applies only to a class that specializes the library event of the same name. The rule reports a class carrying one of these markers that has no Generalization going out. [OMG RAAML 1.0 (formal/22-12-06) 9.4.2 (each marker) [1], pp. 58-68]"
    category: mark
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "That the generalization leads to the library class itself, directly or through a chain, is not checked: the rule reports a class that specializes nothing. EA stores a generalization from the specific class (source) to the general one (target); the library classes are a model pattern, not elements this rule can name. A marker applied to a property typed by a library class (a Part) is not judged."
    selector:
      type: "element"
      stereotypes:
        any_of: ["DormantEvent", "BasicEvent", "ConditionalEvent", "ZeroEvent", "HouseEvent", "IntermediateEvent", "TopEvent"]
    condition:
      type: "connector_count"
      connector_type: "Generalization"
      direction: "outgoing"
      min: 1
    remediation:
      short: "Draw a Generalization from the event class to the library event of the same name, or remove the marker."
      auto_fixable: false

  - id: RAAML1-MARK-003
    name: "A gate marker is on a class that specializes the library gate"
    implements: RAAML-MARK-003
    description: "A fault tree gate marker (AND, OR, SEQ, XOR, INHIBIT, MAJORITY VOTE, NOT) applies only to a class that specializes the library gate of the same name. The rule reports a class carrying one of these markers that has no Generalization going out. [OMG RAAML 1.0 (formal/22-12-06) 9.4.2 (each marker) [1], pp. 62-67]"
    category: mark
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "That the generalization leads to the library class itself, directly or through a chain, is not checked: the rule reports a class that specializes nothing. EA stores a generalization from the specific class (source) to the general one (target); the library classes are a model pattern, not elements this rule can name. A marker applied to a property typed by a library class (a Part) is not judged."
    selector:
      type: "element"
      stereotypes:
        any_of: ["AND", "OR", "NOT", "XOR", "SEQ", "INHIBIT", "MAJORITY VOTE"]
    condition:
      type: "connector_count"
      connector_type: "Generalization"
      direction: "outgoing"
      min: 1
    remediation:
      short: "Draw a Generalization from the gate class to the library gate of the same name, or remove the marker."
      auto_fixable: false

  - id: RAAML1-MARK-006
    name: "The FMEAItem marker is on a class that specializes AbstractFMEAItem"
    implements: RAAML-MARK-006
    description: "The FMEAItem marker applies only to a class that specializes AbstractFMEAItem. The rule reports a class stereotyped FMEAItem that has no Generalization going out. [OMG RAAML 1.0 (formal/22-12-06) 9.3.2 (FMEAItem) [1], p. 44]"
    category: mark
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "That the generalization leads to the library class itself, directly or through a chain, is not checked: the rule reports a class that specializes nothing. EA stores a generalization from the specific class (source) to the general one (target); the library classes are a model pattern, not elements this rule can name. A marker applied to a property typed by a library class (a Part) is not judged."
    selector:
      type: "element"
      stereotypes:
        any_of: ["FMEAItem"]
    condition:
      type: "connector_count"
      connector_type: "Generalization"
      direction: "outgoing"
      min: 1
    remediation:
      short: "Draw a Generalization from the FMEA item class to AbstractFMEAItem, or remove the marker."
      auto_fixable: false

  - id: RAAML1-GSN-001
    name: "The client of InContextOf is a goal or a strategy"
    implements: RAAML-GSN-001
    description: "The client of an InContextOf relationship is a Goal or a Strategy. Any other GSN node as the client is reported. [OMG RAAML 1.0 (formal/22-12-06) 9.6.1 (InContextOf) [1], p. 87]"
    category: gsn
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "A client or supplier with no GSN stereotype is not judged (the standard allows a non-GSN element as the supplier)."
    selector:
      type: "connector"
      connector_stereotype: "InContextOf"
    condition:
      type: "relationship_table"
      table: "raaml-1-incontextof-client"
      unknown_endpoint: "ignore"
    remediation:
      short: "Attach context, assumptions and justifications to a goal or a strategy."
      auto_fixable: false

  - id: RAAML1-GSN-002
    name: "The supplier of InContextOf is contextual information"
    implements: RAAML-GSN-002
    description: "The supplier of an InContextOf relationship is contextual information (a Context, Assumption or Justification) or a non-GSN element, never another kind of GSN node. A supplier that is a Goal, Strategy or Solution is reported. [OMG RAAML 1.0 (formal/22-12-06) 9.6.1 (InContextOf) [2], p. 87]"
    category: gsn
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: "connector"
      connector_stereotype: "InContextOf"
    condition:
      type: "relationship_table"
      table: "raaml-1-incontextof-supplier"
      unknown_endpoint: "ignore"
    remediation:
      short: "Use InContextOf only to a context, assumption or justification; use SupportedBy between goals, strategies and solutions."
      auto_fixable: false

  - id: RAAML1-GSN-004
    name: "The client of SupportedBy is a goal or a strategy"
    implements: RAAML-GSN-004
    description: "The client of a SupportedBy relationship is a Goal or a Strategy. A Solution, Context, Assumption or Justification as the client is reported. [OMG RAAML 1.0 (formal/22-12-06) 9.6.1 (SupportedBy) [1], p. 88]"
    category: gsn
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "A client with no GSN stereotype is not judged."
    selector:
      type: "connector"
      connector_stereotype: "SupportedBy"
    condition:
      type: "relationship_table"
      table: "raaml-1-supportedby-client"
      unknown_endpoint: "ignore"
    remediation:
      short: "Let a goal or a strategy be supported by other nodes; a solution, context, assumption or justification supports, it is not supported."
      auto_fixable: false

  - id: RAAML1-GSN-005
    name: "A strategy is supported by goals"
    implements: RAAML-GSN-005
    description: "When the client of a SupportedBy relationship is a Strategy, the supplier is a Goal. A strategy supported by a Solution, another Strategy or a contextual node is reported. [OMG RAAML 1.0 (formal/22-12-06) 9.6.1 (SupportedBy) [2], p. 88]"
    category: gsn
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: "connector"
      connector_stereotype: "SupportedBy"
    condition:
      type: "relationship_table"
      table: "raaml-1-supportedby-strategy"
      unknown_endpoint: "ignore"
    remediation:
      short: "Break a strategy down into goals, and support those goals with solutions."
      auto_fixable: false

  - id: RAAML1-GSN-006
    name: "The supplier of SupportedBy is not contextual information"
    implements: RAAML-GSN-006
    description: "The supplier of a SupportedBy relationship is a GSN node (goal, strategy or solution) or a non-GSN element, never contextual information. A Context, Assumption or Justification as the supplier is reported. [OMG RAAML 1.0 (formal/22-12-06) 9.6.1 (SupportedBy) [3], p. 88]"
    category: gsn
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: "connector"
      connector_stereotype: "SupportedBy"
    condition:
      type: "relationship_table"
      table: "raaml-1-supportedby-supplier"
      unknown_endpoint: "ignore"
    remediation:
      short: "Attach contextual information with InContextOf, not SupportedBy."
      auto_fixable: false

  - id: RAAML1-CARD-001
    name: "An FMEA item has exactly one failure mode"
    implements: RAAML-CARD-001
    description: "An FMEA item has exactly one failure mode. In Sparx's RAAML technology the failure mode is joined to the item by an Association stereotyped FailureMode; the rule counts those connectors that end at the FMEAItem. [OMG RAAML 1.0 (formal/22-12-06) 9.3.1 (AbstractFMEAItem), p. 39]"
    category: card
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "The count assumes the part is drawn to the whole, the direction of Sparx's own FMEA model pattern (cause, failure mode and effect classes are the source, the FMEA item the target). A connector drawn the other way is not counted. A failure mode held as a part property (a Port or a typed part) is not counted: containment is not reachable."
    selector:
      type: "element"
      stereotypes:
        any_of: ["FMEAItem"]
    condition:
      type: "connector_count"
      connector_stereotype: "FailureMode"
      direction: "incoming"
      min: 1
      max: 1
    remediation:
      short: "Join exactly one failure mode to the FMEA item with a FailureMode connector."
      auto_fixable: false

  - id: RAAML1-CARD-002
    name: "An FMEA item has at least one cause"
    implements: RAAML-CARD-002
    description: "An FMEA item has at least one cause, joined to the item by an Association stereotyped Cause; the rule counts those connectors that end at the FMEAItem. [OMG RAAML 1.0 (formal/22-12-06) 9.3.1 (AbstractFMEAItem), p. 39]"
    category: card
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "The count assumes the part is drawn to the whole, the direction of Sparx's own FMEA model pattern (cause, failure mode and effect classes are the source, the FMEA item the target). A connector drawn the other way is not counted. A cause held as a part property is not counted."
    selector:
      type: "element"
      stereotypes:
        any_of: ["FMEAItem"]
    condition:
      type: "connector_count"
      connector_stereotype: "Cause"
      direction: "incoming"
      min: 1
    remediation:
      short: "Join at least one cause to the FMEA item with a Cause connector."
      auto_fixable: false

  - id: RAAML1-CARD-003
    name: "An FMEA item has at least one final effect"
    implements: RAAML-CARD-003
    description: "An FMEA item has at least one final effect. EA has no connector stereotype for a final effect; Sparx's technology holds it as a Port stereotyped finalEffect that sits under the item (the item is the port's owner, ParentID). The rule counts those ports. [OMG RAAML 1.0 (formal/22-12-06) 9.3.1 (AbstractFMEAItem), p. 39]"
    category: card
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "Only a Port stereotyped finalEffect that is owned by the item is counted. A final effect held as an untyped part, an attribute or a class joined by a plain Association is not counted, and that the effect is typed by a library effect class is not checked."
    selector:
      type: "element"
      stereotypes:
        any_of: ["FMEAItem"]
    condition:
      type: "contains_count"
      child: {stereotype_one_of: ["finalEffect"]}
      min: 1
    remediation:
      short: "Add a finalEffect port to the FMEA item (one per final effect)."
      auto_fixable: false

  - id: RAAML1-CARD-004
    name: "An FMEA item has no harm potential"
    implements: RAAML-CARD-004
    description: "An FMEA item has no harm potential: the standard redefines the property to multiplicity zero because the method does not use it. Sparx's technology holds a harm potential as a Port stereotyped harmPotential under its owner. The rule reports an FMEA item that owns one. [OMG RAAML 1.0 (formal/22-12-06) 9.3.1 (AbstractFMEAItem), p. 39]"
    category: card
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "Only a Port stereotyped harmPotential that is owned by the item is counted. A harm potential held as an untyped part or an attribute is not."
    selector:
      type: "element"
      stereotypes:
        any_of: ["FMEAItem"]
    condition:
      type: "contains_count"
      child: {stereotype_one_of: ["harmPotential"]}
      max: 0
    remediation:
      short: "Remove the harmPotential port from the FMEA item."
      auto_fixable: false

  - id: RAAML1-CARD-005
    name: "A fault tree has exactly one top event"
    implements: RAAML-CARD-005
    description: "A fault tree has exactly one top event. The FTATree stereotype carries a tagged value TopEvent; the rule reports an FTATree whose TopEvent is empty. [OMG RAAML 1.0 (formal/22-12-06) 9.4.1 (FTATree), p. 45]"
    category: card
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "Only the tagged value of an element with the stereotype FTATree is read. A tree modeled as a class with the Tree marker and a typed part is not judged, and that the tagged value names a TopEvent is not checked."
    selector:
      type: "element"
      stereotypes:
        any_of: ["FTATree"]
    condition:
      type: "tagged_value_required"
      tags:
      - name: TopEvent
        must_be_non_empty: true
    remediation:
      short: "Set the TopEvent tagged value of the fault tree to its top event."
      auto_fixable: false

  - id: RAAML1-CARD-006
    name: "A gate has exactly one output event"
    implements: RAAML-CARD-006
    description: "A gate (AND, OR, NOT, XOR, SEQ, MAJORITY VOTE) has exactly one output event. The rule counts the Associations that leave the gate, whether or not they carry the stereotype output, and reports a gate with none or with more than one. Sparx's FTA Pattern (read on screen, EA 17.1 build 1716, 2026-11-04) joins events and gates with plain Associations that carry no stereotype: an input runs from the event (source) to the gate (target) and the output runs from the gate (source) to the top event (target). [OMG RAAML 1.0 (formal/22-12-06) 9.4.1 (Gate), p. 50]"
    category: card
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "INHIBIT is not covered: its enabling conditions are also Associations (stereotyped condition) and a pattern that shows their direction does not exist, and a count by connector type cannot leave them out. Every Association that leaves the gate is counted, so a Causality or any other Association on a gate is counted too. An output drawn from the event to the gate (the way an earlier version of this ruleset and its samples drew it) is not counted and the gate is reported as having no output."
    selector:
      type: "element"
      stereotypes:
        any_of: ["AND", "OR", "NOT", "XOR", "SEQ", "MAJORITY VOTE"]
    condition:
      type: "connector_count"
      connector_type: "Association"
      direction: "outgoing"
      min: 1
      max: 1
    remediation:
      short: "Draw exactly one Association from the gate to its output event, as Sparx's FTA Pattern does."
      auto_fixable: false

  - id: RAAML1-CARD-008
    name: "A NOT gate has exactly one input event"
    implements: RAAML-CARD-008
    description: "A NOT gate has exactly one input event. The rule counts the Associations that enter the gate, whether or not they carry the stereotype input, and reports a gate with none or with more than one. Sparx's FTA Pattern (read on screen, EA 17.1 build 1716, 2026-11-04) joins events and gates with plain Associations that carry no stereotype: an input runs from the event (source) to the gate (target) and the output runs from the gate (source) to the top event (target). [OMG RAAML 1.0 (formal/22-12-06) 9.4.1 (NOT; NOTConstraintBlock), pp. 51, 56]"
    category: card
    severity: warning
    demo_trigger: false
    coverage: partial
    not_checked: "Every Association that enters the gate is counted, so a Causality or any other Association on a NOT gate is counted too. An input drawn from the gate to the event is not counted. The pattern holds no NOT gate; its AND gate shows the wiring."
    selector:
      type: "element"
      stereotypes:
        any_of: ["NOT"]
    condition:
      type: "connector_count"
      connector_type: "Association"
      direction: "incoming"
      min: 1
      max: 1
    remediation:
      short: "Draw exactly one Association from the input event to the NOT gate, as Sparx's FTA Pattern does for inputs."
      auto_fixable: false

  - id: RAAML1-CARD-017
    name: "An ASIL assignment has an ASIL value"
    implements: RAAML-CARD-017
    description: "An ASIL assignment has exactly one ASIL value (and at most one override value). The ASILAssignment stereotype carries the tagged values ASIL and ASILOverride; the rule reports an assignment whose ASIL is empty. [OMG RAAML 1.0 (formal/22-12-06) 9.7.2 (ASILAssignment), p. 112]"
    category: card
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "That the value is one of the ASIL levels is not checked: the tagged value is free text. ASILAssignment extends any UML element, so it is usually a second stereotype on a requirement or a situation; only an element whose first stereotype is ASILAssignment is read."
    selector:
      type: "element"
      stereotypes:
        any_of: ["ASILAssignment"]
    condition:
      type: "tagged_value_required"
      tags:
      - name: ASIL
        must_be_non_empty: true
    remediation:
      short: "Set the ASIL tagged value (QM, A, B, C or D)."
      auto_fixable: false

  - id: RAAML1-CARD-018
    name: "A Verified or Confirmed marker carries a result"
    implements: RAAML-CARD-018
    description: "A Verified or Confirmed marker carries exactly one result. Both stereotypes carry the tagged value result; the rule reports one whose result is empty. [OMG RAAML 1.0 (formal/22-12-06) 9.7.2 (Verified; Confirmed), p. 110]"
    category: card
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: "element"
      stereotypes:
        any_of: ["Verified", "Confirmed"]
    condition:
      type: "tagged_value_required"
      tags:
      - name: result
        must_be_non_empty: true
    remediation:
      short: "Set the result tagged value."
      auto_fixable: false

  - id: RAAML1-CARD-019
    name: "An identifier carrier holds an identifier"
    implements: RAAML-CARD-019
    description: "An identifier carrier holds exactly one identifier string. The `ID carrier` stereotype carries the tagged value ID; the rule reports a carrier whose ID is empty. [OMG RAAML 1.0 (formal/22-12-06) 9.1.2 (IDCarrier), p. 24]"
    category: card
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "ID carrier extends any UML element, so it is usually a second stereotype on the element that has the identifier (a goal, a requirement); only an element whose first stereotype is ID carrier is read. A first stereotype is the only one t_object.Stereotype holds."
    selector:
      type: "element"
      stereotypes:
        any_of: ["ID carrier"]
    condition:
      type: "tagged_value_required"
      tags:
      - name: ID
        must_be_non_empty: true
    remediation:
      short: "Set the ID tagged value (for example G1)."
      auto_fixable: false

  - id: RAAML1-STPA-001
    name: "The STPA causal links join the right kinds"
    implements: RAAML-STPA-001
    description: "ProcessModelFactor joins a Factor to a ProcessModel; ProcessModelConsequence joins a ProcessModel to an UnsafeControlAction; UnsafeControlActionHarmPotential joins an UnsafeControlAction to a harm potential (a situation). [OMG RAAML 1.0 (formal/22-12-06) 9.5.1, pp. 77-78]"
    category: stpa
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: "A connector is judged only when both ends carry a stereotype the table names (or no stereotype at all); an end with another stereotype (for example SysML's block) is not judged. A harm potential is a library class carrying the Situation marker, so any situation is accepted as the target."
    selector:
      type: "connector"
      connector_stereotypes: ["ProcessModelFactor", "ProcessModelConsequence", "UnsafeControlActionHarmPotential"]
    condition:
      type: "relationship_table"
      table: "raaml-1-stpa-links"
      unknown_endpoint: "ignore"
    remediation:
      short: "Draw factor to process model to unsafe control action to harm potential, in that order."
      auto_fixable: false

  - id: RAAML1-STPA-002
    name: "An unsafe control action is tied to its control action"
    implements: RAAML-STPA-002
    description: "An unsafe control action has four parts: the controller (inferred), the guideword (given by generalization), the control action (linked by RelevantTo) and the context (a sub-situation). The rule checks the RelevantTo link only. [OMG RAAML 1.0 (formal/22-12-06) 9.5.1 (UnsafeControlAction), p. 74]"
    category: stpa
    severity: warning
    demo_trigger: false
    coverage: partial
    not_checked: "The guideword (a generalization), the controller and the context (a part) are not checked, nor that the supplier of the RelevantTo is a control action."
    selector:
      type: "element"
      stereotypes:
        any_of: ["UnsafeControlAction"]
    condition:
      type: "connector_count"
      connector_stereotype: "RelevantTo"
      direction: "outgoing"
      min: 1
    remediation:
      short: "Link the unsafe control action to its control action with RelevantTo."
      auto_fixable: false

  - id: RAAML1-ISO-008
    name: "A UserInfoRequirement runs from a state to a functional or technical safety requirement"
    implements: RAAML-ISO-008
    description: "A UserInfoRequirement runs from a state (client) to a functional or technical safety requirement (supplier). The rule reports a connector from a FailureState to another kind of requirement, or from a requirement stereotype to a requirement. [OMG RAAML 1.0 (formal/22-12-06) 9.7.2, p. 106]"
    category: iso
    severity: warning
    demo_trigger: false
    coverage: partial
    not_checked: "Only a client that is a FailureState or a UML state with no stereotype (EA type State), and a supplier that is a requirement stereotype, are judged; any other end is not. The RecoveryRequirement half of the rule (a SafeState to a requirement) is not checked: SafeState is a connector in EA."
    selector:
      type: "connector"
      connector_stereotype: "UserInfoRequirement"
    condition:
      type: "relationship_table"
      table: "raaml-1-userinfo"
      unknown_endpoint: "ignore"
    remediation:
      short: "Draw the UserInfoRequirement from the state to a functional or technical safety requirement."
      auto_fixable: false
