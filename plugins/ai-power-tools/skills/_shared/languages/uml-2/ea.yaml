conventions:
  state_machine_children: states, pseudostates and regions are children of the StateMachine or State element (ParentID); create them with AddNew
    on the parent element
  activity_children: actions, decisions, object nodes and activity parameters are children of the Activity element; pins are children of the Action
  port_owner: a Port is a child of its owner element
  deployment: deploy an Artifact to a Node with a Deployment connector; nest an ExecutionEnvironment in a Device or Node with ParentID
  diagram_children: a diagram that shows its owning StateMachine or Activity element refuses (throws on) child elements placed outside the owner's
    box; leave the owner off the diagram
harvest:
  element_types: 'ui-api: AddNew(name, type) in a headless EA, read back from t_object'
  connector_types: 'ui-api: AddNew on a connector, read back from t_connector; include/extend kinds also from EA''s pattern um2.5-basic-use-case-model-with-include'
  diagram_types: 'model-pattern: the type tag of 162 diagrams in ModelPatterns\um2.5-*.xml; Profile only created, not confirmed'
  standard_profile: 'ui-api: AddNew and StereotypeEx, read back from t_xref FQName'
  kind_numbers: ui-api plus the XMI 1.1 export of the same elements (StateNode 3 and 4)
