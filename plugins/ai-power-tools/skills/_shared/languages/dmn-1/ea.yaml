# EA's names for this language's layout. `tools/gen_conventions.py` reads `layout_map`.
# The language's branch replaces this stub with its full ea.yaml, and keeps `layout_map`.
language: dmn-1
stub: true
layout_map:
  technology: DMN1.1
  display_name: DMN 1.1
  extends: UML
  stereotype_prefix: ''
  notes: |
    CLASSIFICATION (b). `DMNDiagram` is a decision requirements diagram: a directed acyclic graph of decisions, input data, business knowledge models and knowledge sources, joined by requirement links. It is an ordinary graph where EA's own layout is acceptable and we tidy afterwards. It has a real top-down convention: on 307 requirement links the requiring element is drawn higher than the element it requires in 253, level with it in 21 and lower in 33: but the corpus describes these diagrams as a DAG with heavy edge crossing, and a layered composition would not minimize crossings or center a parent over its inputs. The largest in the model has 26 elements and 40 links.

    CONTAINMENT EXISTS AND IS NOT THE STRUCTURE, which is what refuses nested-grid. 36 of the 287 objects across the 31 diagrams sit inside another (12.5%), and every one of the parents is a `DecisionService`. So the enclosure is a real feature on the diagrams that have one, and it is a minority of one concept while the requirement links are the content everywhere: nested-grid's own test asks whether an arrow between two boxes would add anything, and here it always would, because the arrow is which requirement it is.

    SPACING IS NOW STATED, REVERSING AN EARLIER DRAFT OF THIS FILE. The draft left both gaps unset on the argument that in a graph these distances follow edge density rather than a convention of the notation. That argument is true and it is equally true of every `graph` diagram type in the parent binding, all of which state both axes: a `graph` layout takes them as its column and layer spacing, so they are read rather than inert, and the alternative is the engine's 20, which nobody measured. What the rules ask of a gap is that it clear ten observations and that no single diagram supply more than half of the population, and these two clear both by a wider margin than any other gap in the tree: 25 and 23 diagrams contribute and the densest supplies 13%. Each figure below is the median of its population, with its spread disclosed, and is a fact about that population rather than a convention.
  diagram_types:
    DMNDiagram:
      guide: DecisionRequirementsDiagram
      base: Analysis
