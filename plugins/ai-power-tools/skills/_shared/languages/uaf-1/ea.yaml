# EA facts for UAF 1.0 as Sparx Enterprise Architect's built-in UAF technology stores it.
# Every stereotype and tag below was created in EA and read back. `concepts` maps a concept of the language skill to the stored stereotype
# (and the metaclass rows it has, with how each row was established), its kind of EA object and its tags (the four common tags are in `common_tags`).
# Westbrook Bank appears only in howto.md and the samples, as an illustration.

language: uaf-1
technology: UAF
display_name: UAF
profile: UAFP
stereotype_prefix: UAFP
stereotype_storage: 'bare upper camel case name in t_object.Stereotype, t_connector.Stereotype, t_attribute.Stereotype and
  t_operation.Stereotype (Capability, OperationalPerformer, IsCapableToPerform); the qualified form UAFP::<name> is in the
  t_xref row named Stereotypes (FQName) and is what AddNew and StereotypeEx take. The prefix is the profile name UAFP, not
  the technology id UAF: UAF::<name> binds nothing. EA matches the name after UAFP:: without regard to case and stores the
  canonical form. A second stereotype on the same object is kept in t_xref only; the Stereotype column holds the first'
measured_on:
  ea: 17.1 build 1716
  date: '2026-10-21'
  technology_version: '1.1'
  technology_file: 'none: the technology is one of EA''s InternalTechnologies (encrypted); measured by creating objects'
  standard_version_named_by_ea: UAF 1.0 (the technology's perspective text); GetTechnologyVersion returns 1.1
  language_skill_version: UAF 1.0 (OMG formal/17-12-01)
  version_note: 'The skill describes UAF 1.0. EA''s technology reports version 1.1 while its perspective text says 1.0. OMG
    has 1.1 (2020), 1.2 (2022) and 1.3 (2026). The newer versions were not researched.
    What this file records is the profile EA ships: 178 names and 184 rows on the Resources tab'
