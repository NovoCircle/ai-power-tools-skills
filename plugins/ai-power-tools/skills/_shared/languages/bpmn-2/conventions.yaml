presentation_profiles:
  detail:
    description: Everything. The working view.
    connector_labels: true
    connector_stereotypes: true
    element_stereotypes: true
    compartments: all
    notes: true
    collapse_parallel: false
  review:
    description: For a process walkthrough. Keeps the flow labels, which in BPMN carry the gateway conditions
      and are not optional furniture.
    connector_labels: true
    connector_stereotypes: false
    element_stereotypes: false
    compartments:
    - name
    notes: true
    collapse_parallel: false
  executive:
    description: 'For an audience following the shape of the process. Note that hiding connector labels
      in BPMN loses the gateway conditions, so an executive BPMN view is a summary of the happy path:
      say so rather than implying the process has no branches.'
    connector_labels: false
    connector_stereotypes: false
    element_stereotypes: false
    compartments: none
    notes: false
    collapse_parallel: true
    direction_only: true
