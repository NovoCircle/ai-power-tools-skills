    metaclass: Port
    tags:
    - IsExpanded
    - ShowLabel
    note: a Port element, a child of a case plan model, stage or human task
  DecisionTask:
    representation: none
    note: no stereotype (EA refused CMMN::DecisionTask); model a plain Task or a ProcessTask and say in its name or description what
      it decides
  EventListener:
    representation: none
    note: no generic stereotype; use TimerEventListener or UserEventListener
  DiscretionaryItem:
    representation: tag
    tag: IsDiscretionary
    'on':
    - Stage
    - Task
    - HumanTask
    - CaseTask
    - ProcessTask
    note: a Stage or task whose IsDiscretionary is true is the standard's DiscretionaryItem; drawn with a dashed border; no separate
      element
  DiscretionaryTask:
    representation: tag
    tag: IsDiscretionary
    'on':
    - Task
    - HumanTask
    - CaseTask
    - ProcessTask
    note: named use of DiscretionaryItem
  BlockingTask:
    representation: tag
    tag: IsBlocking
    'on':
    - HumanTask
    note: true on a HumanTask; the other task stereotypes have no IsBlocking tag
  NonBlockingTask:
    representation: tag
    tag: IsBlocking
    'on':
    - HumanTask
    note: false on a HumanTask (EA's default); drawn with a hand icon
  ManualTask:
    representation: tag
    tag: IsBlocking
    'on':
    - HumanTask
    note: a HumanTask with IsBlocking false
  PlanFragmentOnly:
    representation: stereotype
    stereotype: PlanFragment
    metaclass: Class
    tags:
    - IsExpanded
    note: a Stage is its own stereotype, so PlanFragment is the plan fragment that is not a Stage
  ManualActivationRule:
    representation: tag
    tag: IsManualActivation
    'on':
    - Stage
    - Task
    - HumanTask
    - CaseTask
    - ProcessTask
    note: a true or false flag that shows the decorator; the rule's condition expression cannot be stored
  RequiredRule:
    representation: tag
    tag: IsRequired
    'on':
    - Stage
    - Task
    - HumanTask
    - CaseTask
    - ProcessTask
    - Milestone
    note: a flag that shows the decorator; no expression
  RepetitionRule:
    representation: tag
    tag: IsRepetition
    'on':
    - Stage
    - Task
    - HumanTask
    - CaseTask
    - ProcessTask
    - Milestone
    note: a flag that shows the decorator; no expression
  PlanItemControl:
    representation: tag
    tag: IsManualActivation, IsRequired, IsRepetition
    'on':
    - Stage
    - Task
    - HumanTask
    - CaseTask
    - ProcessTask
    - Milestone
    note: the three flags together; no default control apart from the item
  Sentry:
    representation: none
    note: no element; the criterion stands for it and EA stores no if-part
  Criterion:
    representation: none
    note: abstract; EntryCriterion and ExitCriterion are the stereotypes
  OnPart:
