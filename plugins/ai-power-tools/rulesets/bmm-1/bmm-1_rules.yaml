# Business Motivation Model (BMM) 1.3 Conformance Ruleset
# Language:     OMG Business Motivation Model 1.3 (formal/15-05-19), language file id bmm-1
# Enforced by:  AI Power Tools for Sparx EA -- validate_model tool
#
# STEREOTYPE NAMES ARE THE CONCEPT NAMES, WITH NO TECHNOLOGY PREFIX, AND THAT IS MEASURED.
#
# Measured on EA 17.1 build 1716, in a test model: an element or connector created with the type
# `BMM::Goal` stores `t_object.Stereotype = Goal` and a t_xref row `FQName=BMM::Goal`. All 29 element stereotypes and all
# 37 connector stereotypes of EA's built-in BMM technology store the bare name (unlike ArchiMate, whose names carry
# `ArchiMate_`). validate_model selects with `Stereotype IN (...)` against those columns, exact and case sensitive, so the
# selectors below use the bare names and not `BMM::Goal`.
#
# THE BARE NAMES ARE SHARED. `BusinessProcess` and `Resource` are also stored stereotype names of EA's BPMN 2.0 technology
# (a probe model holds a BPMN `BusinessProcess` next to BMM's); validate_model cannot tell them apart from the stored name.
# No rule below selects those two as elements, and every table ignores a connector whose end it does not name
# (`unknown_endpoint: ignore`), so a BPMN element is judged only if a BMM connector joins it.
#
# WHAT THE TABLES ARE. Three `tables:` generated from the BMM language file:
#   bmm-1.3-relationships               53 of the standard's 54 relationship fact types, one letter per connector stereotype
#   bmm-1.3-desired-result-includes     Includes joins like kinds of Desired Result (BMM-HIER-001)
#   bmm-1.3-course-of-action-like-kind  Includes and Enables join like kinds of Course of Action (BMM-HIER-003)
# Direction is the standard's active reading (source acts on target); the 8 connector stereotypes that EA's own sample
# models use follow it. The mapping from a fact type to EA's connector stereotype is by the verb in the fact type's name;
# EA's quick linker was spot-checked on three pairs only, so `quick_links` are not harvested.
#
# NOT COVERED. 25 of the 39 rules in the language's rules reference have no rule here: text-level wording, graph cycles and
# method notes, which a validator that reads only the saved model cannot judge.
#
# Source:
#   [S1] OMG Business Motivation Model 1.3, formal/15-05-19 -- https://www.omg.org/spec/BMM/1.3/
#
# Rule ids: `BMM13-<CAT>-nnn` here, `implements: BMM-<CAT>-nnn` names the rule of references/rules.md.

meta:
  version: "1.0"
  language: bmm-1
  organization: "(your organization)"
  mdg_family: BMM
  description: >
    Conformance rules for Business Motivation Model 1.3 models built with Sparx EA's BMM technology. They check which
    concepts a relationship may join, the cardinalities the standard states, the like-kind rules for Desired Results and
    Courses of Action, that an enforcement level has a Tactic behind it, and that Courses of Action are governed and
    Influencers categorized. Rules about how a statement is worded are not checkable and are not included.
  severity_levels:
    error:   The standard states it as a requirement (a must).
    warning: The standard gives it as guidance or in prose only (a should).
    info:    Advisory note; not a conformance violation.

