  - id: SYSML1-REQ-004
    name: A requirement joins no generalization
    implements: SYSML-REQ-004
    description: 'A requirement does not take part in generalizations. A generalization is a connector of EA type Generalization
      (a conform is one too, with the stereotype conform); neither end may carry a requirement stereotype. The end the rule
      does not forbid lists every SysML element stereotype that is not a requirement kind and the empty stereotype (a plain
      UML element): an endpoint condition says ''one of'', so a rule that forbids a requirement has to list everything else.
      An end that carries another technology''s stereotype is reported too. [OMG SysML 1.5 (formal/17-05-01) 16.3.2.5 [4]]'
    category: req
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: A requirement that carries no requirement stereotype is not seen as one.
    selector:
      type: connector
      connector_types:
      - Generalization
    condition:
      type: connector_endpoint_stereotype
      source_must_be_one_of:
      - AdjunctProperty
      - BoundReference
      - ClassifierBehaviorProperty
      - DirectedFeature
      - ElementGroup
      - EndPathMultiplicity
      - FlowPort
      - FlowProperty
      - FullPort
      - InterfaceBlock
      - NestedConnectorEnd
      - PropertySpecificType
      - ProxyPort
      - RequirementRelated
      - Stakeholder
      - ValueType
      - allocateActivityPartition
      - allocated
      - block
      - connectorProperty
      - constraintBlock
      - constraintProperty
      - continuous
      - controlOperator
      - discrete
      - distributedProperty
      - effbd
      - flowSpecification
      - model
      - moe
      - noBuffer
      - nonStreaming
      - objectiveFunction
      - optional
      - overwrite
      - participantProperty
      - probability
      - problem
      - rate
      - rationale
      - streaming
      - testCase
      - view
      - viewpoint
      - ''
      target_must_be_one_of:
      - AdjunctProperty
      - BoundReference
      - ClassifierBehaviorProperty
      - DirectedFeature
      - ElementGroup
      - EndPathMultiplicity
      - FlowPort
      - FlowProperty
      - FullPort
      - InterfaceBlock
      - NestedConnectorEnd
      - PropertySpecificType
      - ProxyPort
      - RequirementRelated
      - Stakeholder
      - ValueType
      - allocateActivityPartition
      - allocated
      - block
      - connectorProperty
      - constraintBlock
      - constraintProperty
      - continuous
      - controlOperator
      - discrete
      - distributedProperty
      - effbd
      - flowSpecification
      - model
      - moe
      - noBuffer
      - nonStreaming
      - objectiveFunction
      - optional
      - overwrite
      - participantProperty
      - probability
      - problem
      - rate
      - rationale
      - streaming
      - testCase
      - view
      - viewpoint
      - ''
    remediation:
      short: Relate the requirements with deriveReqt or copy instead of a generalization.
      auto_fixable: false

  - id: SYSML1-ACT-006
    name: A probability leaves a decision node or an object node
    implements: SYSML-ACT-006
    description: A probability applies only to activity edges whose source is a decision node or an object node. In EA's SysML
      technology it is the stereotype probability on a control flow or an object flow. The source must be an element of EA
      type Decision, ObjectNode, ActivityParameter, CentralBufferNode, ExpansionNode or ActionPin, or a data store (the built-in
      stereotype datastore). The end it arrives at is any activity node. [OMG SysML 1.5 (formal/17-05-01) 11.3.2.7 [1]]
    category: act
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: Output parameter sets, which the standard also allows as the place of a probability and which EA's technology
      does not model with a stereotype.
    selector:
      type: connector
      connector_stereotype: probability
      connector_types:
      - ControlFlow
      - ObjectFlow
    condition:
      type: connector_endpoint_stereotype
      source_must_be_one_of:
      - type:Decision
      - type:ObjectNode
      - type:ActivityParameter
      - type:CentralBufferNode
      - type:ExpansionNode
      - type:ActionPin
      - datastore
      target_must_be_one_of:
      - AdjunctProperty
      - BoundReference
      - ClassifierBehaviorProperty
      - DirectedFeature
      - ElementGroup
      - EndPathMultiplicity
      - FlowPort
      - FlowProperty
      - FullPort
      - InterfaceBlock
      - NestedConnectorEnd
      - PropertySpecificType
      - ProxyPort
      - RequirementRelated
      - Stakeholder
      - ValueType
      - allocateActivityPartition
      - allocated
      - block
      - connectorProperty
      - constraintBlock
      - constraintProperty
      - continuous
      - controlOperator
      - designConstraint
      - discrete
      - distributedProperty
      - effbd
      - extendedRequirement
      - flowSpecification
      - functionalRequirement
      - interfaceRequirement
      - model
      - moe
      - noBuffer
      - nonStreaming
      - objectiveFunction
      - optional
      - overwrite
      - participantProperty
      - performanceRequirement
      - physicalRequirement
      - probability
      - problem
      - rate
      - rationale
      - requirement
      - streaming
      - testCase
      - view
      - viewpoint
      - ''
      - type:Action
      - type:Decision
      - type:MergeNode
      - type:ObjectNode
      - type:ActivityParameter
      - type:CentralBufferNode
      - type:ExpansionNode
      - type:ActionPin
    remediation:
      short: Put the probability on an edge that leaves a decision node or an object node, or remove it.
      auto_fixable: false

  - id: SYSML1-PORT-008
    name: A full port is not bound to a part
    implements: SYSML-PORT-008
    description: 'A binding connector does not link a full port to another composite property of the block that owns it, unless
      that property is a non-full port. The rule is a table of the binding connector between the ends it can judge: a full
      port (stereotype FullPort) and a part (EA type Part). A full port may be bound to a full port or a part to a part; a
      full port bound to a part is reported. Any other end (a proxy port, a plain port) is ignored. [OMG SysML 1.5 (formal/17-05-01)
      9.3.2.8 [2]]'
    category: port
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: 'That the part belongs to the block that owns the full port, and bindings that reach the full port through
      other binding connectors: the rule reports a full port bound to any part. A full port bound to another full port is
      not reported.'
    selector:
      type: connector
      connector_stereotypes: any_of_table
    condition:
      type: relationship_table
      table: sysml-1.5-full-port-bindings
      unknown_endpoint: ignore
    remediation:
      short: Bind the full port to a proxy port or another non-full port, not to a part.
      auto_fixable: false

  - id: SYSML1-PORT-009
    name: An interface block owns no behavior
    implements: SYSML-PORT-009
    description: An interface block does not own behaviors. The rule reports an activity, a state machine or an interaction
      nested directly in an interface block (an element attached to it by ParentID). [OMG SysML 1.5 (formal/17-05-01) 9.3.2.9
      [1]]
    category: port
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: 'Inherited behaviors, a classifier behavior, and the methods of behavioral features: they are references
      and operations, not nested elements.'
    selector:
      type: element
      stereotypes:
        any_of:
        - InterfaceBlock
    condition:
      type: contains_count
      child:
        stereotype_one_of:
        - type:Activity
        - type:StateMachine
        - type:Interaction
      max: 0
    remediation:
      short: Move the behavior into a block that uses the interface block, or remove it.
      auto_fixable: false

  - id: SYSML1-BLK-029
    name: A classifier behavior property sits in a block
    implements: SYSML-BLK-029
    description: A classifier behavior property is applied only to properties owned by blocks. EA stores the property as a
      Part with the stereotype ClassifierBehaviorProperty, attached to its owner by ParentID; the owner must carry block,
      constraintBlock or InterfaceBlock. [OMG SysML 1.5 (formal/17-05-01) 8.3.2.6 [1]]
    category: blk
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: That the owner has a classifier behavior, and that the property is owned and not inherited.
    selector:
      type: element
      stereotypes:
        any_of:
        - ClassifierBehaviorProperty
    condition:
      type: contained_in
      path:
      - stereotype_one_of:
        - block
        - constraintBlock
        - InterfaceBlock
    remediation:
      short: Create the property inside a block.
      auto_fixable: false

  - id: SYSML1-BLK-032
    name: A connector property sits in a block
    implements: SYSML-BLK-032
    description: A connector property is applied only to properties of blocks. EA stores the property as a Part with the stereotype
      connectorProperty, attached to its owner by ParentID; the owner must carry block, constraintBlock or InterfaceBlock.
      [OMG SysML 1.5 (formal/17-05-01) 8.3.2.7 [1]]
    category: blk
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: element
      stereotypes:
        any_of:
        - connectorProperty
    condition:
      type: contained_in
      path:
      - stereotype_one_of:
        - block
        - constraintBlock
        - InterfaceBlock
    remediation:
      short: Create the property inside a block.
      auto_fixable: false

  - id: SYSML1-BLK-042
    name: A distributed property sits in a block or value type
    implements: SYSML-BLK-042
    description: A distributed property is applied only to properties of blocks or value types. EA stores the property as
      a Part with the stereotype distributedProperty, attached to its owner by ParentID; the owner must carry block, constraintBlock,
      InterfaceBlock or ValueType. [OMG SysML 1.5 (formal/17-05-01) 8.3.2.9 [1]]
    category: blk
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: element
      stereotypes:
        any_of:
        - distributedProperty
    condition:
      type: contained_in
      path:
      - stereotype_one_of:
        - block
        - constraintBlock
        - InterfaceBlock
        - ValueType
    remediation:
      short: Create the property inside a block or a value type.
      auto_fixable: false

  - id: SYSML1-BLK-056
    name: A property-specific type specializes at most one classifier
    implements: SYSML-BLK-056
    description: A property-specific type specializes at most the single classifier that was named as its starting type. In
      EA's SysML technology it is a class with the stereotype PropertySpecificType; a specialization is a connector of EA
      type Generalization that leaves it. The rule reports more than one. [OMG SysML 1.5 (formal/17-05-01) 8.3.2.14]
    category: blk
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: 'That the one classifier is the starting type, and that a type with no starting type specializes nothing:
      both follow a reference.'
    selector:
      type: element
      stereotypes:
        any_of:
        - PropertySpecificType
    condition:
      type: connector_count
      connector_type: Generalization
      direction: outgoing
      max: 1
    remediation:
      short: Keep one generalization on the property-specific type, the one to its starting type.
      auto_fixable: false

  - id: SYSML1-REQ-005
    name: A requirement holds no classifier that is not a requirement
    implements: SYSML-REQ-005
    description: A classifier nested in a requirement is also a requirement. The rule reports a block, a value type or a data
      type, enumeration or primitive type attached to a requirement by ParentID. [OMG SysML 1.5 (formal/17-05-01) 16.3.2.5
      [5]]
    category: req
    severity: error
    demo_trigger: false
    coverage: partial
    not_checked: 'A plain class nested in a requirement, and the other classifier types: a requirement stereotyped onto a
      Class keeps the type Class, so naming that type would report it.'
    selector:
      type: element
      stereotypes:
        any_of:
        - requirement
        - functionalRequirement
        - interfaceRequirement
        - performanceRequirement
        - physicalRequirement
        - designConstraint
        - extendedRequirement
    condition:
      type: contains_count
      child:
        stereotype_one_of:
        - block
        - constraintBlock
        - InterfaceBlock
        - ValueType
        - type:DataType
        - type:Enumeration
        - type:PrimitiveType
      max: 0
    remediation:
      short: Move the classifier out of the requirement, or make it a requirement.
      auto_fixable: false
