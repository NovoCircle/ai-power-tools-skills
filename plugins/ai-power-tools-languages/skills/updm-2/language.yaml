- id: UPDM-VIEW-001
  statement: An enterprise has many architectural descriptions, each with its own operational, systems, standards and all views, but only one strategic view exists across them.
  strength: should
  section: 8.3.1.1.6
  checkable: none
- id: UPDM-VIEW-002
  statement: The All views should be populated whenever an architecture is created or modified, because they carry the information needed to find and reuse the model.
  strength: should
  section: 8.3.1.1.2
  checkable: none
- id: UPDM-VIEW-003
  statement: A pure operational view is independent of materiel; where needed, it may carry high-level systems data as overlays.
  strength: note
  section: 8.3.1.1.4
  checkable: none
- id: UPDM-VIEW-004
  statement: The Operational View of MODAF corresponds to the logical architecture of the enterprise.
  strength: note
  section: B.2.3
  checkable: none
- id: UPDM-VIEW-005
  statement: MODAF divides OV-4 into a typical form (the possible relationships between organizational resources, the same as the DoDAF OV-4) and an actual form (a special form of SV-1 whose resources are restricted to organizational ones).
  strength: note
  section: B.2.3.4; B.2.3.5
  checkable: none
- id: UPDM-VIEW-006
  statement: 'Four project milestones have an implied order that the framework does not enforce and the architect must keep: an IncrementMilestone, then a DeployedMilestone, then a NoLongerUsedMilestone, then an OutOfServiceMilestone.'
  strength: note
  section: B.2.1.2
  subject: IncrementMilestone
  checkable: none
- id: UPDM-VIEW-007
  statement: An IncrementMilestone should have a date that precedes all the other milestones for the same uniquely identifiable system resource.
  strength: should
  section: B.2.1.2
  subject: IncrementMilestone
  checkable: partial
- id: UPDM-VIEW-008
  statement: A DeployedMilestone should have a date after the IncrementMilestone of the same system resource and should associate that resource with a specific organization.
  strength: should
  section: B.2.1.2
  subject: DeployedMilestone
  checkable: partial
- id: UPDM-VIEW-009
  statement: A NoLongerUsedMilestone should have a date after the DeployedMilestone for the same system resource and organization, and should not exist without that DeployedMilestone.
  strength: should
  section: B.2.1.2
  subject: NoLongerUsedMilestone
  checkable: partial
- id: UPDM-VIEW-010
  statement: An OutOfServiceMilestone should have a date at or after the latest NoLongerUsedMilestone for the system resource, and requires that no organization still has the resource deployed; if the resource was never deployed it should fall
    after the IncrementMilestone.
  strength: should
  section: B.2.1.2
  subject: OutOfServiceMilestone
  checkable: partial
- id: UPDM-VIEW-011
  statement: Capabilities are timeless and are not related to time directly. Time is related through an IncrementMilestone tied to a CapabilityConfiguration that exhibits the capability. A configuration that later realizes a different capability
    should be a new configuration, treated as a version of a master configuration.
  strength: note
  section: B.2.5.4
  subject: Capability
  checkable: none
- id: UPDM-VIEW-012
  statement: An ArbitraryConnector is a visual indication in a high-level operational concept and cannot be related to any architectural semantics.
  strength: note
  section: 8.3.1.1.4.4
  subject: ArbitraryConnector
  checkable: none
- id: UPDM-VIEW-013
  statement: A standards view covers one time period; emerging standards for a future period are shown in a standards forecast. A standards view references elements from the systems views (SV-1, 2, 4, 6), the service views (SvcV-1, 2, 4, 6) and
    the data views (DIV-2, DIV-3).
  strength: note
  section: 8.3.1.1.8
  checkable: none
- id: UPDM-VIEW-014
  statement: 'The DoDAF and MODAF service concepts differ: MODAF services are specifications, DoDAF services describe implementations in particular performers. The mapping between the service views of the two is partial.'
  strength: note
  section: C.3.2
  checkable: none
- id: UPDM-GUID-001
  statement: Stakeholders of an architecture include end users and tool vendors; the specification is organized around the metamodels, not the views, while still supporting the more than 50 views that can be derived and user-defined views.
  strength: note
  section: '6.2'
  checkable: none
- id: UPDM-GUID-002
  statement: NAF is supported implicitly through the convergence of MODAF and NAF; the annex maps NAF 3.1 and MODAF views and elements.
  strength: note
  section: 1; C.2
  checkable: none
- id: UPDM-GUID-003
  statement: 'UPDM was developed model-first: the domain metamodel was mapped to profile elements, with each profile element linked to its metamodel element, and the specification generated from the profile.'
  strength: note
  section: '7.2'
  checkable: none
# data_types and notation. Facts are OMG UPDM 2.1 (formal/13-08-04) only; each carries its section.
data_types:
  coverage: partial
  section: "8.3.1.1.3, 8.2, 8.3.1"
  inherits_from: uml-2
  note: "UPDM defines no primitive types: attributes use String, Boolean and the other types of the UML language file, plus one date-time type, twelve enumerations (listed with their literals) and the security classification enumeration of the DoDAF class library."
  types:
    - {name: "ISO8601DateTime", kind: "other", section: "8.3.1.1.3", domain: "a date and time in the ISO 8601 format with a time zone designator", note: "a stereotype on the UML string literal, used for start and end dates and similar attributes; the figures of Annex D write a value as 2010-01-01 00:00:00"}
    - {name: "OperationalExchangeKind", kind: "enumeration", values: ["MaterielExchange", "OrganizationalExchange", "EnergyExchange", "InformationExchange", "ConfigurationExchange", "GeoPoliticalExtentExchange"], section: "8.3.1.1.4.3.4"}
    - {name: "RoleKind", kind: "enumeration", values: ["Part", "Component", "Used Configuration", "Human Resource", "Platform", "System", "Sub Organization", "Post Role", "Responsibility Role", "Service Access Role", "Equipment", "Sub System Part", "Hosted Software", "Other"], section: "8.3.1.1.7.4.13"}
    - {name: "ActualPropertySetKind", kind: "enumeration", values: ["Actual", "Required", "Estimate"], section: "8.3.1.1.2.5.4"}
    - {name: "LocationKind", kind: "enumeration", values: ["SolidVolume", "Surface", "Line", "Point", "GeoStationaryPoint", "PlanarSurface", "PolygonArea", "RectangularArea", "ElipticalArea", "CircularArea", "Other"], section: "8.3.1.1.2.4.6"}
    - {name: "LocationTypeKind", kind: "enumeration", values: ["OtherType", "SolidVolumeType", "SurfaceType", "LineType", "PointType", "GeoStationaryPointType", "PlanarSurfaceType", "PolygonAreaType", "RectangularAreaType", "ElipticalAreaType", "CircularAreaType"], section: "8.3.1.1.2.4.8"}
    - {name: "ArchitectureFrameworkKind", kind: "enumeration", values: ["DoDAF", "MODAF", "NAF"], section: "8.3.1.1.2.7.3"}
    - {name: "RuleKind", kind: "enumeration", values: ["StructuralAssertion", "ActionAssertion", "Derivation", "Agreement", "Constraint", "Guidance", "SecurityPolicy"], section: "8.3.1.1.2.6.6"}
    - {name: "ExchangeElementKind", kind: "enumeration", values: ["InformationElement", "DataElement"], section: "8.3.1.1.2.6.2"}
    - {name: "InformationKind", kind: "enumeration", values: ["Information", "DomainInformation", "PositionReferenceFrame", "PedigreeInformation", "Data"], section: "8.3.1.2.2.2"}
    - {name: "GeoPoliticalExtentKind", kind: "enumeration", values: ["Other", "GeoFeature", "RegionOfCountry", "Country", "RegionOfWorld", "Facility", "Site", "Installation"], section: "8.3.1.2.2.4.4"}
    - {name: "GeoPoliticalExtentTypeKind", kind: "enumeration", values: ["GeoFeatureType", "RegionOfCountryType", "CountryType", "RegionOfWorldType", "FacilityType", "SiteType", "InstallationType", "OtherType"], section: "8.3.1.2.2.4.6"}
    - {name: "DevelopmentStatus", kind: "enumeration", values: ["Identified", "Draft", "Proposal", "Verified", "Rejected", "Obsolete"], section: "8.3.1.5.2"}
    - {name: "ClassificationType", kind: "enumeration", values: ["C", "CTS", "CTS-B", "CTS-BALK", "CTSA", "NC", "NCA", "NR", "NS", "NS-A", "NS-S", "NSAT", "NU", "R", "S", "TS", "U"], section: "8.2.1", note: "security classification markings derived from DoDAF; the text gives each literal a longer name"}
    - {name: "CommunicationsLinkProperties", kind: "structured", section: "8.2.2", note: "a ready-made set of measurements in the DoDAF class library; the specification text names it and says what it describes but does not list its members"}
    - {name: "DataElementProperties", kind: "structured", section: "8.2.3", note: "a ready-made set of measurements in the DoDAF class library; the specification text names it and says what it describes but does not list its members"}
    - {name: "ExchangeProperties", kind: "structured", section: "8.2.4", note: "a ready-made set of measurements in the DoDAF class library; the specification text names it and says what it describes but does not list its members"}
    - {name: "InformationAssuranceProperties", kind: "structured", section: "8.2.5", note: "a ready-made set of measurements in the DoDAF class library; the specification text names it and says what it describes but does not list its members"}
    - {name: "InformationElementProperties", kind: "structured", section: "8.2.6", note: "a ready-made set of measurements in the DoDAF class library; the specification text names it and says what it describes but does not list its members"}
    - {name: "OperationalActivityProperties", kind: "structured", section: "8.2.7", note: "a ready-made set of measurements in the DoDAF class library; the specification text names it and says what it describes but does not list its members"}
    - {name: "SecurityAttributes", kind: "structured", section: "8.2.8", note: "refers to the W3C XML Schema of the IC-ISM information security marking standard; its members are not listed"}
  attributes:
    coverage: every_concept
    where: concepts
    note: "Each concept entry lists the attributes the standard gives it under `attributes` (name, type and multiplicity as clause 8.3.1 writes them; DesignRule's attributes have no stated multiplicity). Many attribute types are other profile elements, which are the profile's association ends. Concepts with no attributes list none."
notation:
  coverage: informative
  section: "Annex D (non-normative), Figures D.8 to D.43; 8.3.1; 7.4"
  note: "The standard defines no symbols of its own: a UPDM element is drawn as the UML element it extends with its name in guillemets, and only the non-normative Annex D sample problem shows views, as UML and SysML diagrams."
  inherits_from: uml-2
  default: {shape: "the symbol UML draws for the UML element the concept extends (its `uml_base`), with the concept's name in guillemets above the element's own name: a class box for a Class, a part box for a Property, a rectangle with an underlined name for an InstanceSpecification, a note symbol for a Comment, a folder symbol for a Package", line: "the line UML draws for the UML relationship the concept extends, labeled with the concept's name in guillemets: dashed with an open arrowhead at the supplier end for a Dependency, a solid line for a Connector or Association", section: "8.3.1 (the Extensions list of each element); Annex D, Figures D.8, D.12, D.15, D.18, D.19, D.20"}
  # Entries below are only for what differs from the default. Everything is read from the figures of Annex D; the standard states no sizes or colors.
  elements:
    View: {shape: "the diagram of a view is drawn inside a frame with a heading tab at the upper left", marker: "none", label: "the tab reads the view name, then the kind of the owning element in square brackets, then a descriptive name, as in OV-2 [Node] Search and Rescue", section: "Annex D, Figures D.8, D.16, D.19"}
    NodeRole: {shape: "part box: a rectangle with the keyword above the text name : Node type", marker: "none", label: "ports sit on its border; in an activity diagram a node role heads a vertical lane that holds the activities allocated to it", section: "Annex D, Figures D.16, D.21"}
    ResourceRole: {shape: "part box: a rectangle with a keyword above the text name : type; a role that has parts holds their boxes inside it", marker: "none", label: "the figures write the keyword as ConfigurationRole, OrganizationRole or ResourceArtifactRole in guillemets, not ResourceRole", section: "Annex D, Figures D.30, D.31"}
    ConceptRole: {shape: "rectangle holding the text name : type with no keyword, or any picture in place of the rectangle with the same text beneath it", marker: "none", label: "joined to other concept roles by labeled dashed arrows", section: "Annex D, Figures D.12, D.13"}
    NodePort: {shape: "small square on the border of the part box that owns it", marker: "a small glyph inside the square (an arrow or a cross)", label: "the port name beside the square", section: "Annex D, Figures D.16, D.30, D.31"}
    ResourcePort: {shape: "small square on the border of the part box that owns it", marker: "a small glyph inside the square (an arrow or a cross)", label: "the port name beside the square", section: "Annex D, Figures D.16, D.30, D.31"}
