    name: "The source of ActualOrganizationRelationship is ActualOrganizationalResource"
    implements: UPDM-END-001
    description: "The source of an ActualOrganizationRelationship is ActualOrganizationalResource or a specialization of it. In Sparx's UPDM2 technology that is one of: ActualOrganization, ActualPost, IndividualPersonRole. A connector whose source carries another UPDM stereotype is reported. [OMG UPDM 2.1 (formal/13-08-04) 8.3.1.1.4.4.18.1 (ActualOrganizationRelationship)]"
    category: end
    severity: error
    demo_trigger: false
    coverage: full
    not_checked: "An end that carries no UPDM stereotype (a plain UML element) or another technology's stereotype as its first one is not judged; t_object.Stereotype holds only the first stereotype, so a UPDM stereotype applied after SysML's block is not seen."
