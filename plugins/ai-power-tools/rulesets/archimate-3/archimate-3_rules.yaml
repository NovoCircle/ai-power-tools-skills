  # ---------------------------------------------------------------------------------------------------------
  # Element definitions
  # ---------------------------------------------------------------------------------------------------------
  - id: ARCHIMATE-ELM-001
    name: Collaboration aggregates two or more members
    implements: ARCHIMATE-ELM-001
    description: >
      A collaboration is an aggregate of two or more internal active structure elements [S1 4.2, 8.2.3, 9.2.2, 10.2.4].
      The standard states the number in prose, so this is a warning. The count is outgoing aggregation connectors from
      the collaboration (EA's aggregation runs from the whole to the part). Members joined by composition only are not
      counted, and the members' types are not checked.
    category: element
    severity: warning
    demo_trigger: true
    selector:
      type: element
      stereotypes:
        any_of:
          - ArchiMate_BusinessCollaboration
          - ArchiMate_ApplicationCollaboration
          - ArchiMate_TechnologyCollaboration
    condition:
      type: connector_count
      connector_stereotype: ArchiMate_Aggregation
      direction: outgoing
      min: 2
    remediation:
      short: "Aggregate at least two members (roles, actors, components or nodes) into the collaboration, or model a single role instead."
      auto_fixable: false

  - id: ARCHIMATE-ELM-002
    name: Interaction has a performer assigned to it
    implements: ARCHIMATE-ELM-002
    description: >
      An interaction is collective behavior performed by two or more internal active structure elements, assigned
      directly or aggregated in a collaboration [S1 4.2]. The standard states the number in prose, so this is a
      warning. The rule checks the necessary condition, at least one incoming assignment; it does not count the
      performers behind a collaboration or check their types.
    category: element
    severity: warning
    demo_trigger: false
    selector:
      type: element
      stereotypes:
        any_of:
          - ArchiMate_BusinessInteraction
          - ArchiMate_ApplicationInteraction
          - ArchiMate_TechnologyInteraction
    condition:
      type: connector_count
      connector_stereotype: ArchiMate_Assignment
      direction: incoming
      min: 1
    remediation:
      short: "Assign the interaction from a collaboration, or from two or more active structure elements."
      auto_fixable: false
