# EA's names for this language's layout. tools/gen_conventions.py reads layout_map.
layout_map:
  technology: ERD_dp
  display_name: Entity Relationship Diagram
  extends: UML
  stereotype_prefix: ERD_
  notes: |
    CLASSIFICATION (b). `ERD_DP` is a graph: entities joined to each other by relationships, each entity carrying a fan of attributes. EA's own layout places it acceptably and we tidy afterwards. The measurement is unusually clear that no composed grammar applies: 0 of the 44 objects across the two diagrams is nested inside another, so containment is not the structure and nested-grid would be wrong.

    `radial` WAS CONSIDERED AND REFUSED, because the corpus row for this notation records the arrangement as an organic radial layout and the measurement half agrees with it. Attributes really do fan around their entity: of the 30 attribute connectors, 21 join an entity to an attribute and the other 9 join an attribute to a further attribute, and on the second diagram the two entities each carry four attributes in a mirror-symmetric ring at radii of 88 to 153 units. But `radial` composes ONE ring around ONE hub, and these diagrams have two and six hubs: on the first one the fans are scattered rather than even, 1 to 3 attributes per entity at radii of 99 to 231 and no regular angular step. What the notation has is a forest of small fans embedded in a graph of entities, and composing it as a single ring would place the attributes and discard the entity-to-entity relationships that are the rest of the content. A per-entity radial composition is a design nobody has done; `graph` is the honest and producible answer today, and EA's layout already keeps an attribute next to the entity it is connected to.

    TITLES ARE `frame-header`, AND THE CORPUS DISAGREES. Its one ERD row records a drawn title. Against that: neither model diagram carries a Text, Note or Boundary whose content is the diagram's name (0 of 2). Both DO carry a full-canvas-width 24-point text block at the very top, and one of the two reads as the notation's name in the plural: but both sit immediately above a 9-point prose block explaining the notation, which makes them documentation-page headings rather than diagram titles, and the UML binding declines the same evidence on the same reasoning. `frame-header` also avoids the two-title diagram, which is the worse of the two mistakes. Worth revisiting if a model with ERD diagrams that are not tutorial pages turns up.

    NO VIEWPOINT CATALOG. This notation publishes none: an ERD is chosen because you are modeling entities and their relationships, not selected from a list of named views. The `viewpoints` block is therefore absent rather than invented. `presentation_profiles` are absent for a different reason: the detail, review and executive scheme the parent publishes is a view concern orthogonal to notation, so it is inherited rather than restated.

    WHAT A SECOND MODEL WOULD SETTLE. Three slots are refused here for want of data rather than for want of design: the entity's own size (n=8, two short of the threshold), and both item gaps (one diagram supplies 73% and 78% of the two populations). All three are measurements waiting on more diagrams, and each says below exactly what it is waiting for.
  diagram_types:
    ERD_DP:
      guide:
      - ChenDiagram
      - CrowsFootDiagram
      base: Logical
