      attributes: [{name: isForCompensation, type: boolean}, {name: loopCharacteristics, type: LoopCharacteristics}, {name: resources, type: ResourceRole}, {name: default, type: SequenceFlow}, {name: ioSpecification, type: InputOutputSpecification}, {name: properties, type: Property}, {name: boundaryEventRefs, type: BoundaryEvent}, {name: startQuantity, type: integer, note: '>= 1'}, {name: completionQuantity, type: integer, note: '>= 1'}]
    SubProcess:
