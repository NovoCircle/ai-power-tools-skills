# GENERATED by tools/gen_conventions.py. Do not edit: CI and the plugin build fail on any
# difference. Sizes, spacing, and vocabulary come from the layout standard on the language
# shelf. EA's names come from `layout_map` in this folder's ea.yaml. To change a value,
# change the source and run `python tools/gen_conventions.py`.

technology: BPMN2.0
display_name: BPMN 2.0
extends: UML
stereotype_prefix: ''
notes: |
  EA's BPMN2.0 MDG declares five diagram types, all based on Analysis. Two are deliberately NOT bound here: `Conversation`, whose participants-and-hexagons layout is a graph rather than one the engine composes, and `BPEL`, which is an execution-export type rather than a drawn notation. A caller resolving either gets no binding and should fall back to a plain graph layout: which is the honest answer, and better than composing a conversation into lanes.

  `BPMN2.0` is the id EA reports, measured on EA 17.1 build 1716.
diagram_types:
  Business Process:
    base: Analysis
    grammar: lanes
    title: frame-header
    sizing:
      default:
        w: 100
        h: 70
      DataObject:
        w: 40
        h: 50
      DataStore:
        w: 40
        h: 50
      EndEvent:
        w: 30
        h: 30
      Gateway:
        w: 40
        h: 40
      IntermediateEvent:
        w: 30
        h: 30
      StartEvent:
        w: 30
        h: 30
    spacing:
      item_gap_x: 80
      item_gap_y: 50
      item_gap_flow: 60
      lane_gap: 0
      min_lane_thickness: 120
      band_gap: 30
      origin_left: 40
      origin_top: -40
      band_pad_x: 12
      band_pad_y: 12
      lane_pad: 12
      grid_pad: 12
      label_height: 28
    routing:
      default: OrthogonalSquare
    channels:
      fill: Kind of node. Events, activities, gateways and data read differently. Conventional, since
        the standard fixes the shapes and not the colors.
      claimed:
        position: Two things at once. The lane an element sits in says who does it, and how far along
          the flow it sits says when.
        size: Kind of node. An event is a circle because it is an event, so size is not a free channel.
      free:
      - border
      - border_width
      - line_color
      - font_color
      - opacity
      - icon
  Collaboration:
    base: Analysis
    grammar: lanes
