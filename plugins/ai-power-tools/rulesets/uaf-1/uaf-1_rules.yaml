  - id: UAF1-END-005
    name: 'IsCapableToPerform: the kinds of element at its two ends'
    implements: UAF-END-005
    also_implements:
    - UAF-END-006
    - UAF-OWN-003
    - UAF-OWN-023
    description: When the supplier is an OperationalActivity, the client must be an OperationalAgent; when the supplier is
      a ServiceFunction, the client must be a ServiceSpecification; when the supplier is a Function other than a ProjectActivity,
      the client must be a ResourcePerformer; when the supplier is a ProjectActivity, the client must be a Project. When the
      client is an OperationalAgent, the supplier must be an OperationalActivity; when the client is a ServiceSpecification,
      the supplier must be a ServiceFunction; when the client is a ResourcePerformer, the supplier must be a Function other
      than a ProjectActivity; when the client is a Project, the supplier must be a ProjectActivity. In EA the relationship
      is an Abstraction connector stereotyped IsCapableToPerform (source = client or information source, target = supplier
      or information target). Each end must carry a stereotype that the standard allows there (the table lists the concrete
      stereotypes); an end with no stereotype, or with one that is not in the table, is reported. The rule also covers the
      OperationalPerformer and ResourcePerformer statements of what an element may be capable of performing. [OMG UAF 1.0
      (formal/17-12-01) 7.1.3.3, 7.1.5.2, 7.1.8.1]
    category: end
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: connector
      connector_stereotype: IsCapableToPerform
    condition:
      type: relationship_table
      table: uaf-1-isCapableToPerform
      unknown_endpoint: error
    remediation:
      short: Join the kinds of element the standard allows at the two ends of an IsCapableToPerform.
      auto_fixable: false

