# EA facts for SoaML 1.0.1 as Sparx Enterprise Architect's built-in SoaML technology stores it.
# Measured by reading back what EA stores.
# Every stereotype and tag below was created in EA and read back. `concepts` maps a concept of the language skill to the stored
# stereotypes (and the metaclass rows each has, with how each row was established); the tags of each stereotype are under `stereotypes`.
# Westbrook Bank appears only in howto.md, as an illustration.

language: soaml-1
technology: SoaML
display_name: SoaML
stereotype_prefix: ''
stereotype_storage: 'bare lower camel case name in t_object.Stereotype, t_attribute.Stereotype and t_connector.Stereotype (participant,
  servicePoint, serviceChannel); the qualified form SoaML::<name> is in the t_xref row named Stereotypes (FQName) and is what AddNew
  and StereotypeEx take. EA matches the name after SoaML:: without regard to case and stores the canonical form'
measured_on:
  ea: 17.1 build 1716
  date: '2026-10-21'
  technology_version: '1.0'
  technology_file: 'none: the technology is one of EA''s InternalTechnologies (encrypted); measured by creating objects'
  standard_version_named_by_ea_samples: 1.0.1 (namespace http://www.omg.org/spec/SoaML/20120501)
counts:
  stereotype_names_bound: 25
  stereotype_metaclass_pairs: 38
  resources_tab_rows: 38
  diagram_types: 2
  concepts_without_a_stereotype: 9
diagram_types:
  SoaML:
    ea_name: SoaML
    token: SoaML::SoaML
    stored_diagram_type: Component
    style_ex: MDGDgm=SoaML::SoaML;
    standard_views:
    - Services Architecture
    - Service Contract
    - Participants
    - Service Interface
    - Capabilities
    - Service Data
    - Categorization
    - Business Motivation
    note: one general diagram type for every SoaML view; the standard names no diagram type, so the mapping is EA's, not the standard's
  SoaMLSequence:
    ea_name: SoaMLSequence
    token: SoaML::SoaMLSequence
    stored_diagram_type: Sequence
    style_ex: MDGDgm=SoaML::SoaMLSequence;
    standard_views:
    - Choreography
    note: a sequence diagram for the choreography of a service contract or the protocol of a service interface
concepts:
  Participant:
    stereotypes:
    - participant
    metaclass:
    - 'participant: Class (default)'
    - 'participant: Component (inferred)'
    note: a class or a component; EA also offers entity, specification and participantArchitecture (EA only)
  Agent:
    stereotypes:
    - agent
    metaclass:
    - 'agent: Class (default)'
    - 'agent: Component (inferred)'
    - 'agent: Actor (measured)'
    note: 'created through the API with the active flag clear (t_object.IsActive = 0); the standard says an agent is always active,
      so the flag has to be set by hand. Not checked: whether the toolbox item sets it'
  Service:
    stereotypes:
    - service
    - servicePoint
    metaclass:
    - 'service: Port (port child)'
    - 'servicePoint: Port (port child)'
    tags:
      connectorRequired:
        values:
        - 'true'
        - 'false'
        default: 'true'
    note: 'two stereotypes: service (the profile''s name) and servicePoint (the metamodel''s name); both are Port elements, children
      of the participant; service has no tagged value, servicePoint has connectorRequired'
  Request:
    stereotypes:
    - request
    - requestPoint
    metaclass:
    - 'request: Port (port child)'
    - 'requestPoint: Port (port child)'
    tags:
      connectorRequired:
        values:
        - 'true'
        - 'false'
        default: 'true'
    note: 'two stereotypes: request (the profile''s name) and requestPoint (the metamodel''s name; the standard''s notation keyword);
      both are Port elements; request has no tagged value, requestPoint has connectorRequired; created through the API no conjugation
      is stored (no PDATA or StyleEx value), so the port''s Conjugated setting has to be set by hand'
  Port:
    stereotypes:
    - port
    metaclass:
    - 'port: Port (port child)'
    tags:
      connectorRequired:
        values:
        - 'true'
        - 'false'
        default: 'true'
    note: 'the refinement of the UML port: a Port element stereotyped port, with connectorRequired (default true)'
  ServiceChannel:
    stereotypes:
    - serviceChannel
    metaclass:
    - 'serviceChannel: Connector (connector)'
    note: a Connector (assembly or delegate), not a Dependency; applied through the qualified connector type
  ServiceInterface:
    stereotypes:
    - serviceInterface
    metaclass:
    - 'serviceInterface: Class (default)'
    - 'serviceInterface: Interface (measured)'
    note: on a Class (the standard's metaclass) or an Interface; a stereotype selector cannot tell the two apart (a rule that adds the EA type, Class or Interface, can)
  ServiceContract:
    stereotypes:
    - serviceContract
    metaclass:
    - 'serviceContract: Collaboration (default)'
    tags:
      isStrict:
        values:
        - 'true'
        - 'false'
  Provider:
    stereotypes:
    - provider
    metaclass:
    - 'provider: Class (default)'
    - 'provider: Interface (measured)'
    note: on an Interface (non-composite contract) or a Class (composite)
  Consumer:
    stereotypes:
    - consumer
    metaclass:
    - 'consumer: Class (default)'
    - 'consumer: Interface (measured)'
    note: on an Interface (non-composite contract) or a Class (composite)
  ServicesArchitecture:
    stereotypes:
    - servicesArchitecture
    metaclass:
    - 'servicesArchitecture: Collaboration (default)'
  Collaboration:
    stereotypes:
    - collaboration
    metaclass:
    - 'collaboration: Collaboration (default)'
    tags:
      isStrict:
        values:
        - 'true'
        - 'false'
    note: 'the refinement of the UML collaboration: isStrict, stored empty'
  CollaborationUse:
    stereotypes:
    - collaborationUse
    metaclass:
    - 'collaborationUse: CollaborationOccurrence (default)'
    tags:
      isStrict:
        values:
        - 'true'
        - 'false'
        default: 'true'
    note: EA calls the metaclass CollaborationOccurrence; isStrict defaults to true
  Capability:
    stereotypes:
    - capability
    metaclass:
    - 'capability: Class (default)'
    - 'capability: Component (inferred)'
  Expose:
    stereotypes:
    - expose
    metaclass:
    - 'expose: Dependency (connector)'
    note: a Dependency (Usage, Realisation, Abstraction and Nesting accept it too)
  MessageType:
    stereotypes:
    - messageType
    metaclass:
    - 'messageType: Class (default)'
    - 'messageType: DataType (measured)'
    - 'messageType: Signal (measured)'
    tags:
      encoding: {}
    note: on a Class, a DataType or a Signal; the standard's Message Type is generally a data type
  Attachment:
    stereotypes:
    - attachment
    metaclass:
    - 'attachment: Part (child of a class)'
    - 'attachment: Attribute (attribute)'
    tags:
      encoding: {}
      mimeType: {}
    note: on an attribute or on a Part element; tags encoding and mimeType
  Property:
    stereotypes:
    - property
    - id
    metaclass:
    - 'property: Part (child of a class)'
    - 'property: Attribute (attribute)'
    - 'id: Part (child of a class)'
    - 'id: Attribute (attribute)'
    tags:
      isID:
        values:
        - 'true'
        - 'false'
        default: 'true'
    note: 'two stereotypes: property and id (the standard''s notation keyword Id); both carry isID, which EA creates as true (the
      standard''s default is false); on an attribute or on a Part element'
  Milestone:
    stereotypes:
    - milestone
    metaclass:
    - 'milestone: Note (default)'
    tags:
      progress: {}
    note: a Note (the standard's Comment); tagged value progress is free text, empty until set
  Catalog:
    status: not-in-ea
    reason: Sparx's SoaML technology has no stereotype for it (tried as SoaML::Catalog in four forms)
  Categorization:
    status: not-in-ea
    reason: Sparx's SoaML technology has no stereotype for it (tried as SoaML::Categorization in four forms)
  Category:
    status: not-in-ea
    reason: Sparx's SoaML technology has no stereotype for it (tried as SoaML::Category in four forms)
  CategoryValue:
    status: not-in-ea
    reason: Sparx's SoaML technology has no stereotype for it (tried as SoaML::CategoryValue in four forms)
  NodeDescriptor:
    status: not-in-ea
    reason: Sparx's SoaML technology has no stereotype for it (tried as SoaML::NodeDescriptor in four forms)
  FreeFormDescriptor:
    status: not-in-ea
    reason: Sparx's SoaML technology has no stereotype for it (tried as SoaML::FreeFormDescriptor in four forms)
  FreeFormValue:
    status: not-in-ea
    reason: Sparx's SoaML technology has no stereotype for it (tried as SoaML::FreeFormValue in four forms)
  MotivationElement:
    status: not-in-ea
    reason: Sparx's SoaML technology has no stereotype for it (tried as SoaML::MotivationElement in four forms)
  MotivationRealization:
    status: not-in-ea
    reason: Sparx's SoaML technology has no stereotype for it (tried as SoaML::MotivationRealization in four forms)
