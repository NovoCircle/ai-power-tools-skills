# EA facts for UPDM 2.1 as Sparx Enterprise Architect's built-in UPDM technology (shown as UPDM 2.0; id UPDM2) stores them.
# Every stereotype and tag below was created in EA and read back. `concepts` maps the language skill's concepts (elements and relationships) to the stored stereotypes;
# an abstract concept has no stereotype and lists the stereotypes that specialize it under use_instead. The tags and the element types each stereotype accepts are under `stereotypes`.
# Westbrook Bank appears only in howto.md, as an illustration.

language: updm-2
technology: UPDM2
api_technology_id: UPDM2
display_name: UPDM 2.0
profile: UPDM2
stereotype_prefix: UPDM2
qualified_form: UPDM2::<name>
stereotype_storage: 'bare name in t_object.Stereotype and t_connector.Stereotype, spelled as the standard writes the element (Node, FillsPost,
  OperationalActivity); only the FIRST stereotype of an element is in t_object.Stereotype, a second one is only in the t_xref row named Stereotypes;
  the qualified form UPDM2::<name> is the FQName in that row and is what AddNew and StereotypeEx take. The prefixes UPDM::, UPDM2.0::, UPDM2.1::
  and ''UPDM 2.0::'' are refused.'
measured_on:
  ea: 17.1 build 1716
  date: '2026-10-21'
  technology_version: '2.1'
  technology_file: 'none: one of EA''s InternalTechnologies (UPDM Technology.xml, encrypted); measured by creating objects'
version_note: The language guide describes UPDM 2.1. EA shows the technology as UPDM 2.0 (Resources tab; its model patterns are named up2.0-*)
  and its API reports the version 2.1 for the id UPDM2 (Repository.GetTechnologyVersion). EA names no specification edition, so which published
  edition the profile follows is not known. OMG also lists UPDM 2.1.1 (2017); UAF replaces UPDM. Newer versions were not
  researched.
