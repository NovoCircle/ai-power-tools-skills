  relationships:
    SequenceFlow: {display: Sequence Flow, category: Connecting objects, directed: true, section: 8.4.13; 7.6.1}
    MessageFlow: {display: Message Flow, category: Connecting objects, directed: true, section: 9.4; 7.6.2}
    Association: {display: Association, category: Connecting objects, directed: optional, section: 8.4.1}
    DataAssociation: {display: Data Association, category: Data, directed: true, section: 10.4.1}
