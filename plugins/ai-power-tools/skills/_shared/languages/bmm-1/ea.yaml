    - Influencing Organization
    - Organization Unit
    - Regulation
    - Business Process
  - name: BMM - Assessments
    items:
    - Assessment
    - Potential Impact
  - name: BMM - Categories
    items:
    - Desired Result Category
    - Influencer Category
    - Organization Category
    - Assessment Category
  - name: BMM - Asset and Liability
    items:
    - Asset
    - Fixed Asset
    - Offering
    - Liability
    - Resource
  - name: BMM - Relationships
    items:
    - Acts As
    - Affects Achievement Of
    - Affects Employment Of
    - Amplifies
    - Categorizes
    - Channels Efforts Towards
    - Claims
    - Defines
    - Delivers
    - Deploys
    - Determines
    - Discharges
    - Effects Enforcement Level Of
    - Enables
    note: the page has 37 items (read on screen, EA 17.1 build 1716, 2026-11-04), from Acts As to Uses, in alphabetical order ending
      Supports Achievement Of, Uses; 14 are listed here. The 37 match the 37 connector stereotypes
  note: Every element and connector stereotype also appears in the Resources tab list; the toolbox pages group them. All seven pages
    were read, with the same items (checked again on screen, EA 17.1 build 1716, 2026-11-04).
quick_links:
  status: 'partly harvested: three pairs in a probe, and a fourth source on screen (EA 17.1 build 1716, 2026-11-04)'
  from_a_Goal_on_screen:
    targets:
    - DesiredResult
    - Goal
    - Objective
    - Vision
    - Assessment
    - BusinessPolicy
    - BusinessRule
    - CourseOfAction
    - DesiredResultCategory
    - Directive
    - OrganizationUnit
    - Strategy
    - Tactic
    pairs:
    - 'Objective: includes, is included by, is quantified by'
    - 'Strategy: has efforts towards channeled by'
    - 'Assessment: has achievement affected by'
    note: the labels are the standard's phrases, not the stereotype names
  spot_checked:
  - source: Strategy
    target: Goal
    offered:
    - ChannelsEffortsTowards
    matches_standard: true
  - source: Assessment
    target: Influencer
    offered:
    - IsJudgmentOf
    matches_standard: true
  - source: Objective
    target: Goal
    offered:
    - Includes
    - Quantifies
    - IsIncludedBy (reverse reading of Includes)
    matches_standard: 'partly: Quantifies matches; Includes between an Objective and a Goal is permitted by the association on Desired
      Result but refused by the like-kind rule BMM-HIER-001'
  note: Only these three pairs were read, by hand, in a probe. Allowed pairs for the ruleset come from the standard, not from EA's quick
    linker.
samples_in_ea:
  source: EA Model Wizard templates listed in the Resources tab; three XMI samples read from EA's sample models
  templates:
  - BMM Categories
  - two worked BMM examples
  sample_usage:
    element_stereotypes_used: 15
    connector_stereotypes_used: 8
    connectors_in_samples:
    - Amplifies
    - Categorizes
    - ChannelsEffortsTowards
    - Identifies
    - Implements
    - MakesOperative
    - Quantifies
    - SupportsAchievementOf
conventions: not-harvested
harvest:
  stereotype_names_and_kinds: 'ui: Resources tab > MDG Technologies > System Technologies > Business Motivation Model > UML Profiles
    > BMM (66 names), computer use 2026-10-20'
  metaclass_and_tags: 'sample-content: elements created with type BMM::<name> in a test model and read from t_object,
    t_xref, t_objectproperties'
  connector_metaclass: 'sample-content: t_connector.Connector_Type'
  unbound_candidates: 'sample-content: EA refused type BMM::<name> with ''Invalid type'' for InternalInfluencer, ExternalInfluencer,
    Risk, PotentialReward, MotivationElement'
  diagram_type: 'sample-content: t_diagram.Diagram_Type and StyleEx of a diagram created with type BMM::BMM Diagram'
  toolbox: 'ui: Toolbox window, computer use 2026-10-20'
  quick_links: ui, three pairs in a probe and one source (a Goal) on screen, EA 17.1 build 1716, 2026-11-04
  association_to_connector_mapping: inference [I] from the verb phrase of the association name; 37 EA names equal the 37 distinct verb
    phrases of 53 of the 54 associations
  connector_direction: 'model-pattern: EA''s three BMM samples use Source -> Destination in the standard''s active reading for 8 stereotypes;
    assumed for the other 29'
  build: EA 17.1 build 1716

# EA's names for this language's layout. tools/gen_conventions.py reads layout_map.
layout_map:
  technology: BMM
  display_name: Business Motivation Model
  extends: UML
  stereotype_prefix: ''
  notes: |
    The standard defines no diagram type, so this one is EA's own. Its arrangement and route are the shared defaults, not measurements.
  diagram_types:
    BMM Diagram:
      base: Custom
      arrangement: graph
      title: frame-header
      route: straight
      channels:
        fill: null
        free:
        - fill
        - border
        - border_width
        - line_color
        - font_color
        - opacity
        - icon
