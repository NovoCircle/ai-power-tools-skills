    ea_name: null
    use: ArchiMate3::Technology
    note: The technology has no physical diagram type. Physical concepts (Equipment, Facility, Distribution Network, Material)
      and Location are on the Technology toolbox, page 'Physical Extension'; draw them on a Technology diagram.
