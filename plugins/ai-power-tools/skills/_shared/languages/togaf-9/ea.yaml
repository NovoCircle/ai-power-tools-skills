    note: the starter model pattern records this token; it does not bind (EA makes a plain Class diagram). On the Resources tab (EA 17.1 build 1716, 2026-11-04)
      the type Organization Structure sits in the group TOGAF_BusinessArchitecture, not in TOGAF Diagrams; whether a token with that group binds was not
      tested
  standard_artifacts:
    note: The seven tokens above are the ones that bound among the tokens tried through the API. The Resources tab lists 17 diagram types (see resources_tab_diagram_types),
      so ten types are not in this list. Compared by name only, one tab type, Benefits, has the same name as an artifact (the Benefits diagram); four are
      FEAF reference models, and the other twelve share no name with any of the 56 artifacts. Whether any tab type is meant for an artifact, or can draw
      one, was not tested.
  resources_tab_diagram_types:
    measured_on: EA 17.1 build 1716, 2026-11-04, read on screen (Browser > Resources > MDG Technologies > System Technologies > TOGAF > Diagram Types)
    count: 17
    note: the tab shows display names inside four groups, not tokens; only the seven tokens above were matched to a type. Some names were cut off at the
      panel edge.
    groups:
      FEAF Diagrams:
      - (FEAF) Business Reference Model
      - (FEAF) Service Component Reference
      - (FEAF) Technical Reference
      - (FEAF) Performance Reference
