presentation_profiles:
  detail:
    description: Everything. The working view.
    connector_labels: true
    connector_stereotypes: true
    element_stereotypes: true
    compartments: all
    notes: true
    collapse_parallel: false
  review:
    description: For a design walkthrough. Keeps connector labels, which on a UML diagram carry the multiplicities
      and role names - the part of an association that is actually under review.
    connector_labels: true
    connector_stereotypes: false
    element_stereotypes: false
    compartments:
    - name
    notes: true
    collapse_parallel: false
  executive:
    description: 'For an audience following structure rather than detail. Note that `compartments: none`
      reduces a class to its name but does not remove the compartment - EA offers no verified way to do
      that - so say "names only" rather than implying the classes have no members.'
    connector_labels: false
    connector_stereotypes: false
    element_stereotypes: false
    compartments: none
    notes: false
    collapse_parallel: true
    direction_only: true
