- {id: UAF-XCH-005, statement: The element conveyed by a Command must be a DataElement (or a specialization of it)., strength: must, section: 7.1.7.2, subject: Command, property: conveyed, checkable: partial}
- {id: UAF-XCH-006, statement: The element conveyed by a Control must be a DataElement (or a specialization of it)., strength: must, section: 7.1.7.2, subject: Control, property: conveyed, checkable: partial}
- {id: UAF-XCH-007, statement: 'The element a ResourceExchange conveys depends on its exchange kind: for ResourceCommunication a DataElement; for ResourceMovement a PhysicalResource; for ResourceEnergyFlow a NaturalResource; for GeoPoliticalExtentExchange a GeoPoliticalExtentType (each or a specialization).', strength: must, section: 7.1.8.3, subject: ResourceExchange, property: conveyed, applies_when: the exchange kind property has a value, checkable: partial}
- {id: UAF-XCH-008, statement: The activity edge that realizes a ResourceExchange must be a FunctionEdge (or a specialization of it)., strength: must, section: 7.1.8.3, subject: ResourceExchange, property: realizingActivityEdge, checkable: partial}
- {id: UAF-XCH-009, statement: The connector that realizes a ResourceExchange must be a ResourceConnector (or a specialization of it)., strength: must, section: 7.1.8.3, subject: ResourceExchange, property: realizingConnector, checkable: partial}
- {id: UAF-XCH-010, statement: The message that realizes a ResourceExchange must be a ResourceMessage (or a specialization of it)., strength: must, section: 7.1.8.3, subject: ResourceExchange, property: realizingMessage, checkable: partial}
- {id: UAF-VAL-001, statement: The start and end dates of an ActualEnterprisePhase must fall within the start and end dates of the enclosing ActualEnterprisePhase that holds it as a slot value., strength: must, section: 7.1.4.1, subject: ActualEnterprisePhase, property: startDate/endDate, checkable: partial}
- {id: UAF-VAL-002, statement: 'The client and the supplier of a Forecast must be the same specialization of SubjectOfForecast (for example Software to Software, Standard to Standard).', strength: must, section: 7.1.8.9, subject: Forecast, property: client and supplier, checkable: partial}
- {id: UAF-VAL-003, statement: All the ProjectTheme properties owned by one ProjectMilestone must be typed by the same StatusIndicators (or a specialization)., strength: must, section: 7.1.10.1, subject: ProjectMilestone, property: ownedAttribute, checkable: partial}
- {id: UAF-CARD-001, statement: Every ActualLocation must have exactly one locationNamedByAddress (Boolean)., strength: must, section: 7.1.2, subject: ActualLocation, property: locationNamedByAddress, checkable: static}
- {id: UAF-CARD-002, statement: Every ActualLocation must have exactly one locationKind (LocationKind)., strength: must, section: 7.1.2, subject: ActualLocation, property: locationKind, checkable: static}
- {id: UAF-CARD-003, statement: Every ActualMeasurement must have exactly one intention (ActualMeasurementKind)., strength: must, section: 7.1.2, subject: ActualMeasurement, property: intention, checkable: static}
- {id: UAF-CARD-004, statement: Every Environment must have exactly one kind (EnvironmentKind)., strength: must, section: 7.1.2, subject: Environment, property: kind, checkable: static}
- {id: UAF-CARD-005, statement: Every GeoPoliticalExtentType must have exactly one kind (GeoPoliticalExtentTypeKind)., strength: must, section: 7.1.2, subject: GeoPoliticalExtentType, property: kind, checkable: static}
- {id: UAF-CARD-006, statement: Every Location must have exactly one kind (LocationTypeKind)., strength: must, section: 7.1.2, subject: Location, property: kind, checkable: static}
- {id: UAF-CARD-007, statement: Every Information must have exactly one informationKind (InformationKind)., strength: must, section: 7.1.3.4, subject: Information, property: informationKind, checkable: static}
- {id: UAF-CARD-008, statement: Every Rule must have exactly one ruleKind (RuleKind)., strength: must, section: 7.1.3.5, subject: Rule, property: ruleKind, checkable: static}
- {id: UAF-CARD-009, statement: Every ResponsibleFor must have exactly one ResponsibleRoleKind (ResponsibleRoleKind)., strength: must, section: 7.1.7.5, subject: ResponsibleFor, property: ResponsibleRoleKind, checkable: static}
- {id: UAF-CARD-010, statement: Every ResourceRole must have exactly one RoleKind (RoleKind)., strength: must, section: 7.1.8.2, subject: ResourceRole, property: RoleKind, checkable: static}
- {id: UAF-CARD-011, statement: Every WholeLifeConfiguration must have exactly one kind (WholeLifeConfigurationKind)., strength: must, section: 7.1.8.9, subject: WholeLifeConfiguration, property: kind, checkable: static}
- {id: UAF-CARD-012, statement: Every ActualProject must have exactly one projectKind (ProjectKind)., strength: must, section: 7.1.10.5, subject: ActualProject, property: projectKind, checkable: static}
- {id: UAF-CARD-013, statement: Every ActualProjectMilestone must have exactly one kind (ActualMilestoneKind)., strength: must, section: 7.1.10.5, subject: ActualProjectMilestone, property: kind, checkable: static}
- {id: UAF-CARD-014, statement: Every ArchitecturalDescription must have exactly one toBe (Boolean)., strength: must, section: 7.1.13, subject: ArchitecturalDescription, property: toBe, checkable: static}
- {id: UAF-CARD-015, statement: Every ArchitecturalDescription must have exactly one architectureFramework (String)., strength: must, section: 7.1.13, subject: ArchitecturalDescription, property: architectureFramework, checkable: static}
- {id: UAF-CARD-016, statement: Every ArchitecturalDescription must have exactly one viewPoint (Viewpoint)., strength: must, section: 7.1.13, subject: ArchitecturalDescription, property: viewPoint, checkable: static}
- {id: UAF-CARD-017, statement: Every View must have exactly one viewpoint (Viewpoint)., strength: must, section: 7.1.13, subject: View, property: viewpoint, checkable: static}
- {id: UAF-VIEW-001, statement: A view built to a view specification shows only the elements listed for that specification (plus the frame elements of its diagram type)., strength: should, section: DMM 2; profile Annex A, checkable: partial}
- {id: UAF-VIEW-002, statement: 'A view is framed by the SysML diagram type that underlies it, and its elements are drawn in the notation of the metaclass the element extends.', strength: note, section: '6.4', checkable: none}
- {id: UAF-VIEW-003, statement: Implementers follow the view naming conventions of the framework they intend to implement., strength: note, section: '6.3', checkable: none}
- {id: UAF-VIEW-004, statement: 'To evaluate behavior and constraints, actual instances of the architectural elements are defined; parametric analysis and simulation are expected from the tool.', strength: note, section: DMM 1.1 (note b), checkable: none}
- {id: UAF-VIEW-005, statement: 'The information model is a column across the layers, in conceptual or logical form; a physical schema is not built in the framework but imported or linked.', strength: note, section: 'DMM 1.1 (notes c, e)', checkable: none}
- {id: UAF-VIEW-006, statement: The parameters column holds the measures and environments for all layers., strength: note, section: DMM 1.1 (note d), checkable: none}
- {id: UAF-GUID-001, statement: 'Architecture descriptions use the terms of ISO/IEC/IEEE 42010 (architecture, architecture description, view, viewpoint, concern, stakeholder, model kind); the correspondence rules are expressed as constraints on the profile.', strength: note, section: '1.2', checkable: none}
- {id: UAF-GUID-002, statement: 'The constraint pictures in the specification (metaconstraint and metarelationship dependencies) are for reading only; the constraints are stated in structured English and are implementable, for example, in OCL.', strength: note, section: '6.5', checkable: none}
- {id: UAF-GUID-003, statement: The grid is not meant to be complete; gaps between domains and model kinds are intended., strength: note, section: DMM 1.1, checkable: none}
- {id: UAF-GUID-004, statement: 'The profile annex that lists which elements fit each view is informative guidance, not a requirement.', strength: note, section: Annex A (profile), checkable: none}
data_types:
  coverage: partial
  section: "7.1, Annex B"
  note: The standard defines no primitive types or units of its own (it uses the UML ones), but it defines a date-time format, 17 enumerations, five data-type elements, and an Annex B library of property groups with two more enumerations, all listed here.
  inherits_from: uml-2
  # Primitive types used below (String, Boolean, Integer, Real) are UML's and are not repeated. SysML value types and units are SysML's, not UAF's.
  types:
    - {name: ISO8601DateTime, kind: primitive, section: "7.1.3.1", domain: "a string holding a date and time in ISO 8601 form with a time zone designator", literal: "YYYY-MM-DDThh:mm:ssTZD"}
    - {name: Condition, kind: structured, section: "7.1.2", note: "extends DataType in the profile; its own properties are on its concept entry"}
    - {name: Environment, kind: structured, section: "7.1.2", note: "extends DataType in the profile; its own properties are on its concept entry"}
    - {name: GeoPoliticalExtentType, kind: structured, section: "7.1.2", note: "extends DataType in the profile; its own properties are on its concept entry"}
    - {name: Location, kind: structured, section: "7.1.2", note: "extends DataType in the profile; its own properties are on its concept entry"}
    - {name: MeasurementSet, kind: structured, section: "7.1.2", note: "extends DataType in the profile; its own properties are on its concept entry"}
    - {name: ActualMeasurementKind, kind: enumeration, values: [Actual, Required, Estimate], section: "7.1.2"}
    - {name: EnvironmentKind, kind: enumeration, values: [TerrainType, WeatherConditions, LightConditions, CBRNEnvironment, SituationType], section: "7.1.2"}
    - {name: GeoPoliticalExtentTypeKind, kind: enumeration, values: [GeoFeatureType, RegionOfCountryType, CountryType, RegionOfWorldType, FacilityType, SiteType, InstallationType, OtherType], section: "7.1.2"}
    - {name: LocationKind, kind: enumeration, values: [SolidVolume, Surface, Line, Point, GeoStationaryPoint, PlanarSurface, PolygonArea, RectangularArea, ElipticalArea, CircularArea, Other], section: "7.1.2"}
    - {name: LocationTypeKind, kind: enumeration, values: [OtherType, SolidVolumeType, SurfaceType, LineType, PointType, GeoStationaryPointType, PlanarSurfaceType, PolygonAreaType, RectangularAreaType, ElipticalAreaType, CircularAreaType], section: "7.1.2"}
    - {name: InformationKind, kind: enumeration, values: [Information, DomainInformation, PositionReferenceFrame, PedigreeInformation, Data], section: "7.1.3.4"}
    - {name: RuleKind, kind: enumeration, values: [StructuralAssertion, ActionAssertion, Derivation, Contract, Constraint, Guidance, SecurityPolicy, Caveat], section: "7.1.3.5"}
    - {name: OperationalExchangeKind, kind: enumeration, values: [MaterielExchange, OrganizationalExchange, EnergyExchange, InformationExchange, ConfigurationExchange, GeoPoliticalExtentExchange], section: "7.1.5.3"}
    - {name: ResponsibleRoleKind, kind: enumeration, values: [Manager, ResponsibleOwner], section: "7.1.7.5"}
    - {name: RoleKind, kind: enumeration, values: [Part, Component, UsedConfiguration, HumanResource, Platform, System, SubOrganization, PostRole, ResponsibilityRole, Equipment, SubSystemPart, UsedPhysicalArchitecture, HostedSoftware, ArtifactComponent, NaturalResourceComponent, Other], section: "7.1.8.2"}
    - {name: ResourceInteractionKind, kind: enumeration, values: [ResourceCommunication, ResourceMovement, ResourceEnergyFlow, GeoPoliticalExtentExchange], section: "7.1.8.3"}
    - {name: DataModelKind, kind: enumeration, values: [Conceptual, Logical, Physical], section: "7.1.8.7"}
    - {name: WholeLifeConfigurationKind, kind: enumeration, values: [Service, ResourcePerformer, OrganizationalResource], section: "7.1.8.9"}
    - {name: ActualMilestoneKind, kind: enumeration, values: [InService, Deployed, NoLongerUsed, OutOfService, Other], section: "7.1.10.1"}
    - {name: ProjectKind, kind: enumeration, values: [Programme, Portfolio, Project, PersonnelDevelopment], section: "7.1.10.1"}
    - {name: StatusIndicators, kind: enumeration, section: "7.1.10.2", note: "the standard names this enumeration and lists no values"}
    - {name: SecurityClassificationKind, kind: enumeration, values: [low, moderate, high], section: "DMM 3.1.7.4"}
    - {name: Periodicity, kind: enumeration, values: [OnceAMonth, OnceAWeek, Anytime, OnRequest], section: "B.1"}
    - {name: PricingType, kind: enumeration, values: [perTIme, perUse, perQuantity], section: "B.1", note: "perTIme is spelled so in the standard"}
    - {name: BillingItem, kind: structured, section: "B.1", note: "what an item costs and how it is paid for", attributes: [{name: cost, type: Cost, multiplicity: '1'}, {name: id, type: String, multiplicity: '0..1'}, {name: numberOfUses, type: Integer, multiplicity: '0..1'}, {name: paymentLocation, type: String, multiplicity: '0..1'}, {name: paymentModality, type: PricingType, multiplicity: '1'}, {name: paymentPeriod, type: Periodicity, multiplicity: '1'}, {name: paymentTimeDuration, type: Duration, multiplicity: '*'}, {name: periodDuration, type: Duration, multiplicity: '0..1'}, {name: quantity, type: String, multiplicity: '0..1'}, {name: unit, type: String, multiplicity: '0..1'}]}
    - {name: ClassificationAttributes, kind: structured, section: "B.1", note: "security classification and handling markings, including declassification", attributes: [{name: classificationReason, type: String}, {name: classifiedBy, type: String}, {name: dateOfExemptedSource, type: String}, {name: declassDate, type: String}, {name: declassException, type: String}, {name: DeclassManualReview, type: String}, {name: derivedFrom, type: String}, {name: DisseminationControls, type: String}, {name: FGIsourceOpen, type: String}, {name: FGIsourceProtected, type: String}, {name: nonICmarkings, type: String}, {name: ownerProducer, type: String}, {name: releasableTo, type: String}, {name: SARIdentifier, type: String}, {name: SCIControls, type: String}, {name: typeOfExemptedSource, type: String}, {name: taxonomy, type: String}]}
    - {name: CommunicationsLinkProperties, kind: structured, section: "B.1", note: "capacity and technology of a communications link", attributes: [{name: capacity, type: String}, {name: infrastructureTechnology, type: String}]}
    - {name: DataElementProperties, kind: structured, section: "B.1", note: "format, media, accuracy and unit of a data element", attributes: [{name: accuracy, type: String}, {name: content, type: String}, {name: formatType, type: String}, {name: mediaType, type: String}, {name: scope, type: String}, {name: unitOfMeasurement, type: String}]}
    - {name: Duration, kind: structured, section: "B.1", note: "a length of time as a unit and a value", attributes: [{name: timeUnit, type: String, multiplicity: '0..1'}, {name: value, type: Integer, multiplicity: '0..1'}]}
    - {name: ExchangeProperties, kind: structured, section: "B.1", note: "qualities of an exchange such as periodicity, size and throughput", attributes: [{name: accountability, type: String, multiplicity: '*'}, {name: periodicity, type: String, multiplicity: '*'}, {name: size, type: String, multiplicity: '*'}, {name: throughput, type: String, multiplicity: '*'}, {name: timeliness, type: String, multiplicity: '*'}, {name: transactionType, type: String, multiplicity: '*'}]}
    - {name: InformationElementProperties, kind: structured, section: "B.1", note: "accuracy, content, language and scope of an information element", attributes: [{name: accuracy, type: String, multiplicity: '*'}, {name: content, type: String, multiplicity: '*'}, {name: language, type: String, multiplicity: '*'}, {name: scope, type: String, multiplicity: '*'}]}
    - {name: OperationalActivityProperties, kind: structured, section: "B.1", note: "the cost of an activity", attributes: [{name: cost, type: String}]}
    - {name: SecurityControlAssessmentProperties, kind: structured, section: "B.1", note: "how broadly and deeply a security control was assessed, and how well it works", attributes: [{name: coverageOfSecurityControlAssessment, type: String, multiplicity: '*'}, {name: depthOfSecurityControlAssessment, type: String, multiplicity: '*'}, {name: effectivenessOfSecurityControl, type: String, multiplicity: '*'}]}
    - {name: SecurityControlProperties, kind: structured, section: "B.1", note: "how applicable and how important a security control is", attributes: [{name: securityControlApplicability, type: String, multiplicity: '1'}, {name: securityControlImportance, type: String, multiplicity: '1'}]}
    - {name: SecurityImpactProperties, kind: structured, section: "B.1", note: "security category and the impacts on availability, confidentiality and integrity", attributes: [{name: securityAvailabilityImpact, type: String, multiplicity: '*'}, {name: securityClassification, type: String, multiplicity: '*'}, {name: securityConfidentialityImpact, type: String, multiplicity: '*'}, {name: securityIntegrityImpact, type: String, multiplicity: '*'}]}
  attributes:
    coverage: every_concept
    where: concepts
    note: Each concept entry that the standard gives attributes for lists them under `attributes` (name, type, multiplicity, or default where the standard writes one); association ends are under `association_ends` and typing rules under `typing`. The Annex B property groups carry their attributes inside their `types` entries. The standard leaves some multiplicities empty or odd.
notation:
  coverage: informative
  section: "1.2, 6.4, 6.5"
  note: UAF defines no symbols of its own; it expects each element to be drawn in the standard SysML or UML notation of the metaclass it extends, in a frame of the underlying SysML diagram type, and its figures show how the profile is defined rather than how a model looks.
  inherits_from: sysml-1
  # The standard expects this (6.4, 'is expected') and does not require it. It names SysML 1.4; the sysml-1 guide describes 1.5. Where the extended metaclass is a UML one with no SysML symbol of its own, the uml-2 guide applies.
  # Nothing in the standard differs from the notation of the extended metaclass, so no element or relationship has its own entry; every concept and relationship is covered by `default` or listed under `not_specified`.
  default:
    shape: "the symbol the sysml-1 guide gives the SysML element, or the uml-2 guide gives the UML metaclass, that the element extends (the uml_base on its concept entry): a Class element is a rectangle with compartments, a Property a part box or an attribute line, a Port a small square on a border, an Activity or a called behavior a rounded rectangle, a StateMachine a state graph, an InstanceSpecification a rectangle with its name underlined, a Comment a note symbol with a folded corner, an enumeration a rectangle with one literal per line; the stereotype name is shown as the keyword in guillemets above the element name, as UML shows any stereotype"
    line: "the line the sysml-1 guide gives the SysML relationship, or the uml-2 guide the UML relationship, that the element extends: a Dependency or Abstraction is a dashed line with an open arrowhead at the supplier end (the target), an InformationFlow is a dashed line with an open arrowhead and a small filled triangle for the direction conveyed, a Connector is a solid line between roles or ports with no arrowhead, a control flow or object flow is a solid line with an open arrowhead, a Message is the line a sequence diagram gives it; the relationship name is written on the line in guillemets"
    frame: "a frame of the underlying SysML diagram type that the view is based on"
    section: "6.4"
  # Never drawn directly: the 33 elements the profile marks abstract (UAF-GEN-001; their concrete specializations are drawn) and the 9 concepts that exist only in the metamodel (one of them, SecurityMeasurement, is abstract there), which have no profile element or metaclass.
  not_specified: [LocationHolder, MeasurableElement, PropertySet, ActualState, Exchange, Resource, Activity, CapableElement, Rule, Achiever, Desirer, ConceptItem, OperationalAgent, OperationalExchangeItem, OperationalActivityEdge, SubjectOfOperationalConstraint, OrganizationalResource, PhysicalResource, ResourcePerformer, ResourceExchangeItem, FunctionEdge, SubjectOfResourceConstraint, SubjectOfForecast, VersionedElement, ProtocolImplementation, Asset, AssetRole, SubjectOfSecurityConstraint, ActualOrganizationalResource, ActualResponsibleResource, Architecture, Stakeholder, UAFElement, SecurityMeasurement, ActivityPerformableUnderCondition, SecurityControlAction, Caveat, SecurityAvailability, SecurityCategory, SecurityClassification, SecurityClassificationKind, SecurityIntegrity]

layout:
  basis: Our conventions, not this standard's. Sizes and spacing come from the shared layout standard; this block only says which element type each concept takes.
  element_types:        # concept -> element type; a concept left out is drawn as a rectangle (box)
    OperationalPort: attached-item
    ServicePort: attached-item
    ResourcePort: attached-item
    Alias: note
    Definition: note
    ArchitectureMetadata: note
    Information: note
    Metadata: note
    VisionStatement: note
    OperationalConstraint: note
    ServicePolicy: note
    ResourceConstraint: note
    SecurityConstraint: note
    DataModel: container
    ArchitecturalDescription: container
  exceptions: {}        # none: no standard states a size
  no_element_type:      # concepts with no element of their own, and why
    line:
      reason: 'A relationship: it is drawn as a line between elements and takes no element size.'
      concepts: [SameAs, IsCapableToPerform, PerformsInContext, ArchitecturalReference, Implements, CapabilityForTask,
        AchievedEffect, DesiredEffect, Exhibits, MapsToCapability, OrganizationInEnterprise, ArbitraryConnector,
        OperationalConnector, OperationalExchange, OperationalControlFlow, OperationalObjectFlow, OperationalMessage,
        ServiceConnector, ServiceMessage, Consumes, Command, Control, CompetenceToConduct, CompetenceForRole,
        RequiresCompetence, ResponsibleFor, ResourceConnector, ResourceExchange, FunctionControlFlow,
        FunctionObjectFlow, ResourceMessage, Forecast, VersionSuccession, Enhances, Protects, ProtectsInContext,
        Affects, AffectsInContext, Mitigates, OwnsRisk, OwnsRiskInContext, MilestoneDependency, ProjectSequence,
        ActualResourceRelationship, FillsPost, ProvidesCompetence, OwnsProcess]
    text-inside:
      reason: Written as a line of text inside the box that owns it (a slot, operation, parameter, reception or literal), so it has no box of its own.
      concepts: [ActualMeasurement, ISO8601DateTime, OperationalMethod, OperationalParameter, ServiceMethod, ServiceParameter,
        ResourceMethod, ResourceParameter, ProjectStatus, ActualProjectMilestoneRole, ActualProjectRole,
        ActualOrganizationRole, ActualResourceRole]
    not-drawn:
      reason: Abstract, or a concept that exists only in the metamodel, so nothing is drawn for it.
      concepts: [LocationHolder, MeasurableElement, PropertySet, ActualState, Exchange, Resource, Activity, CapableElement,
        Rule, Achiever, Desirer, ConceptItem, OperationalAgent, OperationalExchangeItem, OperationalActivityEdge,
        SubjectOfOperationalConstraint, OrganizationalResource, PhysicalResource, ResourcePerformer,
        ResourceExchangeItem, FunctionEdge, SubjectOfResourceConstraint, SubjectOfForecast, VersionedElement,
        ProtocolImplementation, Asset, AssetRole, SubjectOfSecurityConstraint, ActualOrganizationalResource,
        ActualResponsibleResource, Architecture, Stakeholder, UAFElement, SecurityMeasurement]
