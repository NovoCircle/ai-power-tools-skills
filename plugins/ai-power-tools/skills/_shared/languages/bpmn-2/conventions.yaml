      item_gap_y: 50
      item_gap_flow: 60
      lane_gap: 0
      min_lane_thickness: 120
      band_gap: 30
      origin_left: 40
      origin_top: -40
      band_pad_x: 12
      band_pad_y: 12
      lane_pad: 12
      grid_pad: 12
      label_height: 28
    routing:
      default: OrthogonalSquare
    channels:
      fill: 'Node kind. Events, activities, gateways, and data each read differently. Conventional rather
        than normative: the standard fixes the shape, not the color.'
      claimed:
        position: 'Two things at once, which is what makes a BPMN diagram readable: which lane an element
          is in says WHO, and how far along the flow it sits says WHEN. Neither is available for anything
          else.'
        size: Node kind. An event is a small circle because it is an event. Size is not a free channel
          in this notation.
      free:
      - border
      - border_width
      - line_color
      - font_color
      - opacity
      - icon
