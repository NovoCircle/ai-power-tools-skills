  variants:
    CasePlanModel: {of: Stage, when: the stage a Case refers to as its casePlanModel, section: 5.2.1; 5.4.8; 6.3, note: 'The outermost stage. Never a plan item definition, no default control, no entry criteria, may have stage-level exit criteria and a planning table. Drawn as a folder shape.'}
    BlockingTask: {of: Task, when: isBlocking = true (the default), section: 5.4.10, note: The task waits until its work is done.}
    NonBlockingTask: {of: Task, when: isBlocking = false, section: 5.4.10, note: Completes at once when instantiated; no outputs; no exit criteria.}
    ManualTask: {of: HumanTask, when: isBlocking = false, section: 5.4.10.4, note: 'A non-blocking human task: the system does not track its lifecycle. No planning table.'}
    DiscretionaryTask: {of: DiscretionaryItem, when: definitionRef is a Task, section: 5.4.9, note: Convenience name. Likewise discretionary stage and discretionary plan fragment.}
    PlanFragmentOnly: {of: PlanFragment, when: a plan fragment that is not a Stage, section: 5.4.4; 5.4.5, note: Has no run-time life; can only be discretionary; cannot be used by a plan item.}
  enumerations:
    CaseFileItemTransition: {section: '5.4.6.2.1, Table 5.29', values: [addChild, addReference, create, delete, removeChild, removeReference, replace, update]}
    PlanItemTransition: {section: '5.4.6.3.1, Table 5.31', values: [close, complete, create, disable, enable, exit, fault, manualStart, occur, parentResume, parentSuspend, reactivate, reenable, resume, start, suspend, terminate]}
    MultiplicityEnum: {section: '5.3.2, Table 5.17; schema', values: [ZeroOrOne, ZeroOrMore, ExactlyOne, OneOrMore, Unspecified, Unknown], note: The text names the type and gives no value list; the values are from the schema.}
    RelationshipDirection: {section: '5.1.6, Table 5.13', values: [None, Forward, Backward, Both]}
    AssociationDirection: {section: '5.5.1, Table 5.56', values: [None, One, Both], default: None}
    DefinitionType: {section: '5.1.4, Table 5.6', values: [CMISFolder, CMISDocument, CMISRelationship, XSDElement, XSDComplexType, XSDSimpleType, Unknown, Unspecified], note: 'The schema adds WSDLMessage and UMLClass. Each value is a URI under http://www.omg.org/spec/CMMN/DefinitionType/.'}
    PropertyType: {section: '5.1.4.1, Table 5.8', values: [string, boolean, integer, float, double, duration, dateTime, time, date, gYearMonth, gYear, gMonthDay, gDay, gMonth, hexBinary, base64Binary, anyURI, QName, decimal, Unspecified], note: 'Each value is a URI under http://www.omg.org/spec/CMMN/PropertyType/.'}
    ProcessImplementationType: {section: '5.4.10.5.1, Table 5.46', values: [BPMN20, XPDL2, WSBPEL20, WSBPEL1], note: 'The schema adds Unknown and Unspecified. Each value is a URI under http://www.omg.org/spec/CMMN/ProcessType/.'}
    DecisionImplementationType: {section: '5.4.10.7.1, Table 5.50', values: [DMN1], note: 'The schema adds Unknown and Unspecified. Each value is a URI under http://www.omg.org/spec/CMMN/DecisionType/.'}
relationships:
  note: CMMN gives no allowed-relationship table. Its relationships are the associations of the metamodel (items; kind is composition or reference) and the three kinds of link drawn between shapes (diagram_links). Strengths on cardinalities are in constraints. Where the schema allows a lower bound of zero but the text says one, both are recorded (see each note and constraint STR-001).
