layout:
  basis: Our conventions, not this standard's. Sizes and spacing come from the shared layout standard.
  note: A data object's circle holds its name, so it takes the box size and is drawn as a circle within it; the event circle is too small to hold a name. A functional component holds its data objects, so it's a container.
  element_types:
    ValueNetwork: container
    ValueStream: container
    ValueStreamStage: box
    Scenario: box
    Stakeholder: box
    FunctionalGroup: container
    FunctionalComponent: container
    LifecycleDataObject: box
    KeyDataObject: box
    BackboneDataObject: box
    DigitalProductBackbone: container
    ServiceOfferBackbone: container
    KeyAttribute: box
    Capability: box
    EssentialService: box
    Process: box
  no_element_type:
    drawn_as_line:
      reason: These are lines or nesting, as notation says, so there is no symbol to size.
      concepts: [DataRelationship, SystemOfRecordIntegration, EngagementIntegration, DataFlow, ValueNetworkComprisesValueStream, ValueStreamHasScenario, ValueStreamHasStage, ValueStreamDependsOnValueStream, StageInvolvesStakeholder, StageUsesDataObject, FunctionalGroupContainsFunctionalGroup, FunctionalGroupContainsFunctionalComponent, FunctionalComponentControlsDataObject, FunctionalComponentSupportsValueStream, DataObjectRelatesToDataObject, DataObjectHasKeyAttribute, DataFlowConnectsFunctionalComponents, CapabilityRelatesToFunctionalComponent, EssentialServiceBelongsToFunctionalComponent, BackboneGroupsBackboneDataObjects, FunctionalGroupRelatesToValueNetwork, FunctionalGroupAggregatesCapability, CapabilityRelatesToStakeholder, FunctionalComponentRealizesCapability, FunctionalComponentRealizesEssentialService, ProcessRealizesCapability, EssentialServiceServesProcess, EssentialServiceRelatesToSystemOfRecordIntegration, SystemOfRecordIntegrationRelatesToDataRelationship]
    drawn_as_data_object:
      reason: Each appears in a model as the reference model's data object of that name, which takes the box size.
      concepts: [DigitalProduct, ServiceOffer, ServiceContract, DigitalProductInstance]
    no_symbol:
      reason: The figures read for this guide give these no symbol. The data objects together form the system of record, and a system is what a product instance runs on.
      concepts: [SystemOfRecord, System]
  exceptions: {}
  diagram_types:
    Level 1 End-to-End Overview: {arrangement: nested-grid, route: orthogonal, title: frame-header, channels: {fill: "the kind of data object: black for key, orange for backbone"}}
    Level 2 Value Stream Documentation: {arrangement: nested-grid, route: orthogonal, title: frame-header}
    Level 3 Vendor-Independent Architecture: {arrangement: nested-grid, route: orthogonal, title: frame-header, channels: {fill: "the kind of data object: black for key, orange for backbone", line_color: "the kind of integration: black for system of record, blue for engagement"}}
  viewpoints: {}
conventions:
  provenance: Drawing facts stated in the text of 11.7 to 11.10. The top-level notation key adds what the standard's figures show.
  notation:
  - element: Value stream
    drawing: A simplified notation and an ArchiMate-aligned notation both exist (Figure 77, an image); the text does not describe the shape
    section: 11.7.2
  - element: Functional group
    drawing: ArchiMate grouping shown by containment around its components and data objects (Figure 79)
    section: 11.7.3
  - element: Primary functional component
    drawing: Blue rectangle in the simplified notation
    section: 11.7.4
  - element: Secondary functional component
    drawing: Gray rectangle in the simplified notation
    section: 11.7.4
  - element: Key data object
    drawing: Black circle in the simplified notation
    section: 11.7.5
  - element: Backbone data object
    drawing: Orange circle in the simplified notation
    section: 11.7.5
  - element: Controlled data object
    drawing: The data object is embedded inside the component that controls it (Figure 82)
    section: 11.7.5
  - element: Data relationship
    drawing: A line between the two data objects; identical in the simplified and ArchiMate notations
    section: 11.7.7
  - element: System of record integration
    drawing: Black dotted line with a solid end arrow, named by the data object transferred
    section: 11.9.5
  - element: Engagement integration
    drawing: Blue dotted line with a solid end arrow, named by the engagement or action responsible
    section: 11.9.5
  - element: Essential service (Level 4)
    drawing: Oval inside a functional component in the informal notation
    section: 11.10.3
  notations_available:
  - Simplified notation (circles, rectangles, lines) for readers new to ArchiMate
  - ArchiMate notation
archimate_mapping:
  note: Stated by the standard as a fact; the mapping is recorded here, not modeled. ArchiMate has no attributes or cardinality, so the standard documents both as text.
  rows:
  - concept: Functional Component
    archimate: Application Function
    section: 11.7.4
  - concept: Lifecycle Data Object
    archimate: Data Object
    section: 11.7.5
  - concept: Functional Group
    archimate: Grouping
    section: 11.7.3
  - concept: Value Stream and Value Stream Stage
    archimate: Value Stream (the text writes "Value Stream data object", apparently a slip)
    section: 11.8.3
  - concept: Scenario
    archimate: Outcome (a motivation element)
    section: 11.8.2
  - concept: Stakeholder
    archimate: Stakeholder (the text writes "Business Stakeholder motivational element")
    section: 11.8.4
  - concept: Essential Service (Level 4)
    archimate: Application Service
    section: 11.10.3
  - concept: System of record integration and engagement integration
    archimate: Collaboration and interaction concepts
    section: 11.9.5
  - concept: Data relationship
    archimate: A plain line between two Data Objects; ArchiMate cannot carry cardinality, so it is documented in text
    section: 11.7.7; 11.9.2
  - concept: Data object attributes
    archimate: Not modeled; ArchiMate has no attributes, so they are documented as name and description lists
    section: 11.9.1
  - concept: Capability (Level 4)
    archimate: Capability, recommended but non-normative
    section: 11.10.2
notes: 'IT4IT defines a reference model, not a drawing notation. Its "diagram types" are the abstraction levels. Strength follows decision A5 (shall and must = must, should = should,
  may and can = note). Constraint categories: MM metamodel and levels, DEF definitions, NAME naming, ATTR key attributes, REL relationships and data flow, CRIT functional criteria, VS
  value stream activities. Multiplicity keys: targets_per_source is how many targets one source can relate to; sources_per_target is how many sources one target can relate to; "*" is
  zero or more, "0..1" is at most one. standard_cardinality keeps the standard''s own x:y notation: "A to B (1:n)" means one A can relate to many B and one B to at most one A.'
