rules:
  - id: BPMN2-CONN-002
    name: Sequence flow joins flow nodes allowed by Table 7.3
    implements: BPMN-CONN-002
    description: 'A sequence flow joins events, activities (or choreography activities) and gateways, and only the pairs Table
      7.3 allows: nothing leaves an end event, nothing enters a start event. Checked on the stored stereotypes, so a task,
      a sub-process and a call activity are all `Activity`. Pools, lanes, data objects, groups and text annotations are judged
      by BPMN2-CONN-005 and BPMN2-CONN-006a. [OMG BPMN 2.0.2 (formal/13-12-09) 8.4.13 p. 95]'
    category: connection
    severity: error
    demo_trigger: true
    coverage: full
    selector:
      type: connector
      connector_stereotypes: any_of_table
    condition:
      type: relationship_table
      table: bpmn-2-sequence-flow
      skip_endpoints:
      - Pool
      - Lane
      - DataObject
      - Group
      - TextAnnotation
      unknown_endpoint: error
    remediation:
      short: Connect the sequence flow between events, activities and gateways Table 7.3 allows, or use a message flow to
        cross to another participant.
      auto_fixable: false

  - id: BPMN2-CONN-005
    name: Artifacts take no sequence or message flow
    implements: BPMN-CONN-005
    description: A group or a text annotation is an artifact and is never the source or target of a sequence flow or a message
      flow; link it with an association. [OMG BPMN 2.0.2 (formal/13-12-09) 8.4.1 pp. 64 to 65]
    category: connection
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: connector
      connector_stereotypes:
      - SequenceFlow
      - MessageFlow
    condition:
      type: connector_endpoint_stereotype
      source_must_be_one_of:
      - Activity
      - Assignment
      - BPELProcess
      - BusinessProcess
      - Category
      - CategoryValue
      - Choreography
      - ChoreographyModel
      - CollaborationModel
      - ComplexBehaviorDefinition
      - Conversation
      - ConversationModel
      - CorrelationKey
      - CorrelationProperty
      - CorrelationPropertyBinding
      - CorrelationPropertyRetrievalExpression
      - CorrelationSubscription
      - DataObject
      - DataStore
      - EndEvent
      - EndPoint
      - Error
      - Escalation
      - Gateway
      - GlobalTask
      - IOSpecification
      - InputOutputBinding
      - InputSet
      - Interface
      - IntermediateEvent
      - ItemDefinition
      - Lane
      - Message
      - Operation
      - OutputSet
      - Participant
      - PartnerEntity
      - PartnerRole
      - Pool
      - Resource
      - ResourceParameter
      - ResourceRole
      - Signal
      - StartEvent
      - ''
      target_must_be_one_of:
      - Activity
      - Assignment
      - BPELProcess
      - BusinessProcess
      - Category
      - CategoryValue
      - Choreography
      - ChoreographyModel
      - CollaborationModel
      - ComplexBehaviorDefinition
      - Conversation
      - ConversationModel
      - CorrelationKey
      - CorrelationProperty
      - CorrelationPropertyBinding
      - CorrelationPropertyRetrievalExpression
      - CorrelationSubscription
      - DataObject
      - DataStore
      - EndEvent
      - EndPoint
      - Error
      - Escalation
      - Gateway
      - GlobalTask
      - IOSpecification
      - InputOutputBinding
      - InputSet
      - Interface
      - IntermediateEvent
      - ItemDefinition
      - Lane
      - Message
      - Operation
      - OutputSet
      - Participant
      - PartnerEntity
      - PartnerRole
      - Pool
      - Resource
      - ResourceParameter
      - ResourceRole
      - Signal
      - StartEvent
      - ''
    remediation:
      short: Replace the flow with an Association between the artifact and the element.
      auto_fixable: false

  - id: BPMN2-CONN-006a
    name: No sequence flow on pools, lanes, data objects or artifacts
    implements: BPMN-CONN-006
    description: A pool, a lane, a data object, a group and a text annotation cannot be the source or target of a sequence
      flow. [OMG BPMN 2.0.2 (formal/13-12-09) 7.6.1 to 7.6.2 pp. 41 to 42]
    category: connection
    severity: error
    demo_trigger: false
    coverage: full
    selector:
      type: connector
      connector_stereotype: SequenceFlow
    condition:
      type: connector_endpoint_stereotype
      source_must_be_one_of:
