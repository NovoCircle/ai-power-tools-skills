# EA facts for UML 2.5.1 as Sparx Enterprise Architect stores it.
# Measured by reading back what EA stores.
# UML is EA's native language, not an MDG technology: an element is told apart by t_object.Object_Type and a connector by
# t_connector.Connector_Type, mostly with no stereotype. So `concepts` maps a concept to an EA element type, connector type or record
# (not to a stereotype), and the sections `element_types`, `connector_types`, `connector_kinds`, `standard_profile` and `keywords`
# list every stored form a ruleset selector may name. Every type below was created in EA and read back; Westbrook Bank appears only in
# howto.md, as an illustration.
language: uml-2
technology: none
technology_note: EA's native UML types. EA reports the internal technologies UML2 and EAExtended as loaded, but neither is a prefix that creates
  anything (IsTechnologyLoaded('UML') is False). No <TECH>::<name> form applies to elements or connectors; diagrams take a plain type string.
display_name: UML 2.5.1
profile:
  standard_profile: StandardProfileL2 (the UML Standard Profile; names bind as StandardProfileL2::<name>)
  core_extensions: EAUML (EA's own profile; holds some UML keyword stereotypes)
stereotype_prefix: ''
stereotype_storage: 'Almost nothing carries a stereotype. A UML element is identified by t_object.Object_Type (EA''s own names: Class, UseCase,
  Actor, Component, Port, StateNode, Action, ActionPin...) and a connector by t_connector.Connector_Type (Generalization, Association, Realisation,
  UseCase, ControlFlow, StateFlow...). The UML keywords (include, extend, import, access, merge, substitute, use, call, send, create, instantiate,
  derive, refine, trace) are free text in t_connector.Stereotype (EA stores any string; the t_xref row holds only a GUID) unless the string matches
  a profile name, which then adds an FQName (StandardProfileL2::, EAUML::, or another technology''s name for a word it also defines). A kind of
  element that EA keeps under one type (initial or final state, event kind, fragment operator) is a number in t_object.NType. A rule selects with
  selector.types, selector.connector_types and type:<Object_Type> in connector ends, tables and containers.'
measured_on:
  ea: 17.1 build 1716
  date: '2026-10-21'
  library_version: '1716'
  technology_version: none
  technology_file: 'none: UML types are built into EA; nothing was read from a file except EA''s shipped UML model patterns (ModelPatterns\um2.5-*.xml)
    for diagram type strings and use case connector kinds'
  standard_version: UML 2.5.1 (OMG formal/17-12-05); the latest version, no newer one exists (OMG lists none after December 2017)
