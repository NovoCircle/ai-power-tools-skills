    tag_value: InputOutput=Input
  OutputPort:
    representation: stereotype and tag
    stereotype: BoundaryPort
    metaclass: Port
    tags:
    - InputOutput
    - withCondition
    note: an Activity, Store or Pool port; the direction is the tag InputOutput = Output
    tag_value: InputOutput=Output
  DeliverableFlow:
    representation: connector stereotype
    stereotype: DeliverableFlow
    metaclass: Dependency
    tags:
