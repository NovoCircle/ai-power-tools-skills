    DecisionParameter: {display: Decision Parameter, category: Tasks, specializes: Parameter, section: 5.4.10.7.1, note: Named in the attribute table of Decision; no section of its own.}
    ParameterMapping: {display: Parameter Mapping, category: Tasks, specializes: CMMNElement, section: 5.4.10.2}
    Process: {display: Process, category: Tasks, specializes: CMMNElement, section: 5.4.10.5.1, attributes: [{name: name, type: String, section: '5.4.10.5.1, Figure 5.12'}, {name: implementationType, type: URI, section: '5.4.10.5.1, Figure 5.12'}, {name: externalRef, type: QName, section: '5.4.10.5.1, Figure 5.12'}]}
    Decision: {display: Decision, category: Tasks, specializes: CMMNElement, section: 5.4.10.7.1, note: 'The text says the class inherits from "CMMElement", read as a typo for the common element class.', attributes: [{name: name, type: String, section: '5.4.10.7.1, Figure 5.12'}, {name: implementationType, type: URI, section: '5.4.10.7.1, Figure 5.12'}, {name: externalRef, type: QName, section: '5.4.10.7.1, Figure 5.12'}]}
