  strength: must
  section: 13.3.3
  checkable: static
  source: 'prose: timeevent-relative-in-trigger'
- id: UML-SEM-014
  statement: A history pseudostate (deep or shallow) can be defined only in a composite state.
  strength: must
  section: 14.2.3.7
  checkable: static
  source: 'prose: history-only-composite'
- id: UML-SEM-015
