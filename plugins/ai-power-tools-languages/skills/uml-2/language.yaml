- id: UML-SEM-088
  statement: 'The ends of five relationships are typed by the metamodel as follows. An Include joins an including use case (includingCase) to an added use case (addition), both UseCases. An Extend joins an extension use case (extension) to an extended use case (extendedCase), both UseCases. A PackageImport joins an importing Namespace (importingNamespace) to an imported Package (importedPackage). A PackageMerge joins a receiving Package (receivingPackage) to a merged Package (mergedPackage). A Substitution joins a substituting Classifier (substitutingClassifier) to a contract Classifier (contract). Each end holds exactly one element.'
  strength: must
  section: 18.2.4; 18.2.2; 7.8.11; 12.4.6; 9.9.22
  checkable: static
  source: 'prose: keyword-relationship-ends'
conventions:
  provenance:
    status: standard
    note: Drawing and notation rules of clauses 7 to 20, Annex A and Annex C. They are conventions for a renderer or a reader, not validation. Where a notation sentence is also a model requirement it is a prose constraint.
  frame:
    heading: '`[kind] name [parameters]` in a pentagon (name tag) at the upper left of the frame; the frame may be omitted and then the heading is too (Annex A)'
    kinds: [activity, class, component, deployment, interaction, package, state machine, use case]
    abbreviations: {act: activity, cmp: component, dep: deployment, sd: interaction, pkg: package, stm: state machine, uc: use case}
    frame_purpose: 'mainly for diagrams with border elements: ports, entry and exit points, activity parameter nodes'
  keywords:
    rule: Keywords are reserved words in guillemets (Annex C). Several keywords or stereotype names may be listed one pair of guillemets each, or together separated by commas. Not every word in guillemets is a keyword or a stereotype. Using a keyword as a user stereotype is discouraged.
    table: see keywords
  classifier:
    default_shape: rectangle with the name (bold, centered, normally capitalized) and compartments below; keyword above the name for every metaclass except Class (9.2.4)
    compartments: 'attributes, operations, receptions (mandatory, in that order when shown) and internal structure (mandatory for classes); optional: provided/required interfaces, realizations, artifacts, packaged elements, nested classifiers, constraints'
    abstract: name in italics or {abstract}
    inherited_member: caret ^ before the normal text
    suppression: any compartment or part may be suppressed; absence says nothing about the model
    visibility_symbols: {public: +, private: '-', protected: '#', package: '~'}
  relationship_lines:
    Association: A solid line between classifiers (or one classifier and itself), or a diamond with a line per end (required for more than two ends); name, derived slash, read-direction arrow, end adornments.
    Aggregation (shared): Hollow diamond on the line at the aggregate end, smaller than an association diamond.
    Composition (composite aggregation): Filled diamond at the aggregate end.
    Association class: A class symbol joined to the association path (or its diamond) by a dashed line; one shared name.
    Link: Association notation between instance specifications (names underlined when needed).
    Generalization: Solid line with a hollow triangle at the general classifier; separate-target or shared-target style.
    Generalization set: 'Name on generalization lines, shared arrowhead, or a dashed line across arrows; {complete|incomplete, disjoint|overlapping}; power type after a colon.'
    Dependency: Dashed arrow from client (tail) to supplier (head), optional keyword and name; dot junction for sets.
    Abstraction: Dependency with <<abstraction>> or a standard stereotype <<derive>>, <<refine>>, <<trace>>; optional mapping expression.
    Realization: Dashed line with a hollow triangular arrowhead at the realized element.
    Substitution: Dependency with <<substitute>>.
    Usage: Dependency with <<use>>; standard stereotypes <<call>>, <<create>>, <<instantiate>>, <<responsibility>>, <<send>> restrict it further.
    Interface realization: A ball (lollipop) attached to the realizing classifier, or a dashed line with a hollow triangle to the interface rectangle.
    Component realization: Dashed line with a hollow triangle (same as Realization).
    Role binding: Dashed line from the occurrence ellipse to the client, labeled with the supplier's name; or ordinary dependency arrows with <<occurrence>>.
    Manifestation: Dashed open arrow with <<manifest>>.
    Deployment: Dashed arrow from artifact to target with <<deploy>>, or nesting inside the target.
    Template binding: Dashed arrow from bound element to template with <<bind>> and substitutions.
    Element import: Dashed open arrow with <<element import>> / <<element access>> (private), optional alias.
    Package import: Dashed open arrow with <<import>> (public) or <<access>> (private).
    Package merge: Dashed open arrow with <<merge>>.
    Profile application: Dashed open arrow with <<apply>> or, if isStrict, <<strict>>.
    Extension: Arrow from the stereotype to the metaclass with a filled triangle; {required} when isRequired.
    Include: Dashed open arrow from the base use case with <<include>>.
    Extend: Dashed open arrow from the extending use case with <<extend>>; condition and extension points in an attached note.
    Protocol conformance: (no distinct notation read)
    Information flow: Dependency-style dashed arrow with <<flow>>; item names near it.
    Connector: Line like an association, optionally with ball-and-socket for simple ports; assembly or delegation.
    Communication path: Association notation between nodes.
    Transition: Directed arc labeled trigger [guard] / effect.
    Activity edge (control flow, object flow): Open-arrowhead line; guard in brackets, weight in braces.
    Message: Arrows by messageSort; lost and found with circles.
    General ordering: Dotted line with a mid-line arrowhead.
    Comment annotation: Note symbol with a dashed line to each annotated element.
    Constraint application: '{ constraint } text near the element, in a note, or on a dashed line between two elements.'
  association_end:
    name_and_multiplicity: name near the end; multiplicity text without brackets (`1`, `0..1`, `*`, `lower..upper`); `1` means `1..1`, `*` means `0..*`
    navigability: open arrowhead = navigable; small x = not navigable; per-diagram options show all, none, or only one-way arrows
    ownership_dot: optional small filled dot at the classifier means the end is owned by that classifier; applied consistently on a diagram; the navigability-implies-ownership convention is deprecated
    aggregation: hollow diamond (shared) and filled diamond (composite) at the aggregate end
    qualifier: small rectangle on the qualified end, attributes one per line, may not be suppressed
    derived: slash before the name
  property_syntax: '[visibility] [/] name [: type] [[multiplicity]] [= default] [{modifiers}] with modifiers readOnly, union, subsets x, redefines x, ordered, unordered, unique, nonunique, seq, id (9.5.4)'
  operation_syntax: '[visibility] name ( parameters ) [: [return-type] [[multiplicity]] [{modifiers}]] with modifiers redefines x, query, ordered, unordered, unique, nonunique, seq (9.6.4); parameter [direction] name : type [[mult]] [= default] [{properties}], direction in, out or inout, default in (9.4.4)'
  generalization_set: constraints {complete|incomplete, disjoint|overlapping}, default {incomplete, overlapping}; shared-arrowhead, named-line or dashed-line forms; power type after a colon (9.7.4)
  stereotypes: name in guillemets above or before the element name; case-insensitive match to the definition; tagged values as name = value pairs in a comment, in per-stereotype compartments (classifiers and states only) or above the name in braces; icons may replace the box, sit inside it, or next to a line (12.3.4)
  multiplicity_text: '`<lower>..<upper>` with optional `{ordered|unordered, unique|nonunique}` (7.5.4)'
  diagrams:
    Class diagram: classifier rectangles with the compartments above; generalization, association and dependency lines; ball and socket for interfaces; template parameter box at the upper right
    Object diagram: 'underlined `name : Classifier`; slots as `feature = value`; links drawn with the association notation; anonymous instance is a lone colon'
    Package diagram: folder symbol; name in the tab when members are shown inside, otherwise in the large rectangle; + or - before member names; circled plus for membership; {uri = ...}
    Composite structure diagram: 'internal structure compartment; part boxes solid (composite) or dashed (not composite); ports are small squares on the boundary; connectors named `[name] : association`; collaboration as a dashed ellipse'
    Component diagram: rectangle with <<component>> or the component icon; ball and socket; assembly and delegation connectors
    Deployment diagram: 3D box for nodes (name preceded by a colon for instances); artifacts as rectangles with <<artifact>> or a document icon; <<deploy>> arrows or nesting; <<manifest>> arrows
    Profile diagram: stereotypes as classes with <<stereotype>>; extension arrow with a filled triangle and {required}; <<apply>> / <<strict>> dashed arrows; <<reference>> imports
    Use case diagram: ellipses inside a subject rectangle; stick-figure actors or <<actor>>; dashed <<include>> and <<extend>> arrows; extension points in a compartment
    Activity diagram: rounded rectangles for actions; open-arrow edges with [guard] and {weight = n}; bar for fork and join; diamond for decision and merge; solid circle initial; bull's-eye activity final; circled X flow final; swimlanes as parallel lines; dashed rounded rectangle interruptible region; lightning bolt for interrupt and exception edges
    State machine diagram: rounded rectangles for states with name, internal behaviors and transitions compartments; regions separated by dashed lines; pseudostate symbols (initial filled circle, H, H*, small circles for entry and exit points, diamond choice, cross terminate, bar fork and join); transitions labeled trigger [guard] / effect
    Sequence diagram: frame with sd pentagon; lifeline head and vertical line; thin rectangles for executions; arrows by message sort (filled head synchronous, open asynchronous, dashed reply); X for destruction; combined fragments with operator pentagon and dashed operand separators
    Communication diagram: lifelines joined by links; messages with sequence expressions (dot nesting, letters for concurrency, * iteration, [guard])
    Timing diagram: state or value timelines along a linear time axis, messages, time constraints
    Interaction overview diagram: activity-diagram notation with inline interactions or interaction uses as nodes; properly nested branching
notes: UML 2.5.1 is a formal OMG standard with a normative machine-readable metamodel. This file records the abstract syntax as data, the relationship kinds and associations, the 14 diagram types, the keywords and the Standard Profile, and 579 rules (449 formal constraints and 130 prose rules). Other languages that reuse UML (profiles and extensions) name UML concepts exactly as this file does and point here. Operation body conditions in the machine-readable model (225) are definitions, not constraints, and are not listed. The semantics of clauses 9 to 11 and 16 were not read line by line beyond their constraints and notation.
# data_types and notation: added to meet the guide shape (2026-11-04). Facts are OMG UML 2.5.1 only; each carries its section.
data_types:
  coverage: full
  section: "21, 10.2, 8.2"
  note: The standard defines five primitive types in clause 21 (their literal forms are in 8.2.4), lets a model define more with DataType, PrimitiveType and Enumeration, and defines no units; the 13 enumerations of the metamodel itself are listed with their literals.
  types:
    - {name: "Boolean", kind: "primitive", section: "21.2", domain: "one of the predefined values true and false", literal: "the words true and false (8.2.4)"}
    - {name: "Integer", kind: "primitive", section: "21.2", domain: "a whole number from the infinite set of integers", literal: "a sequence of decimal digits (8.2.4)"}
    - {name: "Real", kind: "primitive", section: "21.2", domain: "a number from the infinite set of real numbers", literal: "decimal notation or scientific notation with e or E (8.2.4)"}
    - {name: "String", kind: "primitive", section: "21.2", domain: "a sequence of characters", literal: "characters between double quotes (8.2.4)"}
    - {name: "UnlimitedNatural", kind: "primitive", section: "21.2", domain: "a natural number (0, 1, 2 ...) or unlimited, written *; used for upper bounds such as multiplicities", literal: "digits, or an asterisk for unlimited (8.2.4)"}
    - {name: "PrimitiveType", kind: "other", section: "10.5.7", note: "the metaclass for defining further primitive types; no notation for the standard ones (21.3), a guillemet keyword primitive for new ones (10.2.4)"}
    - {name: "DataType", kind: "structured", section: "10.5.2", note: "a user-defined type whose instances are values without identity; it may own attributes and operations (10.2.4)"}
    - {name: "Enumeration", kind: "other", section: "10.5.3", note: "a user-defined type whose values are its named literals, each an EnumerationLiteral (10.2.4)"}
    # The 13 enumerations the metamodel uses for attribute types (values as in concepts.enumerations).
    - {name: VisibilityKind, kind: enumeration, values: ["public", "private", "protected", "package"], section: "7.8.24"}
    - {name: AggregationKind, kind: enumeration, values: ["none", "shared", "composite"], section: "9.9.1"}
    - {name: CallConcurrencyKind, kind: enumeration, values: ["sequential", "guarded", "concurrent"], section: "9.9.3"}
    - {name: ParameterDirectionKind, kind: enumeration, values: ["in", "inout", "out", "return"], section: "9.9.14"}
    - {name: ParameterEffectKind, kind: enumeration, values: ["create", "read", "update", "delete"], section: "9.9.15"}
    - {name: ConnectorKind, kind: enumeration, values: ["assembly", "delegation"], section: "11.8.12"}
    - {name: PseudostateKind, kind: enumeration, values: ["initial", "deepHistory", "shallowHistory", "join", "fork", "junction", "choice", "entryPoint", "exitPoint", "terminate"], section: "14.5.7"}
    - {name: TransitionKind, kind: enumeration, values: ["internal", "local", "external"], section: "14.5.12"}
    - {name: ObjectNodeOrderingKind, kind: enumeration, values: ["unordered", "ordered", "LIFO", "FIFO"], section: "15.7.24"}
    - {name: ExpansionKind, kind: enumeration, values: ["parallel", "iterative", "stream"], section: "16.14.21"}
    - {name: InteractionOperatorKind, kind: enumeration, values: ["seq", "alt", "opt", "break", "par", "strict", "loop", "critical", "neg", "assert", "ignore", "consider"], section: "17.12.15"}
    - {name: MessageKind, kind: enumeration, values: ["complete", "lost", "found", "unknown"], section: "17.12.20"}
    - {name: MessageSort, kind: enumeration, values: ["synchCall", "asynchCall", "asynchSignal", "createMessage", "deleteMessage", "reply"], section: "17.12.22"}
  attributes:
    coverage: every_concept
    where: concepts
    note: Each concept entry lists its own attributes under `attributes` (name, type, multiplicity, and default, derived, ordered or unique where the standard gives them). Properties that are association ends are not repeated there; they are in relationships.metamodel_associations (49 pin associations of clause 16 are not listed).
notation:
  coverage: normative
  section: "Annex A; the Notation subclauses (x.4) of clauses 7 to 20; 21.3"
  note: The standard gives a graphical notation for most concepts, as text and as figures, and treats it as the only graphical notation for activities and actions; it states no sizes or colors, and says tools may mix diagram kinds.
  # Each concept has exactly one entry: under elements (or a `see` pointing at its relationship entry), under relationships, or under not_specified.
  elements:
    Comment: {shape: "note symbol: rectangle with a folded upper-right corner", marker: "dashed line to each annotated element", label: "the body text inside", section: "7.2.4"}
    Constraint: {shape: "text in braces, either in a note symbol, next to a single element, after an element's text, or along a dashed line between two elements", marker: "none", label: "{ [name :] boolean-expression }", section: "7.6.4"}
    ElementImport: {same_as: "relationships: Element import", section: "7.4.4"}
    MultiplicityElement: {shape: "text lower..upper, in square brackets inside an attribute's text and bare next to an association end; 1 means 1..1 and * means 0..*", marker: "none", label: "optional {ordered|unordered, unique|nonunique} after it", section: "7.5.4"}
    PackageImport: {same_as: "relationships: Package import", section: "7.4.4"}
    TemplateBinding: {same_as: "relationships: Template binding", section: "7.3.4"}
    TemplateParameter: {shape: "small dashed rectangle at the upper right of the template element, listing the formal parameters", marker: "none", label: "name [: kind] [= default]", section: "7.3.4"}
    TemplateParameterSubstitution: {shape: "text name -> actual in the binding's label, or Template<name -> actual, ...> in the bound element's name", marker: "none", section: "7.3.4"}
    TemplateSignature: {shape: "small dashed rectangle at the upper right of the template element (it may be hidden but not empty)", marker: "none", section: "7.3.4"}
    TemplateableElement: {shape: "the element's own symbol with a small dashed rectangle at the upper right listing its template parameters", marker: "none", section: "7.3.4"}
    Duration: {shape: "text: its expression, or the name of its one observation", marker: "none", section: "8.4.4.2"}
    DurationConstraint: {shape: "annotation of its constrained elements in braces; the drawing depends on the diagram: a vertical double-headed arrow along a lifeline in a sequence diagram, a horizontal double-headed arrow above the timeline in a timing diagram", marker: "none", label: "the interval as text in braces, such as {d..3*d}", section: "8.5.4.2, 17.8.1, 17.11.2, Figure 17.28"}
    DurationInterval: {shape: "text min..max, each end a duration", marker: "none", section: "8.5.4.1"}
    DurationObservation: {shape: "straight line attached to the referenced element", marker: "none", label: "the observation name near the unattached end", section: "8.4.4.1"}
    Expression: {shape: "text: the symbol alone, or symbol(operand, operand, ...)", marker: "none", section: "8.3.4.1"}
    Interval: {shape: "text min..max", marker: "none", section: "8.5.4.1"}
    IntervalConstraint: {shape: "annotation of its constrained element using the constraint notation, with the interval as text", marker: "none", section: "8.5.4.2"}
    LiteralBoolean: {shape: "text: the word true or the word false", marker: "none", section: "8.2.4"}
    LiteralInteger: {shape: "text: decimal digits", marker: "none", section: "8.2.4"}
    LiteralNull: {shape: "text: often the word null; other forms depend on where it is used", marker: "none", section: "8.2.4"}
    LiteralReal: {shape: "text: decimal notation (optional sign, digits, optional dot and digits) or scientific notation (decimal notation, e or E, optional sign, digits)", marker: "none", section: "8.2.4"}
    LiteralSpecification: {shape: "text only; see the six literal kinds", marker: "none", section: "8.2.4"}
    LiteralString: {shape: "text: the characters between double quotes", marker: "none", section: "8.2.4"}
    LiteralUnlimitedNatural: {shape: "text: digits, or an asterisk for unlimited", marker: "none", section: "8.2.4"}
    Observation: {shape: "straight line attached to the referenced element", marker: "none", label: "the observation name near the unattached end", section: "8.4.4.1"}
    OpaqueExpression: {shape: "text: the body string, with the language name optionally shown in braces before it", marker: "none", section: "8.3.4.2"}
    StringExpression: {shape: "text: when it names an element, the name sits between $ signs, with an optional alias first", marker: "none", section: "7.4.4"}
    TimeConstraint: {shape: "a small line between the constrained element's symbol and the time interval written as text; in a timing diagram the interval follows a label in braces, such as OK {t..t+3}", marker: "none", section: "8.5.4.2, 17.11.2, Figure 17.28"}
    TimeExpression: {shape: "text: its expression, or the name of its one observation", marker: "none", section: "8.4.4.2"}
    TimeInterval: {shape: "text min..max, each end a time expression", marker: "none", section: "8.5.4.1"}
    TimeObservation: {shape: "straight line attached to the referenced element", marker: "none", label: "the observation name near the unattached end", section: "8.4.4.1"}
    Classifier: {shape: "solid-outline rectangle; the name centered and in bold in the top compartment; further compartments below, each set off by a horizontal line (attributes, then operations, then receptions); a suppressed compartment draws no separator line", marker: "none", label: "keyword in guillemets above the name for every metaclass except Class; an abstract classifier has its name in italics or {abstract} after it; inherited members start with ^; features may be grouped under left-justified public, private, protected headings with the features indented below; optional extra compartments for owned classifiers and constraints", section: "9.2.4.1, 9.2.4.2, Figures 9.2 and 9.3"}
    ClassifierTemplateParameter: {shape: "template parameter in the template's dashed rectangle", marker: "none", label: "name [: kind] [> constraint] [= default]; {contract} before the constraint when substitutable", section: "9.3.4"}
    GeneralizationSet: {same_as: "relationships: Generalization set", section: "9.7.4"}
    InstanceSpecification: {shape: "rectangle drawn like its classifier, with the name underlined", marker: "none", label: "name : Classifier[, Classifier]; an anonymous instance is a lone colon; slots as feature = value", section: "9.8.4"}
    InstanceValue: {shape: "text: the name of its instance, or the instance's own symbol", marker: "none", section: "9.8.4"}
    Operation: {shape: "line of text in the operations compartment", marker: "none", label: "[visibility] name ( parameters ) [: [return-type] [[multiplicity]] [{modifiers}]]; static operations underlined", section: "9.6.4"}
    OperationTemplateParameter: {shape: "template parameters in angle brackets between the name and the parameter list", marker: "none", section: "9.6.4"}
    Parameter: {shape: "text inside an operation's parentheses", marker: "none", label: "[direction] name : type [[multiplicity]] [= default] [{properties}]; direction in, out or inout, in by default", section: "9.4.4"}
    ParameterSet: {shape: "rectangle surrounding one or more pins, drawn around the pins of an action", marker: "none", label: "groups of flows shown as alternatives", section: "16.3.4.5"}
    Property: {shape: "line of text in the attributes compartment, or an association end", marker: "none", label: "[visibility] [/] name [: type] [[multiplicity]] [= default] [{modifiers}]; visibility + - # ~; modifiers readOnly, union, subsets x, redefines x, ordered, unordered, unique, nonunique, seq, id", section: "9.5.4"}
    RedefinableElement: {shape: "no symbol; redefinition is written as {redefines x} in the feature's text", marker: "none", section: "9.4.4"}
    RedefinableTemplateSignature: {shape: "small dashed rectangle at the upper right of the classifier, as for any template signature", marker: "none", section: "9.3.4"}
    Slot: {shape: "text feature = value inside the instance specification", marker: "none", section: "9.8.4"}
    StructuralFeature: {shape: "no symbol of its own; {readOnly} after the feature's text marks a read-only one", marker: "none", section: "9.4.4"}
    DataType: {shape: "classifier rectangle: «dataType» above the bold name, and below it a compartment listing attributes as name : Type (just the name when the type is only referenced)", marker: "none", section: "10.2.4, Figure 10.3"}
    Enumeration: {shape: "classifier rectangle", marker: "none", label: "«enumeration» above the name; one literal per line in a compartment below the operations compartment", section: "10.2.4"}
    EnumerationLiteral: {shape: "one line of text in the enumeration's literals compartment", marker: "none", section: "10.2.4"}
    Interface: {shape: "classifier rectangle with «interface» above the bold name; or, for a provided interface, a ball (small hollow circle) at the end of a solid line from the realizing classifier; or, for a required interface, a socket (half circle, curved side toward the end of the line, open side facing away) at the end of a solid line from the requiring classifier", marker: "none", label: "the interface name beside the ball or socket, with a caret before it when inherited; a dependency arrow may join a socket to a ball", section: "10.4.4, Figures 10.9, 10.10, 10.11"}
    InterfaceRealization: {same_as: "relationships: Interface realization", section: "10.4.4"}
    PrimitiveType: {shape: "small classifier rectangle holding only «primitive» above the bold name, with no other compartment", marker: "none", section: "10.2.4, Figure 10.2"}
    Reception: {shape: "line of text in the receptions compartment", marker: "none", label: "the keyword «signal» before the signal name", section: "10.3.4"}
    Signal: {shape: "classifier rectangle", marker: "none", label: "«signal» above the name; receptions in the receptions compartment", section: "10.3.4"}
    AssociationClass: {same_as: "relationships: Association class", section: "11.5.4"}
    Class: {shape: "classifier rectangle with four compartments: attributes, operations, receptions, internal structure; the last three may be hidden", marker: "an active class has an extra vertical bar inside each side", label: "no keyword; «Metaclass» for a metaclass; a constructor operation carries «Create»", section: "11.4.4"}
    Collaboration: {shape: "dashed ellipse with the name, optionally with an internal structure compartment; or a classifier rectangle with a keyword", marker: "none", label: "«collaboration» when drawn as a rectangle", section: "11.7.4"}
    CollaborationUse: {shape: "dashed ellipse inside the internal structure compartment", marker: "none", label: "occurrence : Collaboration; a dashed line per role binding", section: "11.7.4"}
    Component: {shape: "classifier rectangle", marker: "the component icon (two small rectangles on the left side) instead of or together with the keyword", label: "«component»; optional compartments for provided interfaces, required interfaces, realizations, artifacts and packaged elements", section: "11.6.4"}
    ComponentRealization: {same_as: "relationships: Component realization", section: "11.6.4"}
    ConnectableElementTemplateParameter: {shape: "template parameter in the template's dashed rectangle", marker: "none", label: "name [: kind] [= default]", section: "7.3.4"}
    ConnectorEnd: {shape: "the end of a connector line, with the same adornments as an association end", marker: "none", label: "multiplicity text; without one the end takes the role's multiplicity", section: "11.2.4"}
    Port: {shape: "small square on the border of the class rectangle or part box (inside it only when connected to inner elements)", marker: "none", label: "name and type inside or beside it as p : Type, with a tilde before the type for a conjugated port; provided interfaces as small hollow circles on short lines from the square, required interfaces as half circles, each labeled with the interface name; a behavior port has a line from the square to a small state symbol inside the classifier", section: "11.3.4, Figures 11.11 and 11.12"}
    StructuredClassifier: {shape: "class rectangle with a compartment headed internal structure (small centered text), below the operations compartment, holding part boxes and connectors; or the same drawn as a framed rectangle with the class name at the top", marker: "none", label: "part boxes with a solid outline when composite and a dashed outline when not, named role : Type [multiplicity]; the multiplicity may sit at the top right corner of the part box", section: "11.2.4, Figures 11.4 and 11.5"}
    ExtensionEnd: {shape: "adornment on the extension arrow, normally left out", marker: "none", label: "{required} near the end when isRequired; end multiplicity 0..1 or 1 may stand in for it", section: "12.3.4"}
    Image: {shape: "an icon in place of the element's box, or reduced inside it, or beside a line, or before the text form", marker: "replaces any default icon such as the actor stick figure", section: "12.3.4"}
    Model: {shape: "package symbol with a small triangle in the upper right corner (or in the tab), or a package symbol with a keyword", marker: "none", label: "«model»", section: "12.2.4"}
    Package: {shape: "large rectangle with a small tab at the upper left (folder symbol)", marker: "none", label: "name in the tab when members are drawn inside, otherwise in the large rectangle; members outside are joined by lines with a circled plus at the package end; + or - before member names; {uri = ...} after the name", section: "12.2.4"}
    PackageMerge: {same_as: "relationships: Package merge", section: "12.2.4"}
    Profile: {shape: "package symbol", marker: "none", label: "«profile»; metaclass and metamodel references as import arrows labeled «reference»", section: "12.3.4"}
    ProfileApplication: {same_as: "relationships: Profile application", section: "12.3.4"}
    Stereotype: {shape: "classifier rectangle", marker: "none", label: "«stereotype» above the name", section: "12.3.4"}
    AnyReceiveEvent: {shape: "text: the word all", marker: "none", label: "inside a trigger", section: "13.3.4"}
    CallEvent: {shape: "text: the name of the triggering operation, optionally followed by (assigned names)", marker: "none", label: "inside a trigger", section: "13.3.4"}
    ChangeEvent: {shape: "text: the word when followed by a Boolean expression", marker: "none", label: "inside a trigger", section: "13.3.4"}
    SignalEvent: {shape: "text: the name of the triggering signal, optionally followed by (assigned names)", marker: "none", label: "inside a trigger", section: "13.3.4"}
    TimeEvent: {shape: "text: after followed by a time expression (relative) or at followed by a time expression (absolute)", marker: "none", label: "inside a trigger", section: "13.3.4"}
    Trigger: {shape: "text on a transition: one or more events separated by commas", marker: "none", label: "a call, signal, any-receive, time or change event as above", section: "13.3.4"}
    ConnectionPointReference: {shape: "the entry or exit point symbol placed on the border of a submachine state", marker: "small circle (entry) or small circle with a cross (exit)", label: "name beside it", section: "14.2.4.7"}
    FinalState: {shape: "small filled circle inside a larger circle", marker: "none", section: "14.2.4.5"}
    ProtocolStateMachine: {shape: "the state machine graph, as for any state machine", marker: "none", label: "«protocol» close to the name", section: "14.4.4.1"}
    ProtocolTransition: {shape: "a transition arc as for any transition, without an effect", marker: "none", label: "a postcondition in brackets at the end of the label", section: "14.4.4.2"}
    Pseudostate: {shape: "initial: small filled circle; shallow history: circle containing H; deep history: circle containing H*; entry point: small hollow circle on the border; exit point: small circle with a cross on the border; junction: small filled circle; choice: diamond; terminate: a cross; fork and join: short heavy bar", marker: "none", label: "name beside entry and exit points", section: "14.2.4.6"}
    Region: {shape: "area of a composite state or state machine, separated from other regions by dashed lines; a solid line separates the state's text compartments from the regions", marker: "none", label: "optional region name", section: "14.2.4.3"}
    State: {shape: "rounded rectangle", marker: "none", label: "name; compartments for internal behaviors (entry / expr, exit / expr, do / expr) and internal transitions (trigger [guard] / effect); a submachine state is named state-name : machine; a small icon of two joined states marks a hidden decomposition", section: "14.2.4.4"}
    StateMachine: {shape: "a graph of states and other vertices joined by transitions, inside a frame with heading kind stm or without a frame", marker: "none", section: "14.2.4.2"}
    Activity: {shape: "round-cornered rectangle border (or a frame) holding the nodes and edges, with the name at the upper left; parameter nodes sit on the border", marker: "none", label: "«precondition» and «postcondition» notes; «singleExecution» inside; or drawn as a classifier rectangle with «activity»", section: "15.2.4"}
    ActivityEdge: {same_as: "relationships: Activity edge (control flow, object flow)", section: "15.2.4"}
    ActivityFinalNode: {shape: "solid circle inside a hollow circle", marker: "none", section: "15.3.4"}
    ActivityParameterNode: {shape: "object node rectangle placed overlapping the activity border", marker: "none", label: "the parameter in text form; {stream} for streaming; a small triangle for an exception parameter", section: "15.4.4.2"}
    ActivityPartition: {shape: "two parallel lines, horizontal or vertical, with the name in a box at one end (swimlane); or the name in parentheses above each node's name", marker: "none", label: "«external» for an external partition; a dimension is named alongside its partitions", section: "15.6.4.1"}
