  - {name: Relationship.targets, source: Relationship, target: CMMNElement, role: targets, kind: reference, multiplicity: {targets_per_source: 1..*}, section: '5.1.6, Table 5.13', note: 'Targets any addressable element, including elements of other models.'}
  - {name: Case.caseFileModel, source: Case, target: CaseFile, role: caseFileModel, kind: composition, multiplicity: {targets_per_source: '1', sources_per_target: '1'}, section: '5.2.1, Table 5.14', note: The schema allows 0..1 for interchange of incomplete models (9.1).}
